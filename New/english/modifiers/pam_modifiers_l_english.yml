 christian_fulfillment_level_3: "Penitent"
 christian_fulfillment_level_4: "Absolved"
 christian_fulfillment_level_5: "Settled"
 christian_fulfillment_level_6: "In Grace"

 default_fulfillment_level_0: "Adrift"
 default_fulfillment_level_1: "Searching"
 default_fulfillment_level_2: "Observant"
 default_fulfillment_level_3: "Devout"
 default_fulfillment_level_4: "At Peace"

 industrious_junior_members_modifier: "Industrious Novices"

 foolish_convert_modifier: "Foolish Convert"
 foolish_convert_modifier_desc: "This fool has rashly decided to convert to a [rite|E] with a vastly different system of belief, and is having a very hard time adjusting to their new spiritual life."
 reckless_convert_modifier: "Reckless Convert"
 reckless_convert_modifier_desc: "This person has decided to convert to a [rite|E] with a different system of belief without adequate preparation, and is having a hard time adjusting to their new spiritual life."
 informed_convert_modifier: "Informed Convert"
 informed_convert_modifier_desc: "This person has decided to convert to a [rite|E] with a different system of belief fully prepared to the new challenges this decision will bring."
 study_faith_learning_mannerism: "Learning the Mannerism"
 study_faith_learning_mannerism_desc: "Although less efficient, learning the mannerisms and external rituals tied to a [rite|E] may yield concrete results in the long run."
 study_faith_newfound_coherence: "Newfound Coherence"
 study_faith_newfound_coherence_desc: "The inconsistencies found so far in studying this [rite|E] proved to be a resource instead of a hindrance. By piecing together the differences between two systems of belief you have a better grasp of the true meaning behind the target's [core_tenets|E] and [doctrines|E]."
 study_faith_cautious_studies: "Cautious Studies"
 study_faith_cautious_studies_desc: "This [rite|E] is better studied at a lower pace, taking ample time to reframe uncomfortable takes into more digestible bites and get used to its alien way of thinking."
 study_faith_slow_and_steady: "Slow Learner"
 study_faith_slow_and_steady_desc: "This person was overwhelmed by the amount of unfamiliar practices they were exposed to, and the efforts made to digest the knowledge is taking a toll on their mental prowess."
 study_faith_cramming_side_studies: "Cramming Extra Hours"
 study_faith_cramming_side_studies_desc: "The student is so immersed in the inner workings of this [rite|E] that they are frequently found scribbling notes on their study... even when otherwise occupied."
 followers_of_dead_faith_scheme_modifier: "Knowledge lost to time"
 followers_of_dead_faith_scheme_modifier_desc: "The [faith|E] is no longer practiced openly, making it exceedingly difficult to find adherents."

 appealing_theology_modifier: "Appealing Theology"
 appealing_theology_modifier_desc: "This character has uncovered a foreign theological text they find particularly appealing."
 suspicions_of_heresy_modifier: "Suspicions of Heresy"
 suspicions_of_heresy_modifier_desc: "This character is often seen reading foreign theological texts, making others of their faith suspicious of their devotion."

 monastic_onslaught_modifier: "Monastic Foundations"
 monastic_onslaught_modifier_desc: "A monastic order, amply supported by a secular patron, drives local economic activity."

 pam_monastic_order_improvement_modifier: "Monastic Aid"
 pam_monastic_order_improvement_modifier_desc: "A monastic order assists this county with labour and counsel."

 pam_military_order_improvement_modifier: "Blessed Arms"
 pam_military_order_improvement_modifier_desc: "Warriors of the holy order train local levies and harden discipline in this county."

 pam_tithes_or_mercy_harsh_tithes_modifier: "Forced Tithes"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc: "Tithes were extracted harshly, leaving local communities bitter toward their overlord."
 pam_tithes_or_mercy_show_mercy_modifier: "Merciful Tithes"
 pam_tithes_or_mercy_show_mercy_modifier_desc: "Leniency in tax collection has improved trust and goodwill among local communities."

 pam_blissful_harmony_gospel_modifier: "Gospel of the Good Life"
 pam_blissful_harmony_gospel_modifier_desc: "The ruler's preaching celebrates peace, piety, and orderly living."

 pam_blissful_harmony_restless_ambition_modifier: "Restless Ambition"
 pam_blissful_harmony_restless_ambition_modifier_desc: "A moment of bliss, leaves this character restless for more."

 pam_stone_for_god_estate_build_discount_modifier: "Stone for God's House"
 pam_stone_for_god_estate_build_discount_modifier_desc: "This characters keen architect's eye made access to stone possible."

 pam_relocating_faithfuls_to_frontiers: "Relocate Faithfuls to Frontiers"
 pam_relocating_faithfuls_to_frontiers_desc: "This county encourages people of the same [rite|E] to move into a different [realm|E] to proselytize."
 pam_moving_faithfuls_to_frontiers: "Faithfuls Moving-in"
 pam_moving_faithfuls_to_frontiers_desc: "This county has people of different [faith|E] moving in and proselytize.\n#weak It makes the #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! [interaction|E] cheaper.#!"
 pam_building_new_shrines: "Building New Shrines"
 pam_building_new_shrines_desc: "This county has people of different [faith|E] moving in and building new shrines.\n #weak It makes the #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! [interaction|E] cheaper.#!"
 pam_grand_cathedral_started_modifier: "Started Grand Cathedral Construction"
 pam_grand_cathedral_started_modifier_desc: "This character has marshaled the resources necessary to begin construction on a Grand Cathedral. This generation-spanning project is already great evidence of their devotion to God."
 pam_grand_cathedral_completed_modifier: "Completed Grand Cathedral Construction"
 pam_grand_cathedral_completed_modifier_desc: "This character marshaled the resources necessary to complete the construction of a Grand Cathedral. This generation-spanning project is great evidence of their devotion to God."
 pam_grand_cathedral_02_started_modifier: "Expanded Grand Cathedral Construction"
 pam_grand_cathedral_02_started_modifier_desc: "This character has marshaled the resources to raise an existing Grand Cathedral to greater heights. This generation-spanning project is great evidence of their devotion to God."
 pam_grand_cathedral_02_completed_modifier: "Completed Grand Cathedral Expansion"
 pam_grand_cathedral_02_completed_modifier_desc: "This character oversaw the expansion of a Grand Cathedral."
 pam_grand_cathedral_family_contributed_south_modifier: "Funded a Grand Cathedral Chapel"
 pam_grand_cathedral_family_contributed_south_modifier_desc: "This dynasty had a member fund the building of a chapel for a Grand Cathedral. This generation-spanning project is great evidence of their devotion to God."
 pam_grand_cathedral_family_contributed_north_modifier: "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc: "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_cathedral_founder_crypt_modifier: "Cathedral Crypt Patron"
 pam_cathedral_founder_crypt_modifier_desc: "This character funded a crypt for their dynasty beneath a Grand Cathedral."
 pam_cathedral_bell_cracked_lesson_modifier: "Lessons of the Cracked Bell"
 pam_cathedral_bell_cracked_lesson_modifier_desc: "Masons in this county work more judiciously to compensate for the shame of a failed bell casting."
 pam_cathedral_bell_bronze_torture_implements_modifier: "Bronze Torture Implements"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc: "Scrap bronze from a miscast cathedral bell was recast into instruments of terror, and the bell-founder was their first victim."
 pam_cathedral_treadwheel_crane_modifier: "Treadwheel Crane"
 pam_cathedral_treadwheel_crane_modifier_desc: "A massive treadwheel crane from a cathedral construction site has been erected at the capital."
 pam_cathedral_cantoria_scam_modifier: "Exposed Ruse"
 pam_cathedral_cantoria_scam_modifier_desc: "Having exposed a fraudulent ruse, builders work with renewed thrift and haste."
 pam_cathedral_famed_choir_boy_modifier: "Angelic Voice at Court"
 pam_cathedral_famed_choir_boy_modifier_desc: "A choir boy of unearthly voice lends grace to this court."
 pam_cathedral_sermon_peace_county_modifier: "Sermon of Peace"
 pam_cathedral_sermon_peace_county_modifier_desc: "A ruler's preaching at a new cathedral portal has left this county more content, and pilgrims may travel its roads with greater safety."
 pam_cathedral_sermon_peace_ruler_modifier: "Shepherded Toward Peace"
 pam_cathedral_sermon_peace_ruler_modifier_desc: "This ruler was moved by a cathedral sermon on Christ's peace."
 pam_cathedral_sermon_diligence_county_modifier: "Sermon of Diligence"
 pam_cathedral_sermon_diligence_county_modifier_desc: "A ruler's preaching at a new cathedral portal has spurred church builders and masons to industrious work."
 pam_cathedral_sermon_diligence_ruler_modifier: "Shepherded Toward Industry"
 pam_cathedral_sermon_diligence_ruler_modifier_desc: "This ruler was moved by a cathedral sermon on godly labor."
 pam_cathedral_sermon_unity_county_modifier: "Sermon of Unity"
 pam_cathedral_sermon_unity_county_modifier_desc: "A ruler's preaching at a new cathedral portal has steadied communal obedience in this county."
 pam_cathedral_sermon_unity_ruler_modifier: "Shepherded Toward Concord"
 pam_cathedral_sermon_unity_ruler_modifier_desc: "This ruler was moved by a cathedral sermon on Christian fellowship."
 pam_cathedral_sermon_charity_county_modifier: "Sermon of Charity"
 pam_cathedral_sermon_charity_county_modifier_desc: "A ruler's preaching at a new cathedral portal has loosened purse-strings and warmed hearts in this county."
 pam_cathedral_sermon_charity_ruler_modifier: "Shepherded Toward Charity"
 pam_cathedral_sermon_charity_ruler_modifier_desc: "This ruler was moved by a cathedral sermon on open-handed mercy."
 pam_cathedral_sermon_perseverance_county_modifier: "Sermon of Perseverance"
 pam_cathedral_sermon_perseverance_county_modifier_desc: "A ruler's preaching at a new cathedral portal has renewed pious striving and orderly growth in this county."
 pam_cathedral_sermon_perseverance_ruler_modifier: "Shepherded Toward Zeal"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc: "This ruler was moved by a cathedral sermon on running the race of faith."
 pam_cathedral_sermon_rejoice_county_modifier: "Sermon of Rejoicing"
 pam_cathedral_sermon_rejoice_county_modifier_desc: "A ruler's preaching at a new cathedral portal has lifted the faithful with hope in the Lord's unfailing love."
 pam_cathedral_sermon_rejoice_ruler_modifier: "Shepherded Toward Joy"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc: "This ruler was moved by a cathedral sermon on rejoicing in the Lord."
 pam_cardinal_order_improve_development_modifier: "Improve Development Cardinal Order"
 pam_cardinal_order_improve_development_modifier_desc: "At their superior's command, a Cardinal works to foster development within the local Archdiocese."
 pam_cardinal_order_convert_faith_modifier: "Convert Faith Cardinal Order"
 pam_cardinal_order_convert_faith_modifier_desc: "At their superior's command, a Cardinal works to bolster conversion within the local Archdiocese and bordering lands.\n\n$EFFECT_LIST_BULLET$[convert_county|E] in this [county|E]: #P +25%#!"
 pam_cardinal_order_increase_control_modifier: "Increase County Control Cardinal Order"
 pam_cardinal_order_increase_control_modifier_desc: "At their superior's command, a Cardinal works to pacify the populace within the local Archdiocese."
 pam_cardinal_order_accelerate_cultural_fascination_modifier: "Accelerate Cultural Fascination Order"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc: "At their superior's command, a Cardinal works to accelerate the research of new technologies."
 pam_cardinal_order_improve_epidemic_resistance_modifier: "Improve Plague Resistance Cardinal Order"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc: "At their superior's command, a Cardinal marshals the resources of the Church to aid in plague mitigation."
 pam_cardinal_order_improve_legitimacy_modifier: "Improve Legitimacy Cardinal Order"
 pam_cardinal_order_improve_legitimacy_modifier_desc: "At their superior's command, a Cardinal works to bolster the legitimacy of rulers in the local Archdiocese."
 pam_cardinal_order_undermine_legitimacy_modifier: "Undermine Legitimacy Cardinal Order"
 pam_cardinal_order_undermine_legitimacy_modifier_desc: "At their superior's command, a Cardinal works to undermine the legitimacy of rulers in the local Archdiocese."
 heathen_mandate_modifier: "Heathens Preaching Legitimacy"
 heathen_mandate_modifier_desc: "A heathen ruler's holy men claim the souls of this land, detestable claims backed by their false faith."

 pam_recently_baptized_at_domicile_modifier: "Recently Baptized"
 pam_recently_baptized_at_domicile_modifier_desc: "This character was christened in the Baptistery of their Archdiocese's Cathedral Complex."

 pam_khachkar_ancestral_county: "Ancestral Khachkar"
 pam_khachkar_ancestral_county_custom_desc: "Raised for [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstNameNicknamed] by [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetHerHis] [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('RelationToMeShort', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)]"

 pam_denied_new_pope_modifier: "Denied the New Pope"
 pam_denied_new_pope_modifier_desc: "This character has refused to recognize the newly elected Pope."

 # Veneration of Saints (Dulia) - relic blessings (one is rolled onto each relic drawn by a Dulia faith)
 pam_dulia_relic_piety_level_impact_modifier: "Sanctified Standing"
 pam_dulia_relic_piety_per_dread_modifier: "Aura of the Martyr"
 pam_dulia_relic_piety_per_knight_modifier: "Blessing of the Host"
 pam_dulia_relic_stress_loss_per_piety_modifier: "Consoling Grace"
 pam_dulia_relic_piety_per_legitimacy_modifier: "Anointed by the Saints"
 pam_dulia_relic_learning_per_piety_modifier: "Illuminated Devotion"
 pam_dulia_relic_monthly_piety_modifier: "Wellspring of Grace"

 # Ecumenical Council rite quarrels
 pam_ecumenical_council_creed_arbiter_modifier: "Arbiter of the Creed"
 pam_ecumenical_council_creed_arbiter_modifier_desc: "This character settled a quarrel over the wording of the Creed before an Ecumenical Council had even opened its debates."
 pam_ecumenical_council_primacy_upheld_modifier: "Primacy Upheld"
 pam_ecumenical_council_primacy_upheld_modifier_desc: "This character was asked in open council whose office the churches of the faith answer to, and settled the question from the chair."

 # Veneration of Saints (Dulia) - shared by the whole faith for a few years after each canonization
 pam_dulia_new_saint_modifier: "A New Intercessor"
 pam_dulia_new_saint_modifier_desc: "This character is inspired by the recent proclamation of a new saint."

 # The Pentarchy - granted for completing a pilgrimage to every holy site of one's own faith
 pam_pilgrim_of_every_holy_site_modifier: "Pilgrim of Every Seat"
 pam_pilgrim_of_every_holy_site_modifier_desc: "This character has stood vigil in every holy site of their faith."

 # Harmonious Society - one instance for each of the five relationships currently kept in good standing
 tenet_harmonious_society_five_bonds_modifier: "A Bond Kept"
 tenet_harmonious_society_five_bonds_modifier_desc: "Ruler and subject, parent and child, husband and wife, elder and younger, friend and friend. This character keeps one of these five relationships in good order."

 # Apostolic Succession - scales with the ruler's theocratic vassals, retallied yearly
 tenet_apostolic_succession_episcopate_modifier: "Chain of Ordination"
 tenet_apostolic_succession_episcopate_modifier_desc: "This character's faith ordains each bishop through an unbroken line of earlier bishops: a historic source of honored legitimacy."
 modifier_definition_value_per_theocratic_vassal: "\t#weak Increase per [theocratic_vassal|E] (max [EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')])#!"

 # Divine Liturgy - scales with the temples the character holds, retallied yearly
 tenet_divine_liturgy_choirs_modifier: "Choirs of the Faithful"
 tenet_divine_liturgy_choirs_modifier_desc: "This character's churches sing the same words at the same hours, unchanged for generations."
 modifier_definition_value_per_held_temple: "\t#weak Increase per held [temple_holding|E] (max [EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')])#!"

 # Divine Liturgy personal tenet - scales with the court chaplain's learning, retallied yearly
 tenet_divine_liturgy_officiant_modifier: "Worthily Officiated"
 tenet_divine_liturgy_officiant_modifier_desc: "This character takes the Divine Liturgy of their faith extremely seriously."
 tenet_divine_liturgy_schola_cantorum_modifier: "Schola Cantorum"
 tenet_divine_liturgy_schola_cantorum_modifier_desc: "A liege who keeps a school of sacred song keeps a liturgist worth hearing."
 tenet_pentarchy_holy_site_modifier: "Patriarchal See"
 tenet_pentarchy_holy_site_modifier_desc: "This county's holy site flourishes under the stewardship of the faithful."
 tenet_polyamory_new_beloved_modifier: "Radiant with New Love"
 tenet_polyamory_new_beloved_modifier_desc: "A new beloved has this character walking on air."
 modifier_definition_value_per_chaplain_learning: "\t#weak Increase per point of [court_chaplain|E] [learning|E] (max [EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')])#!"

 # Purgatory - one instance for each sinful trait the character currently carries
 tenet_purgatory_sin_penalty_modifier: "Debt of Punishment"
 tenet_purgatory_sin_penalty_modifier_desc: "A sin confessed is a sin forgiven, but the debt of punishment it incurred is not thereby cancelled. What is not paid down in this life is exacted in the next, and the faithful can see well enough which of the two this character has chosen."
 tenet_original_sin_sinners_insight_modifier: "Sinner's Insight"
 tenet_original_sin_sinners_insight_modifier_desc: "Whoever carries the weight of sin knows exactly where it hides in others."

 # Holy weapons - each tier is earned by winning further battles against another religion while equipped
 pam_holy_weapon_1_artifact_modifier: "Blooded"
 pam_holy_weapon_1_artifact_modifier_desc: "This [holy_relic|E] has been carried to victory against the enemies of its [faith|E]. The devout have begun to take notice of it."
 pam_holy_weapon_2_artifact_modifier: "Proven in War"
 pam_holy_weapon_2_artifact_modifier_desc: "So many battles won against other [religions|E] that the faithful no longer call it luck."
 pam_holy_weapon_3_artifact_modifier: "Renowned Relic"
 pam_holy_weapon_3_artifact_modifier_desc: "Its name travels ahead of it. The zealous take heart at the sight of it."
 pam_holy_weapon_4_artifact_modifier: "Instrument of Providence"
 pam_holy_weapon_4_artifact_modifier_desc: "Its bearer is believed to do the will of their god, and the riders around them strike the harder for it."

 # Challenge Head of Faith war aftermath
 pam_house_schismatic_sponsor_modifier: "Schismatic Patron"
 pam_house_schismatic_sponsor_modifier_desc: "This house backed a failed [challenger_hof|E]."
 pam_house_martyred_pontiff_modifier: "House Martyr"
 pam_house_martyred_pontiff_modifier_desc: "A member of this house died after a war over the [head_of_faith|E]."
 pam_deposed_pontiff_modifier: "Deposed Head of Faith"
 pam_deposed_pontiff_modifier_desc: "This character was deposed as the [head_of_faith|E]."
 pam_ch_hof_sacred_bloodguilt_modifier: "Bloodguilt"
 pam_ch_hof_sacred_bloodguilt_modifier_desc: "This character killed someone in a war over the [head_of_faith|E]."
 pam_ch_hof_penitent_road_modifier: "Vow of Penance"
 pam_ch_hof_penitent_road_modifier_desc: "This character has sworn to do penance after being judged in a war over the [head_of_faith|E]."
 pam_blessed_passing_modifier: "Blessed Passing"
 pam_blessed_passing_modifier_desc: "This character's predecessor gave their life in a sanctified death, and its grace rests upon them."
