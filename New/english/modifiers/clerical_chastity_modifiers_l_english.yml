l_english:
 clerical_chastity_vow_modifier: "Clerical Vow of Chastity"
 clerical_chastity_vow_modifier_desc: "This character was pressed into a promise of chastity by a priest, not by free choice. While the vow holds they cannot begin a seduction or a courtship."
 clerical_chastity_renounced_vow_clergy_disapproval_modifier: "Broken Sacred Promise"
 clerical_chastity_renounced_vow_clergy_disapproval_modifier_desc: "Having renounced a public vow of chastity, this character is viewed with suspicion by the [clergy|E]."
