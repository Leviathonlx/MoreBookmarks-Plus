 setting_empire_faith_gate_off: "Disabled"
 setting_empire_faith_gate_on_desc: "Requires an [organized|E] [faith|E] and [head_of_faith|E]'s approval to create [empire|E] [titles|E]. Affects [feudal|E], [clan|E], and [tribal|E] [rulers|E]."
 setting_empire_faith_gate_no_hof_exempt_desc: "Requires an [organized|E] [faith|E] and [head_of_faith|E]'s approval to create [empire|E] [titles|E], but [faiths|E] without a [head_of_faith|E] are exempt from the approval requirement. Affects [feudal|E], [clan|E], and [tribal|E] [rulers|E]."
 setting_empire_faith_gate_off_desc: "Anyone can create [empire|E] [titles|E] with regular requirements."


 empire_faith_gate_organized_faith_required: "Your [faith|E] must be [organized|E] to create an [empire|E]"

