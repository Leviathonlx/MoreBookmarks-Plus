 empire_faith_gate.0002.t: "The True Emperor"
 empire_faith_gate.0002.desc: "[efg_primary_rival.GetShortUIName] lays claim to imperial dignity that should be mine alone. If I let this stand, the faithful will soon doubt my [legitimacy|E]."
 empire_faith_gate.0002.a: "Spread the word. [efg_primary_rival.GetHerHis|U] empire will not outlast mine."
 empire_faith_gate.0002.b: "Our faith has but one true Emperor. Me."
 empire_faith_gate.0002.c: "I will strike when the moment is right."
 efg_contested_wrath: "Knightly Propaganda"
 efg_contested_wrath_desc: "Using our knights to prostelyze our imperial legitimacy against a rival emperor fuels our warriors and earns the respect of the masses."
 efg_divine_mandate: "Divine Claims"
 efg_divine_mandate_desc: "Proclaiming a divine authority above all earthly rivals, the faithful rally to us."
 efg_contested_patience: "Patient Consolidation"
 efg_contested_patience_desc: "Turning our attention inward, our realm grows stronger while we await the right moment to strike."
