 action_efg_request_excommunication_combined_group_label: "@hof_icon! There are too many empires of your faith"
 action_efg_request_excommunication_combined_group_description: "Several rival [emperors|E] of your [faith|E] are challenging your claim to be the one true [emperor|E].\n\n#help Ask your [head_of_faith|E], [secondary_recipient.GetShortUIName], to excommunicate them. An [excommunicated|E] emperor can be attacked with the [dissolve_empire_casus_belli|E], allowing you to destroy their [empire|E].#!"

