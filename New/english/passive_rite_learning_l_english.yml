l_english:
 msg_passive_learned_rite: "Rite Learned: [LEFT_CHARACTER.GetRite.GetNameNoTooltip]"
 msg_passive_learned_rite_desc: "After long observation of your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip], you have gained [agnostic_knowledge|E] of the [core_tenets|E] and [doctrines|E] of the [passive_learn_source.GetRite.GetName] [rite|E]."

 msg_passive_learned_tenet: "Tenet Learned: [RIGHT_TENET.GetBaseNameNoTooltip]"
 msg_passive_learned_tenet_desc: "Watching your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] practice the [passive_learn_tenet.GetBaseName] [core_tenet|E] of the [passive_learn_source.GetRite.GetName] [rite|E], you have gained [agnostic_knowledge|E] of it yourself."
  msg_passive_learned_tenet_special: "$msg_passive_learned_tenet$"
 msg_passive_learned_tenet_special_desc: "$msg_passive_learned_tenet_desc$"
 msg_passive_learned_tenet_cranial_trophies_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] keeps the [passive_learn_tenet.GetBaseName] [core_tenet|E], and through them you have gained [agnostic_knowledge|E] of its grim purpose."
 msg_passive_learned_tenet_ritual_cannibalism_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] honors the [passive_learn_tenet.GetBaseName] [core_tenet|E], and you have gained [agnostic_knowledge|E] of it on their terms."
 msg_passive_learned_tenet_human_sacrifice_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] has performed the [passive_learn_tenet.GetBaseName] [core_tenet|E] in your presence, and you have gained [agnostic_knowledge|E] of it."
 msg_passive_learned_tenet_warmonger_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] lives by the [passive_learn_tenet.GetBaseName] [core_tenet|E], and you have gained [agnostic_knowledge|E] of its logic."
 msg_passive_learned_tenet_takamin_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] practices the [passive_learn_tenet.GetBaseName] [core_tenet|E] daily, and you have gained [agnostic_knowledge|E] of its rhythms."
 msg_passive_learned_tenet_exaltation_of_pain_desc: "Observing your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E], you have gained [agnostic_knowledge|E] of the [passive_learn_tenet.GetBaseName] [core_tenet|E] - however unsettling."
 msg_passive_learned_tenet_sacrificial_ceremonies_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] has walked you through the [passive_learn_tenet.GetBaseName] [core_tenet|E] step by step, and you have gained [agnostic_knowledge|E] of it."
 msg_passive_learned_tenet_gruesome_festivals_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] has shown you the [passive_learn_tenet.GetBaseName] [core_tenet|E] in all its spectacle, and you have gained [agnostic_knowledge|E] of it."
 msg_passive_learned_tenet_adorcism_desc: "Watching your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E], you have gained [agnostic_knowledge|E] of the [passive_learn_tenet.GetBaseName] [core_tenet|E] on their terms."
 msg_passive_learned_tenet_hedonistic_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] revels in the [passive_learn_tenet.GetBaseName] [core_tenet|E], and you have gained [agnostic_knowledge|E] of its appeal."

 msg_passive_learned_doctrine: "Doctrine Learned: [RIGHT_DOCTRINE.GetDescriptiveNameNoTooltip( GetPlayer.GetFaith )]"
 msg_passive_learned_doctrine_desc: "Watching your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] live by the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E] of the [passive_learn_source.GetRite.GetName] [rite|E], you have gained [agnostic_knowledge|E] of it yourself."
 msg_passive_learned_doctrine_polygamy_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] lives by the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E], and you have gained [agnostic_knowledge|E] of its workings."
 msg_passive_learned_doctrine_concubines_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] keeps to the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E], and you have gained [agnostic_knowledge|E] of its reasoning."
 msg_passive_learned_doctrine_consanguinity_unrestricted_desc: "Observing your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E], you have gained [agnostic_knowledge|E] of the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E], and it no longer seems as strange as it once did."
 msg_passive_learned_doctrine_deviancy_virtuous_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] practices the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E] openly, and you have gained [agnostic_knowledge|E] of it on their terms."
 msg_passive_learned_doctrine_kinslaying_accepted_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] has taught you the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E] - a chilling lesson, and you have gained [agnostic_knowledge|E] of it."
 msg_passive_learned_doctrine_witchcraft_virtuous_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] holds the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E] close, and through them you have gained [agnostic_knowledge|E] of it."
 msg_passive_learned_doctrine_funeral_sky_burial_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] observes the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E], and you have gained [agnostic_knowledge|E] of its meaning."
 msg_passive_learned_doctrine_funeral_mummification_desc: "Your [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] of the [passive_learn_source.GetRite.GetName] [rite|E] keeps the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E], and you have gained [agnostic_knowledge|E] of its ways."

