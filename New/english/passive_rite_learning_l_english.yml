 ### HoR passive learning
 msg_hor_learned_tenet_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], your study of the neighbouring [passive_learn_source_faith.GetAdjective] [faith|E] has given you [agnostic_knowledge|E] of the [passive_learn_tenet.GetBaseName] [core_tenet|E]."
 msg_hor_learned_doctrine_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], your study of the neighbouring [passive_learn_source_faith.GetAdjective] [faith|E] has given you [agnostic_knowledge|E] of the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] [doctrine|E]."
 
 msg_hor_learned_tenet_cranial_trophies_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have studied the [passive_learn_tenet.GetBaseName] [core_tenet|E] of the [passive_learn_source_faith.GetAdjective] [faith|E] and recorded its grim purpose, gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_tenet_ritual_cannibalism_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have observed the [passive_learn_tenet.GetBaseName] [core_tenet|E] of the [passive_learn_source_faith.GetAdjective] [faith|E] on its own terms, gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_tenet_human_sacrifice_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have catalogued the [passive_learn_tenet.GetBaseName] [core_tenet|E] practiced by the [passive_learn_source_faith.GetAdjective] [faith|E], gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_tenet_warmonger_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have studied how the [passive_learn_source_faith.GetAdjective] [faith|E] turns the [passive_learn_tenet.GetBaseName] [core_tenet|E] into practice, gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_tenet_takamin_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have learned the daily rhythms of the [passive_learn_tenet.GetBaseName] [core_tenet|E] from the [passive_learn_source_faith.GetAdjective] [faith|E], gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_tenet_exaltation_of_pain_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], your study of the [passive_learn_source_faith.GetAdjective] [faith|E] has taught you the [passive_learn_tenet.GetBaseName] [core_tenet|E] - however unsettling - and you have gained [agnostic_knowledge|E] of it."
 msg_hor_learned_tenet_sacrificial_ceremonies_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have charted the [passive_learn_tenet.GetBaseName] [core_tenet|E] of the [passive_learn_source_faith.GetAdjective] [faith|E] step by step, gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_tenet_gruesome_festivals_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have witnessed the [passive_learn_tenet.GetBaseName] [core_tenet|E] of the [passive_learn_source_faith.GetAdjective] [faith|E] in full spectacle, gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_tenet_adorcism_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have observed how the [passive_learn_source_faith.GetAdjective] [faith|E] inhabits the [passive_learn_tenet.GetBaseName] [core_tenet|E], gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_tenet_hedonistic_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], your study of the [passive_learn_source_faith.GetAdjective] [faith|E] has revealed the appeal of the [passive_learn_tenet.GetBaseName] [core_tenet|E] to you, gaining [agnostic_knowledge|E] of it."
 
 msg_hor_learned_doctrine_polygamy_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have studied how the [passive_learn_source_faith.GetAdjective] [faith|E] orders its households under the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] [doctrine|E], gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_doctrine_concubines_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have learned how the [passive_learn_source_faith.GetAdjective] [faith|E] reasons about the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] [doctrine|E], gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_doctrine_consanguinity_unrestricted_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], your reading of the [passive_learn_source_faith.GetAdjective] [faith|E] has made the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] [doctrine|E] no longer foreign to you, and you have gained [agnostic_knowledge|E] of it."
 msg_hor_learned_doctrine_deviancy_virtuous_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have observed how openly the [passive_learn_source_faith.GetAdjective] [faith|E] practices the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] [doctrine|E], gaining [agnostic_knowledge|E] of it on their terms."
 msg_hor_learned_doctrine_kinslaying_accepted_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have parsed - with no small amount of unease - how the [passive_learn_source_faith.GetAdjective] [faith|E] justifies the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] [doctrine|E], gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_doctrine_witchcraft_virtuous_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have studied how the [passive_learn_source_faith.GetAdjective] [faith|E] holds the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] [doctrine|E] close, gaining [agnostic_knowledge|E] of it."
 msg_hor_learned_doctrine_funeral_sky_burial_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have observed the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] [doctrine|E] as the [passive_learn_source_faith.GetAdjective] [faith|E] practices it, gaining [agnostic_knowledge|E] of its meaning."
 msg_hor_learned_doctrine_funeral_mummification_desc: "As Head of the [passive_learn_hor.GetRite.GetName] [rite|E], you have studied the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] [doctrine|E] as the [passive_learn_source_faith.GetAdjective] [faith|E] practices it, gaining [agnostic_knowledge|E] of its ways."
