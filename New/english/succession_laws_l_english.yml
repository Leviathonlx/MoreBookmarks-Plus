l_english: 
 succession_order_laws:0 "[succession_laws|E]"
 succession_order_laws_singular:0 "[succession_law|E]"
 partition_succession_law:1 "Partition"
 partition_succession_law_subname:0 "All Children Inherit Equally"
 partition_succession_law_effects:1 "\nUnder $partition_succession_law$ [succession|E], your [titles|E] will be divided equally between your children.\n\n#weak $partition_base_desc$#!"
 partition_base_desc:2 "#weak Upon succession, all [titles|E] held by the late [ruler|E] will be divided amongst their [eligible_children|E], with the [player_heir|E] always being given the [primary_title|E], [realm_capital|E] and any direct [de_jure|E] titles associated with it.\n\nYounger children will be given Titles starting with those of the same [rank|E] as the Primary Title; if none are available they will be given lower-ranking Titles. Your Player Heir cannot be preemptively granted Titles they do not stand to inherit.\n#!"
 high_partition_succession_law:1 "High Partition"
 high_partition_succession_law_subname:0 "All Children Inherit"
 high_partition_succession_law_effects:2 "\nUnder $high_partition_succession_law$ [succession|E], the lion's share of [titles|E] will go to your [player_heir|E] – the rest will be divided between your children.\n\n#weak $partition_base_desc$\nThe Player Heir will #emp always#! inherit at least half of the late Ruler's Titles.\n#!"
 confederate_partition_succession_law:1 "Confederate Partition"
 confederate_partition_succession_law_subname:0 "All Children Inherit Equally"
 confederate_partition_succession_law_effects:2 "\nUnder $confederate_partition_succession_law$, your [titles|E] will be divided equally between your children. New Titles may be created for younger [realm_heirs|E].\n\n#weak $partition_base_desc$\nYounger children will have Titles created for them, if enough land is held.\n\n#!#X Tribal rulers are locked to this succession type.#!\n"
 single_heir_succession_law:4 "Primogeniture"
 single_heir_succession_law_subname:0 "Oldest Child Inherits"
 single_heir_succession_law_effects:1 "\nUnder $single_heir_succession_law$ [succession|E], your oldest child inherits all your [titles|E].\n\n#weak Upon succession, all of the late Ruler's [titles|e] will be given to the [player_heir|E], which is their oldest [eligible_child|E]. Younger children will receive nothing.\n#!"
 single_heir_succession_law_youngest:4 "Ultimogeniture"
 single_heir_succession_law_youngest_subname:0 "Youngest Child Inherits"
 single_heir_succession_law_youngest_effects:1 "\nUnder $single_heir_succession_law_youngest$ [succession|E], your youngest child inherits all your [titles|E].\n\n#weak Upon succession, all of the late Ruler's [titles|e] will be given to the [player_heir|E], which is their youngest [eligible_child|E]. Older children will receive nothing.\n#!"
 single_heir_dynasty_house:1 "House Seniority"
 single_heir_dynasty_house_subname:0 "Oldest [house] Member Inherits"
 single_heir_dynasty_house_effects:1 "\nUnder $single_heir_dynasty_house$ [succession|E], the oldest member of your [house|E] will inherit all your titles.\n\n#weak Upon succession, all of the late Ruler's [titles|e] will be given to the oldest eligible member of their [house|E]. Your children will not be given anything, unless one of them happens to be the oldest House member.\n#!"
 same_faith_theocratic_succession_law:0 "Same Faith"
 same_faith_theocratic_succession_law_effects:0 "Only characters of the same [faith|E] as the current [ruler|E] can inherit."
 same_faith_only_law:0 "$same_faith_theocratic_succession_law$"
 same_faith_only_law_effects:0 "$same_faith_theocratic_succession_law_effects$"
 bishop_theocratic_succession_law:1 "Theocratic"
 bishop_theocratic_succession_law_effects:0 "Upon succession all of the [realm_priest_possessive|E] [titles|e] will be given to their successor. The doctrines of their [faith|E] determine who this successor will be."
 temporal_head_of_faith_succession_law:0 "Temporal Theocratic"
 temporal_head_of_faith_succession_law_effects:0 "The [temporal_head_of_faith|E] [title|E] will be given to the [player_heir|E] of the current [head_of_faith|E]."
 succession_laws_must_not_be_temporal:0 "Must not be a [temporal_head_of_faith|E] [title|E]."
 holy_order_succession_law:1 "Military Order"
 holy_order_succession_law_effects:0 "Upon succession all of the Grandmaster's [titles|e] will be given to their successor, who is generally the [knight|E] with the highest [martial|E] skill."
 cultural_holy_order_succession_law: "Cultural Military Order"
 cultural_holy_order_succession_law_effects: "Upon succession all of the Grandmaster's [titles|e] will be given to their successor, who is generally the [knight|E] with the highest [martial|E] skill and matching [heritage|E]."
 monastic_holy_order_succession_law: "Monastic Order"
 monastic_holy_order_succession_law_effects: "Upon succession all of the Archabbot's [titles|e] will be given to their successor, who is generally the [courtier|E] with the highest [learning|E] skill. Only characters of the same [rite|E] as the current [ruler|E] can inherit."
 female_monastic_holy_order_succession_law: "Female Monastic Order"
 female_monastic_holy_order_succession_law_effects: "Upon succession all of the Archabbesses' [titles|e] will be given to her successor, who is generally the female [courtier|E] with the highest [learning|E] skill. Only characters of the same [rite|E] as the current [ruler|E] can inherit."
 male_monastic_holy_order_succession_law: "Male Monastic Order"
 male_monastic_holy_order_succession_law_effects: "Upon succession all of the Archabbots' [titles|e] will be given to his successor, who is generally the male [courtier|E] with the highest [learning|E] skill. Only characters of the same [rite|E] as the current [ruler|E] can inherit."
 mercenary_company_succession_law:1 "Mercenary Company"
 mercenary_company_succession_law_effects:0 "Upon succession all of the Captain's [titles|e] will be given to their successor, who is generally the [knight|E] with the highest [martial|E] skill."
 city_succession_law:1 "Republican"
 city_succession_law_effects:0 "Upon succession all of the ruler's [titles|e] will be given to their successor."
 herder_succession_law: "Herder Succession"
 herder_succession_law_effects: "Upon succession all of the ruler's [titles|e] will be given to their successor."
