l_english:
 WAR_DECLARED_OVERVIEW_DISMISS:0 "Rally the troops!"
 #WAR_DECLARED_OVERVIEW_DISMISS_TOOLTIP:1 "" delete this
 WAR_DECLARED_OVERVIEW_FLAVOR:0 "[WAR.Custom('WarDeclaredOpening')][WAR.Custom('WarDeclaredFlavor')]"

 war_declared_opening.neutral:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateGreeting',ROOT.War.GetActiveCB.GetDefender)]\n\n"
 war_declared_opening.negative:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateGreetingNegative',ROOT.War.GetActiveCB.GetDefender)]\n\n"

 war_declared_flavor.zealous:0 "Your wicked deeds have gone unpunished for far too long. That changes today, for I have come to deliver holy retribution upon you! [ROOT.War.GetActiveCB.GetAttacker.Custom('ZealousDoW')]"
 war_declared_flavor.zealous.mercifulgod:2 "[ROOT.Char.GetFaith.HighGodName] have mercy on you, for I shall grant you none!"
 war_declared_flavor.zealous.reincarnation:0 "May your next life be less wretched than this one."
 war_declared_flavor.zealous.christian_judgment: "[ROOT.Char.GetFaith.HighGodName] shall weigh your soul, and my sword shall deliver the verdict!"
 war_declared_flavor.zealous.islamic_judgment: "By [ROOT.Char.GetFaith.HighGodName], your rule ends beneath the banners of the faithful!"
 war_declared_flavor.zealous.pagan_gods: "The gods cry out for vengeance — and I am their instrument!"
 war_declared_flavor.zealous.norse_ravens: "Richly shall the ravens feast!"
 war_declared_flavor.zealous.zoroastrian: "Light shall scour the darkness you shelter. Flee, or burn!"
 war_declared_flavor.zealous.jewish_judgment: "The Law and the Prophets condemn you — and my host shall enforce their verdict!"
 war_declared_flavor.zealous.dharma_judgment: "You have strayed from the path of righteousness. I come to set the world aright!"
 war_declared_flavor.zealous.fallback:2 "I cannot lose, for [ROOT.Char.GetFaith.HighGodName] is with me!"
 war_declared_flavor.naughty:0 "You have been a very naughty [ROOT.War.GetActiveCB.GetDefender.Custom('GirlBoy')]. Such behavior cannot be overlooked! Prepare yourself, for on the battlefield I will inflict the punishment you so richly deserve!"
 war_declared_flavor.holy_war:1 "Your false religion has kept your subjects in the darkness for too long. In the name of [ROOT.War.GetActiveCB.GetAttacker.GetFaith.HighGodName], I shall bring the true faith to them and free them from your blasphemy!"
 war_declared_flavor.norse_ravens: "In the name of the Allfather, the Hanged One, the Flaming Eye, I declare my intention to invade your lands and subjugate your people. Richly shall the ravens feast!"
 war_declared_flavor.greedy:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] I have long coveted your lands, only to be denied possession of them. No more! The time has come for me to finally get what I deserve!"
 war_declared_flavor.dejure:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Your occupation of lands which rightfully belong to me can no longer be tolerated. It is time that I see them returned to my possession!"
 war_declared_flavor.subjugation:0 "I have decided to incorporate your lands into my realm. Submit now, and I will have mercy on you... Resist, and I will force you to kneel and grovel before me!"
 war_declared_flavor.subjugation.tribal:0 "You are weak, and I am strong. There is no other justification needed for me to come and take what I wish from you!"
 war_declared_flavor.subjugation.arrogant:0 "Such impudence, for you to feign at being an equal sovereign when I am so clearly superior to you! I shall crush your pathetic armies on the battlefield and force you to kneel before me!"
 war_declared_flavor.conquest:0 "You are a weak ruler and do not deserve the lands you possess. I will show you what a true sovereign looks like — when I seize those lands from you!"
 war_declared_flavor.peasant:0 "Your arrogance knows no bounds. Worry not, you shall soon be taught a lesson in humility!"
 war_declared_flavor.populist:1 "If it is war you want, then you shall have it! We will not let anybody stop us from forming a new realm for ourselves!"
 war_declared_flavor.independence.tyrant: "You are a tyrant, and we will no longer stand idly by. By blood and steel, we will be free!"
 war_declared_flavor.independence:0 "We will no longer stand idly by under your yoke. By blood and steel, we will be free!"
 war_declared_flavor.liberty:1 "You have not fulfilled your obligations as a liege lord. By the sword, your harsh laws will be cut down!"
 war_declared_flavor.claimant:1 "You are a pretender to the throne. It is time to restore the rightful monarch!"
 war_declared_flavor.rival: "Our feud has festered long enough. Steel shall settle what words could not!"
 war_declared_flavor.vengeful: "I have counted each slight you dealt me, and I repay them all tenfold, in blood!"
 war_declared_flavor.kinstrife: "That we share blood makes this no less needful. Kin or not, you have left me no path but war!"
 war_declared_flavor.callous: "Spare me your pleas. I care nothing for your suffering — only for what I shall take from you."
 war_declared_flavor.just: "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Right and custom stand with me. Yield what is lawfully mine, or face the judgment of arms!"
 war_declared_flavor.retraction_refused:0 "$char_interaction.0221.desc$"
 war_declared_flavor.revocation_refused:0 "$char_interaction.0201.desc$"
 war_declared_flavor.imprisonment_refused:0 "I name you tyrant, and refuse to submit to your authority! The realm shall rise against your malignant rule!"
 war_declared_flavor.wrathful: "My temper is spent. Draw your sword — I will carve the answer from your flesh!"
 war_declared_flavor.tyrant: "Your tyranny has made you a byword among honest men. I come to cast you down!"
 war_declared_flavor.byzantine_imperial: "Know your place beneath the purple. Kneel, or I shall teach you the City's lesson once more upon the field!"
 war_declared_flavor.fallback:0 "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] It seems that there is no recourse for our dispute other than to settle it on the battlefield."
 is_war_overview_tab_open_trigger:0 "Has the war overview tab open"
