l_english:
 # Cataclyst event
 blotsven.0001.t: "An Unexpected Visit"
 blotsven.0001.desc: "Late one night, [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] knocks on my door and tells me that the people are upset. [ROOT.Char.GetTopLiege.GetTitledFirstName] is refusing to do the yearly blot, but without it, strife and famine will befall us all! [chaplain.GetSheHe|U] presses on me how important this blot is, and says that the people will see the leader of this blot as the true rightful [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip] of [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier].\n\n"Will you perform the blot for the people?""
 blotsven.0001.a: "An interesting prospect, I will look into this."
 blotsven.0001.a.tt: "Start and complete a blot activity to get a claim."
 blotsven.0001.b: "Bah, never!"
 blotsven.0001.b.tt: "You forsake this opportunity to please the gods."
 # Eskil barges in
 blotsven.0002.t: "A Raving Missionary"
 blotsven.0002.desc: "As the blot is set to begin, a commotion distracts me from swearing the oath on the iron ring. A red-faced screaming man and his followers flood into our holy circle.\n\n"Stop in the name of [eskil.GetFaith.HighGodName]!" he cries, thrusting his arms to the sky. "Smite the heathens who would countenance this wicked act!"\n\nAs if on his command, it begins to rain, and a terrible flash of lightning splits the horizon."
 blotsven.0002.a: "Pick up the nearest rock and chuck it at him."
 blotsven.0002.a.tt: "Stoning missionaries is not unheard of."
 blotsven.0002.b: "Grab my axe and aim for his head."
 blotsven.0002.b.tt: "This thunder is obviously Thor coming to smite #S him#!"
 blotsven.0002.c: "Something in the way he talks has charmed me..."
 blotsven.0002.c.tt: "Stop the blot and convert to [eskil.GetFaith.GetName]."
 blotsven.0002.toast.m.tt: "[eskil.GetTitledFirstName] has been maimed by me."
 blotsven.0002.toast.k.tt: "[eskil.GetTitledFirstName] has been killed by me."
 # He missed
 blotsven.0003.t: "An Angry Missionary"
 blotsven.0003.desc: "[eskil.GetTitledFirstName] jumps away with a shout. My throw missed, and now I have an even angrier missionary on my hands."
 blotsven.0003.a: "Kill him!"
 blotsven.0003.a.tt: "Order the people around me to do what I failed to do."
 blotsven.0003.b: "Is this a sign? Maybe his god is stronger than mine..."
 blotsven.0003.b.tt: "Stop the blot and convert to [eskil.GetFaith.GetName]."
 blotsven.0003.toast.tt: "[eskil.GetTitledFirstName] has been executed on my orders."
 blotsven.0003.toast.desc.tt: "His people pick up his corpse and carry it back to Tuna."
 # Ending event
 blotsven.0004.t: "Return Reborn"
 blotsven.0004.desc: "The circle of people has disappeared, moving in small groups or alone down the hill. I feel like a new [ROOT.Char.GetWomanMan]. I may not have gotten the kingdom, but my eternal soul is saved."
 blotsven.0004.a: "It's time to go home."
 gruesome_activity_eskil_slain_title: "Killed Eskil"
 gruesome_activity_eskil_slain: "Eskil was slain. For his sacrifice, he was made a saint."