l_english:
 study_scripture_outcome.10.t: "$study_scripture_title$A Rule of Study"
 study_scripture_outcome.10.desc: "The books lie open on the lectern: the articles of [ROOT.Char.GetFaith.GetAdjective] doctrine copied out in a patient hand. A candle gutters against the dark. Below, in the [ROOT.Char.GetFaith.HouseOfWorship], the faithful are waiting, as they always are.\n\n"
 study_scripture_outcome.10.desc_quote: "On the topmost page, some reader before me has underlined a single fragment: #EMP "[ROOT.Char.Custom('RandomStudyVerseFragment')]"#!\n\nHow much of myself will I give to the sacred page?"
 study_scripture_outcome.10.desc_generic: "How much of myself will I give to sacred learning?"
 study_scripture_outcome.10.a: "Let the world wait beyond the cloister door."
 study_scripture_outcome.10.b: "Study shall have its hours, as [ROOT.Char.Custom('StudyOfficesWord')] have theirs."
 study_scripture_outcome.10.c: "I will read as the spirit moves me."
 no_change_study_scripture_tt: "Your [GetScheme('study_scripture').GetTypeName] [scheme|E] progresses unmodified"

 study_scripture_outcome.110.t: "$study_scripture_title$The Sacred Page"
 study_scripture_outcome.110.desc: "I work line by line through the great texts of [ROOT.Char.GetFaith.GetName], wax pooling beneath the candle stub while the rabbits and snails in the marginalia argue with one another.\n\n"
 study_scripture_outcome.110.desc_quote: "One passage speaks to me:\n#EMP "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"#!\n\nIf I am to shepherd [ROOT.Char.GetFaith.HighGodNamePossessive] faithful, these are the words I must carry in my heart."
 study_scripture_outcome.110.desc_generic: "If I am to shepherd [ROOT.Char.GetFaith.HighGodNamePossessive] faithful, these are the words I must carry in my heart."
 study_scripture_outcome.110.a: "I must learn, whatever it costs me."
 study_scripture_outcome.110.b: "Understanding will come in its season."

 study_scripture_outcome.120.t: "$study_scripture_title$The Long Commentary"
 study_scripture_outcome.120.desc: "To lead my flock, I must first learn to lead myself. The commentaries of [commentary_writer.GetTitledFirstName] are spread on my desk — another scholar's lifetime of labor on the [ROOT.Char.GetFaith.ReligiousText], dense as a bramble and twice as sharp. Each line I clear only uncovers more uncertainties.\n\nDiscipline alone will see me through."
 study_scripture_outcome.120.a: "I will comb the text for deeper meaning."
 study_scripture_outcome.120.b: "Steady hours, steady progress."
 study_scripture_outcome.120.c: "A page a night is enough."
 scholar_xp_high_tt: "You significantly deepen your scholarship"
 scholar_xp_low_tt: "You slightly deepen your scholarship"

 study_scripture_outcome.130.t: "$study_scripture_title$Patience in the Margins"
 study_scripture_outcome.130.desc: "Why will the sense of it not come? I read the passage a fourth time and it closes like a fist. I set my forehead gently against the desk.\n\n"I brought you a candle," my [ROOT.Char.Custom2('RelationToMeShort', tutor)], [tutor.GetFirstName], says from the doorway. "Ah — the old commentaries. I know these pages well. Shall we read them together a while?"\n\nI look up. Perhaps a helping hand is exactly what I need."
 study_scripture_outcome.130.a: "Teach me. I am not too proud to learn."
 study_scripture_outcome.130.b: "Sit with me a while; the text can wait."

 study_scripture_outcome.140.t: "$study_scripture_title$Preaching to the [ROOT.Char.Custom('StudyParishWord')|U]"
 study_scripture_outcome.140.desc: "I shut yet another book with a sigh. Doctrine is laid out in these pages, yes, but when I last heard [preacher.GetTitledFirstName] preach, there was something #EMP more#!. [preacher.GetHerHis|U] sermon had no overwrought syllogisms... only [ROOT.Char.GetFaith.HighGodNamePossessive] loving truth.\n\nThe [ROOT.Char.Custom('StudyParishWord')] wept. #EMP I#! wept."
 study_scripture_outcome.140.a: "There is doctrine, and there is delivery. I will learn both."
 study_scripture_outcome.140.b: "My calling is the page, not the [ROOT.Char.Custom('StudyPulpitWord')]."

 study_scripture_outcome.150.t: "$study_scripture_title$The Temporalities"
 study_scripture_outcome.150.desc: ""Walk with me," my [ROOT.Char.Custom2( 'RelationToMeShort', steward_scope )], [steward_scope.GetFirstName], says, ledger under one arm, beckoning me out into the morning.\n\n"The temple fields, the mill, the tithe barns — note which are full, which leak, and which are promised twice over. A flock cannot be fed with grace alone.""
 study_scripture_outcome.150.a: "Teach me the ledgers."
 study_scripture_outcome.150.b: "A walk will clear my head, at least."

 study_scripture_outcome.160.t: "$study_scripture_title$Learned Company"
 study_scripture_outcome.160.desc: "My studies have brought me into correspondence with [colleague.GetTitledFirstName], whose devotion is spoken of well beyond [colleague.GetHerHis] own walls.\n\n"
 study_scripture_outcome.160.desc_distant: "We exchange letters on matters of faith — questions, arguments, and corrections passing back and forth. [colleague.GetHerHis|U] handwriting is dreadful, but [colleague.GetHerHis] reasoning is sound."
 study_scripture_outcome.160.a: "Let us dispute it properly."
 study_scripture_outcome.160.b: "A learned [ROOT.Char.GetWomanMan] should know how [ROOT.Char.GetHerHis] see is governed."
 study_scripture_outcome.160.c: "Back to the texts, together."
 piety_gain_high_tt: "Significant Piety Gain"
 piety_gain_low_tt: "Slight Piety Gain"

 study_scripture_outcome.170.t: "$study_scripture_title$A Letter Under Seal"
 study_scripture_outcome.170.desc: "My [ROOT.Char.Custom2('RelationToMeShort', letterman)], [letterman.GetFirstName], carries it in like a relic: a letter bearing the seal of [senior.GetTitledFirstName].\n\n"Word of your studies has traveled farther than you know. The faith is richer for a shepherd who reads. Persevere, and be assured of my grace."\n\n"
 study_scripture_outcome.170.desc_quote: "The letter closes with a single verse, set apart from the rest:\n#EMP "[ROOT.Char.Custom('RandomBibleQuoteShort')]"#!"
 study_scripture_outcome.170.desc_generic: "The letter closes with a blessing in [ROOT.Char.GetFaith.HighGodNamePossessive] name, written larger than the rest."
 study_scripture_outcome.170.a: "I will compose a worthy reply."
 study_scripture_outcome.170.b: "Perhaps [senior.GetSheHe] might commend my learning more... publicly?"
 study_scripture_outcome.170.c: "Read it again. Slowly, this time."
 study_scripture_outcome.171.t: "$study_scripture_title$Letters to the Faithful"
 study_scripture_outcome.171.desc: "Letters find me from all corners of the [ROOT.Char.GetFaith.GetAdjective] world: clerics quarreling over a line of the liturgy, local [ROOT.Char.GetFaith.PriestNeuterPlural] frightened of their doubts, a scholar begging judgment on a rendering that not a soul alive can verify. For any dispute, my seal is a worthy answer.\n\n"
 study_scripture_outcome.171.desc_quote: "Tonight's letter quotes scripture at me, hopefully:\n#EMP "[ROOT.Char.Custom('RandomBibleQuoteShort')]"#!\n\nThe pile on my desk grows. So, quietly, does my learning."
 study_scripture_outcome.171.desc_generic: "The pile on my desk grows. So, quietly, does my learning."
 study_scripture_outcome.171.a: "Answer them all. That is what a shepherd is for."
 study_scripture_outcome.171.b: "Have the copyists spread my replies to every corner of the faith."
 study_scripture_outcome.171.c: "Tonight I am a student. The letters can wait."

 study_scripture_outcome.172.t: "$study_scripture_title$Pastoral Letter"
 study_scripture_outcome.172.desc: "Tonight I study letters written by shepherds to distant congregations: the sermons and words of instruction vary greatly from [ROOT.Char.Custom('StudyParishWord')] to [ROOT.Char.Custom('StudyParishWord')].\n\nMy thoughts turn to the faithful of [pastoral_county.GetNameNoTier], in the lands of [pastoral_lord.GetTitledFirstName]. They keep a church there. They are far from my reach, and without my guidance... Perhaps it is time I write to them myself.\n\nI take up my quill. #EMP "To the faithful of [pastoral_county.GetNameNoTier]..."#!"
 study_scripture_outcome.172.a: "Send it."
 study_scripture_outcome.172.b: "The lesson was in writing it. That is enough."
 study_scripture_outcome.172.toast: "[owner.GetTitledFirstName] has sent a letter to the people of [pastoral_county.GetNameNoTier]"

 study_scripture_outcome.180.t: "$study_scripture_title$The Unburdening"
 study_scripture_outcome.180.desc: "I start on a new text with jaw clenched and shoulders tense, expecting a duty to be endured.\n\n"
 study_scripture_outcome.180.desc_confession: "Somewhere between the first page and the last my soul crumbles. Everything I have carried, I say aloud to no one but [ROOT.Char.GetFaith.HighGodName]. The weight is gone.\n\nFor the first time in months, the path ahead is clear."
 study_scripture_outcome.180.desc_generic: "Somewhere between the first page and the last, the weight slips from my shoulders. It is as though a veil has lifted.\n\nFor the first time in months, the path ahead is clear."
 study_scripture_outcome.180.a: "Now — what to read next..."

 study_scripture_outcome.190.t: "$study_scripture_title$Patronage of the Learned"
 study_scripture_outcome.190.desc: "Learning, too, has its politics. A copied book sent to the right council, a promising lector seated at the right table, my name spoken warmly in the right halls...\n\nI work diligently. But diligence unseen is diligence wasted."
 study_scripture_outcome.190.a: "See that the synod hears my name."
 study_scripture_outcome.190.b: "Ask the theologians to share their notes."
 study_scripture_outcome.190.c: "The mystics should know my work."
 study_scripture_outcome.190.d: "My devotion stands on its own."

 study_scripture_outcome.200.t: "$study_scripture_title$The Visionary"
 study_scripture_outcome.200.desc: "On some pages, I find where the letters end... something beyond them begins. The mystic known as [mystic.GetTitledFirstName] writes of a darkness that somehow outshines noon, of prayer that outlasts speech — and [ROOT.Char.GetFaith.GetName] teaches that there are doors to understanding which open only for those with the courage to knock.\n\nAs I turn pages, my candles die out one by one. And I sit a long while in the dark. Listening."
 study_scripture_outcome.200.a: "Something waited in that darkness. I will seek it."
 study_scripture_outcome.200.b: "Test me, mysteries. I am not afraid."
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip] deserves a letter of admiration."
 study_scripture_outcome.200.d: "I will note the door, and keep to plainer study."

 study_scripture_outcome.300.t: "$study_scripture_title$The Night Vigil"
 study_scripture_outcome.300.desc: "The [ROOT.Char.GetFaith.HouseOfWorship] is cold, and utterly still. Between the last office and the first there is an hour that belongs to no one, and I have made it mine — a single candle, the dark, and the mystery pressing close about the flame.\n\nSomething waits behind the silence. It is patient. Tonight, so am I."
 study_scripture_outcome.300.a: "Deeper. I will go deeper."
 study_scripture_outcome.300.b: "An hour of stillness, then sleep."
 study_scripture_outcome.300.c: "I kept the watch; that is enough."

 study_scripture_outcome.100.t: "$study_scripture_title$A Question of Succession"
 study_scripture_outcome.100.desc: "Late into the night, I study the canons of election: who may be elected, who may do the electing, which precedents stood and which bent. The canons reward patience.\n\nPopes die. Conclaves gather. And the cardinals will not forget who knew the law when it mattered."
 study_scripture_outcome.100.a: "One day the question will be asked. I will be the answer."
 study_scripture_outcome.100.b: "Wisdom takes time; let ambition wait."
 study_scripture_outcome.100.c: "I'd rather go to bed..."
 pam_ss_papabile_tt: "Your [papabile_score|E] for papal succession increases by #P +10#!"

 study_scripture_outcome.101.t: "$study_scripture_title$The Renowned Exegete"
 study_scripture_outcome.101.desc: "The answer comes to me over a cold supper, between one bite and the next. At last, I know how to read the passage:\n\n"
 study_scripture_outcome.101.desc_quote: "#EMP "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"#!\n\nGenerations of [Glossary('exegetes', 'GLOSS_EXEGETE')] have argued over these words. Now their meaning seems perfectly clear. The question is what to do with my interpretation."
 study_scripture_outcome.101.desc_generic: "Generations of [Glossary('exegetes', 'GLOSS_EXEGETE')] have argued over these words. Now their meaning seems perfectly clear. The question is what to do with my interpretation."
 study_scripture_outcome.101.a: "Preach it from the [ROOT.Char.Custom('StudyPulpitWord')] at the next feast."
 study_scripture_outcome.101.b: "Circulate it quietly among the learned."
 study_scripture_outcome.101.c: "It was given to me in silence; in silence I return it."
 GLOSS_EXEGETE: "A person who practices exegesis — an expert or scholar skilled in critically explaining, interpreting, or expounding a text, especially religious scripture."

 study_scripture_outcome.102.t: "$study_scripture_title$Doctrinal Clarity"
 study_scripture_outcome.102.desc: "For years the doctrines of [ROOT.Char.GetFaith.GetName] have sat in my mind, but some teachings never quite made sense to me.\n\n"
 study_scripture_outcome.102.desc_tenet: "Tonight, [pam_ss_clarity_tenet.GetBaseName|U] is finally clear to me: what this tenet demands, what it forgives, and the bounds those who respect it may not cross. I could defend this belief against any scholar, or teach it to a child."
 study_scripture_outcome.102.desc_generic: "Tonight, the teachings are finally clear to me: what they demand, what they forgive, and the bounds they will not cross. I could defend them against any scholar, or teach them to a child."
 study_scripture_outcome.102.desc_quote: "\n\n#EMP "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"#!"
 study_scripture_outcome.102.a: "I must set it down in writing before the light fades."
 study_scripture_outcome.102.b: "Let the joy of it be enough."
 study_scripture_outcome.102.c: "Even revelation can wait until morning."

 study_scripture_outcome.121.t: "$study_scripture_title$The Teacher"
 study_scripture_outcome.121.desc: "I find my [ROOT.Char.Custom2( 'RelationToMeShort', student_courtier )], [student_courtier.GetTitledFirstName], in the library long after the candles should be out, hunched over a text several sizes too large for [student_courtier.GetHerHis] learning.\n\n"I beg your forgiveness, [ROOT.Char.Custom('FormOfAddressForLiege')]." [student_courtier.GetSheHe|U] sputters, startled. "I... I just wish I was able to read this tome..."\n\nI remember how much I would have given for a teacher who had actually #EMP read#! the book."
 study_scripture_outcome.121.a: "We will read it properly, together."
 study_scripture_outcome.121.b: "I will sponsor [student_courtier.GetHerHim]."
 study_scripture_outcome.121.c: "Let [student_courtier.GetHerHim] study alone. It builds character."

 study_scripture_outcome.122.t: "$study_scripture_title$The Catechism"
 study_scripture_outcome.122.desc: "My studies have borne fruit. Tonight, I gather my household in the [ROOT.Char.Custom('ResidenceBuildingHallsType')] of my [ROOT.Char.Custom('ResidenceBuilding')] and open the [ROOT.Char.GetFaith.ReligiousText] before them.\n\nI read. They listen. Soon, questions follow — some simple, some surprisingly sharp. It seems I am not the only one with an appetite for sacred learning."
 study_scripture_outcome.122.a: "Line by line, for everyone. That is the work."
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip|U] has a keen mind. I will teach [pupil.GetHerHim] more."
 study_scripture_outcome.122.c: "[stray.GetFirstNameNoTooltip|U] lingered afterward. The door is open."
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip|U] has learned enough. Let [devout.GetHerHim] have my blessing."

 study_scripture_outcome.123.t: "$study_scripture_title$The [ROOT.Char.Custom('StudySeminaryWord')|U] Gate"
 study_scripture_outcome.123.desc: "Word of my studies has gone out with the pilgrims and the peddlers, and today they have brought me a would-be student. [aspirant.GetTitledFirstName] stands at my gate, road-worn and stubborn, a borrowed book clutched in [aspirant.GetHerHis] shaky hands.\n\n"They say you actually read what you preach. Teach me, and I will serve.""
 study_scripture_outcome.123.a: "Ah. We begin with the alphabet of the faith."
 study_scripture_outcome.123.b: "My court is no [ROOT.Char.Custom('StudySeminaryWord')]."

 study_scripture_outcome.400.t: "$study_scripture_title$Physician, Heal Thyself"
 study_scripture_outcome.400.desc: "The passage gives me pause. Its condemnation feels uncomfortably familiar.\n\n"
 study_scripture_outcome.400.desc_generic: "The text does not name me, and yet it does: I am [penance_sin.GetName( ROOT.Char )], it says — plainly and without mercy — as though the writer knew me."
 study_scripture_outcome.400.desc_end: "\n\nI could close the book and read no further. But the accusation would remain."
 study_scripture_outcome.400.a: "There is only one cure. Penance."
 study_scripture_outcome.400.b: "I must keep reading, no matter what."
 study_scripture_outcome.400.c: "Saints preach. Sinners rule."

 study_scripture_outcome.410.t: "$study_scripture_title$Strange Commentaries"
 study_scripture_outcome.410.desc: "The codex is borrowed, and its previous reader left thoughts of their own in the margins: objections, prayers, and notes on the tenet they call [pam_ss_margin_tenet.GetBaseName].\n\nI should ignore these scribblings. Instead, I find myself reading them twice."
 study_scripture_outcome.410.a: "And now a third time, slowly."
 study_scripture_outcome.410.b: "Error this earnest deserves a proper refutation."
 study_scripture_outcome.410.c: "Into the fire, page and all."

 study_scripture_outcome.430.t: "$study_scripture_title$The Tenet and the Heart"
 study_scripture_outcome.430.desc: "Of the teachings of [ROOT.Char.GetFaith.GetName], one is mine above all others: [pam_ss_heart_tenet.GetBaseName], carried since long before I could defend it. Tonight I turn my study upon it, looking for flaws.\n\n"
 study_scripture_outcome.430.desc_quote: "The texts answer with one voice:\n#EMP "[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]"#!\n\nThe flaw was never in the teaching."
 study_scripture_outcome.430.desc_generic: "The texts reply in unison, ancient and unshaken, while my voice wavers. The flaw, it seems, was not in the teaching."
 study_scripture_outcome.430.a: "I believe it. Let the whole [ROOT.Char.Custom('StudyParishWord')] see me live it."
 study_scripture_outcome.430.b: "I will write in its defense."
 study_scripture_outcome.430.c: "Examined too closely, every teaching has flaws..."
 pam_ss_spread_tenet_tt: "Your written defense may sway up to #V 3#! [rulers|E] to embrace [pam_ss_heart_tenet.GetBaseName]"
 pam_ss_conviction_spread_tt: "$study_scripture_title$Personal Tenet Adopted"

 study_scripture_outcome.1000.t: "$study_scripture_title$A Shepherd Rebuked"
 study_scripture_outcome.1000.desc_present: "[senior.GetTitledFirstName|U] never lifts [senior.GetHerHis] voice. [senior.GetSheHe|U] has no need to.\n\n"They tell me your texts gather dust. A shepherd unwilling to learn lets the flock wander. You were granted more than most — and what have you made of it?"\n\nThe silence that follows is worse than any shouting."
 study_scripture_outcome.1000.desc_letter: "The parchment bears the seal of [senior.GetTitledFirstName], and each measured line lands like a stone:\n\n"I am told your studies falter. A shepherd unwilling to learn leads [ROOT.Char.GetHerHis] flock astray. You were granted more than most. I expect to hear better things."\n\nNo signature. The seal suffices."
 study_scripture_outcome.1000.desc_dream: "In the dream I stand in a great library where every book bears my name, and every page is blank. A figure I know from a hundred holy images closes the last of them, gently, the way one closes the eyes of the dead.\n\n"You were given more than most," the saint says — and I wake with the words still in the room."
 study_scripture_outcome.1000.a: "I will not be found wanting again."
 study_scripture_outcome.1000.b: "I cannot carry this any longer. Enough — forever."
 study_scripture_outcome.1000.c: "Enough. I need rest."
 never_study_scripture_again_tt: "You can #N never#! take up a [GetScheme('study_scripture').GetTypeName] [scheme|E] again"

 study_scripture_outcome.1010.t: "$study_scripture_title$A Gift of Ink"
 study_scripture_outcome.1010.desc: "A parcel arrives from [sender.GetTitledFirstName]."
 study_scripture_outcome.1010.end_christian: "A ribbon marks the very passage I have been failing to master:\n\n#EMP "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"#!\n\nA generous gift, and a useful one."
 study_scripture_outcome.1010.end: "Inside lies a finely bound devotional book, its pages filled with prayers, commentary, and careful illuminations.\n\nA generous gift, and a useful one. The answers that have eluded me may already lie between these pages."
 study_scripture_outcome.1010.a: "I will put this gift to good use."
 study_scripture_outcome.1010.b: "A fine book. It will look well on my shelf."
 pam_ss_devotional_book_name: "Devotional Book"
 pam_ss_devotional_book_description: "An illuminated volume of holy texts and commentary, copied and gilded with obvious devotion. A ribbon marks the passage its recipient most needed to read."

 study_scripture_outcome.1020.t: "$study_scripture_title$Mortification of the Flesh"
 study_scripture_outcome.1020.desc: "The texts defeat me tonight, as they did last night, and the night before. My eyes slide from the page; my mind wanders to supper, to bed, to anything other than doctrine.\n\nThe body is the problem. The old ascetics knew it: comfort is [ROOT.Char.GetFaith.DevilName]'s quietest servant, and hunger sharpens the soul. Perhaps the flesh must yield before the spirit can advance."
 study_scripture_outcome.1020.a: "The scourge shall clear my mind."
 study_scripture_outcome.1020.b: "Starve the body, feed the soul."
 study_scripture_outcome.1020.c: "Or perhaps supper, bed, and a fresh start tomorrow."

 study_scripture_outcome.1030.t: "$study_scripture_title$Retreat to the Cloister"
 study_scripture_outcome.1030.desc: "My studies have halted. The same desk, same candle, same defeats. So I seek out my [ROOT.Char.Custom2( 'RelationToMeShort', counselor )], [counselor.GetTitledFirstName], whose devotion asks nothing of rank.\n\n"
 study_scripture_outcome.1030.desc_hermitage: ""You bring too many walls with you," [counselor.GetFirstNameNoTooltip] says, with a gesture to the bare cell, the lamp, the silence. "The hermits of old knew: strip everything away, and what is left is what you sought.""
 study_scripture_outcome.1030.desc_monastery: ""You study like a ruler," [counselor.GetFirstNameNoTooltip] says, not unkindly. "Conquering pages, counting them like taxes. In this house we sit with one line for a week, and by the end it is the line that studies us.""
 study_scripture_outcome.1030.a: "Arrange a blessing for my study."
 study_scripture_outcome.1030.b: "Then I will read the same line for two weeks."
 study_scripture_outcome.1030.c: "I will pray on it, and leave it there."

 study_scripture_outcome.1040.t: "$study_scripture_title$A Second Pair of Hands"
 study_scripture_outcome.1040.desc_acolyte: "I did not ask for help. It arrived anyway. My [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.GetTitledFirstName], has sorted my notes, found the right commentary, and trimmed my candle. [helper.GetSheHe|U] has quietly learned my habits — even which passages make me sigh.\n\n"You pray better rested," [helper.GetSheHe] says simply, setting down a warm [helper.Custom('GetLocalStreetFood')] beside my notes."
 study_scripture_outcome.1040.desc_partner: "My [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.GetTitledFirstName], slips in, takes the codex from my hands, and reads the line aloud. The words are holy. [ROOT.Char.GetFaith.HighGodName] forgive me — tonight I find [helper.GetHerHis] [helper.Custom('ObjectifiedFeature')] holier still.\n\n"Let me help," [helper.GetSheHe] murmurs, close enough to share the candle's warmth. "I want to.""
 study_scripture_outcome.1040.a: "Then take dictation until dawn. We finish this."
 study_scripture_outcome.1040.b: "An hour together, then."
 study_scripture_outcome.1040.c: "The kindness is help enough."
 study_scripture_outcome.1040.d: "Come closer, the candle only reaches so far..."

 study_scripture_outcome.1050.t: "$study_scripture_title$The Dark Night of the Soul"
 study_scripture_outcome.1050.desc: "I have studied too long. Somewhere past midnight, answers gave way to questions, and certainty to doubt.\n\n"
 study_scripture_outcome.1050.desc_quote: "I am not the first to face such silence. #EMP "My God, my God, why have you forsaken me?"#!\n\nThe candle burns. The silence holds. What now?"
 study_scripture_outcome.1050.desc_generic: "The holy ones of every age have known this doubt — in the hour when [ROOT.Char.GetFaith.HighGodName] withholds the warmth of [ROOT.Char.GetFaith.HighGodHerHis|U] breath, and will not tell us why.\n\nThe candle burns. The uncertainty remains. What now?"
 study_scripture_outcome.1050.a: "Doubt is a text like any other."
 study_scripture_outcome.1050.b: "Perhaps the silence is the answer."
 study_scripture_outcome.1050.c: "Past words, past doubt — into the mystery itself."

 study_scripture_outcome.1060.t: "$study_scripture_title$[Select_CString( order_head.IsFemale, 'Sisters', 'Brothers' )] of the Rule"
 study_scripture_outcome.1060.desc_house: "My studies falter, and I have little to show for them. Still, news has reached [order_head.GetPrimaryTitle.GetNameNoTier|l], who maintain a chapter in [order_house_county.GetNameNoTier]. Their wagon creaks into my courtyard: copied commentaries, a crate of candles, and a sealed note from [order_head.GetTitledFirstName].\n\n"No cleric studies alone while our Rule still guides us. Ask, and what is ours is yours.""
 study_scripture_outcome.1060.desc_far: "News of my struggles has traveled all the way to [order_head.GetPrimaryTitle.GetNameNoTier|l]. Their wagon creaks into my courtyard: copied commentaries, a crate of candles, and a sealed note from [order_head.GetTitledFirstName].\n\n"No shepherd studies alone while the Rule endures. Ask, and what is ours is yours.""
 study_scripture_outcome.1060.a: "My thanks to every hand that made the copies."
 study_scripture_outcome.1060.b: "Send me one of your lettered clergy."
 study_scripture_outcome.1060.c: "May [ROOT.Char.GetFaith.HighGodName] keep them."
 pam_ss_lettered_brother_tt: "A #EMP lettered cleric#! of the order joins your [court|E]"
 study_scripture_outcome.1060.b.toast: "[lettered_brother.GetShortUIName|U] arrives from [order_head.GetPrimaryTitle.GetNameNoTier|l]"
