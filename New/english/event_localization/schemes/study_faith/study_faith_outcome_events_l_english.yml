l_english:

 # find adherent mini-scheme success outcome event
 study_faith_outcome.0010.t: "[target.GetAdherentNameNoTooltip] Found!"
 study_faith_outcome.0010.desc: "My discrete inquiries and small bribes paid off! Now [study_faith_target.GetShortUIName] stands in front of me, supposedly a [target.GetAdherentName].\n\n"
 study_faith_outcome.0010.desc.in_realm: "It hasn't been long since I requested to meet a [target.GetAdherentName] from my realm. Now [study_faith_target.GetShortUIName] stands in front of me, answering the call.\n\n"
 study_faith_outcome.0010.d.intimidated: "\"What would you have me do, my [ROOT.Char.GetTitleAsName]?\" [study_faith_target.GetSheHe] asks, trembling. The guards stare at [study_faith_target.GetHerHim] suspiciously, ready to act at the first sign of witchery."
 study_faith_outcome.0010.d.safe: "\"How can I be of service, my [ROOT.Char.GetTitleAsName]?\" [study_faith_target.GetSheHe] asks, slightly intimidated. My guards can't help but look at [study_faith_target.GetHerHim] curiously, aware of the rumors of my search."
 study_faith_outcome.0010.a: "Let me study [target.GetNameNoTooltip] from you."
 study_faith_outcome.0010.b: "I have changed my mind."
 study_faith_outcome.0010.b.desc: "[study_faith_target.GetShortUIName] will be let out, to live [study_faith_target.GetHerHis] life how [study_faith_target.GetSheHe] sees fit"

 study_faith_outcome.0101.t: "Acquainted with [actor.GetFaith.HighGodName]"
 study_faith_outcome.0101.desc: "Arduous study of [actor.GetRite.GetName] has lead me to better understand my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetName] and above all how to walk the path of [actor.GetFaith.GoodGodNames]."
 study_faith_outcome.0101.a: "It is time I commit to conversion."
 study_faith_outcome.0101.b: "I cannot abandon [ROOT.Char.GetFaith.GoodGodNames]!"
 study_faith_outcome.0102.desc: "I thank you for your patience and generosity in shepherding me through my ignorance. Now I walk the path of [actor.GetFaith.GoodGodNames]." 
 study_faith_outcome.0102.a: "It was only right I did so."
 study_faith_outcome.0103.desc: "My loyalty is with [recipient.GetFaith.GoodGodNames]! I will not be made to forsake [recipient.GetRite.GetName]."
 study_faith_outcome.0103.a: "There is a price for insubordination..."
 study_faith_outcome.0111.t: "Struggling to Grasp [actor.GetRite.GetNameNoTooltip]"
 study_faith_outcome.0111.desc: "Arduous study of [actor.GetRite.GetName] has lead me nowhere! Not only do I struggle to walk the path of [actor.GetFaith.GoodGodNames] I fear my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetFirstNamePossessive] may be wrong in [actor.GetHerHis] convictions."
 study_faith_outcome.0111.a: "Perhaps understanding will come with conversion..."
 study_faith_outcome.0111.b: "I will redouble my efforts"
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$"

 msg_letter_from_vassal: "$religious_interaction.1.opening$"

 # OUTCOME EVENTS
 study_faith_outcome.1000.t: "$study_faith$: A Breakthrough"
 study_faith_outcome.1000.desc: "After all my hard work, the pieces have at last fallen into place. Endless hours poring over books, sleepless nights rehearsing the rituals, countless lessons in [target.GetFaith.GetAdjective] theology — together, they finally converge into a clear understanding of the [target.GetRite.GetAdjective] rite.\n\nDuring my efforts I looked to emulate [target.GetTitledFirstName], but now I think I am starting to understand how [target.GetSheHe] may feel comfortable within the \"warm embrace\" of the [target.GetRite.GetName] rite."
 study_faith_outcome.1000.a: "I can learn just about any practice of any faith!"
 study_faith_outcome.1000.b: "The [scheme.GetTargetCharacter.GetRite.GetNameNoTooltip] rite makes more sense to me than my own ways..."

 study_faith_outcome.1200.t: "$study_faith$: A Tenet Comes Into Focus"
 study_faith_outcome.1200.desc: "The familiar walls of my study stand witness to a quiet victory as I work out the [target.GetRite.GetAdjective] value of [discovered_tenet.GetName( target.GetRite )]. Strange though it be, with some imagination I can envision [target.GetTitledFirstName] and [target.GetHerHis] relatives engaging in this alien practice.\n\nIt is but one step on a long road — yet my journey through the [target.GetRite.GetNameNoTooltip] rite inches forward all the same."
 study_faith_outcome.1200.a: "I hunger to know more of these [target.GetRite.GetAdjectiveNoTooltip] practices!"
 study_faith_outcome.1200.b: "Fascinating. I wonder how it relates to [additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )]!"
 study_faith_outcome.1200.c: "This is making me uncomfortable..."

 study_faith_outcome.1400.t: "$study_faith$: Customs of [target.GetRite.GetNameNoTooltip]"
 study_faith_outcome.1400.desc: "To grasp the [target.GetRite.GetName] rite, one must study not only its metaphysical framework, but also its mundane influence on day-to-day life.\n\nAfter reflecting on the concept of [discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )], I have grasped enough of its implications to tie the concept back to the practices of [target.GetRite.GetNameNoTooltip] as a whole."
 study_faith_outcome.1400.alt1.desc: "\n\nIn turn, this has illuminated the nuance in their practice of [third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]!"
 study_faith_outcome.1400.alt2.desc: "\n\nIt is but one piece of a much larger puzzle, yet each piece brings me a little closer to grasping the [target.GetRite.GetNameNoTooltip] rite as a whole."
 study_faith_outcome.1400.a: "Useful knowledge. Onwards."
 study_faith_outcome.1400.b: "I'll burn the midnight oil."
 study_faith_outcome.1400.c: "Let me press [target.GetShortUINameNoTooltip] for more."

 study_faith_outcome.1500.t: "$study_faith$: Beyond My Reach"
 study_faith_outcome.1500.desc: "Long study has brought me to the limit of what an outsider can understand. The remaining [target.GetRite.GetAdjective] mysteries belong to those born into the rite — passed, as a matter of course, to those living life under its strictures, absent from any text and indefinable even to the patient observer.\n\nI know all that an outsider can."
 study_faith_outcome.1500.a: "I have learned what I can."
 study_faith_outcome.1500.toast: "$study_faith$ Concluded"
 study_faith_outcome.1500.toast.desc: "You have learned every [core_tenet|E] and [doctrine|E] of the [target.GetRite.GetName] [rite|E] that an outsider can know."

 study_faith_scheme_stays_active: "The [scheme|E] stays active"

 
 study_faith_outcome.3000.t: "$study_faith$: Resume Studies?"
 study_faith_outcome.3000.desc: "Unfortunately [target.GetTitledFirstName] is not around anymore. It is a shame, I was looking to [target.GetHerHim] for guidance in the finer details of [target.GetFaith.GetName].\n\nThat said, no need to cut my studies short — I just need to find someone else to emulate!"
 study_faith_outcome.3000.alt1.desc: "Unfortunately [target.GetTitledFirstName] was not the best choice for guidance in the fine details of [target.GetFaith.GetName].\n\nThat said, no need to cut my studies short — I just need to find someone else to emulate!"
 study_faith_outcome.3000.a: "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] is an ardent worshiper!"
 study_faith_outcome.3000.b: "Perhaps [potential_continuation_target_2.GetTitledFirstNameNoTooltip]? [potential_continuation_target_2.GetHerHis|U] theology is interesting."
 study_faith_outcome.3000.c: "Maybe [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
 study_faith_outcome.3000.d: "Ah, I was looking for a reason to stop studying! Hooray!"
 study_faith_scheme_retains_progress: "The [scheme|E] retains all previous progress"
 
 child_studied_faith_title: "[owner.Custom('GetDaughterSon')|U] Studies a Rite!"
 child_studied_faith_desc: "Your [owner.Custom('GetDaughterSon')] learned more of the [target.GetRite.GetName] [rite|E]"
 child_studied_faith_invalidated_title: "Your Child's Study Rite Scheme Invalidated"
 child_studied_faith_invalidated_desc: "Your Child's [GetScheme('study_faith').GetTypeName] [scheme|E] was Invalidated"

 # ONGOING EVENTS

 study_faith_ongoing.1000.t: "$study_faith$: The Ease of Youth"
 study_faith_ongoing.1000.t.theologian: "$study_faith$: The Ease of Experience"
 study_faith_ongoing.1000.desc.young: "My study of [scheme.GetTargetCharacter.GetFaith.GetName] is progressing fantastically. I feel like I have all the focus and energy in the world!"
 study_faith_ongoing.1000.desc.theologian: "My study of [scheme.GetTargetCharacter.GetFaith.GetName] is coming along nicely. It is evident that their framework is not altogether unlike that of other faiths!"
 study_faith_ongoing.1000.desc: "\n\n"#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!"\n\nWhile I may be paraphrasing, I feel as though the spirit of the faith is clear, even as I work out the particulars of the word.\n\nIf I continue with this exacting focus, I will soon possess all the secrets of the [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1000.a: "I will dedicate #EMP all#! my time to this!"
 study_faith_ongoing.1000.b: "I'd rather spend my time elsewhere..."
 
 study_faith_ongoing.1010.t: "$study_faith$: An Intimate Understanding"
 study_faith_ongoing.1010.desc: "#EMP "[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]"#!\n\nFeeling a presence, I look up from my analysis of [scheme.GetTargetCharacter.GetFaith.GetAdjective] scripture. [lover_target.GetFirstName] is leaning over me with a wanton gaze.\n\n"Is that text on [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]?" [lover_target.GetSheHe] inquires.\n\n"How wonderful to have a fellow believer in the court, and the [ROOT.Char.GetTitleTierName] no less! Perhaps I could aid you with my more...intimate understanding?""
 study_faith_ongoing.1010.a: "Let us retire to my chambers, lest we be disturbed."
 study_faith_ongoing.1010.b: "I'm just studying you [lover_target.Custom('GetDerogatoryNonbeliever')], that's all!"
 study_faith_ongoing.1010.c: "Begone, [lover_target.Custom2('InsultNounSexual', ROOT.Char)]. I must focus!"
 study_faith_ongoing.1010.c.tt: "#EMP You shut the door in [lover_target.GetHerHis] face and resume your studies#!"

 study_faith_ongoing.1011.t: "$study_faith$: A False Track"
 study_faith_ongoing.1011.desc: "I have had my suspicions for a while now, and after a few trap-laden questions [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] falsehood is laid bare. Despite what [scheme.GetTargetCharacter.GetSheHe] claims, [scheme.GetTargetCharacter.GetHerHis] belief in [scheme.GetTargetCharacter.GetFaith.GetName] is insincere!\n\nWhile knowing the theater of a non-believer is interesting in its own right, for my understanding of [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] to meaningfully progress perhaps it's best I find a more faithful adherent..."
 study_faith_ongoing.1011.a: "I cannot rely on [scheme.GetTargetCharacter.GetShortUINameNoTooltip] any longer."
 study_faith_ongoing.1011.b: "If [scheme.GetTargetCharacter.GetSheHe] has been hiding it so well, maybe I can too..."
 study_faith_ongoing.1011.c: "Well, what #EMP does#! [scheme.GetTargetCharacter.GetShortUINameNoTooltip] believe in then?"
 study_faith_ongoing.1011.c.tt: "I will try to pry into [scheme.GetTargetCharacter.GetHerHis] secret beliefs."

 study_faith_ongoing.1012.t: "$study_faith$: Practitioner of Ancient Rites"
 study_faith_ongoing.1012.desc: "My attempts to investigate [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] faith have proven fruitful, if in unexpected ways. While [scheme.GetTargetCharacter.GetSheHe] in undoubtedly a non-believer of [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip], [scheme.GetTargetCharacter.GetSheHe] seems to follow the strange, forgotten rites of [actual_faith.GetName]. Their practice is not unlike...witchcraft.\n\nThe discovery leaves me shaken. Is there some way I can take advantage of this?"
 study_faith_ongoing.1012.a: "Well, this is still #EMP interesting#! to know."
 study_faith_ongoing.1012.b: "I will need a new teacher for my studies."
 study_faith_ongoing.1012.b.tt: "You will try to find a similar teacher to continue studying [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]"
 study_faith_ongoing.1012.c: "This actually seems so much more compelling than [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1012.c.tt: "You will now study [actual_faith.GetNameNoTooltip]"
 study_faith_ongoing.1013.t: "$study_faith$: More Mummer than Mystic"
 study_faith_ongoing.1013.desc: "My attempts to investigate [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] faith have failed. Behind [scheme.GetTargetCharacter.GetHerHis] devout facade, [scheme.GetTargetCharacter.GetHerHis] vision of the world seems to be completely devoid of any theological underpinning.\n\nMaybe [scheme.GetTargetCharacter.GetSheHe] follows the principles of [scheme.GetTargetCharacter.GetFaith.GetName] simply for convenience, clout or safety?\n\nWhatever the reasons, it is clear this [scheme.GetTargetCharacter.GetWomanMan] is not invested in the beliefs [scheme.GetTargetCharacter.GetSheHe] professes."
 study_faith_ongoing.1013.a: "A waste of time! I'm done with [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]."

 study_faith_ongoing.1020.t: "$study_faith$: Local Believer"
 study_faith_ongoing.1020.desc: "It seems as if my studies of the [scheme.GetTargetCharacter.GetFaith.GetAdjective] practice has reached the ears of [faith_helper.GetTitledFirstName]. [faith_helper.GetSheHe|U] is a local practitioner, and is offering to help me in my studies.\n\n"I ask no more than a token of appreciation for my efforts, [ROOT.Char.Custom('FormOfAddressForLiege')]." [faith_helper.GetSheHe|U] says, [faith_helper.Custom('quirk_pos_pp')]."
 study_faith_ongoing.1020.a: "If you help me, this gold will be yours."
 study_faith_ongoing.1020.b: "A favor for a favor?"
 study_faith_ongoing.1020.c: "Oh you are #EMP so selfless#! offering to help me, for free!"
 study_faith_ongoing.1020.d: "Thank you, but I can manage on my own."
 study_faith_ongoing.1020.c.success: "You cajole [faith_helper.GetFirstNameNoTooltip] into helping you"
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip] sees right through your manipulation"

 study_faith_ongoing.1030.t: "$study_faith$: Old [scheme.GetTargetCharacter.GetFaith.ReligiousText|U]"
 study_faith_ongoing.1030.desc: "A [chosen_peasant.GetWomanMan] approaches me with an acquisitive grin.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], is it true that you are studying the ways of [scheme.GetTargetCharacter.GetFaith.GetName]? My father brought back this [scheme.GetTargetCharacter.GetFaith.ReligiousText] from one of his travels to [holy_site.GetNameNoTier]!"\n\n\"I have no use for it, as I cannot read. I would happily make it yours, in exchange for some coin."
 study_faith_ongoing.1030.a: "How fortuitous. My gold is yours."
 study_faith_ongoing.1030.b: "This is not so rare as you might think..."
 study_faith_ongoing.1030.b.flavor: "Haggle with this trinket peddler"
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName] takes the deal"
 study_faith_ongoing.1030.b.failure: "[chosen_peasant.GetFirstName] is insulted by your offer"
 study_faith_ongoing.1030.c: "Guards, seize these heathen texts from [chosen_peasant.GetHerHim]."
 study_faith_ongoing.1030.d: "Swindler! Begone with you..."
 study_faith_ongoing.1040.t: "$study_faith$: Admiration"
 study_faith_ongoing.1040.desc: "What a boon! I've gotten several missives where [target.GetTitledFirstName] lauds my efforts to learn the nuances of [scheme.GetTargetCharacter.GetFaith.GetAdjective] belief. [target.GetSheHe|U] goes so far as naming me the preeminent [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] to study [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!\n\nIt feels good to get recognition for my hard work!"
 study_faith_ongoing.1040.a: "Scribes! Send word back of my appreciation."
 study_faith_ongoing.1040.b: "[target.GetFirstNamePossessiveNoTooltip] expression of faith is illuminating..."
 study_faith_ongoing.1040.c: "Bah! I do not need validation from anyone but #EMP myself!#!"
 study_faith_ongoing.1050.t: "$study_faith$: The Stink of Sabotage"
 study_faith_ongoing.1050.desc: "My notes outlining the sometimes confusing and contradictory tenants of [scheme.GetTargetCharacter.GetFaith.GetName] are scattered all over my study. Months of work lie torn and tattered, a loose leaf on the window suggests at least some of my notes were cast out.\n\nMust I start again from nothing?!\n\n#EMP Sniff, sniff...#!What's the sickly scent? Frankincense or sandalwood mixed with something...floral? The smell summons to mind the smug face of my [sabotage_rival.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sabotage_rival'))] [sabotage_rival.GetTitledFirstName]. It is [sabotage_rival.GetSheHe] who has sought my ruin..."
 study_faith_ongoing.1050.a: "My notes... no! So much work, gone!"
 study_faith_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip] deserves #EMP TO DIE!#!"
 study_faith_ongoing.1050.c: "Ha-Hah! I always keep #EMP back up notes!#!"
 study_faith_ongoing.1060.t: "$study_faith$: An Ignorant Interpretation"
 study_faith_ongoing.1060.desc: "As a test of my progress, I attempt to summarize a passage from the [scheme.GetTargetCharacter.GetFaith.ReligiousText|U] to my [scheme.GetTargetCharacter.GetFaith.GetAdjective] [ROOT.Char.Custom2('RelationToMeShort', offended_character)] [offended_character.GetTitledFirstName] #EMP "...the [offended_character.GetFaith.PriestNeuter] must lift the [target.Custom('GetAccessory')] so [target.Custom('FormOfAddressForLiege')] may pluck the [target.GetCurrentLocation.Custom('get_region_flower_type')]-"#!.\n\n"Your interpretation is nonsensical! It makes my [offended_character.GetFaith.PriestNeuterPlural] appear [offended_character.Custom2('InsultAdjective', SCOPE.sC('offended_character'))] and [offended_character.GetFaith.HighGodName] a [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]!?".\n\nPerhaps my grasp of the finer points of [scheme.GetTargetCharacter.GetFaith.GetAdjective] practice is still wanting..."
 study_faith_ongoing.1060.a: "Please take this as a token of my remorse."
 study_faith_ongoing.1060.b: "My goal was to extol the virtues of [offended_character.GetFaith.PriestNeuter]!"
 study_faith_ongoing.1060.c: "You know what!? [offended_character.GetFaith.HighGodName] is #EMP [offended_character.Custom2('InsultAdjective', ROOT.Char)]!#!"
 study_faith_ongoing.1060.d: "I only hoped to better grasp [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1060.b.success: "You trick [offended_character.GetHerHim] into thinking you #EMP flattered#! [offended_character.GetHerHis] [offended_character.GetFaith.PriestNeuterPlural]"
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip] sees through your lie"
 study_faith_ongoing.1060.d.success: "You successfully explain that it was a misunderstanding"
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip] doesn't believe you"
 
 study_faith_ongoing.1070.t: "$study_faith$: Sordid Myths"
 study_faith_ongoing.1070.desc: "[target.GetTitledFirstNamePossessive] gift of [scheme.GetTargetCharacter.GetFaith.GetAdjective] mythological texts has the court astir. Many watch on as I pore over them, reading aloud the most interesting passages.\n\nAt first, I assume [ROOT.Char.GetFaith.EvilGodNames] is playing sordid tricks on me, but after thorough investigation of certain, stirring passages, it becomes clear this must be a text of an erotic nature.\n\nWhat are references to [scheme.GetTargetCharacter.GetFaith.FertilityGodNamePossessive] [ROOT.Char.Custom('ObjectifiedFeature')] doing in a holy text?! [ROOT.Char.Custom('CulturalCurse')|U]."
 study_faith_ongoing.1070.a: "Guards, rid me of this blasted book!"
 study_faith_ongoing.1070.b: "You dare laugh at me!? #EMP Flog them all.#!"
 study_faith_ongoing.1070.c: "Oh well, I suppose it #EMP is#! educational, in a sense..."
 
 study_faith_ongoing.1080.t: "$study_faith$: A Great Tutor"
 study_faith_ongoing.1080.desc: "My [ROOT.Char.Custom2('RelationToMeShort', court_tutor)] [court_tutor.GetFirstName] has been relentless in aiding my efforts to understand the finer details of [scheme.GetTargetCharacter.GetFaith.GetName].\n\n[court_tutor.GetHerHis|U] dedication to the art of teaching is inspirational! [court_tutor.GetSheHe] always has a [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] text close at hand or finds me a learned [scheme.GetTargetCharacter.GetFaith.PriestNeuter] to converse with.\n\nTruly, my understanding would not have come this far along without [court_tutor.GetHerHis] help."
 study_faith_ongoing.1080.a: "[court_tutor.GetFirstNameNoTooltip], you deserve a reward!"
 study_faith_ongoing.1080.b: "[court_tutor.GetSheHe|U] is doing [court_tutor.GetHerHis] job well."
 
 study_faith_ongoing.1090.t: "$study_faith$: Incomprehensible!"
 study_faith_ongoing.1090.desc.intro: "The theology behind [scheme.GetTargetCharacter.GetFaith.GetName] is impossible to grasp!"
 study_faith_ongoing.1090.tenet.desc: "In particular, the belief of [discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )] completely eludes me."
 study_faith_ongoing.1090.doctrine.desc: "In particular, [discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )] completely eludes me."
 study_faith_ongoing.1090.desc.main: "\n\nMy skull is full! As soon as one concept enters, another is pushed into the abyss of forgetfulness."
 study_faith_ongoing.1090.friend.desc: "\n\n"Keep it up, my [ROOT.Char.Custom('ComplimentAdjective')] friend. I believe in you!"\n\nFortunately, [helpful_friend.GetTitledFirstName] is always there to help untangle these unfamiliar teachings. I really am blessed."
 study_faith_ongoing.1090.no_friend.desc: "\n\nPerhaps I need a break?"
 study_faith_ongoing.1090.a: "I can always lean on [helpful_friend.GetFirstNameNoTooltip] for guidance!"
 study_faith_ongoing.1090.b: "No matter how strange this seems, I must persevere!"
 study_faith_ongoing.1090.c: "I just need to put the books down for a while..."
 study_faith_ongoing.1090.d: "This is hopeless!"
 study_faith_ongoing.1100.t: "$study_faith$: The [target.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 study_faith_ongoing.1100.desc: "Word has spread of my diligent study of [scheme.GetTargetCharacter.GetFaith.GetName].\n\nThey are referring to me as 'the [target.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]', a title that could lead to confusion..."
 study_faith_ongoing.1100.a: "A clever speech could appease my people and the [target.GetFaith.GetAdherentNamePluralNoTooltip]!"
 study_faith_ongoing.1100.b: "My studies are my business. No distractions!"
 study_faith_ongoing.1100.c: "Surely, [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] will be impressed!"
 study_faith_ongoing.1100.a.success: "You deliver a fantastic speech"
 study_faith_ongoing.1100.a.success.tt: "Every courtier or guest of [root_scope.GetFaith.GetNameNoTooltip] or [target.GetFaith.GetNameNoTooltip]"
 study_faith_ongoing.1100.a.failure: "You make a fool out of yourself"
 study_faith_ongoing.1110.t: "$study_faith$: The Allure of [target.GetFaith.GetAdjectiveNoTooltip] Poetry"
 study_faith_ongoing.1110.desc: "Ah, '[poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U] of the [poet_location.Custom('GetTerrainTypePlural')|U]' by [the_poet.GetFirstName] of [poet_location.GetCounty.GetName]. Truly a great collection of [scheme.GetTargetCharacter.GetFaith.GetAdjective] poetry!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nPerhaps poetry is a window into faith?"
 study_faith_ongoing.1110.a: "I will try my hand at [target.GetFaith.GetAdjectiveNoTooltip] verse!"
 study_faith_ongoing.1110.b: "I should recite a #EMP romantic#! poem for my [ROOT.Char.Custom2('RelationToMeShort', lover_to_be)] [lover_to_be.GetFirstNameNoTooltip]?"
 study_faith_ongoing.1110.c: "I analyze the poem for its religious qualities."
 study_faith_ongoing.1110.a.success: "You find yourself a deft hand at poetry"
 study_faith_ongoing.1110.a.failure: "You attempts at poetry are pitiful"

 study_faith_ongoing.1120.t: "$study_faith$: Heretical Tales"
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n\"The [ROOT.Char.GetTitleTierName], studying fables of a foreign faith? Have you no shame!?\" my [ROOT.Char.Custom2('RelationToMeShort', zealot)] [zealot.GetTitledFirstName] exclaims.\n\n\"If your foes learn that you fraternize with heretical ideas, they will do all in their power to paint you a heretic!\"\n\nPerhaps my choice of [scheme.GetTargetCharacter.GetFaith.GetAdjective] writings could be misconstrued by cretins and enemies in the [ROOT.Char.Custom('GetCourt')]."
 study_faith_ongoing.1120.a: "No! These are...#EMP venerable [target.GetFaith.GetAdjectiveNoTooltip] theological treatises!#!"
 study_faith_ongoing.1120.b: "You dare accuse me of heresy!? I'll show you!"
 study_faith_ongoing.1120.c: "You are right. Such texts are not fit for a [ROOT.Char.GetTitleTierName]."
 study_faith_ongoing.1120.d: "Let people think what they will. These writings are enlightening!"
 study_faith_ongoing.1120.a.success: "You trick [zealot.GetFirstNameNoTooltip]"
 study_faith_ongoing.1120.a.failure: "Your taste for heretical reading becomes common knowledge"
 study_faith_ongoing.1120.b.tt: "#V Duel#! [zealot.GetFirstName] to punish [zealot.GetHerHim] for [zealot.GetHerHis] insolence!\n#weak This duel is NOT to the death.#!\nIf you win, you will gain [prestige_i] [prestige|E] and a [modifier|E] for the [scheme|E]. If you lose, you will be ridiculed.\n\nYour [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[zealot.GetFirstNamePossessive] [prowess|E]: [prowess_i]#V [zealot.GetProwess]#!"
 study_faith_ongoing.1121.trigger_failure: "My duel against [zealot.GetFirstNameNoTooltip] has been invalidated"
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1123.desc: "\"I yield! Please forgive me, you are not feeble-minded at all! Just spare me!\" [zealot.GetTitledFirstName] exclaims.\n\nThat'll teach [zealot.GetHerHim] to insult #EMP me#!."
 study_faith_ongoing.1123.a: "As the wise [ROOT.Char.Custom('GetAnimalType')|U] once said: \"Don't insult your betters!\""
 study_faith_ongoing.1123.b: "You will rot in the dungeon for your insolence!"
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.desc: "[zealot.GetTitledFirstName] spits next to where you lie on the ground.\n\n\"You are a weak, pathetic excuse for a [ROOT.Char.GetTitleTierName]. Now I will do you a favor and rid you of these inane books.\" [zealot.GetSheHe] says."
 study_faith_ongoing.1124.a: "A setback in my studies..."
 
 study_faith_ongoing.1130.t: "$study_faith$: Pleasures of the Faith"
 study_faith_ongoing.1130.desc: "\"Oh, my dear [ROOT.Char.GetFirstNameNoTooltip]! You really are learning about my beloved [scheme.GetTargetCharacter.GetFaith.GetName]? I appreciate you making such an effort to understand me!\" [lover_to_help.GetTitledFirstName] says, [lover_to_help.Custom('quirk_pos_pp')].\n\n\"It would be my pleasure to help in #EMP any#! way possible.\""
 study_faith_ongoing.1130.a: "I'll take any help I can get!"
 study_faith_ongoing.1130.b: "I can think of a way most pleasing."
 study_faith_ongoing.1130.c: "I would prefer to study alone."
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip] is a good, albeit flirtatious teacher"
 study_faith_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip] focuses your lessons on such niche, sensual elements of theology that you are unable to see how they are compatible with the faith as a whole"
 study_faith_ongoing.1130.a.failure.toast: "[lover_to_help.GetFirstNameNoTooltip] assistance is too flirtatious to be helpful."

 study_faith_ongoing.1140.t: "$study_faith$: A Guiding Hand"
 study_faith_ongoing.1140.desc: "\"I commend you learning more about [scheme.GetTargetCharacter.GetFaith.GetName], surely it will strengthen your position as [ROOT.Char.GetTitleTierName]!\" my [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))] [close_one_to_help.GetFirstName] exclaims.\n\n\"I have known the ways of [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] from birth. Perhaps I could be of assistance, [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]?\""
 study_faith_ongoing.1140.a: "Could you help me make sense of this tenet?"
 study_faith_ongoing.1140.b: "Would you like to join my study sessions?"

 study_faith_ongoing.1200.t: "$study_faith$: A Heathen Hound"
 study_faith_ongoing.1200.desc: "In my efforts to learn the mysteries of [scheme.GetTargetCharacter.GetFaith.GetName], I keep an orderly collection of notes. Truly it is my only means of managing the chaos of another belief system. Alas, they seem to have misplaced themselves.\n\nThe familiar wet nose of [ROOT.Char.Custom('DogStoryName')] nuzzles my hand. I look down at my dear dog, hoping for a respite from my frustration.\n\nLooking up at me, [ROOT.Char.Custom('DogStorySheHe')] wags [ROOT.Char.Custom('DogStoryHerHis')] tail with pride. It is only then I realize [ROOT.Char.Custom('DogStorySheHe')] has got my notes firmly clenched between [ROOT.Char.Custom('DogStoryHerHis')] teeth..."
 study_faith_ongoing.1200.a: "I couldn't possibly stay mad at you!"
 study_faith_ongoing.1200.b: "Do you want to go for a walk? Come on then."
 study_faith_ongoing.1200.c: "That is not a toy! #EMP Bad#! dog!"

 study_faith_ongoing.1300.t: "$study_faith$: Learn by Doing"
 study_faith_ongoing.1300.desc: "As we pass through the [ROOT.Char.GetCurrentLocation.GetTitle.GetName], locals seem engaged in a [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] celebration. A [interlocutor.GetWomanMan] approaches us and invites us to take part, though we are [ROOT.Char.GetFaith.GetAdherentNamePlural].\n\nMy party tries to gets between us, wary it may be a trap.\n\nDanger be damned. I can hardly imagine a better opportunity to learn first hand about [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1300.a: "Show me the way!"
 study_faith_ongoing.1300.a.flavor: "It's just a little [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] ritual, what harm could there be?"
 study_faith_ongoing.1300.b: "Debating the details of [interlocutor.GetHerHis] faith will surely be the most instructive."
 study_faith_ongoing.1300.b.flavor: "You attempt to engage [interlocutor.GetFirstNameNoTooltip] in an amicable debate"
 study_faith_ongoing.1300.b.success: "You have an engaging debate with [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.b.failure: "You fail to communicate with [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.c: ""Join us on our journey to [next_destination.GetNameNoTooltip]!""

 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_1: "As the moth knows not the script of the stars yet finds the flame, so the soul need not name the Divine to be consumed by it."
 holy_text_indeterminate_quote_2: "When the desert wind erased the tyrant's footsteps, the sand remembered only the tracks of the thirsty and the kind."
 holy_text_indeterminate_quote_3: "The river does not choose pebbles to polish, yet with passing years tempers all toward perfection."
 holy_text_indeterminate_quote_4: "Drink from the spring of knowledge and so will it bend your back."
 holy_text_indeterminate_quote_5: "On the day the mountain bowed, it bowed not to king nor army, but stooped low to hear a child's question."
 holy_text_indeterminate_quote_6: "The Hidden One speaks first in whispers of doubt so that, when you finally answer, your faith is your own."
 holy_text_indeterminate_quote_7: "Each falsehood given before the altar returns as smoke, but each honest tear is sown as seed in the gardens of [ROOT.Char.GetFaith.PositiveAfterLife]."
 holy_text_indeterminate_quote_8: "Do not curse the darkness that shrouds your path; it is there so your own flame may learn the courage to burn."
 holy_text_indeterminate_quote_9: "The Radiant does not count the prayers of the proud, only the quiet mercies done when no eyes are watching."
 holy_text_indeterminate_quote_10: "When the world was divided into 'mine' and 'yours', the Divine laughed, for to its eyes there was only 'ours.'"
