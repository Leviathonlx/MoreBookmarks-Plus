l_english:
 rite_growth.0010.t: "A New [origin_faith.GetReligion.GetAdjectiveNoTooltip] Rite"
 rite_growth.0010.desc.intro.relation: "At the heart of a newly founded rite stands your [GetPlayer.Custom2('RelationToMeShort', founder.Self)] [founder.GetFirstName], "
 rite_growth.0010.desc.intro.descriptor_archbishop: "At the heart of a newly founded rite stands the [founder.GetCulture.GetName] Archbishop [founder.GetFirstName], "
 rite_growth.0010.desc.intro.descriptor_ruler: "At the heart of a newly founded rite stands [founder.GetTitledFirstName], "
 rite_growth.0010.desc.opener.archbishopric: "who presides over [founder_clerical_title.GetNameNoTier].\n\n"
 rite_growth.0010.desc.opener.lands: "who rules the lands of [founder.GetPrimaryTitle.GetBaseNameNoTier].\n\n"
 rite_growth.0010.desc.divergence.minor: "Known by its followers as [new_rite.GetName], the rite differs only slightly from the [source_rite.GetAdjective], "
 rite_growth.0010.desc.divergence.moderate: "Known by its followers as [new_rite.GetName], the rite's ways are unfamiliar to most followers of [source_rite.GetAdjective], "
 rite_growth.0010.desc.divergence.major: "Known by its followers as [new_rite.GetName], the rite's practices border on heresy to most adherents of the [source_rite.GetAdjective], "
 rite_growth.0010.desc.differing.tenet: "with the most striking departure being [differing_tenet.GetBaseName]."
 rite_growth.0010.desc.differing.doctrine: "with the most striking departure being [differing_doctrine.GetDescriptiveName]."
 rite_growth.0010.desc.differing.fallback: "but the difference in doctrine is too subtle to easily name."
 rite_growth.0010.desc.outro.wildfire: "\n\nThese new teachings spread rapidly through the [origin_faith.GetAdjective] flock."
 rite_growth.0010.a: "My soul is safe with [ROOT.Char.GetRite.GetNameNoTooltip]."
 rite_growth.0010.b: "I should practice [new_rite.GetNameNoTooltip]!"
 rite_growth.0010.c: "Smells like heresy to me..."
 counties_and_court_converts: "[counties|E] and [courtiers|E] of [source_rite.GetName] will convert to [new_rite.GetName]"

 rite_growth.0011.notification.title: "[convert_ruler.GetShortUINameNoTooltip] Adopts Rite"
 rite_growth.0011.notification.desc: "[convert_ruler.GetTitledFirstName] has joined [founder.GetTitledFirstName] in practicing [new_rite.GetName]"
iberian_struggle_blocks_holy_war_tt: "Declaring [holy_war|E] must not be blocked by the [iberian_struggle|E]"
