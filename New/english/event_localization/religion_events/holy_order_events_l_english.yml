 holy_order_hired_message:0 "Military Order Hired"
 holy_order.hired_message:1 "[holy_order.GetName] has been called by [actor.GetUIName]"
 holy_order_hired_by_enemy_message:0 "Enemy Military Order"
 holy_order.hired_by_enemy:1 "[holy_order.GetName] has been called by [actor.GetUIName], and now stand against us"
 holy_order.destroyed_message:1 "[title.GetName|U] has been destroyed"
 holy_order_expanded:0 "Military Order Expands"
 holy_order.new_lease:1 "[holy_order.GetName] is now leasing [barony.GetName] from [former_holder.GetTitledFirstName]"

 monastic_holy_order_expanded: "Monastic Order Expands"

 holy_order.0001.t: "The Military Order"
 holy_order.0001.desc_opening: "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] stands awaiting my farewell, [recipient.GetHerHis] belongings and entourage readied for the road.\n\n"
 holy_order.0001.desc_demand: ""I suppose there is honor in this..." [recipient.GetSheHe] grumbles, "my dying to claim some strange heathen land. I thought I would die fighting for [actor.GetPrimaryTitle.GetNameNoTier]..."\n\n[recipient.GetSheHe|U] mounts [recipient.GetHerHis] horse, asking: "Where am I to go?""
 holy_order.0001.desc: ""So, [ROOT.Char.Custom('FormOfAddressForLiege')], which Order am I to serve with prayerful heart and a ready blade?""
 holy_order.0001.desc_relation: ""Already, my sword hungers for the heathen's lousy hide, [recipient.Custom2('RelationToMeShort', ROOT.Char)]! But where am I to ride — who shall be my new [recipient.Custom('SisterBrother')]s?""
 holy_order.0001.a: "You shall join the [holy_order_1.GetName]."
 holy_order.0001.b: "The [holy_order_2.GetName] is where you belong."
 holy_order.0001.c: "The [holy_order_3.GetName] will have you."
 holy_order.0001.d:0 "You're a problem for the [holy_order_4.GetName] now."
 holy_order.0001.e:0 "I've made a mistake — you belong here!"
 holy_order.0001.toast_puppeteer:0 "[recipient.GetShortUIName] accepted [puppet_or_actor.GetShortUINamePossessive] summons to a military order"

 holy_order.0002.desc_angry: "I have spoken the sacred words and, just as your will has bound me, now I am bound to [ROOT.Char.GetFaith.HighGodName]."
 holy_order.0002.desc:0 "I will answer the call to serve a higher power, and I thank you for setting me on this path of righteousness."
 holy_order.0002.a_demand: "Good. Now go await [ROOT.Char.GetFaith.PositiveAfterLife] in silence."
 holy_order.0002.a:0 "I am sure you will serve [ROOT.Char.GetFaith.HighGodName] well!"
 holy_order.0002.toast_puppeteer:0 "[recipient.GetShortUIName] took the vows at [puppet_or_actor.GetShortUINamePossessive] request"

 char_interaction.0001.opening_low_piety:0 "For such a [ROOT.GetCharacter.Custom('GetSinfulShameful')] being as you to come crawling to a sacred order that serves [ROOT.Char.GetFaith.HighGodName]... Think on your soul's redemption before you worry further over worldly riches."
 holy_order.0200.desc_opening:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0200.desc:0 "I have heard your plea for gold, and the [order.GetName] will answer your call."
 holy_order.0200.a:0 "[ROOT.Char.GetFaith.HighGodName] smiles upon me!"
 holy_order.0200.b:0 "But... But I need the money!"

 holy_order.0202.second_time:0 "Once again I remind you that you owe my order #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! gold."
 holy_order.0202.opening:0 "You owe my order #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! gold."
 holy_order.0202.desc:0 "If you do not return the gold we will find alternative ways for you to repay us — ways agreeable to [ROOT.Char.GetFaith.HighGodName], but maybe less so to you."
 holy_order.0202.a:0 "Of course I will honor our agreement."
 holy_order.0202.a_no:0 "I will pay! Just let me find the gold..."
 holy_order.0202.a._not.tt:0 "@warning_icon! #X Not enough [gold_i][gold|E]#!"
 holy_order.0202.b_christian:0 "Is patience not a virtue?"
 holy_order.0202.b:0 "As a fellow devotee... Please lend me more time!"
 holy_order.0202.b.tt:0 "[recipient.GetTitledFirstNameNoTooltip] will give you 5 more years"
 holy_order.0202.c:0 "Maybe we can find an alternative way of payment...?"
 holy_order.0202.c.tt:0 "@warning_icon! #X The [recipient.GetTitleAsNameNoTooltip] will ask something of you#!"
 holy_order.0202.d:0 "The gold is more useful in my hands!"

 holy_order.0203.desc:0 "I do not look kindly upon those who break their word, and neither does [ROOT.Char.GetFaith.HighGodNameAlternate]. To rectify this slight you will lease the [province.GetName] to us so that we may further [ROOT.Char.GetFaith.HighGodNamePossessive] work."
 holy_order.0203.a:0 "Of course [province.GetNameNoTierNoTooltip] will be yours."
 holy_order.0203.b:0 "This is a ridiculous demand!"

 holy_order.0204.desc:0 "I do not look kindly upon those who break their word, and neither does [ROOT.Char.GetFaith.HighGodNameAlternate]. To rectify this slight you will send us your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetTitledFirstName] to do [ROOT.Char.GetFaith.HighGodNamePossessive] work."
 holy_order.0204.a:0 "I'll... I'll send [child.GetHerHim] on [child.GetHerHis] way."
 holy_order.0204.a.tt:1 "You will no longer owe the order any gold"

 holy_order.0205.desc:0 "This whole affair about the loan has been a shameful display of your greed. I will make sure the [ROOT.Char.GetFaith.ReligiousHeadName] hears about this!"
 holy_order.0205.a:0 "Curses!"

 holy_order_letter.opening: "Fellow servant of [ROOT.Char.GetFaith.HighGodNameAlternate],"
 holy_order.1001.intro: "Fervent souls flock to the [holy_order.GetName], ready to give up their mortal bodies for the [ROOT.Char.GetFaith.GetAdjective] faith. We need more land to barracks our [GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )|l]."
 holy_order.1001.end: "\n\nThe [target_barony.GetName] is perfectly suited to this purpose. May we lease it into the service of our sacred cause?"
 holy_order.1001.a: "Your request is granted. For [ROOT.Char.GetFaith.HighGodName]!"
 holy_order.1001.b: "Would [alternative_barony.GetNameNoTierNoTooltip] not serve you just as well?"
 holy_order.1001.c: "No, I will not grant you this land."

 holy_order.1011.intro: "In the [target_barony.GetName], there is good land to be tended, and a fine [grandmaster.GetFaith.HouseOfWorship] that would be well-served by a cloister of my [grandmaster.Custom('SistersBrothers')]."
 holy_order.1011.end: "\n\nWould you act as our broker, so that the [holy_order.GetName] might establish a monastery there?"
 holy_order.1011.a: "The Order may lease [target_barony.GetNameNoTierNoTooltip]."
 holy_order.1011.b: "There is tranquility in [alternative_barony.GetNameNoTierNoTooltip]?"
 holy_order.1011.c: "I fear you must send your [grandmaster.Custom('SistersBrothers')] elsewhere."

 holy_order.2001.t:0 "A Divine Purpose"
 holy_order.2001.desc:0 "When my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], [child.GetFirstName], comes to me, I quickly understand [child.GetSheHe] has something very serious to discuss.\n\n"[ROOT.Char.Custom('MotherFather')|U], my life here will forever be led in the shadow of others. Let me instead join [holy_order.GetName], and serve [child.GetFaith.HighGodName]. I have given this much thought, and it is what I wish to do.""
 holy_order.2001.a:0 "Let [child.GetFaith.HighGodNameAlternate] guide you, my [child.Custom('DaughterSon')]."
 holy_order.2001.b:0 "They may not be grand, but I have plans for you here."

 holy_order.2002.desc:0 "When my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))], [sibling.GetTitledFirstName], tells me of [sibling.GetHerHis] plans, it is clear that [sibling.GetSheHe] has been reflecting on it a long time.\n\n"There is little for me here, and if I am to serve someone, I would rather serve [sibling.GetFaith.HighGodName] [sibling.GetFaith.HighGodHerselfHimself]. I am joining [holy_order.GetName].""
 holy_order.2002.a:0 "I understand your choice, [sibling.Custom('SisterBrother')]."
 holy_order.2002.b:0 "Oh, you are absolutely #EMP not#! doing that!"

 holy_order.2003.opening:0 "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc:1 "There will always be a need for true warriors to halt any threat to the [grandmaster.GetFaith.GetAdjective] faith.\nWith many aptitudes and few prospects of inheritance, I believe your [child.Custom('DaughterSon')], [child.GetTitledFirstName], could lead a better life serving [holy_order_scope.GetName]. With us, [child.GetSheHe] will train, learn and bring great honor upon your name."
 holy_order.2003.a:0 "[child.GetHersHis|U] will be the life of a true [child.GetFaith.GetAdherentName]."
 holy_order.2003.child_joins_order:0 "[child.GetFirstName] gains [GetTrait('order_member').GetName( child.Self )] and joins the court of [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.b:0 "Perhaps you could train [alternative_child.GetFirstNameNoTooltip] instead?"
 holy_order.2003.alternative_child_joins_order:0 "[alternative_child.GetFirstName] gains [GetTrait('order_member').GetName( alternative_child.Self )] and joins the court of [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.c:0 "[child.GetHerHis|U] place is here with me."

 holy_order.2004.opening:0 "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc:0 "I have dedicated my life to [child.GetFaith.HighGodNameAlternate], but [child.GetFaith.HighGodNameSheHe] would not wish me to ignore my own family.\n\n[grandmaster.GetTitledFirstName] has given me leave to return to my old life, and become part of your [ROOT.Char.Custom('GetCourt')] once more."
 holy_order.2004.a:0 "Welcome home, my [child.Custom('DaughterSon')]!"
 holy_order.2004.b:0 "No. There is no longer a place for you here."

 holy_order.2005.t:0 "A Return Home"
 holy_order.2005.desc:0 "[child.GetTitledFirstNamePossessive] visit lasted longer than usual. Only once my [child.Custom('DaughterSon')] had ensconced [child.GetHerselfHimself] in my [ROOT.Char.Custom('GetCourt')] — gorging [child.GetHerselfHimself] on my food and harassing my servants — did I broach the topic of returning to [holy_order.GetName]. [child.GetHerHis|U] response was unfortunately enthusiastic.\n\n"Have you not heard, [ROOT.Char.Custom('MotherFather')]? [grandmaster.GetTitledFirstName] has been so generous as to relieve me of my duties to [child.GetFaith.GetName]! I am finally home, with my family.""
 holy_order.2005.a:0 "Oh, you're... here to stay?"

 holy_order.destroyed_title:0 "Military Order Disbanded"
 holy_order.destroyed_title_monastic: "Monastic Order Disbanded"

holy_order.2010.t: "A New Monastic Order"
holy_order.2010.desc: "Hermits, mystics, and dissatisfied disciples from older orders have gathered in [barony.GetNameNoTier] and labored, for years, to build their new home in the wilderness. A [leader.GetWomanMan] named [leader.Custom('SisterBrother')|U] [leader.GetFirstName] has risen as the natural head of this burgeoning Order, '[leader.GetPrimaryTitle.GetName]'... but #EMP my#! august voice has yet to be heard on this matter. I have yet, also, to propose a holy precept to enshrine as the heart of this Order's way of life.\n\nWhat shall this chorus of pure devotees sing of in [barony.GetNameNoTierNoTooltip]? What shall they labor to live in full, to think and write on? And who shall lead them in this?"
holy_order.2010.4: "[tenet_4.GetName( order_rite )], and [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]."
holy_order.2010.5: "[tenet_5.GetName( order_rite )], and [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]."
holy_order.2010.6: "[tenet_6.GetName( order_rite )], and [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]."
holy_order.2010.d: "[tenet_1.GetName( order_rite )], and [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]."
holy_order.2010.e: "[tenet_2.GetName( order_rite )], and [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]."
holy_order.2010.f: "[tenet_3.GetName( order_rite )], and [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]."
monastic_tenet_pick_tt: "[tenet_pick.GetName( order_rite )] will be the [core_tenet|E] advocated by [monastic_order.GetName]"
monastic_order_tenet_advocated_tt: "[monastic_order.GetName] advocate for [tenet_pick.GetName( order_rite )]"
founded_monastic_order_modifier: "Founded Monastic Order"
founded_monastic_order_modifier_desc: "This wise ruler aided in the conception and creation of a new monastic order, by doing so launching a new appeal directly to the divine."
pick_becomes_monastic_order_leader_tt: "[chosen_leader.GetShortUIName] becomes [ruler|E] of [monastic_order.GetName]"
pick_remains_monastic_order_leader_tt: "[chosen_leader.GetShortUIName] remains [ruler|E] of [monastic_order.GetName]"

holy_order.2009.t: "The Building of a Monastery"
holy_order.2009.desc: "Amidst quiet [province.GetTerrain.GetNameNoTooltip|l], in a place beloved of the [province.GetCulture.GetCollectiveNoun], I lay the first stone that will one-day bear the monastery of [province.GetName].\n\nMy laborers join with simple oblates to raise walls from the earth, to bring prayerful hymns from their industrious bodies. The first honored monastics — like [potential_leader.Custom('SisterBrother')|U] [potential_leader.GetName] — have come to walk this place too, and draw up plans for chantries and refectories.\n\nIn a matter of years, a new order will be born here. And, alongside stone and [ROOT.Char.Custom('GetWritingMaterial')], this order will need more sworn members."
holy_order.2009.a: "This new order must be guided by those I support."
holy_order.2009.b: "Many monastics chafe under their current order..."
holy_order.2009.b.tt: "...and would abandon their superiors for the mastery of this new order, for freedom to write a new rule."
holy_order.2009.c: "Gather wild ascetics and zealous youths."

monastic_order_creation_increased_spiritual_fulfillment: "[interactions|E] with the [monastic_holy_order|E] will provide increased [spiritual_fulfillment|E] for #high 50 years#!"
monastic_founder_become_saint_tt: "[chosen_leader.GetShortUIName] will become a [GetTrait('saint').GetName( chosen_leader.Self )] after [chosen_leader.GetHerHis] death, if [chosen_leader.GetSheHe] has #high 65+#! [GetTrait('devoted').GetName( chosen_leader.Self )] [trait_level_track_xp|E] or a [piety_level|E] of at least @piety_level_4_icon_christian! [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]"


 holy_order.2020.t: "Monastic Vows"
 holy_order.2020.desc: "At my insistence, [recipient.GetFirstNamePossessive] turns [recipient.GetHerHis] newly-robed back away from my [ROOT.Char.Custom('ResidenceBuilding')], from the [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] and nobility of the profane world. [recipient.GetSheHe|U] is inducted into [archabbot.GetPrimaryTitle.GetName].\n\nLike the other [recipient.Custom('SistersBrothers')] of [recipient.GetHerHis] Order, [recipient.GetFirstNameNoTooltip] swears duty and fidelity to their holy community. [recipient.GetSheHe|U] commits [recipient.GetHerHis] flesh to [recipient.GetFaith.HighGodName], and [recipient.GetHerHis] mind to the reverence of [recipient.GetFaith.PositiveAfterLife].\n\n[recipient.GetFirstNameNoTooltip] shall reside in [archabbot.GetCapitalLocation.GetName], or another of the Order's sanctuaries, and there begin [recipient.GetHerHis] life of study and contemplation."
 holy_order.2020.aa: "The Order has gained an industrious mind."
 holy_order.2020.aa.tt: "[recipient.GetFirstNamePossessiveNoTooltip] skills of stewardship will well-serve their ceaseless labors."
 holy_order.2020.a: "The Order has gained a wise disciple."
 holy_order.2020.a.tt: "No place in this mortal world could be more right for the learned [recipient.GetFirstNameNoTooltip]."
 holy_order.2020.b: "The [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] of their Patron is no scullery-[recipient.Custom('GirlBoy')]..."
 holy_order.2020.c: "A 'donation' will ensure [recipient.GetFirstNameNoTooltip] is pampered."
 holy_order.2020.d: "[recipient.GetHerHis|U] life belongs to the Order now."
 holy_order.2020.toast_puppeteer:0 "[recipient.GetShortUIName] joined a monastic order at [puppet_or_actor.GetShortUINamePossessive] request"

take_vows_improve_education_learning_tt: "@skill_learning_icon![learning|E] [education|E] outcome will improve"
take_vows_improve_education_stewardship_tt: "@skill_stewardship_icon![stewardship|E] [education|E] outcome will improve"

recently_joined_holy_order_desc: "[recipient.GetShortUIName] joined [recipient.GetHerHis] Order within the last 5 years"
child_in_holy_order_desc: "[recipient.GetShortUIName] is a child promised to [recipient.GetHerHis] Order"

custom.every_domain_monastic_order: "Every [monastic_holy_order|E] in your [domain|E]"
order_gains_minor_tenet_popularity_tt: "Their [core_tenet|E] gains #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! [tenet_popularity|E]"
new_order_gains_minor_tenet_popularity_tt: "Your new [monastic_holy_order|E] will provide an additional #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! [tenet_popularity|E] to its [core_tenet|E]"
holy_order.2030.t: "Donation: [recipient.GetPrimaryTitle.GetNameNoTooltip]"
holy_order.2030.desc: "My riches are sent into the vaults of [recipient.GetTitledFirstNamePossessive] monasteries. A donation that shall fund the reverent working of lands, the copying of holy texts, the worldly aims of [recipient.GetPrimaryTitle.GetName]...\n\n...and a thousand prayers devoted to the cause of my immortal soul. For monastics live to pray, and their singular, righteous devotion — it is said — means that [ROOT.Char.GetFaith.random_GoodGodNames|U] takes special care to heed their prayers.\n\n#EMP [actor.GetFaith.HighGodName|U], do you hear them speak my name?#!"
holy_order.2030.desc_desperate_plea: "#EMP Do you know how I've grovelled and begged — like a wretch — for your mercy?#!"
holy_order.2030.desc_huge_donation: "#EMP Do you know the fortune I have parted with...?#!"
 holy_order.2030.a: "New advocates for my salvation."
 holy_order.2030.toast_puppeteer:0 "[recipient.GetShortUIName] accepted [puppet_or_actor.GetShortUINamePossessive] monastic donation"

holy_order.2031.opening: "[actor.GetCustom('SisterBrother')|U],"
holy_order.2031.desc: "I have thought and prayed on your request, and I fear no donative can induce my monks to appeal to [recipient.GetFaith.HighGodName] on your behalf. Your salvation seems beyond even us."
holy_order.2031.a: "Bah! I still have my coin, at least."
 holy_order.2031.toast_puppeteer:0 "[recipient.GetShortUIName] refused [puppet_or_actor.GetShortUINamePossessive] monastic donation"

already_has_monastic_lease_tt: "[target.GetNameNoTier] is already [leased|E] to a [monastic_holy_order|E]"

lease_title_to_existing_monastic_order_interaction: "Bestow a Monastery"
lease_title_to_existing_monastic_order_interaction_desc: "[lease|E] a [temple_holding|E] to [recipient.GetPrimaryTitle.GetName], gaining [spiritual_fulfillment|E], [piety|E], and increased access to the Order"
INTERACTION_LEASE_DONATION: "Purchase Ancillary Properties"
no_valid_temple_holdings_to_lease_tt: "There are no [temple_holdings|E] in your [domain|E] which are available to [lease|E]"

monastic_onslaught_modifier_tt: "[target_county.GetName] gains [GetModifier('monastic_onslaught_modifier').GetNameWithTooltip] for #high 20 years#!"

holy_order.2040.opening: "[actor.GetFirstName] of [actor.GetPrimaryTitle.GetNameNoTier], O Benefactor,"
holy_order.2040.desc: "It is done. A chapter of [recipient.GetPrimaryTitle.GetNameNoTier] will adjoin the [actor.GetFaith.HouseOfWorship] in [target.GetNameNoTier], and there, in the heart of [target.GetDeJureLiegeOfTier( 'duchy' ).GetNameNoTier], we will stow ancient texts from the libraries of [recipient.GetCapitalLocation.GetName].\n\n"
holy_order.2040.desc_nuns: "And, there, our [recipient.GetFaith.DevoteeFemalePlural] will sing out prayers to [actor.GetFaith.HighGodName] on your behalf."
holy_order.2040.desc_monks: "And, there, our [recipient.GetFaith.DevoteeMalePlural] will sing out prayers to [actor.GetFaith.HighGodName] on your behalf."
 holy_order.2040.desc_huge_donation: "Such is the Order's gratitude for your holy charity."
 holy_order.2040.desc_rite: "\n\nKnow that the chapter will keep the observances of [recipient.GetRite.GetName], as every house of our order does."
 holy_order.2040.a: "May your Order prosper!"
 holy_order.2040.toast_puppeteer:0 "[recipient.GetShortUIName] accepted [puppet_or_actor.GetShortUINamePossessive] offer to lease a barony"

holy_order.2041.opening: "[actor.GetFirstName] of [actor.GetPrimaryTitle.GetNameNoTier],"
holy_order.2041.desc: "We, the purest of [recipient.GetFaith.HighGodNamePossessive] devotees, we who bring the utter sanctity of [recipient.GetFaith.PositiveAfterLife] to this miserable Earth... fear a blight has fallen over the realm of [actor.GetPrimaryTitle.GetNameNoTier] that even our prayers cannot dispel.\n\nWhile the soul of your realm is abjectly divorced from [recipient.GetFaith.HighGodName], [recipient.GetPrimaryTitle.GetName] cannot venture to [target.GetNameNoTier]."
 holy_order.2041.a: "Their 'purity' — folly!"
 holy_order.2041.toast_puppeteer:0 "[recipient.GetShortUIName] refused [puppet_or_actor.GetShortUINamePossessive] offer to lease a barony"
monastic_order_entering_interaction_range_tt: "@alert_icon! #alert_trial [monastic_order.GetName] will enter [holy_order_vicinity|E], enabling their [interactions|E]#!"

holy_order.2050.t: "A Movement Rises in [barony.GetNameNoTierNoTooltip]"
holy_order.2050.desc: ""Are [target_order.GetName] still suffering... as the hermits in the desert did?" — so begin all of [clerical_helper.GetNamePossessive] fiery missives.\n\n"Is [target_lessee.GetTitledFirstName] dressing [target_lessee.GetHerselfHimself] in gold?" — ask the reformers' sermons in [barony.GetNameNoTier], and they end with: #EMP "A new way! A new Rule!"#!\n\nThe monastery is fast becoming a hotbed of pious reform and dissent. Its residents are hardly [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip] any longer, and hardly content with stale talk of [target_order_tenet.GetName( founder.GetRite )]. But their reforming spirit must still be directed to one new principle, and one mind."
msg_order_movement_took_monastery.t: "[chosen_leader.GetPrimaryTitle.GetAdjectiveNoTooltip] Movement"
movement_took_monastery_notification_3_tt: "[new_holy_order.GetName] took [barony.GetNameNoTier] and other [leases|E] from [target_order.GetName]"
movement_took_monastery_notification_2_tt: "[new_holy_order.GetName] took [barony.GetNameNoTier] and [lease_2.GetNameNoTier] from [target_order.GetName]"
movement_took_monastery_notification_tt: "[new_holy_order.GetName] took the [lease|E] of [barony.GetNameNoTier] from [target_order.GetName]"
movement_took_monastery_patron_notification_tt: "[founder.GetShortUIName] sanctioned this reforming [monastic_holy_order|E]"
