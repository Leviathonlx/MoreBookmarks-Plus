l_english:
 head_of_faith.0000.new_faith_submitted_for_hook: "[ROOT.Char.GetTitledFirstName] has submitted to your [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 head_of_faith.0000.wishes_to_schism_caliphate_flag_added: "Abandoning your chosen [GetPlayer.GetFaith.ReligiousHeadTitleName] will be easier for your lifetime"
 head_of_faith.0000.t: "Heirs of the Prophet"
 head_of_faith.0000.desc: "and all true believers expect me, as the faith's preeminent member, to pledge myself to an existing caliph.\n\nOnly by submission to the ultimate authority below [ROOT.Char.GetFaith.HighGodName] can I derive my own authority, no matter what our other theological differences.\n\nThe main question before me is, of course, to #EMP whom#! — though the smartest amongst us also ask how #EMP sincerely#! — I will pledge..."

 head_of_faith.0100.t: "The [ROOT.Char.GetFaith.ReligiousHeadTitleName]'s Authority"
 head_of_faith.0100.desc: "This day, [ROOT.Char.GetRite.GetName] has broken from [ROOT.Char.GetFaith.GetName]; the divide formally acknowledged. Where once we prayed as one with [hof.GetRite.GetName], we now stand apart in the very shape of our devotion.\n\nYet [hof.GetTitledFirstName] remains at the head of all who dwell beneath [ROOT.Char.GetFaith.HighGodName]. Should we bow our heads and heed [hof.GetTitledFirstNamePossessive] guidance still, or have the differences in our beliefs grown too great?"
 head_of_faith.0100.a: "Our faith unites us: we submit to [hof.GetTitledFirstNamePossessiveNoTooltip] authority!"
 head_of_faith.0100.b: "We shall heed [hof.GetHerHis] will... #EMP for now#!."

 head_of_faith.0001.t: "$head_of_faith.0000.t$: Sunni"
 head_of_faith.0001.desc: "We [ROOT.Char.GetFaith.GetAdherentName] have chosen to follow the path of the heirs of Abu Bakr, $head_of_faith.0000.desc$"
 head_of_faith.0001.a: "Realignment with Sunni orthodoxy is our only option."
 head_of_faith.0001.b: "We must continue cleaving to [old_caliph.GetFaith.GetAdjectiveNoTooltip] authority!"
 head_of_faith.0001.c: "[sunni_caliph.GetTitledFirstNameNoTooltip] has our #EMP present#! loyalties..."
 head_of_faith.0001.d: "We shall follow [old_caliph.GetTitledFirstNameNoTooltip]... for now..."
 head_of_faith.0001.e: "I #EMP am#! the [ROOT.Char.GetFaith.ReligiousHeadTitleName]"

 head_of_faith.0011.t: "$head_of_faith.0000.t$: Shia"
 head_of_faith.0011.desc: "[ROOT.Char.GetFaith.GetName] follows the infallible line of Ali, $head_of_faith.0000.desc$"
 head_of_faith.0011.a: "Mainstream Shia thought calls to us."
 head_of_faith.0011.b: "$head_of_faith.0001.b$"
 head_of_faith.0011.c: "[shia_caliph.GetTitledFirstNameNoTooltip] commands us. For the moment."
 head_of_faith.0011.d: "$head_of_faith.0001.d$"

 head_of_faith.0021.t: "$head_of_faith.0000.t$: Muhakkima"
 head_of_faith.0021.desc: "Rejecting the tawdry politics of Sunni and Shia has left [ROOT.Char.GetFaith.GetName] an adherent to the Muhakkima strand of Islam. Though the common members of the movement do not expect me to pledge submission to an existing caliph, they might accept one if I make my allegiance clear."
 head_of_faith.0021.a: "We can elect our own leaders."
 head_of_faith.0021.b: "$head_of_faith.0001.b$"

 head_of_faith.0031.t: "$head_of_faith.0000.t$: Zandaqa"
 head_of_faith.0031.desc: "As Zandaqa, we care little for how the other Islamic sects trace the line of the Prophet's succession, and they dislike us in return. My fellow [ROOT.Char.GetFaith.GetAdherentNamePlural] certainly don't expect me to declare our submission to any existing caliph.\n\nYet, perhaps by pledging allegiance to one of the great powers of Islam, a measure of security and tolerance can be bought for our faith..."
 head_of_faith.0031.a: "$head_of_faith.0021.a$"
 head_of_faith.0031.b: "$head_of_faith.0001.a$"
 head_of_faith.0031.c: "$head_of_faith.0011.a$"
 head_of_faith.0031.d: "$head_of_faith.0001.b$"
 head_of_faith.0031.rejection_body: "rejects the pledge"
 head_of_faith.0031.acceptance_body: "accepts the pledge"
 head_of_faith.0031.rejection.outcome: "You are forced to take your own path regardless"
 head_of_faith.0031.b.rejection: "@piety_level_0_icon_islam! [sunni_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.b.acceptance: "@piety_level_3_icon_islam! [sunni_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0031.c.rejection: "@piety_level_0_icon_islam! [shia_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.c.acceptance: "@piety_level_3_icon_islam! [shia_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0031.d.rejection: "@piety_level_0_icon_islam! [old_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.d.acceptance: "@piety_level_3_icon_islam! [old_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0032.t: "Pledge of Faith"
 head_of_faith.0032.desc: "To the [pledge_target.GetTitledFirstNameNoTooltip], we, the [pledgeing_individual.GetFaith.GetAdherentNamePlural], wish to pledge loyalty to you and have you as our [head_of_faith|E].\n\nWill you please take us under your guidance?"
 head_of_faith.0032.a: "@piety_level_3_icon_islam! Of course, how could I say no?"
 head_of_faith.0032.b: "@piety_level_0_icon_islam! Away with you, vile beggars!"
 head_of_faith.0032.notif.a: "[pledge_target.GetTitledFirstNameNoTooltip] accepted your pledge!"
 head_of_faith.0032.notif.b: "[pledge_target.GetTitledFirstNameNoTooltip] rejected your pledge!"
