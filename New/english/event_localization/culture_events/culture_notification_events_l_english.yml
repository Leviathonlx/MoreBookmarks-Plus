l_english:
 culture_notification.0010.t:0 "Tradition Forsaken"
 culture_notification.0010.desc:2 "The [this_player.GetCulture.GetName] [culture|E] has forsaken the [tradition.GetName] [tradition|E]"
 culture_notification.0011.t:1 "Tradition Embraced"
 culture_notification.0011.desc:2 "The [this_player.GetCulture.GetName] [culture|E] has embraced the [tradition.GetName] [tradition|E]"


 culture_notification.1001.t:0 "Hybrid Culture: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1001.desc:0 "[founder.GetTitledFirstName] has formed the [new_culture.GetName|V] [hybrid_culture|E] from the [parent_1.GetName] and [parent_2.GetName] Cultures"

 culture_notification.1011.t:0 "The [new_culture.GetNameNoTooltip] Hybridization"
 culture_notification.1011.intro:1 "Years of exchange have drawn the [parent_1.GetName] and [parent_2.GetName] peoples ever closer — close enough that something new has taken root: a people who call themselves [new_culture.GetName].\n\n"
 culture_notification.1011.blend: "The blend is plain to see. They keep the [parent_1.GetNameNoTooltip] tradition of [tradition_1.GetName] alongside the [parent_2.GetNameNoTooltip] custom of [tradition_2.GetName]. Together, they define this new people."
 culture_notification.1011.blend_fallback: "Neither parent claims the greater share — the [new_culture.GetNameNoTooltip] way blends both worlds seamlessly."
 culture_notification.1011.outro.other:0 "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder:0 "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other:0 "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder:0 "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip:0 "The [hybrid_culture|E] [new_culture.GetName] has formed from the [parent_1.GetName] and [parent_2.GetName] [cultures|E]."



 culture_notification.1101.t:0 "Culture Diverged: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1101.desc:0 "[founder.GetTitledFirstName] has created [new_culture.GetName|V], a [divergent_culture|E] of [parent_1.GetName]"

 culture_notification.1111.t:0 "The [new_culture.GetNameNoTooltip] Divergence"
 culture_notification.1111.intro:0 "A shifted dialect here, a new custom there — easy to miss at first. No longer: the [parent_1.GetCollectiveNoun] of [founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] now call themselves [new_culture.GetName].\n\n"
 culture_notification.1111.tradition.new: "The traditions of their forebears are giving way to [new_tradition.GetName]."
 culture_notification.1111.tradition.lost: "The [lost_tradition.GetName] ways of the [parent_1.GetCollectiveNounNoTooltip] they have cast aside."
 culture_notification.1111.ethos.bellicose:0 "Beset by foes and rivals, the [new_culture.GetCollectiveNounNoTooltip] have grown [new_culture.GetEthos.GetName], trusting their fortunes to the force of arms."
 culture_notification.1111.ethos.bureaucratic:1 "The [new_culture.GetCollectiveNounNoTooltip] have turned [new_culture.GetEthos.GetName], taking comfort in long charters and even longer chronicles."
 culture_notification.1111.ethos.courtly:1 "Devoted to manners and ceremony, the [new_culture.GetCollectiveNounNoTooltip] now hold to a [new_culture.GetEthos.GetName] way of life."
 culture_notification.1111.ethos.communal:0 "In shared triumph and tragedy alike, the [new_culture.GetCollectiveNounNoTooltip] have become [new_culture.GetEthos.GetName], bound tight to their neighbors."
 culture_notification.1111.ethos.stoic:0 "In a dangerous and unpredictable world, the [new_culture.GetCollectiveNounNoTooltip] have turned [new_culture.GetEthos.GetName], prizing grit above all."
 culture_notification.1111.ethos.spiritual:0 "Looking within for answers, the [new_culture.GetCollectiveNounNoTooltip] have become a [new_culture.GetEthos.GetName] people, more devout than ever before."
 culture_notification.1111.ethos.egalitatian:0 "Birth now counts for less than merit among the [new_culture.GetCollectiveNounNoTooltip] — theirs is an [new_culture.GetEthos.GetName] society."
 culture_notification.1111.ethos.unchanged:0 "Their outlook on life is unchanged, yet divisions of policy and border have made one people into two."
 culture_notification.1111.outro.other:0 "\n\nWhether by cunning or conviction, [founder.GetTitledFirstName] now stands at the head of this cultural awakening."
 culture_notification.1111.outro.founder:0 "\n\nThe [new_culture.GetNameNoTooltip] people look to me now. Our future begins here."
 culture_notification.1111.a.other:0 "We will see how the situation develops."
 culture_notification.1111.a.founder:0 "To a new age, a new era, a new people!"
 culture_notification_tooltip:0 "The [divergent_culture|E] [new_culture.GetName] has branched off from the [parent_1.GetName] [culture|E]."
