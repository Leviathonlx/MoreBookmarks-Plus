 great_project_type_pam_mass_rite_conversion: "Mass Conversion"
 great_project_type_pam_mass_rite_conversion_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'great_project_type_pam_mass_rite_conversion_desc_christian', 'great_project_type_pam_mass_rite_conversion_desc_generic' )]"
 great_project_type_pam_mass_rite_conversion_desc_christian: "With sufficient resources, we can bring the light of the Lord not simply to individual heathens but to entire pagan [realms|E]. Through our tutelage, they will learn the most righteous [rite|E], and in turn grow [christendom|E]."
 great_project_type_pam_mass_rite_conversion_desc_generic: "With sufficient resources, we can carry the beliefs of our faith beyond scattered converts and into entire [realms|E] where hostile [faiths|E] still hold sway. Through our tutelage, their people will learn the rightful [rite|E], strengthening Us across the land."
