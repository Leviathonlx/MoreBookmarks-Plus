l_english:
 great_project_type_pam_cathedral_01: "Raise a $building_type_great_project_cathedral_01$"
 great_project_type_pam_cathedral_01_desc: "Set the gleaming cross atop firm stone walls, atop stately domes and high towers! Bring the wondrous light of Heaven to Earth, and have it shine on a holy prelate's throne and altar.\n\nAfter years of noble toil, a great beacon will shine out to worshipers near and far." 

 great_project_type_pam_cathedral_02: "Raise a $building_type_great_project_cathedral_02$"
 great_project_type_pam_cathedral_02_desc: "Let pointed arches climb and stained glass blaze!\n\nLike a Lazarus, this noble cathedral will be born anew, there to lead us into a new age."

 great_project_type_pam_cathedral_03: "Raise a $building_type_great_project_cathedral_03$"
 great_project_type_pam_cathedral_03_desc: "May embellishments of tracery and curling stone be a crown of holy fire signifying a new reign for this glorious edifice!\n\nA long enlargement will crown an existing [GetBuilding('great_project_cathedral_02').GetName|V] as a [GetBuilding('great_project_cathedral_03').GetName|V], its spires shepherding the faithful through the end times."

