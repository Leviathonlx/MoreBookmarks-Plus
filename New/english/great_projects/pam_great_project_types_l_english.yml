 pam_great_projects_events.0002.t: "$game_concept_grand_cathedral$: Holy Frescoes for [province.GetNameNoTooltip]"
 pam_great_projects_events.0002.desc: "While priests may consult the word of God, it is holy images that illustrate the truth and glory of the Lord to the flock.\n\nWith the necessary funds gathered and icon painters assembled, I must decide which scenes from scripture will adorn the vaults, walls, and ceilings."
 pam_great_projects_events.0002.a: "The three Magi at the birth of Christ."
 pam_great_projects_events.0002.b: "St. Jerome in the desert with his lion."
 pam_great_projects_events.0002.c: "Abraham and Lot leaving Egypt for Canaan."
 pam_great_projects_events.0002.d: "Annunciation to the Blessed Virgin Mary."
 pam_great_projects_events.0002.e: "St. Augustine's heart aflame with knowledge of the Lord."
 pam_great_projects_events.0002.f: "Christ washing the feet of the Apostles."
 pam_great_projects_events.0002.mystic_xp: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide increased [trait_level_track_xp|E] for those with the [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]"
 pam_great_projects_events.0002.scholar_xp: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide [trait_level_track_xp|E] for those with the [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E]"
 pam_great_projects_events.0002.pilgrim_xp: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide [trait_level_track_xp|E] for those with the [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E]"
 pam_great_projects_events.0002.piety: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @piety_icon![piety|E]"

 pam_great_projects_events.0002.learning_xp: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @skill_learning_icon![learning|E] [lifestyle_experience|lE], and [spiritual_fulfillment|E] to the faithful"

 pam_great_projects_events.0002.stress_loss: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @stress_loss_icon![stress_loss|E]"

 cathedral_stained_glass_contributor_tt: "You have the [GetPrestigeLevelName('(int32)2')] [prestige_level|E] or higher, the [GetPietyLevelName('(int32)3')] [piety_level|E] or higher, or a [kingdom|E]-tier [title|E]"
 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$: Painted Light Over [province.GetNameNoTooltip]"
 pam_great_projects_events.0003.desc: ""#EMP Bright is that which is brightly coupled with the bright, and bright will be the noble work which is pervaded by the new light.#!" [religion_buddy.GetTitledFirstName] says when laying eyes on the cut glass, gleaming in the sun.\n\nThe glazier [glazier.GetTitledFirstName], has laid fragments of [Glossary('pot metal','POT_METAL_GLOSS')] on whitewashed tables for us to better peruse prospective designs.\n\nI declare, "This window will be seen from both the nave and across [province.GetNameNoTooltip], it must depict...""
 pam_great_projects_events.0003.a: "A Tree of Jesse, upholding [ROOT.Char.GetDynastyNameNoTooltip] legitimacy."
 pam_great_projects_events.0003.a.flavor: "[Glossary('Tree of Jesse','TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @dynasty_prestige_icon![dynasty_prestige|E] to [dynasty|E] members who visit as [travel|E] leaders"
 pam_great_projects_events.0003.b: "A donor panel with your portrait and arms."
 pam_great_projects_events.0003.b.tt: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @prestige_icon![prestige|E] to visitors"
 pam_great_projects_events.0003.c: "Pilgrim miracle scenes, to beckon worshipers from afar."
 pam_great_projects_events.0003.c.tt: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide increased [trait_level_track_xp|E] for those with the [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E]"
 pam_great_projects_events.0003.d: "A Marian window, with a perpetual lamp before it."
 pam_great_projects_events.0003.d.flavor: "He shall keep a lamp of oil and candles lit before the image in glass of [blessed_mary.GetTitledFirstName]."
 pam_great_projects_events.0003.d.tt: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @stress_loss_icon![stress_loss|E] and [spiritual_fulfillment|E]"
 pam_great_projects_events.0003.d.dulia.tt: "Having [GetTenetType('tenet_dulia').GetBaseName] as a [personal_tenet|E] grants greater [spiritual_fulfillment|E] on visit"
 pam_great_projects_events.0003.e: "A cycle of martyrdom at the hand of a king."
 pam_great_projects_events.0003.e.tt: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] grants zealous visitors extra @piety_icon![piety|E] and @stress_loss_icon![stress_loss|E]."
 pam_great_projects_events.0003.e.owner_msg.title: "Martyrdom in Glass"
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.GetTitledFirstName] has commissioned a stained glass cycle of martyrdom for the [grand_cathedral|E]. The subject moves you to deeper devotion."
 TREE_OF_JESSE_GLOSS: "The Tree of Jesse depicts the ancestry of Christ rising from the reclining figure of Jesse, father of David. Stained glass church windows would depict the biblical royal line in relation to a reigning dynasty, denoting divine kingship. Key examples are seen at Chartres and Saint-Denis."
 POT_METAL_GLOSS: "Pot metal glass is colored in the melting pot by stirring metallic oxides into the batch, so the hue runs through the whole pane rather than resting on the surface. Master glaziers or vitrearius cut the cooled sheets into pieces and laid them on whitewashed boards to see how the light would fall before leading the window."

 #Grand Cathedral is funded and started
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$: The First Stone Laid"
 pam_great_projects_events.0005.desc.intro: "The first stone is laid! Like an acorn preceding an oak, the seat of [owner.GetTitledFirstName] will grow into an edifying monument. Each stone and timber will radiate the glory of [ROOT.Char.GetFaith.HighGodName] to all [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] in the [owner.GetPrimaryTitle.GetNameNoTier] and wider Christendom.\n\n[CharMyFirstNames(founder)|U] magnanimity in funding the construction will echo out from the bells and be in the mouth of every worshiper."
 pam_great_projects_events.0005.desc.contributor: "\n\nNotably, [optional_contributor.GetTitledFirstNamePossessive] contribution of [contribution.GetName] will further immortalize our [cathedral_building.GetName]."
 pam_great_projects_events.0005.desc.outro: "Let the great work begin!"
 pam_great_projects_events.0005.a: ""Our children will see it fulfilled.""
 
 #Grand Cathedral Progress Events
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$: Laid Out With Divine Order"
 pam_great_projects_events.0006.desc.intro_architect: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] points to"
 pam_great_projects_events.0006.desc.intro_no_architect: "I look out on"
 pam_great_projects_events.0006.desc.intro: "a series of wooden stakes, with rope drawn taut between them forming the outline of an enormous cross; a vision of the cruciform building to come."
 pam_great_projects_events.0006.desc.steward_founder: "\n\nI have seen this process in my studies!\n\n"You must be $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.steward_architect: "\n\n"But how does one plan for such a grand edifice?" I ask."
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n"We are $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "employing [Glossary('ad quadratum','AD_QUADRATUM_GLOSS')]! The Lord has provided us divine order; with the use of a square we can extrapolate the proportions for a building more grand than any [ROOT.Char.Custom('ResidenceBuilding')].""
 pam_great_projects_events.0006.desc.foundations: "\n\nI see digging will soon begin for the foundations."
 pam_great_projects_events.0006.a: "Dig a crypt for [founder.GetDynastyNameNoTooltip] ancestors."
 pam_great_projects_events.0006.a.tt: "A [GetDomicileBuilding('cathedral_crypt_01').GetName|V] is built in [owner.GetShortUINamePossessive] [cathedral_complex|E], honoring the [founder.GetDynastyName] [dynasty|E]"
 pam_great_projects_events.0006.b: "Extend the nave to account for pilgrims."
 pam_great_projects_events.0006.b.tt: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide improved [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait_level_track_xp|E] and @piety_icon![piety|E] for visiting pilgrims"
 pam_great_projects_events.0006.c: "God alone can guide the proceedings."
 AD_QUADRATUM_GLOSS: "#EMP Ad quadratum#! — Latin for \"by the square.\" Medieval master masons laid out a building site with simple proportional systems. They used the ratio of a square's side to its diagonal. A rectangle with those two lengths as its sides was seen to have a harmonious shape. From this single base unit, the mason could derive a chain of larger and smaller squares and rectangles and be sure each part of the plan would meet the next."

 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$: The Heaving Ribs of Heaven"
 pam_great_projects_events.0007.desc.intro_architect: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] leads me through a great forest of beams. The cathedral scaffolding stands like a wooden church in its own right, supporting the masons hard at work on the stone vaulting."
 pam_great_projects_events.0007.desc.intro_no_architect: "I walk through a great forest of beams. The cathedral scaffolding stands like a wooden church in its own right, as it supports masons working on the vaulting."
 pam_great_projects_events.0007.desc.architect: "\n\n"Once completed, these vaults will shelter worshipers from the elements and guide our prayers to the high heavens.""
 pam_great_projects_events.0007.desc.architect_says: "[architect.GetSheHe] says."
 pam_great_projects_events.0007.desc.outro: "\n\nAs I rest my gaze on a bay of completed vaulting, they call to mind the ribs of the great fish who swallowed Jonah. Such is the glory of the House of God, that one can be transported beneath the sea or up to the stars."
 pam_great_projects_events.0007.a: "Adorn the vaults with the night sky."
 pam_great_projects_events.0007.a.tt: "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide improved [trait_level_track_xp|E] for those with the [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]"
 pam_great_projects_events.0007.b: "Preach a sermon of Jonah-like repentance."
 pam_great_projects_events.0007.b.tt: "Your [faith|E] gains @fervor_icon!#P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#! [fervor|E]"
 pam_great_projects_events.0007.c: "Let the masons get on with it."
 fervor_gain_cathedral_jonah_sermon: "Repentance preached at the [grand_cathedral|E] construction"

 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$: Casting the Voice of God"
 pam_great_projects_events.0008.desc.intro: "Construction progresses well, but the Cathedral is without a voice to summon worshipers from across the [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.desc.architect: "\n\n[architect.GetFirstName] tells me we must cast a great bronze bell!"
 pam_great_projects_events.0008.desc.no_architect: "\n\nWe must cast a bell!"
 pam_great_projects_events.0008.desc.need_bell: "A risky and expensive endeavor; the coffers of [founder.GetPrimaryTitle.GetNameNoTier] are still reeling from the cost of the raw material alone."
 pam_great_projects_events.0008.desc.plague_named: "\n\nRegrettably, the bell maker perished in the [epidemic.GetName]."
 pam_great_projects_events.0008.desc.plague_generic: "\n\nRegrettably, the bell maker perished in the recent pestilence."
 pam_great_projects_events.0008.desc.outro: "His son, [bell_maker_son.GetFirstName], assures me the secret knowledge was passed to [bell_maker_son.GetHerHim] at [bell_maker_son.GetHerHis] father's deathbed and can cast the bell."
 pam_great_projects_events.0008.desc.ordinary_body: "\n\n[bell_maker_son.GetFirstName], an ambitious young bronze-smith trained under a local master, has come forward. [bell_maker_son.GetSheHe|U] yearns to prove [bell_maker_son.GetHerHis] worth by casting a bell worthy of the [cathedral_building.GetName] of [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.a: "If he fails, I will kill him."
 pam_great_projects_events.0008.a.tt: "If the casting fails, you will execute [bell_maker_son.GetShortUIName]"
 pam_great_projects_events.0008.belltower_may.tt: "A [GetDomicileBuilding('cathedral_belltower_02').GetName|V] may be built in [owner.GetShortUINamePossessive] [cathedral_complex|E]"
 pam_great_projects_events.0008.aa: "If he fails, I will flay the flesh from his body."
 pam_great_projects_events.0008.b: "He could be an instrument of the Lord."
 pam_great_projects_events.0008.b.tt: "You put your faith in [bell_maker_son.GetShortUIName] to cast the bell"
 pam_great_projects_events.0008.b.flavor: "Was David not but a young shepherd when he slew Goliath?"
 pam_great_projects_events.0008.c: "Find a safe bet, even if he is not the son of a master."
 pam_great_projects_events.0008.duel.success: "The cast succeeds! A [GetDomicileBuilding('cathedral_belltower_02').GetName|V] will be built in [owner.GetShortUINamePossessive] [cathedral_complex|E]"
 pam_great_projects_events.0008.duel.failure: "The cast fails... you must decide how to proceed"
 pam_cathedral_bell_casting_duel: "[CHARACTER.GetShortUINamePossessive|U] [learning|E]"
 pam_cathedral_bell_casting_duel_first: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_first_past: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 
 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$: And God Spoke"
 pam_great_projects_events.0009.desc.body: "I watch as [bell_maker_son.GetFirstName] runs back and forth, marshaling the workers.\n\n[bell_maker_son.GetSheHe|U] constantly challenges [bell_maker_son.GetHerHis] father's old team, insisting on [bell_maker_son.GetHerHis] own way in choosing the location of the pit, the proper clay for the mold and firing of the furnaces."
 pam_great_projects_events.0009.desc.body.architect: "[architect.GetFirstName] and I watch as [bell_maker_son.GetFirstName] runs back and forth, marshaling the workers.\n\n[bell_maker_son.GetSheHe|U] constantly challenges [bell_maker_son.GetHerHis] father's old team, insisting on [bell_maker_son.GetHerHis] own way in choosing the location of the pit, the proper clay for the mold and firing of the furnaces."
 pam_great_projects_events.0009.desc.success_end: "\n\nThe molten bronze eases into the mold as if guided by God's hand, and emerges complete. It is then hoisted and rings out a clarion call to all [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]:\n\n"Come to the house of the Lord!""
 pam_great_projects_events.0009.a: "Let the [province.Custom('GetTerrainType')|l] of [province.GetNameNoTooltip] hear God's voice."
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$: A Herald of Doom!"
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end: "\n\nThe molten bronze screams in the mold, but emerges complete. It is then hoisted, pulled back, but as the clapper hits the sound bow, only a dull thud is heard, followed by a crack. A herald of doom!"
 pam_great_projects_events.0010.a: "Promises must be kept."
 pam_great_projects_events.0010.a.tt: "[bell_maker_son.GetShortUIName|U] is executed"
 pam_great_projects_events.0010.b: "The cracked bell is punishment enough."
 pam_great_projects_events.0010.b.faith: "The Lord has a plan for him yet."
 pam_great_projects_events.0010.c: "Melt the bronze. Forge something sharper."
 pam_great_projects_events.0010.c.tt: "The cracked bell is recast into a torture device; [bell_maker_son.GetShortUIName] is its first victim. Future craftsmen at [founder.GetCapitalLocation.GetNameNoTooltip] will know obedience."
 pam_great_projects_events.0010.c.intrigue_xp.tt: "You gain [intrigue_lifestyle|E] [experience|E] instead"
 pam_great_projects_events.0010.d: "Let this be a lesson in humility."

 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$: As If By the Lord's Hand"
 pam_great_projects_events.0011.desc.intro: "Checking in on the construction progress of the [cathedral_building.GetName] of [province.GetNameNoTooltip], my ears are assaulted by the grinding squeal of a massive turning wooden structure."
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName] points out the giant treadwheel, with a pair of workmen walking inside."
 pam_great_projects_events.0011.desc.no_architect: "\n\nI spot the source of the noise, a giant treadwheel, with a pair of workmen walking inside."
 pam_great_projects_events.0011.desc.outro: "\n\nAs if by the hand of God, its ropes and pulleys hoist massive pieces of freshly cut [Glossary('ashlar','ASHLAR_GLOSS')] and buckets of mortar up to the in-progress roof. I stare in awe at the load which would have broken the backs of hodmen in the yard below."
 pam_great_projects_events.0011.a: "We [founder.GetCulture.GetCollectiveNounNoTooltip] must glean what we can from the great wheel."
 pam_great_projects_events.0011.a.tt: "Your [culture|E] gains @culture_icon!#P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#! progress towards its current [cultural_fascination|E]"
 pam_great_projects_events.0011.b: "Many projects in [founder.GetCapitalLocation.GetNameNoTooltip] could benefit from this!"
 pam_great_projects_events.0011.c: "Impressive, but I would leave such deeds to the Lord."
 ASHLAR_GLOSS: "Ashlar is precisely cut and dressed stone, squared and smoothed on the ground. Precise planning was necessary to have stones match once they were hoisted to the heights necessary for building cathedrals."

 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$: A Higher Calling"
 pam_great_projects_events.0013.desc: "The thunk of the carpenter's mallets echo out above us, a foretelling of the acoustics that will soon bathe worshipers in the Word of God.\n\n[architect.GetFirstName] explains, "It is to be a modest loft where the canons will lead the liturgy, our own [Glossary('cantoria','CANTORIA_GLOSS')]! Indeed, we must use a different voice when we address our Lord than when we speak to men." [architect.GetSheHe|U] then beckons a young choir boy, [choir_boy.GetFirstName], forward.\n\nThe child scampers up the scaffold and breathes forth an angelic note; as it rings round the walls and enters my body, it is as if God has passed through me."
 pam_great_projects_events.0013.a: "Expand the loft, the more voices the better."
 pam_great_projects_events.0013.b: "This angel must grace my court."
 pam_great_projects_events.0013.castrato: "Preserve this voice for the Lord's cantoria."
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.GetShortUIName|U] is castrated so [choir_boy.GetHerHis] voice does not break"
 pam_great_projects_events.0013.c: "These theatrics are a ruse made to squeeze me!"
 pam_great_projects_events.0013.d: "I am overwhelmed and must take my leave."
 CANTORIA_GLOSS: "A cantoria is a raised singing gallery in a church, often set above the choir or near the crossing, where singers, and later organs, led the liturgy."

 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$: His Unfailing Love"
 pam_great_projects_events.0012.desc: "The west face is complete! Its portal ready to welcome worshipers through the [Glossary('narthex','NARTHEX_GLOSS')]. The [cathedral_building.GetName] may take a lifetime to be fully finished, but the good Christians of [owner.GetPrimaryTitle.GetNameNoTier] must have faith in the future of the Lord's unfailing love. My sermon begins...\n\n#EMP "[ROOT.Char.Custom('RandomBibleQuote')]"#!\n\n...and I will leave with them this lesson from the scripture."
 NARTHEX_GLOSS: "The narthex is the entrance hall of a church, set between the west doors and the nave. It welcomed the faithful into sacred space and, in stricter rites, held penitents and catechumens apart from the congregation at Mass."
 pam_great_projects_events.0012.a: ""Blessed are the peacemakers...""
 pam_great_projects_events.0012.a.flavor: ""[Glossary('...for they will be called children of God.','MATTHEW_5_9_GLOSS')]""
 pam_great_projects_events.0012.a.tt: "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.b: ""Go to the ant, you sluggard...""
 pam_great_projects_events.0012.b.flavor: ""[Glossary('...consider its ways and be wise.','PROVERBS_6_6_GLOSS')]""
 pam_great_projects_events.0012.b.tt: "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.c: ""Now I appeal to you, brothers and sisters...""
 pam_great_projects_events.0012.c.flavor: ""[Glossary('...by the name of our Lord Jesus Christ, that all of you be in agreement and that there be no divisions among you, but that you be knit together in the same mind and the same purpose.','1_CORINTHIANS_1_10_GLOSS')]""
 pam_great_projects_events.0012.c.tt: "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.d: ""Rejoice always, pray without ceasing...""
 pam_great_projects_events.0012.d.flavor: ""[Glossary('...give thanks in all circumstances, for this is the will of God in Christ Jesus for you. Do not quench the Spirit. Do not despise prophecies.','1_THESSALONIANS_5_16_20_GLOSS')]""
 pam_great_projects_events.0012.d.tt: "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.e: ""Run with perseverance the race set before us...""
 pam_great_projects_events.0012.e.flavor: ""[Glossary('Let us also lay aside every weight and the sin that clings so closely, and let us run with perseverance the race that is set before us.','HEBREWS_12_1_GLOSS')]""
 pam_great_projects_events.0012.e.tt: "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 pam_great_projects_events.0012.f: ""She opens her hand to the poor...""
 pam_great_projects_events.0012.f.flavor: ""[Glossary('...and reaches out her hands to the needy.','PROVERBS_31_20_GLOSS')]""
 pam_great_projects_events.0012.f.tt: "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_charity_ai_behavior_tt$"
 pam_cathedral_sermon_peace_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] in the [archdiocese|E] will [behave|E] more honorably and compassionately#!#!"
 pam_cathedral_sermon_diligence_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] in the [archdiocese|E] will [behave|E] more diligently and energetically#!#!"
 pam_cathedral_sermon_unity_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] in the [archdiocese|E] will [behave|E] more sociable and honorable#!#!"
 pam_cathedral_sermon_charity_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] in the [archdiocese|E] will [behave|E] more compassionate and less grasping#!#!"
 pam_cathedral_sermon_perseverance_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] in the [archdiocese|E] will [behave|E] more zealous and bold in faith#!#!"
 pam_cathedral_sermon_rejoice_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] in the [archdiocese|E] will [behave|E] more zealous and energetic#!#!"
 pam_cathedral_west_portal_sermon_toast: "A Cathedral Sermon in [owner.GetPrimaryTitle.GetNameNoTier]"

 #Grand Cathedral is completed
 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$: The Crowning of the Spires"
 pam_great_projects_events.0020.desc: "At long last, the crosses are affixed to the spires, each one like Christ's so long ago on that hill in [Glossary('Golgotha','GOLGOTHA_GLOSS')]. They stand as a reminder of His suffering for our salvation, and a promise of His blood flowing forth each sabbath, there to cleanse us of our sin.\n\nSince construction began, sons became fathers, and fathers old men dead in the ground. Yet their noble toil, their sweat and blood, is immortalized in stone.\n\nEmpires may fall, but the [cathedral_building.GetName] of [province.GetName] will stand eternal as God's love."
 pam_great_projects_events.0020.a: "From near and far, come worship at our side!"
 GOLGOTHA_GLOSS: "Golgotha, derived from Latin #EMP Calvariae locus#! or "place of the skull", was a skull-shaped hill in Roman Jerusalem and the site of Jesus' Crucifixion. The execution took place outside the city walls, not far from the tomb where he was buried. The site is now contained in the Church of the Holy Sepulcher near the [GetBuilding('dome_of_the_rock_01').GetName|V]"
 poi_grand_cathedral_visit: "Visited the Cathedral of [province.GetNameNoTooltip]"

