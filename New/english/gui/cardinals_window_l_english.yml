 CARDINALS_VIEW_COLLEGE_DESCRIPTION: "Upon the death of the Pope, the most Popular, Pious, or Powerful [cardinal|e] with the highest number of supporters will ascend to The Papacy."

 theocratic_elective_pious: "The Pious"
 theocratic_elective_pious_desc: "#flavor The College must put forward a name no one can call unworthy, a cardinal whose life already reads like a saint's.#!\n\nTo become #EMP $theocratic_elective_pious$#!, stand above every other [cardinal|E] in holiness. [piety_level|E] weighs heaviest by far, followed by [learning|E] and how far you have advanced as a [GetTrait('lifestyle_scholar').GetName( GetPlayer )], a [GetTrait('pilgrim').GetName( GetPlayer )], or a [GetTrait('lifestyle_mystic').GetName( GetPlayer )]. A single [sin|E] on your name costs more than a [virtue|E] earns.[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist: "The Populist"
 theocratic_elective_populist_desc: "#flavor A Pope the faithful will not follow is no Pope at all, so the College puts forward a name already cheered in the streets.#!\n\nTo become #EMP $theocratic_elective_populist$#!, stand above every other [cardinal|E] in fame. Raise your [prestige_level|E] and [diplomacy|E], keep [friends|E] within the [college_of_cardinals|E], have [personal_tenets|E] with high [tenet_popularity|E], and use the [GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName] [decision|E].[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful: "The Powerful"
 theocratic_elective_powerful_desc: "#flavor St. Peter's Throne has enemies as well as followers, so the College puts forward a prelate with the means to hold it.#!\n\nTo become #EMP $theocratic_elective_powerful$#!, stand above every other [cardinal|E] in worldly weight. See your [rite|E] spread across more [counties|E], hold [holy_sites|E], raise your [dynasty_prestige_level|E] — or use the #V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#! [character_interaction|E] to buy your way to the front.[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"

