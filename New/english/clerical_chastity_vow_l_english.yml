l_english:
 request_clerical_chastity_interaction: "Demand Chastity"
 request_clerical_chastity_interaction_desc: "Demand that [recipient.GetShortUINameNoTooltip] take a vow of chastity before [recipient.GetFaith.HighGodName]. If [recipient.GetSheHe] accepts, [recipient.GetSheHe] suffers a long-term [fertility|E] penalty and cannot begin a seduction or a courtship until the vow ends or is renounced."
 request_clerical_chastity_notification_text: "Take this vow and bind your flesh to restraint before [actor.GetFaith.HighGodName]. Your obedience will honor the [actor.GetFaith.GetAdjectiveNoTooltip] faith."

 clerical_chastity_offer_piety: "Offer Piety"
 clerical_chastity_recipient_must_be_in_reach_tt: "You must be a [head_of_faith|E] or hold a [duchy|E] or higher [title|E], unless [recipient.GetShortUINameNoTooltip] personally holds a [county|E] bordering one of yours"
 clerical_chastity_recipient_must_be_in_reach_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip] must be a [head_of_faith|E] or hold a [duchy|E] or higher [title|E], unless [recipient.GetShortUINameNoTooltip] personally holds a [county|E] bordering one of [puppet_or_actor.GetShortUINamePossessiveNoTooltip]"
 clerical_chastity_vow_blocks_scheme_tt: "You must not be bound by a [GetModifier( 'clerical_chastity_vow_modifier' ).GetNameWithTooltip|L]"

 request_clerical_chastity_actor_toast: "Agreed to Demand"
 request_clerical_chastity_actor_toast_puppeteer: "[recipient.GetShortUIName] Agreed to [puppet_or_actor.GetShortUIName]'s Demand"
 request_clerical_chastity_recipient_toast: "Sworn Chastity"
 request_clerical_chastity_decline_actor_toast: "Refused Demand"
 request_clerical_chastity_decline_actor_toast_puppeteer: "[recipient.GetShortUIName] Refused [puppet_or_actor.GetShortUIName]'s Demand"
 request_clerical_chastity_interaction_extra_icon: "$hook_extra_icon$"

 clerical_chastity_ai_virtuous_chaste: "[GetTrait('chaste').GetName( recipient.Self )] is a virtue in my [faith|E]: $VALUE|=+0$"
 clerical_chastity_ai_rival: "Rival of [actor.GetShortUINameNoTooltip|U]: $VALUE|=+0$"
 clerical_chastity_ai_clerical_region: "[realm_capital|E] in my [clerical_region|E]: $VALUE|=+0$"
 clerical_chastity_ai_piety_stipend: "Extra [piety|E] offered: $VALUE|=+0$"
 clerical_chastity_ai_tier_rank: "[recipient.GetSheHe|U] is a [recipient.GetTitleAsNameNoTooltip|U]: $VALUE|=+0$"

 renounce_clerical_chastity_vow_decision: "Renounce Vow of Chastity"
 renounce_clerical_chastity_vow_decision_confirm: "Renounce the vow"
 renounce_clerical_chastity_vow_decision_desc: "I took this vow because a priest demanded chastity of me. I can set it aside, but breaking a sacred promise will cost me [piety|E] and weigh on my conscience."
 renounce_clerical_chastity_vow_decision_tooltip: "End the vow early. You lose [piety|E], gain [stress|E], and reduce your [clergy_opinion|E] for 10 years."
 renounce_clerical_chastity_vow_toast: "Renounced Vow"
 renounce_clerical_chastity_vow_toast_desc: "You renounce your vow of chastity."

 clerical_chastity_vow.0001.toast_released: "Vow Ended"
 clerical_chastity_vow.0001.toast_released_desc: "The vow you swore to has run its course."
