 request_ecclesiastical_title_split_interaction: "Request Ecclesiastical Title Split"
 request_ecclesiastical_title_split_interaction_desc: "Petition your [head_of_faith|E] to carve a new ecclesiastical [title|E] out of an existing [clerical_region|E]\n\nIf you are a secular [ruler|E], it is founded on your [capital|E] and granted to a [holder|E] of your choosing; if you are landed clergy, you are appointed its first [holder|E]\n\n#weak The split follows realm borders: the new [title|E] covers only the [counties|E] within this [clerical_region|E] held by you (or, if you are clergy, by your [liege|E]), so a larger [realm|E] carves off more#!"
 request_ecclesiastical_title_split_interaction_notification: "No single shepherd can watch over so wide a fold. Carve a new see from these lands, and no soul within them need again go unseen."
 clerical_title_split_tt: "A new ecclesiastical title covering [puppet_liege.GetTitledFirstNamePossessive] [realm|E] is split and created from [puppet_superior.GetName]'s [clerical_region|E] and [new_ecclesiastical_holder.GetName] becomes the first [holder|E]"
 request_ecclesiastical_title_split_effect_tt: "A new [clerical_title|E] covering [puppet_or_actor.GetTitledFirstNamePossessive] [realm|E] is split from [split_source_clerical_region.GetName] and granted to [new_ecclesiastical_holder.GetShortUIName]"
 request_ecclesiastical_title_split_accepted_tt: "Ecclesiastical Title Split"
 request_ecclesiastical_title_split_lost_tt: "Clerical Region Reduced"
