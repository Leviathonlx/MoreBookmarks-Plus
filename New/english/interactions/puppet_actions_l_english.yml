 request_elevation_interaction: "Request Elevation"
 request_elevation_interaction_desc: "Petition the [head_of_faith|E] for the [clerical_title|E] of your [clerical_region|E], whether it stands vacant or is held by your [superior|E]"
 request_elevation_interaction_notification: "[target.GetNameNoTier] lacks a shepherd worthy of it. Give me that seat, and its flock will know a guide that does not stray."
