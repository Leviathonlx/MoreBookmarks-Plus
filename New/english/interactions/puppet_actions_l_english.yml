 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip] holds no [title|E] of [SelectLocalization( puppet_or_actor.GetGovernment.IsType( 'ecclesiastical_government' ), 'pam_request_ecclesiastical_title_creation_anchor_tier_county', 'pam_request_ecclesiastical_title_creation_anchor_tier_duchy' )] [title_tier|E] or higher with a [de_jure|E] [capital|E] of their [faith|E], held within their [realm|E], and outside any [clerical_region|E]"
