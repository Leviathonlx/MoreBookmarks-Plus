 request_ecclesiastical_title_merger_interaction: "Request Clerical Title Merger"
 request_ecclesiastical_title_merger_interaction_desc: "Petition your [head_of_faith|E] to sanction your [capital_possessive|E] [clerical_region_possessive|E] absorption of a neighbor"
 request_ecclesiastical_title_merger_interaction_notification: "The flock of [target.GetNameNoTier] strays for want of a firm hand, while mine prospers. Let that see pass into my keeping, and one faithful shepherd will tend what two have divided."
 request_ecclesiastical_title_merger_accepted_tt: "Clerical Title Merged"
