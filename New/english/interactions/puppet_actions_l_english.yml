 pam_interactions_events.0120.opening: "To the [recipient.GetFaith.GetReligion.GetAdjective] luminary [recipient.GetFirstName],"
 pam_interactions_events.0120.desc_religious_head_actor: "Truly, since [recipient.GetFaith.CreatorName] begat the very first of [recipient.GetWomenMen], we have never known a [recipient.GetTitleAsName] of your ilk! As you command, it is my privilege to obey.\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient: "I cannot lead the faithful alone. Even the first among [recipient.GetFaith.HighGodNamePossessive] people, the [recipient.GetTitleAsName] [recipient.GetHerselfHimself], must yield to the ways of this world. Thus, I will aid and obey you, O [actor.GetTitleAsName].\n\n"
 pam_interactions_events.0120.desc: "Blessed am I in my duty, for I am to minister to souls both at [recipient.GetFaith.HighGodNamePossessive] command — and at yours? I shall endeavor to do all I can.\n\n"
 pam_interactions_events.0120.desc_lunacy: "For I fear my spirit itself is dying... and no counsel but yours lends any comfort at all...\n\n"
 pam_interactions_events.0120.desc_dread: "Let us destroy who must be destroyed: those who [recipient.GetFaith.HighGodName] has forsaken... as [recipient.GetFaith.HighGodNameSheHe|U] has forsaken me.\n\n"
 pam_interactions_events.0120.desc_piety: "For [recipient.GetFaith.HighGodName|U] [recipient.GetFaith.HighGodHerselfHimself|U] has imbued us with holy purpose!\n\n"
 pam_interactions_events.0120.desc_friendly: "My love for my [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], my absolute trust, shall guide me through what is to come.\n\n"
 pam_interactions_events.0120.desc_skill: "At your skillful direction... I expect to be party to great things.\n\n"
 pam_interactions_events.0120.outro: "What prayers of yours shall be answered?" 
 pam_interactions_events.0120.a: "Every prayer I have, O [recipient.GetTitleAsNameNoTooltip]!"

 pam_interactions_events.0121.opening: "O Worshipful [ROOT.Char.GetTitleAsName],"
 pam_interactions_events.0121.desc_honor: "I hereby set aside the pride I have known as [recipient.GetTitleAsName] of [recipient.GetPrimaryTitle.GetNameNoTier], and shall cleave dearly to your counsel.\n\n"
 pam_interactions_events.0121.desc: "The [recipient.GetTitleAsName] of [recipient.GetPrimaryTitle.GetNameNoTier] will play [recipient.GetHerHis] part in your games of power, and help you meddle in this mortal world.\n\n"
 pam_interactions_events.0121.desc_lunacy: "It is as you say: my court is a place of jabberers and liars. My dreams are dark. Only your words make any sense to me, only your medicines can heal...\n\n"
 pam_interactions_events.0121.desc_dread:  "I am a weapon placed in your hand. Without doubts, without scruples.\n\n"
 pam_interactions_events.0121.desc_piety: "Free me of my doubts, and show me the ways I may earn [recipient.GetFaith.HighGodNamePossessive] love!\n\n"
 pam_interactions_events.0121.desc_friendly: "My [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], I am trusting wholly in you, and I swear I will not fail you.\n\n"
 pam_interactions_events.0121.desc_skill: "I trust that, in watching my realm's affairs intently, you shall not allow me to fail.\n\n"
 pam_interactions_events.0121.outro: "Let us see to your plans."
 pam_interactions_events.0121.a: "[recipient.GetTitleAsNameNoTooltip|U] though [recipient.GetSheHe] may be, [recipient.GetSheHe] serves [recipient.GetHerHis] church."
