 request_ecclesiastical_title_creation_interaction: "Request Clerical Title Creation"
 request_ecclesiastical_title_creation_interaction_desc: "Petition your [head_of_faith|E] to establish a new [clerical_title|E] within your [realm|E]\n\nYou choose the [title|E] that seats it and its first [holder|E]\n\n#weak The new [clerical_region|E] covers every [de_jure|E] [county|E] of the seat's [de_jure|E] [kingdom|E] that no [clerical_region|E] holds yet#!"
 request_ecclesiastical_title_creation_interaction_notification: "The faithful of my lands are shepherded from afar, by strangers who do not know them. Sanction a new see raised upon the seat I name, and it shall want for nothing."
