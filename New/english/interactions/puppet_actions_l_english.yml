 puppet_action_description_puppet_action_request_ecclesiastical_title_creation: "Use #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_creation_interaction')]#! [interaction|E] to petition the [head_of_faith|E] to found a new [clerical_region|E] [title|E] anchored to a [title|E] of your choosing"
