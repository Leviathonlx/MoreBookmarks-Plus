l_english:

 demand_church_succession_interaction: "Demand Church Succession"
 demand_church_succession_religious_head_interaction: "Decree Church Succession"

 demand_church_succession_interaction_desc: "Should [recipient.GetTitledFirstName] depart this world without a rightful heir, the lands [recipient.GetSheHe] holds shall pass to the holder of the [actor.GetPrimaryTitle.GetName] as a [fallback_heir|E]."
 demand_church_succession_religious_head_interaction_desc: "As [head_of_faith|E] of the [actor.GetFaith.GetAdjective] [faith|E], decree that [recipient.GetTitledFirstName]'s realm shall fall to [actor.GetPrimaryTitle.GetName] should [recipient.GetSheHe] die without an heir."

 demand_church_succession_target_in_reach: "[recipient.GetShortUINamePossessive] [realm|E] does not border [actor.GetShortUINamePossessive] [realm|E] and is not within [actor.GetShortUINamePossessive] [archdiocese|E]"
 demand_church_succession_no_existing_fallback: "[recipient.GetTitledFirstName] has already pledged [recipient.GetHerHis] succession to another cleric or [fallback_heir|E]"
 demand_church_succession_no_elective: "[recipient.GetTitledFirstName] holds [recipient.GetHerHis] [primary_title|E] under an [elective_succession|E] or [advanced_succession|E]"
 demand_church_succession_recently_refused_tt: "[recipient.GetTitledFirstName] recently defied a Church succession demand and is shielded from further such demands for ten years"

 DEMAND_CHURCH_SUCCESSION_SEND_NAME: "Demand Church Succession"
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION: "[actor.GetTitledFirstName] demands that, should [recipient.GetTitledFirstName] die heirless, [recipient.GetHerHis] realm shall pass to [actor.GetPrimaryTitle.GetName]."

 demand_church_succession_actor_toast: "[recipient.GetTitledFirstName] is bound to the [faith|E]"
 demand_church_succession_actor_toast_desc: "Should [recipient.GetSheHe] die without an heir, [actor.GetPrimaryTitle.GetName] shall inherit [recipient.GetHerHis] realm."
 demand_church_succession_actor_toast_puppeteer: "[puppet_or_actor.GetShortUIName] has bound [recipient.GetTitledFirstName] to the [faith|E]"
 demand_church_succession_actor_toast_desc_puppeteer: "Should [recipient.GetSheHe] die without an heir, [puppet_or_actor.GetPrimaryTitle.GetName] shall inherit [recipient.GetHerHis] realm."

 demand_church_succession.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"

 demand_church_succession.0001.desc.pope: "By [actor.GetFaith.HighGodNamePossessive] grace, We write to you on the matter of inheritance."
 demand_church_succession.0001.desc.archbishop: "From my archdiocese, which watches over your lands, I write on a matter of inheritance."
 demand_church_succession.0001.desc.bishop: "Your shepherd writes to you on the matter of inheritance."
 demand_church_succession.0001.desc.head_of_faith_generic: "As [actor.GetTitleAsNameNoTooltip] of the faith, I write to you on a matter of inheritance."
 demand_church_succession.0001.desc.theocrat_generic: "From the altar of [actor.GetFaith.HighGodName], I write on a matter of inheritance."

 demand_church_succession.0001.flavour.zealous: "\n\nMake no mistake:"
 demand_church_succession.0001.flavour.ambitious: "\n\nLet us be candid:"
 demand_church_succession.0001.flavour.deceitful: "\n\nDoubtless this comforts you:"
 demand_church_succession.0001.flavour.greedy: "\n\nI shall be plain:"
 demand_church_succession.0001.flavour.compassionate: "\n\nForgive the necessity, [recipient.GetTitledFirstName], but"
 demand_church_succession.0001.flavour.default: "\n\nLet me speak plainly:"

 demand_church_succession.0001.recipient.elderly_childless: "the cradle by your hearth stands empty, and your line ends with you. The faithful will wait and, in time, inherit."
 demand_church_succession.0001.recipient.childless: "you have no living children. Should [actor.GetFaith.HighGodName] not change that, your lands shall serve the faith."
 demand_church_succession.0001.recipient.one_child: "one child is all that separates you from the end. Should [actor.GetFaith.HighGodName] take them, the faithful are ready to govern."
 demand_church_succession.0001.recipient.default: "the years are jealous of every promise. Should yours fail, your lands shall pass to us, to be governed in [actor.GetFaith.HighGodNamePossessive] name."

 demand_church_succession.0001.a: "So it is written. So it shall be."
 demand_church_succession.0001.b: "I had best [ROOT.Char.GetMotherFather] an heir, then."
 demand_church_succession.0001.c: "[actor.GetTitledFirstNameNoTooltip] oversteps."
 demand_church_succession.0001.c.tt: "You clear the [fallback_heir_title|E] arrangement and are shielded from further Church succession demands for ten years, but [actor.GetTitledFirstName] will not soon forgive the slight"

 demand_church_succession.0002.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0002.desc: "Your demand has been read and refused. My realm will never fall to the Church. Tend to your altar, [actor.GetTitledFirstName], and I shall tend to my lands."
 demand_church_succession.0002.a: "Insolence shall be remembered."

 demand_church_succession_fertility_modifier: "Resolved to Sire an Heir"
 demand_church_succession_fertility_modifier_desc: "Determined to keep their realm out of clerical hands, this character has redoubled their efforts in the marital bed."
 defied_church_succession_opinion: "Defied my Succession Claim"
 meddling_church_opinion: "Meddling in my Succession"