l_english:
 msg_passive_learned_tenet_abroad_desc: "From observing [passive_learn_source.GetTitledFirstName] of the [passive_learn_source.GetRite.GetAdjective] [rite|E] in [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], you have gained [agnostic_knowledge|E] of the [passive_learn_tenet.GetBaseName] [core_tenet|E]."
 msg_passive_learned_doctrine_abroad_desc: "From observing [passive_learn_source.GetTitledFirstName] of the [passive_learn_source.GetRite.GetAdjective] [rite|E] in [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], you have gained [agnostic_knowledge|E] of the [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E]."
 msg_passive_learned_rite_abroad_desc: "Through [passive_learn_source.GetTitledFirstNameNoTooltip], you have gained [agnostic_knowledge|E] of the [core_tenets|E] and [doctrines|E] of the [passive_learn_source.GetRite.GetAdjective] [rite|E]."

 msg_passive_learned_tenet_pilgrimage_rite_desc: "In [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], you gained [agnostic_knowledge|E] of the [passive_learn_tenet.GetBaseName] [core_tenet|E] of the [passive_learn_rite.GetAdjective] [rite|E]."
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "In [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], you gained [agnostic_knowledge|E] of the [passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )] [doctrine|E] of the [passive_learn_rite.GetAdjective] [rite|E]."

 rite_travel_events.1000.t: "A Travelling [passive_learn_rite.GetAdherentNameNoTooltip]"
 rite_travel_events.1000.desc: "Dusk falls, and a travelling [passive_learn_rite.GetAdherentName] joins us by the fire.\n\nAs the night deepens, we share [passive_learn_source.Custom('RegionalDrink')], [passive_learn_source.Custom('RegionalEdibleMeat')], and stories. [passive_learn_source.GetSheHe|U] speaks of [passive_learn_source.GetHerHis] people's sacred teachings, of how [passive_learn_rite.GetNameNoTooltip] is lived and practiced. There is conviction in every word."
 rite_travel_events.1000.a: "Most insightful."
 rite_travel_events.1000.b: "[passive_learn_source.GetSheHe|U] should join me."
 rite_travel_events.1000.c: "I have no ear for such heresy."

 rite_travel_events.2000.t: "Revelation"
 rite_travel_events.2000.desc: "While traveling the [location.GetTerrain.GetNameNoTooltip] of [location.GetName], I find a crowd gathered.\n\nA preacher speaks of something called [passive_learn_tenet.GetBaseName]. I have never heard of it, yet I feel [passive_learn_source.GetHerHis] words.\n\nI meant to pass by. Instead, I listen.\n\nThis... this is truth."
 rite_travel_events.2000.a: "[ROOT.Char.GetFaith.HighGodName] expects this of me."
 rite_travel_events.2000.b: "I'm no heathen!"
