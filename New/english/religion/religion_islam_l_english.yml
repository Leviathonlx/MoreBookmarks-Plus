 # Ṣadr al-Islām
 sadr_al_islam: "Sadr al-Islam"
 sadr_al_islam_adj: "Muslim"
 sadr_al_islam_adherent: "Muslim"
 sadr_al_islam_adherent_plural: "Muslims"
 sadr_al_islam_desc: "In its purest form, before the emergence of schools of thought, Muslims were led by the Prophet himself with divine revelation. His sunnah was followed by the companions and the tabi'un of the first few generations."

 # Sunni
 sunni: "Sunni"
 sunni_adj: "Sunni"
 sunni_adherent: "Sunni"
 sunni_adherent_plural: "Sunnis"
 sunni_desc: "Sunni refers to followers of Muhammad's practices, known as the sunna. Sunni Islamic jurisprudence primarily relies on the Quran, hadith, and ijma (scholarly consensus) as its foundational sources."

 # Shia
 shia: "Shia"
 shia_adj: "Shia"
 shia_adherent: "Shi'ite"
 shia_adherent_plural: "Shi'ites"
 shia_desc: "A branch of Islam that believes leadership should stay within the Prophet Muhammad's family and be passed down through divinely guided Imams. It focuses on devotion to the Prophet's household."
 islam_shia_priest:0 "mullah"
 islam_shia_priest_plural:0 "mullahs"
 islam_shia_religious_head_title:0 "Imam"
 islam_shia_religious_head_title_name:0 "Imamate"

 # Kharijite
 kharijite: "Kharijite"
 kharijite_adj: "Kharijite"
 kharijite_adherent: "Kharijite"
 kharijite_adherent_plural: "Kharijites"
 kharijite_desc: "An early Islamic group believed leadership should be based on piety, not lineage, and sinful rulers could be removed. They emerged during the Shia upheavals, rejected both sides, and declared grave sinners outside Islam."

 #Masmudism
 masmudi:1 "Almohadism"
 masmudi_adj:1 "Almohadi"
 masmudi_adherent:1 "Almohadi"
 masmudi_adherent_plural:1 "Almohadis"
 masmudi_desc:2 "A reformist branch of Sunni Islam that originated with the Berber tribes in northern Africa, the Almohadi movement saw themselves as unitarians and preached a doctrine of purified monotheism."
 masmudi_religious_head_title:0 "Caliph"
 masmudi_religious_head_title_name:0 "caliphate"
 
 #Quranism
 quranist:0 "Quranism"
 quranist_adj:0 "Quranist"
 quranist_adherent:0 "Quranist"
 quranist_adherent_plural:0 "Quranists"
 quranist_desc:0 "A literalist interpretation of Islam that emphasizes that the Quran as the only source of divine wisdom, and should be followed to the letter, ignoring hadith and fatwas."

 #Druze
 druze:0 "Druze"
 druze_adj:0 "Druze"
 druze_adherent:0 "Druze"
 druze_adherent_plural:1 "Druze"
 druze_desc:0 "Hailing from the Mountain of Druze, the Druze faith follows many of the principles of Isma'ilism, but also includes gnostic beliefs in an esoteric theology focused on the Truth of existence."
 druze_religious_text:0 "Epistles of Wisdom"
 druze_religious_text_2:0 "$druze_religious_text$" # Optional translation alt
 druze_religious_text_3:0 "$druze_religious_text$" # Optional translation alt
