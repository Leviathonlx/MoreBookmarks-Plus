 tenet_sinitic_syncretism_name: "Sinitic Syncretism"
 tenet_sinitic_syncretism_desc: "We can learn from the ancient Sinitic religions. Through centuries and millennia they have inspired righteous living and good morals."
 doctrine_parameter_sinitic_syncretic_actor_opinion_active: "Mutual $VALUE|=+0$ [opinion|E] bonus with [faiths|E] that have the $tenet_sinitic_syncretism_name$ [core_tenet|E]"
