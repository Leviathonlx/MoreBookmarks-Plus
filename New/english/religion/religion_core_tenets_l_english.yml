 tenet_unreformed_syncretism_name:0 "Syncretic Folk Traditions"
 tenet_unreformed_syncretism_desc:0 "Who are we to tell others that their traditions are untrue? It is not our place to lecture them about customs they have practiced for centuries: instead, we should learn quietly about their ways."
 doctrine_parameter_unreformed_syncretic_actor_opinion_active: "Mutual $VALUE|=+0$ [opinion|E] bonus with [faiths|E] that have $tenet_unreformed_syncretism_name$ [core_tenet|E]"
 doctrine_parameter_unreformed_syncretic_recipient_opinion_active: "Mutual $VALUE|=+0$ [opinion|E] bonus with [GetDoctrineType('unreformed_faith_doctrine').GetBaseName] [faiths|E] and their [counties|E]"
