 self_mutilation_major_piety_gain_tt: "[THIS.Char.GetShortUIName|U] gain[_s(THIS.Char)] [piety_i]#P [THIS.ScriptValue('major_piety_gain')]#! because of [CharYourHerHis(THIS.Char)] [GetTenetType('tenet_exaltation_of_pain').GetBaseName] [personal_tenet|E]"

 tenet_sacred_shadows_name:0 "Sacred Lies"
 tenet_sacred_shadows_desc:0 "Lying is the most profound art in existence. Those who can convince others of their lies are holy. Those who can successfully lie to themselves are unstoppable."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes:0 "Adherents earn piety for successfully completing [intrigue|E] [schemes|E]"
 doctrine_parameter_adherents_more_likely_to_join_schemes:0 "Adherents are more willing to become Agents in the [schemes|E] of other characters"
 doctrine_parameter_tenet_sacred_shadows_fabricate_hook: "Can use the [GetScheme('fabricate_hook').GetTypeName] [scheme|E]"
 doctrine_parameter_tenet_sacred_shadows_intrigue_scheme_fulfillment: "Gain @spiritual_fulfillment_icon![spiritual_fulfillment|E] from successfully completing [intrigue|E] [schemes|E]"

 tenet_pursuit_of_power_name:0 "Pursuit of Power"
 tenet_pursuit_of_power_desc:0 "What is and is not righteous is transient, defined by those who currently hold power. This means that the pursuit of power is the only truly righteous cause."
 doctrine_parameter_tenet_pursuit_of_power_war_victory_fulfillment: "Winning wars grants @spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_pursuit_of_power_become_conqueror: "Unlocks the $pursue_conquerors_mantle_decision$ [decision|E]"

 tenet_pastoral_isolation_name:0 "Pastoral Isolation"
 tenet_pastoral_isolation_desc:0 "All we want is to be left alone. Our practices are our own, and no more the business of anyone else than theirs are of ours."
 doctrine_parameter_unattractive_for_character_conversions:0 "[characters|E] are more willing to be converted away from this [faith|E]"

 tenet_natural_primitivism_name:0 "Natural Primitivism"
 tenet_natural_primitivism_desc: "Civilization is unnatural, a futile and blasphemous attempt by man to impose order on an inherently unordered creation. We cast off cloth, rank, law, and courtly vanity to live as [ROOT.Rite.GetFaith.PantheonTerm] intended: wild, simple, and free."
 doctrine_parameter_naked_adherents_active:0 "Adherents do not wear clothes"
 doctrine_parameter_natural_primitivism_law_cost_increase:0 "Law Costs: #N +50%#!"
 doctrine_parameter_tenet_natural_primitivism_promote_naturism_decision: "Unlocks the #V Embrace Natural Freedom#! [decision|E]"
 doctrine_parameter_unlock_jizya_contract:1 "Unlocks the Jizya [vassal_contract|E] and [tax_decree|E]"
 

 #FP3 tenets

 tenet_communal_possessions_name: "Communal Possessions"
 tenet_communal_possessions_desc: "[ROOT.Rite.GetFaith.HighGodName] intended for us all an equal share of the resources on earth. We should hold all things in common, and re-distribute the stolen wealth of the powerful." 
 tenet_communal_possessions_mazdakism_historical_glossary: "[Glossary('Mazdakism','tenet_communal_possessions_mazdakism_historical_desc')]"
 tenet_communal_possessions_mazdakism_historical_desc: "The holding and redistribution of wealth associated with dualist Mazdakite clergy."
 tenet_communal_possessions_apostolic_historical_glossary: "[Glossary('Omnia Communia','tenet_communal_possessions_apostolic_historical_desc')]"
 tenet_communal_possessions_apostolic_historical_desc: "The Christian ideal of communal ownership as described in the Acts of the Apostles."
 tenet_communal_possessions_historical_glossary: "$tenet_communal_possessions_mazdakism_historical_glossary$ / $tenet_communal_possessions_apostolic_historical_glossary$"
 doctrine_parameter_piety_from_gifts_active: "Gain @piety_icon![piety|E] from sending [gifts|E] and gifting [artifacts|E]"
 doctrine_parameter_piety_from_marrying_lowborn_active: "Rulers gain @piety_icon![piety|E] from marrying [lowborn|E] [characters|E], and lose no @legitimacy_icon![legitimacy|E] for doing so"
 doctrine_parameter_tenet_communal_possessions_redistribution_event: "Unlocks the $redistribute_realm_wealth_decision$ [decision|E]"

 tenet_sacrificial_ceremonies_name:0 "Sacrificial Ceremonies"
 tenet_sacrificial_ceremonies_desc:0 "Human sacrifice both voluntary and involuntary bring us closer to the divine. It is customary and virtuous for one to volunteer to sacrifice oneself in ceremony, just as it is virtuous to sacrifice those who have committed unforgivable crimes against the Gods."
 
 tenet_megaliths_name:0 "Megalithic Constructions"
 tenet_megaliths_desc:0 "Worship should not be done merely in the confines of a temple, these are the primitive constructions of man that distracts them from the divine creations surrounding us all. We embrace stone and the open air, arranging the stones that the creator gave us in ways which please them and bring us closer to divinity."
 doctrine_parameter_can_build_megaliths:0 "Enables the construction of Megaliths in [temple|E] holdings and Great Megaliths in Duchy Capitals."
 doctrine_parameter_tenet_megaliths_building_poi_double_rewards: "Double experience rewards from visiting [points_of_interest|E] that are [buildings|E]"
 doctrine_parameter_tenet_megaliths_rough_terrain_construction_fulfillment: "Gain @spiritual_fulfillment_icon![spiritual_fulfillment|E] when completing construction in [GetTerrain( 'hills' ).GetName], [GetTerrain( 'terraced_hills' ).GetName], [GetTerrain( 'mountains' ).GetName], or [GetTerrain( 'desert_mountains' ).GetName]"
 pam_megaliths_rough_terrain_construction_toast: "From your [GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )] personal tenet"
 province_is_of_a_megalith_faith_tt:0 "This [county|E] must follow a [faith|E] that believes in the significance of Megaliths."

 tenet_fp3_fedayeen_name: "Fedayeen"
 tenet_fp3_sacred_murder_name: "Sacred Murder"
 tenet_fp3_fedayeen_desc: "When ordinary warfare will not avail, it is our duty before [ROOT.Rite.GetFaith.HighGodNameAlternate] to destroy [ROOT.Rite.GetFaith.HighGodHerHis|U] enemies through infiltration and deception. We must fear neither death nor pain, and eagerly lay down our lives for the greater cause." 
 tenet_fp3_fedayeen_historical_glossary: "[Glossary('Fedayeen','tenet_fp3_fedayeen_historical_desc')]"
 tenet_fp3_fedayeen_historical_desc: "In the medieval Nizari context, a devotee would carry out targeted missions against prominent enemies of their community."
 doctrine_parameter_master_assassin_court_position_unlocked: "Unlocks the #V [GetCourtPositionType( 'master_assassin_court_position' ).GetName()]#! [court_position|E]"
 master_assassin_court_position_unlocked_name: "$tenet_fp3_fedayeen_name$"
 doctrine_parameter_death_is_glory: "Likelihood of death or injury in [battle|E]: #N +10%#!"
 doctrine_parameter_sanctioned_assassinations: "No [piety|e] loss for killing characters of a different [faith|E] through the [GetScheme('murder').GetTypeName] [schemes|E]"
 doctrine_parameter_tenet_fp3_fedayeen_other_faith_kill_fulfillment: "Gain @spiritual_fulfillment_icon![spiritual_fulfillment|E] for killing [characters|E] of another [faith|E]"
 
 # EP3 Tenets
 tenet_household_gods_name: "Household Gods"
 tenet_household_gods_desc: "We revere our #EMP Lares#! and the #EMP Genii#! — the protective spirits which watch over our abodes. Above all, we honor our glorious emperor, whose soul is charged with protecting all the realm."
 tenet_household_gods_historical_glossary: "[Glossary('Lararium','tenet_household_gods_historical_desc')]"
 tenet_household_gods_historical_desc: "A Roman household shrine dedicated to domestic worship, where offerings to protective deities could be placed."

 # BP3 Parameter
 doctrine_parameter_allows_brewery: "$allows_brewery$ for [temple_holdings|E]"

 # TGP
 immaterial_harmony_name: "Immaterial Harmony"
 special_doctrine_immaterial_harmony_name: "Immaterial Harmony"
 special_doctrine_immaterial_harmony_desc: "There is no conflict between our traditions and the teachings of the Buddha or the sages. One may practice any of them, or even all at once, without spiritual difficulty."

 tenet_extinction_of_dharma_name: "Extinction of Dharma"
 tenet_extinction_of_dharma_desc: "Demons walk the earth in the guise of the pious and the devout; whomsoever slays one shall take one step toward Buddhahood, whomsoever slays ten shall take ten steps toward Buddhahood."
 tenet_extinction_of_dharma_historical_glossary: "[Glossary('Mappō','tenet_extinction_of_dharma_historical_desc')]"
 tenet_extinction_of_dharma_historical_desc: "The final age of the Dharma, in which the ability to practice the teachings of the Buddha declines until they disappear completely."

 tenet_cranial_trophies_name: "Cranial Trophies"
 tenet_cranial_trophies_desc: "The head is the vessel of its owner's quintessence. By severing it and the extraction its contents we can claim the potent spiritual energy for ourselves."
 doctrine_parameter_killing_bestows_heads: "It is possible to gain a Cranial Trophy [artifact|E] when [executing|E] another character, slaying them in a [single_combat_duel|E], or killing them in [battle|E]"
 doctrine_parameter_decapitation_steals_prestige_as_piety: "When gaining a Cranial Trophy [artifact|E], the killer will additionally gain @piety_icon![piety|E] in proportion to the deceased's @prestige_icon![prestige|E]"
 doctrine_parameter_tenet_cranial_trophies_spiritual_fulfillment_from_trophies: "When you gain a Cranial Trophy [artifact|E], you also gain @spiritual_fulfillment_icon![spiritual_fulfillment|E] in proportion to the deceased's @prestige_icon![prestige|E]"

 tenet_benevolent_governance_name: "Benevolent Governance"
 tenet_benevolent_governance_desc: "Those who govern over the masses have a moral duty to promote that which is good and abjure that which is evil. It is only by adhering to this principle that a ruler may truly be just."
 tenet_benevolent_governance_historical_glossary: "[Glossary('Rénzhèng','tenet_benevolent_governance_historical_desc')]"
 tenet_benevolent_governance_historical_desc: "Connects legitimate rule with moral conduct and care for the people in Confucian political thought."
 tenet_filial_piety_name: "Filial Piety"
 tenet_filial_piety_desc: "Filial piety and obedience to one's elders are fundamental to the actualization of human goodness. When our parents are alive, we serve them with propriety, support them with our means, and learn from their guidance; when they die, we bury them with propriety, and then worship them with propriety."
 tenet_filial_piety_historical_glossary: "[Glossary('Xiào','tenet_filial_piety_historical_desc')]"
 tenet_filial_piety_historical_desc: "A foundational Confucian principle including respect, care, and obligations towards parents and reverence for ancestors."
 tenet_harmonious_society_name: "Harmonious Society"
 tenet_harmonious_society_desc: "Everything must be balanced: individuals, nature, society. The Son of Heaven sets the tempo and we follow his chant."
 tenet_harmonious_society_historical_glossary: "[Glossary('Wǔlún','tenet_harmonious_society_historical_desc')]"
 tenet_harmonious_society_historical_desc: "The five relationships in Confucian ethics: ruler and subject, parent and child, husband and wife, elder and younger sibling, and friend and friend. Each relationship has rules of proper conduct."
 doctrine_parameter_sway_scheme_better: "[GetScheme('sway').GetTypeName] [scheme_success_chance|E]: [success_chance_i]#P +15%#!"
 doctrine_parameter_sway_scheme_piety: "Successful [GetScheme('sway').GetTypeName] [schemes|E] targeting your [liege|E] or [vassals|E] give [piety_i]#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! [piety|E]"
 doctrine_parameter_more_often_zealots: "[vassals|E] are more likely to have the [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] [vassal_stance|E]"
 doctrine_parameter_tenet_harmonious_society_sway_fulfillment: "Gain #P [EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! @spiritual_fulfillment_icon![spiritual_fulfillment|E] when a [GetScheme('sway').GetTypeName] [scheme|E] targeting your [liege|E] or [vassals|E] succeeds"
