 doctrine_parameter_can_use_jewish_artifacts: "Can use Jewish [artifacts|E]"

 tenet_christian_syncretism_name: "Christian Syncretism"
 tenet_christian_syncretism_desc: "Jesus of Nazareth may not have been true divinity, but he was still an upstanding and virtuous figure. We should honor and respect his teachings."
 doctrine_parameter_christian_syncretic_actor_opinion_active: "Mutual $VALUE|=+0$ [opinion|E] bonus with [faiths|E] that have the $tenet_christian_syncretism_name$ [core_tenet|E]"
 doctrine_parameter_christian_syncretic_recipient_opinion_active: "Mutual $VALUE|=+0$ [opinion|E] bonus with Christian [faiths|E] and their [counties|E]"
 doctrine_parameter_adoptionists_are_unilateral_hostile: "Other $christianity_religion_adj$ [faiths|E] only consider them $hostility_hostile_tooltippable$, whereas less refined $adoptionist_adherent_plural$ are considered $hostility_evil_tooltippable$"
 doctrine_parameter_adoptionists_are_unilateral_evil: "Other $christianity_religion_adj$ [faiths|E] consider them $hostility_evil_tooltippable$"
 doctrine_parameter_adoptionists_are_mutual_evil: "Considers, and is considered by, all other $christianity_religion_adherent_plural$ to be $hostility_evil_tooltippable$"
 doctrine_parameter_adoptionist_school_removed_on_reformation:0 "The subtle nuances of this school are #EMP permanently#! lost on [reformation|E]"
 doctrine_parameter_adoptionists_attractively_intuitive_theology:0 "[EmptyScope.ScriptValue('fp2_lyonese_monk_conversion_bonus_root_value')|=+%0] conversion speed against other [GetReligionByKey('christianity_religion').GetAdjective] [faiths|E]"

 tenet_islamic_syncretism_name: "Islamic Syncretism"
 tenet_islamic_syncretism_desc: "The Prophet's words are indisputably wise and just, and whatever our other doubts, we should take heed of his thoughts and deeds."
 doctrine_parameter_islamic_syncretic_actor_opinion_active: "Mutual $VALUE|=+0$ [opinion|E] bonus with [faiths|E] that have the $tenet_islamic_syncretism_name$ [core_tenet|E]"
 doctrine_parameter_islamic_syncretic_recipient_opinion_active: "Mutual $VALUE|=+0$ [opinion|E] bonus with Islamic [faiths|E] and their [counties|E]"

 tenet_jewish_syncretism_name: "Jewish Syncretism"
 tenet_jewish_syncretism_desc: "Though we do not agree with its claims about God's chosen people, the wisdom of the Jewish Torah is undeniable, and there is much to be learned from the text."
 doctrine_parameter_jewish_syncretic_actor_opinion_active: "Mutual $VALUE|=+0$ [opinion|E] bonus with [faiths|E] that have the $tenet_jewish_syncretism_name$ [core_tenet|E]"
