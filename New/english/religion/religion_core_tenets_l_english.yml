 # Additional Tenets
 tenet_ritual_cannibalism_name:0 "Ritual Cannibalism"
 tenet_ritual_cannibalism_desc:0 "Mankind is blessed to have been bestowed with the spark of the divine. Human flesh is therefore sacred, its presence something to be savored, not buried or burned."
 doctrine_parameter_cannibalism_legal:0 "The [GetTrait('cannibal').GetName( GetNullCharacter )] trait is no longer considered [criminal|E]"
 doctrine_parameter_tenet_ritual_cannibalism_devour_reward: "Can eat [prisoners|E] to lose [stress|E] and gain @spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_ritual_cannibalism_feast_toast: "[honorary_guest|E] can be eaten at the end of a [GetActivityType('activity_feast').GetName]"

 tenet_exaltation_of_pain_name:0 "Exaltation of Pain"
 tenet_exaltation_of_pain_desc:0 "Pain is the universal emotion, violence the universal language. To bestow pain upon another is to give them a blessing, so receive pain one's self is to receive grace."
 doctrine_parameter_torturing_prisoners_grants_piety:0 "Torturing [prisoners|E] earn @piety_icon![piety|E] instead of costing @piety_icon![piety|E]"
 doctrine_parameter_reduced_stress_from_torture:0 "Adherents take no [stress|E] from being tortured, and gain @spiritual_fulfillment_icon![spiritual_fulfillment|E] from the ordeal"
 doctrine_parameter_self_mutilation_active:0 "Can [decide|E] to indulge in flagellation, earning @piety_icon![piety|E] at the cost of becoming [GetTrait('wounded_1').GetName( GetPlayer )]"
 doctrine_parameter_no_epidemic_fulfillment_loss_active: "Adherents suffer no @spiritual_fulfillment_icon![spiritual_fulfillment|E] loss from [epidemic|E]s"
 doctrine_parameter_no_epidemic_fulfillment_loss_personal_active: "This character suffers no @spiritual_fulfillment_icon![spiritual_fulfillment|E] loss from [epidemic|E]s"
 doctrine_parameter_tenet_exaltation_of_pain_flagellant_trait: "Gain the [GetTrait('flagellant').GetName( GetPlayer )] [trait|E] when selecting this [personal_tenet|E]"
 doctrine_parameter_tenet_exaltation_of_pain_wounded_spiritual_fulfillment: "Gaining [GetTrait('wounded_1').GetName( GetPlayer )] grants @spiritual_fulfillment_icon![spiritual_fulfillment|E] based on severity"
 doctrine_parameter_tenet_exaltation_of_pain_wound_courtier_interaction: "Unlocks the #V $exaltation_of_pain_wound_courtier_interaction$#! [interaction|E], allowing you to wound [courtiers|E] for @piety_icon![piety|E]"
 exaltation_of_pain_wounded_spiritual_fulfillment_toast: "Blessed By Suffering"
 self_mutilation_active_name: "[GetTenetType('tenet_exaltation_of_pain').GetBaseName]"
 self_mutilation_minor_piety_gain_tt: "[THIS.Char.GetShortUIName|U] gain[_s(THIS.Char)] [piety_i]#P [THIS.ScriptValue('minor_piety_gain')]#! because of [CharYourHerHis(THIS.Char)] [GetTenetType('tenet_exaltation_of_pain').GetBaseName] [personal_tenet|E]"
