l_english:
 doctrine_core_tenets_name: "Tenets"
 tenets_name: "Tenets"

 #Abrahamic Tenets
 tenet_communion_name:0 "Communion"
 tenet_communion_desc:0 "Our rituals are not merely symbolic — they invoke the very presence of the divine itself. Those who cannot or do not join us in their practice cannot be true believers."
 tenet_communion_eucharistia_historical_glossary: "[Glossary('Eucharistia','tenet_communion_eucharistia_historical_desc')]"
 tenet_communion_eucharistia_historical_desc: "The Christian sacrament of consuming consecrated bread and wine to remember Jesus and the Last Supper."
 doctrine_parameter_tenet_communion_denied_sacrament: "[Concept('excommunicated', 'Excommunicated')|E] [characters|E] of this [rite|E] suffer #N -25%#! @piety_icon![piety|E] gain and #N -10#! same-faith [opinion|E]"
 doctrine_parameter_tenet_communion_shared_table: "Hosting a [GetActivityType('activity_feast').GetName] grants #P +10#! [opinion|E] with each same-[faith|E] guest"
 doctrine_parameter_excommunication_active:0 "Spiritual [heads_of_faith|E] may [excommunicate|E] other characters of their [faith|E]"
 tenet_excommunicated:0 "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 doctrine_parameter_last_rites_active: "Characters of this [rite|E] may take the [GetDecisionWithKey('pam_decision_last_rites').GetName] [decision|E]"
 doctrine_parameter_seek_indulgences_active: "Characters of this [rite|E] may use the #high $seek_indulgences_interaction$#! [interaction|E], provided the [faith|E] has a [head_of_faith|E] or [clerical_regions|E]"

 tenet_armed_pilgrimages_name:0 "Armed Pilgrimages"
 tenet_armed_pilgrimages_desc:0 "Our pilgrims travel across the world to visit our sacred holy sites — we will gladly take up the sword to keep them safe from any who would harm them"
 doctrine_parameter_cheaper_holy_wars_active:0 "It costs [rulers|E] of this [rite|E] #P -20%#! less @piety_icon![piety|E] to declare [holy_wars|E]"
 doctrine_parameter_great_holy_wars_active:1 "If one exists, the [head_of_faith|E] can declare a [great_holy_war|E]"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active:0 "If no [head_of_faith|E] exists, adherents gain a bonus to the [convert_county|E] [councillor_task|E] per controlled [holy_site|E]"
 doctrine_parameter_pilgrimage_decision_active: "Characters of this [rite|E] gain an additional bonus upon the successful completion of a [pilgrimage|E]"
 doctrine_parameter_leasing_to_military_order_give_spiritual_fulfillment_personal: "[leasing|E] [holdings|E] to [holy_orders|E] give extra @spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 leasing_to_military_order_give_spiritual_fulfillment_personal_toast: "$tenet_armed_pilgrimages_name$"

 tenet_monasticism_name:0 "Monasticism"
 tenet_monasticism_desc:0 "The pleasures of fine food and drink only serve to distract us from service to the divine. Isolating ourselves in remote monasteries is the best way to avoid these temptations."
 doctrine_parameter_take_vows_active:0 "[courtiers|E] can Take the Vows and become a [GetTrait('devoted').GetName( GetNullCharacter )]"
 doctrine_parameter_devoted_trait_criminal: "The [GetTrait('devoted').GetName( GetNullCharacter )] trait is [criminal|E]"
 doctrine_parameter_cannot_take_the_vows: "Characters of this [rite|E] cannot use the #high $take_vows_interaction$#! [character_interaction|E]"

 tenet_divine_marriage_name:0 "Divine Marriage"
 tenet_divine_marriage_xwedodah: "Xwedodah"
 tenet_divine_marriage_desc: "By marrying close of kin, we emulate the sacred unions of the first beings in creation. Good qualities will be passed down our family line, and thus we gain purity and favor in the eternal battle against evil."
 doctrine_parameter_divine_marriage_opinion: "Adherents who are married to a [close_family|E] member have $VALUE|0+=$ [opinion|E] from [vassals|E] of the same [faith|E]"
 doctrine_parameter_divine_marriage_piety_gain_active: "The [GetDoctrineType('doctrine_monogamy').GetBaseName] marriage bonus also grants a large amount of @piety_icon![piety|E] if you are marrying a [close_family|E] member"
 doctrine_parameter_tenet_divine_marriage_spouse_contribution: "[skills|E] contribution from [spouse|E] [councillor_tasks|E]: #P +25%#!"
 doctrine_parameter_tenet_divine_marriage_incestuous_liege_faction_reluctance: "Adherents are significantly less likely to create or join [factions|E] against a [liege|E] married to [close_family|E] or [extended_family|E]"
 
 tenet_pacifism_name:0 "Pacifism"
 tenet_pacifism_desc:0 "Violence is an abhorrent act that only leads to suffering, pain, and regret. By working to avoid it whenever possible we can build stronger, more secure societies for the faithful to live in. Pacifist counties grow and prosper under this peaceful order."
 doctrine_parameter_holy_wars_forbidden:0 "Cannot declare [holy_wars|E] or [raid|E]"
 doctrine_parameter_pacifist_opinion_active: "Pacifist Opinion: $VALUE|+=0$"
 pacifist_opinion_name:0 "Fellow Pacifist"
 pacifist_county_opinion_name:0 "Fellow Pacifist County"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "[opinion|E] of other Pacifists: $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "Rulers at peace for at least two years will have their @piety_icon![piety|E] change by $VALUE|+$ each month"
 PIETY_LONG_PEACE:0 "Long Peace"

 tenet_vows_of_poverty_name:0 "Vows of Poverty"
 tenet_vows_of_poverty_desc:0 "Money corrupts the hearts of men and pushes them away from the true faith. We must shun the acquisition of material wealth if we are to focus on what really matters, choosing humble activities and finding piety in their completion."
 tenet_vows_of_poverty_apostolic_historical_glossary: "[Glossary('Paupertas Apostolica','tenet_vows_of_poverty_apostolic_historical_desc')]"
 tenet_vows_of_poverty_apostolic_historical_desc: "The Christian ideal of renouncing possessions in imitation of Christ and the apostles."
 doctrine_parameter_vows_of_poverty_active:0 "[rulers|E] can [decide|E] to make a Vow of Poverty, reducing monthly [tax|E] income but increasing monthly @piety_icon![piety|E] gain"

 tenet_human_sacrifice_name:0 "Human Sacrifice"
 tenet_human_sacrifice_desc:0 "The best way to prove our devotion is through the act of sacrifice. The most valuable sacrifice we can offer is the sacrifice of human life."
 doctrine_parameter_human_sacrifice_active:1 "[executions|E] earn @piety_icon![piety|E] instead of costing @piety_icon![piety|E]"
 doctrine_parameter_human_sacrifice_sharing_power_prestige: "[executions|E] never cost @prestige_icon![prestige|E] when [sharing_power|E]"
 doctrine_parameter_flower_war_cb_active:0 "Grants the [flowery_war|E] [casus_belli|E] against neighboring realms"
 doctrine_parameter_tenet_human_sacrifice_execution_piety_bonus: "[executions|E] grant additional @piety_icon![piety|E] and @spiritual_fulfillment_icon![spiritual_fulfillment|E] based on the sacrifice's [nobility|E] and [rank|E]"
 doctrine_parameter_tenet_human_sacrifice_siege_capture_chance: "Significantly higher chance to capture characters during [sieges|E]"
 doctrine_parameter_tenet_human_sacrifice_courtier_imprisonment_chance: "Increased chance to [imprison|E] unlanded characters"

 tenet_gruesome_festivals_blot_name:0 "Blót"
 tenet_gruesome_festivals_name:0 "Gruesome Festivals"
 tenet_gruesome_festivals_desc: "We are all born in blood. We survive by the blood of our livestock, our family, our foes. It is only natural that [ROOT.Rite.GetFaith.PantheonTerm] demand their fair share."
 tenet_gruesome_festivals_blot_historical_glossary: "[Glossary('Blót','tenet_gruesome_festivals_blot_historical_desc')]"
 tenet_gruesome_festivals_blot_historical_desc: "A sacrificial ritual practiced by Old Norse pagans, in which animals or humans were sacrificed to the gods. It was often accompanied by a large communal feast."
 gruesome_festivals_active_name:0 "ability to conduct grand sacrifices"
 doctrine_parameter_gruesome_festivals_active:0 "Unlocks the [GetActivityType('activity_gruesome_festival').GetName] [activity|E] around once a decade, granting @piety_icon![piety|E] plus same-[faith|E] subject and [county_opinion|E]"

 tenet_volcanic_veneration_name:0 "Volcanic Veneration"
 tenet_volcanic_veneration_desc: "There is little more divine than the newborn earth spewing from the fiery pits of our home. We spend our lives on the edge of disaster, forever at the mercy of [ROOT.Rite.GetFaith.PantheonTerm]."
 tenet_cthonic_redoubts_name:0 "Chthonic Redoubts"
 tenet_cthonic_redoubts_desc:0 "There is no shelter better than the roots of the Earth, no fortress hardier than its jutting spines, no pilgrimage more sacred than its hidden trails. We gaze down at Creation from these lofty summits and feel the true weight of the Divine."
 doctrine_parameter_easier_to_convert_faith_in_mountains:0 "[convert_county|E] speed in mountainous [terrain|E]: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains:0 "[promote_culture|E] speed in same-[faith|E] mountainous [terrain|E]: #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains:0 "Hostile [convert_county|E] speed in mountainous [terrain|E]: #P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"

 tenet_consolamentum_name:1 "Endura"
 tenet_consolamentum_name_alternate:0 "Ritual Suicide"
 tenet_consolamentum_desc:0 "When we grow old or sick, we perform a ritual to cleanse our souls of sin. Once that is done, we quickly and definitively end our lives, so that sin does not have the opportunity to infest us once more."
 doctrine_parameter_consolamentum_active:1 "Adherents can [decide|E] to end their life when old, incapable, or near death; doing so does not incur any of the normal penalties from suicide"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing: "When an adherent dies by the [GetDecisionWithKey('initiate_consolamentum_decision').GetName] [decision|E], their heir gains #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! @piety_icon![piety|E]"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing_personal: "Your heir gains a further #P [EmptyScope.ScriptValue('monumental_piety_gain')|0]#! @piety_icon![piety|E] and $pam_blessed_passing_modifier$ for #P 10#! years if you die by the [GetDecisionWithKey('initiate_consolamentum_decision').GetName] [decision|E]"

 tenet_gnosticism_name: "Gnosticism"
 tenet_gnosticism_desc: "Through knowledge, the divine spark that rests inside all humans may be liberated and returned to its heavenly source in the spirit-realm."
 doctrine_parameter_granting_titles_gives_stress: "Giving away [titles|E] relieves [stress|E]"

 tenet_mendicant_preachers_name:0 "Mendicant Preaching"
 tenet_mendicant_preachers_desc:0 "Our missionaries travel far and wide with nothing but the clothes they wear on their back. They live off the generosity of those they visit, and share the knowledge of the true faith in return."
 doctrine_parameter_mendicant_preachers_conversion_active:0 "County Conversion Speed: #P +33#!"
 doctrine_parameter_tenet_mendicant_preachers_conversion_fulfillment: "Converting a [character|E] grants additional @spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_tenet_mendicant_preachers_sway_acceptance: "Swaying [characters|E] of another [faith|E] is more likely to succeed"
 doctrine_parameter_tenet_mendicant_preachers_activity_guest_conversion: "Guests of another [faith|E] at your [activities|E] may be converted to yours"
 doctrine_parameter_tenet_mendicant_preachers_local_conversion: "Enables the #V $attempt_conversion_of_local_ruler_interaction$#! [interaction|E] with [rulers|E] in your current [location|E]"
 doctrine_parameter_tenet_mendicant_preachers_proselytize_travel_option: "Enables the [GetTravelOption('adventurers_proselytize_zealously_option').GetName] [travel_option|E] without the [GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)] [perk|E]"
 apa_pam_mendicant_preachers_conversion_title: "[second.GetShortUINameNoTooltip|U] Converts to [first.GetFaith.GetName]"
 must_be_in_same_county_tt: "You must be in a [county|E] they hold"

 tenet_communal_identity_name:0 "Communal Identity"
 tenet_communal_identity_desc:0 "Our faith and our culture are intrinsically linked together. This practice strengthens the bonds of our community, though it tends to exclude foreigners."
 doctrine_parameter_same_communal_identity_opinion_active:0 "#P +10#! [opinion|E] with characters of the same [faith|E]"
 doctrine_parameter_tenet_communal_identity_free_council_sway: "Swaying a faction at an [ecumenical_council|E] costs no @prestige_icon![prestige|E]"
 doctrine_parameter_tenet_communal_identity_sway_piety: "[piety_i]#P [EmptyScope.ScriptValue('miniscule_piety_gain')|0]#! [piety|E] each time you successfully [GetScheme('sway').GetTypeName] someone of your own [rite|E]"
 doctrine_parameter_tenet_communal_identity_language_devotion: "[GetScheme('learn_language').GetTypeName] [scheme_success_chance|E] against targets of your own [rite|E]: [success_chance_i]#P +20%#!"
 doctrine_parameter_tenet_communal_identity_language_reward: "Learning the [language|E] of someone of your own [rite|E] grants @piety_icon![piety|E] and @spiritual_fulfillment_icon![spiritual_fulfillment|E]"
 doctrine_parameter_same_culture_conversion_bonus_active:1 "Conversion Speed in [counties|E] of my [culture|E]: #P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active:1 "Promote Culture Speed in [counties|E] of my [faith|E]: #P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active:1 "Conversion Speed in [counties|E] of a different [culture|E]: #N -50%#!"

 tenet_pentarchy_name:0 "Ecclesiarchy"
 tenet_pentarchy_alternate_name:0 "The Pentarchy"
 tenet_pentarchy_desc:0 "Our Holy Sites are more than just sacred places — they are the very seats of power from which our religious leaders rule."

 tenet_aniconism_name:0 "Aniconism"
 tenet_aniconism_desc:0 "The worship of graven images has blinded far too many to the divine truth. We will cast all icons out of our holy places so that our faithful will not fall into that trap."
 doctrine_parameter_reforging_artifacts_costs_piety: "[rulers|E] of this [rite|E] must spend @piety_icon![piety|E] to [reforge|E] or [repair|E] [artifacts|E]"
 doctrine_parameter_destroying_artifacts_is_pious: "[rulers|E] of this [rite|E] can destroy [artifacts|E] for @piety_icon![piety|E]"
 doctrine_parameter_destroying_artifacts_is_pious_personal: "Can destroy [artifacts|E] for @piety_icon![piety|E]"
 doctrine_parameter_tenet_aniconism_siege_destruction_bonus: "Sieging [rulers|E] of a [faith|E] without this [core_tenet|E] destroys more [development|E], damages [artifacts|E] more often, and grants @piety_icon![piety|E]"
 tenet_aniconism_siege_destruction_toast: "$tenet_aniconism_name$"
 doctrine_parameter_tenet_aniconism_destruction_fulfillment: "Gain @spiritual_fulfillment_icon![spiritual_fulfillment|E] for destroying [artifacts|E], and for sieges against a [faith|E] without this [core_tenet|E]"
 pam_aniconism_siege_toast: "From your [GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )] [personal_tenet|E]"
 destroying_artifacts_is_not_pious_tt: "Your [rite|E] cannot destroy [artifacts|E] for [piety|E]"
 artifact_is_rarer_than_masterwork_tt:0 "This [artifact|E] has higher than Masterwork [rarity|E]"

 tenet_alexandrian_catechism_name:0 "Alexandrian Catechism"
 tenet_alexandrian_catechism_desc:0 "The Catechetical School of Alexandria had a long tradition of encouraging theologians to think critically and question the status quo.\n\nDespite the physical destruction of the school, we carry on these traditions."
 tenet_islamic_rationalism_name: "Islamic Rationalism"
 tenet_islamic_rationalism_desc: "Since [ROOT.Rite.GetFaith.HighGodNameAlternate] is just and wise, [ROOT.Rite.GetFaith.HighGodNameSheHe|U] cannot go against reason or disregard the wellbeing of [ROOT.Rite.GetFaith.HighGodHerHis|U] creation. Only through unaided reason can we hope to comprehend our part in [ROOT.Rite.GetFaith.HighGodHerHis|U] great work, and separate good from evil."
 tenet_islamic_rationalism_historical_glossary: "[Glossary('Kalām','tenet_islamic_rationalism_historical_desc')]"
 tenet_islamic_rationalism_historical_desc: "Theology as developed through reasoned argument. Used to examine religious doctrine and interpretations of revelation."
 doctrine_parameter_scholasticism_is_holy: "The [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E] grants additional bonuses"
 doctrine_parameter_tenet_alexandrian_catechism_catechetical_school: "Children educated with [learning|E] [education_focus|E] may come of age with [learning_lifestyle|E] [experience|E], more often when well educated yourself"
 doctrine_parameter_tenet_alexandrian_catechism_catechesis_conversion: "County Conversion Speed: #P +25%#!"

 tenet_hedonistic_name:0 "Hedonism"
 tenet_hedonistic_desc:0 "The divine filled this world with a bounty of pleasures for us to indulge in and enjoy — to not partake of such things is to snub the very work of creation itself."
 doctrine_parameter_piety_from_feasts_active:1 "Hosting a [GetActivityType('activity_feast').GetName] earns @piety_icon![piety|E]"
 doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'doctrine_parameter_piety_from_festivals_active_auh')]" # Only show if you have AUH
 doctrine_parameter_piety_from_festivals_active_auh: "Hosting a [GetActivityType('activity_festival').GetName] earns @piety_icon![piety|E]"

 tenet_carnal_exaltation_name:0 "Carnal Exaltation"
 tenet_carnal_exaltation_desc:0 "The pleasures of the flesh are sublime in a way that transcends other earthly experiences, bringing us closer to the divine. We should glorify our sexual desires and seek out opportunities for us to fulfill them."
 doctrine_parameter_piety_from_seduction_active: "Gain @piety_icon![piety|E] from successful [GetScheme('seduce').GetTypeName] [schemes|E]"
 doctrine_parameter_tenet_carnal_exaltation_clergy_no_continence: "[clergy|E] of this [rite|E] are not expected to abstain from carnal relations"
 doctrine_parameter_tenet_carnal_exaltation_deviancy_virtuous: "Allows the [faith|E] to select the [GetDoctrineType('doctrine_deviancy_virtuous').GetBaseName] [doctrine|E]"
 doctrine_parameter_tenet_carnal_exaltation_sensual_bonus: "[characters|E] with [GetTrait('lustful').GetName( GetNullCharacter )], [GetTrait('rakish').GetName( GetNullCharacter )], or [GetTrait('deviant').GetName( GetNullCharacter )] gain #P +2#! [intrigue|E], #P +2#! [diplomacy|E], and #P +25%#! [fertility|E] per trait"
 doctrine_parameter_tenet_carnal_exaltation_sensual_seduction: "[characters|E] with [GetTrait('lustful').GetName( GetNullCharacter )], [GetTrait('rakish').GetName( GetNullCharacter )], or [GetTrait('deviant').GetName( GetNullCharacter )] complete [GetScheme('seduce').GetTypeName] [schemes|E] #P 20#! days faster per trait"
 doctrine_parameter_tenet_carnal_exaltation_commission_artifacts_debauched: "Can create Debauched artifacts using the [GetDecisionWithKey('commission_artifact_decision').GetName] [decision|E]"

 tenet_polyamory_name:0 "Polyamory"
 tenet_polyamory_desc: "Our love for each other should be as unconditional as [ROOT.Rite.GetFaith.FertilityGodNamePossessive] love for us. We must cast away the outdated notions of one person owning the affections of another."
 doctrine_parameter_no_unfaithfulness_penalty_active:0 "Adherents do not receive [opinion|E] penalties or [imprisonment_reasons|E] on their spouse or their spouse's lovers for having extramarital relationships"
 doctrine_parameter_tenet_polyamory_romance_seduction_scheme_bonus: "[GetScheme('courting').GetTypeName] and [GetScheme('seduce').GetTypeName] [scheme_success_chance|E]: [success_chance_i]#P +35%#!"
 doctrine_parameter_tenet_polyamory_romance_seduction_fulfillment: "Lose [stress|E] and gain @spiritual_fulfillment_icon![spiritual_fulfillment|E] from successful [GetScheme('courting').GetTypeName] and [GetScheme('seduce').GetTypeName] [schemes|E]"
 doctrine_parameter_tenet_polyamory_new_beloved: "Gaining a [lover|E] or [soulmate|E] grants #P [EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! @spiritual_fulfillment_icon![spiritual_fulfillment|E], #P 20#! less [stress|E], and #V 5#! years of [GetModifier('tenet_polyamory_new_beloved_modifier').GetNameWithTooltip], at most once a year"
 tenet_polyamory_new_beloved_toast: "From your [GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )] [personal_tenet|E]"
 doctrine_parameter_tenet_carnal_exaltation_seduction_fulfillment: "Lose [stress|E] and gain @spiritual_fulfillment_icon![spiritual_fulfillment|E] from successful [GetScheme('seduce').GetTypeName] [schemes|E]"

 tenet_unrelenting_faith_name:0 "Unrelenting Faith"
 tenet_unrelenting_faith_desc:0 "Our convictions are strong, and we will gladly fight and die for our faith. No matter how badly the odds are stacked against us, we shall not surrender."
 tenet_unrelenting_faith_zandik_name: "Righteous Rebellion"
 tenet_unrelenting_faith_zandik_desc: "We wish no harm to any soul, nor any thing, but if our ways are threatened, we will defend them with relentless ferocity." 

 tenet_rite_name:0 "Rite"
 tenet_rite_desc:0 "Our beliefs are not so very different from those of our mother-faith... why should we quibble over specifics when we agree on the major points of doctrine, and, most importantly, the ultimate authority for arbitration?"
 doctrine_parameter_maintains_head_of_faith_on_creation:0 "New [faiths|E] keep their old [head_of_faith|E] on creation"
 doctrine_parameter_ecumenical_christians_keep_ecumenism:0 "[GetPlayer.Custom('GetRiteEcumenismFullOrEmpty')]"
 GetRiteEcumenismFullOrEmpty_full: "Christian [faiths|E] with [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName] keep it on creation"
 GetRiteEcumenismMiaphysiteFullOrEmpty_full: "Christian [faiths|E] with [GetDoctrineType('special_doctrine_ecumenical_miaphysite').GetBaseName] keep it on creation"
 GetRiteEcumenismFullOrEmpty_empty: ""

 #Muslim Tenets
 tenet_struggle_submission_name:0 "Struggle and Submission"
 tenet_struggle_submission_desc:0 "Divine will is the source of all good, so a good existence is based on submission to that will, expressed through the struggle to enact it."
 tenet_struggle_submission_jihad_historical_glossary: "[Glossary('Jihād','tenet_struggle_submission_jihad_historical_desc')]"
 tenet_struggle_submission_jihad_historical_desc: "Moral, spiritual, and physical effort within Islam. Combat in self-defense is permitted under religious authority and legal rules within the faith."
 doctrine_parameter_bonus_holy_war_piety_active:0 "@piety_icon![piety|E] and [piety_experience|E] from winning [holy_wars|E] is increased by #P 50%#!"

 tenet_religious_legal_pronouncements_name:0 "Religious Law"
 tenet_religious_legal_pronouncements_hisbah: "Hisbah"
 tenet_religious_legal_pronouncements_fatwa:0 "Fatwa"
 tenet_religious_legal_pronouncements_halakha:0 "Halakha"
 tenet_religious_legal_pronouncements_desc:0 "The border between theological and legal arguments is thin, and spiritual qualities can and should be considered in secular settlements. A ruler may seek a religious condemnation of any adult same-[religion|E] direct [vassal|E], but the outcome depends on the ruler's [learning|E] and the vassal's moral record."
 tenet_religious_legal_pronouncements_hisbah_historical_glossary: "[Glossary('Hisbah','tenet_religious_legal_pronouncements_hisbah_historical_desc')]"
 tenet_religious_legal_pronouncements_hisbah_historical_desc: "One's duty in Islam to promote right conduct and prevent wrongdoing. This includes supervision of public morality and public spaces."
 tenet_religious_legal_pronouncements_fatwa_historical_glossary: "[Glossary('Fatwā','tenet_religious_legal_pronouncements_fatwa_historical_desc')]"
 tenet_religious_legal_pronouncements_fatwa_historical_desc: "A qualified scholar's opinion on a legal matter, distinct from a judgment delivered by a court. It serves as guidance rather than written law."
 tenet_religious_legal_pronouncements_halakha_historical_glossary: "[Glossary('Halakha','tenet_religious_legal_pronouncements_halakha_historical_desc')]"
 tenet_religious_legal_pronouncements_halakha_historical_desc: "The collective body of Jewish religious laws drawn from scripture, rabbinic interpretations, and legal rulings. It is meant to regulate religious observance and daily life."
 tenet_religious_legal_pronouncements_historical_glossary: "$tenet_religious_legal_pronouncements_hisbah_historical_glossary$ / $tenet_religious_legal_pronouncements_fatwa_historical_glossary$ / $tenet_religious_legal_pronouncements_halakha_historical_glossary$"
 doctrine_parameter_temporal_condemnation_enabled:0 "Rulers may attempt to condemn adult same-[religion|E] direct [vassals|E]. The more [sinful|E] a vassal is, the less [learning|E] their ruler needs, while [virtuous|E] traits make success harder."
 doctrine_parameter_temporal_condemnation_criminal: "A successful condemnation marks the vassal as a [criminal|E] and may allow their titles to be revoked"
 doctrine_parameter_tenet_religious_law_scholar_trait: "Gain the [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E]"
 doctrine_parameter_tenet_religious_law_condemnation_bonus: "Condemnation [interaction|E] [success_chance|E]: #P +25#!"
 doctrine_parameter_tenet_religious_law_imprisonment_bonus: "Your [learning|E] adds #P +2#! [interaction|E] acceptance per point when attempting rightful [imprisonment|E]"
 doctrine_parameter_religious_legal_pronouncements_law_cost_reduction:0 "Law Costs: #P -10%#!"
 tenet_religious_legal_pronouncements_cost_tooltip:0 "Religious Law: #P -10%#!"
 tenet_religious_fatwa_cost_tooltip:0 "Fatwa: #P -10%#!"
 tenet_religious_halakha_cost_tooltip:0 "Halakha: #P -10%#!"

 tenet_false_conversion_sanction_name:0 "Sanctioned False Conversions"
 tenet_temporal_condemnation_taqiya:0 "Taqiya"
 tenet_anusim:0 "Anusim"
 tenet_false_conversion_sanction_desc:0 "If your life is threatened, it is acceptable to confess a false faith, as long as you keep the truth in your heart."
 tenet_false_conversion_sanction_taqiyya_historical_glossary: "[Glossary('Taqiyya','tenet_false_conversion_sanction_taqiyya_historical_desc')]"
 tenet_false_conversion_sanction_taqiyya_historical_desc: "The concealment of true religious belief. Shaped by persecution, it is a way to practice true beliefs while avoiding severe harm."
 tenet_false_conversion_sanction_anusim_historical_glossary: "[Glossary('Anusim','tenet_false_conversion_sanction_anusim_historical_desc')]"
 tenet_false_conversion_sanction_anusim_historical_desc: "People compelled to abandon observance of their true faith. Jewish law distinguishes this coercion from voluntary rejection of the faith."
 tenet_false_conversion_sanction_historical_glossary: "$tenet_false_conversion_sanction_taqiyya_historical_glossary$ / $tenet_false_conversion_sanction_anusim_historical_glossary$"
 doctrine_parameter_sanctioned_false_conversion_county_resistance: "County Conversion Resistance: #P +30%#!"
 doctrine_parameter_sanctioned_false_conversion:0 "[characters|E] and [counties|E] may sometimes reconvert back to this [faith|E] if led astray"
 doctrine_parameter_tenet_false_conversion_sanction_elusive: "You are harder to [imprison|E] and much more likely to escape [prison|E]"

 tenet_tax_nonbelievers_name:0 "Taxation of Nonbelievers"
 tenet_tax_nonbelievers_desc:0 "Military service is for the faithful only, while a tax is levied on nonbelievers for the protection they are offered."
 tenet_tax_nonbelievers_jizya_historical_glossary: "[Glossary('Jizya','tenet_tax_nonbelievers_jizya_historical_desc')]"
 tenet_tax_nonbelievers_jizya_historical_desc: "A tax levied on certain non-Muslim subjects under Islamic rule. Several exemptions and variations exist across jurisdictions and groups of people."
 tenet_tax_nonbelievers_jizya_name:0 "Jizya"

 tenet_literalism_name:0 "Literalism"
 tenet_literalism_desc:0 "Our holy texts clearly state divine intent, and human interpretation is of limited value."
 doctrine_parameter_literalist_debate_enabled:0 "May debate other lords of the realm at the cost of [opinion|E], to gain or lose @piety_icon![piety|E]"
 doctrine_parameter_tenet_literalism_conversion_resistance: "[characters|E] of this [faith|E] are less likely to be converted away from it"
 doctrine_parameter_literalism_holy_war_cb_active: "Grants a [holy_war|E] [casus_belli|E] against [characters|E] of the same [religion|E] whose [rite|E] lacks this tenet"
 doctrine_parameter_tenet_literalism_debate_experience: "Winning a debate grants [learning|E] [experience|E]"
 doctrine_parameter_tenet_literalism_scholar_conversion: "While you have the [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E], [convert_county|E] is faster and [characters|E] more likely to convert"
 doctrine_parameter_tenet_literalism_scholar_trait: "Gains the [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E]"

 tenet_legalism_name:0 "Legalism"
 tenet_legalism_desc:0 "Our laws are the result of generations of wisdom and devoutness, and adhering to them is by its very nature pious. A sinner, no matter who, will never be above the law."
 doctrine_parameter_legalism_reduced_faction_virtues:0 "[vassals|E] and [counties|E] are less likely to join [factions|E] against a [virtuous|E] ruler"
 doctrine_parameter_legalism_increased_faction_sins:0 "[vassals|E] and [counties|E] are more likely to join [factions|E] against a [sinful|E] ruler"
 doctrine_parameter_tenet_legalism_sinful_revocation: "Revoking titles from [sinful|E] [vassals|E] does not incur [tyranny|E]"
 doctrine_parameter_tenet_legalism_title_integration: "$task_integrate_title$ [councillor_task|E] progression speed: #P +100%#!"
 doctrine_parameter_tenet_legalism_lawful_authority: "Your demands to revoke [titles|E], [imprison|E], or [retract|E] [vassals|E] are more likely to be accepted"
 LEGALISM_TITLE_INTEGRATION_BONUS: "$tenet_legalism_name$: $task_integrate_title$ progress doubled"
 LEGALISM_LAWFUL_AUTHORITY_REASON: "$tenet_legalism_name$: $VALUE|=+$"
 
 tenet_reincarnation_name:0 "Reincarnation"
 tenet_reincarnation_desc:0 "We have lived many lives before this one, and will continue to live many lives after it. Every death is only the beginning of something new."
 tenet_reincarnation_samsara_historical_glossary: "[Glossary('Saṃsāra','tenet_reincarnation_samsara_historical_desc')]"
 tenet_reincarnation_samsara_historical_desc: "The cycle of death and rebirth. Your eternal soul will endlessly return to this realm of existence until you break free."
 tenet_reincarnation_zoroastrian_name: "Raj'a"
 tenet_reincarnation_zoroastrian_desc: "Like the gods can incarnate in human bodies, we too may be reborn. The good are rewarded with forms of beauty and purity, and may ultimately become angels of pure light."
 doctrine_parameter_reincarnation_resistance_to_conversion:0 "County Conversion Resistance: #P +20%#!"
 doctrine_parameter_reincarnation_events_active:1 "Children have a chance of being recognized as the reincarnation of an ancestor, gaining the [GetTrait('reincarnation').GetName( GetNullCharacter )] [trait|E]"
 doctrine_parameter_tenet_reincarnation_trigger_decision: "Unlocks the $tgp_divine_reincarnation_decision$ [decision|E]"
 doctrine_parameter_tenet_reincarnation_piety_level_courage: "At [piety_level|E] 3 or above, gain [GetTrait('brave').GetName( GetNullCharacter )] or shed [GetTrait('craven').GetName( GetNullCharacter )]"
 pam_reincarnation_courage_toast: "$tenet_reincarnation_name$"
 doctrine_parameter_tenet_reincarnation_ancestral_trait_decision: "Unlocks the $inherit_ancestral_trait_decision$ [decision|E]"

 tenet_esotericism_name:0 "Esotericism"
 tenet_esotericism_kabbalah:0 "Kabbalah"
 tenet_esotericism_desc:0 "The great mysteries of the divine may be beyond mortal comprehension, but that is not an excuse for ignorance. Their very existence compels us to seek knowledge and understanding of the world around us."
 tenet_esotericism_kabbalah_historical_glossary: "[Glossary('Kabbalah','tenet_esotericism_kabbalah_historical_desc')]"
 tenet_esotericism_kabbalah_historical_desc: "Hermetic mysticism transmitted from scholars to initiates, concerning the nature of God, creation, and hidden meanings in scripture."
 doctrine_parameter_tenet_esotericism_mystic_education:3 "Children with the [learning|E] [education_focus|E] may come of age with a great deal of [learning_lifestyle|E] [experience|E] if they do well at their studies"
 doctrine_parameter_tenet_esotericism_eccentric_education: "Children with the [learning|E] [education_focus|E] may grow [GetTrait('eccentric').GetName( GetNullCharacter )]"
 doctrine_parameter_tenet_esotericism_eccentric_bonuses: "The [GetTrait('eccentric').GetName( GetNullCharacter )] [trait|E] grants additional @piety_icon![piety|E] and [opinion|E], and costs less [stress|E]"
 doctrine_parameter_tenet_esotericism_seek_spiritual_mysteries: "Unlocks the $seek_spiritual_mysteries_decision$ [decision|E]"
 tenet_esotericism_kabbalah_desc:0 "The teachings of Kabbalah bring into mortal comprehension the relationship between the eternal God, the nature of infinity known as Ein Sof, and God's creation. Kabbalah forms the basis for all Judaic mysticism, and practitioners of Kabbalah often engage with other Jewish schools."
 tenet_religious_kabbalah_cost_tooltip:0 "Kabbalah: #P -10%#!"

 #Eastern Tenets
 tenet_adaptive_name:0 "Adaptability"
 tenet_adaptive_desc:0 "Dogmatic adherence to old restrictions only harms the faithful. As long as we stay true to the core beliefs of our faith, we may adapt our laws to the world around us."
 doctrine_parameter_tenet_adaptive_conversion_resistance:0 "County Conversion Resistance: #P +30%#!"
 doctrine_parameter_reduced_vassal_religion_discontent:1 "Infidel [vassals|E] are less likely to join Independence and Populist [factions|E]"
 doctrine_parameter_immaterial_harmony_conversion_cost_reduced: "@piety_icon![piety|E] cost to convert to another [faith|E] with this [doctrine|E]: #P -50%#!"
 doctrine_parameter_immaterial_harmony_no_holy_orders: "Cannot create [military_holy_orders|E]"

 tenet_inner_journey_name:0 "Inner Journey"
 tenet_inner_journey_desc:0 "Only by understanding one's own self can we understand the world. The journey of self-discovery is important as it is long and difficult."
 tenet_inner_journey_historical_glossary: "[Glossary('Dhyāna','tenet_inner_journey_historical_desc')]"
 tenet_inner_journey_historical_desc: "Contemplative meditation that increases concentration and spiritual understanding."
 doctrine_parameter_meditation_mechanics_active:0 "Characters can [decide|E] to Meditate in Seclusion, reducing [stress|E] and possibly gaining theological insights"
 doctrine_parameter_tenet_inner_journey_meditation_bonus: "@piety_icon![piety|E] and @spiritual_fulfillment_icon![spiritual_fulfillment|E] for taking the [GetDecisionWithKey('meditate_in_seclusion_decision').GetName] [decision|E]"
 doctrine_parameter_tenet_inner_journey_humble_pilgrimage_bonus: "[pilgrimages|E] with the #V $pilgrimage_pomp_humble$#! [activity_option|E] grant additional @piety_icon![piety|E]"
 pam_inner_journey_meditation_toast: "From your [GetTenetType('tenet_inner_journey').GetName( GetPlayer.GetRite )] [personal_tenet|E]"

 tenet_dharmic_pacifism_name:0 "Dharmic Pacifism"
 tenet_dharmic_pacifism_desc:0 "We are all a part of the cosmic order. Violence against anything is violence against everything, oneself included."
 tenet_dharmic_pacifism_historical_glossary: "[Glossary('Ahiṃsā','tenet_dharmic_pacifism_historical_desc')]"
 tenet_dharmic_pacifism_historical_desc: "The practice of non-violence central to Hindu, Jain, and Buddhist traditions. It can be expressed through following a strict vegetarian diet."

 tenet_bhakti_name: "$tenet_bhakti_patron_god_name$"
 tenet_bhakti_patron_god_name:0 "Patron Gods"
 tenet_bhakti_desc:0 "Mortals cannot live up to the full glory of the divine, but by selecting a single aspect of divinity to emulate, worship, and devote oneself to, we can come closer to them than would otherwise be possible."
 tenet_bhakti_historical_glossary: "[Glossary('Bhakti Mārga','tenet_bhakti_historical_desc')]"
 tenet_bhakti_historical_desc: "Hindu devotional traditions express a loving relationship with a deity or guru through song and poetry."
 doctrine_parameter_select_personal_god_active:1 "Rulers can [decide|E] to pick a personal avatar to venerate, gaining a related bonus"
 doctrine_parameter_select_personal_god_active_personal: "Can [decide|E] to pick a personal avatar to venerate, and the cost of replacing personal avatar reduced"

 tenet_asceticism_name:0 "Asceticism"
 tenet_asceticism_desc:0 "Materialistic pursuits blind us to the divine truth. Only by devoting ourselves to live simple lives without luxury can we achieve spiritual enlightenment. "
 tenet_asceticism_tapas_historical_glossary: "[Glossary('Tapas','tenet_asceticism_tapas_historical_desc')]"
 tenet_asceticism_tapas_historical_desc: "An internal spiritual fire stoked by discomfort and discipline. Fasting and self-denial advance one's spiritual development."
 doctrine_parameter_tenet_asceticism_inappetetic_trait: "Gain the [GetTrait('inappetetic').GetName( GetNullCharacter )] [trait|E]"
 doctrine_parameter_tenet_asceticism_inappetetic_bonus: "[GetTrait('inappetetic').GetName( GetNullCharacter )] [characters|E] gain #P +1#! [diplomacy|E], #P +2#! [learning|E], #P +10%#! @spiritual_fulfillment_icon![spiritual_fulfillment|E] gain, and #P +10%#! [stress|E] loss"
 doctrine_parameter_tenet_asceticism_comfort_eater_penalty: "[GetTrait('comfort_eater').GetName( GetNullCharacter )] [characters|E] lose #N 0.1#! monthly @piety_icon![piety|E] and #N 5#! same-[faith|E] [opinion|E]"

 tenet_ritual_hospitality_name:0 "Ritual Hospitality"
 tenet_ritual_hospitality_alternate_name:0 "Pūjā"
 tenet_ritual_hospitality_desc:0 "Hospitality is one of the greatest virtues mankind can exhibit. Guests in our homes, be they mortal or divine, should always be treated with the utmost honor and respect."
 tenet_ritual_hospitality_puja_historical_glossary: "[Glossary('Pūjā','tenet_ritual_hospitality_puja_historical_desc')]"
 tenet_ritual_hospitality_puja_historical_desc: "Expressions of worship through offerings, prayers, and acts of reverence. A deity can be honored as a guest and offered food, water, flowers, and other gifts."
 doctrine_parameter_host_honored_guests_active:0 "[rulers|E] can host other characters as an Honored Guest, spending @piety_icon![piety|E] in exchange for increased [opinion|E]"
 doctrine_parameter_tenet_ritual_hospitality_artifact_theft_risk: "[artifacts|E] in your realm are more likely to be stolen"
 doctrine_parameter_tenet_ritual_hospitality_court_position_event_discount: "Recruiting [court_positions|E] through [decision|E] events costs #P 25%#! less @gold_icon![gold|E]"
 doctrine_parameter_tenet_ritual_hospitality_invite_to_court_acceptance: "[characters|E] are far more likely to accept an invitation to your court"
 doctrine_parameter_tenet_ritual_hospitality_free_guest_recruitment: "Recruiting guests to your court is free"
 doctrine_parameter_tenet_ritual_hospitality_feast_toast_friendship: "Toasting the guest of honor at a [feast|E] always offers the chance to befriend them"

 #Pagan tenets
 tenet_warmonger_name:0 "Warmongering"
 tenet_warmonger_desc:0 "Faith and war go hand in hand. One who refuses to fight in the name of the divine cannot be called a true believer."
 doctrine_parameter_conquest_cb_enabled:0 "[rulers|E] have a Conquest [casus_belli|E] against neighboring rulers"
 doctrine_parameter_faith_can_raid:0 "Allows the [raiding|E] of foreign [counties|E] for loot"
 doctrine_parameter_invasion_cb_enabled:0 "Prestigious [rulers|E] can use an Invasion [casus_belli|E] once per lifetime"
 doctrine_parameter_great_holy_wars_active_if_reformed:1 "If one exists, the [head_of_faith|E] can declare [great_holy_wars|E], provided this [faith|E] is [organized|E]"
 doctrine_parameter_clergy_can_fight_personal: "Can serve as [commanders|E] or $knight_culture_player_plural$ despite being [clergy|E] (if [rite|E] has no $tenet_pacifism_name$ [core_tenets|E])"

 tenet_ancestor_worship_name:0 "Ancestor Worship"
 tenet_ancestor_worship_desc:0 "Our ancestors watch over us from beyond the grave, guiding us and showing us the way forward. For this we must respect and honor them."
 doctrine_parameter_tenet_ancestor_worship_renown_on_death: "[rulers|E] of this [faith|E] grant their [dynasty|E] [dynasty_prestige|E] on death, based on their [prestige_level|E] and [piety_level|E]"
 doctrine_parameter_tenet_ancestor_worship_seek_ancestral_guidance: "Unlocks the $seek_ancestral_guidance_decision$ [decision|E]"

 tenet_adorcism_name:0 "Adorcism"
 tenet_adorcism_desc:0 "The spirits of this world can do great works of both good and evil. By honoring and respecting them we can only hope that they will do their good to us and their evil to our foes."
 doctrine_parameter_spirit_possession_active:1 "Enables the 'Seek Aid of The Spirits' [decision|E]"
 doctrine_parameter_tenet_adorcism_curse_enemy: "You can use the $pam_curse_enemy_decision$ [decision|E] against [rivals|E], [nemeses|E], and opponents in your [wars|E]"
 doctrine_parameter_tenet_adorcism_seek_war_aid: "You can use the $pam_seek_war_aid_decision$ [decision|E] while at [war|E]"

 tenet_ritual_celebrations_name:0 "Ritual Celebrations"
 tenet_ritual_celebrations_desc:1 "The worship of the divine is something to be exalted in and shared with our community. Organizing great festivals to honor and praise the divine brings us all together."
 doctrine_parameter_mandatory_feast_attendance:0 "[vassals|E] are more likely to attend your Feasts. Those who still refuse to come will lose @piety_icon![piety|E] for doing so."

 tenet_sky_burials_name:0 "Sky Burials"
 tenet_sky_burials_desc:1 "The dead should not be imprisoned underground — it is far better to allowed them to be consumed by scavenging birds, where in a final act of generosity they can feed the world which fed them."
 doctrine_parameter_sky_burials_active:3 "[rulers|E] can give their ancestors a Sky Burial, gaining @piety_icon![piety|E] and pleasing their [vassals|E]"
 doctrine_parameter_sky_burials_charnel_grounds: "The [GetBuilding('charnel_grounds_01').GetName] [duchy_building|E] can be built"
 can_build_towers_of_silence_active_name: "ability to use the [GetBuilding('tower_of_silence_01').GetName] [duchy_building|E]"
 doctrine_parameter_can_build_towers_of_silence_active: "[vassals|E] may build the [GetBuilding('tower_of_silence_01').GetName] [duchy_building|E] to bolster [county|E] zeal — #EMP if#! their [liege|E]'s [faith|E] does not engage in $tenet_sky_burials_name$"

 tenet_sacred_childbirth_name:0 "Sacred Childbirth"
 tenet_sacred_childbirth_alternate_name:0 "Kūdikis Lemti"
 tenet_sacred_childbirth_desc:0 "The bathhouses where mothers give birth must be cleansed and prepared with the proper rituals, in order to encourage the divine to grant us their blessing during childbirth."
 doctrine_parameter_safer_childbirths_active:0 "Mothers are #P less likely#! to die during pregnancy and childbirth"
 doctrine_parameter_healthier_children_active:0 "Children are #P less likely#! to be sickly or stillborn"
 doctrine_parameter_piety_from_childbirth_active:0 "Mothers and fathers gain @piety_icon![piety|E] when their child is born"
 doctrine_parameter_free_wet_nurse_court_position:1 "Unlocks the #V [GetCourtPositionType('wet_nurse_court_position').GetName()]#! [court_position|E], who can be employed at #P no cost#!"
 doctrine_parameter_tenet_sacred_childbirth_offer_bedside_support: "Unlocks the $offer_bedside_support_interaction$ [interaction|E]"
 doctrine_parameter_tenet_sacred_childbirth_birthing_building_discount: "Bathhouses cost #P 25%#! less @gold_icon![gold|E] to build"
 tenet_sacred_childbirth_birthing_building_discount_cost_desc: "$tenet_sacred_childbirth_name$"
 piety_from_childbirth_toast:0 "Sacred Childbirth"

 tenet_sanctity_of_nature_name:0 "Sanctity of Nature"
 tenet_sanctity_of_nature_desc:1 "The natural world is the creation of the divine, and we are merely guests in it. We must respect and honor every tree, every animal, and even the ground itself."
 # This parameter does nothing; it's just here to flag the tenet's nature silently so we can reference it without directly tagging the tenet.
 doctrine_parameter_believes_in_harmony_with_nature_invisible:0 ""
 doctrine_parameter_tenet_sanctity_of_nature_preserve_wilderness: "Unlocks the $preserve_wilderness_decision$ [decision|E], reducing @travel_danger_icon![travel_danger|E] and increasing @travel_speed_icon![travel_speed|E] in empty provinces"
 doctrine_parameter_tenet_sanctity_of_nature_hike: "Gain access to the [hike_i|E][hike|E] [activity|E]"
 doctrine_parameter_tenet_sanctity_of_nature_wilderness_fulfillment: "Traveling through each unique empty province grants a tiny amount of @spiritual_fulfillment_icon![spiritual_fulfillment|E]"

 tenet_mystical_birthright_name:0 "Auspicious Birthright"
 tenet_mystical_birthright_alternate:0 "Táltos Születés"
 tenet_mystical_birthright_desc:0 "Every one of us is born with a destiny, the most important of which is that of the Táltos — those who are chosen from birth to wield magical powers and become great spiritual leaders."
 doctrine_parameter_mystic_birthright_active:1 "Children can be born with the [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E] and #V 100#! [experience|E]: #V 1%#! chance (#V 5%#! for a player's child), at most once per #V 30#! years, announced to the whole [faith|E]"
 doctrine_parameter_tenet_mystical_birthright_blessed_marks_mild: "[characters|E] with [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], or [GetTrait('clubfooted').GetName( GetNullCharacter )] gain #P +2#! [learning|E], #P +5%#! [men_at_arms|E] [toughness|E], and #P +10%#! @legitimacy_icon![legitimacy|E] gain"
 doctrine_parameter_tenet_mystical_birthright_blessed_marks_severe: "[characters|E] with [GetTrait('dwarf').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('beauty_bad_2').GetName( GetNullCharacter )], [GetTrait('albino').GetName( GetNullCharacter )], or [GetTrait('giant').GetName( GetNullCharacter )] gain #P +3#! [learning|E], #P +10%#! [men_at_arms|E] [toughness|E], #P +20%#! @legitimacy_icon![legitimacy|E] gain, and #P +10#! [dread|E]"
 doctrine_parameter_tenet_mystical_birthright_blessed_marks_grave: "[characters|E] with [GetTrait('bleeder').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], or [GetTrait('beauty_bad_3').GetName( GetNullCharacter )] gain #P +4#! [learning|E], #P +20%#! [men_at_arms|E] [toughness|E], #P +30%#! @legitimacy_icon![legitimacy|E] gain, #P +20#! [dread|E], and #P +15#! [clergy|E] [opinion|E]"

 tenet_astrology_name:0 "Astrology"
 tenet_astrology_desc:0 "The night sky is our window into the realm of the divine. The great secrets and mysteries of the world are written there, open for all to learn if they know where to look."
 doctrine_parameter_divine_the_stars_active:0 "Allows adherents to Divine the Stars and predict their future"
 doctrine_parameter_tenet_astrology_divination_bonus: "The [GetDecisionWithKey('divine_the_stars_decision').GetName] [decision|E] grants more @spiritual_fulfillment_icon![spiritual_fulfillment|E] and lasts longer"
 doctrine_parameter_tenet_astrology_mystic_trait: "Gains the [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]"
 doctrine_parameter_tenet_astrology_albino_omen: "[GetTrait('albino').GetName( GetNullCharacter )] [characters|E]: #P +10#! general [opinion|E], #P +20#! same-faith [opinion|E], #P +30%#! @piety_icon![piety|E] gain"
 doctrine_parameter_tenet_astrology_scaly_omen: "[GetTrait('scaly').GetName( GetNullCharacter )] [characters|E]: #P +15#! [attraction|E] [opinion|E], #P +10#! [vassal|E] [opinion|E], #P +30%#! @piety_icon![piety|E] gain"
 doctrine_parameter_tenet_astrology_auspicious_timing: "[GetTrait('organizer').GetName( GetNullCharacter )] [characters|E]: #P +10%#! Movement Speed"
 tenet_divination_name: "Divination"
 tenet_divination_desc: "The fate of mortals and the future of the world is written in the stars and in hidden signs, and through rituals, dreams and omens, skilled practitioners can divine these secrets from the spirits beyond."

 tenet_sun_worship_name:0 "Sun Worship"
 tenet_sun_worship_desc:0 "The light-bringer, the live-giver, the ever-burning flame — it reigns high in the sky as the true sovereign of the world."
 doctrine_parameter_summer_festivals_active:0 "Hosting Feasts in the summer months earns @piety_icon![piety|E]"
 doctrine_parameter_trial_by_sun_active:0 "Imprisoned [criminals|E] can be sentenced to a Sun Trial"
