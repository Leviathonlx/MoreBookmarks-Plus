 doctrine_parameter_cremation_funeral: "The [funeral|E] [activity|E] costs greatly reduced [gold|E]"
 doctrine_parameter_mummification_funeral: "The [funeral|E] [activity|E] costs more [gold|E] and yields powerful [artifacts|E] at the end of the activity"
 doctrine_parameter_family_rites: "The [funeral|E] [activity|E] offers opportunities to gain [merit|E]"
