 global_religion.1000.t: "Exiled [local_character.GetFaith.GetAdherentNamePluralNoTooltip]"
 global_religion.1000.desc_same_faith_counties: "Over [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] followers of [target_rite.GetName], exiled from the [target_rite_associated_county.GetName], wish to enter my realm. Their leader, [local_character.GetFirstName], seeks audience: "We are searching for a better, safer life, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] says. "Let us settle across [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].""
 global_religion.1000.desc_same_faith_counties_alt: "Religious persecution is rife in the [target_rite_associated_county.GetName], where the [target_rite_associated_county_rite.GetAdjective] nobility is forcibly converting followers of [target_rite.GetName].\n\nNow, over [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] exiles wish to enter my realm. Their leader, [local_character.GetFirstName], seeks audience: "We are searching for a better, safer life, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] says. "Let us settle across [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].""
 global_religion.1000.desc_any_counties: "Religious persecution is rife in the [target_rite_associated_county.GetName], where the [target_rite_associated_county_rite.GetAdjective] nobility is forcibly converting followers of [target_rite.GetName].\n\nNow, over [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] exiles wish to enter my realm. Their leader, [local_character.GetFirstName], seeks audience: "We are searching for a better, safer life, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] pleads. "Let us settle around [initial_county_target.GetNameNoTier]."\n\nIf I permit it, the [local_character.GetFaith.GetAdjective] faith will spread across [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 global_religion.1000.desc_any_counties_alt: "Over [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] followers of [target_rite.GetName], exiled from the [target_rite_associated_county.GetName], wish to enter my realm. Their leader, [local_character.GetFirstName], seeks audience: "We are searching for a better, safer life, [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetSheHe] pleads. "Let us settle around [initial_county_target.GetNameNoTier]."\n\nIf I permit it, the [local_character.GetFaith.GetAdjective] faith will spread across [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 global_religion.1000.special: "I will embrace the [local_character.GetRite.GetAdjectiveNoTooltip] rite!"
 global_religion.1000.a: "You are more than welcome here."
 global_religion.1000.b: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] cannot accommodate you."
 global_religion.1000.violent: "Defenseless exiles? Rob them."
 global_religion.1000.serenity_aspect: "You will live in the capital, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."

