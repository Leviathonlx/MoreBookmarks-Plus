 doctrine_pilgrimage_name: "Pilgrimage Attitude"
 doctrine_pilgrimage_local_rites_name: "Local Rites"
 doctrine_pilgrimage_local_rites_desc: "Adherents of this faith prefer the comfort and stability of routine rites at local shrines over the hazards and strain of lengthy pilgrimages."
 doctrine_parameter_local_shrine_offering: "Has access to the [GetDecisionWithKey('visit_local_shrine_decision').GetName] [decision|E] but the [pilgrimage|E] [activity|E] is more costly"
 local_shrine_offering_name: "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_local_rites_name$"
 doctrine_pilgrimage_forbidden_name: "Forbidden"
 doctrine_pilgrimage_forbidden_descriptive_name: "Forbidden Pilgrimages"
 doctrine_pilgrimage_forbidden_desc: "The presence of [ROOT.Faith.HighGodName] can be felt everywhere and the notion that certain places are more divine than others is nothing short of heresy."
 doctrine_pilgrimage_encouraged_name: "Encouraged"
 doctrine_pilgrimage_encouraged_descriptive_name: "Encouraged Pilgrimages"
 doctrine_pilgrimage_encouraged_desc: "This faith encourages its members to visit earthly locations deemed to be of spiritual significance as a means of demonstrating reverence for [ROOT.Faith.PantheonTerm]."
 doctrine_pilgrimage_mandatory_name: "Mandatory"
 doctrine_pilgrimage_mandatory_descriptive_name: "Mandatory Pilgrimages"
 doctrine_pilgrimage_mandatory_desc: "It is expected that all able-bodied [ROOT.Faith.GetAdherentNamePlural] complete a spiritual journey to a holy place as soon as they are able. Failing to do so represents a failure to submit oneself to [ROOT.Faith.HighGodName]."
 doctrine_pilgrimage_mandatory_hajj_name: "Hajj"
 doctrine_pilgrimage_mandatory_hajj_desc: "It is expected that all able-bodied Muslims complete a Hajj to Mecca during their lifetime. While special exemptions are often made, any [ROOT.Faith.GetAdherentNameNoTooltip] who fails to complete a Hajj will be looked upon with skepticism."
 forbidden_from_pilgrimage_name: "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_forbidden_name$"
 doctrine_parameter_forbidden_from_pilgrimage: "Does not have access to the [pilgrimage|E] [activity|E][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_pilgrimage_warning')]"
 doctrine_parameter_can_go_on_pilgrimage: "Has access to the [pilgrimage|E] [activity|E]"
 mandatory_pilgrimage_name: "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_mandatory_name$"
 doctrine_parameter_mandatory_pilgrimage: "The [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E] grants additional bonuses and the [pilgrimage|E] [activity|E] grants extra [piety|E] upon completion"
