l_english: 
 # used by code as ultimate fallback.
 rite_no_name: "#D Rite Name#!"
 rite_no_name_adj: "#D Unnamed#!"
 rite_no_name_adherent: "$rite_no_name_adj$"
 rite_no_name_adherent_plural: "$rite_no_name_adj$"
 rite_no_name_desc: "#D This Rite should have a name #!"

 generic_rite_description: "[Rite.GetNameNoTooltip] was founded by [Character.GetFullName] in [Character.GetCurrentLocation.GetTitle.GetAdjective] on the [GetCurrentDate.GetStringLong], as a rite within the [Faith.GetAdjective] faith. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_no_location_description: "[Rite.GetNameNoTooltip] was founded by [Character.GetFullName] on the [GetCurrentDate.GetStringLong], as a rite within the [Faith.GetAdjective] faith. [Rite.Custom('GetGenericRiteTenetSentence')]"

 generic_rite_focus_fallback: "This rite preserves a distinctive devotional emphasis within its parent faith."
 generic_rite_focus_tenet_aniconism: "This rite rejects sacred images, seeking reverence through absence, restraint, and the holiness of the unpictured divine."
 generic_rite_focus_tenet_alexandrian_catechism: "This rite prizes learned teaching, subtle doctrine, and the patient instruction of the faithful."
 generic_rite_focus_tenet_armed_pilgrimages: "This rite treats holy war and armed pilgrimage as sacred duties of the devout."
 generic_rite_focus_tenet_carnal_exaltation: "This rite honors desire and embodied pleasure as gifts touched by the sacred."
 generic_rite_focus_tenet_communal_identity: "This rite binds worship tightly to shared custom, common life, and a guarded communal identity."
 generic_rite_focus_tenet_communion: "This rite is held together through shared devotion, alms, and communion with its spiritual head."
 generic_rite_focus_tenet_consolamentum: "This rite looks to final purification through renunciation and an unflinching preparation for death."
 generic_rite_focus_tenet_divine_marriage: "This rite sacralizes union and rulership alike, seeing holy marriage as a reflection of divine order."
 generic_rite_focus_tenet_gnosticism: "This rite seeks hidden truths beyond the world's veil, trusting salvation to sacred knowledge."
 generic_rite_focus_tenet_mendicant_preachers: "This rite spreads the faith through wandering preachers, humble witness, and tireless instruction."
 generic_rite_focus_tenet_pacifism: "This rite elevates restraint and peace, treating needless bloodshed as a grave failure of the soul."
 generic_rite_focus_tenet_pentarchy: "This rite esteems ancient seats of authority and the ordered stewardship of the wider faith."
 generic_rite_focus_tenet_unrelenting_faith: "This rite praises steadfast zeal, hard resolve, and a readiness to struggle for what is holy."
 generic_rite_focus_tenet_vows_of_poverty: "This rite honors holy poverty, urging the faithful to cast off excess and live with less."
 generic_rite_focus_tenet_pastoral_isolation: "This rite prefers a guarded flock, favoring separation from the wider world over compromise."
 generic_rite_focus_tenet_rite: "This rite places great weight on liturgy, clerical order, and the preservation of sacred tradition."
 generic_rite_focus_tenet_adaptive: "This rite bends without breaking, absorbing local custom while preserving its sacred core."
 generic_rite_focus_tenet_esotericism: "This rite treasures hidden wisdom, initiation, and truths revealed only to the prepared."
 generic_rite_focus_tenet_legalism: "This rite grounds holiness in clear law, proper judgment, and the disciplined ordering of life."
 generic_rite_focus_tenet_literalism: "This rite cleaves closely to holy words, distrusting loose interpretation and inherited compromise."
 generic_rite_focus_tenet_reincarnation: "This rite sees the soul's journey as cyclical, with each life shaping the next."
 generic_rite_focus_tenet_religious_legal_pronouncements: "This rite invests sacred law and formal rulings with lasting spiritual authority."
 generic_rite_focus_tenet_struggle_submission: "This rite teaches that faith is proven through struggle, conquest, and the submission of the ungodly."
 generic_rite_focus_tenet_false_conversion_sanction: "This rite tolerates hidden conformity and outward masks when survival or advantage demands it."
 generic_rite_focus_tenet_tax_nonbelievers: "This rite marks unbelief as a burden owed in tribute, reinforcing sacred hierarchy through worldly dues."
 generic_rite_focus_tenet_asceticism: "This rite seeks holiness through self-denial, discipline, and the patient mastery of desire."
 generic_rite_focus_tenet_bhakti: "This rite centers heartfelt devotion, teaching that loving surrender draws the soul closest to the divine."
 generic_rite_focus_tenet_dharmic_pacifism: "This rite prizes harmlessness and self-restraint, treating peace as a higher discipline than wrath."
 generic_rite_focus_tenet_inner_journey: "This rite turns inward, seeking awakening through reflection, discipline, and the transformation of the self."
 generic_rite_focus_tenet_ritual_hospitality: "This rite treats hospitality as holy obligation, binding host and guest beneath sacred custom."
 generic_rite_focus_tenet_adorcism: "This rite courts the spirits with reverence, hoping to win their favor and avert their wrath."
 generic_rite_focus_tenet_ancestor_worship: "This rite looks to the honored dead for guidance, blessing, and continuity with the living."
 generic_rite_focus_tenet_astrology: "This rite reads meaning in the heavens, trusting the stars to reveal order, fate, and timing."
 generic_rite_focus_tenet_hedonistic: "This rite embraces revelry, excess, and the sanctification of pleasure in communal worship."
 generic_rite_focus_tenet_human_sacrifice: "This rite treats blood offering as a fearful but sacred bargain between mortal and divine."
 generic_rite_focus_tenet_mystical_birthright: "This rite holds that destiny marks certain souls from birth for sacred power and spiritual greatness."
 generic_rite_focus_tenet_ritual_celebrations: "This rite exalts communal revels and holy festivity as the fullest expression of worship."
 generic_rite_focus_tenet_sacred_childbirth: "This rite surrounds birth with reverence, treating motherhood and new life as acts of holy significance."
 generic_rite_focus_tenet_sanctity_of_nature: "This rite finds the sacred in the living world, revering growth, fertility, and untamed creation."
 generic_rite_focus_tenet_sun_worship: "This rite honors the sun as a life-giving sign of order, radiance, and divine favor."
 generic_rite_focus_tenet_warmonger: "This rite glorifies conquest and martial vigor, expecting the faithful to prove themselves through war."
 generic_rite_focus_tenet_gruesome_festivals: "This rite embraces terrible revels, turning fear, blood, and spectacle into sacred display."
 generic_rite_focus_tenet_cthonic_redoubts: "This rite venerates the heights and hidden fastnesses of the earth as places of uncommon sanctity."
 generic_rite_focus_tenet_household_gods: "This rite centers the home, placing hearth, kin, and daily devotion under divine guardianship."
 generic_rite_focus_tenet_sinitic_syncretism: "This rite weaves its tradition together with Sinitic thought, seeking harmony rather than rupture."
 generic_rite_focus_tenet_eastern_syncretism: "This rite readily absorbs eastern teachings, reading foreign wisdom as echoes of sacred truth."
 generic_rite_focus_tenet_unreformed_syncretism: "This rite draws freely from older practice, folding ancient rites into a new sacred whole."
 generic_rite_focus_tenet_christian_syncretism: "This rite absorbs Christian teachings into its sacred framework instead of rejecting them outright."
 generic_rite_focus_tenet_islamic_syncretism: "This rite borrows from Islamic belief and custom, finding usable truth within a neighboring revelation."
 generic_rite_focus_tenet_jewish_syncretism: "This rite incorporates Jewish tradition, law, and memory into its understanding of the sacred."
 generic_rite_focus_tenet_exaltation_of_pain: "This rite regards pain as purifying, revealing devotion through endurance and embraced suffering."
 generic_rite_focus_tenet_natural_primitivism: "This rite distrusts excess civilization, honoring a harder and more elemental way of life."
 generic_rite_focus_tenet_pursuit_of_power: "This rite blesses ambition and temporal mastery, treating power as a proper instrument of the holy."
 generic_rite_focus_tenet_ritual_cannibalism: "This rite folds the consumption of human flesh into taboo worship and sacred terror."
 generic_rite_focus_tenet_sacred_shadows: "This rite veils itself in secrecy, sanctifying concealment, twilight, and what is hidden from the many."
 generic_rite_focus_tenet_polyamory: "This rite blesses multiple loves at once, refusing to confine sacred intimacy to a single bond."
 generic_rite_focus_tenet_sacrificial_ceremonies: "This rite places solemn offering at the center of worship, binding sacrifice to covenant and favor."
 generic_rite_focus_tenet_megaliths: "This rite marks the sacred with enduring stone, trusting monuments to anchor memory and devotion."
 generic_rite_focus_tenet_fp3_fedayeen: "This rite sanctifies stealth, infiltration, and self-sacrificing violence in the service of a higher cause."
 generic_rite_focus_tenet_communal_possessions: "This rite downplays private wealth, urging the faithful to hold resources in common."
 generic_rite_focus_tenet_pure_land: "This rite fixes hope on a blessed realm beyond suffering, reached through trust, remembrance, and devotion."
 generic_rite_focus_tenet_no_mind: "This rite seeks clarity beyond grasping thought, disciplining the self into empty and lucid awareness."
 generic_rite_focus_tenet_mountain_worship: "This rite turns to high places as nearer the divine, making peaks and heights objects of reverence."
 generic_rite_focus_tenet_extinction_of_dharma: "This rite sees the world as overrun by corruption, justifying ruthless violence in defense of truth."
 generic_rite_focus_tenet_cranial_trophies: "This rite treats the remains of enemies as sacred proof of triumph and terrifying prestige."
 generic_rite_focus_tenet_pursuit_of_knowledge: "This rite exalts learning as sacred labor, seeking truth through study, debate, and disciplined inquiry."
 generic_rite_focus_tenet_benevolent_governance: "This rite measures holiness partly by just rule, orderly stewardship, and care for the realm."
 generic_rite_focus_tenet_filial_piety: "This rite teaches reverence for parents and elders as the foundation of moral and sacred order."
 generic_rite_focus_tenet_harmonious_society: "This rite values balance, propriety, and social harmony as reflections of cosmic order."
 generic_rite_focus_tenet_sacred_destruction: "This rite sees holy destruction as cleansing, making ruin itself an instrument of sacred renewal."
 generic_rite_focus_tenet_preservation: "This rite prizes endurance, continuity, and the careful safeguarding of what has been entrusted."
 generic_rite_focus_tenet_takamin: "This rite treats the bear and kindred powers of the wild with reverence, awe, and careful respect."
 generic_rite_focus_tenet_peace_of_god: "This rite seeks to restrain violence, setting sacred limits on when blood may rightly be spilled."
 generic_rite_focus_tenet_dulia: "This rite honors saints and holy exemplars, venerating their memory without equating them to the divine."
 generic_rite_focus_tenet_transubstantiation: "This rite treats the holy mysteries as truly transformative, making sacrament central to divine presence."
 generic_rite_focus_tenet_ora_et_labora: "This rite joins prayer to labor, teaching that disciplined work can itself become devotion."
 generic_rite_focus_tenet_hyperdulia: "This rite raises exceptional veneration of the holiest intercessor above the ordinary ranks of saints."
 generic_rite_focus_tenet_simony: "This rite accepts that sacred office, patronage, and worldly wealth are not easily separated."
 generic_rite_focus_tenet_monophysitism: "This rite proclaims the unity of Christ's nature, refusing to divide the divine mystery too sharply."
 generic_rite_focus_tenet_acts_of_apostles: "This rite models itself on apostolic community, charity, and the shared life of the earliest faithful."
 generic_rite_focus_tenet_purgatory: "This rite teaches that many souls are purified after death before they can enter perfect blessedness."
 generic_rite_focus_tenet_be_fruitful_and_multiply: "This rite elevates family, procreation, and the begetting of new life as holy duties."
 generic_rite_focus_tenet_apostolic_succession: "This rite grounds authority in an unbroken chain of transmission reaching back to the apostles."
 generic_rite_focus_tenet_confession: "This rite prizes open repentance and absolution, trusting spoken sin to become the beginning of healing."
 generic_rite_focus_tenet_original_sin: "This rite sees human weakness as primordial, insisting that no soul enters the world untouched."
 generic_rite_focus_tenet_celestial_hierarchy: "This rite imagines the cosmos as ordered in sacred ranks, with each station reflecting divine design."
 generic_rite_focus_tenet_miles_christi: "This rite casts the faithful as soldiers of the sacred, called to defend truth with disciplined zeal."
 generic_rite_focus_tenet_scholasticism: "This rite sharpens belief through argument, commentary, and the reconciliation of reason and faith."
 generic_rite_focus_tenet_adoptionism: "This rite emphasizes exaltation and divine sonship in a way that downplays eternal distinction."
 generic_rite_focus_tenet_love_thy_neighbour: "This rite places mercy and neighborly love at the heart of daily religious life."
 generic_rite_focus_tenet_divine_liturgy: "This rite exalts solemn liturgy, treating ordered worship as the clearest window into the divine."
 generic_rite_focus_tenet_miaphysitism: "This rite teaches the inseparable union of divinity and humanity within the one mystery of Christ."
 generic_rite_focus_tenet_hesychasm: "This rite seeks union through silence, stillness, and the inward repetition of holy prayer."
 generic_rite_focus_tenet_anachoresis: "This rite honors withdrawal from the world, seeking sanctity in solitude, hardship, and distance."
 generic_rite_focus_tenet_mortification_of_the_flesh: "This rite pursues holiness through bodily hardship, bending the flesh to spiritual purpose."
 generic_rite_focus_tenet_holy_myron: "This rite gives special weight to holy anointing, treating sacred oil as a seal of divine grace."
 generic_rite_focus_tenet_khachkar: "This rite sanctifies carved stone crosses and enduring monuments as public witnesses of the sacred."

