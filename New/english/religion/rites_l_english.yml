 generic_tenet_focus_tenet_sacred_destruction: "[GetTenetType('tenet_sacred_destruction').GetName( GetPlayer.GetRite )] sees holy ruin as cleansing, making devastation itself an instrument of renewal."
 generic_tenet_focus_tenet_preservation: "[GetTenetType('tenet_preservation').GetName( GetPlayer.GetRite )] prizes endurance, continuity, and the careful safeguarding of what has been entrusted."
 generic_tenet_focus_tenet_takamin: "[GetTenetType('tenet_takamin').GetName( GetPlayer.GetRite )] treats the bear and kindred powers of the wild with reverence, awe, and careful respect."
 generic_tenet_focus_tenet_peace_of_god: "[GetTenetType('tenet_peace_of_god').GetName( GetPlayer.GetRite )] seeks to restrain violence, setting sacred limits on when blood may rightly be spilled."
 generic_tenet_focus_tenet_dulia: "[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )] honors the blessed dead and holy exemplars, cherishing their memory without equating them to the divine."
 generic_tenet_focus_tenet_transubstantiation: "[GetTenetType('tenet_transubstantiation').GetName( GetPlayer.GetRite )] treats the holy mysteries as truly transformative, making sacrament central to divine presence."
 generic_tenet_focus_tenet_ora_et_labora: "[GetTenetType('tenet_ora_et_labora').GetName( GetPlayer.GetRite )] unites devotion and toil, holding that honest labor can itself become worship."
 generic_tenet_focus_tenet_hyperdulia: "[GetTenetType('tenet_hyperdulia').GetName( GetPlayer.GetRite )] raises exceptional veneration of the holiest intercessor above the ordinary ranks of saints."
 generic_tenet_focus_tenet_simony: "[GetTenetType('tenet_simony').GetName( GetPlayer.GetRite )] accepts that sacred office, patronage, and worldly wealth are not easily separated."
 generic_tenet_focus_tenet_monophysitism: "[GetTenetType('tenet_monophysitism').GetName( GetPlayer.GetRite )] proclaims the unity of Christ's nature, refusing to divide the divine mystery too sharply."
 generic_tenet_focus_tenet_acts_of_apostles: "[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )] models itself on apostolic community, charity, and the shared life of the earliest faithful."
 generic_tenet_focus_tenet_purgatory: "[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )] teaches that many souls are cleansed after death before they can enter perfect blessedness."
 generic_tenet_focus_tenet_be_fruitful_and_multiply: "[GetTenetType('tenet_be_fruitful_and_multiply').GetName( GetPlayer.GetRite )] elevates family, procreation, and the begetting of new life as holy duties."
 generic_tenet_focus_tenet_apostolic_succession: "[GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )] grounds authority in an unbroken chain of transmission reaching back to the first disciples."
 generic_tenet_focus_tenet_confession: "[GetTenetType('tenet_confession').GetName( GetPlayer.GetRite )] prizes open repentance and absolution, trusting spoken sin to become the beginning of healing."
 generic_tenet_focus_tenet_original_sin: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )] sees human weakness as primordial, insisting that no soul enters the world untouched."
 generic_tenet_focus_tenet_celestial_hierarchy: "[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )] imagines the cosmos as ordered in sacred ranks, with each station reflecting divine design."
 generic_tenet_focus_tenet_miles_christi: "[GetTenetType('tenet_miles_christi').GetName( GetPlayer.GetRite )] casts the faithful as warriors of the sacred, called to defend truth with disciplined zeal."
 generic_tenet_focus_tenet_scholasticism: "[GetTenetType('tenet_scholasticism').GetName( GetPlayer.GetRite )] sharpens belief through argument, commentary, and the reconciliation of reason and faith."
 generic_tenet_focus_tenet_adoptionism: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )] emphasizes exaltation and divine sonship in a way that downplays eternal distinction."
 generic_tenet_focus_tenet_love_thy_neighbour: "[GetTenetType('tenet_love_thy_neighbour').GetName( GetPlayer.GetRite )] places mercy and charity at the heart of daily religious life."
 generic_tenet_focus_tenet_divine_liturgy: "[GetTenetType('tenet_divine_liturgy').GetName( GetPlayer.GetRite )] exalts solemn rites, treating ordered worship as the clearest window into the sacred."
 generic_tenet_focus_tenet_miaphysitism: "[GetTenetType('tenet_miaphysitism').GetName( GetPlayer.GetRite )] teaches the inseparable union of divinity and humanity within the one mystery of Christ."
 generic_tenet_focus_tenet_hesychasm: "[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )] seeks union through silence, stillness, and the inward repetition of holy prayer."
 generic_tenet_focus_tenet_anachoresis: "[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )] honors withdrawal from the world, seeking sanctity in solitude, hardship, and distance."
 generic_tenet_focus_tenet_mortification_of_the_flesh: "[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )] pursues holiness through bodily hardship, bending base appetites to spiritual purpose."
 generic_tenet_focus_tenet_holy_myron: "[GetTenetType('tenet_holy_myron').GetName( GetPlayer.GetRite )] gives special weight to the rite of anointing, treating sacred oil as a seal of divine grace."
 generic_tenet_focus_tenet_khachkar: "[GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )] sanctifies carved stone crosses and enduring monuments as public witnesses of the sacred."

