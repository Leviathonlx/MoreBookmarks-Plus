 mozarabic_church: "Mozarabism"
 mozarabic_church_adj: "Mozarabic"
 mozarabic_church_adherent: "Mozarab"
 mozarabic_church_adherent_plural: "Mozarabs"
 mozarabic_church_desc: "A descendant of the early Iberian rites, the Mozarabic Rite retains a measure of independence from Rome after centuries of Islamic rule. Long cohabitation with other faiths has bred a tolerance of difference the stricter sects lack."

 ambrosian_rite: "Ambrosian Rite"
 ambrosian_rite_adj: "Ambrosian"
 ambrosian_rite_adherent: "Ambrosian Christian"
 ambrosian_rite_adherent_plural: "Ambrosian Christians"
 ambrosian_rite_desc: "Proper to the Archdiocese of Milan since the days of its great bishop St. Ambrose, the Ambrosian Rite maintains its own liturgy and chant, and a theological tradition that prizes the thought of St. Augustine of Hippo."

 beneventan_rite: "Beneventan Rite"
 beneventan_rite_adj: "Beneventan"
 beneventan_rite_adherent: "Beneventan Christian"
 beneventan_rite_adherent_plural: "Beneventan Christians"
 beneventan_rite_desc: "The liturgical tradition of the Lombard south, centered on Benevento and the great abbey of Montecassino. Its distinctive chant and observances set it apart from the Roman practice, which eyes the rite with growing suspicion."

 carolingian_christianity: "Carolingian Christianity"
 carolingian_christianity_adj: "Carolingian"
 carolingian_christianity_adherent: "Carolingian"
 carolingian_christianity_adherent_plural: "Carolingians"
 carolingian_christianity_desc: "A form of Christianity that developed under the reign of the Carolingian dynasty, characterized by its emphasis on monasticism and missionary work."

 byzantine_rite: "Greek Rite"
 byzantine_rite_adj: "Greek Rite"
 byzantine_rite_adherent: "Greek Christian"
 byzantine_rite_adherent_plural: "Greek Christians"
 byzantine_rite_desc: "The Patriarchate of Constantinople is one of the most significant centers of Eastern Orthodox Christianity, known for its rich theological traditions and historical influence. Greek Rite stems directly from the patriarchy."

 antiochian_rite: "Antiochian Rite"
 antiochian_rite_adj: "Antiochian"
 antiochian_rite_adherent: "Antiochian Christian"
 antiochian_rite_adherent_plural: "Antiochian Christians"
 antiochian_rite_desc: "The Patriarchate of Antioch is one of the oldest Christian communities, founded by St. Peter and St. Paul the Apostles. Its West Syriac tradition, called 'Jacobite' after Jacob Baradaeus who reorganized the church, upholds the Miaphysite teaching and the ancient liturgy of St. James."

 slavic_rite: "Slavic Rite"
 slavic_rite_adj: "Slavic"
 slavic_rite_adherent: "Slavic Christian"
 slavic_rite_adherent_plural: "Slavic Christians"
 slavic_rite_desc: "Brought to the Slavic folk by Cyril and Methodius, this rite incorporates elements of Byzantine liturgy adapted to Slavic languages and culture via the Glagolitic alphabet."

 georgian_rite: "Georgian Rite"
 georgian_rite_adj: "Georgian"
 georgian_rite_adherent: "Georgian"
 georgian_rite_adherent_plural: "Georgians"
 georgian_rite_desc: "The Georgian Rite represents the Christian traditions of Georgia, characterized by a distinct liturgy, ecclesiastical heritage, and strong ties to Eastern Orthodox theology and practice."

 coptic_rite: "Coptic"
 coptic_rite_adj: "Coptic"
 coptic_rite_adherent: "Copt"
 coptic_rite_adherent_plural: "Copts"
 coptic_rite_desc: "Tracing its origins to Saint Mark the Evangelist, the Coptic Church is famous for both being the birthplace of Christian monasticism as well as maintaining a long tradition of the promotion of education and philosophy."

 ethiopian_rite: "Ge'ez"
 ethiopian_rite_adj: "Ge'ez"
 ethiopian_rite_adherent: "Ge'ez"
 ethiopian_rite_adherent_plural: "Ge'ez Christians"
 ethiopian_rite_desc: "Centered in Ethiopia's highlands and rooted in Aksum's legacy, this ancient Christian tradition differs from other Alexandrian churches by maintaining a broader scriptural canon, strong monastic traditions, and a covenant shaped by Solomonic royal heritage."

 armenian_rite: "Apostolic"
 armenian_rite_adj: "Apostolic"
 armenian_rite_adherent: "Apostolic"
 armenian_rite_adherent_plural: "Apostolics"
 armenian_rite_desc: "Founded by the Apostles Bartholomew and Thaddeus, the Armenian Apostolic Church rapidly gained followers in the region and shepherded the Kingdom of Armenia into becoming the first state ever to adopt Christianity as its official religion."
 apostolic_religious_head_title: "Catholicos"
 apostolic_religious_head_title_plural: "Catholicoi"
 apostolic_religious_head_title_name: "Church"

 # Nabi
 nabi: "Nabi"
 nabi_adj: "Nabi"
 nabi_adherent: "Nabi"
 nabi_adherent_plural: "Nabis"
 nabi_desc: "As explicitly stated in the Holy Qur'an, Nabi means being chosen by the Almighty to deliver His message and to remind people of the Day when they will be summoned before Him and held accountable for their actions. According to the core belief, Prophet Muhammad was the last of them."

 # Pre madhabs
 sahabah: "Sahabah"
 sahabah_adj: "Sahabah"
 sahabah_adherent: "Sahabi"
 sahabah_adherent_plural: "Sahabah"
 sahabah_desc: "Also known as the Companions of Muhammad, they were Muslim followers who met or saw him during his lifetime. The companions played a significant role in the early Muslim struggle, society, hadith narration, and governance."
 tabiun: "Tabi'un"
 tabiun_adj: "Tabi'un"
 tabiun_adherent: "Tabi"
 tabiun_adherent_plural: "Tabi'un"
 tabiun_desc: "Described as the generation of Muslims who followed the companions (Sahabah) of Prophet Muhammad, and thus received their teachings secondhand before the arrival of Sunni schools in later centuries."

 # Sunni
 hanafi: "Hanafi"
 hanafi_adj: "Hanafi"
 hanafi_adherent: "Hanafi"
 hanafi_adherent_plural: "Hanafis"
 hanafi_desc: "Developed from the teachings of the jurist and theologian Abu Hanifa, who systemised the use of reasoning. Hanafi legal theory primarily derives law from the Quran, the Sunnah, scholarly consensus and analogical reasoning."

 hanbali: "Hanbali"
 hanbali_adj: "Hanbali"
 hanbali_adherent: "Hanbali"
 hanbali_adherent_plural: "Hanbalis"
 hanbali_desc: "The Hanbali school is the smallest of the four major Sunni Islamic jurisprudence schools, based on Ahmad ibn Hanbal's teachings. Unlike others, Hanbalis oppose codifying law into a comprehensive system, emphasising the Qur'an and Hadith as the highest sources."

 maliki: "Maliki"
 maliki_adj: "Maliki"
 maliki_adherent: "Maliki"
 maliki_adherent_plural: "Malikis"
 maliki_desc: "One of the four major schools of Islamic jurisprudence within Sunni Islam. It was founded by Malik ibn Anas in the 8th century. The Maliki school differs from the other Sunni schools of law most notably in the sources it uses for derivation of rulings."

 shafii: "Shafi'i"
 shafii_adj: "Shafi'i"
 shafii_adherent: "Shafi'i"
 shafii_adherent_plural: "Shafi'is"
 shafii_desc: "The school of al-Shafi'i, the Muslim scholar and jurist of the early 9th century known as 'the father of Muslim jurisprudence'. The core of Shafi'i thought: each act of a believer under the Law answers to a statute in the Revealed Law, the Shari'a."

 #Ismaili
 ismaili: "Isma'ilism"
 ismaili_adj:0 "Isma'ili"
 ismaili_adherent:0 "Isma'ili"
 ismaili_adherent_plural:0 "Isma'ilis"
 ismaili_desc:0 "A Shia rite that considers the line of true Imams — those imbued with divine knowledge and infallibility — to run through Isma'il bin Jafar. They are also known as Seveners, as Isma'il was the seventh Imam after Muhammad."

 #Qarmatians
 qarmatian: "Qarmatianism"
 qarmatian_adj:0 "Qarmatian"
 qarmatian_adherent:0 "Qarmatian"
 qarmatian_adherent_plural:0 "Qarmatians"
 qarmatian_desc:0 "A branch of Isma'ilism that incorporated elements of Zoroastrianism. The number of Imams was preordained by God to be seven, and there could therefore be no more Imams before the seventh Imam — Muhammad ibn Isma'il — returned to guide the faithful."

 #Nizari
 nizari: "Nizarism"
 nizari_adj:0 "Nizari"
 nizari_adherent:0 "Nizari"
 nizari_adherent_plural:0 "Nizaris"
 nizari_desc:0 "A rationalist rite that emphasizes reasoning in interpretation of the Quran and hadiths. Being Imam is hereditary, and they trace the line of succession to Ali."
 
 #Zayidi
 zayidi: "Zayidism"
 zayidi_adj:0 "Zayidi"
 zayidi_adherent:0 "Zayidi"
 zayidi_adherent_plural:0 "Zayidis"
 zayidi_desc:0 "A true Imam is not infallible, but defined by their struggle against corruption and evil. Zayidis are therefore defined by their belief that Zayd ibn Ali was the rightful successor to the Imamate, due to his rebellion against the Umayyads."

 #Imamism (Twelver)
 imami: "Imamism"
 imami_adj:0 "Imami"
 imami_adherent:0 "Imami"
 imami_adherent_plural:0 "Imamis"
 imami_desc:0 "Imamis believe that Twelve Imams were prophesied to lead the Ummah, and that the twelfth Imam, Imam Zaman, is waiting to return to lead Muslims into the Day of Judgement."
 islam_ayatollah:0 "ayatollah"
 islam_ayatollah_plural:0 "ayatollahs"

 ghulat: "Ikhtilafism"
 ghulat_adj:1 "Ikhtilafi"
 ghulat_adherent:1 "Ikhtilafi"
 ghulat_adherent_plural:1 "Ikhtilafis"
 ghulat_desc:1 "Ikhtilafis believe in the divine nature of the infallible Imams, starting with Ali. God has not only appointed and inspired them, but partially inhabits them to guide their acts, and by extension all of the Ummah."

 alawite: "Alawism"
 alawite_adj:0 "Alawite"
 alawite_adherent:0 "Alawi"
 alawite_adherent_plural:0 "Alawis"
 alawite_desc:0 "Alawite religious teachings are secretive, and the Quran is only one of their sacred texts. In addition to the belief in the succession of Imams through Ali, Alawis also believe in reincarnation, and that all beings were stars cast out of heaven who must now re-earn their place by living successive good and faithful lives."

 #Alevis
 alevi: "Alevism"
 alevi_adj:0 "Alevi"
 alevi_adherent:0 "Alevi"
 alevi_adherent_plural:0 "Alevis"
 alevi_desc:0 "Alevis believe in the succession of the Twelve Imams, but also follow many other traditions as outlined in their collection of holy texts, the Buyruks. In Alevi tradition, God is the Truth, and Muhammad and Ali are manifestations of Him in the world."
 alevi_house_of_worship:0 "cemvi"
 alevi_house_of_worship_2:0 "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_3:0 "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_plural:0 "cemvis"
 alevi_religious_text:0 "Buyruks"
 alevi_religious_text_2:0 "$alevi_religious_text$" # Optional translation alt
 alevi_religious_text_3:0 "$alevi_religious_text$" # Optional translation alt

 #Ibadi (Muhakkima)
 ibadi: "Muhakkima"
 ibadi_adj: "Muhakkima"
 ibadi_adherent: "Muhakkima"
 ibadi_adherent_plural: "Muhakkimas"
 ibadi_desc: "The Muhakkima believe the Islamic community doesn't need a Caliph or Imam if no suitable candidate exists. They reject the line of Ali and Abu Bakr's successors as inherently worthy leaders, emphasizing righteous conduct and consensus."

 #Azariqa
 azariqa: "Azraqism"
 azariqa_adj:0 "Azariqa"
 azariqa_adherent:0 "Azariqa"
 azariqa_adherent_plural:0 "Azariqas"
 azariqa_desc:0 "Recognizing no worthy successor to Muhammad, the Azariqas consider it their right and duty to struggle against any leader who does not uphold the values of their faith. Indeed, any difference in interpretation of faith would mark one as an infidel."

 #Najdat
 najdat: "Najdatism"
 najdat_adj:0 "Najdat"
 najdat_adherent:0 "Najdati"
 najdat_adherent_plural:0 "Najdatis"
 najdat_desc:0 "Adherents of the Najdati branch of the Khawarij firmly believe in the establishment of Muslim leadership through the consensus of the faithful. The leader is not infallible, but through the community they are chosen by God."
 
 #Sufri
 sufri: "Sufrism"
 sufri_adj:0 "Sufri"
 sufri_adherent:0 "Sufri"
 sufri_adherent_plural:0 "Sufris"
 sufri_desc:0 "The Sufri believe in divine guidance and leadership through the interpretation of the word of God, rather than inheritance. The will of God becomes known as an expression of the Ummah's will, as long as the people of the Ummah are well-versed in the Quran."

 #Hafizi
 hafizi: "Hafizi"
 hafizi_adj:0 "Hafizi"
 hafizi_adherent:0 "Hafizi"
 hafizi_adherent_plural:0 "Hafizis"
 hafizi_desc:0 "Hafizis put precedence on supporting who they consider to be the true caliph above all others, as well as resisting any and all attempts to unseat or depose them. In defeat, they are defined by rebellion for a worthy cause, and in victory, proud adherence to the will of their leader."

