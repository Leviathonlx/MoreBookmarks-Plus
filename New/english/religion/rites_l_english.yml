 roman_rite: "Roman Rite"
 roman_rite_adj: "Roman Rite"
 roman_rite_adherent: "Roman Christian"
 roman_rite_adherent_plural: "Roman Christians"
 roman_rite_desc: "The Roman rite is the liturgical tradition of the Church of Rome, shaped by Latin theology, juridical authority, and an emphasis on sacramental discipline, clerical hierarchy, and institutional unity."

 insular_celtic: "Insularism"
 insular_celtic_adj: "Insular"
 insular_celtic_adherent: "Insularist"
 insular_celtic_adherent_plural: "Insularists"
 insular_celtic_desc: "A rural church that drifted away from Roman Catholic orthodoxy some centuries ago, Insular Rite has lost many of its once-distinctive features at the insistence of its mother-church. It yet retains a greater emphasis on penance and monasticism, and incorporates many traditional Celtic marriage customs foreign to wider Christendom."
