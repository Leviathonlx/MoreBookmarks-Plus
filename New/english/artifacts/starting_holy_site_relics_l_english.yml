l_english:
 ###############################################
 # Curated relics enshrined at 1066 holy sites #
 # (historical_artifacts.0050)                 #
 ###############################################

 # Christian
 artifact_relic_peter_bones_name: "Bones of Saint Peter"
 artifact_relic_peter_bones_desc: "The bones of the Apostle Peter, prince of the apostles and first bishop of Rome."
 artifact_relic_paul_bones_name: "Bones of Saint Paul"
 artifact_relic_paul_bones_desc: "The bones of the Apostle Paul, martyred at Aquae Salviae."
 artifact_relic_crown_of_thorns_name: "Crown of Thorns"
 artifact_relic_crown_of_thorns_desc: "The crown of thorns pressed upon the head of Christ before the Crucifixion."
 artifact_relic_baptist_arm_name: "Right Arm of Saint John the Baptist"
 artifact_relic_baptist_arm_desc: "The right forearm of John the Baptist, said to be the very hand that baptised Christ in the Jordan."
 artifact_relic_true_cross_name: "Fragment of the True Cross"
 artifact_relic_true_cross_desc: "A splinter of the cross upon which Christ was crucified, set in a gilded reliquary."
 artifact_relic_bones_of_james_name: "Bones of Saint James"
 artifact_relic_bones_of_james_desc: "The bones of the Apostle James the Greater, which draw pilgrims from across Christendom."
 artifact_relic_mark_name: "Head of Saint Mark"
 artifact_relic_mark_desc: "The severed head of the Evangelist Mark, founder of the Church of Alexandria."
 artifact_relic_lance_antioch_name: "Holy Lance of Antioch"
 artifact_relic_lance_antioch_desc: "An iron lance head said to have pierced the side of Christ."
 artifact_relic_tabot_name: "Tabot of the Covenant"
 artifact_relic_tabot_desc: "A consecrated stone tablet representing the Ark of the Covenant, revered as the most sacred of Ethiopian relics."
 artifact_relic_nine_saints_name: "Bones of the Nine Saints"
 artifact_relic_nine_saints_desc: "Bones of the Nine Saints - Syriac monks who fled the Chalcedonian controversies for Aksum and founded Ethiopia's first monasteries, planting Miaphysite Christianity across the highlands."
 artifact_relic_thomas_name: "Relics of the Apostle Thomas"
 artifact_relic_thomas_desc: "The bones and bloodstained spear-head of Thomas the Apostle, who is said to have brought the faith to Kerala and to have been martyred there."
 artifact_relic_augustine_pallium_name: "Pallium of Saint Augustine"
 artifact_relic_augustine_pallium_desc: "The pallium worn by Augustine of Canterbury, first Archbishop and apostle to the English."
 artifact_relic_three_magi_name: "Relics of the Three Magi"
 artifact_relic_three_magi_desc: "The bones of the Three Wise Men who followed the star to Bethlehem."
 artifact_relic_becket_name: "Relics of Saint Thomas Becket"
 artifact_relic_becket_desc: "The blood-soaked garments and skull of Thomas Becket, martyred in his own cathedral in 1170 and swiftly acclaimed the greatest saint of English Christendom."
 artifact_relic_ursula_name: "Bones of Saint Ursula"
 artifact_relic_ursula_desc: "The bones of Ursula and her companion virgin-martyrs, unearthed in the graveyards of Cologne."
 artifact_relic_ignatius_name: "Bones of Saint Ignatius"
 artifact_relic_ignatius_desc: "The bones of Ignatius, second patriarch of Antioch and disciple of the Apostle John, who was martyred in Rome during the reign of Trajan."

 # Islamic
 artifact_relic_black_stone_name: "Fragment of the Black Stone"
 artifact_relic_black_stone_desc: "A polished black fragment set apart from the Black Stone of the Kaaba, kissed by the Prophet himself and venerated by every Hajj pilgrim."
 artifact_relic_dhulfiqar_name: "Dhulfiqar"
 artifact_relic_dhulfiqar_desc: "The cleft-bladed sword of the Prophet, said to have been gifted by him to Ali, and revered across the ummah as a token of divinely sanctioned rule."
 artifact_relic_buraq_footprint_name: "Footprint of the Buraq"
 artifact_relic_buraq_footprint_desc: "A stone bearing the hoofprint left by the Buraq when the Prophet ascended to the heavens from the Foundation Stone in Jerusalem."
 artifact_relic_sword_of_ali_name: "Sword of Ali"
 artifact_relic_sword_of_ali_desc: "A blade Ali ibn Abi Talib is believed to have wielded at Badr and Siffin."
 artifact_relic_abu_hanifa_turban_name: "Turban of Abu Hanifa"
 artifact_relic_abu_hanifa_turban_desc: "The scholar's turban of Abu Hanifa an-Nu'man, founder of the Hanafi madhhab — a pole of Sunni jurisprudence for every Hanafi pilgrim."
 artifact_relic_prophet_sandals_name: "Sandals of the Prophet"
 artifact_relic_prophet_sandals_desc: "Leather sandals said to have been worn by the Prophet, endlessly copied in the na'l shape by devout craftsmen across the ummah."

 # Jewish
 artifact_relic_western_wall_name: "Stone of the Western Wall"
 artifact_relic_western_wall_desc: "A worked stone drawn from the western retaining wall of the Second Temple's platform, one of the few remnants left standing after the Roman destruction of the Temple in 70 CE."
 artifact_relic_tablets_name: "Fragment of the Tablets"
 artifact_relic_tablets_desc: "A chip of stone said to have broken from the Tablets of the Law on Mount Sinai when Moses cast them down in anger."

 # Buddhist
 artifact_relic_bodhi_leaf_name: "Leaf of the Bodhi Tree"
 artifact_relic_bodhi_leaf_desc: "A preserved leaf from the Bodhi Tree at Bodh Gaya, beneath which the Buddha attained enlightenment."
 artifact_relic_vajrasana_name: "Fragment of the Vajrasana"
 artifact_relic_vajrasana_desc: "A polished fragment of the Vajrasana, the Diamond Throne beneath the Bodhi Tree on which the Buddha sat unmoving to the moment of enlightenment."
 artifact_relic_dhamek_name: "Sarira of the Dhamek Stupa"
 artifact_relic_dhamek_desc: "A sacred relic of the Buddha from Sarnath, where he taught the dharma to his first disciples."
 artifact_relic_jowo_name: "Jowo Shakyamuni"
 artifact_relic_jowo_desc: "A consecrated image of the young Buddha, brought from China and regarded by Tibetans as the most sacred of statues."
 artifact_relic_sacred_tooth_name: "Sacred Tooth of the Buddha"
 artifact_relic_sacred_tooth_desc: "The left canine of the Buddha, carried from Kalinga in the 4th century - a palladium of kingship whose custody legitimises the ruler above all others."

 # Hindu
 artifact_relic_lingam_name: "Vishvanath Lingam"
 artifact_relic_lingam_desc: "A sacred fragment of the Shiva-lingam from the great temple at Varanasi, holiest of cities on the Ganges."
 artifact_relic_trishul_name: "Trishul of Shiva"
 artifact_relic_trishul_desc: "A three-pronged trident said to have been wielded by Shiva himself - a symbol of the god's dominion over creation, preservation, and destruction."
 artifact_relic_krishna_stone_name: "Stone of Krishna's Birth"
 artifact_relic_krishna_stone_desc: "A worn stone from the Krishna janmabhumi of Mathura, the very spot tradition names as Krishna's birthplace."
 artifact_relic_rama_footprint_name: "Footprint of Rama"
 artifact_relic_rama_footprint_desc: "A stone that bears the footprint of Rama himself, brought from Ayodhya, his birthplace."

 # Jain
 artifact_relic_palitana_tirtha_name: "Tirtha of Palitana"
 artifact_relic_palitana_tirtha_desc: "A sacred relic stone from the hills of Shatrunjaya at Palitana, the holiest tirtha in the Jain tradition."
 artifact_relic_parshvanatha_paduka_name: "Charan Paduka of Parshvanatha"
 artifact_relic_parshvanatha_paduka_desc: "The Charan Paduka, a stone bearing the impression of the feet of the twenty-third Tirthankara Parshvanatha."
 artifact_relic_shikharji_nishidhi_name: "Nishidhi of the Tirthankaras"
 artifact_relic_shikharji_nishidhi_desc: "Nishidhi memorial stones from the peaks of Mount Sammed-Shikhar, where twenty of the twenty-four Tirthankaras attained moksha - the holiest tirtha of the Jain faith."

 # Zoroastrian
 artifact_relic_atash_bahram_name: "Embers of the Adur Farnbag"
 artifact_relic_atash_bahram_desc: "Glowing embers carried from the great Atash Bahram, the sacred Fire of the Priests, still tended at the fire-temple."

 # Norse
 artifact_relic_yggdrasil_branch_name: "Branch of the Yggdrasil"
 artifact_relic_yggdrasil_branch_desc: "A branch said to have fallen from the sacred tree at the Temple of Uppsala, where the bodies of slaughtered offerings still hang."

 # Slavic
 artifact_relic_perun_idol_name: "Idol of Perun"
 artifact_relic_perun_idol_desc: "A wooden idol of the thunder-god Perun, lord of the Slavic gods, erected by Prince Vladimir."

 # Tengri
 artifact_relic_suldetug_name: "Sülde-tug Banner"
 artifact_relic_suldetug_desc: "A black banner of yak-tails, a spirit-vessel of the war-god, carried before the khans of the steppe."

 # Shinto
 artifact_relic_yata_kagami_name: "Yata no Kagami"
 artifact_relic_yata_kagami_desc: "A bronze mirror traditionally identified with one of the three Imperial Regalia of Japan, said to have drawn the sun-goddess Amaterasu forth from her cave."
 artifact_relic_shin_no_mihashira_name: "Shin no Mihashira"
 artifact_relic_shin_no_mihashira_desc: "A splinter of the Shin no Mihashira - the sacred Central Pillar buried beneath the innermost sanctuary of the Naikū, considered the most hidden and holy of Ise's mysteries and renewed with each shikinen sengū rebuilding."

 # Confucian
 artifact_relic_kong_tomb_name: "Stele of the Kong Tomb"
 artifact_relic_kong_tomb_desc: "A carved stone tablet from the tomb of Confucius at Qufu, venerated by the Kong family across the generations."
 artifact_relic_analects_name: "Analects of Confucius"
 artifact_relic_analects_desc: "An early bamboo-slip copy of the Analects - the collected sayings of Master Kong - studied by generations of Chinese scholars."

 # Hellenic
 artifact_relic_athena_promachos_name: "Fragment of Athena Promachos"
 artifact_relic_athena_promachos_desc: "A bronze fragment from the colossal statue of Athena that once stood watch over the Acropolis."

 # West African
 artifact_relic_opa_oranmiyan_name: "Opa Oranmiyan"
 artifact_relic_opa_oranmiyan_desc: "The granite staff of the legendary king Oranmiyan of Ife, ancestral cradle of the Yoruba."
 artifact_relic_oshe_shango_name: "Oshe Shango"
 artifact_relic_oshe_shango_desc: "The Oshe Shango, a double-headed axe cast in the likeness of the twin thunder-stones of the storm-god Shango, borne aloft by his priests in ecstatic dance."

 # Generic misc archetypes used for religions without a branch-tree tradition
 artifact_misc_relic_idol_name: "Sacred Idol"
 artifact_misc_relic_idol_desc: "A carved idol, the bodily seat of the god during ritual."
 artifact_misc_relic_stele_name: "Ancestral Stele"
 artifact_misc_relic_stele_desc: "An engraved stone slab listing the lineage of the priesthood, a witness across the generations."
 artifact_misc_relic_mask_name: "Ritual Mask"
 artifact_misc_relic_mask_desc: "A ceremonial mask worn during the highest rites, a vessel for the divine presence."
 artifact_misc_relic_banner_name: "Holy Banner"
 artifact_misc_relic_banner_desc: "Consecrated for use in the great rites performed in high holy sites, this banner's cloth is forever steeped in the smoke of offerings."
