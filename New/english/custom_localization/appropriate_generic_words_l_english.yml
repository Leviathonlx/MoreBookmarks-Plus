 #Food and drink glosses
 ABALONE_GLOSS: "A prized shellfish with firm, meaty flesh."
 SEA_CUCUMBER_GLOSS: "A soft marine creature cooked as a delicacy in the high cuisine of China."
 SWALLOW_NEST_GLOSS: "A rare bird's nest dissolved into a luxury soup."
 ENTREMETS_GLOSS: "An elaborate sweet or surprise dish served between courses."
 MOCHI_GLOSS: "A chewy cake of pounded sticky rice."
 DURIAN_GLOSS: "A large tropical fruit famous for its strong scent and rich custardy flesh."
 AQUA_VITAE_GLOSS: "Strong distilled spirits, valued as a medicinal drink."
 TRIBUTE_CHILLED_TEA_GLOSS: "Fine tea cooled with ice or snow and sent as a courtly gift."
 EMPEROR_TEA_GLOSS: "The finest imperial tea leaf reserved for the court."
 BAIJIU_GLOSS: "A strong spirit of China, distilled from grain."
 HANAKUSA_GLOSS: "A blended herbal infusion of flowers and leaves from Japan."
 PEARL_POWDER_GLOSS: "Ground pearl used as a costly tonic."
 CHRYSANTHEMUM_BEER_GLOSS: "A light brew flavored with chrysanthemum."
 SHARBAT_GLOSS: "A sweetened fruit drink, often cooled and spiced."
 SAMBUSA_GLOSS: "A fried pastry stuffed with spiced meat or vegetables."
 PAKHALA_GLOSS: "A cooling dish of fermented rice water from eastern India."
 PILAU_GLOSS: "Seasoned rice cooked with spices and meat or vegetables."
 PASTILLA_GLOSS: "A pie of the Maghreb: spiced meat wrapped in thin pastry."
 BOTUO_GLOSS: "A thick wheat dumpling or noodle soup of China."
 SPHOUNGATA_GLOSS: "A Byzantine-style omelette of beaten eggs."
 TARICHOS_GLOSS: "Salted and dried fish, a Byzantine staple."
 BING_GLOSS: "A flatbread or griddle-cake of China."
 MANTOU_GLOSS: "A soft steamed wheat bun of China."
 ZOSUI_GLOSS: "A rice porridge of Japan, cooked in broth."
 KIMCHI_GLOSS: "Vegetables of Korea fermented with salt and spice."
 BUBUR_GLOSS: "A rice porridge of the Malay archipelago."
