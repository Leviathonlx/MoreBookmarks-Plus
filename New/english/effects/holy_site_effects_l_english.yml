l_english:
 make_holy_site_eminent_global: "[HolySite.GetName] becomes an [eminent_holy_site|E] of [FAITH.GetName]"
 make_holy_site_eminent_third: "$make_holy_site_eminent_global$"
 make_holy_site_eminent_global_past: "[HolySite.GetName] became an [eminent_holy_site|E] of [FAITH.GetName]"
 make_holy_site_eminent_third_past: "$make_holy_site_eminent_global_past$"

 make_holy_site_not_eminent_global: "[HolySite.GetName] will no longer be an [eminent_holy_site|E] of [FAITH.GetName]"
 make_holy_site_not_eminent_third: "$make_holy_site_not_eminent_global$"
 make_holy_site_not_eminent_global_past: "[HolySite.GetName] is no longer an [eminent_holy_site|E] of [FAITH.GetName]"
 make_holy_site_not_eminent_third_past: "$make_holy_site_not_eminent_global_past$"

 remove_holy_site_global: "[HolySite.GetName] is no longer a [holy_site|E] of [FAITH.GetName]"
 remove_holy_site_third: "$remove_holy_site_global$"
 remove_holy_site_global_past: "[HolySite.GetName] was removed as a [holy_site|E] of [FAITH.GetName]"
 remove_holy_site_third_past: "$remove_holy_site_global_past$"

 add_holy_site_global: "[HolySite.GetName] is adopted as a [holy_site|E] of [FAITH.GetName]"
 add_holy_site_third: "$add_holy_site_global$"
 add_holy_site_global_past: "[HolySite.GetName] was adopted as a [holy_site|E] of [FAITH.GetName]"
 add_holy_site_third_past: "$add_holy_site_global_past$"

 add_eminent_holy_site_global: "[HolySite.GetName] is adopted as an [eminent_holy_site|E] of [FAITH.GetName]"
 add_eminent_holy_site_third: "$add_eminent_holy_site_global$"
 add_eminent_holy_site_global_past: "[HolySite.GetName] was adopted as an [eminent_holy_site|E] of [FAITH.GetName]"
 add_eminent_holy_site_third_past: "$add_eminent_holy_site_global_past$"
