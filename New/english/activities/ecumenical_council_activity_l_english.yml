 activity_ecumenical_council_desc: "Summon the great prelates and rulers of Christendom! Our goal shall be to unify belief and practice, all the better to glorify [GetPlayer.GetFaith.HighGodName|U].\n\nWill we gather as the Apostles did in Jerusalem, one in faith, or crack the Church beneath the weight of our pride?"
