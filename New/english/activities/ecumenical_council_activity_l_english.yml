 activity_ecumenical_council_selection_tooltip: "Invite the most influential and learned members of Christendom to debate both theological and earthly matters.\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$[core_tenet|E] changes\n$BULLET_WITH_TAB$[doctrine|E] changes\n$BULLET_WITH_TAB$@fervor_icon![fervor|E]\n$BULLET_WITH_TAB$@piety_icon![piety|E]\n$BULLET_WITH_TAB$@opinion_icon![opinion|E]\n$BULLET_WITH_TAB$[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E] or [trait_level_track_xp|E]"
