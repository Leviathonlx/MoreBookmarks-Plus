 tournament_invite_flavor_contestant: "$invite_to_activity_flavor_tournament$ We will start with the [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] contest; a chance to show your skill to all, I warrant.\n"
 tournament_invite_flavor_standard: "$invite_to_activity_flavor_tournament$ We will start with the [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] contest; it should be quite the spectacle.\n"
 
 tournament_invite_flavor_bad_prizes: "\nUnfortunately the prizes will be mere baubles, but the chance for glory great!\n"
 tournament_invite_flavor_normal_prizes: "\nWhile the focus will be on honing our skills, there will be decent prizes for the victors.\n"
 tournament_invite_flavor_good_prizes: "\nThe prizes will be of good quality, should the opportunity for personal glory not be enough to entice you!\n"
 tournament_invite_flavor_very_good_prizes: "\nI have made sure to procure truly fine prizes for the victors to collect!\n"
 tournament_invite_flavor_splendid_prizes: "\nOnly the most illustrious of prizes will be offered, true works of art by the best artisans in my realm!\n"

 wedding_invite_flavor_betrothed: "At last, the time has come to celebrate our grand wedding. I patiently await you in [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName].\n"
 wedding_invite_flavor_host: "$invite_to_activity_flavor_wedding$ celebrate the marriage of [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_2').GetCharacter.GetFullName] and I in [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName].\n"
 wedding_invite_flavor_standard: "$invite_to_activity_flavor_wedding$ celebrate the marriage of [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_1').GetCharacter.GetFullName] and [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_2').GetCharacter.GetFullName] in [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName].\n"

 feast_invite_flavor_honor: "$invite_to_activity_flavor_feast$ I would have you be my guest of honor, and take the foremost seat at the table.\n"
 feast_invite_flavor_standard: "$invite_to_activity_flavor_feast$ Together, we shall enjoy the fruits of the [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip].\n"

 hunt_invite_flavor_standard: "$invite_to_activity_flavor_hunt$ Together, we shall make a mighty sport of it!\n"
 hunt_invite_flavor_legendary: "$invite_to_activity_flavor_hunt$ Together, we shall corner a [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetTitle.GetDeJureLiege.Custom('GetLegendaryColor')] [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetTitle.GetDeJureLiege.Custom('GetAnimalType')] of legend!\n"
 hunt_invite_flavor_dangerous: "$invite_to_activity_flavor_hunt$ Together, we shall bring down a treacherous beast!\n"
 hunt_invite_flavor_falconry: "$invite_to_activity_flavor_hunt$ Together, our hawks will make short work of their prey!\n"
 hunt_invite_flavor_nerge: "I have put my finest hunters on the task of rounding up the lands mightiest beasts for my Nerge. Join me in this conquest!"

