 invite_to_activity_flavor_witch_ritual: "It is time to pay our respects to [ROOT.Char.GetFaith.WitchGodName] once more, will you come to [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] and share in the revelations?"
