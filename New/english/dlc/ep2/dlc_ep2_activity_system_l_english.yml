 invite_to_activity_flavor_ecumenical_council: "I hereby invite you to the [ROOT.Char.GetInvolvedActivity.GetShortName] of [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] to discuss [ROOT.Char.GetInvolvedActivity.GetSelectedTenet1.GetName( ROOT.Char.GetRite )], [ROOT.Char.GetInvolvedActivity.GetSelectedTenet2.GetName( ROOT.Char.GetRite )], and [ROOT.Char.GetInvolvedActivity.GetSelectedDoctrine1.GetDescriptiveName( ROOT.Char.GetFaith )]."
 invite_to_activity_flavor_fallback: "I hereby invite you to join my [ROOT.Char.GetInvolvedActivity.GetShortName]."
 invite_to_activity_flavor_examination: "I hereby invite you to join my examination."
