 ep1_notifications.0011.t:0 "Court Language Changed"
 ep1_notifications.0011.desc:0 "Our [court_language|E] has changed to [target_character.GetCourtLanguage.GetName]. May our Court grow ever grander!"

 ep1_notifications.0012.t:0 "Court Language Abandoned"
 ep1_notifications.0012.desc:0 "[target_character.GetShortUINamePossessive] has changed [target_character.GetHerHis] [court_language|E] from [observer.GetCourtLanguage.GetName] to [target_character.GetCourtLanguage.GetName]. May their decision prove folly!"

 ep1_notifications.0013.t:0 "Court Language Adopted"
 ep1_notifications.0013.desc:0 "[target_character.GetShortUINamePossessive] has changed [target_character.GetHerHis] [court_language|E] to [target_character.GetCourtLanguage.GetName]. A most wise decision!"
