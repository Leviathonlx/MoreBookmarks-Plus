l_english:

 # Spread the Word — activity intent, pulse actions, and per-activity events

 # Intent
 spread_personal_tenet_intent: "Evangelize Tenet"
 spread_personal_tenet_intent_desc: "You want to preach your [personal_tenet|E] to receptive guests, that they may adopt it as their own, increasing [tenet_popularity|E]."
 spread_personal_tenet_intent_not_valid_desc: "You no longer hold a [personal_tenet|E]"
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT: "Unlocks the #EMP $spread_personal_tenet_intent$#! [intent|E] at [activities|E] with guests, allowing you to increase [tenet_popularity|E]"

 # Pulse actions
 apa_pam_spread_tenet_host_title: "[first.GetShortUINameNoTooltip|U] [CharWinWins(Character)] Over [second.GetShortUINameNoTooltip]"
 apa_pam_spread_tenet_guest_title: "[first.GetShortUINameNoTooltip|U] [CharWinWins(Character)] Over [second.GetShortUINameNoTooltip]"

 # Shared event text
 pam_spread_tenet_events.forbidden.desc: "\n\nBut the conviction in my heart is [spread_tenet.GetBaseName] — a belief my faith condemns. To voice it in this company is to put my fate in each listening ear."
 pam_spread_tenet_option_scripture: "Scripture itself speaks for me."
 pam_spread_tenet_option_preach: "Hear what I hold true!"
 pam_spread_tenet_option_forbidden: "The truth is worth the risk. Come closer."
 pam_spread_tenet_option_decline: "Another time, perhaps."
 pam_spread_tenet_forbidden_flavor: "Not every ear turned toward me is a friendly one..."
 pam_spread_tenet_overheard_toast: "Unfriendly Ears"

 pam_spread_tenet_events.0001.t: "Table Talk"
 pam_spread_tenet_events.0001.desc: "The board groans with good [ROOT.Char.Custom('GetExpensiveMeal')], and toasts and laughter fill the room.\n\n"You sound well versed in holy matters," says [pam_spread_listener_1.GetTitledFirstName], leaning in over the [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit')]-filled trenchers. "Go on."\n\nThe table quiets — an audience, warm and willing to listen..."

 pam_spread_tenet_events.0101.t: "Around the Fire"
 pam_spread_tenet_events.0101.desc: "A brief respite in the hunt. We sit close about the fire, [ROOT.Char.Custom('GetRandomRegionalSmallGame')] dripping on the spit.\n\n"A chase like this turns a soul toward higher things," murmurs [pam_spread_listener_1.GetTitledFirstName], eyes never leaving the flames.\n\nFirelight, quiet, and ears inclined to listen."

 pam_spread_tenet_events.0201.t: "Between the Bouts"
 pam_spread_tenet_events.0201.desc: "The lists are empty between bouts. Squires drag off splintered lances while the crowd hunts for shade and gossip.\n\n"Each victor thanks [ROOT.Char.GetFaith.HighGodName], and each loser curses [ROOT.Char.GetFaith.DevilName]," [pam_spread_listener_1.GetTitledFirstName] jests from the bench next to mine. "Do any of them wonder why?"\n\nA lull, a bench of idle notables, and a question in the air."

 pam_spread_tenet_events.0301.t: "A Toast to Conviction"
 pam_spread_tenet_events.0301.desc: "Cup after cup is lifted — to the newlyweds, to heirs still unborn.\n\n"And to [ROOT.Char.GetFaith.HighGodName], who binds all souls!" adds [pam_spread_listener_1.GetTitledFirstName], to a rumble of approval.\n\nHearts lay open — to love, to hope, to holy things. Words spoken in this hour will take root."

 pam_spread_tenet_events.0401.t: "Words at the Wake"
 pam_spread_tenet_events.0401.desc: "The mourners cluster in small knots, murmuring of the departed and of the fate common to us all.\n\n"Eternity claims every one of us in the end," [pam_spread_listener_1.GetTitledFirstName] murmurs by my shoulder. "And still we quarrel over trifles."\n\nPerhaps grief has cracked a soul open..."
