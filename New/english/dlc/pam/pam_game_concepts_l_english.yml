l_english: 
 game_concept_puppet: "Puppet"
 game_concept_puppets: "Puppets"
 game_concept_puppeted: "Puppeted"
 game_concept_puppeting: "Puppeting"
 game_concept_puppet_type: "Puppet Type"
 game_concept_puppet_types: "Puppet Types"
 game_concept_puppet_type_desc: "A [puppet|e] always has a type which determines the actions they may take on your behalf.\n\nWhile most of their special actions are shared, each $game_concept_puppet_type$ comes with unique actions only available to that type.\n\nFor instance, a [clerical_puppet|e] may [excommunicate|e] someone on your behalf, while a [external_ruler_puppet|e] may be compelled to release a [tributary|e] or divorce their [spouse|e].\n\nYou can only have one $game_concept_puppet$ per type."
 game_concept_puppet_desc: "A Puppet is a [character|E] under the control of a [puppeteer|E], who may take special Puppet actions through them.\n\nActing through a Puppet opens doors that would otherwise stay closed: a [clerical_puppet|E] can petition for [clerical_titles|E] or an [excommunication|E] on your behalf, while a [external_ruler_puppet|E] can be made to release [tributaries|E], grant independence, or divorce their [spouse|E].\n\nThe actions available are determined by the [puppet_type|E]."
 game_concept_puppeteer: "Puppeteer"
 game_concept_puppeteers: "Puppeteers"
 game_concept_puppeteer_possessive: "Puppeteer's"
 game_concept_puppeteers_possessive: "Puppeteers'"
 game_concept_puppeteer_desc: "A Puppeteer is a [character|E] in control of one or more [puppets|E].\n\nActing through their Puppets, a Puppeteer wields powers beyond their station, such as the influence of the [clergy|E] or the authority of a foreign [realm|E]."
 game_concept_clerical_puppet: "Realm Priest Puppet"
 game_concept_clerical_puppets: "Realm Priest Puppets"
 game_concept_clerical_puppet_desc: "A [realm_priest|E] that is a [puppet|E] of their [liege|E].\n\nThrough them, their Puppeteer can reach into the affairs of the [faith|E]: petitioning the [head_of_faith|E] for [clerical_titles|E] or an [excommunication|E], managing [holy_sites|E], founding a new [rite|E], or hosting an [ecumenical_council|E]."
 game_concept_external_clerical_puppet: "Clerical Ruler Puppet"
 game_concept_external_clerical_puppets: "Clerical Ruler Puppets"
 game_concept_external_clerical_puppet_desc: "A powerful member of the [clergy|E] — an [archbishop|E] or even the [head_of_faith|E] — that has become the [puppet|E] of another [ruler|E].\n\nThe mightier the cleric, the greater the reach: a puppeted Head of Faith can [excommunicate|E] your enemies, appoint [cardinals|E], grant a [pressed_claim|E], or incite a [holy_war|E] on your behalf."
 game_concept_external_ruler_puppet: "Secular Ruler Puppet"
 game_concept_external_ruler_puppets: "Secular Ruler Puppets"
 game_concept_external_ruler_puppet_desc: "A non-[clergy|E] [ruler|E] that has become [puppet|E] to another [character|E]. Through this puppet, you can meddle in the affairs of other [realms|E], for example by using [schemes|E] or [imprisonment|E].\n\nAcquiring a puppet of this type requires at least one of these to be true:\n\n$BULLET_WITH_TAB$#indent_newline:6 You are a [clergy|E] [vassal|E] of the target#!\n$BULLET_WITH_TAB$#indent_newline:6 You are a [GetTrait('seducer').GetName( GetNullCharacter )] and the target is your [lover|E], or your [soulmate|E] if the target is of [king|E] rank or higher#!\n$BULLET_WITH_TAB$#indent_newline:6 You are a [GetTrait('torturer').GetName( GetNullCharacter )] and hold the target in your [dungeon|E]#!\n$BULLET_WITH_TAB$#indent_newline:6 You are [GetTrait('family_first').GetName( GetNullCharacter )] and the target is your [close_family|E]#!\n$BULLET_WITH_TAB$#indent_newline:6 You are a [GetTrait('diplomat').GetName( GetNullCharacter )] and the target is an [independent_ruler|E]#!\n$BULLET_WITH_TAB$#indent_newline:6 You are a [GetTrait('schemer').GetName( GetNullCharacter )] and have a @weak_hook_icon![hook|E] on the target, or a @unspent_strong_hook_icon![strong_hook|E] if the target is of [king|E] rank or higher#!\n$BULLET_WITH_TAB$#indent_newline:6 You are a [GetTrait('gallant').GetName( GetNullCharacter )] and the target is your [spouse|E]#!\n$BULLET_WITH_TAB$#indent_newline:6 You are a [diarch|E] of the target in an [entrenched_regency|E]#!\n$BULLET_WITH_TAB$#indent_newline:6 You are the target's [head_of_faith|E], [challenger_hof|E], or [head_of_rite|E]#!"

 game_concept_ecumenical_council: "Ecumenical Council"
 game_concept_ecumenical_council_desc: "An $game_concept_ecumenical_council$ is an [activity|E] in which the top [clergy|E] in all of Christendom gather to settle the future of the Church.\n\nOver successive debates, the assembled prelates rule on the [tenet_status|E] of contested [core_tenets|E] — declaring them [permitted_tenet_status|E] or [prohibited_tenet_status|E], or elevating them to [core_tenet_status|E] — and settle the [doctrines|E] of the [faith|E]."
 game_concept_ecumenical_councils: "Ecumenical Councils"
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$"
 
 game_concept_schism: "Schism"
 game_concept_schism_desc: "The Great $game_concept_schism$ is the moment the unified $christian_faith$ [faith|E] breaks apart along its Roman and Greek [rites|E], splitting into $catholic$ and $orthodox$.\n\nIt threatens when [the_christian_church|E] [situation|E] enters certain [the_christian_church_chapters_short|E], and rulers across Christendom must pick a side. Unless the divisions are mended — or forced apart — through [decisions|E], the split becomes permanent when the chapter ends."
 game_concept_schisms: "Schisms"
 game_concept_schisms_desc: "$game_concept_schism_desc$"

 game_concept_clerical_title: "Clerical Title"
 game_concept_clerical_titles: "Clerical Titles"
 game_concept_clerical_title_desc: "A $game_concept_clerical_title$ is an [ecclesiastical|E] [title|E] of the [clergy|E] governing a [clerical_region|E] within a [faith|E]. Among the [christian|E] faiths this is an [archdiocese|E].\n\nThe holder is the [religious_superior|E] of the [clergy|E] in that region, and is usually appointed by the [head_of_faith|E]."

 game_concept_the_christian_church: "The Christian Church"
 game_concept_the_christian_church_desc: "The Christian Church is the ecclesiastical body that oversees and guides the followers of Jesus Christ, represented as a [situation|E] that advances through a sequence of [the_christian_church_chapters_short|E].\n\nIts boundaries encompass every [archdiocese|E] in the world; every [christian|E] [ruler|E] of [county|E] rank or higher with any part of their [realm|E] inside an Archdiocese is a member, be they clergy or secular."
 game_concept_christendom: "Christendom" 
 game_concept_christendom_desc: "$game_concept_christendom$ encompasses the [realm|E]s of all [independent|E] [christian|E] [ruler|E]s who are members of [the_christian_church|E] [situation|E]."
 game_concept_christian: "Christian"
 game_concept_christians: "Christians"
 game_concept_christian_possessive: "Christian's"
 game_concept_christian_desc: "An adherent of the Christian [religion|E]."

 game_concept_papal_bull: "Papal Bull"
 game_concept_papal_bulls: "Papal Bulls"
 game_concept_bull: "Bull"
 game_concept_bulls: "Bulls"
 game_concept_papal_bull_desc: "A Papal Bull is a solemn decree of the [head_of_faith|E] of a [christian|E] [faith|E], backed by the authority of [the_christian_church|E].\n\nA Christian [head_of_faith|E] with sufficient [church_authority|E] may proclaim a Bull through the [GetDecisionWithKey('enact_a_bull_decision').GetName] [decision|E], spending [piety|E] to:\n\n$EFFECT_LIST_BULLET$Summon a [great_holy_war|E]\n$EFFECT_LIST_BULLET$Denounce a [rite|E] as a [heresy|E]\n$EFFECT_LIST_BULLET$Declare a [core_tenet|E] [permitted_tenet_status|E] or [prohibited_tenet_status|E]"
 
 game_concept_situation_the_christian_church_phase: "The Christian Church Chapter"
 game_concept_the_christian_church_chapter_short: "Chapter"
 game_concept_the_christian_church_chapters_short: "Chapters"
 game_concept_situation_the_christian_church_phases: "The Christian Church Chapters"
 game_concept_situation_the_christian_church_phase_desc: "Chapters are the [situation_phases|E] of [the_christian_church|E]. There are seven total chapters, organised in four [the_christian_church_chapter_types|E]."
 game_concept_the_christian_church_chapter_type: "Chapter Type"
 game_concept_the_christian_church_chapter_types: "Chapter Types"
 game_concept_the_christian_church_chapter_type_desc: "There are four $game_concept_the_christian_church_chapter_types$ in [the_christian_church|E], they categorize [situation_the_christian_church_phases|E].\n\n$game_concept_the_christian_church_chapter_types$: [the_christian_church_unstable_short|E], [the_christian_church_crisis_short|E], [the_christian_church_zeal_short|E], and [the_christian_church_stability_short|E]"

 game_concept_the_christian_church_unstable: "Instability Chapter"
 game_concept_the_christian_church_unstable_short: "Instability"
 game_concept_the_christian_church_unstable_desc: "An #high $game_concept_the_christian_church_unstable$#! of [the_christian_church|E] is one where obedience runs thin:\n\n[rulers|E] may be more easily swayed to a different [rite|E], excommunications may happen more frequently, and [gold|E] may be spent for one's own benefit.\n\n#high $fragile_unity$#! and #high $reform_phase$#! are $game_concept_the_christian_church_unstable_short$ [the_christian_church_chapters_short|E]."

 game_concept_the_christian_church_zeal: "Zeal Chapter"
 game_concept_the_christian_church_zeal_short: "Zeal"
 game_concept_the_christian_church_zeal_desc: "A #high $game_concept_the_christian_church_zeal$#! stirs outward fire:\n\nMass conversions may take place, [great_holy_wars|E] may become more common, [papal_bulls|E] may be more frequent, and [faith|E] conversion may be easier.\n\n#high $conversion_phase$#! and #high $crusade_phase$#! are $game_concept_the_christian_church_zeal_short$ [the_christian_church_chapters_short|E]."

 game_concept_the_christian_church_stability: "Stability Chapter"
 game_concept_the_christian_church_stability_short: "Stability"
 game_concept_the_christian_church_stability_desc: "A #high $game_concept_the_christian_church_stability$#! is rare daylight for [the_christian_church|E]:\n\nBuilding in a [temple_holding|E] is cheaper, Grand Cathedrals progress faster, [characters|E] are more likely to become a [GetTrait('devoted').GetName( GetNullCharacter )], and the Great Schism may get mended.\n\n#high $concord$#! is the only $game_concept_the_christian_church_stability$."
 
 game_concept_the_christian_church_crisis: "Crisis Chapter"
 game_concept_the_christian_church_crisis_short: "Crisis"
 game_concept_the_christian_church_crisis_desc: "A #high $game_concept_the_christian_church_crisis$#! is [the_christian_church|E] at its most scorched:\n\nIndulgences may be cheaper, [ecumenical_councils|E] more frequent, [rulers|E] may appoint their own [court_chaplain|E], [clergy|E] may marry, the [head_of_faith|E] may refuse to host an [anointment|E] and [taxes|E] may suffer.\n\n#high $saeculum_obscurum$#! and #high $investiture_crisis$#! are $game_concept_the_christian_church_crisis_short$ [the_christian_church_chapters_short|E]."
 
 game_concept_head_of_rite: "Head of Rite"
 game_concept_head_of_rite_desc: "The leading [character|E] of a [rite|E]: the [head_of_faith|E] if they follow it; otherwise the holder of the [clerical_region|E] where the rite has its strongest following, and failing that, the [ruler|E] who governs the most of the [rite_possessive|E] [counties|E].\n\nOnly the $game_concept_head_of_rite$ may edit their [rite_possessive|E] [core_tenets|E] and [doctrines|E], and it is they who speak for their flock when the church drifts toward [schism|E]."

 game_concept_ecclesiastical: "Ecclesiastical"
 game_concept_ecclesiastical_government: "Ecclesiastical Government"
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!"
 game_concept_ecclesiastical_desc: "$game_concept_ecclesiastical$ is a [theocratic|E] [government_form|E] held by [christian|E] [clergy|E] [rulers|E], such as [bishops|E] and [archbishops|E].\n\nMost Ecclesiastical rulers are theocratic [vassals|E] who [lease|E] their [temple_holdings|E] from a secular [liege|E] and answer to the [head_of_faith|E], although a [bishop|E] who possesses [landed|E] [titles|E] that are not [leased|E] may rule as an [independent|E] Ecclesiastical [ruler|E] in their own right. The power such a ruler holds over their own [vassals|E] is determined by their [church_authority|E]."

 game_concept_lease_contract: "Lease Contract"
 game_concept_lease_contract_desc: "The legal conditions under which a character is [leasing|E] a title. It also determines who their [religious_superior|E] is."

 game_concept_church_obligations: "Church Obligations"
 game_concept_church_obligations_desc: "Church Obligations represent the combined obligations on [church_holding|E] income. These obligations are paid to the [superior|E], [head_of_faith|E], and/or the local secular [ruler|E]. Example [church_centralization|E] and [secular_obligations|E]."

 game_concept_church_centralization: "Church Centralization"
 game_concept_minimal_centralization: "Minimal Centralization"
 game_concept_mild_centralization: "Mild Centralization"
 game_concept_strong_centralization: "Strong Centralization"
 game_concept_church_centralization_desc: "$game_concept_church_centralization$ represents to what degree the Church has adopted centralized authority and financial structures. Stronger centralization means more income flows upward in the clerical hierarchy.\n\nThe types are:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"

 game_concept_secular_obligations: "Secular Obligations"
 game_concept_personal_obligations: "Personal Obligations"
 game_concept_fixed_obligations: "Fixed Obligations"
 game_concept_secular_obligations_desc: "$game_concept_secular_obligations$ represent how it is determined what amount of income from [church_holdings|E] belongs to the local [secular_ruler|E].\n\nThe types are:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\nIn some chapters secular rulers additionally hold local power over the Church:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"

 game_concept_religious_superior: "Religious Superior"
 game_concept_religious_superiors: "Religious Superiors"
 game_concept_superior: "Superior"
 game_concept_religious_superior_desc: "A religious Superior is a [character|E] who holds religious jurisdiction over one or more [subordinate|E] religious clergy in a hierarchical religious structure."

 game_concept_religious_subordinate: "Religious Subordinate"
 game_concept_religious_subordinates: "Religious Subordinates"
 game_concept_subordinate: "Subordinate"
 game_concept_subordinates: "Subordinates"
 game_concept_religious_subordinate_desc: "A Religious Subordinate is a [character|E] who has a [religious_superior|E] within a hierarchical religious structure."

 game_concept_clerical_region: "Clerical Region"
 game_concept_clerical_regions: "Clerical Regions"
 game_concept_clerical_region_possessive: "Clerical Region's"
 game_concept_clerical_regions_possessive: "Clerical Regions'"
 game_concept_clerical_region_desc: "A Clerical Region is a geographical region that falls under the jurisdiction of a [clerical_title|E]. Any member of the clergy within the region will be a [subordinate|E] to the holder of the [title|E] associated with the region.\n\nA [ruler|E] belongs to the Clerical Region that contains their [capital|E] [county|E], and a new region is founded upon the [capital|E] of its founder's [primary_title|E]. The region may cover multiple [realms|E] and have subordinates that are in different realms.\n\nA $game_concept_ruler$ may only hold one $game_concept_clerical_region$ at a time. If granted a new Region, the Ruler forfeits all their held land within the previous one."

 game_concept_clerical_region_capital: "Clerical Region Capital"
 game_concept_clerical_region_capitals: "Clerical Region Capitals"
 game_concept_clerical_region_capital_desc: "The Clerical Region Capital is the [county|E] a [clerical_region|E] was founded upon with an [ecclesiastical_estate|E], serving as the seat of the [clerical_title|E] that governs the region. Unlike a [de_jure_capital|E], it is fixed to the region and cannot be relocated."
 
 clerical_electors: "Clerical Electors"

 game_concept_archdiocese: "Archdiocese"
 game_concept_archdioceses: "Archdioceses"
 game_concept_archdiocese_desc: "An Archdiocese is the [christian|E] form of a [clerical_region|E], an ecclesiastical domain held by an [archbishop|E] through its [clerical_title|E] and seated in a capital [county|E], where a [grand_cathedral|E] may be raised.\n\nA [christian|E] [ruler|E] answers in spiritual matters to the [archbishop|E] of the Archdiocese that contains their [capital|E] [county|E], and the territory subject to Archdioceses collectively constitutes [the_christian_church|E] [situation|E]."

 game_concept_grand_cathedral: "Grand Cathedral"
 game_concept_grand_cathedrals: "Grand Cathedrals"
 game_concept_grand_cathedral_desc: "A Grand Cathedral is a [great_building|E] raised through a [great_project|E] in the capital of an [archdiocese|E], the seat of its [archbishop|E].\n\nRaising the first Cathedral is a monumental act of devotion: its founder gains lasting [piety|E], [legitimacy|E] and [spiritual_fulfillment|E], an additional [personal_tenet|E] slot, and a standing bonus to their same-[faith|E] [opinion|E]. Once raised, it draws Christian pilgrims from across [christendom|E], expands the holder's [cathedral_complex|E], and may later be enlarged into a [GetBuilding('great_project_cathedral_02').GetName|V] or [GetBuilding('great_project_cathedral_03').GetName|V]."

 game_concept_monastic_holy_order: "Monastic Order"
 game_concept_monastic_holy_orders: "Monastic Orders"
 game_concept_monastic_holy_order_possessive: "Monastic Order's"
 game_concept_monastic_holy_orders_possessive: "Monastic Orders'"
 game_concept_monastic: "Monastic"
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_desc: "A Monastic Order is a type of [holy_order|E] devoted to prayer, learning, and the spread of a single [core_tenet|E]. It belongs to the [rite|E] of its founder and champions one of that [rite_possessive|E] [core_tenets|E], spreading the practice among the faithful.\n\nLed by an [archabbot|E], a Monastic Order is sustained by the [temple_holdings|E] and [gold|E] granted by its [monastic_order_patrons|E]. The Order then provides [spiritual_fulfillment|E] and [piety|E] in return.\n\nAny [ruler|E] whose [faith|E] permits monasticism can establish one with the #high Found Monastic Order#! [decision|E]."

 game_concept_monastic_order_patron: "Monastic Order Patron"
 game_concept_monastic_order_patrons: "Monastic Order Patrons"
 game_concept_monastic_order_patronize: "Patronize"
 game_concept_monastic_order_patronized: "Patronized"
 game_concept_monastic_order_patronage: "Patronage"
 game_concept_monastic_order_patron_desc: "A Monastic Order Patron is an [ecclesiastical|E] or secular [ruler|E] of [duchy|E] [title_tier|E] or higher who sustains a [monastic_holy_order|E], most often the ruler who founded it. A patron endows the order with worldly wealth, leasing it [temple_holdings|E] and donating [gold|E] to its coffers.\n\nIn return for this generosity, the patron earns [piety|E] and [spiritual_fulfillment|E]. They may also take control of the Order's leader, and have them execute [clerical|E] interactions as a [puppet|E]."

 game_concept_mendicant: "Mendicant"

 game_concept_rite: "Rite"
 game_concept_rite_possessive: "Rite's"
 game_concept_rites_possessive: "Rites'"
 game_concept_rite_desc: "A Rite is a branch of a [faith|E]: a local variation of its religious practices, led by a [head_of_rite|E] and followed by its own [counties|E] and [characters|E]. Every faith has a [mainline_rite|E], and may grow several more.\n\nA Rite defines itself by the [core_tenets|E] and [doctrines|E] it champions. Whether a Tenet is [permitted_tenet_status|E] or [prohibited_tenet_status|E] is judged by the [faith|E] through its [mainline_rite|E], and the more a [rite_possessive|E] choices defy those judgements, the higher its [rite_divergence|E]: divergent Rites sap the [faithpossessive|E] [fervor|E], come to be seen as [heresy|E], and at #V 100#! [divergence|E] break away as a [faith|E] of their own.\n\nNew Rites may be founded by the pious, [rulers|E] can be swayed from one Rite to another, only the [head_of_rite|E] may edit one."
 game_concept_rites: "Rites"

 game_concept_archabbot: "Abbot"
 game_concept_archabbot_desc: "An $game_concept_archabbot$ is the [ruler|E] of a [monastic_holy_order|E] and the [head_of_rite|E] of the [rite|E] their order champions, guiding its members in study, contemplation, and the spread of its [core_tenets|E].\n\nAn order may be supported by a [monastic_order_patron|E], whose [monastic_order_patronage|E] grants it wealth and influence.\n\nUpon an $game_concept_archabbot$'s death, their [titles|E] pass to a successor, usually their [courtier|E] with the highest [learning|E]."

 game_concept_archbishop: "Archbishop"
 game_concept_archbishops: "Archbishops"
 game_concept_archbishop_possessive: "Archbishop's"
 game_concept_archbishops_possessive: "Archbishops'"
 game_concept_archbishop_desc: "An Archbishop is the Christian holder of an [archdiocese|E], a duchy-tier [clerical_title|E] whose [clerical_region|E] may span several [realms|E].\n\nAs the [religious_superior|E] of the [bishops|E] and lesser [clergy|E] within that region, an Archbishop ranks above an ordinary [bishop|E] and answers in turn to the [head_of_faith|E]."

 game_concept_bishop: "Bishop"
 game_concept_bishops: "Bishops"
 game_concept_bishop_possessive: "Bishop's"
 game_concept_bishops_possessive: "Bishops'"
 game_concept_bishop_desc: "A $game_concept_bishop$ belongs to the [clergy|E] of a Christian [faith|E], and holds or leases [temple_holdings|E].\n\nA Bishop resides within an [archdiocese|E] and answers to the [archbishop|E] there as [religious_superior|E]. An unlanded Bishop with [leased|E] titles serves under a secular [liege|E]; a Bishop with unleased [landed|E] [titles|E] may rule as an [ecclesiastical|E] [ruler|E]."

 game_concept_rite_divergence: "Divergence"
 game_concept_rite_divergent: "Divergent"
 game_concept_divergence: "Divergence"
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_desc: "Divergence measures how far a [rite_possessive|E] [core_tenets|E] and [doctrines|E] have drifted from the parent [faith|E]. A Rite that adopts [prohibited_tenet_status|E] Tenets as [core_tenet_status|E] is more Divergent.\n\nHigh Divergence weakens the parent faith's [fervor|E] making outbreaks of [heresy|E] more common. A Rite that reaches #V 100#! Divergence will be automatically declared a heresy and become a new [faith|E]."

 game_concept_spiritual_fulfillment: "Spiritual Fulfillment"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ is the measurement of how at peace a [character|E] feels in respect to their [faith|E].\n\nThe baseline is calculated based on the [traits|E] they have, and whether they are considered [sinful|E] or [virtuous|E].\n\n$game_concept_spiritual_fulfillment$ can be gained or lost by acting in ways that the [faith|E] considers appropriate, and [personal_tenets|E] can be adopted to offset harmful traits."
 game_concept_fulfillment: "Fulfillment"
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!"

 game_concept_spiritual_fulfillment_level: "Spiritual Fulfillment Level"
 game_concept_spiritual_fulfillment_levels: "Spiritual Fulfillment Levels"
 game_concept_spiritual_fulfillment_level_desc: "A [character_possessive|E] [spiritual_fulfillment|E] is divided into $game_concept_spiritual_fulfillment_levels$ by thresholds, each applying its own effects.\n\nLow levels make life harder and sinful deeds cheaper. High levels make devotion easier and open new religious options."

 game_concept_personal_tenet: "Personal Tenet"
 game_concept_personal_tenet_desc: "A $game_concept_personal_tenet$ is a [core_tenet|E] that a [ruler|E] adopts as a core part of their spirituality.\n\nAdopting a $game_concept_personal_tenet$ that is [core_tenet_status|E] or has been [permitted_tenet_status|E] by the [faith|E] yields [spiritual_fulfillment|E], while taking on a [prohibited_tenet_status|E] one will result in a [secret|E]. $game_concept_personal_tenets$ also provide additional effects and unlock special mechanics.\n\nThe number of $game_concept_personal_tenets$ that a character can subscribe to is affected by their [piety_level|E] and the [GetPerk('radiant_perk').GetName(GetNullCharacter)] [perk|E]."
 game_concept_personal_tenets: "Personal Tenets"
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$"

 game_concept_cardinal: "Cardinal"
 game_concept_cardinals: "Cardinals"
 game_concept_cardinal_possessive: "Cardinal's"
 game_concept_cardinals_possessive: "Cardinals'"
 game_concept_cardinalate: "Cardinalate"
 game_concept_cardinalates: "Cardinalates"
 game_concept_cardinal_desc: "A [clergy|e] member selected by the Pope to help further exert the will of [the_christian_church|e]. All members of the [college_of_cardinals|E] are both candidates and electors for the Papacy and have a [papabile_score|E]."

 game_concept_college_of_cardinals: "College of Cardinals"
 game_concept_college_of_cardinals_desc: "The $game_concept_college_of_cardinals$ is the body of [cardinals|E] who advise the Pope and elect the next [head_of_faith|E] of [the_christian_church|E].\n\nEvery [cardinal|E] is both a candidate and an elector for the Papacy."

 game_concept_papabile_score: "Papabile Score"
 game_concept_papabile_scores: "Papabile Scores"
 game_concept_papabile_score_desc: "All members of the [college_of_cardinals|E] have a $game_concept_papabile_score$ that takes into account their [traits|E], [piety_level|E], [rite|E] and the [opinion|E] of other cardinals.\n\n[cardinals|E] with the highest $game_concept_papabile_score$ are likely to receive more votes during a papal election.\n\nThe $game_concept_papabile_score$ can be increased via the #high $increase_papabile_score_interaction$#! [character_interaction|E] and the [GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName] [decision|E]."

 game_concept_mainline_rite: "Mainline Rite"
 game_concept_mainline_rite_desc: "The Mainline [rite|E] represents the most prominent set of beliefs of a [faith|E]. A non-Mainline $game_concept_rite$ is considered to be [rite_divergent|E] from this $game_concept_rite$.\n\nWhich $game_concept_rite$ is Mainline depends on whether the $game_concept_faith$ has a [head_of_faith|E].\n\nIf the $game_concept_faith$ has a $game_concept_head_of_faith$, the Mainline $game_concept_rite$ is whichever one they follow. This means it can change when a successor of a different $game_concept_rite$ takes their place, including a potential [challenger_hof|E].\n\nWithout a $game_concept_head_of_faith$, any $game_concept_rite$ followed by more [counties|E] than the Mainline supplants it, provided it holds at least as many [holy_sites|E] as the $game_concept_rite$ it seeks to replace."
 game_concept_mainline_rites: "Mainline Rites"
 game_concept_mainline_rite_short: "Mainline"

 # Tenet & Doctrine Status (Rite-side stance)
 game_concept_tenet_status: "Tenet Status"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ is a [rite_possessive|E] stance on a [core_tenet|E] or [doctrine|E]. There are five possible stances:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — the $game_concept_rite$ has never heard of this $game_concept_core_tenet$ or $game_concept_doctrine$.\n\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — the $game_concept_rite$ is aware of it and has not ruled on its practice.\n\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — the $game_concept_rite$ approves of the practice.\n\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — the $game_concept_rite$ forbids the practice.\n\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — the $game_concept_rite$ both permits and actively promotes the $game_concept_core_tenet$.\n\nA Rite's stance governs whether a $game_concept_core_tenet$ or $game_concept_doctrine$ can be picked when authoring or diverging a $game_concept_rite$, and which practices cost adherents spiritual penalties.\n\nTenet Status is distinct from a [character_possessive|E] [tenet_knowledge|E], which is personal awareness, not the overall $game_concept_rite$'s stance."
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$"

 game_concept_unknown_tenet_status: "Unknown"
 game_concept_unknown_tenet_status_desc: "An $game_concept_unknown_tenet_status$ [tenet_status|E] means the [rite|E] has no awareness of this [core_tenet|E] or [doctrine|E] at all. Adherents of the $game_concept_rite$ do not implicitly know it, and cannot pick it when creating a new $game_concept_rite$ or as a [personal_tenet|E]."

 game_concept_known_tenet_status: "Known"
 game_concept_known_tenet_status_desc: "A $game_concept_known_tenet_status$ [tenet_status|E] means the [rite|E] is aware of this [core_tenet|E] or [doctrine|E], but neither endorses nor permits its practice. It can be considered when authoring or diverging the $game_concept_rite$, and may be raised to a higher [tenet_status|E]."

 game_concept_permitted_tenet_status: "Permitted"
 game_concept_permit_tenet_status: "Permit"
 game_concept_permitted_tenet_status_desc: "A $game_concept_permitted_tenet_status$ [tenet_status|E] means the [rite|E] approves of this [core_tenet|E] or [doctrine|E] without actively promoting it. A [character|E] of the $game_concept_rite$ may adopt the $game_concept_core_tenet$ as a [personal_tenet|E] without spiritual penalty."

 game_concept_prohibited_tenet_status: "Prohibited"
 game_concept_prohibit_tenet_status: "Prohibit"
 game_concept_prohibited_tenet_status_desc: "A $game_concept_prohibited_tenet_status$ [tenet_status|E] means the [rite|E] explicitly forbids this [core_tenet|E] or [doctrine|E]. A [character|E] of the $game_concept_rite$ adopting the $game_concept_core_tenet$ as a [personal_tenet|E] keeps it as a [secret|E], and a $game_concept_rite$ adopting [prohibited_tenet_status|E] [core_tenets|E] as [core_tenet_status|E] becomes much more [rite_divergent|E] from its [faith|E]."

 game_concept_core_tenet_status: "Core"
 game_concept_core_tenet_status_desc: "A $game_concept_core_tenet_status$ [tenet_status|E] means the [rite|E] is actively promoting this [core_tenet|E] or [doctrine|E] as one of its defining practices. All adherents of the $game_concept_rite$ are subject to its effects."

 # Character Knowledge of Tenets and Doctrines
 game_concept_tenet_knowledge: "Religious Knowledge"
 game_concept_doctrine_knowledge: "Doctrine Knowledge"
 game_concept_rite_knowledge: "Rite Knowledge"
 game_concept_agnostic_knowledge: "Knowledge"
 game_concept_tenet_knowledge_desc: "Characters do not know the full details of every religious practice.\n\nKnown tenets and doctrines can be used when creating a [rite_divergent|E] $game_concept_rite$, and may be adopted as [personal_tenets|E]. Knowing all $game_concept_core_tenets$ and $game_concept_doctrines$ of a $game_concept_rite$ makes conversion easier.\n\nAll [core_tenets|E] and [doctrines|E] within your [faith|E] are known to you. New knowledge can be gained from relations like [spouses|E] or [friends|E], [traveling|E], [activities|E], or the Study Rite [scheme|E]."
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$"

 game_concept_enshrined: "Enshrined"
 game_concept_enshrine: "Enshrine"
 game_concept_enshrined_desc: "An enshrined [holy_relic|E] at a [holy_site|E] activates holy site bonuses and improves the bonuses it grants, scaled by the total [rarity|E] levels of all enshrined artifacts.\n\nAn enshrined artifact is no longer owned by a character, but may be interacted with by the [holder|E], [top_liege|E], or [clerical_region|E] holder of the holy site. The artifact will no longer decay. You can enshrine only holy relics for your own [faith|E]; enshrined holy relics of other faiths will provide no benefits.\n\nThere may be rewards or costs associated with enshrining or removing an enshrined artifact."

 game_concept_holy_relic: "Holy Relic"
 game_concept_holy_relics: "Holy Relics"
 game_concept_holy_relic_desc: "A $game_concept_holy_relic$ is an [artifact|E] that holds religious significance for a [faith|E]. A $game_concept_holy_relic$ can be [enshrined|E] in a [holy_site|E] of that faith to gain benefits.\n\nSome artifacts are inherently holy for a faith, but artifacts can also be [sanctified|E] to become a holy relic."

 game_concept_sanctified: "Sanctified"
 game_concept_sanctify: "Sanctify"
 game_concept_sanctifying: "Sanctifying"
 game_concept_sanctified_desc: "Sanctifying an [artifact|E] makes it a [holy_relic|E] for a [faith|E]. An artifact can be sanctified for multiple faiths."

 # Ecclesiastical Estate
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_estate: "Ecclesiastical Estate"
 game_concept_ecclesiastical_estates: "Ecclesiastical Estates"
 game_concept_ecclesiastical_estate_desc: "An $game_concept_ecclesiastical_estate$ — or $game_concept_cathedral_complex$ — is a type of [domicile|E] attached to a [clerical_title|E], representing the intimate landholdings of an [archbishop|E] and their see. Lesser [clergy|E] in an [GetGovernment('ecclesiastical_government').GetName] must rise to such a [title|E] before they are granted one.\n\n[ecclesiastical_estate_buildings|E] may be constructed here to expand the holder's wealth, [piety|E], and [spiritual_fulfillment|E]. The $game_concept_ecclesiastical_estate$ does not change location and will be inherited by the next title [holder|E]."
 game_concept_ecclesiastical_estate_building: "Ecclesiastical Estate Building"
 game_concept_ecclesiastical_estate_buildings: "Ecclesiastical Estate Buildings"
 game_concept_ecclesiastical_estate_building_desc: "$game_concept_ecclesiastical_estate_buildings$ are unique and persistent improvements to a [ecclesiastical_estate|E].\n\nA large variety of structures are available for construction and may be built by the holder to generate private income, [piety|E], [spiritual_fulfillment|E], and gain access to a number of [decisions|E], [interactions|E], and more."
 game_concept_cathedral_complex: "Cathedral Complex"
 game_concept_cathedral_complexes: "Cathedral Complexes"
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complex_building: "$game_concept_cathedral_complex$ Building"
 game_concept_cathedral_complex_buildings: "$game_concept_cathedral_complex$ Buildings"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"

 game_concept_canonized: "Canonized"
 game_concept_canonized_desc: "A [character|E] who has, after death, been declared a saint or another faith's equivalent, such as a Wali or a venerated ancestor, gaining the [GetTrait('saint').GetName( GetNullCharacter )] [trait|E].\n\nA virtuous life may end in $game_concept_canonization$: it is petitioned through a [decision|E], may require the blessing of the [head_of_faith|E], and is sealed by consecrating the saint's burial site. Their resting place thereafter draws pious travelers, and their remains may yield [holy_relics|E]."
 game_concept_canonization: "Canonization"
 game_concept_canonization_desc: "$game_concept_canonized_desc$"
 game_concept_sainthood: "Sainthood"
 game_concept_sainthood_desc: "$game_concept_canonized_desc$"

 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc: "An [interaction|E] which strengthens an [unpressed_claim|E] into a [pressed_claim|E] through the endorsement of a relevant [ecclesiastical|E] or [theocratic|E] [ruler|E]."
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc: "An [interaction|E] which provides a [claim|E] to a [title|E] belonging to another [ruler|E]. Requires the acceptance of a relevant [ecclesiastical|E] or [theocratic|E] [character|E]."
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc: "An [interaction|E] which facilitates the peaceful transfer of a [title|E] or [vassal|E] between two [rulers|E], relying on the acceptance of the target [ruler|E] and a secondary intercessor.\n\nRefusal will usually cost the recipient [piety|E] and [legitimacy|E], as well as an additional cost selected by the actor as a method of compelling acceptance.\n\nThe intercessor, a relevant [ecclesiastical|E] or [theocratic|E] ruler, may both forbid this interaction from even taking place and, with the [GetLaw('church_authority_3').GetName] [law|E], may force through its acceptance."

 game_concept_challenger_hof: "Challenger Head of Faith"
 game_concept_antipope: "Antipope"
 game_concept_challenger_hof_desc: "A $game_concept_challenger_hof$ is a rival [head_of_faith|E] raised against the [mainline_rite|E] $game_concept_head_of_faith$.\n\nA [ruler|E] may sponsor a member of their [clergy|E] as $game_concept_challenger_hof$. A [clergy|E] [ruler|E] or a ruler from a [faith|E] with a Temporal Head of Faith may declare themselves as a Challenger instead.\n\nA sponsored $game_concept_challenger_hof$ takes up their sponsor's [rite|E], becomes that sponsor's [external_clerical_puppet|E] and owes them a [weak_hook|E].\n\nThe $game_concept_mainline_rite$ $game_concept_head_of_faith$ cannot [excommunicate|E] anyone who follows a $game_concept_challenger_hof$: the sponsor and their [vassals|E].\n\nEveryone following a $game_concept_challenger_hof$ brings their clerical requests to them instead of to the $game_concept_mainline_rite$ $game_concept_head_of_faith$, among them these [interactions|E]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nA $game_concept_challenger_hof$ or their sponsor may use the [pam_challenge_hof_cb|E] [casus_belli|E] against the legitimate $game_concept_head_of_faith$.\n\nRival [kings|E] or above of the same [faith|E] may instead use the [pam_antiking_cb|E] against a sponsor, deposing the rival claimant."
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$"

 game_concept_pam_challenge_hof_cb: "Challenge Head of Faith"
 game_concept_pam_challenge_hof_cb_desc: "A [casus_belli|E] used by a [challenger_hof|E] or their sponsor against the legitimate [head_of_faith|E] of their [faith|E]. Victory installs the $game_concept_challenger_hof$ as $game_concept_head_of_faith$ and makes their [rite|E] the [mainline_rite|E]. A sponsor who wins the war and outranks their $game_concept_challenger_hof$ also takes them as a [vassal|E]."

 game_concept_pam_antiking_cb: "Depose Antipope"
 game_concept_pam_antiking_cb_desc: "A [casus_belli|E] available to [christian|E] [kings|E] and above who neither sponsor nor serve as a [challenger_hof|E]. Waged against an [independent|E] sponsor of their own [faith|E] to depose their $game_concept_challenger_hof$ and earn the gratitude of the legitimate [head_of_faith|E]."

 game_concept_petition_antipope_indulgences_interaction: "Seek Antipope's Indulgence"
 game_concept_petition_antipope_indulgences_interaction_desc: "An [interaction|E] available to anyone following a [challenger_hof|E]. Pay [gold|E] to your $game_concept_antipope$ for forgiveness and [piety|E], bypassing the [mainline_rite|E] [head_of_faith|E]. Their sponsor is accepted automatically."

 game_concept_petition_antipope_gold_interaction: "Petition Antipope for Gold"
 game_concept_petition_antipope_gold_interaction_desc: "An [interaction|E] available to anyone following a [challenger_hof|E]. Request [gold|E] from your $game_concept_antipope$. Their sponsor is accepted automatically."

 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc: "A [decision|E] available to prelates and mighty rulers, pushing [the_christian_church|E] towards the chapter of their choosing."

 game_concept_tenet_popularity: "Tenet Popularity"
 game_concept_tenet_popularity_desc: "As [personal_tenets|E] spread within a [faith|E] their practice becomes more common. $game_concept_tenet_popularity$ tracks how widespread a [core_tenet|E] is and affects how likely it is to be picked as debate topic in an [ecumenical_council|E] or as a target of a [papal_bull|E].\n\nThe higher the $game_concept_tenet_popularity$, the more the [clergy|E] will side with a tenet when it is debated in an [ecumenical_council|E]. Once a tenet reaches #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$, the [head_of_faith|E] will most likely declare it [permitted_tenet_status|E] no matter their own convictions."

 game_concept_ecumenical_council_innovator: "Innovator"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "Innovators"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "Innovators are [activity_guests_short|E] at the [ecumenical_council|E] [activity|E] voting with the [activity_host_short|E] in their suggestions to change status of a [core_tenet|E] or a [doctrine|E].\n\nThey are directly opposed to the [ec_conservatives|E], guests who are voting against any changes, wanting to preserve the status quo.$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_groups_help: "\n\n#help [characters|E] that are allowed to vote are: [clergy|E], [rulers|E] with [clerical_puppet|E] and the [activity_host|E]#!"

 game_concept_ecumenical_council_conservative: "Conservative"
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$"
 game_concept_ecumenical_council_conservatives: "Conservatives"
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$"
 game_concept_ecumenical_council_conservative_desc: "Conservatives are [activity_guests_short|E] at the [ecumenical_council|E] [activity|E] voting against the [activity_host_short|E] in their suggestions to change status of a [core_tenet|E] or a [doctrine|E].\n\nThey are directly opposed to the [ec_innovators|E], guests who are attempting to enact the changes.$game_concept_ecumenical_council_groups_help$"

 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "An [interaction|E] used by [ecclesiastical|E] [rulers|E] to expand their [clerical_region|E] into the [de_jure|E] [counties|E] of an adjacent [duchy|E].\n\nThis is only possible with the approval of the [head_of_faith|E]."
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "An [interaction|E] through which [ecclesiastical|E] [rulers|E] can make same-[faith|E] secular rulers declare [holy_war|E] on rulers of hostile faith."
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "An [interaction|E] through which [ecclesiastical|E] [rulers|E] can make same-[faith|E] secular rulers declare [war|E] to press a [claim|E] on a secular [ruler|E]."

 game_concept_treasury_cardinal_budget: "Cardinal Budget"
 game_concept_treasury_cardinal_budget_short: "Cardinal"
 game_concept_treasury_cardinal_budget_benefices: "Cardinal Benefices"
 game_concept_treasury_cardinal_budget_desc: "Treasury allocated to [cardinals|E] from the central church treasury, representing direct and indirect [Glossary( 'benefices', 'CARDINAL_BENEFICES_GLOSS' )] assigned to them."

 CARDINAL_BENEFICES_GLOSS: "Benefices were local or remote properties, offices, or shared papal revenues that a member of the clergy could be granted #i in commendam#! (in trust). They generated an income, usually without direct administrative responsibilities."

 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc: "An [interaction|E] in which a [clerical|E] authority trades the comfort of [spiritual_fulfillment|E] for a [hook|E]"
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc: "An [interaction|E] which demands another [character|E] assumes vows of chastity and takes on a long-term [fertility|E] penalty."


 game_concept_military_holy_order: "Military Order"
 game_concept_military_holy_orders: "Military Orders"
 game_concept_military_holy_order_i: "@government_type_holy_order!"
 game_concept_military_holy_order_possessive: "Military Order's"
 game_concept_military_holy_orders_possessive: "Military Orders'"
 game_concept_military_holy_order_desc: "A $game_concept_military_holy_order$ is a type of [holy_order|E] populated by warriors sworn to defend and expand the lands of their [faith|E].\n\nSame-Faith Rulers may hire the Order if they are at [war|E] with a [faith_hostile|L] or [faith_evil|L] $game_concept_faith$, at the cost of [piety|E]. Once this War ends, the Order no longer fights for that Ruler.\n\nA $game_concept_holy_order$ may have a [military_holy_order_patron|E], who does not need to pay to engage their services."
 game_concept_military_holy_order_patron: "Military Order Patron"
 game_concept_military_holy_order_patronage: "Military Order Patronage"
 game_concept_military_holy_order_patronize: "Patronize"
 game_concept_military_holy_order_patron_desc: "A [military_holy_order|E]'s $game_concept_holy_order_patron$ is a [ruler|E] of [duke|E]-[title_tier|E] or higher who shares their [faith|E] and whose [realm|E] contains their Capital.\n\nThe $game_concept_holy_order_patron$ may call upon the support of the $game_concept_holy_order$ against religious enemies for free, instead of paying [piety|E].\n\nPatronage can be lost to [vassals|E] of [duke|E]-[title_tier|E] or higher, if control of the Order's Capital is ceded."
