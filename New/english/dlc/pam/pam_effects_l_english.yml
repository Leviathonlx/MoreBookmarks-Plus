 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0004.desc.forward_tenet: "I write to inform you that [diverged_rite.GetName] has adopted [diverged_added_tenet.GetBaseName] among its tenets.\n\nA rite that guides its people wisely strengthens the entire [diverged_rite.GetFaith.GetAdjective] faith. This is simple wisdom."
 pam_tenet_events.0004.desc.forward_doctrine: "I write to inform you that [diverged_rite.GetName] now formally observes [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )].\n\nA rite that guides its people well strengthens the [diverged_rite.GetFaith.GetAdjective] faith as a whole. This is but simple wisdom."
 pam_tenet_events.0004.desc.backward_tenet: "I write to inform you that [diverged_rite.GetName] has embraced [diverged_added_tenet.GetBaseName] as one of its tenets.\n\nWe draw nearer [diverged_rite.GetFaith.GetMainRite.GetName] by it. When its rites speak with one voice, the [diverged_rite.GetFaith.GetAdjective] faith flourishes!"
 pam_tenet_events.0004.desc.backward_doctrine: "I write to inform you that [diverged_rite.GetName] observes [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )] from this day forth.\n\nWe are brought nearer to [diverged_rite.GetFaith.GetMainRite.GetName] by it. And when the sects are of one mind, the [diverged_rite.GetFaith.GetAdjective] faith is strengthened!"
 pam_tenet_events.0004.a: "So be it."
 pam_tenet_events.0004.a.tt.diverged: "The [diverged_rite.GetName] [rite|E] has diverged further from the [diverged_rite.GetFaith.GetMainRite.GetName] [mainline_rite|E], causing yearly [fervor_i][fervor|E] to decrease faster"
 pam_tenet_events.0004.a.tt.consolidated: "The [diverged_rite.GetName] [rite|E] has drawn closer to the [diverged_rite.GetFaith.GetMainRite.GetName] [mainline_rite|E], causing yearly [fervor_i][fervor|E] to decrease slower"

 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0005.desc: "I have parted with half of my wealth for the sake of the poor, and I am the richer for it.\n\nI require the same half from you. Empty hands are forgiven. Full ones are remembered."
 pam_tenet_events.0005.a: "If my [redistributing_liege.GetTitleAsNameNoTooltip] can bear it, so can I."
 pam_tenet_events.0005.b: "My hands are full, and they will stay so."
 pam_tenet_events.0005.b.tt: "Your coffers stay as they are, and your [counties|E] receive nothing"
 pam_tenet_events.0006.t: "The Hidden Teachings"
 pam_tenet_events.0006.desc_intro: "The unmarked books are spread on my table, their diagrams laid bare, their names unfit for any mouth to shape. This is the learning the plainly devout are warned against, and I have bought myself a night with it."
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.GetTitledFirstName] halts on the threshold and will not cross. "These things are locked away and prayed over for a reason," [mystic_witness.GetSheHe] murmurs. "Once you have looked, you cannot unknow what is there.""
 pam_tenet_events.0006.desc_alone: "\n\nNot a soul among my courtiers will sit with me over these pages. Their contents I face alone, and uncounseled."
 pam_tenet_events.0006.a: "Nothing in these pages is above me. Read on."
 pam_tenet_events.0006.b: "Go as far as the lamp burns, and no further."
 pam_tenet_events.0007.t: "Counsel of the Dead"
 pam_tenet_events.0007.desc: "The doors are barred and the lamps extinguished, the world shrinking until only a single guttering flame and the smoke curling thickly around me remain. I can already sense the presence of [guiding_forebear.GetTitledFirstName] writhing behind the fumid veil.\n\nIn the darkness, I lay bare the grievous troubles I dare not name by light of day. Spirits do not answer as mortals do, but through sepulchral whispers, the crackle of a fitful flame, the furtive brush of unseen air, and the wraiths stirring in the smoke.\n\nDesperate for guidance, my eyes strain at every sign for the answer I need most."
 pam_tenet_events.0007.a: "Lend me the wisdom that guided you."
 pam_tenet_events.0007.b: "Grant me peace enough to face the dawn."
 pam_tenet_events.0008.t: "A Remembered Self"
 pam_tenet_events.0008.desc: "The seal, the cup, the ring taken from my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))] [remembered_forebear.GetTitledFirstName]'s hand. I have them arranged and I sit with them; slowly, they cease to feel borrowed.\n\nNothing appears. Nothing is said. I am not being told about [remembered_forebear.GetHerHim]; I am being reminded of myself, of a nature I laid aside with that life and never lost."
 pam_tenet_events.0008.a: "That was me: [remembered_trait_1.GetNameNoTooltip( ROOT.Char )|l], through and through."
 pam_tenet_events.0008.b: "I wake [remembered_trait_2.GetNameNoTooltip( ROOT.Char )|l] at heart, and know it for my own."
 pam_tenet_events.0008.c: "Yes. I was [remembered_trait_3.GetNameNoTooltip( ROOT.Char )|l] then, and I can be again."
 pam_tenet_events.0008.d: "Those lives are spent. I remain myself."
 pam_tenet_events.0009.t: "Open the Chests"
 pam_tenet_events.0009.desc_intro: "The chests have been hauled into the yard, and the keys are in my hand."
 pam_tenet_events.0009.desc_witness: " [redistribution_witness.GetTitledFirstName] walks the row.\n\n"A generous [ROOT.Char.GetTitleAsNameNoTooltip] is still a [ROOT.Char.GetTitleAsNameNoTooltip]," [redistribution_witness.GetSheHe] says. "No one is saved by giving well, only by having nothing left to keep.""
 pam_tenet_events.0009.desc_alone: " I am alone in this, and the stewards hang back in silence to see how it ends."
 pam_tenet_events.0009.desc_end: "\n\nMy chest I can unlock with a twist of the wrist. The remainder I will have to take."
 pam_tenet_events.0009.a: "Break the locks. Let all take their share."
 pam_tenet_events.0009.flavor: "Your vassals with coin to spare will be compelled to open their coffers, your counties will grow freer and harder to command, and those who do not share this tenet will resent you for it."
 pam_tenet_events.0009.b: "A moment. Only my own wealth need go."
 pam_tenet_events.0009.b.tt: "You share only what is yours. Your [vassals|E] keep their coffers shut, and bear you no resentment for this"
 pam_tenet_events.0010.t: "What the Flesh Owes"
 pam_tenet_events.0010.desc_intro: "The scourge hangs in the usual place. Tonight it has company: the irons and the short knife, fetched in secret, and by me alone."
 pam_tenet_events.0010.desc_alone: "\n\nNot a soul will lift the lamp for me tonight. What I take from that table, I take unwitnessed."
 pam_tenet_events.0010.a: "The scourge, until my mind is quiet."
 pam_tenet_events.0010.b: "Let me be done with the sight of the world."
 pam_tenet_events.0010.c: "Take the appetite, and the sin goes with it."

