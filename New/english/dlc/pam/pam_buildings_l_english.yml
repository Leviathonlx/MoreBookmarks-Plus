l_english:
 # Abbey of St Gall
 building_type_pam_abbey_of_st_gall_01: "$building_pam_abbey_of_st_gall_01$"
 building_type_pam_abbey_of_st_gall_01_desc: "$building_pam_abbey_of_st_gall_01_desc$"
 building_pam_abbey_of_st_gall_01: "Abbey of St Gall"
 building_pam_abbey_of_st_gall_01_desc: "Raised around the hermitage of Saint Gall, this abbey is famed for its school, scriptorium, and library. Under in its walls, monks copy sacred texts and train clerics whose learning carries far beyond the shores of Lake Constance."
 building_pam_abbey_of_st_gall_01_destination_desc: "The [GetBuilding('pam_abbey_of_st_gall_01').GetName] gathers pilgrims and scholars beneath its walls. Its monks preserve manuscripts, teach clerics, and keep the memory of Saint Gall alive in the Alpine foothills."

 # Palais des Papes
 building_type_pam_palais_de_papes_01: "$building_pam_palais_de_papes_01$"
 building_type_pam_palais_de_papes_01_desc: "$building_pam_palais_de_papes_01_desc$"
 building_pam_palais_de_papes_01: "Palais des Papes"
 building_pam_palais_de_papes_01_desc: "Raised above Avignon as both fortress and residence, this palace shelters the papal court behind massive stone walls. Chapels, audience halls, and administrative chambers turn the city into a center of ecclesiastical power."
 building_pam_palais_de_papes_01_destination_desc: "The [GetBuilding('pam_palais_de_papes_01').GetName] dominates Avignon with its fortified walls and solemn chapels, a palace built to house the business and ceremony of the Church."

 # Archbasilica of Saint John Lateran
 building_type_pam_lateran_basilica_01: "$building_pam_lateran_basilica_01$"
 building_type_pam_lateran_basilica_01_desc: "$building_pam_lateran_basilica_01_desc$"
 building_pam_lateran_basilica_01: "Archbasilica of Saint John Lateran"
 building_pam_lateran_basilica_01_desc: "The cathedral church of Rome is mother and head of the churches of the city and the world. In its basilica and adjoining halls councils gather, doctrine is fixed, and the authority of the Roman pontiff is displayed to all."
 building_pam_lateran_basilica_01_destination_desc: "The [GetBuilding('pam_lateran_basilica_01').GetName] receives pilgrims and prelates at Rome's episcopal seat, where solemn worship and church government meet beneath venerable walls."

 # Reims Cathedral
 building_type_pam_reims_cathedral_01: "$building_pam_reims_cathedral_01$"
 building_type_pam_reims_cathedral_01_desc: "$building_pam_reims_cathedral_01_desc$"
 building_pam_reims_cathedral_01: "Reims Cathedral"
 building_pam_reims_cathedral_01_desc: "At Reims, the cathedral stands as the sacred site of Clovis' baptism and the crowning of kings. Here, the blessing of the clergy can transform a ruler's claims into divine authority, forging a bond between faith and royal power."
 building_pam_reims_cathedral_01_destination_desc: "The [GetBuilding('pam_reims_cathedral_01').GetName] draws travelers to the sacred heart of royal consecration, where Frankish kings kneel before the altar and leave anointed before the realm."
