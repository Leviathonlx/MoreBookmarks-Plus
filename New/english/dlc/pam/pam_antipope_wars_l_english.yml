 pam_antipope_events.0010.t: "The Pretender Brought Low"
 pam_antipope_events.0010.desc.christian: "The [pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')] schismatic [pam_ch_hof_challenger.GetTitledFirstName] kneels before me, now stripped of [pam_ch_hof_challenger.GetHerHis] false [ROOT.Char.GetFaith.ReligiousHeadTitleName|U].\n\nEver defiant, [pam_ch_hof_challenger.GetSheHe] states: \"The Ark is wherever I stand. Not at your feet.\"\n\n[pam_ch_hof_challenger.GetHerHis|U] tongue is still a servant of Satan, it would seem."
 pam_antipope_events.0010.desc: "The pretender [pam_ch_hof_challenger.GetTitledFirstName] kneels before me, stripped of [pam_ch_hof_challenger.GetHerHis] false [ROOT.Char.GetFaith.ReligiousHeadTitleName|U].\n\nEver defiant, [pam_ch_hof_challenger.GetSheHe] answers: \"I am the true [ROOT.Char.GetFaith.ReligiousHeadName].\""
 pam_antipope_events.0010.a.christian: "A cell may make [pam_ch_hof_challenger.GetHerHim] as penitent as Jonah."
 pam_antipope_events.0010.a: "Lock [pam_ch_hof_challenger.GetHerHim] away."
 pam_antipope_events.0010.b.christian: "Execute [pam_ch_hof_challenger.GetHerHim]. The Lord knows His own."
 pam_antipope_events.0010.b: "Execute [pam_ch_hof_challenger.GetHerHim]. [ROOT.Char.GetFaith.HighGodName] will judge the rest."
 pam_antipope_events.0010.c: "Show mercy."
 pam_antipope_events.0010.d: "[pam_ch_hof_challenger.GetSheHe|U] will scream the name of the true [ROOT.Char.GetFaith.ReligiousHeadName|U]."
 pam_challenge_hof_war_random_permanent_harm_tt: "Suffers a random permanent injury"

 pam_antipope_events.0011.t: "The Price of Patronage"
 pam_antipope_events.0011.desc.christian: "[pam_ch_hof_sponsor.GetTitledFirstNamePossessive] purse fostered this wicked rupture, raising a rival [ROOT.Char.GetFaith.ReligiousHeadName|U] against [ROOT.Char.GetRite.GetName].\n\nScripture is not gentle on such patrons: [Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]\n\n[pam_ch_hof_sponsor.GetSheHe|U] looks up, defiant to the last: \"You are not [ROOT.Char.GetFaith.ReligiousHeadName] but a false monk. Descend, descend, to be damned throughout the ages.\""
 pam_antipope_events.0011.desc: "[pam_ch_hof_sponsor.GetTitledFirstNamePossessive] gold raised a rival [ROOT.Char.GetFaith.ReligiousHeadName|U] to divide the [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip].\n\n[pam_ch_hof_sponsor.GetSheHe|U] looks up: \"You are no [ROOT.Char.GetFaith.ReligiousHeadName]. You are a fraud.\""
 pam_antipope_events.0011.a: "Sequester the purse that fostered this."
 pam_antipope_events.0011.b: "Execute [pam_ch_hof_sponsor.GetHerHim]. Consent has a price."
 pam_antipope_events.0011.c: "The shame on [pam_ch_hof_sponsor.GetHerHis] house is punishment enough."
 pam_antipope_events.0011.d: "Scourge [pam_ch_hof_sponsor.GetHerHim] until the flesh yields."
 pam_romans_1_32_english: "Those who practice such things deserve to die... yet they not only do them but even applaud others who practice them."
 ROMANS_1_32_GLOSS: "#weak Romans 1:32, NRSVUE#!"

 pam_antipope_events.0012.t: "Judgment on the Deposed"
 pam_antipope_events.0012.t.christian: "A Sentence for Satan's Soldier"
 pam_antipope_events.0012.intro.christian: "[ROOT.Char.GetRite.GetName] answers to me. The false [ROOT.Char.GetFaith.ReligiousHeadName|U], [pam_ch_hof_old_hof.GetTitledFirstName], kneels at my feet."
 pam_antipope_events.0012.intro: "The [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] answer to me. The false [ROOT.Char.GetFaith.ReligiousHeadName|U], [pam_ch_hof_old_hof.GetTitledFirstName], kneels at my feet."
 pam_antipope_events.0012.intro.sponsor: "My [ROOT.Char.GetFaith.ReligiousHeadName|U] [pam_ch_hof_new_hof.GetFirstName] is enthroned. The pretender, [pam_ch_hof_old_hof.GetTitledFirstName], kneels before me."
 pam_antipope_events.0012.dialogue.christian: "\n\nEver defiant, [pam_ch_hof_old_hof.GetSheHe] spews: \"By the sword you took the throne of peace.\"\n\n\"The Lord saw fit to give me the tools needed to fulfill his plan,\" I reply."
 pam_antipope_events.0012.dialogue: "\n\n[pam_ch_hof_old_hof.GetSheHe|U] says: \"You took this by the sword.\"\n\n\"And by the sword I keep it,\" I reply."
 pam_antipope_events.0012.a: "A cell may cool this pride."
 pam_antipope_events.0012.b: "Two heads make a monster; one must go."
 pam_antipope_events.0012.c: "There has been enough strife. Let [pam_ch_hof_old_hof.GetHerHim] go in peace."
 pam_antipope_events.0012.d: "[pam_ch_hof_old_hof.GetSheHe|U] will scream the name of the true [ROOT.Char.GetFaith.ReligiousHeadName|U]."

 pam_antipope_events.0014.t: "Judgment Upon Me"
 pam_antipope_events.0014.intro.judge: "\"I absolve all [pam_ch_hof_judge.GetFaith.GetAdherentNamePlural] from obedience to you,\" [pam_ch_hof_judge.GetTitledFirstName] says."
 pam_antipope_events.0014.intro.mercy.christian: "\"Go, and sin no more,\" [pam_ch_hof_judge.GetTitledFirstName] says."
 pam_antipope_events.0014.intro.mercy: "\"Go. Do not return to this path,\" [pam_ch_hof_judge.GetTitledFirstName] says."
 pam_antipope_events.0014.desc.condemned.christian: "\n\nI have loved justice and hated iniquity and so I die."
 pam_antipope_events.0014.desc.condemned: "\n\nI die for what I held true."
 pam_antipope_events.0014.desc.broken: "\n\n[pam_ch_hof_judge.GetSheHe|U] and [pam_ch_hof_judge.GetHerHis] men deride me with laughter as they scourge my body. I am but a husk, the grain having been threshed."
 pam_antipope_events.0014.desc.captive.christian: "\n\nThey gave me a cell. I have always been told a cell is enough for a holy [ROOT.Char.GetWomanMan]."
 pam_antipope_events.0014.desc.captive: "\n\nThey gave me a cell. That is all I am to be allowed."
 pam_antipope_events.0014.desc.spared.christian: "\n\nIt would seem the stones stay in their hands, and I am to walk free. I should not squander this mercy."
 pam_antipope_events.0014.desc.spared: "\n\nIt would seem I am to walk free. I should not squander this mercy."
 pam_antipope_events.0014.desc.generic: "\n\nJudgment has fallen. What comes next is mine to choose."
 pam_antipope_events.0014.a: "Let my house be remembered as true to [ROOT.Char.GetFaith.HighGodName]."
 pam_antipope_events.0014.b: "Their hands will not wash clean."
 pam_antipope_events.0014.b.toast: "You are stained with [GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName]"
 pam_antipope_events.0014.c: "Shield my house from this shame."
 pam_antipope_events.0014.d: "I will make my peace with the true [ROOT.Char.GetFaith.ReligiousHeadName]."
 pam_antipope_events.0014.e: "The villainy [pam_ch_hof_judge.GetTitledFirstNameNoTooltip] taught me, I will execute."
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.f: "I will walk barefoot until my penance is done."

 pam_antipope_events.0015.opening: "To the [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 pam_antipope_events.0015.desc.defender_victory.christian: "Know that the schismatic challenge to the [ROOT.Char.GetFaith.ReligiousHeadName|U] has been crushed. The pretender's office is destroyed, and [ROOT.Char.GetRite.GetName] holds strong. Let no prince or prelate doubt to whom they owe loyalty."
 pam_antipope_events.0015.desc.defender_victory: "Know that the challenge to the [ROOT.Char.GetFaith.ReligiousHeadName|U] has been crushed. The pretender's office is destroyed, and the [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] hold strong. Let no ruler doubt to whom they owe loyalty."
 pam_antipope_events.0015.desc.attacker_victory.christian: "Know that the war for the [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] is ended. I have liberated the seat from the yoke of Satan, and [ROOT.Char.GetRite.GetName] shall follow my commands."
 pam_antipope_events.0015.desc.attacker_victory: "Know that the war for the [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] is ended. I hold the seat, and the [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] follow me. Let the faithful know that a new [ROOT.Char.GetFaith.ReligiousHeadName] reigns."
 pam_antipope_events.0015.a: "So be it."
