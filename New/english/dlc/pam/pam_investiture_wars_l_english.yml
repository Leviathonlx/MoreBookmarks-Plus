l_english:

 # Investiture open-conflict CB
 PAM_INVESTITURE_CONFLICT_WAR_CB_NAME: "Investiture Conflict"
 # The war view looks the CB up by its type key
 pam_investiture_conflict_cb: "$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$"

 pam_investiture_conflict_cb_victory_desc_attacker: "Your victory forces [defender.GetShortUIName] and their side to accept your stance on the appointment of the clergy."
 pam_investiture_conflict_cb_victory_desc_defender: "[attacker.GetShortUIName|U]'s victory forces you and your supporters to accept their stance on the appointment of the clergy."
 pam_investiture_conflict_cb_victory_desc: "[attacker.GetShortUIName|U] prevails, forcing [defender.GetShortUIName] and their side to accept [attacker.GetShortUIName]'s stance on the appointment of the clergy."

 pam_investiture_conflict_cb_white_peace_desc: "The quarrel over the appointment of the clergy stays unresolved, and each side refuses to yield."

 pam_investiture_conflict_cb_defeat_desc_attacker: "Your defeat forces you and your supporters to accept [defender.GetShortUIName]'s stance on the appointment of the clergy."
 pam_investiture_conflict_cb_defeat_desc_defender: "You prevail, forcing [attacker.GetShortUIName] and their side to accept your stance on the appointment of the clergy."
 pam_investiture_conflict_cb_defeat_desc: "[defender.GetShortUIName|U] prevails, forcing [attacker.GetShortUIName] and their side to accept [defender.GetShortUIName]'s stance on the appointment of the clergy."

 msg_pam_investiture_conflict_cb_invalidated_message: "The [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] has ended; the Investiture Conflict is no longer valid."

 # CB requirement line: no new Investiture Conflicts once the settling council has been summoned
 pam_investiture_cb_council_pending_tt: "The Investiture Council has #EMP not#! yet been summoned"

 # Toast sent to a defeated ruler forced onto the victor's Clerical Appointment stance
 pam_investiture_conflict_forced_stance_toast: "Forced to Yield"
 pam_investiture_conflict_forced_stance_tt: "Defeated in the Investiture Conflict, you are bound to the victor's stance on the appointment of the clergy at the coming council."
