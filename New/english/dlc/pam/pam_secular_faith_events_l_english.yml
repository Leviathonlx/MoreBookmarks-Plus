l_english:

 # Secular Faith & Rite — ambient (yearly pool) events

 # Feed message — knowledge of a foreign tenet seeded by a dream or encounter (reuses the passive-learning feed type)
 pam_sf_seeded_tenet_desc: "A practice beyond your own [faith|E] has lodged itself in your thoughts, and you have gained [agnostic_knowledge|E] of the [pam_sf_seeded_tenet.GetBaseName] [core_tenet|E]."

 # Friendship reasons (set_relation_friend / set_relation_best_friend)
 pam_sf_friend_godparent: "[CHARACTER.GetShortUIName|U] stood as godparent to [TARGET_CHARACTER.GetShortUIName], and the spiritual kinship grew into friendship."
 pam_sf_friend_godparent_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] stood as godparent to [CHARACTER.GetShortUIName], and the spiritual kinship grew into friendship."
 pam_sf_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] have grown close over a shared conviction of faith."
 pam_sf_best_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] became the closest of friends, their bond deepened by a shared conviction of faith."
 pam_sf_friend_shielded: "[CHARACTER.GetShortUIName|U] shielded [TARGET_CHARACTER.GetShortUIName] from religious persecution."
 pam_sf_friend_shielded_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] shielded [CHARACTER.GetShortUIName] from religious persecution."

 # Lover reasons (set_relation_lover / set_relation_soulmate)
 pam_sf_lover_shared_conviction: "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] became lovers, drawn together by a shared conviction of faith."
 pam_sf_lover_carnal_revelation: "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] became lovers in a night of shared, sacred abandon."
 pam_sf_lover_confessional: "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] found more than absolution in the confessional, and became lovers."
 pam_sf_lover_two_faiths: "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] became lovers after discussing the intricacies of faith."
 pam_sf_soulmate_shared_conviction: "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] became soulmates, their love deepened by a shared conviction of faith."

 # Rivalry / nemesis reasons (set_relation_potential_rival / progress_towards_nemesis_effect)
 pam_sf_rival_bought_office: "[CHARACTER.GetShortUIName|U] sold [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] holy office to a stranger who could pay for it."
 pam_sf_rival_bought_office_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] sold [CHARACTER.GetShortUINamePossessiveNoTooltip] holy office to a stranger who could pay for it."
 pam_sf_nemesis_forced_to_cloister: "[TARGET_CHARACTER.GetShortUIName|U] forced [CHARACTER.GetShortUIName] into a cloister, forcing [CHARACTER.GetHerHim] to take holy vows."
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CHARACTER.GetShortUIName|U] forced [TARGET_CHARACTER.GetShortUIName] into a cloister, forcing [TARGET_CHARACTER.GetHerHim] to take holy vows."

 # Vocative address for a ruler in dialogue (used by FormOfAddressForLiege) - the whole phrase, including any leading "my"
 pam_my_liege_reverend_father: "reverend father"
 pam_my_liege_reverend_mother: "reverend mother"
 pam_my_liege_captain: "captain"
 pam_my_liege_khan: "great khan"
 pam_my_liege_khatun: "great khatun"
 pam_my_liege_chieftain: "my chieftain"
 pam_my_liege_serene_lord: "most serene lord"
 pam_my_liege_serene_lady: "most serene lady"
 pam_my_liege_lord: "my lord"
 pam_my_liege_lady: "my lady"
 pam_my_liege_liege: "my liege"

 pam_secular_faith_events.0001.t: "Holy Smoke"
 pam_secular_faith_events.0001.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], walks the censer down the nave. Holy smoke climbs into the rafters, carrying with it the congregation's murmured prayers.\n\nFor a moment, all creation seems to reach toward [ROOT.Char.GetFaith.PositiveAfterLife], and I with it."
 pam_secular_faith_events.0001.a: "I will lose myself in prayer."
 pam_secular_faith_events.0001.b: "This rite should be dedicated to [ROOT.Char.GetFaith.WealthGodName]."
 pam_secular_faith_events.0001.c: "The [ROOT.Char.Custom('GetCourt')] should share in this devotion."

 pam_secular_faith_events.0002.t: "Pikuach Nefesh"
 pam_secular_faith_events.0002.desc: "[traveler_in_danger.GetTitledFirstName], a traveler crossing my lands, has been attacked by bandits in [background_terrain_scope.GetName]!\n\n[traveler_in_danger.GetHerHis|U] life is at risk, but to take up arms on [ROOT.Char.GetFaith.HighGodNamePossessive] holy day is forbidden. The Sabbath is not mine to break. If I wait for sundown, I may ride out only to bury [traveler_in_danger.GetHerHim].\n\nYet can I stand idle while a life hangs in the balance?"
 pam_secular_faith_events.0002.a: "A life outweighs all. We ride."
 pam_secular_faith_events.0002.b: "I must consult my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0002.c: "I will not break the Sabbath."

 pam_secular_faith_events.0003.t: "A Vision in the Night"
 pam_secular_faith_events.0003.desc: "I wake gripped by something more than a dream — a column of fire, a voice that knew my name, a face I cannot forget...\n\nWas it [ROOT.Char.GetFaith.HighGodName] who came to me? [ROOT.Char.GetFaith.HealthGodName]? Or [ROOT.Char.GetFaith.DevilName] in fair disguise...\n\nPerhaps it was merely a fevered humor of the blood."
 pam_secular_faith_events.0003.a: "The voice whispered blissful truths..."
 pam_secular_faith_events.0003.b: "Fevered humor... I must read of such cases."
 pam_secular_faith_events.0003.c: "The [ROOT.Char.Custom('GetCourt')] must hear what I have seen!"

 pam_secular_faith_events.0004.t: "Forbidden Truth"
 pam_secular_faith_events.0004.desc: "Sleepless and doubting, I pace the [ROOT.Char.Custom('ResidenceBuildingHallsType')] of my [ROOT.Char.Custom('ResidenceBuilding')].\n\nMy mind circles something my faith condemns: [pam_sf_forbidden_tenet.GetBaseName]. It ought to trouble me — but I sense a righteous truth to the belief, and I cannot banish this suspicion."
 pam_secular_faith_events.0004.a: "I will hold to this truth — but quietly."
 pam_secular_faith_events.0004.b: "No. I will not stray."

 pam_secular_faith_events.0005.t: "By Candlelight"
 pam_secular_faith_events.0005.desc_intro: "Evening study should have calmed my mind, but a certain passage will not leave my thoughts.\n\n"
 pam_secular_faith_events.0005.desc_tenet: "It concerns the tenet they know as [pam_sf_revelation_tenet.GetBaseName], a practice my faith would condemn outright. I tell myself it is barbarous."
 pam_secular_faith_events.0005.desc_doctrine: "It concerns the doctrine of [pam_sf_revelation_doctrine.GetDescriptiveName( ROOT.Char.GetFaith.Self )], a teaching my faith would condemn outright. I tell myself it is mistaken."
 pam_secular_faith_events.0005.desc_end: "And yet, by candlelight, I find I understand how another soul might cling to it."
 pam_secular_faith_events.0005.a: "I must put my thoughts to ink."
 pam_secular_faith_events.0005.b: "There is no harm in understanding it."
 pam_secular_faith_events.0005.c: "Prayer will cleanse these thoughts."

 pam_secular_faith_events.0006.t: "Bones of a Saint"
 pam_secular_faith_events.0006.desc: "A travel-worn pilgrim catches my eye at the market. In [relic_seller.GetHerHis] trembling hands lies a yellowed finger-bone.\n\n"The bone of a saint," the [relic_seller.GetWomanMan] swears. "I found it on my journey to [GetTitleByKey('c_jerusalem').GetNameNoTier], but it would be safer in the hands of a [ROOT.Char.GetTitleAsNameNoTooltip]."\n\nA learned eye could judge the claim. Conveniently, the relic is for sale."
 pam_secular_faith_events.0006.a: "Let me appraise it before I part with coin."
 pam_secular_faith_events.0006.b: "I shall have it."
 pam_secular_faith_events.0006.c: "I have no use for a stranger's bones. Be gone."
 pam_sf_acquire_relic_tt: "You gain a Common [rarity|E] relic [artifact|E]"
 pam_sf_examine_relic_tt: "You gain a relic [artifact|E] of a [rarity|E] affected by your [learning_i][learning_skill|E]"
 pam_sf_acquire_relic_toast: "A Holy Relic Acquired"
 pam_sf_fingerbone_relic_name: "Finger-bone of Saint [SCOPE.Custom('PamFingerboneSaint')]"
 pam_sf_fingerbone_relic_desc: "A yellowed finger-bone, venerated as a relic of Saint [SCOPE.Custom('PamFingerboneSaint')] and kept within a small reliquary."

 pam_secular_faith_events.0007.t: "Arrogant Bishop"
 pam_secular_faith_events.0007.desc: "One of my own [defiant_bishop.GetTitleAsNameNoTooltip]s, [defiant_bishop.GetFirstName], is proud, well-connected, and quietly certain [defiant_bishop.GetSheHe] is my better. Several servants recently fell ill, and I need [defiant_bishop.GetHerHim] to bless my household.\n\nAfter ignoring my summons for days [defiant_bishop.GetSheHe] finally arrives, "I would ask forgiveness for the delay," [defiant_bishop.GetSheHe] smirks, "but I answer to a greater lord than any [ROOT.Char.GetTitleAsNameNoTooltip].""
 pam_secular_faith_events.0007.a: "Let us proceed with the dignity your office deserves."
 pam_secular_faith_events.0007.b: "Please. Just perform the rite."
 pam_secular_faith_events.0007.c: "[ROOT.Char.GetFaith.HighGodName] may be your lord, but I am your liege. Out!"

 pam_secular_faith_events.0008.t: "The Weight of Sin"
 pam_secular_faith_events.0008.desc: "The candles burn low, and the same thought returns. I am [penance_sin.GetName( ROOT.Char )], and my faith counts this among its sins.\n\nNo matter how often I push this thought aside, the guilt remains.\n\n"Discipline yourself, and your soul will be eased of its burdens." My [ROOT.Char.Custom2( 'RelationToMeShort', confessor )], [confessor.GetFirstName], does not scold or condemn. "Follow this penance. Do not stray.""
 pam_secular_faith_events.0008.a: "I will do as [confessor.GetFirstNameNoTooltip] advises."
 pam_secular_faith_events.0008.b: "Not now. I am not ready."

 pam_secular_faith_events.0009.t: "A Christlike Stranger"
 pam_secular_faith_events.0009.desc: "A lone, scarred stranger begs alms at my gates.\n\n"Forgive the intrusion, [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip]," [stranger.GetSheHe] says with a graceful bow. "If your circumstances permit you alms, I plead but a small share of your fortune."\n\n[stranger.GetSheHe|U] is unusually well-spoken for a beggar. One never knows whom one turns away."
 pam_secular_faith_events.0009.a: "Come in, my [ROOT.Char.Custom('ResidenceBuilding')] is open for you."
 pam_secular_faith_events.0009.b: "Take this bread and go in peace."

 pam_secular_faith_events.0010.t: "Who Came In From the Cold"
 pam_secular_faith_events.0010.desc_blessed: "The [stranger.GetWomanMan] I let in through my gates is no mere vagabond — [stranger.GetFirstName] speaks on scripture and statecraft with such ease that even my learned men fall silent to listen.\n\nIt seems [ROOT.Char.GetFaith.HighGodName] did come to my gate after all. I will not let [stranger.GetHerHim] wander on."
 pam_secular_faith_events.0010.desc_thief: "I wake to ashes in the hearth and an emptied strongbox.\n\nBread and shelter, repaid with the oldest of treacheries.\n\n[stranger.GetFirstName] slipped away in the night, and my wealth with [stranger.GetHerHim].\n\nBy the time the servants stir, [stranger.GetSheHe] is well past my walls and lost to me."
 pam_secular_faith_events.0010.a: "You were sent here for a reason."
 pam_secular_faith_events.0010.b: "I invited a viper to my table."

 pam_secular_faith_events.0011.t: "The Penitents"
 pam_secular_faith_events.0011.desc: "I wake not to thunder, but to the crack of scourges.\n\nA band of penitents has gathered outside my [ROOT.Char.Custom('ResidenceBuilding')], their backs raw and bloodied as they proclaim that [ROOT.Char.GetFaith.HighGodName] demands [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )].\n\nMy household looks to me for guidance."
 pam_secular_faith_events.0011.a: "Is there a deeper truth to this?"
 pam_secular_faith_events.0011.b: "Give me a lash — for I, too, have sinned."
 pam_secular_faith_events.0011.c: "Drive this madness from my lands!"

 pam_secular_faith_events.0012.t: "Blessing of Arms"
 pam_secular_faith_events.0012.desc: "Peace is a loan, never a gift.\n\nOn the feast of [ROOT.Char.GetFaith.WarGodName], my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], offers to consecrate my household's arms.\n\n"God, who gave David strength against Goliath, set that same strength in house [ROOT.Char.GetHouse.GetBaseName] — may you rise always to the defense of the weak," [chaplain.GetSheHe] prays."
 pam_secular_faith_events.0012.a: "Bless my banners and blades for the day of need."
 pam_secular_faith_events.0012.b: "Let us pray for peace instead."
 pam_secular_faith_events.0012.c: "A quiet blessing will suffice."

 pam_secular_faith_events.0013.t: "A Death Foretold"
 pam_secular_faith_events.0013.desc: "A wild-eyed preacher is dragged before me. Accused of rabble-rousing and soothsaying, [prophet.GetSheHe] wastes no time in pointing a trembling finger at my [ROOT.Char.Custom2( 'RelationToMeShort', doomed_soul )], [doomed_soul.GetTitledFirstName].\n\n"Mark this one!" [prophet.GetSheHe] cries. "Before the next moon, [doomed_soul.GetSheHe] shall lie cold in the earth. [ROOT.Char.GetFaith.HighGodName] has shown me the very hour!"\n\n[prophet.GetHerHis|U] certainty is unsettling. [doomed_soul.GetFirstNamePossessiveNoTooltip] fear even more so."
 pam_secular_faith_events.0013.a: "[ROOT.Char.GetFaith.HighGodName] speaks through strange mouths..."
 pam_secular_faith_events.0013.b: "Away with you, raving fool!"
 prophecy_foretold_tt: "A prophecy is given, what if it's true?"
 prophecy_foretold_2_tt: "A prophecy is given, complete nonsense!"

 pam_secular_faith_events.0014.t: "Prophetic Reckoning"
 pam_secular_faith_events.0014.desc_fulfilled: "A new moon has come to pass, and [doomed_soul.GetTitledFirstName] is dead — taken quietly in [doomed_soul.GetHerHis] sleep.\n\nThe ragged preacher named the very hour. I cannot forget that.\n\nWas this prophecy... or fear made flesh?"
 pam_secular_faith_events.0014.desc_failed: "A new moon has come to pass, and [doomed_soul.GetTitledFirstName] yet lives. The hour the ragged preacher named came and went, and took nothing by its passing.\n\n[prophet.GetSheHe|U] is a fraud, or a fool, but most certainly no voice of [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\nI feel rather foolish."
 pam_secular_faith_events.0014.a: "[prophet.GetSheHe|U] is a true prophet!"
 pam_secular_faith_events.0014.b: "[ROOT.Char.GetFaith.HighGodName] works in mysterious ways."
 pam_secular_faith_events.0014.c: "Why did I believe [prophet.GetHerHis] blasted prophecy!?"
 pam_secular_faith_events.0014.d: "I should have believed the prophecy..."
 pam_secular_faith_events.0014.e: "The preacher was a fraud, just as I said!"
 gains_religious_inspiration_tt: "[prophet.GetShortUIName|U] gains a Religious [inspiration|E]"

 pam_secular_faith_events.0015.t: "The Weeping Icon"
 pam_secular_faith_events.0015.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], hurries me to the [miracle_church.GetName]. Within, the painted eyes of a saint weep fragrant oil.\n\nWord of a miracle outruns any messenger, and a miracle is a powerful, dangerous thing."
 pam_secular_faith_events.0015.a: "A miracle? It must be examined."
 pam_secular_faith_events.0015.b: "Let the faithful come. We will receive them."
 pam_secular_faith_events.0015.c: "This blessing is not to be shared."
 pam_secular_faith_events.0015.d: "My realm is blessed!"
 no_miracles_tt: "This miracle smells fishy..."

 pam_secular_faith_events.0016.t: "A Price for the Pulpit"
 pam_secular_faith_events.0016.desc_intro: "[ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))|U] [candidate.GetWomanMan] enters my [ROOT.Char.Custom('ResidenceBuilding')], not to beg a favor, but to buy one.\n\n"Your [old_realm_priest.GetCouncilTitle], [old_realm_priest.GetFirstName], is a fine shepherd," [candidate.GetSheHe] murmurs, dropping a swollen purse on the table, "yet I would prove a more... grateful one. Name me to [old_realm_priest.GetHerHis] office, and reap [ROOT.Char.GetFaith.WealthGodNamePossessive] blessing.""
 pam_secular_faith_events.0016.desc_sanctioned: "\n\nThere is no shame in [GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )], and the silver is good."
 pam_secular_faith_events.0016.desc_sinful: "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )] is a sin. To take that gold would blacken my soul."
 pam_secular_faith_events.0016.a: "Gold weighs heavier than sin, after all..."
 pam_secular_faith_events.0016.b: "A fair price, fairly paid. The office is yours."
 pam_secular_faith_events.0016.c: "The office is not for sale."

 pam_secular_faith_events.0017.t: "A Heretic at [ROOT.Char.Custom('GetCourt')|U]"
 pam_secular_faith_events.0017.desc: ""Heretic!" my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], points an accusing finger at [accused.GetFirstName]. "Can you not see [accused.GetFirstNamePossessiveNoTooltip] vile [accused.GetRite.GetAdjective] influence over your [ROOT.Char.Custom('GetCourt')]? [accused.GetSheHe|U] must repent and accept [ROOT.Char.GetFaith.HighGodName]!"\n\n[accused.GetFirstNameNoTooltip] keeps a stoic face, though the accusation clearly wounds [accused.GetHerHim]."
 pam_secular_faith_events.0017.a: "[accused.GetFirstNameNoTooltip], let me bring you to the faith."
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip] converts"
 pam_secular_faith_events.0017.a.failure: "[accused.GetFirstName] is not moved"
 pam_secular_faith_events.0017.b: "Then repent in a cell. Seize [accused.GetHerHim]."
 pam_secular_faith_events.0017.c: "[accused.GetFirstNameNoTooltip] is under my protection. Enough."

 pam_secular_faith_events.0018.t: "A Child for God"
 pam_secular_faith_events.0018.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', pious_child )], [pious_child.GetFirstName], is unlike most children. While others play, [pious_child.GetSheHe] spends [pious_child.GetHerHis] days in the chapel.\n\n"I have never seen a child like [pious_child.GetHerHim]," my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], says quietly. "[pious_child.GetSheHe|U] spends hours in prayer, and weeps during mass. It is clear as day: [pious_child.GetFirstNameNoTooltip] desires life as an [GetTrait('devoted').GetName( pious_child )].""
 pam_secular_faith_events.0018.a: "Serve [ROOT.Char.GetFaith.HighGodName], but stay here."
 pam_secular_faith_events.0018.b: "The church shall have my [pious_child.Custom('GetDaughterSon')]."
 pam_secular_faith_events.0018.c: "No, [pious_child.GetSheHe] belongs to house [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."

 pam_secular_faith_events.0019.t: "The Peace of God"
 pam_secular_faith_events.0019.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], arrives with grave news.\n\n"Brother shall not slay brother beneath [ROOT.Char.GetFaith.HighGodNamePossessive] eye," [chaplain.GetSheHe|U] proclaims. "[feud_attacker.GetTitledFirstName] and [feud_defender.GetTitledFirstName] have bared steel against each other, and the smallfolk bleed for their quarrel!"\n\n"End this. Bind them with the [GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )].""
 pam_secular_faith_events.0019.a: "By [ROOT.Char.GetFaith.HighGodName], there will be peace."
 pam_secular_faith_events.0019.b: "Every lord who drew steel will answer for it."
 pam_secular_faith_events.0019.c: "My vassals' quarrels are mine to judge."
 pam_sf_peace_of_god_ends_wars_tt: "Every [war|E] between your [vassals|E] ends in a [white_peace|E]"

 pam_secular_faith_events.0020.t: "The [ROOT.Char.GetFaith.HouseOfWorship|U] of [temple_location.GetNameNoTooltip]"
 pam_secular_faith_events.0020.desc: "The masons set the last stone on the first [ROOT.Char.GetFaith.HouseOfWorship] I have ever raised, here in the [temple_location.Custom('TerrainTypeProvincePrefix')] [temple_location.Custom('TerrainTypeProvince')] of [temple_location.GetName].\n\nMy [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], walks the grounds, censer in hand.\n\n"You will be remembered for the [ROOT.Char.GetFaith.HouseOfWorshipPlural] you devote to [ROOT.Char.GetFaith.HighGodName]," [chaplain.GetSheHe] says. "Let this be the first of many.""
 pam_secular_faith_events.0020.a: "Lead us in prayer, [chaplain.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0020.b: "Let the [consecrated_county.GetNameNoTierNoTooltip] flourish around the [ROOT.Char.GetFaith.HouseOfWorship]."
 pam_secular_faith_events.0020.c: "I will seek wisdom within these walls."
 pam_secular_faith_events.0020.d: "I have only just begun [ROOT.Char.GetFaith.HighGodNamePossessive] work."

 pam_secular_faith_events.0021.t: "A Sign in the Heavens"
 pam_secular_faith_events.0021.desc: "Sleep will not come. I seek the quiet darkness of the [ROOT.Char.Custom('GetCourtyard')], and gaze up to the sky. Tonight, the heavens show me a [ROOT.Char.Custom('GetPamCelestialOmen')].\n\nSuch signs are never without meaning."
 pam_omen_blood_moon: "reddened moon"
 pam_omen_star_host: "host of stars where none should be"
 pam_omen_comet: "comet with twin tails"
 pam_omen_falling_stars: "rain of falling stars"
 pam_omen_moon_halo: "ring of pale light around the moon"
 pam_omen_eclipse: "moon eclipsed to a copper crescent"
 pam_omen_wandering_star: "bright wandering star"
 pam_secular_faith_events.0021.a: "I will study this omen."
 pam_secular_faith_events.0021.b: "[ROOT.Char.GetFaith.HighGodNamePossessive] favor shines through it."
 pam_secular_faith_events.0021.c: "Such a sign heralds conquest!"
 pam_secular_faith_events.0021.d: "The heavens owe me no answers."

 pam_secular_faith_events.0022.t: "The [ROOT.Char.GetTitleAsNameNoTooltip]'s Touch"
 pam_secular_faith_events.0022.desc_intro: "My [ROOT.Char.Custom2( 'RelationToMeShort', sick_courtier )], [sick_courtier.GetFirstName], shuffles toward me, pale and unsteady.\n\n"
 pam_secular_faith_events.0022.desc_ill: ""I waste away, [ROOT.Char.Custom('FormOfAddressForLiege')], terribly [illness_trait.GetName( GetNullCharacter )], with no cure in sight. Not even the physician, [physician.GetTitledFirstName], knows what's wrong with me!" [sick_courtier.GetSheHe] wails.\n\n"
 pam_secular_faith_events.0022.desc_other: ""I waste away, stricken with [illness_trait.GetName], and there is no cure in sight. Even [physician.GetTitledFirstName] cannot aid me!" [sick_courtier.GetSheHe] wails.\n\n"
 pam_secular_faith_events.0022.desc_end: ""It is said that royalty carry [ROOT.Char.GetFaith.HighGodNamePossessive] grace in their fingers... and that is the only hope I have left.""
 pam_secular_faith_events.0022.a: "Come. Let my hands rest upon you."
 pam_secular_faith_events.0022.b: "No... I will bless you from where I stand."
 pam_sf_kings_touch_gamble_tt: "My touch may rally [sick_courtier.GetFirstName] from the sickness, or the sickness may spread to me..."
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName] rises from the sickbed"
 pam_sf_kings_touch_infected_toast: "The sickness passes to me in turn"
 pam_sf_kings_touch_nothing_toast: "My touch brings [sick_courtier.GetFirstName] no change"

 pam_secular_faith_events.0023.t: "A Wandering Scribe"
 pam_secular_faith_events.0023.desc: "An emaciated [scholar.GetWomanMan] is brought before me, ink staining [scholar.GetHerHis] fingers and tomes tucked beneath [scholar.GetHerHis] arm.\n\n"I am [scholar.GetFirstName], a scribe and scholar." [scholar.GetSheHe] continues. "I have no home, and no patron. These hands were not made for labor, but to commit a [ROOT.Char.GetTitleAsNameNoTooltip]'s word to [ROOT.Char.Custom('GetWritingMaterial')]."\n\n"I beg of you, grant me bread and a roof, and I shall serve you faithfully.""
 pam_secular_faith_events.0023.a: "A scholar? Teach me what you know."
 pam_secular_faith_events.0023.b: "The [scholar_church.GetNameNoTooltip] has need of you."
 pam_secular_faith_events.0023.c: "My ledgers need a steady hand."
 pam_secular_faith_events.0023.d: "I have no need of you. Begone."

 pam_secular_faith_events.0024.t: "Into the Cloister"
 pam_secular_faith_events.0024.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', rival_character )], [rival_character.GetFirstName], is, as per usual, a [rival_character.Custom2('InsultAdjectiveClumsy', ROOT.Char)] [rival_character.Custom2('InsultNounClumsy', ROOT.Char)] and [rival_character.Custom2('InsultAdjective', ROOT.Char)] [rival_character.Custom2('InsultNoun', ROOT.Char)] at [ROOT.Char.Custom('GetCourt')]. Yet my spirits lift at a letter from [archbishop.GetTitledFirstName] of the [archdiocese.GetName].\n\n"[rival_character.GetFirstName] would serve [ROOT.Char.GetFaith.HighGodName] well," [archbishop.GetSheHe] writes. "The cloister would gladly receive [rival_character.GetHerHim]."\n\nThe world soon forgets those who kneel there."
 pam_secular_faith_events.0024.a: "Thus [ROOT.Char.GetFaith.HighGodName] receives another 'willing' servant!"
 pam_secular_faith_events.0024.b: "I would rather keep my enemy in sight."

 pam_secular_faith_events.0025.t: "God[ROOT.Char.GetMotherFather]"
 pam_secular_faith_events.0025.desc: ""I desire to join the [ROOT.Char.GetFaith.GetAdjective] faith, in body and in spirit," my [ROOT.Char.Custom2( 'RelationToMeShort', converting_char )], [converting_char.GetFirstName], says solemnly. "I wish to be baptized and become a [ROOT.Char.GetRite.GetAdherentName]... and I ask that you stand beside the font as my god[ROOT.Char.GetMotherFather].""
 pam_secular_faith_events.0025.a: "Then let all see our new bond!"
 pam_secular_faith_events.0025.b: "Faith needs no grand spectacle."
 pam_secular_faith_events.0025.c: "I cannot accept this honor."

 pam_secular_faith_events.0026.t: "A Besieged Soul"
 pam_secular_faith_events.0026.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', afflicted )], [afflicted.GetFirstName], has never truly been sound of mind... but [afflicted.GetSheHe] is no longer even [afflicted.GetHerselfHimself].\n\n"[ROOT.Char.GetFaith.EvilGodNames]! [ROOT.Char.GetFaith.EvilGodNames] is within me!" [afflicted.GetSheHe] raves, convulsing on the floor of the [ROOT.Char.GetFaith.HouseOfWorship].\n\nMy [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], turns pale. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], I fear [afflicted.GetHerHis] soul is besieged by demons. The only way to help [afflicted.GetHerHim] is to perform an exorcism.""
 pam_secular_faith_events.0026.a: "[afflicted.GetSheHe|U] needs proper care."
 pam_secular_faith_events.0026.b: "I will lead the exorcism myself."
 pam_secular_faith_events.0026.c: "This is holy work. You see to it."
 pam_secular_faith_events.0026.d: "Out with [afflicted.GetHerHim], before the panic spreads!"
 pam_sf_exorcism_success_toast: "The Exorcism Succeeds"
 pam_sf_exorcism_failed_toast: "The Exorcism Fails"

 pam_secular_faith_events.0027.t: "Crisis of Faith"
 pam_secular_faith_events.0027.desc: ""Do you hear me, [ROOT.Char.GetFaith.HighGodName]?" I whisper. But deep down, I know [ROOT.Char.GetFaith.HighGodNameSheHe|U] doesn't listen to sinners like me.\n\nHave I misunderstood [ROOT.Char.GetFaith.HighGodHerHis|U] will? Is [old_tenet.GetName( ROOT.Char.GetRite )] not the true form of [ROOT.Char.GetFaith.HighGodHerHis|U] wisdom?\n\nLight falls upon the crucifix, and hope stirs within me."
 pam_secular_faith_events.0027.a: "[ROOT.Char.GetFaith.HighGodName] demands [new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]!"
 pam_secular_faith_events.0027.b: "Perhaps... [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]?"
 pam_secular_faith_events.0027.c: "I am doomed. And everyone else will be too..."

 pam_secular_faith_events.0028.t: "My Soul, At Peace"
 pam_secular_faith_events.0028.desc: "I kneel in the [ROOT.Char.GetFaith.HouseOfWorship], and the presence of [ROOT.Char.GetFaith.HighGodName] seeps into every corner of my soul.\n\nRevering [old_tenet.GetName( ROOT.Char.GetRite )] has shown me the truth. Never have I known such peace. How could I keep a joy like this to myself? Should I not lead others to the same light, to show them the truth?"
 pam_secular_faith_events.0028.a: "I will find willing ears."
 pam_secular_faith_events.0028.b: "But, my true passion is [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]!"
 pam_secular_faith_events.0028.c: "I should put my feelings to [ROOT.Char.Custom('GetWritingMaterial')]."

 pam_secular_faith_events.0029.t: "A Visit From the Dead"
 pam_secular_faith_events.0029.desc: ""Wake up, [ROOT.Char.GetFirstNameNoTooltip]," a familiar voice rings out. "I am here, [departed.Custom2( 'RelationToMeShort', root_scope )]... in your time of need."\n\nI stir, my forehead damp with sweat. The apparition flickers briefly before vanishing.\n\nWas that... my [ROOT.Char.Custom2( 'RelationToMeShort', departed )]?"
 pam_secular_faith_events.0029.a: "[departed.GetSheHe|U] is safe, and watching over me."
 pam_secular_faith_events.0029.b: "Was it... a warning?"
 pam_secular_faith_events.0029.c: "A trick of the mind. Nothing more."

 pam_secular_faith_events.0030.t: "The Anchorite"
 pam_secular_faith_events.0030.desc: ""I wish to draw nearer to [ROOT.Char.GetFaith.HighGodName]," my [ROOT.Char.Custom2( 'RelationToMeShort', would_be_anchorite )], [would_be_anchorite.GetFirstName], says solemnly. "The world is full of distraction, and I desire complete solitude."\n\n[would_be_anchorite.GetSheHe|U] gazes at the wall of my [ROOT.Char.Custom('ResidenceBuilding')], tracing it with [would_be_anchorite.GetHerHis] fingers.\n\n"The [ROOT.Char.GetFaith.HouseOfWorship] of [church_scope.GetName] is beautiful. I wish to be immured within its walls, and spend the rest of my life in uninterrupted prayer.""
 pam_secular_faith_events.0030.a: "If this is your wish, my masons are at your call."
 pam_secular_faith_events.0030.b: "No, this I will not grant you."

 pam_secular_faith_events.0031.t: "An Argument of Scholars"
 pam_secular_faith_events.0031.desc: ""How can anyone deny the holiness of [tenet_1.GetBaseName]?" cries my [ROOT.Char.Custom2( 'RelationToMeShort', disputant_one )], [disputant_one.GetFirstName].\n\n"Nonsense! It is clear as day that [tenet_2.GetBaseName] brings you closer to the divine! Have you learned nothing?" retorts my [ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )], [disputant_two.GetFirstName]."
 pam_secular_faith_events.0031.a: "A scholar's debate? Let me get my notes..."
 pam_secular_faith_events.0031.b: "I am drawn to [tenet_1.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0031.c: "[tenet_2.GetBaseNameNoTooltip] rings true."
 pam_secular_faith_events.0031.d: "A lively [ROOT.Char.Custom('GetCourt')] is a learned [ROOT.Char.Custom('GetCourt')]."

 pam_secular_faith_events.0032.t: "The Hour of Temptation"
 pam_secular_faith_events.0032.desc_food: "I wake, my pillow wet with drool. The kitchens send up the smell of roasting [ROOT.Char.Custom('RegionalEdibleMeat')] and [ROOT.Char.Custom('GetFoodDetail')]-stuffed [ROOT.Char.Custom('GetRandomRegionalSmallGame')], while the clinking of [ROOT.Char.Custom('RegionalDrink')] cups and merry voices drift through the [ROOT.Char.Custom('ResidenceBuildingHallsType')].\n\nBeing [vice_trait.GetName( GetNullCharacter )], the [ROOT.Char.GetFaith.PriestNeuterPlural] commanded me to fast... but why would [ROOT.Char.GetFaith.HighGodName] test me on this very night?\n\nI feel my resolve vanishing with the rumbling of my stomach."
 pam_secular_faith_events.0032.a: "My urges are justified by [ROOT.Char.GetFaith.HighGodName]!"
 pam_secular_faith_events.0032.b: "No. The fast holds, and so do I."
 pam_secular_faith_events.0032.c: "One small taste... who is to know?"

 pam_secular_faith_events.0033.t: "Pillow Sermons"
 pam_secular_faith_events.0033.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', believing_spouse )], [believing_spouse.GetFirstName], follows [believing_spouse.GetRite.GetName], whose teachings [believing_spouse.GetSheHe] gladly whispers to me at night.\n\n"My [ROOT.Char.Custom('RomanticComplimentAdjective')] [believing_spouse.Custom2( 'RelationToMeShort', root_scope )], did you know that [new_tenet.Custom('GetGenericTenetSentence')] Isn't it #EMP fascinating?#!" [believing_spouse.GetSheHe|U] asks, embracing me.\n\n[believing_spouse.GetHerHis|U] passion is as charming as [believing_spouse.GetHerHis] smile."
 pam_secular_faith_events.0033.a: "Hm, tell me more..."
 pam_secular_faith_events.0033.b: "#EMP You#! are fascinating! Come here."
 pam_secular_faith_events.0033.c: "Please, my [believing_spouse.Custom('RomanticComplimentNoun')], I need to sleep."

 pam_secular_faith_events.0034.t: "The Foundling"
 pam_secular_faith_events.0034.desc: "It's unlike my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], to be late. The silence of the [ROOT.Char.GetFaith.HouseOfWorship] is broken by the frail cries of an infant.\n\n"Merciful [ROOT.Char.GetFaith.HighGodName]..." [chaplain.GetFirstNameNoTooltip] whispers, gently cradling the child. "Abandoned for being [trait_scope.GetName( GetNullCharacter )]... no soul deserves such a fate."\n\nThe child's tiny fingers curl around [chaplain.GetHerHis] thumb."
 pam_secular_faith_events.0034.a: "[ROOT.Char.GetFaith.HighGodName] has given me a [foundling.Custom('GetDaughterSon')]."
 pam_secular_faith_events.0034.b: "The [archdiocese.GetNameNoTooltip] will have [foundling.GetHerHim]."
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip] will raise the child."
 pam_secular_faith_events.0034.d: "I do not care what happens to it."

 pam_secular_faith_events.0035.t: "The Mortification"
 pam_secular_faith_events.0035.desc: "There is blood on the ground. Following the sound of lashing, I find my [ROOT.Char.Custom2( 'RelationToMeShort', sufferer )], [sufferer.GetFirstName]. A crimson scourge is in [sufferer.GetHerHis] hands, and tears streaming down [sufferer.GetHerHis] cheeks.\n\n"My [sinful_trait.GetName( GetNullCharacter )] passions threaten to consume me," [sufferer.GetSheHe] gasps. "Better the sting of the whip than the fire of temptation."\n\n"This pain passes. [ROOT.Char.GetFaith.NegativeAfterLife|U] does not.""
 pam_secular_faith_events.0035.a: "Intriguing... hand me the scourge."
 pam_secular_faith_events.0035.b: "Let [sufferer.GetHerHim] mortify."
 pam_secular_faith_events.0035.c: "For [ROOT.Char.GetFaith.HighGodNamePossessive] sake, stop this madness."
 pam_sf_scourge_abandoned_toast: "The Scourge Abandoned"

 pam_secular_faith_events.0036.t: "Wisdom of the Anchorite"
 pam_secular_faith_events.0036.desc: "A ragged [hermit.GetWomanMan] seeks audience, claiming to be a hermit from the remote [hermit_location.Custom('TerrainTypeProvince')] of [hermit_location.GetName].\n\n"For seven nights [ROOT.Char.GetFaith.HighGodName] has denied me sleep," [hermit.GetSheHe] says sternly. "Not to punish me, but to fill my thoughts with truths meant for others, for you."\n\n"Hear my words, and take heed. Then I shall return to my solitude.""
 pam_secular_faith_events.0036.a: "What mysteries can you impart?"
 pam_secular_faith_events.0036.b: "I am willing to learn."
 pam_secular_faith_events.0036.c: "Begone, beggar."

 pam_secular_faith_events.0037.t: "Carnal Revelation"
 pam_secular_faith_events.0037.desc_wanderer: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] flows late, and a visiting wanderer, [reveler.GetFirstName], leans close."
 pam_secular_faith_events.0037.desc_normal: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] flows late, and my [ROOT.Char.Custom2( 'RelationToMeShort', reveler )], [reveler.GetFirstName], leans close."
 pam_secular_faith_events.0037.desc: "Soon little else holds my attention but [reveler.GetHerHis] [reveler.Custom('ObjectifiedFeature')].\n\n"There are prayers spoken with the tongue," [reveler.GetSheHe] says, slowly removing [reveler.GetHerHis] [reveler.Custom('GetClothingArticle')]. "And there are prayers spoken with the flesh. Let me show you [reveler.Custom('pam_sf_carnal_art')], my [ROOT.Char.Custom('RaunchyComplimentNoun')]."\n\n[reveler.GetSheHe|U] offers me [reveler.GetHerHis] hand. "The ecstasy to come will rival the bliss of [ROOT.Char.GetFaith.PositiveAfterLife].""
 pam_secular_faith_events.0037.a: "Show me. Bar the door behind you."
 pam_secular_faith_events.0037.b: "Cover yourself, [reveler.GetWomanMan]."
 # Geography-neutral (see pam_sf_carnal_art / pam_sf_carnal_art_indian_setting_trigger)
 pam_sf_carnal_art_1: "the Coiling Serpent"
 pam_sf_carnal_art_2: "the Ascending River"
 pam_sf_carnal_art_3: "the Twining Vines"
 pam_sf_carnal_art_4: "the Pressed Embrace"
 # Kama Sutra / Indic - India-gated
 pam_sf_carnal_art_5: "the Splitting of the Bamboo"
 pam_sf_carnal_art_6: "the Mare's Trick"
 pam_sf_carnal_art_7: "the Lotus Unfolding"
 pam_sf_carnal_art_8: "the Wife of Indra"
 pam_sf_carnal_art_9: "the Rising Cobra"
 # Courtly / troubadour - kept out of an Indian setting
 pam_sf_carnal_art_10: "the Lovers' Knot"
 pam_sf_carnal_art_11: "the Rose and the Thorn"
 pam_sf_carnal_art_12: "the Troubadour's Secret"
 pam_sf_carnal_art_13: "the Cupped Flame"

 pam_secular_faith_events.0038.t: "A Taste of Paradise"
 pam_secular_faith_events.0038.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', reveler )], [reveler.GetFirstName], fills another plate with [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')] and grins at me from across the table.\n\n"You hunt for [ROOT.Char.GetFaith.HighGodName] with a growling belly and an empty goblet. I find [ROOT.Char.GetFaith.CreatorHerHim] in ripe fruit, rich meat, laughter, and song," [reveler.GetSheHe] lifts a brimming goblet.\n\n"[ROOT.Char.GetFaith.HighGodNamePossessive] gifts were meant to be savored, [ROOT.Char.Custom('FormOfAddressForLiege')]. To squander what we are given? Now that is a horrible sin!""
 pam_secular_faith_events.0038.a: "Perhaps holiness is in the cup..."
 pam_secular_faith_events.0038.b: "Then I shall spread a feast in its honor."
 pam_secular_faith_events.0038.c: "Decadence dressed up as devotion. No."

 pam_secular_faith_events.0039.t: "A Prayer in the Dark"
 pam_secular_faith_events.0039.desc: "My [ROOT.Char.Custom2( 'RelationToMe', spymaster_scope )], [spymaster_scope.GetFirstName], comes to me, still unsettled by the fruits of [spymaster_scope.GetHerHis] cunning.\n\n"I knelt beside [secret_keeper.GetTitledFirstName] at prayer, [ROOT.Char.Custom('FormOfAddressForLiege')], and I lied — a small, pious untruth, whispered to loosen [secret_keeper.GetHerHis] tongue."\n\n"[secret_keeper.GetSheHe|U] confessed to [secret_keeper.Custom('GetSecretCrimeConfessionIndef')] in the house of [ROOT.Char.GetFaith.HighGodName]," [spymaster_scope.GetSheHe] lowers [spymaster_scope.GetHerHis] voice. "I spoke [GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )]... perhaps this deceit is a duty we owe to [ROOT.Char.GetFaith.HighGodName]?""
 pam_secular_faith_events.0039.a: "[ROOT.Char.GetFaith.HighGodName] does work in shadow..."
 pam_secular_faith_events.0039.b: "A deplorable trick... just tell me the secret."

 pam_secular_faith_events.0040.t: "Flesh of the Faithful"
 pam_secular_faith_events.0040.desc: "Over the evening meal, my [ROOT.Char.Custom2( 'RelationToMeShort', scholar )], [scholar.GetFirstName], opens a well-thumbed tome. Another lecture is about to begin.\n\n"The [Glossary( 'Issedones', 'ISSEDONES_GLOSS' )] did not bury their dead, [ROOT.Char.Custom('FormOfAddressForLiege')]. They feasted upon them!" [scholar.GetSheHe] says, scarcely pausing for breath. "A father's flesh mixed with mutton, his skull gilded and cherished as a holy relic. To them it was the truest love a child could show."\n\n"And the best part?" [scholar.GetSheHe] grins. "Herodotus himself judged them neither wicked nor mad. #EMP 'Custom,'#! he said, #EMP 'is lord of all.'#!""
 pam_secular_faith_events.0040.a: "Oh, I know all about it."
 pam_secular_faith_events.0040.b: "A grim custom... tell me more."
 pam_secular_faith_events.0040.c: "By [ROOT.Char.GetFaith.HighGodName], [scholar.GetWomanMan]. I'm trying to eat!"
 # Real historical grounding - Herodotus' Histories on the Issedones (funerary endocannibalism, gilded ancestor-skulls) and the Callatiae. https://en.wikipedia.org/wiki/Issedones
 ISSEDONES_GLOSS: "A far-northern steppe people described by Herodotus. When a father died, his family mixed his flesh with that of slaughtered livestock for a funeral feast. They would gild his skull, honoring it with yearly sacrifice. Herodotus recorded these customs not to condemn them, but to show that 'custom is lord of all.'"

 pam_secular_faith_events.0041.t: "The Naked Truth"
 pam_secular_faith_events.0041.desc: "As I wander my gardens, I spot a stranger among the [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')] beds, plucking fruit from my [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')] — bare as birth, [adamite.GetHerHis] only garment the falling leaves.\n\n"Oh, a [ROOT.Char.GetTitleAsName]! Why do you hide behind cloth and crown?" [adamite.GetSheHe] asks, unashamed before [ROOT.Char.GetFaith.HighGodName] and me. "I have embraced the first innocence, when we lived naked and unafraid."\n\n[adamite.GetSheHe|U] bites into another piece of fruit, juice running down [adamite.GetHerHis] skin. "Perhaps you should, too.""
 pam_secular_faith_events.0041.a: "I too crave this freedom."
 pam_secular_faith_events.0041.b: "Eat of my fruit, tell your story, then leave."
 pam_secular_faith_events.0041.c: "Have the trespasser locked up."

 pam_secular_faith_events.0042.t: "The Road Made Easy"
 pam_secular_faith_events.0042.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', sponsor_character )], [sponsor_character.GetFirstName], meets me in the garden with a loosened purse and a warm smile.\n\n"Allow me to bear the cost of your [GetActivityType( 'activity_pilgrimage').GetName], [ROOT.Char.Custom('FormOfAddressForLiege')]. A pilgrim should not be counting coins — go freely, and pray for us both."\n\nThe silver is real. So is the trust."
 pam_secular_faith_events.0042.a: "I will walk the road with a grateful heart."
 pam_secular_faith_events.0042.b: "I will take the coin and keep it."
 pam_secular_faith_events.0042.c: "Keep your coin, friend."
 pam_sf_pilgrimage_sponsor_tt: "If you complete a [GetActivityType( 'activity_pilgrimage').GetName] within #V 7#! years, [sponsor_character.GetFirstName] will gain #P 50#! opinion of you"
 pam_sf_pilgrimage_sponsor_toast: "A Patron Gladdened"

 pam_secular_faith_events.0043.t: "A Pilgrim's Welcome"
 pam_secular_faith_events.0043.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', holy_man )], [holy_man.GetFirstName], takes my hands before the altar.\n\n"Walk the pilgrim road, [ROOT.Char.Custom('FormOfAddressForLiege')]. When you return, I will proclaim your [GetActivityType( 'activity_pilgrimage').GetName] in every square of [capital_county.GetNameNoTier]. Your people will know their [ROOT.Char.GetTitleAsNameNoTooltip] knelt for them.""
 pam_secular_faith_events.0043.a: "Then I will take the pilgrim road."
 pam_secular_faith_events.0043.b: "I have more worldly matters to attend to."
 pam_sf_extolled_pilgrimage_toast: "The People Rejoice"

 pam_secular_faith_events.0044.t: "The Ear of the Clergy"
 pam_secular_faith_events.0044.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', friendly_bishop )], [friendly_bishop.GetFirstName], arrives in unusually good spirits.\n\n"I have found favor among my peers of late — bishops, abbots, the voices that carry weight in the Church. If you have need of their pious wisdom, of their moral authority, I can speak in your name."\n\n[friendly_bishop.GetFirstNamePossessiveNoTooltip] favor with power-hungry [ROOT.Char.GetFaith.PriestNeuterPlural] is easily spent."
 pam_secular_faith_events.0044.a: "Then speak in my name."
 pam_secular_faith_events.0044.b: "Your friendship is blessing enough."

 pam_secular_faith_events.0045.t: "Epiphany"
 pam_secular_faith_events.0045.desc: "Clarity strikes like lightning from a clear sky.\n\nDoctrine. Tenets. Rites. Belief. A thousand stray thoughts have fused into a single truth, one that I now see before me in its entirety."
 pam_secular_faith_events.0045.a: "The future beckons me to lead."
 pam_secular_faith_events.0045.b: "I will bask in this moment."

 pam_secular_faith_events.0046.t: "Shared Conviction"
 pam_secular_faith_events.0046.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', intimate )], [intimate.GetFirstName], cannot hide [intimate.GetHerHis] conviction as [intimate.GetSheHe] speaks of [shared_tenet.GetName( intimate.GetRite )].\n\n"[shared_tenet.GetNameNoTooltip( GetNullCharacter.GetRite )] gives meaning to everything I do," [intimate.GetSheHe] says. "Only one thing matters as much to me... you, my [ROOT.Char.Custom('ComplimentAdjective')] [intimate.Custom2('RelationToMe', SCOPE.sC('root_scope'))]."\n\nA single tear runs down [intimate.GetHerHis] cheek. "I just wanted you to know.""
 pam_secular_faith_events.0046.a: "Let shared conviction deepen our bond!"
 pam_secular_faith_events.0046.b: "Sharing this conviction... it's like love."
 pam_secular_faith_events.0046.c: "Thank you for sharing."

 pam_secular_faith_events.0047.t: "Priestly Devotion"
 pam_secular_faith_events.0047.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], traces the sign of the cross, and bows [chaplain.GetHerHis] head.\n\n"[ROOT.Char.GetFaith.HighGodName] has placed the crown upon your brow for a reason. In serving you faithfully, I serve [ROOT.Char.GetFaith.HighGodHerHis|U] will," [chaplain.GetSheHe] proclaims.\n\n"I have sworn my loyalty to [ROOT.Char.GetFaith.HighGodName]. Now, I would swear it to you as well.""
 pam_secular_faith_events.0047.a: "Then serve me wholly."
 pam_secular_faith_events.0047.b: "You must always serve [ROOT.Char.GetFaith.HighGodName] first."

 pam_secular_faith_events.0048.t: "Demonic Dreams"
 pam_secular_faith_events.0048.desc: "I wake, but I cannot move.\n\nA twisted figure dances before me, cackling. A demon? Terror slowly fills my being. "Heh... heh... your sins weigh heavy. Soon [ROOT.Char.GetFaith.EvilGodNames] shall have you!"\n\nWhether dream or demon, I cannot ignore what I have seen. I must make peace with [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0048.a: "This dream... it must mean something."
 pam_secular_faith_events.0048.b: "Only a dream. Back to sleep."
 pam_secular_faith_events.0048.c: "[ROOT.Char.GetFaith.HighGodName] preserve me! I must repent."
 pam_sf_demon_torment_modifier_tt: "To get rid of the modifier, you must construct a [GetBuilding('temple_01').GetName] [holding|E] or go on a [GetActivityType('activity_pilgrimage').GetName]"
 pam_sf_demon_torment_lifted_toast: "The Torment Lifts"

 pam_secular_faith_events.0049.t: "'Celestial Hierarchy'"
 pam_secular_faith_events.0049.desc: "The sounds coming from my chapel are not those of prayer.\n\n"Yes, #emp YES#!, your Grace! Show this wretched sinner [lustful_priest.GetHerHis] proper place in the [GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )]!" my [ROOT.Char.Custom2( 'RelationToMeShort', lustful_priest )] [lustful_priest.GetFirstName] cries in ecstasy. "I am a worm wriggling in the dirt, full of earthly lust. #emp PUNISH ME!#!"\n\nBy [ROOT.Char.GetFaith.HighGodName], what is happening in my chapel!?"
 pam_secular_faith_events.0049.a: "Must be ritualistic, I should... take notes."
 pam_secular_faith_events.0049.b: "If it's in #EMP my#! chapel, then #emp I'm#! joining!"
 pam_secular_faith_events.0049.c: "[lustful_priest.GetFirstNameNoTooltip], a deviant!? Disgusting, but useful."

 pam_secular_faith_events.0050.t: "The [chaplain.Custom('RomanticComplimentAdjective')|U] [chaplain.GetCouncilTitle]"
 pam_secular_faith_events.0050.desc: "The flickering candles in the [ROOT.Char.GetFaith.HouseOfWorship] do little to distract me from the impure thoughts filling my mind.\n\n"Follow me to the booth, [ROOT.Char.Custom('FormOfAddressForLiege')]," my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] whispers. My eyes linger on [chaplain.GetHerHis] [chaplain.Custom('ObjectifiedFeature')]. "Whatever burdens your soul, speak it without fear."\n\nThe [GetTenetType('tenet_confession')GetName( GetPlayer.GetRite )] is holy... but one sin weighs heavier than all others: [chaplain.GetFirstNamePossessive] [chaplain.Custom('AdmiredFeature')]."
 pam_secular_faith_events.0050.a: "...is there space for two in your booth?"
 pam_secular_faith_events.0050.b: "Forgive me, [chaplain.GetMotherFather], for I have impure thoughts."

 pam_secular_faith_events.0051.t: "The Lord Your God"
 pam_secular_faith_events.0051.desc: "#EMP "I am the Lord your God,"#! a booming voice echoes in the [ROOT.Char.GetFaith.HouseOfWorship]. #EMP "You will bow down before me."#!\n\nI fall to my knees, vision blurring. I wipe a streak of blood from my face.\n\n#EMP "I, the Lord your God, command you: Obey me with all your heart and all your soul."#! One voice becomes a hundred. A hundred become a thousand. #EMP "If you do not, I will curse you until you are destroyed, for you have forsaken me, the Lord your God."#!"
 pam_secular_faith_events.0051.a: "I will... obey..."
 pam_sf_lord_your_god_effect_tt: "@alert_icon!#alert_trial Something terrible, or beautiful, will happen...#!"
 pam_sf_lord_your_god_tt: "Please, [ROOT.Char.GetFaith.HighGodName]... have mercy."
 pam_sf_voice_of_jesus_toast: "Voice of Jesus"
 pam_sf_stroke_of_god_toast: "A Stroke of God"

 pam_secular_faith_events.0052.t: "After You're Gone"
 pam_secular_faith_events.0052.desc: "In the [ROOT.Char.GetFaith.HouseOfWorship] of [resting_church.GetNameNoTier], my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], pauses by the worn tomb-slabs of those who ruled before me.\n\n"[ROOT.Char.GetFaith.HighGodName] has granted you more winters than most, [ROOT.Char.Custom('FormOfAddressForLiege')]. There is no sin in choosing how you will rest."\n\n"Your likeness carved in stone, or [Glossary( 'the plain cowl', 'AD_SUCCURRENDUM_GLOSS' )] of a monk — the choice is yours.""
 pam_secular_faith_events.0052.a: "Carve my likeness... but younger, and better-looking."
 pam_secular_faith_events.0052.b: "The plain cowl will suffice."
 pam_secular_faith_events.0052.c: "The grave is patient."
 pam_sf_effigy_planned_tt: "If a [GetActivityType( 'activity_funeral').GetName] is held for you after your death, its host will gain [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [prestige|E]"
 pam_sf_cowl_burial_planned_tt: "If a [GetActivityType( 'activity_funeral').GetName] is held for you after your death, its host will gain [piety_i]#P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! [piety|E]"
 pam_sf_effigy_unveiled_toast: "The Effigy Unveiled"
 pam_sf_cowl_burial_toast: "Laid to Rest in the Cowl"
 # Deathbed monastic conversion (ad succurrendum) - https://en.wikipedia.org/wiki/Ad_succurrendum
 AD_SUCCURRENDUM_GLOSS: "To die #G ad succurrendum#! — taking a monk's vows and habit on the deathbed — was a last resort of great lords throughout medieval Christendom. Buried in a simple cowl instead of silks, the dying ruler hoped to face judgment as a humble brother and not as a prince."

 pam_secular_faith_events.0053.t: "The Saint Goes Forth"
 pam_secular_faith_events.0053.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], lifts the lid of a reliquary with a midwife's care. Inside rests the treasure of my house: the [procession_relic.GetName].\n\n"Holiness under lock and key serves no purpose, [ROOT.Char.Custom('FormOfAddressForLiege')]," [chaplain.GetSheHe] says. "Grant your people an [Glossary( 'ostension', 'OSTENSION_GLOSS' )] — the relic must be seen, and each street from this door to the gates blessed.""
 pam_secular_faith_events.0053.a: "I will carry the reliquary myself."
 pam_secular_faith_events.0053.b: "I will keep this vigil alone."
 pam_secular_faith_events.0053.c: "I dare not move it."
 pam_sf_procession_gamble_tt: "The streets are no vault, the artifact may come to harm..."
 pam_sf_relic_jostled_toast: "Jostled in the Crowd"
 # Solemn showing and procession of relics (ostensio) - https://en.wikipedia.org/wiki/Translation_(relic)
 OSTENSION_GLOSS: "The solemn showing of a saint's relics. On great feast days the relics were lifted from their vaults and borne in procession through streets and fields, so a blessing tied to its altar might touch each soul on the route. A relic abroad drew crowds, coin, and renown."

 pam_secular_faith_events.0054.t: "The Basin and the Cloth"
 pam_secular_faith_events.0054.desc: "The basin steams and the [ROOT.Char.Custom('GetCourt')] has gathered to watch. A nervous [pauper.Custom2('dummy_peasant_profession', pauper)] perches on the stool, [pauper.GetHerHis] bare feet caked with dirt. The smell is... distinct.\n\nOn this very night the Savior knelt with basin and cloth. The [Glossary( 'Mandatum', 'MANDATUM_GLOSS' )] is prepared, and each eye in the room is on me.\n\nAll that remains is to kneel — or to think better of it."
 pam_secular_faith_events.0054.deviant: "#EMP I'll clean those delicious feet with my tongue.#!"
 pam_secular_faith_events.0054.a: "Kneel, and take up the cloth."
 pam_secular_faith_events.0054.b: "Kneel, and kiss these weary feet."
 pam_secular_faith_events.0054.c: "I... cannot. Take the basin away."
 pam_sf_odorous_feet_tt: "Holiness may fill me as I kneel... or the smell of the peasant's feet may never leave me"
 pam_sf_odorous_feet_toast: "The Stench Lingers"
 # Maundy foot-washing (pedilavium / Royal Maundy) - https://en.wikipedia.org/wiki/Maundy_(foot_washing)
 MANDATUM_GLOSS: "The rite of foot-washing, from Christ's words at the Last Supper: #G 'Mandatum novum do vobis'#! — 'a new commandment I give unto you.' Thus, on the Thursday of Holy Week, rulers knelt with basin and cloth to wash the feet of a few paupers and press silver into their palms."

 pam_secular_faith_events.0055.t: "The Voice of Bronze"
 pam_secular_faith_events.0055.desc: "The old bell of the [bell_church.GetName] became cracked, and was therefore recast. The new one hangs gleaming in its high tower. Beneath, my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] is ready with water, holy oil, and salt.\n\n"A bell must be [Glossary( 'baptized', 'BELL_BAPTISM_GLOSS' )] to give voice to [ROOT.Char.GetFaith.HighGodName]," [chaplain.GetSheHe] insists, sleeves rolled. "Washed, anointed, and christened — and afterward no fiend or storm may still its voice.""
 pam_secular_faith_events.0055.a: "Then let it be washed, anointed, and named."
 pam_secular_faith_events.0055.b: "It is bronze, not a soul — the capitularies say as much."
 pam_secular_faith_events.0055.c: "A short blessing will do. Let it ring."
 # Baptism of bells; storm-dispelling bell lore - https://en.wikipedia.org/wiki/Baptism_of_bells
 BELL_BAPTISM_GLOSS: "Church bells were consecrated much as Christians were: washed with holy water, anointed with oil, given a saint's name — some even stood godparents for them. Charlemagne's #G Admonitio Generalis#! forbade the baptizing of bells in 789, and the custom carried on regardless for centuries. A christened bell was trusted to scatter storms, hail, and demons wherever its voice reached; later founders cast their bells with the motto #G Fulgura frango#! — 'I break the lightning.'"

 pam_secular_faith_events.0056.t: "A Sparrow in the Hall"
 pam_secular_faith_events.0056.desc: "A sparrow darts in from the winter night, sweeps the length of the [ROOT.Char.Custom('ResidenceBuildingHallType')] through torch-smoke and laughter, and vanishes again through the [ROOT.Char.Custom('ResidenceBuildingWindowType')].\n\nThe [ROOT.Char.Custom('GetCourt')] laughs. My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], does not.\n\n"[Glossary( 'So is the life of man', 'BEDE_SPARROW_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')] — a moment in the light and warmth, between one darkness and another. What comes before and after is known only to [ROOT.Char.GetFaith.HighGodName].""
 pam_secular_faith_events.0056.scholar: "Bede wrote the same, almost to the word."
 pam_secular_faith_events.0056.a: "Then let the moment in the light be spent well."
 pam_secular_faith_events.0056.b: "It was a bird. More wine."
 # Bede's sparrow simile, from the conversion of King Edwin of Northumbria - https://en.wikipedia.org/wiki/Edwin_of_Northumbria
 BEDE_SPARROW_GLOSS: "In Bede's telling, a counselor of King Edwin likened life to a sparrow crossing a warm feast on a winter night: a brief passage of light and comfort from storm to storm, its beginning and end unknown. If the new faith could tell of what lay past the feast, it deserved a hearing — and Edwin was persuaded."

 pam_secular_faith_events.0057.t: "The Church Ale"
 pam_secular_faith_events.0057.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], presides in the churchyard of the [ale_church.GetName] over tables seating most of the parish and barrels rolled straight from the [GetBuilding('breweries_01').GetName], a brimming tankard in hand.\n\n"The roof lets in rain, [ROOT.Char.Custom('FormOfAddressForLiege')], and the tithe is too thin. So the brothers brew, we sell, and the parish drinks the [Glossary( 'church ale', 'CHURCH_ALE_GLOSS' )] till the roof is paid for."\n\n"Each tankard is a good deed. Will you take one?""
 pam_secular_faith_events.0057.a: "Hand me a cup, then. For the roof."
 pam_secular_faith_events.0057.b: "Spare the ale — I will pay for the roof myself."
 pam_secular_faith_events.0057.c: "Drink? On holy ground? Pour it out."
 pam_sf_church_ale_gamble_tt: "Every cup is for the roof, and the parish brews strong..."
 pam_sf_church_ale_toast: "A Sore Head Come Morning"
 # Church ales / scot-ales - parish fundraising feasts, condemned by synods and merrily continued - https://en.wikipedia.org/wiki/Church_ale
 CHURCH_ALE_GLOSS: "A parish feast where ale brewed from donated malt was sold in the churchyard, the proceeds going to the upkeep of the church — a leaking roof, a new bell, bread for the poor. Synod after synod condemned the drinking on holy ground, and parish after parish kept brewing; for many a village church, the ale paid for more than the tithe ever did."

 pam_secular_faith_events.0058.t: "Quid Mus Sumit?"
 pam_secular_faith_events.0058.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], bursts in, pale as an altar cloth, holding a small silver [Glossary( 'pyx', 'PYX_GLOSS' )] as if it burned in [chaplain.GetHerHis] hands.\n\n"A mouse, [ROOT.Char.Custom('FormOfAddressForLiege')]. It gnawed through the box earlier this night and ate of the [Glossary( 'blessed bread', 'RESERVED_HOST_GLOSS' )]!"\n\n[chaplain.GetSheHe|U] can barely speak. "The scholars ask [Glossary( 'quid mus sumit', 'QUID_MUS_SUMIT_GLOSS' )] — what, then, did the mouse eat? What must I do?""
 pam_secular_faith_events.0058.scholar: "Calm yourself. The mouse ate bread, nothing more."
 pam_secular_faith_events.0058.mean: "You let a #EMP mouse#! sup on [ROOT.Char.GetFaith.HighGodName]?! Out of my [ROOT.Char.Custom('GetCourt')]!"
 pam_secular_faith_events.0058.a: "Buy a pyx with a better lock."
 pam_secular_faith_events.0058.b: "So the mouse is damned, then? Ha!"
 # 'Quid mus sumit?' - the scholastic question of the mouse and the Host; cf. the related digestion controversy - https://en.wikipedia.org/wiki/Stercoranism
 QUID_MUS_SUMIT_GLOSS: "#G Quid mus sumit?#! — 'what does the mouse eat?' The schoolmen debated it in earnest: if a mouse gnawed the consecrated Host, had it eaten the body of God? Canon law imposed penances for careless priests, and the great doctors ruled that the mouse received only the appearance of bread, the sacrament withdrawing from unworthy teeth."
 # The pyx, a lidded vessel for the consecrated bread - https://en.wikipedia.org/wiki/Pyx
 PYX_GLOSS: "A small lidded box, usually of silver or gilt, in which the consecrated bread of the mass is kept. Canon law demanded it be kept clean, locked, and safe from profane hands — or hungrier visitors."
 # Reservation of the sacrament between masses - https://en.wikipedia.org/wiki/Reserved_sacrament
 RESERVED_HOST_GLOSS: "Bread consecrated at Mass and reserved in the church so the sick and the dying could receive it at any hour. Once consecrated, the bread was believed to be the true body of God, and its safekeeping a matter of the gravest importance."

 pam_secular_faith_events.0059.t: "The Lord's Day"
 pam_secular_faith_events.0059.desc: "At dawn, word came at dawn of a [sighting_county.Custom('GetAnimalAdjective')] [sighting_county.Custom('GetAnimalType')] in the [sighting_province.Custom('GetTerrainTypePlural')] of [sighting_county.GetBaseNameNoTier]. The hounds are baying and the horses stamp in the yard — but my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], stands square in the gateway.\n\n"It is [Glossary( 'the day of rest', 'LORDS_DAY_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')]. The bell has rung and mass awaits!"\n\n"Six days has [ROOT.Char.GetFaith.HighGodName] given you to ride. Need you covet this one as well?""
 pam_secular_faith_events.0059.a: "Unsaddle the horses. We will hear mass."
 pam_secular_faith_events.0059.b: "The [sighting_county.Custom('GetAnimalType')] will not wait. Ride!"
 # Sunday rest - councils and kings alike forbade work, markets, and the hunt on the Lord's Day - https://en.wikipedia.org/wiki/Lord%27s_Day
 LORDS_DAY_GLOSS: "The first day of the week, kept holy in memory of the Resurrection. Church councils forbade servile work, markets, and idle sport upon it, and Christian kings wrote the ban into law — though many a lord reckoned the stag, like the sermon, a matter between himself and God."

 pam_secular_faith_events.0060.t: "A Life Unburdened"
 pam_secular_faith_events.0060.desc: "As I ride through the streets of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], troubled by my empty coffers and inner turmoil, I spot a beggar.\n\nUnburdened by worldly possessions, [hermit.GetSheHe] dances with the peace and understanding of someone who has accepted their place in the world. A soul free from the miseries I suffer.\n\nPerhaps [hermit.GetSheHe] sees a truth which could free me too."
 pam_secular_faith_events.0060.a: "The less I have, the more I am!"
 pam_secular_faith_events.0060.b: "I will gild this cage of mine once more!"
 pam_secular_faith_events.0060.c: "Get me out of this rain."