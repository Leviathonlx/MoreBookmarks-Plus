 ### Holy Myron - artifact
 pam_holy_myron_artifact_name: "Ampulla of Holy Myron"
 pam_holy_myron_artifact_desc_common: "A stoppered vessel of consecrated chrism: [Glossary('balsam of Judea','pam_myron_gloss_balsam')] steeped in pure olive oil, with a drop of the previous batch folded into the new, so that the chain of blessing runs unbroken back to the Apostles."
 pam_holy_myron_artifact_desc_masterwork: "A stoppered vessel of consecrated chrism: [Glossary('balsam of Judea','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')], and [Glossary('myrrh','pam_myron_gloss_myrrh')] steeped in pure olive oil, with a drop of the previous batch folded into the new, so that the chain of blessing runs unbroken back to the Apostles."
 pam_holy_myron_artifact_desc_famed: "A stoppered vessel of consecrated chrism: [Glossary('balsam of Judea','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')], [Glossary('myrrh','pam_myron_gloss_myrrh')], [Glossary('spikenard','pam_myron_gloss_spikenard')], and [Glossary('cinnamon','pam_myron_gloss_cinnamon')] steeped in pure olive oil, with a drop of the previous batch folded into the new, so that the chain of blessing runs unbroken back to the Apostles."
 pam_holy_myron_artifact_desc_illustrious: "A stoppered vessel of consecrated chrism, blended in perfect faith to the oldest recipes: [Glossary('balsam of Judea','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')], [Glossary('myrrh','pam_myron_gloss_myrrh')], [Glossary('spikenard','pam_myron_gloss_spikenard')], [Glossary('cinnamon','pam_myron_gloss_cinnamon')], [Glossary('calamus','pam_myron_gloss_calamus')], and [Glossary('cassia','pam_myron_gloss_cassia')] steeped in pure olive oil, with a drop of the previous batch folded into the new, so that the chain of blessing runs unbroken back to the Apostles."
 pam_holy_myron_charges_line: "Anointings remaining: #V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"

 ### Ingredient glosses
 pam_myron_gloss_balsam: "The famed balm of Judea: a fragrant resin wept by a low shrub cultivated at Jericho and En-Gedi by the Dead Sea, drop for drop the costliest perfume of the ancient world. It is the heart of the chrism, and its jealously guarded groves grow nowhere else."
 pam_myron_gloss_frankincense: "A golden resin tapped from the gnarled trees of southern Arabia, and from almost no other land. Burned on altars since time immemorial, it sweetens the chrism while its smoke bears prayer upward."
 pam_myron_gloss_myrrh: "A bitter, blood-dark resin bled from thorn trees of southern Arabia and the Horn of Africa. Listed in the Book of Exodus among the makings of the holy anointing oil, it was the Magi's gift to the Christ-child and the faithful's offering for His tomb."
 pam_myron_gloss_spikenard: "A heavy, sweet oil pressed from the roots of a plant of the high eastern mountains, brought down to the ports of India. With such nard the Lord was anointed at Bethany, at a cost that scandalized the disciples."
 pam_myron_gloss_cinnamon: "The sweet inner bark of trees from India and the isles beyond, listed in the Book of Exodus among the makings of the holy anointing oil. It travels the length of the known world to any Christian altar."
 pam_myron_gloss_calamus: "The sweet cane of Scripture: an aromatic reed gathered from far eastern marshes, named in the Book of Exodus among the makings of the holy anointing oil."
 pam_myron_gloss_cassia: "A coarser cousin of cinnamon, peeled from the bark of far-eastern trees and listed in the Book of Exodus among the makings of the holy anointing oil."

 ### Modifiers
 pam_holy_myron_vessel_modifier: "Vessel of the Holy Myron"
 pam_holy_myron_vessel_modifier_desc: "This vessel holds consecrated chrism, and the scent of [Glossary('balsam of Judea','pam_myron_gloss_balsam')] hallows its keeper."
 pam_holy_myron_vessel_potent_modifier: "Vessel of Potent Holy Myron"
 pam_holy_myron_vessel_potent_modifier_desc: "This vessel contains chrism of rare potency, rich in [Glossary('frankincense','pam_myron_gloss_frankincense')] and [Glossary('spikenard','pam_myron_gloss_spikenard')], and the fragrance alone bespeaks sanctity."
 pam_chrismated_artifact_modifier: "Chrismated"
 pam_chrismated_artifact_modifier_desc: "This artifact has been anointed with the Holy Myron, and the scent of [Glossary('myrrh','pam_myron_gloss_myrrh')] clings to it still."
 pam_chrismated_regalia_modifier: "Chrismated Regalia"
 pam_chrismated_regalia_modifier_desc: "This artifact was touched with the Holy Myron at a coronation, and the blessing has not faded."
 pam_holy_myron_pilgrim_modifier: "Bearer of the Balsams"
 pam_holy_myron_pilgrim_modifier_desc: "This character travels in search of the makings of the Holy Myron — [Glossary('balsam','pam_myron_gloss_balsam')], [Glossary('frankincense','pam_myron_gloss_frankincense')], and rarer things — and takes no chances on the road."
 pam_chrismated_child_modifier: "Chrismated"
 pam_chrismated_child_modifier_desc: "This character was chrismated soon after birth, sealed with the gift of the Holy Spirit in blessed oil."
 pam_myron_chrismated_child_modifier: "Chrismated with the Holy Myron"
 pam_myron_chrismated_child_modifier_desc: "This character was chrismated soon after birth with the Holy Myron itself — [Glossary('balsam of Judea','pam_myron_gloss_balsam')] upon a newborn brow — an anointing that will never fade."
 pam_anointed_with_holy_oil_modifier: "Anointed with Holy Oil"
 pam_anointed_with_holy_oil_modifier_desc: "This character has received the anointing of the sick: [Glossary('balsam','pam_myron_gloss_balsam')]-sweet oil upon brow and hands, fortifying body and soul through the trial."

 ### Prepare the Holy Myron decision
 pam_prepare_holy_myron_decision: "Prepare the Holy Myron"
 pam_prepare_holy_myron_decision_tooltip: "Send your [court_chaplain|E] to gather rare balsams and consecrate an #V Ampulla of Holy Myron#!, an [artifact|E] whose charges are spent on holy anointments"
 pam_prepare_holy_myron_decision_desc: "The sacred chrism cannot be blended from kitchen leavings. Scripture names its makings — [Glossary('myrrh','pam_myron_gloss_myrrh')], sweet [Glossary('cinnamon','pam_myron_gloss_cinnamon')], [Glossary('calamus','pam_myron_gloss_calamus')], and [Glossary('cassia','pam_myron_gloss_cassia')] in pure olive oil — and each must be fetched from the land that grows it.\n\nThe farther the expedition ranges, the richer the blend brought back for consecration. But the way is long and rarely kind; bandits and fevers may thin the batch, or claim its bearer."
 pam_prepare_holy_myron_decision_confirm: "Send the expedition"
 pam_prepare_holy_myron_decision_needs_chaplain: "Your [court_chaplain|E] must be an available adult who is not already traveling"
 pam_prepare_holy_myron_decision_already_owned: "You must not already possess an Ampulla of Holy Myron"
 pam_prepare_holy_myron_decision_journey_underway: "Your [court_chaplain|E] is already gathering the balsams"
 pam_prepare_holy_myron_decision_levant_name: "The Balsam of Judea"
 pam_prepare_holy_myron_decision_levant_desc: "Your [court_chaplain|E] gathers [Glossary('balsam of Judea','pam_myron_gloss_balsam')] at #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! — a single destination, and the plainest blend.\n\nYields a [common|E] Ampulla of Holy Myron."
 pam_prepare_holy_myron_decision_arabia_name: "Balsam and Frankincense"
 pam_prepare_holy_myron_decision_arabia_desc: "Your [court_chaplain|E] gathers [Glossary('balsam','pam_myron_gloss_balsam')] in #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, and [Glossary('frankincense','pam_myron_gloss_frankincense')] and [Glossary('myrrh','pam_myron_gloss_myrrh')] in #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! — a pair of stops on the incense road.\n\nYields a [masterwork|E] Ampulla of Holy Myron."
 pam_prepare_holy_myron_decision_india_name: "Every Sacred Ingredient"
 pam_prepare_holy_myron_decision_india_desc: "Your [court_chaplain|E] gathers [Glossary('balsam','pam_myron_gloss_balsam')] at #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, [Glossary('frankincense','pam_myron_gloss_frankincense')] and [Glossary('myrrh','pam_myron_gloss_myrrh')] at #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, and [Glossary('spikenard','pam_myron_gloss_spikenard')] and [Glossary('cinnamon','pam_myron_gloss_cinnamon')] at #V [GetTitleByKey('c_kerala').GetNameNoTier]#!, a long journey.\n\nYields a [famed|E] Ampulla of Holy Myron. If your [court_chaplain|E] follows the old recipes faithfully — a #V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! chance, scaling with [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetHerHis] [learning|E] — the batch is [illustrious|E] instead."
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision_afford_arabia_tt: "You must be able to afford [gold_i][GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V] [gold|E]"
 pam_prepare_holy_myron_decision_afford_india_tt: "You must be able to afford [gold_i][GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V] [gold|E]"
 pam_prepare_holy_myron_journey_toast: "The Expedition for the Holy Myron Sets Out"
 pam_prepare_holy_myron_journey_toast_tt: "Your [court_chaplain|E] sets out to gather the makings of the Holy Myron"
 pam_prepare_holy_myron_decision_levant_effect_tt: "Your [court_chaplain|E] sets out for #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!. Upon their return, a [common|E] Ampulla of Holy Myron will be consecrated — if the road is kind"
 pam_prepare_holy_myron_decision_arabia_effect_tt: "Your [court_chaplain|E] sets out for #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! and #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!. Upon their return, a [masterwork|E] Ampulla of Holy Myron will be consecrated — bandits or misfortune on the road may diminish the batch"
 pam_prepare_holy_myron_decision_india_effect_tt: "Your [court_chaplain|E] sets out for #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, and #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. Upon their return, a [famed|E] Ampulla of Holy Myron will be consecrated, with a #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! chance of an [illustrious|E] one instead — bandits or misfortune on the road may diminish the batch"

 ### Journey events
 pam_holy_myron.0011.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0011.desc_levant: "I write from the shores of the Salt Sea, where the [Glossary('balm of Judea','pam_myron_gloss_balsam')] weeps from scored bark like golden tears. The growers drive a hard bargain, but the resin is true — one drop on the wrist perfumes an entire room. The first of the makings is secured."
 pam_holy_myron.0011.desc_arabia: "The incense route was long and the wells few, but Dhofar has yielded our prize: [Glossary('frankincense','pam_myron_gloss_frankincense')] pale as frost, and [Glossary('myrrh','pam_myron_gloss_myrrh')] the color of dried blood. The caravan masters swear finer resin passes through no port in the world. I believed them, and paid accordingly."
 pam_holy_myron.0011.desc_india: "The sea crossing tried each soul aboard, but the markets of the Malabar coast repaid us: [Glossary('spikenard','pam_myron_gloss_spikenard')] from the high mountains, and the sweetest [Glossary('cinnamon','pam_myron_gloss_cinnamon')] I have ever tasted. The last of the makings is secured. We sail for home."
 pam_holy_myron.0011.a: "May the rest of the road be swift."

 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U], misfortune strikes,"
 pam_holy_myron.0012.desc: "Armed brigands bar the pass ahead and call themselves toll-keepers, though no crown ever granted the right. They have counted our chests and know their worth; for a price, we may go through unplundered.\n\nI await your answer, and keep the balsams close."
 pam_holy_myron.0012.a: "Pay them. The chrism is worth more than coin."
 pam_holy_myron.0012.b: "The Church's coin is not for brigands."
 pam_holy_myron.0012.b.tt: "The gathered balsams will be plundered, and the final batch of Holy Myron will be of #N lower quality#!"

 pam_holy_myron.0013.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0013.desc: "A fever caught me on the way. My fingers tremble as I write, and the innkeeper's wife swears by a different remedy each day, each fouler than the last. Do not fear for the balsams — they are sealed and better guarded than I am. I ride on the moment I can sit a horse."
 pam_holy_myron.0013.a: "I will pray for [myron_chaplain.GetHerHim]."

 pam_holy_myron_journey_abandoned_toast: "The Holy Myron Expedition Is Abandoned"

 pam_holy_myron.0020.t: "The Journey Ends"
 pam_holy_myron.0020.desc: "A merchant writes to tell me that [myron_chaplain.GetTitledFirstName], whom I sent for the makings of the Holy Myron, has died in a strange land. The balsams are lost among strangers, and my silver and [myron_chaplain.GetHerHis] labors will yield no chrism."
 pam_holy_myron.0020.a: "May [ROOT.Char.GetFaith.HighGodName] rest [myron_chaplain.GetHerHim]."

 pam_holy_myron.0100.t: "The Consecration of the Myron"
 pam_holy_myron.0100.desc.intro: "A road-worn [myron_chaplain.GetTitledFirstName] returns to me at last, and my court can smell the cargo from the gate. With the doors shut, the oil is blended, and a drop of the old myron is folded into the new, an unbroken custom since the Apostles.\n\n"
 pam_holy_myron.0100.desc_full: "Each ingredient survived the journey. Golden and fragrant, the finished chrism is poured into the ampulla and placed on my altar."
 pam_holy_myron.0100.desc_robbed: "Much was lost on the journey and the blend is thinner than I hoped — but consecration restores what the journey diminished, and the ampulla is placed on my altar all the same."
 pam_holy_myron.0100.a: "The chain of blessing remains unbroken."

 ### Funeral: anoint the deceased
 pam_holy_myron.0200.t: "A Final Anointing"
 pam_holy_myron.0200.desc: "The mourners part as I approach the bier with the [pam_holy_myron_artifact.GetName]. Under the eyes of the assembled court, a cross of sacred chrism on the brow would send [deceased.GetTitledFirstName] to the throne of [ROOT.Char.GetFaith.HighGodName] as one of the anointed, an honor all present would witness and retell. But each drop I spend on the dead is a drop the living will never see."
 pam_holy_myron.0200.a: "Let [deceased.GetFirstNameNoTooltip] go anointed."
 pam_holy_myron.0200.a.saint_tt: "#V [deceased.GetFirstNameNoTooltip]#! will be looked upon more favorably when considered for sainthood"
 pam_holy_myron.0200.b: "The chrism is for the living."
 pam_holy_myron.0200.b.tt: "You steward the sacred chrism for those it can still bless"

 ### Spending the oil
 pam_holy_myron_spend_tt: "One charge of your Ampulla of Holy Myron is spent"
 pam_holy_myron_spend_last_tt: "The #N final#! charge of your Ampulla of Holy Myron is spent — the emptied vessel will be #N lost#!"
 pam_holy_myron_vessel_spent_toast: "The Ampulla Runs Dry"
 pam_holy_myron_vessel_spent_tt: "Its last measure of chrism poured out, the vessel is retired"

 ### Coronation
 pam_holy_myron_coronation_option: "Let the Holy Myron seal this crown."
 pam_holy_myron_coronation_option.flavor: "Spend a charge of the sacred chrism on your own anointment."
 pam_chrismated_regalia_desc: "[pam_regnal_artifact.GetDesc]\n\nAt a coronation it was touched with the Holy Myron, and it carries the blessing still."
 pam_holy_myron_coronation_memory: "was anointed with the Holy Myron"
 pam_holy_myron_coronation_memory_desc: "At my coronation, [anointer.GetTitledFirstName] anointed me with the sacred chrism itself."
 pam_holy_myron_coronation_memory_desc_second_perspective: "at your coronation, [anointer.GetTitledFirstName] anointed you with the sacred chrism itself."
 pam_holy_myron_coronation_memory_desc_third_perspective: "[owner.GetTitledFirstName] was anointed with the sacred chrism itself at [owner.GetHerHis] coronation."

 ### Anoint an Artifact decision
 pam_anoint_artifact_decision: "Anoint an Artifact with Holy Myron"
 pam_anoint_artifact_decision_tooltip: "Spend a charge of the Holy Myron to mark one of your [artifacts|E] as [sanctified|E], regardless of what your tenets would ordinarily allow"
 pam_anoint_artifact_decision_desc: "The chrism owes the clergy no obedience. Blade, book, or bauble — what it touches is [sanctified|E] for [ROOT.Char.GetFaith.GetName] by the oil alone, and no tenet or bishop can gainsay it."
 pam_anoint_artifact_decision_confirm: "Anoint it"
 pam_anoint_artifact_decision_no_item_selected: "No [artifact|E] selected"
 pam_anoint_artifact_needs_myron_tt: "Must possess an #V Ampulla of Holy Myron#! with oil remaining"
 pam_anoint_artifact_has_eligible_artifact_tt: "Must own an [artifact|E] that is not already [sanctified|E]"
 pam_anoint_artifact_not_myron_tt: "The Holy Myron cannot anoint itself"
 pam_anoint_artifact_not_already_chrismated_tt: "Must not already be chrismated"
 pam_anoint_artifact_toast: "Chrismated Artifact"
 pam_chrismated_artifact_name: "Chrismated [pam_anointed_artifact.GetNameNoTooltip]"
 pam_chrismated_artifact_desc: "[pam_anointed_artifact.GetDesc]\n\nIt has been anointed with the Holy Myron, and glistens faintly with the sacred oil."

 ### Gift the Holy Myron interaction
 pam_give_holy_myron_interaction: "Gift the Holy Myron"
 pam_give_holy_myron_interaction_desc: "Fill a fresh ampulla from your own Holy Myron and gift it to [recipient.GetShortUIName]. Your vessel loses one charge; you gain [piety|E] and [recipient.GetShortUINamePossessive] gratitude."
 pam_give_holy_myron_recipient_toast: "A Gift of Holy Myron"
 pam_give_holy_myron_recipient_tt: "You receive a [common|E] Ampulla of Holy Myron [artifact|E] with one charge"

 ### Personal tenet rituals
 pam_holy_myron_chrismation_toast: "Chrismation of the Newborn"
 pam_holy_myron_unction_toast: "The Anointing of the Sick"

 pam_holy_myron.0300.t: "The Seal of the Spirit"
 pam_holy_myron.0300.desc: "My [child.Custom('GetDaughterSon')] [child.GetFirstName] howls against the [myron_officiant.GetFaith.PriestNeuter]'s chest as the chrism is brought forward.\n\nThe church has blessed oil to spare for any newborn — but my ampulla of Holy Myron is at hand, and one gleaming drop of it would seal this child for life."
 pam_holy_myron.0300.desc_twin: "\n\nAnd not one brow, but two — [pam_myron_twin.GetFirstName] is swaddled alongside [pam_myron_twin.GetHerHis] twin, awaiting the same seal."
 pam_holy_myron.0300.a: "The blessed oil of the church suffices."
 pam_holy_myron.0300.b: "Nothing less than the Holy Myron will do."
