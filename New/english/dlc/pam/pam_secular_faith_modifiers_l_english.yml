l_english:

 pam_sf_devotion_modifier: "Devotion to Prosperity"
 pam_sf_devotion_modifier_desc: "This character has made a private dedication of devotion, quietly rewarded in piety and coin."
 pam_sf_grace_modifier: "A Grace Received"
 pam_sf_grace_modifier_desc: "This character has received a grace, a thanksgiving or quiet vow that lifts the spirit."
 pam_sf_consolation_modifier: "At Peace"
 pam_sf_consolation_modifier_desc: "This character is at peace."
 pam_sf_visionary_renown_modifier: "A Vision Proclaimed"
 pam_sf_visionary_renown_modifier_desc: "This character has proclaimed a divine vision to the court, burnishing their standing."
 pam_sf_consecrated_arms_modifier: "Consecrated Arms"
 pam_sf_consecrated_arms_modifier_desc: "This character has had their household arms blessed on a holy feast day."
 pam_sf_serenity_modifier: "Extolling Public Rituals"
 pam_sf_serenity_modifier_desc: "This character's public devotions have endeared them to clergy and court."
 pam_sf_humiliated_modifier: "Humiliating Vows"
 pam_sf_humiliated_modifier_desc: "This character has been forced to take holy vows and shut away in a cloister."
 pam_sf_promised_acclaim_modifier: "A Pilgrim's Promise"
 pam_sf_promised_acclaim_modifier_desc: "This character's realm priest has pledged to proclaim their next completed pilgrimage to the people of the capital.\n\nOn completing a pilgrimage, their [capital|E] will gain [GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip] for #V 15#! years."
 pam_sf_extolled_pilgrimage_county_modifier: "A Pilgrim's Welcome"
 pam_sf_extolled_pilgrimage_county_modifier_desc: "Word of their ruler's pilgrimage rings through this county, and the people thrive on the pride of it."
 pam_sf_free_feast_discount_desc: "A Feast in the Offing"
 pam_sf_free_feast_modifier: "Yearning to Feast"
 pam_sf_free_feast_modifier_desc: "A glimpse of holy indulgence has increased this character's appetite:\n$EFFECT_LIST_BULLET$Next [GetActivityType( 'activity_feast').GetName] Cost: [gold_i]#P -100%#!\n#weak Spent when the feast begins.#!"
 pam_sf_pilgrimage_funded_modifier: "Sponsored Pilgrimage"
 pam_sf_pilgrimage_funded_modifier_desc: "A patron has pledged to cover part of the cost of this character's next pilgrimage:\n$EFFECT_LIST_BULLET$[GetActivityType( 'activity_pilgrimage').GetName] Cost: [gold_i]#P -50%#!"
 pam_sf_pilgrimage_funded_discount_desc: "Sponsored Pilgrimage"
 pam_sf_ear_of_clergy_modifier: "The Ear of the Clergy"
 pam_sf_ear_of_clergy_modifier_desc: "The Church is more likely to accept this character's petitions:\n$EFFECT_LIST_BULLET$#V $hof_ask_for_claim_interaction$#! Acceptance: #P +25#!\n$EFFECT_LIST_BULLET$#V $hof_ask_for_gold_interaction$#! Acceptance: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_excommunication_interaction$#! Acceptance: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_legitimacy_interaction$#! Acceptance: #P +25#!\n$EFFECT_LIST_BULLET$#V $ecclesiastic_grant_claim_interaction$#! Acceptance: #P +25#!\n$EFFECT_LIST_BULLET$#V $strengthen_claim_interaction$#! Acceptance: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_enforce_succession_interaction$#! Acceptance: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_white_peace_interaction$#! Acceptance: #P +25#!"
 pam_religious_delirium_modifier: "Religious Delirium"
 pam_religious_delirium_modifier_desc: "This character is certain that heaven itself speaks to them:\n$EFFECT_LIST_BULLET$[spiritual_fulfillment|E] gain: #P +50%#!\n$EFFECT_LIST_BULLET$[spiritual_fulfillment|E] loss: #N +50%#!"
 pam_sf_church_builder_modifier: "Builder of Churches"
 pam_sf_church_builder_modifier_desc: "Having raised a first house of worship, this character builds churches a little more cheaply and gains a steady trickle of piety."
 pam_sf_scriptorium_county_modifier: "Scribes at Work"
 pam_sf_scriptorium_county_modifier_desc: "Settled scholars copy and keep this holding's accounts."
 pam_sf_doctrine_clarity_modifier: "Epiphany"
 pam_sf_doctrine_clarity_modifier_desc: "This character has had a rare moment of clarity, an epiphany."
 pam_sf_favorable_omen_modifier: "Favorable Omen"
 pam_sf_favorable_omen_modifier_desc: "This character reads the heavens as a sign of divine favor, and the faithful take heart at the blessing."
 pam_sf_omen_of_victory_modifier: "Omen of Victory"
 pam_sf_omen_of_victory_modifier_desc: "Certain the heavens have promised victory, this character and their host march without fear."
 pam_sf_demon_torment_modifier: "Demonic Torment"
 pam_sf_demon_torment_modifier_desc: "This character is convinced that they are haunted by a demon, and need to construct a [GetBuilding('temple_01').GetName] [holding|E] or go on a [GetActivityType('activity_pilgrimage').GetName]."
 pam_sf_besieged_by_demons_modifier: "Besieged by Demons"
 pam_sf_besieged_by_demons_modifier_desc: "This character's mind is under demonic siege, raving, convulsing, and slipping further from reason with each passing day."
 pam_sf_grief_solace_modifier: "Consoled by a Spirit"
 pam_sf_grief_solace_modifier_desc: "This character has found quiet comfort after allegedly being visited by an apparition."
 pam_sf_grief_warning_modifier: "Warned by a Spirit"
 pam_sf_grief_warning_modifier_desc: "This character believes that they were warned by an apparition."
 pam_sf_peace_of_god_modifier: "Peace of God"
 pam_sf_peace_of_god_modifier_desc: "This character has sworn and enforced the Peace of God across the realm."
 pam_sf_immured_anchorite_modifier: "Immured Anchorite"
 pam_sf_immured_anchorite_modifier_desc: "This temple has an anchorite immured within its walls."
 pam_sf_voice_of_jesus_modifier: "Voice of God"
 pam_sf_voice_of_jesus_modifier_desc: "This character was addressed by a divine voice and rose transfigured, every faculty sharpened, as though touched by the hand of God."
 pam_sf_stroke_of_god_modifier: "Stroke of God"
 pam_sf_stroke_of_god_modifier_desc: "A sudden apoplexy has struck this character down, what the physicians name a 'stroke of God', a divine blow that floods the brain and leaves body and mind crippled in its wake."
 pam_sf_lingering_stench_modifier: "Lingering Stench"
 pam_sf_lingering_stench_modifier_desc: "Try as this character might, they cannot un-smell the pauper's feet they washed."
 pam_sf_site_of_miracle_county_modifier: "Site of a Miracle"
 pam_sf_site_of_miracle_county_modifier_desc: "This county is the site of a miracle, drawing pilgrims and bandits alike."
 pam_sf_consecrated_county_modifier: "Newly Consecrated"
 pam_sf_consecrated_county_modifier_desc: "This county has a newly consecrated church."
 pam_sf_flagellant_cults_county_modifier: "Flagellant Cults"
 pam_sf_flagellant_cults_county_modifier_desc: "Bands of penitents scourge themselves through this county's streets."
 pam_sf_relic_procession_county_modifier: "The Saint Came Forth"
 pam_sf_relic_procession_county_modifier_desc: "A saint's relic was borne through this county in solemn procession, and the people walk a little taller for it."
 pam_sf_blessed_bell_county_modifier: "A Christened Bell"
 pam_sf_blessed_bell_county_modifier_desc: "This county's church bell has been washed, anointed, and named. The people trust its voice to scatter storm and fiend alike."
 pam_sf_church_ale_county_modifier: "Church Ale"
 pam_sf_church_ale_county_modifier_desc: "This county's ruler drank the church ale with the parish, and the parish is still abuzz."
 pam_sf_safe_passage_modifier: "Safe Passage"
 pam_sf_safe_passage_modifier_desc: "This traveler has been granted an escort and safe passage after a rescue on the road."
 pam_sf_waylaid_road_modifier: "Waylaid on the Road"
 pam_sf_waylaid_road_modifier_desc: "This traveler's journey has turned perilous after an attack on the road."
 pam_sf_penance_lustful_modifier: "Suppressing Lust"
 pam_sf_penance_lustful_modifier_desc: "This character is doing penance for lust, mastering desire at the cost of fewer children."
 pam_sf_penance_chaste_modifier: "Casting Off Restraint"
 pam_sf_penance_chaste_modifier_desc: "This character is giving up a chastity their faith calls sinful, against their nature."
 pam_sf_penance_gluttonous_modifier: "Days of Fasting"
 pam_sf_penance_gluttonous_modifier_desc: "This character is fasting in penance for gluttony, wearing the body to feed the soul."
 pam_sf_penance_temperate_modifier: "Breaking the Long Fast"
 pam_sf_penance_temperate_modifier_desc: "This character is abandoning a temperance their faith holds sinful, looser of heart and of purse."
 pam_sf_penance_greedy_modifier: "Penitent Almsgiving"
 pam_sf_penance_greedy_modifier_desc: "This character is giving alms in penance for greed, lighter of coffer and of conscience."
 pam_sf_penance_generous_modifier: "Closing the Purse"
 pam_sf_penance_generous_modifier_desc: "This character is curbing a generosity their faith holds sinful, richer but resented."
 pam_sf_penance_lazy_modifier: "Penitent Labor"
 pam_sf_penance_lazy_modifier_desc: "This character is taking up wearying labor in penance for sloth."
 pam_sf_penance_diligent_modifier: "Enforced Rest"
 pam_sf_penance_diligent_modifier_desc: "This character is laying aside a diligence their faith holds sinful, calmer but less productive."
 pam_sf_penance_wrathful_modifier: "Restraining Wrath"
 pam_sf_penance_wrathful_modifier_desc: "This character is bridling their wrath in penance, a gentler hand and a duller blade."
 pam_sf_penance_calm_modifier: "Rousing the Spirit"
 pam_sf_penance_calm_modifier_desc: "This character is stirring a calm their faith holds sinful into fervor, fiercer but more strained."
 pam_sf_penance_patient_modifier: "Forcing the Pace"
 pam_sf_penance_patient_modifier_desc: "This character is casting off a patience their faith holds sinful, hurried and ill at ease."
 pam_sf_penance_impatient_modifier: "Cultivating Patience"
 pam_sf_penance_impatient_modifier_desc: "This character is schooling an impatient temper in penance, and the waiting grates."
 pam_sf_penance_arrogant_modifier: "Practicing Humility"
 pam_sf_penance_arrogant_modifier_desc: "This character is humbling a proud bearing in penance, and renown ebbs with it."
 pam_sf_penance_humble_modifier: "Assuming a Proud Bearing"
 pam_sf_penance_humble_modifier_desc: "This character is putting on a pride their faith demands over humility, renowned but thought vain."
 pam_sf_penance_deceitful_modifier: "A Vow of Candor"
 pam_sf_penance_deceitful_modifier_desc: "This character is keeping a vow of plain dealing in penance for deceit, their cunning blunted."
 pam_sf_penance_honest_modifier: "Learning to Dissemble"
 pam_sf_penance_honest_modifier_desc: "This character is learning the guile their faith holds over honesty, cannier but less trusted."
 pam_sf_penance_craven_modifier: "Confronting Fear"
 pam_sf_penance_craven_modifier_desc: "This character is standing their ground in penance for cowardice, and dreads every moment of it."
 pam_sf_penance_brave_modifier: "Tempering Valor"
 pam_sf_penance_brave_modifier_desc: "This character is curbing a valor their faith holds sinful into caution, the warrior dulled."
 pam_sf_penance_shy_modifier: "Forcing Boldness"
 pam_sf_penance_shy_modifier_desc: "This character is forcing a bold front in penance for a retiring nature, every gathering a trial."
 pam_sf_penance_gregarious_modifier: "Withdrawing into Silence"
 pam_sf_penance_gregarious_modifier_desc: "This character is withdrawing from sinful revelry into silence, fewer friends for it."
 pam_sf_penance_ambitious_modifier: "Curbing Ambition"
 pam_sf_penance_ambitious_modifier_desc: "This character is lowering ambitious eyes in penance, and renown with them."
 pam_sf_penance_content_modifier: "Kindling Want"
 pam_sf_penance_content_modifier_desc: "This character is stirring want against a contentment their faith holds sinful, restless and striving."
 pam_sf_penance_arbitrary_modifier: "Ruling with Justice"
 pam_sf_penance_arbitrary_modifier_desc: "This character is ruling with even justice in penance for an arbitrary hand, fairer but poorer."
 pam_sf_penance_just_modifier: "Ruling by Whim"
 pam_sf_penance_just_modifier_desc: "This character is ruling by the whim their faith demands over justice, richer but less loved."
 pam_sf_penance_cynical_modifier: "Rekindling Faith"
 pam_sf_penance_cynical_modifier_desc: "This character is rekindling belief in penance for cynicism, faith worn like an unfamiliar coat."
 pam_sf_penance_zealous_modifier: "Tempering Zeal"
 pam_sf_penance_zealous_modifier_desc: "This character is tempering a zeal their faith calls excessive, and the devout grow cooler in turn."
 pam_sf_penance_paranoid_modifier: "Learning to Trust"
 pam_sf_penance_paranoid_modifier_desc: "This character is learning to trust in penance for suspicion, doors opened and guard lowered."
 pam_sf_penance_trusting_modifier: "Guarding the Heart"
 pam_sf_penance_trusting_modifier_desc: "This character is guarding a heart their faith holds too trusting, warier but thought cold."
 pam_sf_penance_compassionate_modifier: "Stilling Mercy"
 pam_sf_penance_compassionate_modifier_desc: "This character is suppressing a mercy their faith calls sinful, and wearing a sterner face for it."
 pam_sf_penance_callous_modifier: "Cultivating Mercy"
 pam_sf_penance_callous_modifier_desc: "This character is cultivating mercy in penance for a callous heart, a softer hand and the dread they traded on fading."
 pam_sf_penance_sadistic_modifier: "Renouncing Cruelty"
 pam_sf_penance_sadistic_modifier_desc: "This character is renouncing cruelty in penance, the terror it bought fading."
 pam_sf_penance_stubborn_modifier: "Bending the Will"
 pam_sf_penance_stubborn_modifier_desc: "This character is bending a stubborn will to correction in penance, yielding where they would not."
 pam_sf_penance_fickle_modifier: "Steadying the Soul"
 pam_sf_penance_fickle_modifier_desc: "This character is holding a steady course in penance for a fickle soul, and it chafes."
 pam_sf_penance_eccentric_modifier: "Embracing Convention"
 pam_sf_penance_eccentric_modifier_desc: "This character is setting aside stranger thoughts in penance for eccentricity."
 pam_sf_penance_vengeful_modifier: "Practicing Forgiveness"
 pam_sf_penance_vengeful_modifier_desc: "This character is loosing old grudges in penance for vengefulness, gentler with captives but slower to strike back."
 pam_sf_penance_forgiving_modifier: "Nursing the Grievance"
 pam_sf_penance_forgiving_modifier_desc: "This character is nursing a grievance their faith demands over forgiveness, colder and more feared."
 pam_mystical_birthright_spiritual_leader_modifier: "Auspicious Birthright"
 pam_mystical_birthright_spiritual_leader_modifier_desc: "A congenital sign present from birth has shaped this character's spiritual upbringing."
 pam_personal_sacrifice_of_wealth_county_modifier: "Devotional Investment"
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "A ruler's devotional offering is fostering this county's growth."
 pam_sf_grinding_modifier: "Soulless Work"
 pam_sf_grinding_modifier_desc: "This character is grinding away at their work, and the soul suffers for it."
