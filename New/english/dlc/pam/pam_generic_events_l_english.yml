l_english:
 pam_generic_events.0001.t: "Scholar of the Faith"
 pam_generic_events.0001.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] seems immersed in lecture when I enter the [ROOT.Char.GetFaith.HouseOfWorship].\n\n"Ah, [ROOT.Char.Custom('FormOfAddressForLiege')]," [chaplain.GetSheHe] finally seems to notice me. "Is your interest for the word of [ROOT.Char.GetFaith.HighGodName] growing? I can teach you the ways.""
 pam_generic_events.0001.a: "A worthwhile effort."
 pam_generic_events.0001.b: "Ruling already requires all my attention."

 pam_generic_events.0002.t: "Am I Good?"
 pam_generic_events.0002.desc.intro: "My [ROOT.Char.Custom2( 'RelationToMeShort', doubting_child )], [doubting_child.GetFirstName], slips into my chamber long after the candles should have been put out. Tears streak [doubting_child.GetHerHis] cheeks.\n\n"Am I a good person?" [doubting_child.GetSheHe] whispers. "If what I am is a sin..."
 pam_generic_events.0002.desc.sin: "so #EMP disgustingly#! [sinful_trait.GetName( ROOT.Char )|l]..."
 pam_generic_events.0002.desc.sp: "if my soul feels so empty..."
 pam_generic_events.0002.desc.outro: "how can [ROOT.Char.GetFaith.HighGodName] still want me?""
 pam_generic_events.0002.a: "Cast off what shames you."
 pam_generic_events.0002.b: "You are already loved."
 pam_generic_events.0002.c: "Then we will pray."
 friend_comforted_child_doubts: "[CHARACTER.GetShortUIName|U] comforted [TARGET_CHARACTER.GetShortUIName] when [TARGET_CHARACTER.GetSheHe] doubted [TARGET_CHARACTER.GetHerHis] own goodness."
 friend_comforted_child_doubts_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] comforted [CHARACTER.GetShortUIName] when [CHARACTER.GetSheHe] doubted [CHARACTER.GetHerHis] own goodness."
 
 pam_generic_events.0003.t: "What You Are"
 pam_generic_events.0003.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', worried_spouse )], [worried_spouse.GetFirstName], waits among the hedges after dusk. [worried_spouse.GetHerHis|U] hands twist in [worried_spouse.GetHerHis] lap.\n\n"You are so #EMP [sinful_trait.GetName( ROOT.Char )|l]#!," [worried_spouse.GetSheHe] says, voice low. "It shames us both before [ROOT.Char.GetFaith.HighGodName]. How can you be so careless about your faith? Don't you see what this is doing to you?""
 pam_generic_events.0003.a: "For you? I will make amends."
 pam_generic_events.0003.b: "This is how [ROOT.Char.GetFaith.HighGodName] made me."
 pam_generic_events.0003.c: "You worry too much."
 lover_promised_to_change_ways: "[CHARACTER.GetShortUIName|U] promised [TARGET_CHARACTER.GetShortUIName] to mend [CHARACTER.GetHerHis] ways and go on pilgrimage."
 lover_promised_to_change_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] promised [CHARACTER.GetShortUIName] to mend [TARGET_CHARACTER.GetHerHis] ways and go on pilgrimage."
 rival_embraced_sinful_ways: "[CHARACTER.GetShortUIName|U] refused to repent when [TARGET_CHARACTER.GetShortUIName] pleaded with [CHARACTER.GetHerHim] to change."
 rival_embraced_sinful_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] refused to repent when [CHARACTER.GetShortUIName] pleaded with [TARGET_CHARACTER.GetHerHim] to change."
 
 pam_generic_events.0004.t: "A Light in the Dark"
 pam_generic_events.0004.desc: "Candles gutter in the empty [ROOT.Char.GetFaith.HouseOfWorship] for my [ROOT.Char.Custom2( 'RelationToMeShort', deceased )], [deceased.GetFirstName], who [deceased.GetDeathReasonHideKiller].\n\nMy [ROOT.Char.Custom2( 'RelationToMeShort', comforter )], [comforter.GetFirstName], is so near that [comforter.GetHerHis] sleeve brushes mine. "Grief is a road," [comforter.GetSheHe] says softly. "Walk it, and it may yet bring you to [ROOT.Char.GetFaith.PositiveAfterLife].""
 pam_generic_events.0004.a: "It was me! #EMP I#! did it!"
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]"
 pam_john_14_2_english: "#EMP In my Father's house there are many dwelling places.#!"
 JOHN_14_2_GLOSS: "#weak John 14:2, NRSVUE#!"
 pam_generic_events.0004.c: "Then we will pray."
 pam_generic_events.0004.d: "Come. We will drink to their memory."

 pam_generic_events.0005.t: "A Loyal Fist"
 pam_generic_events.0005.desc: ""How #EMP dare#! [clerical_holder.GetSheHe]!?"\n\nMy [ROOT.Char.Custom2( 'RelationToMeShort', loyal_vassal )], [loyal_vassal.GetTitledFirstName], strides into the council chamber with a blade already half-drawn.\n\n"How dare [clerical_holder.GetTitledFirstName] cast you out?" [loyal_vassal.GetSheHe|U] spits on the ground. "I have men in the [clerical_region.GetName]. Give the word, and we will pay [clerical_holder.GetHerHim] a visit.""
 pam_generic_events.0005.a: "Very well, go."
 pam_generic_events.0005.a.tt: "[loyal_vassal.GetTitledFirstName] will travel to [clerical_holder.GetCapitalLocation.GetName]. Upon [loyal_vassal.GetHerHis] return you will gain [dread|E] and [GetVassalStance('belligerent').GetTextIcon][GetVassalStance('belligerent').GetName] [vassal|E] [opinion|E]."
 pam_generic_events.0005.b: "There are more clever ways."
 pam_generic_events.0005.b.tt: "You gain a #P massive#! bonus to [GetScheme('murder').GetTypeName] [schemes|E] targeting [clerical_holder.GetShortUIName] for #V 15 years#!"
 pam_generic_events.0005.c: "I have been taught to turn the other cheek."
 pam_generic_events.0005.c.tt: "The #V $declaration_of_repentance_interaction$#! [character_interaction|E] has a #P +20#! increased acceptance for #V 10 years#!"
 pam_generic_events.0005.c.tt2: "The #V $lift_excommunication_interaction$#! [character_interaction|E] is more likely to be used on you during the next #V 10 years#!"
 pam_turned_the_other_cheek_accept_reason: "Turned the other cheek"
 PAM_GENERIC_0005_MURDER_BONUS: "A loyal vassal has men in this target's domain: $VALUE|+0=$"

 pam_generic_events.0007.opening: "To [ROOT.Char.GetTitledFirstName]"
 pam_generic_events.0007.desc: "The deed is done. I found [clerical_holder.GetTitledFirstName] and left [clerical_holder.GetHerHim] bleeding."
 pam_generic_events.0007.a: "Good."

 pam_generic_events.0008.t: "A Voice in the Dark"
 pam_generic_events.0008.desc: "Dinner still sits heavy in my belly as I stumble toward my bedchamber. My vision feels blurry, and the corridor tilts under my feet.\n\nThen... a voice. "Such a [virtuous_trait.GetName( ROOT.Char )|l] [ROOT.Char.GetTitleAsNameNoTooltip|l]..." it says. "How virtuous. You please your lord."\n\nIs this truly [ROOT.Char.GetFaith.HighGodName]? Or only the sickness I feel?"
 pam_generic_events.0008.a: "Yes. #EMP Yes!!#!"
 pam_generic_events.0008.b: "It must be Him!"
 pam_generic_events.0008.c: "The old powers are stirring..."
 pam_generic_events.0008.d: "Sometimes food has this effect."
 pam_generic_events.0008.e: "Perhaps... something I ate?"
 pam_generic_events.0008.f: "Better to say a prayer just in case."

 pam_generic_events.0009.t: "The Fires of Hell"
 pam_generic_events.0009.desc: "I wake soaked through, heart hammering against my ribs.\n\nIn my dream I burned. Flesh came off my bones like butter. "[sinful_trait.GetNameNoTooltip( ROOT.Char )|U]! [sinful_trait.GetNameNoTooltip( ROOT.Char )|U]!" A horde of demons cried at me.\n\nThe fires of [ROOT.Char.GetFaith.NegativeAfterLife] were claiming me, and every scream was my own."
 pam_generic_events.0009.a: "The scourge knows the way."
 pam_generic_events.0009.b: "Flesh must answer for flesh."
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_james_4_8_english: "#EMP Cleanse your hands, you sinners, and purify your hearts.#!"
 JAMES_4_8_GLOSS: "#weak James 4:8, NRSVUE#!"
 pam_generic_events.0009.d: "Talking to [comforting_courtier.GetTitledFirstName] always helps."
 pam_generic_events.0009.e: "A dream is just a dream."
 friend_comforted_hell_nightmare_reason: "[CHARACTER.GetShortUIName|U] sought comfort from [TARGET_CHARACTER.GetShortUIName] after a nightmare of damnation."
 friend_comforted_hell_nightmare_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] sought comfort from [CHARACTER.GetShortUIName] after a nightmare of damnation."

 pam_generic_events.0010.t: "Blessed Game"
 pam_generic_events.0010.desc: "The [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] open around us. The thundering sound of dozens of galloping horses soon follows, [hunting_ruler.GetName] proudly leading them.\n\n#EMP "Haaaaaaaalt!"#! [hunting_ruler.GetSheHe|U] raises a hand in greeting, bringing [hunting_ruler.GetHerHis] retinue to a stop. "Praise [ROOT.Char.GetFaith.HighGodName] for this weather!" [hunting_ruler.GetSheHe|U] calls, "and for the game that we hunt!""
 pam_generic_events.0010.a: "A tip, if you will hear it..."
 pam_generic_events.0010.b: "Your eye is as sharp as your spear."
 pam_generic_events.0010.b.success: "Your praise lands well"
 pam_generic_events.0010.b.failure: "Your praise falls flat"
 pam_generic_events.0010.b.toast.success: "[hunting_ruler.GetSheHe|U] takes your praise to heart"
 pam_generic_events.0010.b.toast.failure: "[hunting_ruler.GetSheHe|U] bristles at your empty flattery"
 pam_generic_events.0010.b.tt: "[hunting_ruler.GetTitledFirstName] is more likely to accept a #high $negotiate_alliance_interaction$#! [character_interaction|E] for #V 10 years#!"
 pam_generic_events.0010.c: "Praised be!"
 pam_generic_events.0010.d: "Lend me a few of your riders for the road."
 friend_praised_hunting_reason: "[CHARACTER.GetShortUIName|U] praised [TARGET_CHARACTER.GetShortUINamePossessive] skill at the hunt."
 friend_praised_hunting_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] praised [CHARACTER.GetShortUINamePossessive] skill at the hunt."
 pam_praised_hunting_alliance_accept_reason: "Praised my hunting"

 pam_generic_events.0011.t: "A Spot of Sin"
 pam_generic_events.0011.desc: "[sinful_courtier.GetTitledFirstNamePossessive] sinful acts have gone on for too long. My court is bustling with rumors of [sinful_courtier.GetHerHis] [sinful_trait.GetName( ROOT.Char )|l] behavior, and I have seen servants draw back whenever [sinful_courtier.GetSheHe] passes.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [sinful_courtier.GetSheHe|U] exclaims when I enter the study, [sinful_courtier.Custom('quirk_neg_pp')]. "Such an honor to be in your presence.""
 pam_generic_events.0011.a: "You will abandon your [sinful_trait.GetNameNoTooltip( ROOT.Char )|l] ways."
 pam_generic_events.0011.b: "Listen to the lessons [ROOT.Char.GetFaith.HighGodName] teaches us."
 pam_generic_events.0011.b.success: "The lesson takes hold"
 pam_generic_events.0011.b.failure: "They will not be taught"
 pam_generic_events.0011.b.toast.success: "[sinful_courtier.GetSheHe|U] grasps the weight of [sinful_courtier.GetHerHis] sin"
 pam_generic_events.0011.b.toast.failure: "[sinful_courtier.GetSheHe|U] shrugs off your teaching"
 pam_generic_events.0011.c: "This is not good for you..."
 pam_generic_events.0011.c.success: "Gentle counsel softens them"
 pam_generic_events.0011.c.failure: "Your softness earns only scorn"
 pam_generic_events.0011.c.toast.success: "[sinful_courtier.GetSheHe|U] is moved by your care"
 pam_generic_events.0011.c.toast.failure: "[sinful_courtier.GetSheHe|U] takes your kindness for weakness"
 pam_generic_events.0011.d: "Perhaps it is not so grave."
