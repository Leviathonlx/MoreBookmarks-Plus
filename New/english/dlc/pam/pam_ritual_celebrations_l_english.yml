l_english:
 doctrine_parameter_tenet_ritual_celebrations_praise_the_gods: "Unlocks the $praise_the_gods_intent$ [intent|E] for [GetActivityType('activity_feast').GetName] [activities|E]"

 praise_the_gods_intent: "Honor the Divine"
 praise_the_gods_intent_desc: "Turn communal celebration into worship, seeking religious knowledge, spiritual insight, and fellowship throughout the feast."
 praise_the_gods_intent_not_valid_desc: "You no longer personally follow the [GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )] [tenet|E]"

 pam_ritual_celebrations_events.0001.t: "A Feast of Revelation"
 pam_ritual_celebrations_events.0001.desc: "As platters empty and cups refill, one toast to [ROOT.Char.GetFaith.WealthGodName] inspires another. Soon the hall rings with prayers, sacred stories, and spirited theological debate.\n\nAmid the warmth of the celebration, understanding seems almost within reach — whether through spirited fellowship or quiet prayer."
 pam_ritual_celebrations_events.0001.a: "Let revelry become worship."
 pam_ritual_celebrations_events.0001.b: "I will withdraw and pray in solemn reflection."

 pam_praise_the_gods_revelation_outcome_tt: "A sacred truth emerges from the clamor of celebration"
 pam_praise_the_gods_belief_outcome_tt: "A half-remembered teaching opens a new path of belief"
 pam_praise_the_gods_legend_outcome_tt: "Tonight's sacred stories take root as a legend for generations to repeat"
 pam_praise_the_gods_clergy_outcome_tt: "Shared praise draws you closer to one of the [clergy|E] at your table"
 pam_praise_the_gods_scholar_outcome_tt: "The evening's debate awakens an enduring hunger for sacred learning"
 pam_praise_the_gods_scholar_xp_outcome_tt: "Every prayer and parable sharpens your command of sacred learning"

 pam_praise_the_gods_revelation_toast: "Revelation Amid the Revelry"
 pam_praise_the_gods_belief_toast: "Theological Insight"
 pam_praise_the_gods_legend_toast: "A Sacred Story Takes Root"
 pam_praise_the_gods_clergy_toast: "Bonded in Praise of [ROOT.Char.GetFaith.WealthGodName]"
 pam_praise_the_gods_scholar_toast: "Wisdom Found at the Feast"
 pam_praise_the_gods_scholar_xp_toast: "Scholarship Deepened"

 pam_praise_the_gods_clergy_bond_opinion: "Bonded in Divine Celebration"

 pam_praise_the_gods_log_title: "Honored the Divine"
 pam_praise_the_gods_log: "[CHARACTER.GetShortUIName|U] sought divine insight through the feast's prayers, stories, and debates"
 pam_praise_the_gods_quiet_log_title: "Prayed in Quiet Devotion"
 pam_praise_the_gods_quiet_log: "[CHARACTER.GetShortUIName|U] withdrew from the revelry to seek divine peace in quiet prayer"
