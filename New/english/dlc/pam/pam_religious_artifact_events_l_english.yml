l_english:
 pam_religious_artifact_events.0001.t: "A Holy Endeavor"
 pam_religious_artifact_events.0001.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] enters the chamber with a smile. "It came to me in a dream!"\n\n"A beautiful piece of art, carefully molded and made of the finest gems, dedicated to [ROOT.Char.GetFaith.HighGodName|U] and [ROOT.Char.GetFaith.HighGodName|U] only. Enrich me with the necessary means and I will return with the most beautiful artifact a [ROOT.Char.GetTitleAsNameNoTooltip] could imagine!"\n\nThis is a bold promise, but how often is one blessed with a vision from [ROOT.Char.GetFaith.HighGodName|U]?"
 pam_religious_artifact_events.0001.aa: "It sounds like you dream of loosening my purse strings!"
 pam_religious_artifact_events.0001.a: "My piety must know no limits!"
 pam_religious_artifact_events.0001.b: "[ROOT.Char.GetFaith.HighGodName|U] does not need trinkets."
 
 pam_religious_artifact_events.0002.desc: "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] has summoned me to the castle chapel. The reason becomes clear immediately when [inspiration_owner.GetSheHe] proudly presents me with my most anticipated commission.\n\n[newly_created_artifact.GetDesc]"
 pam_religious_artifact_events.0002.a: "Great job, [inspiration_owner.GetFirstNameNoTooltip]!"
 create_artifact_religious_artifact_tooltip: "[inspiration_owner.GetShortUIName] produced [newly_created_artifact.GetName] of [SCOPE.Custom('ArtifactQuality')] craftsmanship"