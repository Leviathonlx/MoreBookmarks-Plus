 ecumenical_council_events.0107.t: "Their First Council"
 ecumenical_council_events.0107.desc: "A group of younger clerics chatter, clearly excited at what is, for many of them, their first council.\n\n"A movement is rising here: can you feel the touch of [lead_innovator.GetFaith.HouseholdGodName]? Let us make a mark upon the Church, with a boldness that has been long forgotten!" [lead_innovator.GetTitledFirstName] says.\n\n"Contemptible fools! We must defer to the Church Fathers, and reject these disgusting innovations," insists [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0107.support: "A morning for the faith!"
 ecumenical_council_events.0107.support_duel: "Rebut this conservative cowardice."
 ecumenical_council_events.0107.support_duel.success: "Their eyes grow bright with promise"
 ecumenical_council_events.0107.support_duel.success_halved: "A few pledge support"
 ecumenical_council_events.0107.support_duel.failure: "They remain scornful"
 ecumenical_council_events.0107.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip] speaks true."
 ecumenical_council_events.0107.oppose_duel: "Decry the dangers of boldness!"
 ecumenical_council_events.0107.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0107.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0107.oppose_duel.failure: "They scorn your cowardice"
 ecumenical_council_events.0107.conservatives_custom: "Young [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0107.conservatives_custom_capped: "Young [ec_conservatives|E] (#V [feature_conservatives_free_max]#!)"
