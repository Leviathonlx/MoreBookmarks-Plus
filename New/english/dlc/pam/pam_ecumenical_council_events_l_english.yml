# ecumenical_council_events.0111-0129 - Themed sway the group debate-phase pulse events
 ecumenical_council_events.0111.t: "The Grumbling Gray Hairs"
 ecumenical_council_events.0111.desc: "The gray-headed elders mill about bickering.\n\n"We have seen councils come and go, errors made at all of them. Rather than rectify those perversions, it would seem we hope to enact more!" [lead_conservative.GetTitledFirstName] grouses.\n\n"You old [lead_conservative.Custom('RegionalFarmAnimal')]! You said much the same last time, and you'll make the same noise until you're in the grave!" [lead_innovator.GetTitledFirstName] barks back."
 ecumenical_council_events.0111.support: "This change will rectify old errors!"
 ecumenical_council_events.0111.support_duel: "Reiterate the arguments in favor for old ears."
 ecumenical_council_events.0111.support_duel.success: "They come to grumbling acceptance"
 ecumenical_council_events.0111.support_duel.success_halved: "A few accept this rectification"
 ecumenical_council_events.0111.support_duel.failure: "They still cry "Perversion!""
 ecumenical_council_events.0111.oppose: "Back [lead_conservative.GetTitledFirstNameNoTooltip]: no more follies."
 ecumenical_council_events.0111.oppose_duel: "Beat the old dreamers into intellectual dust!"
 ecumenical_council_events.0111.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0111.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0111.oppose_duel.failure: "The innovators remain undirtied"
 ecumenical_council_events.0111.conservatives_custom: "Elderly [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0111.conservatives_custom_capped: "Elderly [ec_conservatives|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0111.conservatives_custom_halved: "Elderly [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
