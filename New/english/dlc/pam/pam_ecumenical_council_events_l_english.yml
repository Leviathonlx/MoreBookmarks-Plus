 ecumenical_council_events.0111.innovators_custom_halved: "Elderly [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0112.t: "Sickness in the Realm"
 ecumenical_council_events.0112.desc: ""The dead pile high in my lands! At first, I wondered at the cause for [lead_conservative.GetFaith.HighGodNamePossessive] punishment, but now — it is all too clear! Mankind suffers as our world rejects this mutation of canon law," [lead_conservative.GetTitledFirstName] says.\n\n"Are you so deluded by your hate of this council that you cannot see your salvation?" [lead_innovator.GetTitledFirstName] retorts. "Our reform shall appease the wrath of [lead_innovator.GetFaith.HighGodName]!""
 ecumenical_council_events.0112.support: "Yes. [ROOT.Char.GetFaith.HighGodName|U] demands that the Church change."
 ecumenical_council_events.0112.support_duel: "Using the stalwart's logic against [lead_conservative.GetHerHim] might just work!"
 ecumenical_council_events.0112.support_duel.success: "Many see an end to divine wrath"
 ecumenical_council_events.0112.support_duel.success_halved: "A few will try to appease [lead_innovator.GetFaith.HighGodName]"
 ecumenical_council_events.0112.support_duel.failure: "Destroying canon law is too grave a risk"
 ecumenical_council_events.0112.oppose: "Or anger [ROOT.Char.GetFaith.HighGodName] even more!"
 ecumenical_council_events.0112.oppose_duel: "Warn that this would destroy canon law."
 ecumenical_council_events.0112.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0112.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0112.oppose_duel.failure: "They still have hope in change"
 ecumenical_council_events.0112.conservatives_custom: "[ec_conservatives|E] facing an [epidemic|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0112.conservatives_custom_capped: "[ec_conservatives|E] facing an [epidemic|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0112.conservatives_custom_halved: "[ec_conservatives|E] facing an [epidemic|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0112.innovators_custom: "[ec_innovators|E] facing an [epidemic|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0112.innovators_custom_halved: "[ec_innovators|E] facing an [epidemic|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0113.t: "Faith Under Arms"
 ecumenical_council_events.0113.desc: "Those whose realms suffer under the onslaught of wicked faiths draw aside from the floor in shared sympathy.\n\n"While enemies of the faith burn my fields," [lead_conservative.GetTitledFirstName] declares, "shall we bicker over foolish dreams? As though no swords pierce our hearts?"\n\n"A fractured creed is a broken shield," [lead_innovator.GetTitledFirstName] answers. "Settle the canon, and we fight as one, renewed!""
 ecumenical_council_events.0113.support: "It would be good to taste of hope again."
 ecumenical_council_events.0113.support_duel: "Let us mend the Church, our shield!"
 ecumenical_council_events.0113.support_duel.success: "They accept, and we shall fight as one"
 ecumenical_council_events.0113.support_duel.success_halved: "A few are swayed to reform"
 ecumenical_council_events.0113.support_duel.failure: "They cannot remember hope"
 ecumenical_council_events.0113.oppose: "Are there not more pressing matters than this foolishness?"
 ecumenical_council_events.0113.oppose_duel: "Warn them against this recklessness."
 ecumenical_council_events.0113.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0113.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0113.oppose_duel.failure: "They vainly hope still"
 ecumenical_council_events.0113.conservatives_custom: "[besieged|E] [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0113.conservatives_custom_capped: "[besieged|E] [ec_conservatives|E] (#V [feature_conservatives_free_max]#!)"
