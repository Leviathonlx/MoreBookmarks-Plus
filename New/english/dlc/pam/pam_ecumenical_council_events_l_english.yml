 ecumenical_council_debate_outcome_log: "The council ruled on a matter of faith:"
 ecumenical_council_proposal_set_log_title: "The Council's Proposal"
 ecumenical_council_proposal_set_log: "A proposal was put before the council for debate:[CHARACTER.GetInvolvedActivity.Custom('GetEcumenicalCouncilProposalSetLog')]"
 msg_ecumenical_council_ruling_title: "An Ecumenical Council Has Ruled"
 msg_ecumenical_council_ruling_desc: "[LEFT_CHARACTER.GetTitledFirstName] gathered an [ecumenical_council|E], and its rulings now bind all [GetPlayer.GetFaith.GetName]: the present and the absent alike"

 # Debate vote resolution: guests
 ecumenical_council_events.0081.t: "The Council Votes"
 ecumenical_council_events.0081.desc.innovator_passed: "We who argued for change have prevailed. Our reasoning swayed enough of the council, and the new way is adopted."
 ecumenical_council_events.0081.desc.innovator_failed: "Though we pressed for change, the count fell short against us. The old ways endure, and our arguments are set aside for now."
 ecumenical_council_events.0081.desc.conservative_passed: "Despite our defense of tradition, the reformers carried the vote. The change is adopted, despite our misgivings."
 ecumenical_council_events.0081.desc.conservative_failed: "We who stood for tradition have held the line. The proposal is rejected, and our rite preserved."
 ecumenical_council_events.0081.desc.neutral: "The council renders its verdict, and the matter is settled."
 ecumenical_council_events.0081.a: "So it is decided."

 # The court chaplain's report of a council their liege did not attend
 ecumenical_council_events.0082.opening: "To [ROOT.GetCharacter.GetTitledFirstName],"
 ecumenical_council_events.0082.desc: "The clergy have risen, and formed a resolution that now binds us all."
 ecumenical_council_events.0082.desc.unchanged: "The clergy have risen, and their long argument altered not a jot. We remain as we were."
 ecumenical_council_events.0082.a: "The Church moves without me."
 ecumenical_council_events.0082.a.tt.tenet_1: "[ec_letter_tenet_1.GetName( GetPlayer.GetRite )] is now [ec_council.Custom('GetEcumenicalCouncilTenet1Proposal')]"
 ecumenical_council_events.0082.a.tt.tenet_2: "[ec_letter_tenet_2.GetName( GetPlayer.GetRite )] is now [ec_council.Custom('GetEcumenicalCouncilTenet2Proposal')]"
 ecumenical_council_events.0082.a.tt.doctrine_1: "[GetPlayer.GetFaith.GetName] now holds [ec_letter_doctrine_1.GetDescriptiveName( GetPlayer.GetFaith )]"

