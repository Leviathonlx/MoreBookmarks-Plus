 ecumenical_council_events.0114.t: "Armed With Faith and Steel"
 ecumenical_council_events.0114.desc.intro: "As is the wont of men who know war, the old warriors among us find themselves whiling away the hours together.\n\n"By [lead_innovator.GetFaith.HighGodName], it will be good to have these changes agreed upon. The faithful can unite under one banner once again!" posits [lead_innovator.GetTitledFirstName]\n\n"
 ecumenical_council_events.0114.desc.conservative: ""We have cut down many a [ec_hostile_faith.GetAdherentName] as we are," [lead_conservative.GetTitledFirstName] says. "Does [lead_conservative.GetFaith.WarGodName] not already bless our banners?""
 ecumenical_council_events.0114.desc.conservative_generic: ""We have cut down many a foe as we are," [lead_conservative.GetTitledFirstName] says. "Does [lead_conservative.GetFaith.WarGodName] not already bless our banners?""
 ecumenical_council_events.0114.support: "Let us hoist a new, blessed banner high."
 ecumenical_council_events.0114.support_duel: "Recruit the fearful to [ROOT.Char.GetFaith.HighGodNamePossessive] blessed banner!"
 ecumenical_council_events.0114.support_duel.success: "A soldier must serve"
 ecumenical_council_events.0114.support_duel.success_halved: "A few are recruited"
 ecumenical_council_events.0114.support_duel.failure: "They hold their line stubbornly"
 ecumenical_council_events.0114.oppose: "Back [lead_conservative.GetTitledFirstNameNoTooltip], defender of orthodoxy."
 ecumenical_council_events.0114.oppose_duel: "A duel of words, it is!"
 ecumenical_council_events.0114.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cohort yields"
 ecumenical_council_events.0114.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] cohort yield"
 ecumenical_council_events.0114.oppose_duel.failure: "They will charge forth in vain"
 ecumenical_council_events.0114.conservatives_custom: "Warlike [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0114.conservatives_custom_capped: "Warlike [ec_conservatives|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0114.conservatives_custom_halved: "Warlike [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0114.innovators_custom: "Warlike [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0114.innovators_custom_halved: "Warlike [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0115.t: "Whispers and Leverage"
 ecumenical_council_events.0115.desc: "Though it pains me to admit, not all clerics earned their vestments nobly. Even among this august body, I must be keenly aware of those who prefer the shadows to the pure light of scripture. It doesn't take long to stumble on whispers in the dark.\n\n"Every soul here is hungry for... something. We must wonder, the wise, who will pay hunger's price," drips [lead_conservative.GetTitledFirstName] into willing ears. "Brazen ideology, impassioned reform... nothing costs dearer..."\n\nAnother viper, [lead_innovator.GetTitledFirstName], rises to challenge [lead_conservative.GetHerHim]: "You think it will be #EMP you#! paying the price of chaos? In the coming time of disorder, when we will be free to play as we wish...?""
 ecumenical_council_events.0115.support: "Disruption has its uses."
 ecumenical_council_events.0115.support_duel: "Speak of opportunity to those clever enough to listen."
 ecumenical_council_events.0115.support_duel.success: "Their greed compels them to you"
 ecumenical_council_events.0115.support_duel.success_halved: "A few will seek disruption"
 ecumenical_council_events.0115.support_duel.failure: "They prove blind to opportunity"
 ecumenical_council_events.0115.oppose: "A small meal, and then we [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] forever starve."
 ecumenical_council_events.0115.oppose_duel: "Seek the truth in scripture, or you are lost."
 ecumenical_council_events.0115.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0115.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0115.oppose_duel.failure: "They are lost to dark desires"
 ecumenical_council_events.0115.conservatives_custom: "[ec_conservatives|E] of high [intrigue|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0115.conservatives_custom_capped: "[ec_conservatives|E] of high [intrigue|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0115.conservatives_custom_halved: "[ec_conservatives|E] of high [intrigue|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0115.innovators_custom: "[ec_innovators|E] of high [intrigue|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0115.innovators_custom_halved: "[ec_innovators|E] of high [intrigue|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0116.t: "Who Pays for This?"
 ecumenical_council_events.0116.desc: "I find the stewards of several sees arguing figures like moneylenders.\n\n"My diocese cannot afford another upheaval," [lead_conservative.GetTitledFirstName] says. "New books for each parish, riders to each [lead_conservative.GetFaith.HouseOfWorship]. If this passes, the tithe will not stretch."\n\n"And if it fails?" [lead_innovator.GetTitledFirstName] asks. "We have quarreled for years, and that silver is lost however we vote. Let us at least fund a law the flock will keep.""
 ecumenical_council_events.0116.support: "Yes, why mourn silver that is already spent?"
 ecumenical_council_events.0116.support_duel: "Argue thusly: support is investment!"
 ecumenical_council_events.0116.support_duel.success: "They are tantalized into reform"
 ecumenical_council_events.0116.support_duel.success_halved: "A few accept this formulation"
 ecumenical_council_events.0116.support_duel.failure: "They still moan about expenses"
 ecumenical_council_events.0116.oppose: "My diocese cannot afford this upheaval."
 ecumenical_council_events.0116.oppose_duel: ""By [ROOT.Char.GetFaith.HighGodName]! It's fiscally irresponsible!""
 ecumenical_council_events.0116.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle recants"
 ecumenical_council_events.0116.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle recant"
 ecumenical_council_events.0116.oppose_duel.failure: "They stand by their investment"
 ecumenical_council_events.0116.conservatives_custom: "[ec_conservatives|E] of high [stewardship|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0116.conservatives_custom_capped: "[ec_conservatives|E] of high [stewardship|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0116.conservatives_custom_halved: "[ec_conservatives|E] of high [stewardship|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0116.innovators_custom: "[ec_innovators|E] of high [stewardship|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0116.innovators_custom_halved: "[ec_innovators|E] of high [stewardship|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0117.t: "Too Many Amendments"
 ecumenical_council_events.0117.desc: "I catch two practiced negotiators drafting in the margin of the decree, striking and restoring a clause as if it were a treaty.\n\n"Keep it as it is! We risk half of them leaving before we even address the thornier issues," [lead_conservative.GetTitledFirstName] says. "I have spent months keeping these people at one table. Soften it, or we lose the council itself."\n\n"And leave this mess no one will enforce after the council is finished?" [lead_innovator.GetTitledFirstName] answers."
 ecumenical_council_events.0117.support: "We must be compelling. We must be clear."
 ecumenical_council_events.0117.support_duel: "Better a firm decree than quiet, no?"
 ecumenical_council_events.0117.support_duel.success: "They accept a muddle will not be enforced"
 ecumenical_council_events.0117.support_duel.success_halved: "A few accept a muddle will not be enforced"
 ecumenical_council_events.0117.support_duel.failure: "They still fear alienation"
 ecumenical_council_events.0117.oppose: "We cannot risk losing the council!"
 ecumenical_council_events.0117.oppose_duel: "This is crude, this cannot be passed!"
 ecumenical_council_events.0117.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0117.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0117.oppose_duel.failure: "They keep to their message"
 ecumenical_council_events.0117.conservatives_custom: "[ec_conservatives|E] of high [diplomacy|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0117.conservatives_custom_capped: "[ec_conservatives|E] of high [diplomacy|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0117.conservatives_custom_halved: "[ec_conservatives|E] of high [diplomacy|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0117.innovators_custom: "[ec_innovators|E] of high [diplomacy|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0117.innovators_custom_halved: "[ec_innovators|E] of high [diplomacy|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0118.t: "Traditions of a Distant See"
 ecumenical_council_events.0118.desc: "[lead_conservative.GetTitledFirstName], a prominent council member of [lead_conservative.GetCulture.GetNameNoTooltip] origin, stands with a group of other clerics who have traveled far to uphold the traditions of the Church.\n\n"The [lead_conservative.GetFaith.GetAdjective] world is as vast as the love of [lead_conservative.GetFaith.HighGodName]," [lead_conservative.GetSheHe] says. "It is our hope this pilgrimage would not be made for the sake of witnessing [lead_innovator.GetTitledFirstName] preach the undoing of the work of the Church fathers.""
 ecumenical_council_events.0118.support: "The hardest pilgrimages yield the highest revelations."
 ecumenical_council_events.0118.support_duel: "Assure them of [lead_innovator.GetFirstNamePossessiveNoTooltip] vision."
 ecumenical_council_events.0118.support_duel.success: "They accept the fathers' traditions are safe"
 ecumenical_council_events.0118.support_duel.success_halved: "A few accept the fathers' traditions are safe"
 ecumenical_council_events.0118.support_duel.failure: "They still fear [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] preaching"
 ecumenical_council_events.0118.oppose: ""Let us all honor your sacrifice.""
 ecumenical_council_events.0118.oppose_duel: ""I will preach against [lead_innovator.GetTitledFirstNameNoTooltip].""
 ecumenical_council_events.0118.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0118.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0118.oppose_duel.failure: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] disciples are unmoved"
 ecumenical_council_events.0118.conservatives_custom: "[ec_conservatives|E] who traveled from afar (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0118.conservatives_custom_capped: "[ec_conservatives|E] who traveled from afar (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0118.conservatives_custom_halved: "[ec_conservatives|E] who traveled from afar (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0118.innovators_custom: "[ec_innovators|E] preaching for the change (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0118.innovators_custom_halved: "[ec_innovators|E] preaching for the change (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0120.t: "Names in the Chronicle"
 ecumenical_council_events.0120.desc: "A few of the most renowned guests hang back from the floor, weighing how their reputations will fare once this is all written down.\n\n"My name can be found in every chronicle written of late. What need have I to be tied to a decree that may be ridiculed for eternity?" [lead_conservative.GetTitledFirstName] says.\n\n"Men recall who settled the quarrel, not who kept clean hands. And I will be so remembered," [lead_innovator.GetTitledFirstName] answers."
 ecumenical_council_events.0120.support: ""Are we not the leaders of the Church?""
 ecumenical_council_events.0120.support_duel: ""You shall not be alone!""
 ecumenical_council_events.0120.support_duel.success: "The doubters give themselves over to history"
 ecumenical_council_events.0120.support_duel.success_halved: "A few give themselves over to history"
 ecumenical_council_events.0120.support_duel.failure: "They remain elusive"
 ecumenical_council_events.0120.oppose: "I will not put my name to a laughingstock."
 ecumenical_council_events.0120.oppose_duel: ""Fools settle quarrels... by enforcing travesties.""
 ecumenical_council_events.0120.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0120.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0120.oppose_duel.failure: "They do not take to your insult"
 ecumenical_council_events.0120.conservatives_custom: "[ec_conservatives|E] of great [prestige|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0120.conservatives_custom_capped: "[ec_conservatives|E] of great [prestige|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0120.conservatives_custom_halved: "[ec_conservatives|E] of great [prestige|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0120.innovators_custom: "[ec_innovators|E] of great [prestige|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0120.innovators_custom_halved: "[ec_innovators|E] of great [prestige|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0122.t: "While I Still Can"
 ecumenical_council_events.0122.desc: "A few sickly priests sit apart from the press of the hall, seeking the warmth of the sun.\n\n"I wonder if I shall hear the last words of this council before I meet [lead_conservative.GetFaith.HighGodName]... and so be damned to [lead_conservative.GetFaith.NegativeAfterLife] stinking of its fresh horrors," [lead_conservative.GetTitledFirstName] wheezes.\n\n"You have so little left to lose, [lead_conservative.GetFirstNameNoTooltip], but surely you have some hope left to offer the world, so you may go blissfully to [lead_innovator.GetFaith.PositiveAfterLife]?" [lead_innovator.GetTitledFirstName] answers."
 ecumenical_council_events.0122.support: ""By [ROOT.Char.GetFaith.HighGodName], these last moments are precious!""
 ecumenical_council_events.0122.support_duel: "I will not meet [ROOT.Char.GetFaith.HighGodName] having kept silent."
 ecumenical_council_events.0122.support_duel.success: "They are inspired into a final reforming deed"
 ecumenical_council_events.0122.support_duel.success_halved: "A few are inspired into a final reforming deed"
 ecumenical_council_events.0122.support_duel.failure: "They will waste away bitterly"
 ecumenical_council_events.0122.oppose: "Our last strength belongs to [ROOT.Char.GetFaith.HighGodName], and [ROOT.Char.GetFaith.HighGodHerHis|U] Word."
 ecumenical_council_events.0122.oppose_duel: ""Let us not stain our lifetimes with this!""
 ecumenical_council_events.0122.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0122.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0122.oppose_duel.failure: "They remain damned"
 ecumenical_council_events.0122.conservatives_custom: "[ec_conservatives|E] in poor [health|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0122.conservatives_custom_capped: "[ec_conservatives|E] in poor [health|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0122.conservatives_custom_halved: "[ec_conservatives|E] in poor [health|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0122.innovators_custom: "[ec_innovators|E] in poor [health|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0122.innovators_custom_halved: "[ec_innovators|E] in poor [health|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0123.t: "Should War Soon Come"
 ecumenical_council_events.0123.desc: "I find my allies bickering, almost like divisions drawn up against one another on the field of war. This is an ill portent.\n\n"We have but one interest in common, damn you! Do not ask me to vote as if I were some pet, some baying hound on the leash of [ROOT.Char.GetTitledFirstName]!" snaps [lead_conservative.GetTitledFirstName].\n\n"What am I to make of an ally who will not match with simple words what [lead_innovator.GetSheHe] has sworn [ROOT.Char.GetPrimaryTitle.GetNameNoTier] in mortal lives?" [lead_innovator.GetTitledFirstName] retorts."
 ecumenical_council_events.0123.support: ""I must call upon all loyalties, yes.""
 ecumenical_council_events.0123.support_duel: "Warn that you do consider this a dishonor."
 ecumenical_council_events.0123.support_duel.success: "Your allies will stand with you"
 ecumenical_council_events.0123.support_duel.success_halved: "A few allies will stand with you"
 ecumenical_council_events.0123.support_duel.failure: "Your allies cannot be bullied"
 ecumenical_council_events.0123.oppose: ""Here, your loyalty is only to the scriptures.""
 ecumenical_council_events.0123.oppose_duel: "I will ask loyalty... from allies like [lead_innovator.GetFirstNameNoTooltip]."
 ecumenical_council_events.0123.oppose_duel.success: "Your allies yield"
 ecumenical_council_events.0123.oppose_duel.success_halved: "A few allies yield"
 ecumenical_council_events.0123.oppose_duel.failure: "Your allies will not be mustered into opposition"
 ecumenical_council_events.0123.conservatives_custom: "[allied|E] [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0123.conservatives_custom_capped: "[allied|E] [ec_conservatives|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0123.conservatives_custom_halved: "[allied|E] [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0123.innovators_custom: "[allied|E] [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0123.innovators_custom_halved: "[allied|E] [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0126.t: "Among Rivals"
 ecumenical_council_events.0126.desc: "It is a trial to find [rival.GetTitledFirstName], my [ROOT.Char.Custom2('RelationToMe', rival)], among the assembly.\n\n"Surely you know why I am here," [rival.GetSheHe] snarls. "Say your piece, choose your side... I only wait to vote against you.""
 ecumenical_council_events.0126.a: "Vote your conscience, not your hatred."
 ecumenical_council_events.0126.b: "Keep your spite. I will not rise to it."
 ecumenical_council_events.0126.c: "The council has [rival.GetHerHim] distracted..."
 ecumenical_council_events.0126.c.tt: "The [scheme|E] will have an #P increased#! [success_chance|E]"
 ecumenical_council_events.0126.conservatives_custom: "[ec_conservatives|E] among your [rivals|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0126.conservatives_custom_capped: "[ec_conservatives|E] among your [rivals|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0126.innovators_custom: "[ec_innovators|E] among your [rivals|E] (#V [feature_innovators_size]#!)"

 ecumenical_council_events.0129.t: "Fear in the Hall"
 ecumenical_council_events.0129.desc: "Those who tremble before me watch the debate with eyes like quivering dollops of cream. The lowest of them, [lead_conservative.GetTitledFirstName], will not even meet my gaze.\n\n"Speak your piece," [lead_conservative.GetSheHe] whispers. "I already know what happens if I refuse you.""
 ecumenical_council_events.0129.support: "Cruelty never failed me before."
 ecumenical_council_events.0129.support_duel: "I'll assure others know it as well."
 ecumenical_council_events.0129.support_duel.success: "Fear bends them to you"
 ecumenical_council_events.0129.support_duel.success_halved: "Fear makes slaves of but a few"
 ecumenical_council_events.0129.support_duel.failure: "Their fear curdles into defiance"
 ecumenical_council_events.0129.oppose: "And, thusly, terror devours hope."
 ecumenical_council_events.0129.oppose_duel: "I will let none defy me."
 ecumenical_council_events.0129.oppose_duel.success: "The fearful fall in line"
 ecumenical_council_events.0129.oppose_duel.success_halved: "A few fall in line"
 ecumenical_council_events.0129.oppose_duel.failure: "Their fear curdles into defiance"
 ecumenical_council_events.0129.conservatives_custom: "[intimidated|E] [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0129.conservatives_custom_capped: "[intimidated|E] [ec_conservatives|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0129.conservatives_custom_halved: "[intimidated|E] [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0129.innovators_custom: "[intimidated|E] [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0129.innovators_custom_halved: "[intimidated|E] [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
