 ecumenical_council_events.0102.t: "Competing Prayers"
 ecumenical_council_events.0102.desc: "The most devout among the assembled have broken into two circles of prayer over the proposal.\n\n[lead_innovator.GetTitledFirstName] calls on [lead_innovator.GetFaith.HighGodName] to affirm that their revelations are a reflection of [lead_innovator.GetFaith.HighGodHerHis|U] will. [lead_conservative.GetTitledFirstNamePossessive] circle answers this at once, beseeching [lead_innovator.GetFaith.random_GoodGodNames] to maintain the traditions that have long served the Church."
 ecumenical_council_events.0102.support: "Join the prayers for change."
 ecumenical_council_events.0102.support_duel: "Preach the change until their circle yields."
 ecumenical_council_events.0102.support_duel.success: "Your sermon sways the resisting clerics"
