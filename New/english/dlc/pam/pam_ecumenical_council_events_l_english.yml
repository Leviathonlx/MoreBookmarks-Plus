 ecumenical_council_events.0108.t: "Among Friends"
 ecumenical_council_events.0108.desc: "It is a comfort to find [friend.GetTitledFirstName], my [ROOT.Char.Custom2('RelationToMe', friend)], among the assembly.\n\n"Surely, you know where I stand," [friend.GetSheHe] says. "Say the word, and I follow.""
 ecumenical_council_events.0108.a: "Stand with me, [friend.GetFirstNameNoTooltip]."
 ecumenical_council_events.0108.b: "You can hold your own convictions."
 ecumenical_council_events.0108.conservatives_custom: "[ec_conservatives|E] among your [friends|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0108.conservatives_custom_capped: "[ec_conservatives|E] among your [friends|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0108.innovators_custom: "[ec_innovators|E] among your [friends|E] (#V [feature_innovators_size]#!)"

 ecumenical_council_events.0109.t: "Quiet Discontents"
 ecumenical_council_events.0109.desc: "Away from the floor, a small council seems to be afoot. Who might be trying to remake the faith without me?\n\n"If this matter can be questioned, why not the rest?" [lead_conservative.GetTitledFirstName] warns. "I will not open that door, and beckon uncertainty into the house of [lead_conservative.GetFaith.HighGodName]."\n\n"Do you not itch to shake off traditions that no longer serve us?" [lead_innovator.GetTitledFirstName] answers."
 ecumenical_council_events.0109.support: "A sympathetic ear will do."
 ecumenical_council_events.0109.support_duel: "I know how to make the cautious listen..."
 ecumenical_council_events.0109.support_duel.success: "They will not bar the way"
 ecumenical_council_events.0109.support_duel.success_halved: "A few heed you"
 ecumenical_council_events.0109.support_duel.failure: "They close ranks against you"
 ecumenical_council_events.0109.oppose: "Quietly close that door."
 ecumenical_council_events.0109.oppose_duel: ""Do you always trade in chaos, [lead_innovator.GetFirstNameNoTooltip]?""
 ecumenical_council_events.0109.oppose_duel.success: "They will not risk chaos"
 ecumenical_council_events.0109.oppose_duel.success_halved: "A few recant their support"
 ecumenical_council_events.0109.oppose_duel.failure: "They still wish discord and ruin"
 ecumenical_council_events.0109.conservatives_custom: "Reform-minded [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0109.conservatives_custom_capped: "Reform-minded [ec_conservatives|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0109.conservatives_custom_halved: "Reform-minded [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0109.innovators_custom: "Reform-minded [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0109.innovators_custom_halved: "Reform-minded [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"

 ecumenical_council_events.0110.t: "Vaulting Ambition"
 ecumenical_council_events.0110.desc: ""It is only a minor amendment!" [lead_innovator.GetTitledFirstName] says, "and we put ourselves in good standing as candidates for [lead_innovator.GetFaith.ReligiousHeadName], if we help push it through."\n\n"Your vaulting ambition over-leaps itself, and will be the ruin of us all." [lead_conservative.GetTitledFirstName] sneers."
 ecumenical_council_events.0110.support: "A little ambition has its place"
 ecumenical_council_events.0110.support_duel: "Argue further for advancement!"
 ecumenical_council_events.0110.support_duel.success: "They accept: it is but a minor amendment"
 ecumenical_council_events.0110.support_duel.success_halved: "A few accept the merits of support"
 ecumenical_council_events.0110.support_duel.failure: "Your greed is plain"
 ecumenical_council_events.0110.oppose: "Pride goes before a fall"
 ecumenical_council_events.0110.oppose_duel: "Warn against the evils of ambition!"
 ecumenical_council_events.0110.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0110.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0110.oppose_duel.failure: "Their promise of amendment holds"
 ecumenical_council_events.0110.conservatives_custom: "Ambitious [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
