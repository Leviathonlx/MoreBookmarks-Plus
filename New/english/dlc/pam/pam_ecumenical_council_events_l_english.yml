 ecumenical_council_events.0101.t: "The Learned Speak"
 ecumenical_council_events.0101.desc: "Scholars trade citations across the hall, each verse sharpening the dispute.\n\n"The [lead_conservative.GetFaith.ReligiousText|U] is clear," [lead_conservative.GetTitledFirstName] insists. "[ec_current_topic.GetName( activity.GetHost.GetRite )] should stay unchanged."\n\n"Read the passage I quote in full," [lead_innovator.GetTitledFirstName] answers. "You'll find it practically insists on this change!""
 ecumenical_council_events.0101.support: "Point out missing context in their passage."
 ecumenical_council_events.0101.support_duel: "Out-argue them with deeper scholarship."
 ecumenical_council_events.0101.support_duel.success: "They accept the change born from the text"
 ecumenical_council_events.0101.support_duel.success_halved: "A few accept the change born from the text"
 ecumenical_council_events.0101.support_duel.failure: "They still say the text is clear against it"
 ecumenical_council_events.0101.oppose: "Back [lead_conservative.GetTitledFirstNameNoTooltip]: the text should stay unchanged."
 ecumenical_council_events.0101.oppose_duel: "Contest that the change is born from the passage."
 ecumenical_council_events.0101.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0101.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0101.oppose_duel.failure: "Their reading of the change holds"
