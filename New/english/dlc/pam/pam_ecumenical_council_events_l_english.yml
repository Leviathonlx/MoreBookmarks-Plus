 ecumenical_council_events.0104.t: "Clerics of My Blood"
 ecumenical_council_events.0104.desc: "The clerics of my blood debate which way House [ROOT.Char.GetHouse.GetName] should lean. [lead_conservative.GetTitledFirstName] says, "Our house must not be seen divided, and I will not side with [host.GetTitledFirstName]!"\n\nBehind [lead_conservative.GetTitledFirstNamePossessiveNoTooltip] back, [lead_innovator.GetTitledFirstName] pulls faces: not all of my house opposes innovation."
 ecumenical_council_events.0104.support: "Call upon [ROOT.Char.GetHouse.GetNameNoTooltip] to stand in favor."
 ecumenical_council_events.0104.support_duel: "Win over those who refuse innovation."
 ecumenical_council_events.0104.support_duel.success: "Your House will stand in favor"
 ecumenical_council_events.0104.support_duel.success_halved: "A few will stand in favor"
 ecumenical_council_events.0104.support_duel.failure: "Your House is divided"
 ecumenical_council_events.0104.oppose: "Stand with [lead_conservative.GetFirstNameNoTooltip] against innovation."
 ecumenical_council_events.0104.oppose_duel: "Warn [lead_innovator.GetFirstNameNoTooltip]: the house must not be divided."
 ecumenical_council_events.0104.oppose_duel.success: "Your kin come to reject the change"
 ecumenical_council_events.0104.oppose_duel.success_halved: "A few of your kin refuse the change"
 ecumenical_council_events.0104.oppose_duel.failure: "[lead_innovator.GetTitledFirstNameNoTooltip] holds the line"
