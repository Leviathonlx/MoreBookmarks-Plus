 ecumenical_council_events.0106.t: "Owed Fealty"
 ecumenical_council_events.0106.desc: "My vassals and I gather in one of the chambers.\n\n"Even here, your liege is your master," [lead_conservative.GetTitledFirstName] cautions the others. "If our [ROOT.Char.GetTitleAsName] will not speak in favor of this heretical innovation, then your voices must be silent too."\n\n"Our [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] keeps us in line elsewhere. But not here!" [lead_innovator.GetTitledFirstName] retorts."
 ecumenical_council_events.0106.desc_innovator: "My vassals and I gather in one of the chambers.\n\n"A liege deserves an answer," [lead_conservative.GetTitledFirstName] says. "Sadly, I fear this matter may be beyond [ROOT.Char.GetHerHim]. Only [lead_conservative.GetFaith.HighGodName] guides our hearts, and [lead_conservative.GetFaith.HighGodName] lays the line we must defend unerringly!"\n\n"Ah, but our [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] wishes are not in defiance of [ROOT.Char.GetFaith.HighGodNamePossessive]," [lead_innovator.GetTitledFirstName] answers. "Consider your oath, and heed [ROOT.Char.GetHerHis] wisdom!""
 ecumenical_council_events.0106.support: ""As [ROOT.Char.GetTitleAsNameNoTooltip], I am proxy for [ROOT.Char.GetFaith.HighGodName].""
 ecumenical_council_events.0106.support_duel: "Demand the loyal service these vassals swore."
 ecumenical_council_events.0106.support_duel.success: "They will obey you"
 ecumenical_council_events.0106.support_duel.success_halved: "A few agree to obey you"
 ecumenical_council_events.0106.support_duel.failure: "Your vassals reserve their loyalty for [lead_conservative.GetFaith.HighGodName]"
 ecumenical_council_events.0106.oppose: "Back [lead_conservative.GetTitledFirstNameNoTooltip]: this is beyond a liege."
 ecumenical_council_events.0106.oppose_duel: "Contest that a Lord's wishes are not in defiance of God."
 ecumenical_council_events.0106.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0106.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0106.oppose_duel.failure: "Their answer holds"
 ecumenical_council_events.0106.conservatives_custom: "[ec_conservatives|E] among your [vassals|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0106.conservatives_custom_capped: "[ec_conservatives|E] among your [vassals|E] (#V [feature_conservatives_free_max]#!)"
 ecumenical_council_events.0106.conservatives_custom_halved: "[ec_conservatives|E] among your [vassals|E] (#V [feature_conservatives_size_halved]#!)"
