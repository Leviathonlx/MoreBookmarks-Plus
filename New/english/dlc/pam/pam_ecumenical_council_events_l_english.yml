 ecumenical_council_events.0021.t: "$ecumenical_council_events.0020.t$"
 ecumenical_council_events.0021.desc.intro: "$ecumenical_council_events.0020.desc.intro$"
 ecumenical_council_events.0021.desc.outro: "Our host [host.GetTitledFirstName] proclaims:\n\n"I propose to make [ec_debate_topic_2.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]"
 ecumenical_council_events.0021.desc.permit: "$ecumenical_council_events.0011.desc.permit$"
 ecumenical_council_events.0021.desc.prohibit: "$ecumenical_council_events.0011.desc.prohibit$"
 ecumenical_council_events.0021.desc.learn: "$ecumenical_council_events.0011.desc.learn$"
 ecumenical_council_events.0021.desc.make_core: "$ecumenical_council_events.0011.desc.make_core$"
 ecumenical_council_events.0021.a: "$ecumenical_council_events.0011.a$"
 ecumenical_council_events.0021.b: "$ecumenical_council_events.0011.b$"
 
 ecumenical_council_events.doctrine.t: "The [ec_debate_topic_3.GetGroup.GetName( ROOT.GetCharacter.GetFaith )] Question"
 ecumenical_council_events.doctrine.intro: "The matter of [ec_debate_topic_3.GetGroup.GetName( ROOT.GetCharacter.GetFaith )] is the final topic to be interrogated. [ec_debate_topic_3.GetDescriptiveName( ROOT.GetCharacter.GetFaith )] is the current stance of canon law. [lead_portrait.GetTitledFirstName] commences:\n\n"
 ecumenical_council_events.doctrine.chaplain_suggestion: "\n\n"[ec_chaplain_pick.GetDescriptiveName( ROOT.GetCharacter.GetFaith )] is most suitable to the needs of [ROOT.Char.GetFaith.GetName]," advises [court_chaplain.GetName]."
 ecumenical_council_events.0031.t: "$ecumenical_council_events.doctrine.t$"
 ecumenical_council_events.0031.desc.intro: "$ecumenical_council_events.doctrine.intro$"
 ecumenical_council_events.0031.desc.proposal: ""[host.GetTitledFirstName] graciously proposed that [ec_proposed_doctrine.GetDescriptiveName( ROOT.GetCharacter.GetFaith )] will be the new norm.""
 ecumenical_council_events.0031.a: "$ecumenical_council_events.0011.a$"
 ecumenical_council_events.0031.b: "$ecumenical_council_events.0011.b$"
 
 ecumenical_council_events.0040.t: "The End of the Council"
 ecumenical_council_events.0040.desc: "After an arduous process, the Council draws to an end."
 ecumenical_council_events.0040.desc.change: "Under my guidance, [ROOT.Char.GetFaith.GetName] altered its very foundation. Now, to evangelize this blessed news to the common masses!"
 ecumenical_council_events.0040.desc.status_quo: "I failed to pass any of my proposed changes. [ROOT.Char.GetFaith.GetName] remains as it was."
 ecumenical_council_events.0040.a: "It is time to go home."
 
 ecumenical_council_events.0041.t: "The End of the Council"
 ecumenical_council_events.0041.desc: "After an arduous process, the Council draws to an end."
 ecumenical_council_events.0041.desc.change: "Under the guidance of [host.GetName], [host.GetFaith.GetName] altered its very foundation. Now, to evangelize this news to the common masses!"
 ecumenical_council_events.0041.desc.status_quo: "[host.GetName] failed to pass any of [host.GetHersHis] proposed changes. [host.GetFaith.GetName] remains as it has been."
 ecumenical_council_events.0041.a: "$ecumenical_council_events.0040.a$"
 ecumenical_council_events.schism_crisis_end: "\n\nEach delegation rides home with a differing account of what was conceded, and who betrayed whom. A house so divided cannot stand forever."

 # Debate vote resolution: host
 ecumenical_council_events.0080.t: "The Council Votes"
 ecumenical_council_events.0080.desc.passed: "The votes are counted. [lead_portrait.GetTitledFirstName] comes forth:\n\n"The Holy Spirit has guided us through this council, and we stand decided. The matter is settled — in favor!""
 ecumenical_council_events.0080.desc.failed: "The votes are counted. [lead_portrait.GetTitledFirstName] comes forth:\n\n"The Holy Spirit has guided us through the council, and we stand decided. The proposal fails. [host.GetFaith.GetName] remains as it was.""
 ecumenical_council_events.0080.desc.outcome.passed: "\n\n[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] is made [activity.Custom('GetEcumenicalCouncilCurrentProposal')]."
 ecumenical_council_events.0080.desc.outcome.passed.make_core: "\n\n[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] is made core, replacing [core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )]."
 ecumenical_council_events.0080.desc.outcome.failed: "\n\n[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] is not made [activity.Custom('GetEcumenicalCouncilCurrentProposal')]."
 ecumenical_council_events.0080.a: "So it is decided."
 first_debate_resolultion_failed_tt: "Making [activity.MakeScope.Var('current_topic').TenetType.GetNameNoTooltip( activity.GetHost.GetRite )] [activity.Custom('GetEcumenicalCouncilTenet1Proposal')] failed"
 second_debate_resolultion_failed_tt: "Making [activity.MakeScope.Var('current_topic').TenetType.GetNameNoTooltip( activity.GetHost.GetRite )] [activity.Custom('GetEcumenicalCouncilTenet2Proposal')] failed"
 third_debate_resolultion_failed_tt: "Making [activity.MakeScope.Var('current_topic').DoctrineType.GetGroup.GetName( activity.GetHost.GetFaith )] [activity.Custom('GetEcumenicalCouncilDoctrine1Proposal')] failed"
 ecumenical_council_vote_tally_tt: "[ec_innovators|E]: #V [ec_vote_for|0]#!, [ec_conservatives|E]: #V [ec_vote_against|0]#!"
