 ecumenical_council_events.0103.t: "The Price of Change"
 ecumenical_council_events.0103.desc: ""Your intransigence will be the end of us!" [lead_innovator.GetTitledFirstName] shouts.\n\n"The faithful of [lead_conservative.GetPrimaryTitle.GetNameNoTooltip] would thank a patron who restores their [lead_conservative.Custom('GetFaithTemple')]," [lead_conservative.GetTitledFirstName] says."
 ecumenical_council_events.0103.support: "Offer patronage."
 ecumenical_council_events.0103.support_duel: "Detail how [lead_conservative.GetHerHis] flock stands to be enriched."
 ecumenical_council_events.0103.support_duel.success: "They see the value of innovation"
 ecumenical_council_events.0103.support_duel.success_halved: "A few accept the value of innovation"
 ecumenical_council_events.0103.support_duel.failure: "All still withhold their vote"
 ecumenical_council_events.0103.oppose: "Offer patronage."
 ecumenical_council_events.0103.oppose_duel: "Warn that innovation shall impoverish [lead_innovator.GetHerHis] flock."
 ecumenical_council_events.0103.oppose_duel.success: "They learn to fear this blasphemy"
 ecumenical_council_events.0103.oppose_duel.success_halved: "A few eschew their blasphemy"
 ecumenical_council_events.0103.oppose_duel.failure: "All still protest intransigence"
