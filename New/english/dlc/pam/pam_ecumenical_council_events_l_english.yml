 ecumenical_council_events.0050.desc.doctrine_marriage_type_description: ""We must judge the matter: may a believer take one spouse, several, or keep a lawful marriage with concubines alongside it?""
 ecumenical_council_events.0050.doctrine_monogamy: "We will affirm [GetDoctrineType('doctrine_monogamy').GetDescriptiveNameNoTooltip( ROOT.GetCharacter.GetFaith )]."
 ecumenical_council_events.0050.doctrine_polygamy: "Let us embrace [GetDoctrineType('doctrine_polygamy').GetDescriptiveNameNoTooltip( ROOT.GetCharacter.GetFaith )]."
