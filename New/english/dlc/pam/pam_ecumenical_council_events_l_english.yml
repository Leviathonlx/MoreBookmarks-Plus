 ecumenical_council_events.0105.t: "[ROOT.Char.GetCulture.GetNameNoTooltip] Sensibilities"
 ecumenical_council_events.0105.desc: "The familiar sounds of [ROOT.Char.GetCulture.GetLanguage.GetName] stand out among the many tongues spoken here. It is, of course, [lead_conservative.GetTitledFirstName] badgering our kinfolk.\n\n"We [lead_conservative.GetCulture.GetCollectiveNounNoTooltip] have no taste for such innovations!" [lead_conservative.GetSheHe] rails.\n\n"But would you have us be blamed for the Church standing still?" [lead_innovator.GetTitledFirstName] challenges."
 ecumenical_council_events.0105.support: "You do not speak for us all, [lead_conservative.GetFirstNameNoTooltip]."
 ecumenical_council_events.0105.support_duel: "We [lead_conservative.GetCulture.GetCollectiveNounNoTooltip] have a history of innovation."
 ecumenical_council_events.0105.support_duel.success: "All present agree to stand in favor"
 ecumenical_council_events.0105.support_duel.success_halved: "A few agree to stand in favor"
 ecumenical_council_events.0105.support_duel.failure: "They still reject innovation"
 ecumenical_council_events.0105.oppose: "Stand with [ROOT.Char.GetCulture.GetNameNoTooltip] tradition!"
 ecumenical_council_events.0105.oppose_duel: "Argue for tradition."
 ecumenical_council_events.0105.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yields"
 ecumenical_council_events.0105.oppose_duel.success_halved: "A few from [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] circle yield"
 ecumenical_council_events.0105.oppose_duel.failure: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] conviction holds"
