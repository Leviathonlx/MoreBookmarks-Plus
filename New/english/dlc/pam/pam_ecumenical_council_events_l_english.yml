 ecumenical_council_events.0072.desc.intro: "$ecumenical_council_events.doctrine.intro$"
 ecumenical_council_events.0072.desc.doctrine_monasticism_description: ""We must now question whether the cloistered life is truly noble and sacred.""
 ecumenical_council_events.0072.doctrine_monasticism_encouraged: "Let us embrace [GetDoctrineType('doctrine_monasticism_encouraged').GetDescriptiveNameNoTooltip( ROOT.GetCharacter.GetFaith )]."
 ecumenical_council_events.0072.doctrine_monasticism_accepted: "[GetDoctrineType('doctrine_monasticism_accepted').GetDescriptiveNameNoTooltip( ROOT.GetCharacter.GetFaith )] will be permitted."
 ecumenical_council_events.0072.doctrine_monasticism_absent: "We shall uphold [GetDoctrineType('doctrine_monasticism_absent').GetDescriptiveNameNoTooltip( ROOT.GetCharacter.GetFaith )]."
 ecumenical_council_events.0072.doctrine_monasticism_forbidden: "We will affirm [GetDoctrineType('doctrine_monasticism_forbidden').GetDescriptiveNameNoTooltip( ROOT.GetCharacter.GetFaith )]."
 ecumenical_council_events.0072.desc.chaplain_suggestion: "$ecumenical_council_events.doctrine.chaplain_suggestion$"

 # sacraments_group
 ecumenical_council_events.0073.t: "$ecumenical_council_events.doctrine.t$"
 ecumenical_council_events.0073.desc.intro: "$ecumenical_council_events.doctrine.intro$"
 ecumenical_council_events.0073.desc.doctrine_sacraments_description: ""We must judge this matter: must baptism, communion, and the other holy rites be honored as the dearest practices of our faith?""
 ecumenical_council_events.0073.doctrine_sacraments_central: "We will affirm [GetDoctrineType('doctrine_sacraments_central').GetDescriptiveNameNoTooltip( ROOT.GetCharacter.GetFaith )]."
 ecumenical_council_events.0073.doctrine_sacraments_absent: "Let us embrace [GetDoctrineType('doctrine_sacraments_absent').GetDescriptiveNameNoTooltip( ROOT.GetCharacter.GetFaith )]."
 ecumenical_council_events.0073.desc.chaplain_suggestion: "$ecumenical_council_events.doctrine.chaplain_suggestion$"

 # Flavor Events
 ecumenical_council_summons_events.0001.t: "The Worries of the [guest_1.GetTitleAsNameNoTooltip|U]"
 ecumenical_council_summons_events.0001.desc: ""And that issue of mine... by [guest_1.GetFaith.HighGodName], it consumes me. I can hardly sleep..." [guest_1.GetTitledFirstName] confides to [guest_2.GetTitledFirstName] in a pained whisper.\n\n"I understand..." [guest_2.GetFirstNameNoTooltip] nods. "Maybe if you talked to our host, the [host.GetTitleAsNameNoTooltip], [host.GetSheHe] could offer some spiritual advice?""
 ecumenical_council_summons_events.0001.a: "What could worry [guest_1.GetHerHim] so much..."
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "You learn of [guest_1.GetShortUINamePossessive] Secret"
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip] just needs some friendly comfort."
 ecumenical_council_summons_events.0001.c: "It is better not to know."
 friend_comforted_at_council_reason: "[CHARACTER.GetShortUIName|U] comforted [TARGET_CHARACTER.GetShortUIName] about [TARGET_CHARACTER.GetShortUINamePossessive] secret at an Ecumenical Council."
 friend_comforted_at_council_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] comforted [CHARACTER.GetShortUIName] about [CHARACTER.GetShortUINamePossessive] secret at an Ecumenical Council."
 rival_eavesdropped_on_secret_reason: "[CHARACTER.GetShortUIName|U] was caught trying to spy on [TARGET_CHARACTER.GetShortUINamePossessive] secret at a Council."
 rival_eavesdropped_on_secret_reason_corresponding: "[CHARACTER.GetShortUIName|U] caught [TARGET_CHARACTER.GetShortUIName] trying to spy on [CHARACTER.GetHerHis] secret at a Council."
 
 ecumenical_council_summons_events.0010.t: "The Secret"
 ecumenical_council_summons_events.0010.desc: "Our host [host.GetTitledFirstName] does not seem to notice my presence as [host.GetSheHe] is helped by a servant adjusting [host.GetHerHis] vestments.\n\n"[host.GetFaith.HighGodName] forgive me..." [host.GetSheHe] mutters. "These rumors about my... tendencies. To think that I, the Vicar of Christ, indulges in such proclivities! Such rumors must never reach my cardinals.""
 ecumenical_council_summons_events.0010.a: ""I can see you're repentant, [host.GetTitleAsNameNoTooltip].""
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "You learn of [host.GetShortUINamePossessive] Secret"
 ecumenical_council_summons_events.0010.b: ""[ROOT.Char.Custom('RandomBibleQuoteShort')]""
 ecumenical_council_summons_events.0010.b.flavor: "[host.GetSheHe|U] will find consolation in the scriptures!"
 ecumenical_council_summons_events.0010.c: "Some things are better left unknown."
 
 ecumenical_council_summons_events.0020.t: "Logistical Issues"
 ecumenical_council_summons_events.0020.desc.intro: ""If it must be so..." [host.GetTitledFirstName] dismisses one of the priests with a gesture.\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]!" [host.GetSheHe|U] calls for my attention."
 ecumenical_council_summons_events.0020.desc.caravans: ""The caravans transporting our provisions have not yet arrived."
 ecumenical_council_summons_events.0020.desc.servants: ""There are simply not enough servants to attend all of our guests."
 ecumenical_council_summons_events.0020.desc.overcrowded: ""There are simply too many guests for the lodgings in [ROOT.Char.GetCurrentLocation.GetName] arranged for our council."
 ecumenical_council_summons_events.0020.desc.outro: "I don't suppose you have a solution for our troubles?""
 ecumenical_council_summons_events.0020.aaa: ""These are my lands, your Holiness. I will have it sorted.""
 ecumenical_council_summons_events.0020.aa: "I know #EMP many#! people that owe me a favor..."
 ecumenical_council_summons_events.0020.a: ""Nothing gold cannot fix, your Holiness!""
 ecumenical_council_summons_events.0020.b: ""I will call in all my favors!""
 ecumenical_council_summons_events.0020.b.flavor: "[host.GetShortUIName] will remember me as an influential candidate..."
 ecumenical_council_summons_events.0020.c: "I can only offer a modest prayer..."
 ecumenical_council_summons_events.0020.papabile_tt: "Your [papabile_score|E] for papal succession increases by #P +10#!"
 
 ecumenical_council_summons_events.0030.t: "At the Mercy of the Elements"
 ecumenical_council_summons_events.0030.desc.intro: "The winds howl and rain lashes the road as the council approaches."
 ecumenical_council_summons_events.0030.desc.dry_season: "Rather unusual in this time of the year."
 ecumenical_council_summons_events.0030.desc.wet_season: "Such inclement weather is only to be expected in this time of year."
 ecumenical_council_summons_events.0030.desc.outro: "My [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName] shivers uncontrollably.\n\n"My liege... I fear I may not be able to attend the council. This storm, this cold... it is not good for my body. I have too much phlegm...""
 ecumenical_council_summons_events.0030.aa: ""I have read #EMP plenty#! about this affliction!""
 ecumenical_council_summons_events.0030.a: "I must call for the best physician!"
 ecumenical_council_summons_events.0030.b: ""I will keep you in my prayers.""
 ecumenical_council_summons_events.0030.c: "Life will follow its course."
 
 ecumenical_council_summons_events.0040.t: "Stage Fright"
 ecumenical_council_summons_events.0040.desc: "As the time of the council approaches, I find my [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName] anxiously pacing around the courtyard.\n\n"There is the question of the [ROOT.Char.GetFaith.ReligiousSymbol], of course, of course... and what about the [chaplain.CustomFixedRandom('random_learning_topic')]...?" I hear [chaplain.GetHerHim] mutter to [chaplain.GetHerselfHimself]."
 ecumenical_council_summons_events.0040.aa: ""You must remember [ROOT.Char.GetFaith.KnowledgeGodName], [chaplain.GetFirstNameNoTooltip].""
 ecumenical_council_summons_events.0040.aa.flavor: "Some spiritual guidance will surely be reassuring."
 ecumenical_council_summons_events.0040.a: "[chaplain.GetSheHe|U] should be reminded that [chaplain.GetSheHe] represents me too."
 ecumenical_council_summons_events.0040.a.tt.success: "Your diplomacy bears fruit"
 ecumenical_council_summons_events.0040.a.tt.failure: "[chaplain.GetShortUIName] is not sure of your intentions"
 ecumenical_council_summons_events.0040.b: "I can always leverage my position in [chaplain.GetHerHis] favor..."
 ecumenical_council_summons_events.0040.c: "Nothing prayer cannot remediate."
 friend_reassured_at_council: "[CHARACTER.GetShortUIName|U] reassured [TARGET_CHARACTER.GetShortUIName] at an Ecumenical Council."
 friend_reassured_at_council_corresponding: "[CHARACTER.GetShortUIName|U] was reassured by [TARGET_CHARACTER.GetShortUIName] at an Ecumenical Council."
 
 ecumenical_council_summons_events.0050.t: "Questioned Faith"
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.GetTitledFirstName] can scarcely contain [pious_guest.GetHerHis] amusement at the sight of [non_pious_guest.GetTitledFirstName].\n\n"Have you seen this, [ROOT.Char.GetTitleAsNameNoTooltip]?" [pious_guest.GetSheHe] addresses me. "[non_pious_guest.GetFirstNameNoTooltip] must be commended! I had started to think that the only seat [non_pious_guest.GetSheHe] knew was that of the [Glossary( 'bath houses', 'BATHHOUSES_GLOSS' )]."
 ecumenical_council_summons_events.0050.desc.non_pious_host: "And to think that [non_pious_guest.GetSheHe] declares [non_pious_guest.GetHerselfHimself] the head of all [ROOT.Char.GetFaith.GetAdherentNamePlural].""
 ecumenical_council_summons_events.0050.aaa: "[chaplain.GetTitledFirstNameNoTooltip] would be the perfect [chaplain.GetWomanMan] for the job."
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "It amazes me that [non_pious_guest.GetSheHe] has decided to join us in this council.""
 ecumenical_council_summons_events.0050.aa: "A good shepherd must rise from among the sheep..."
 ecumenical_council_summons_events.0050.a: ""I could make #EMP everyone#! aware of this... for a price.""
 ecumenical_council_summons_events.0050.b: ""How do #EMP you#! know who frequents the bathhouses, [pious_guest.GetTitleAsNameNoTooltip]?""
 ecumenical_council_summons_events.0050.c: "Thank [ROOT.Char.GetFaith.HighGodName] for some entertainment."
 BATHHOUSES_GLOSS: "In many medieval towns, the bathhouses — once meant for modest ablutions — had gained a notorious reputation. Their obscured rooms offered enough privacy for pleasure workers to carry on their affairs."
 friend_defended_piety_at_ec_reason: "[CHARACTER.GetShortUIName|U] defended [TARGET_CHARACTER.GetShortUINamePossessive] piety at an Ecumenical Council."
 friend_defended_piety_at_ec_reason_corresponding: "Many witnesses declared that [TARGET_CHARACTER.GetShortUIName|U] defended [CHARACTER.GetShortUINamePossessive] piety at an Ecumenical Council."
 rival_accused_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] accused [CHARACTER.GetShortUIName] of impious behavior at an Ecumenical Council."
 rival_accused_at_council_reason_corresponding: "[CHARACTER.GetShortUIName|U] was accused by [TARGET_CHARACTER.GetShortUIName] of impious behavior at an Ecumenical Council."

