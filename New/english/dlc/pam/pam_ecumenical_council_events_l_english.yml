 pam_ecumenical_council_roman_guests_custom: "Every [GetRiteByKey('roman_rite').GetAdherentName] guest at the Council"
 pam_ecumenical_council_greek_guests_custom: "Every [GetRiteByKey('byzantine_rite').GetAdherentName] guest at the Council"
 pam_ecumenical_council_overruled_guests_custom: "The guests of the rite that was ruled against, commanded rather than heard"
 pam_rite_quarrel_championed_opinion: "Took my rite's side at an Ecumenical Council"
 pam_rite_quarrel_slighted_opinion: "Took the other rite's side against mine at an Ecumenical Council"
 pam_rite_quarrel_overruled_opinion: "Overruled my rite at an Ecumenical Council"
 ecumenical_council_summons_events.0060.t: "First Among Equals"
 ecumenical_council_summons_events.0060.desc: "[ec_roman_champion.GetTitledFirstName], speaking for the [GetRiteByKey('roman_rite').GetName], will not drop the matter:\n\n"Every church answers to Rome, and Rome answers to no one!"\n\n[ec_greek_champion.GetTitledFirstName] counts five patriarchs on [ec_greek_champion.GetHerHis] fingers:\n\n"Which of these has ever knelt?""
 ecumenical_council_summons_events.0060.a: ""Peace, both of you. The council has not even begun.""
 ecumenical_council_summons_events.0060.a.success: "The two debaters are talked down, averting chaos"
 ecumenical_council_summons_events.0060.a.failure: "Neither will hear me, and the hall takes sides"
 ecumenical_council_summons_events.0060.b: "Peter was given the keys, and Rome holds them."
 ecumenical_council_summons_events.0060.c: "Rome is first among equals. Nothing more."
 ecumenical_council_summons_events.0060.d: "I hold this office. The question is closed."

 ecumenical_council_summons_events.0061.t: "And the Son"
 ecumenical_council_summons_events.0061.desc: ""Two words," [ec_greek_champion.GetTitledFirstName] of the [GetRiteByKey('byzantine_rite').GetName] begins. "Two words the [GetRiteByKey('roman_rite').GetAdherentNamePlural] slipped into the Creed, and the East was not consulted."\n\n"Truth answers to God alone," [ec_roman_champion.GetTitledFirstName] replies."
 ecumenical_council_summons_events.0061.a: "The Creed has survived worse than a quarrel over it."
 ecumenical_council_summons_events.0061.a.success: "The wording is set aside before the argument can harden"
 ecumenical_council_summons_events.0061.a.failure: "The argument hardens into doctrine on both sides"
 ecumenical_council_summons_events.0061.b: "The words were added because they are true."
 ecumenical_council_summons_events.0061.c: "A council wrote the Creed. Only a council may change it."
 ecumenical_council_summons_events.0061.d: "The Creed will be said here as I say it."

 ecumenical_council_summons_events.0062.t: "The Bread of the Altar"
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.GetTitledFirstName] lifts a wafer, thin and pale as parchment:\n\n"The [GetRiteByKey('roman_rite').GetAdherentNamePlural] have never needed more."\n\n[ec_greek_champion.GetTitledFirstName] places a risen loaf next to it:\n\n"So the [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] have been wrong since the Apostles?""
 ecumenical_council_summons_events.0062.a: "Both loaves will be blessed at my altar tomorrow, and we will eat of each."
 ecumenical_council_summons_events.0062.a.success: "Both loaves are eaten, and the quarrel with them"
 ecumenical_council_summons_events.0062.a.failure: "Two altars are laid that evening, and the aisle between stays empty"
 ecumenical_council_summons_events.0062.b: "Unleavened, as it was at the Last Supper."
 ecumenical_council_summons_events.0062.c: "Risen bread, for a risen Lord."
 ecumenical_council_summons_events.0062.d: "Bread is bread. It is the blessing that matters."

 ecumenical_council_summons_events.0063.t: "Matter of Language"
 ecumenical_council_summons_events.0063.desc: "The prayers are recited in Latin. The benches of the [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] await their translation, and scowl when it comes. [ec_greek_champion.GetTitledFirstName] mutters:\n\n"The Romans argue like lawyers. All words, and no substance."\n\n"The Greeks argue like philosophers! They've never settled a single thing," [ec_roman_champion.GetTitledFirstName] answers."
 ecumenical_council_summons_events.0063.a: "Then let us find words that carry in both tongues."
 ecumenical_council_summons_events.0063.a.success: "A phrasing is found that neither side can twist"
 ecumenical_council_summons_events.0063.a.failure: "Both sides leave certain the other argued in bad faith"
 ecumenical_council_summons_events.0063.b: "Say it in Latin, and say it plainly."
 ecumenical_council_summons_events.0063.c: "The Fathers wrote in Greek. We can manage to read it."
 ecumenical_council_summons_events.0063.d: "I shall issue it in both tongues. The matter is closed."

