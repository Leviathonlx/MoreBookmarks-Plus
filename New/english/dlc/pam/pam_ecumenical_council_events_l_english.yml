l_english:
 ecumenical_council_events.0001: "The Council of [my_location.GetBaronyNameExplicitlyNoTooltip]"
 ecumenical_council_events.0001.desc_intro: "The [ROOT.Char.GetFaith.HouseOfWorshipPlural] of [my_location.GetBaronyNameExplicitly] have been beautifully decorated for the occasion. The best among Christendom have answered"
 ecumenical_council_events.0001.host: "my call."
 ecumenical_council_events.0001.dislikes_host: "[host.Custom('InsultAdjective')] [host.GetTitledFirstNamePossessive] call."
 ecumenical_council_events.0001.likes_host: "[host.Custom('ComplimentAdjective')] [host.GetTitledFirstNamePossessive] call."
 ecumenical_council_events.0001.neutral: "[host.GetTitledFirstNamePossessive] call."
 ecumenical_council_events.0001.intent_arrived: "\n\nAnd, already, I spy [intent_target.GetTitledFirstName] among the assembly. Perfect!"
 ecumenical_council_events.0001.waiting_for_intent: "\n\nIt is only a matter of time that [intent_target.GetTitledFirstName] makes an appearance..."
 ecumenical_council_events.0001.no_intent_target: "\n\nI need but wait for their arrival!"
 ecumenical_council_events.0001.a.bad: "If we must."
 ecumenical_council_events.0001.a.good: "Holy is our duty."
 
 ecumenical_council_events.0002.t: "The Summons"
 ecumenical_council_events.0002.desc_intro: "The doors to the [host.GetFaith.HouseOfWorship] can now open and our great work can begin. In preparation, it is time to form alliances"
 ecumenical_council_events.0002.reformist: "between kings and priests alike."
 ecumenical_council_events.schism_crisis_intro: "\n\nThe greetings are warm; the silences that follow are not. Rome and Constantinople no longer trade courtesies, and each unhealed quarrel is a fresh crack in the one Body of Christ."
 ecumenical_council_events.0002.first_tenet: "\n\nThe air is alive with chatter. Those summoned begin forming their stances on [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )] and other pressing matters."
 ecumenical_council_events.0002.host: "\n\nI open my arms and welcome my children, to together face our momentous task."
 ecumenical_council_events.0002.guest: "\n\n"Welcome, my children. May the Lord guide us in our momentous task!" [host.GetTitledFirstName] beckons us forward." 
 ecumenical_council_events.0002.a: "Amen."
 
 ecumenical_council_events.0010.t: "Our Stance on [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]"
 ecumenical_council_events.0010.desc.intro: "The first debate centers around [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )]. Current canonical law upholds its status as [host.Custom('GetEcumenicalDebateTenet1StatusText')|l]. [lead_portrait.GetTitledFirstName] sets the stage:\n\n"
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n"More and more people consider this central to their worship," my [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName] reports."
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n"Banning a practice has a risk, but in this case it is one much-warranted," my [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName] reassures."
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n"The practice is still popular. To issue its condemnation... has certain risks," my [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName] raises concern."
 ecumenical_council_events.0010.desc.intro_core_demote_good:  "\n\n"The practice is losing popularity. This is a timely moment to end its endorsement," my [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName] advises."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good:  "\n\n"The practice is gaining popularity. One would be wise to consider its endorsement," my [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName] suggests."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n"The practice is obscure; a dangerous cause to champion," my [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName] warns."
 ecumenical_council_events.0010.desc.fallback.explanation: ""This is a teaching our faith has yet to settle firmly into place; an act of deliberation that is now set before this council.""
 ecumenical_council_events.0010.desc.peace_of_god.explanation: ""We are asked: shall we uphold a Peace and Truce of [ROOT.Char.GetFaith.HighGodName]? Must our peoples swear oaths to spare churches, clergy, and the unarmed from plunder and bloodshed? May we forbid warfare in the holy seasons, on pain of the [ROOT.Char.GetFaith.GetAdjective] Church's ban?""
 ecumenical_council_events.0010.desc.dulia.explanation: ""We are asked whether the saints are to be venerated highly. Can their relics be held sacred, their feast days kept, and their intercession sought while our worship is saved still for [ROOT.Char.GetFaith.HighGodName] alone?""
 ecumenical_council_events.0010.desc.transubstantiation.explanation: ""We are asked whether, by the priest's consecration, the bread and wine on the altar are truly changed into the Body and Blood of Christ.""
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: ""We are asked whether holy life must align prayer and labor. Is idleness the enemy of the soul? Should our toil in the field or scriptorium be as revered as the hours of the [ROOT.Char.Custom('GetReligiousRite')]?""
 ecumenical_council_events.0010.desc.hyperdulia.explanation: ""We are asked: is the Holy Mother Mary, the God-bearer, to be honored over all other saints?""
 ecumenical_council_events.0010.desc.simony.explanation: ""We are asked: may holy office, blessing, or sacrament be bought and sold for gold?""
 ecumenical_council_events.0010.desc.monophysitism.explanation: ""We are asked: has Christ only one, wholly divine nature? Is His humanity swallowed up, leaving but the divine in the Word made flesh?""
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: ""We are asked whether the [ROOT.Char.GetFaith.GetAdjective] Church must live as in the Acts of the Apostles. Should we loose our missionaries, with apostolic zeal, bearing the Word to those still in darkness?""
 ecumenical_council_events.0010.desc.purgatory.explanation: ""We are asked: can souls neither wholly pure nor wholly damned be cleansed after death? May the prayers and rites of the living aid them on their way to [ROOT.Char.GetFaith.HighGodName]?""
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: ""We are asked: is the siring of children a sacred charge? Should the faithful fill the earth with their offspring?""
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: ""We are asked: does the authority of bishops truly come of their unbroken succession from the Apostles?""
 ecumenical_council_events.0010.desc.confession.explanation: ""We are asked: must each [ROOT.Char.GetFaith.GetAdherentName] confess their sins to a priest for absolution? Is the seal of confession inviolable?""
 ecumenical_council_events.0010.desc.original_sin.explanation: ""We are asked: does each soul inherit Adam's sin? Are we stained from birth and in need of baptismal grace?""
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: ""We are asked: do the holy angels stand rank upon rank under [ROOT.Char.GetFaith.HighGodName]? Should the offices of the [ROOT.Char.GetFaith.GetAdjective] Church mirror that heavenly order?""
 ecumenical_council_events.0010.desc.miles_christi.explanation: ""We are asked: should the faithful be soldiers of Christ? Are we bound to take up the sword and defend the [ROOT.Char.GetFaith.GetAdjective] Church when summoned?""
 ecumenical_council_events.0010.desc.scholasticism.explanation: ""We are asked: may faith seek understanding through reason? Should the schools apply dialectic and philosophy to the ordering and defense of doctrine?""
 ecumenical_council_events.0010.desc.adoptionism.explanation: ""We are asked whether Christ, in his humanity, is Son of [ROOT.Char.GetFaith.HighGodName] by adoption.""
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: ""We are asked whether love of their neighbor must bind every [ROOT.Char.GetFaith.GetAdherentName], even the stranger and the foe, as the sure measure of love for [ROOT.Char.GetFaith.HighGodName].""
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: ""We are asked whether the [ROOT.Char.Custom('GetReligiousRite')], with chant, incense, and ordered rite, is the chief path by which the faithful approach [ROOT.Char.GetFaith.HighGodName].""
 ecumenical_council_events.0010.desc.miaphysitism.explanation: ""We are asked whether, in Christ, the divine and human are one incarnate nature, without division and without confusion.""
 ecumenical_council_events.0010.desc.hesychasm.explanation: ""We are asked: may holy stillness and the simple prayer of the heart — repeated endlessly — grant the soul a vision of [ROOT.Char.GetFaith.HighGodNamePossessive|U] uncreated light?""
 ecumenical_council_events.0010.desc.anachoresis.explanation: ""We are asked whether withdrawal from the world is holy. Is the hermit's solitude a true path to [ROOT.Char.GetFaith.HighGodName]?""
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: ""We are asked: is the spirit enriched when the body submits to fasting, the hair shirt, and the scourge?""
 ecumenical_council_events.0010.desc.holy_myron.explanation: ""We are asked whether holy [Glossary( 'chrism', 'CHRISM_GLOSS' )] should seal baptism and coronation with the gift of the Holy Spirit.""
 CHRISM_GLOSS: "Greek for "anointing." Consecrated by a bishop, #bold chrism#! is the fragrant holy oil used to anoint the faithful at baptism and confirmation, and sometimes at a royal coronation."
 ecumenical_council_events.0010.desc.khachkar.explanation: ""We are asked: may carved crosses of stone rise among us as lasting public witnesses of the faith, marking holy ground and the dead?""
 ecumenical_council_events.0010.desc.philanthropia.explanation: ""We are asked: is care of the poor a binding duty of the [ROOT.Char.GetFaith.GetAdjective] Church? Must we fund alms, hospitals, and houses of mercy?""
 ecumenical_council_events.0010.desc.aniconism.explanation: ""We are asked whether every holy image must be cast from our churches. Is their veneration truly the idolatry of worldly images, drawing our eyes and minds away from [ROOT.Char.GetFaith.HighGodName]?""
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: ""We are asked: must Scripture be searched for hidden spiritual senses? May Greek learning and allegory unlock what the bare words conceal?""
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: ""We are asked: is taking the cross and marching under holy purpose an act of devotion to Christ? May the sword guard pilgrimage and reclaim what the unbelievers hold?""
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: ""We are asked: do the pleasures of the flesh draw the soul nearer to the divine? Should desire be honored and sought, not shunned as sin?""
 ecumenical_council_events.0010.desc.communal_identity.explanation: ""We are asked whether faith and peoplehood are one under [ROOT.Char.GetFaith.HighGodName]. Must outsiders remain outside the true flock?""
 ecumenical_council_events.0010.desc.communion.explanation: ""We are asked whether shared sacred rites invoke the presence of [ROOT.Char.GetFaith.HighGodName]. Must those who will not join us in them be counted outside the true flock?""
 ecumenical_council_events.0010.desc.consolamentum.explanation: ""We are asked: may a final spiritual cleansing near death wash away all sin, and must the cleansed afterward refuse food and life, lest sin return?""
 ecumenical_council_events.0010.desc.divine_marriage.explanation: ""We are asked whether marriage must stay within the sacred bloodline, and even among kin whose nearness the [ROOT.Char.GetFaith.GetAdjective] Church would call forbidden.""
 ecumenical_council_events.0010.desc.gnosticism.explanation: ""We are asked: does salvation rest in hidden knowledge, revealed only to the initiated, that frees the divine spark and restores it to the source?""
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: ""We are asked: should friars possess nothing? Should they wander from town to town, fed by alms, to preach the Word of [ROOT.Char.GetFaith.HighGodName]?""
 ecumenical_council_events.0010.desc.pacifism.explanation: ""We are asked: has the sword no place in the life of a [ROOT.Char.GetFaith.GetAdherentName]? Is the idea of a just war false?""
 ecumenical_council_events.0010.desc.pentarchy.explanation: ""We are asked: is the [ROOT.Char.GetFaith.GetAdjective] Church to be governed by five patriarchal sees in collegial rule? Would this deny the primacy of [ROOT.Char.GetFaith.HighGodNamePossessive] chief intercessor?""
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: ""We are asked: must the faith endure unyieldingly through persecution, hardship, and doubt? Are we bound to stand firm, no matter the cost?""
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: ""We are asked whether we best serve [ROOT.Char.GetFaith.HighGodName] by taking vows of poverty, as the Apostles did.""
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: ""We are asked: must the flock be left alone, to keep their own ways? Should the [ROOT.Char.GetFaith.GetAdjective] Church distrust outsiders and refuse their interference?""
 ecumenical_council_events.0010.desc.adaptive.explanation: ""We are asked whether demanding universal adherence to our customs and restriction harms the flock. So long as the heart of our faith is unaltered, may our laws be adapted to the world they must exist in?""
 ecumenical_council_events.0010.desc.esotericism.explanation: ""We are asked whether the mysteries of [ROOT.Char.GetFaith.HighGodName] compel us to seek knowledge of the world around us.""
 ecumenical_council_events.0010.desc.legalism.explanation: ""We are asked: must sacred law bind each act of [ROOT.Char.GetFaith.GetAdjective] life? Can no sinner, however royal or imperious, be above its strictures?""
 ecumenical_council_events.0010.desc.literalism.explanation: ""We are asked: is holy scripture immutable and complete, the sole repository of [ROOT.Char.GetFaith.HighGodNamePossessive] wisdom?""
 ecumenical_council_events.0010.desc.reincarnation.explanation: ""We are asked: does the soul return through many lives instead of facing [ROOT.Char.GetFaith.HighGodNamePossessive] judgment only once?""
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: ""We are asked: may doctors of the [ROOT.Char.GetFaith.GetAdjective] Church issue binding rulings on each new question of faith and law?""
 ecumenical_council_events.0010.desc.struggle_submission.explanation: ""We are asked whether [ROOT.Char.GetFaith.GetAdjective] life must form itself around struggle and submission. Must the believer yield wholly to [ROOT.Char.GetFaith.HighGodNamePossessive|U] will?""
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: ""We are asked whether a [ROOT.Char.GetFaith.GetAdherentName] may feign another faith under persecution.""
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: ""We are asked: may unbelievers remain under [ROOT.Char.GetFaith.GetAdjective] rule by paying a tax for protection?""
 ecumenical_council_events.0010.desc.asceticism.explanation: ""We are asked: is [ROOT.Char.GetFaith.HighGodName] sought through hunger, want, and the denial of all bodily comfort?""
 ecumenical_council_events.0010.desc.bhakti.explanation: ""We are asked: should each soul bind itself, in loving devotion, to one aspect of the divine?""
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: ""We are asked whether all harm to living things is forbidden. Should we avoid harm even to lowly beasts and insects?""
 ecumenical_council_events.0010.desc.inner_journey.explanation: ""We are asked whether [ROOT.Char.GetFaith.HighGodName] is sought chiefly through contemplation and knowledge of the self.""
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: ""We are asked: is it our sacred duty to welcome any stranger to our table?""
 ecumenical_council_events.0010.desc.adorcism.explanation: ""We are asked: are the spirits of this world to be honored and welcomed, that they may aid us? Or should these be cast out as unclean powers?""
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: ""We are asked: are our ancestors to be honored with prayers and offerings, that they may guard and guide us?""
 ecumenical_council_events.0010.desc.astrology.explanation: ""We are asked: is [ROOT.Char.GetFaith.HighGodNamePossessive] will written in the stars? Do the heavens know the secrets of our fates?""
 ecumenical_council_events.0010.desc.hedonistic.explanation: ""We are asked: is pleasure a gift to be pursued as a form of worship?""
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: ""We are asked whether human life may be offered on the altar. May blood be shed for [ROOT.Char.GetFaith.HighGodName] as a sacred gift?""
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: ""We are asked: are certain souls marked from birth for sacred power and spiritual leadership, ahead of any anointing by the [ROOT.Char.GetFaith.GetAdjective] Church?""
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: ""We are asked whether the [ROOT.Char.GetFaith.GetAdjective] calendar should be bounteous with holy feasts, to bind the faithful together.""
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: ""We are asked whether childbirth must be prepared for with sacred rites. Must the place of birth be cleansed so that [ROOT.Char.GetFaith.HighGodName] may bless mother and child?""
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: ""We are asked whether forest grove, rushing river and dew-kissed valley are holy. Is it in the wilds that we should seek [ROOT.Char.GetFaith.HighGodName]?""
 ecumenical_council_events.0010.desc.sun_worship.explanation: ""We are asked if we should direct our prayers to the sun. Is this life-giving light our [ROOT.Char.GetFaith.HighGodName]?""
 ecumenical_council_events.0010.desc.warmonger.explanation: ""We are asked: are war and conquest a holy service in themselves? Is the sword the surest way to spread the word of [ROOT.Char.GetFaith.HighGodName]?""
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: ""We are asked whether holy days may be marked with blood and cruel spectacle. Is such revelry true worship before [ROOT.Char.GetFaith.HighGodName]?""
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: ""We are asked whether the high places and the roots of the earth are holy. Should we seek [ROOT.Char.GetFaith.HighGodName] upon the summits and along hidden trails of stone?""
 ecumenical_council_events.0010.desc.household_gods.explanation: ""We are asked: may the gods of hearth and home be honored and served within [ROOT.Char.GetFaith.GetAdjective] households?""
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: ""We are asked: may the rites and canon of the distant East be woven into our faith?""
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: ""We are asked: may we learn from the faiths of the East — creeds that live side by side and do not name each other evil — though we do not share their gods?""
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: ""We are asked: may the old folk customs of new converts be left intact, quietly learned from instead of cast down and condemned?""
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: ""We are asked: may those outside Christ still honor His teaching and example while denying Him as the true God?""
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: ""We are asked: may the law of the Saracens be brought into the [ROOT.Char.GetFaith.GetAdjective] Church, their teachings blended with the Gospel?""
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: ""We are asked whether the law and learning of the Jews should be received into the [ROOT.Char.GetFaith.GetAdjective] Church, even if we do not share all their claims.""
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: ""We are asked: is pain itself holy? Is inflicting it a blessing, and receiving it a grace from [ROOT.Char.GetFaith.HighGodName|U]?""
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: ""We are asked: is holiness found in forsaking cities and embracing a life in the wilds, a return to the first state of being?""
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: ""We are asked: is dominion over this world a sacred end? Will seizing power fulfill [ROOT.Char.GetFaith.HighGodNamePossessive] will?""
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: ""We are asked: may the flesh of the dead be consumed as a sacred rite?""
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: ""We are asked: may deception be holy? May the faithful lie, and even come to believe those lies, when truth would endanger the faith?""
 ecumenical_council_events.0010.desc.polyamory.explanation: ""We are asked: may the faithful share love with many, casting away the claim that any soul owns another's affection?""
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: ""We are asked whether human life may be offered in sacred ceremony. May the willing give themselves, and the guilty be given, upon [ROOT.Char.GetFaith.GetAdjective] altars?""
 ecumenical_council_events.0010.desc.megaliths.explanation: ""We are asked: must great monuments of stone be built as testaments to [ROOT.Char.GetFaith.HighGodNamePossessive] enduring glory?""
 ecumenical_council_events.0010.desc.communal_possessions.explanation: ""We are asked whether the faithful must hold all possessions in common.""
 ecumenical_council_events.0010.desc.pure_land.explanation: ""We are asked: is the blessed realm beyond suffering reached by trust and devotion alone, not by wealth, study, or ritual mastery?""
 ecumenical_council_events.0010.desc.no_mind.explanation: ""We are asked: is [ROOT.Char.GetFaith.HighGodName] sought through emptiness of mind and a silence of the self?""
 ecumenical_council_events.0010.desc.mountain_worship.explanation: ""We are asked: are the high places indeed high and holy? Is [ROOT.Char.GetFaith.HighGodName] best sought on the mountain top?""
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: ""We are asked: does this age grow dark, with demons abroad in pious guise? Must we slay such foes to defend the sacred law as it decays?""
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: ""We are asked: should the heads of the slain be made into sacred trophies?""
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: ""We are asked whether the seeking of knowledge is a sacred duty.""
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: ""We are asked whether just rule is a sacred charge [ROOT.Char.GetFaith.GetAdjective] princes must abide by.""
 ecumenical_council_events.0010.desc.filial_piety.explanation: ""We are asked: is the honoring of our parents and elders mandated by [ROOT.Char.GetFaith.HighGodName]?""
 ecumenical_council_events.0010.desc.harmonious_society.explanation: ""We are asked: is social harmony, each soul in its place, the heart of [ROOT.Char.GetFaith.GetAdjective] order?""
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: ""We are asked: may destruction be holy in itself? Is the tearing down of the old what [ROOT.Char.GetFaith.HighGodName] demands of us?""
 ecumenical_council_events.0010.desc.preservation.explanation: ""We are asked: does holiness rest in what is built and preserved? Must [ROOT.Char.GetFaith.GetAdjective] temples and works be tended so they may flourish forever?""
 ecumenical_council_events.0010.desc.takamin.explanation: ""We are asked: is the mighty bear a vessel of the divine? Must the hunt honor the great beast as sacred and slay it only with holy respect?""
 ecumenical_council_events.0010.a_1: "It will replace [current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_2: "I will make room by removing [current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_3: "[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)] must go."
 ecumenical_council_events.0010.b: "Prohibit the practice!"
 ecumenical_council_events.0010.c: "For now, I will simply allow its observance."
 ecumenical_council_events.0010.d: "Let us, at least, acknowledge this tenet."
 
 ecumenical_council_events.0011.t: "$ecumenical_council_events.0010.t$"
 ecumenical_council_events.0011.desc.intro: "$ecumenical_council_events.0010.desc.intro$"
 ecumenical_council_events.0011.desc.outro: "Our host [host.GetTitledFirstName] proclaims:\n\n"I propose to make [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]"
 ecumenical_council_events.0011.desc.permit: "permitted.""
 ecumenical_council_events.0011.desc.prohibit: "prohibited.""
 ecumenical_council_events.0011.desc.learn: "known.""
 ecumenical_council_events.0011.desc.make_core: "core, replacing [core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )]""
 ecumenical_council_events.0011.a: "I vote for change."
 ecumenical_council_events.0011.b: "I disagree."
 
 ecumenical_council_events.0020.t: "Debate [ec_debate_topic_2.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]"
 ecumenical_council_events.0020.desc.intro: "The second debate examines [ec_debate_topic_2.GetName( ROOT.GetCharacter.GetRite )]. Current canonical law upholds its status as [host.Custom('GetEcumenicalDebateTenet2StatusText')|l]. [lead_portrait.GetTitledFirstName] begins:\n\n"
 ecumenical_council_events.0020.desc.intro_permit_promote: "$ecumenical_council_events.0010.desc.intro_permit_promote$"
 ecumenical_council_events.0020.desc.intro_permit_demote: "$ecumenical_council_events.0010.desc.intro_permit_demote$"
 ecumenical_council_events.0020.desc.intro_core_demote_bad: "$ecumenical_council_events.0010.desc.intro_core_demote_bad$"
