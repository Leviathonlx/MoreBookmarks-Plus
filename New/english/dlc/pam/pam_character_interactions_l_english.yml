pam_interactions_events.0094.opening: "Rightful [ROOT.Char.GetTitleAsName]!"
pam_interactions_events.0094.desc_conversion: "Send forth the word of [cleric.GetFaith.HighGodName] through [target.GetNameNoTier]! Spare not the rod upon its wayward people, nor the might of your [ROOT.Char.Custom('GetFighterTermPlural')] in defense of the virtues of the land.\n\nThe [target.GetTierAsNameNoTooltip] is yours to rule. It is submitted to the providence of every [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetTitleAsName], #EMP de jure#! until the very end of time."
pam_interactions_events.0094.desc: "It is a blessed day for the [cleric.GetFaith.GetAdherentNamePlural] of [target.GetNameNoTooltip]! Oh, how they have yearned to be made one with their brothers and sisters in [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!\n\nWhat has lived in [target.GetAdjectiveNoTooltip] hearts is made into law by [cleric.GetFaith.HighGodNamePossessive] [cleric.GetTitleAsName]: the sovereigns of many lands now acknowledge the [target.GetTierAsNameNoTooltip] as a #EMP de jure#! realm of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
pam_interactions_events.0094.a: "[target.GetNameNoTierNoTooltip] and [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] are bound eternal."

pam_interactions_events.0095.opening: "[ROOT.Char.GetTitleAsName] of [target_county.GetNameNoTier] and sundry lands,"
pam_interactions_events.0095.desc: "You are subject to a benediction from [cleric.GetFaith.HighGodName]! In [cleric.GetFaith.HighGodHerHis|U] wisdom, [cleric.GetFaith.HighGodNameSheHe|U] has placed all [target.GetName] under the eternal protection of the [de_jure_master.GetTitleAsName] of [de_jure_master.GetPrimaryTitle.GetName].\n\nAs [cleric.GetTitleAsName], I issue this decree on behalf of the [target.GetAdjectiveNoTooltip] [cleric.GetFaith.GetAdherentNamePlural], the [de_jure_master.GetTitleAsNameNoTooltip], and those who know the wisdom in this #EMP de jure#! dividing of [cleric.GetFaith.HighGodNamePossessive] mortal realms."
pam_interactions_events.0095.a: "Damn the greed of the [de_jure_master.GetFaith.GetAdherentNamePluralNoTooltip]!"
pam_interactions_events.0095.a_same_faith: "Indeed, who can distribute realms but [ROOT.Char.GetFaith.HighGodName]."
