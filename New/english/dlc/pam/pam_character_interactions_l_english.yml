pam_interactions_events.0084: "This war you wage against [puppet_or_actor.GetTitledFirstName] is not one sanctioned by the Church! I command you to cease this needless bloodshed against a fellow [puppet_or_actor.GetFaith.GetReligion.GetAdherentName], and abandon the [white_peace_war.GetName]."
pam_interactions_events.0084.defender: "The war [puppet_or_actor.GetTitledFirstName] wages against you is not one sanctioned by the Church! I command you to cease this needless bloodshed against a fellow [puppet_or_actor.GetFaith.GetReligion.GetAdherentName], and abandon the [white_peace_war.GetName]."
pam_interactions_events.0084.a: "I will comply."
