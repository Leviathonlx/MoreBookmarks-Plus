# Clerical land transfer events

# player Priest refuses event
pam_interactions_events.0031.opening: "My willful [actor.Custom('GetDaughterSon')],"
pam_interactions_events.0031.desc: "[actor.GetFaith.HighGodName] gave you lips to speak just words. [actor.GetFaith.HighGodName] gave you hands to wield a sword. And [actor.GetFaith.HighGodName] gave [actor.GetFaith.PriestNeuterPlural] to the world so you could heed their wisdom. \n\nConsumed by greed, you speak unjust words. Beset with fearful doubt, you stay the sword you lust to use against [target.GetNameNoTier].\n\nAnd so the matter comes to this: you must heed my wisdom... and leave the [target.GetTierAsName] be."
pam_interactions_events.0031.a: "The [secondary_recipient.GetTitleAsNameNoTooltip] refuses my cause!"

# Player clergy response event
pam_interactions_events.0033.opening: "Keeper of heavenly and earthly order,"
pam_interactions_events.0033_de_jure: "I seek your aid. Proclaim that my rule justly extends over [target.GetName] — which is mine by de jure right. Arm me with your sanction, so I may bloodlessly convince [recipient.GetName].\n\n"
pam_interactions_events.0033_claim: "I seek to fulfill my claim on [target.GetNameNoTier]. Grant me your holy sanction, so [recipient.GetName] may hand over the [target.GetTierAsName] without [actor.GetFaith.GetAdjective] blood being shed.\n\n"
pam_interactions_events.0033_threaten: "If you should refuse me this request... it is #EMP you#! who can explain to [ROOT.Char.GetFaith.HighGodName] the great slaughter and burning I'd bring to [target.GetNameNoTierNoTooltip]."
pam_interactions_events.0033_succession: "If you speak on my behalf, I offer the following promise: should I die as [actor.GetTitleAsName] of [actor.GetPrimaryTitle.GetNameNoTier] — with no children of my house — [actor.GetPrimaryTitle.GetNameNoTier] will then belong to the church."
pam_interactions_events.0033_pilgrimage: "In return for your sacred assent in this earthly matter, I promise to undertake a pilgrimage: an act of gratitude for the blessings given to me by [actor.GetFaith.HighGodName]."
pam_interactions_events.0033_use_hook: "Surely, you have not forgotten... that your name is inscribed at my command, and the words of your pen must be those of my whims...?"
pam_interactions_events.0033_offer_hook: "Lending your pious reputation to my cause is no small favor. Back me in these mortal politics, and I shall back you in days to come."
pam_interactions_events.0033_donate: "Lend me your aid, enrich my realm with lands, and I would gladly donate to your pious coffers."
pam_interactions_events.0033_fallback: "Unless begun by a holy intercessor, these negotiations for land and title will come to nothing. Will you lend your sacred authority to my cause?"
pam_interactions_events.0033.aa: "Yes. It is done."
pam_interactions_events.0033.a: "[target.GetNameNoTierNoTooltip] must be [actor.GetFirstNamePossessiveNoTooltip], by my decree."
pam_interactions_events.0033.a.tt: "Send [recipient.GetTitledFirstNameNoTooltip] a missive: to cling to [recipient.GetHerHis] wrongly-held land is to scorn [secondary_recipient.GetFaith.HighGodName] and the [secondary_recipient.GetTitleAsNameNoTooltip]!"
pam_interactions_events.0033.b: "I cannot sanction this impertinent demand."
pam_interactions_events.0033.b.tt: "The world is well-ordered as it is. [recipient.GetTitledFirstNameNoTooltipRegnal] must keep [target.GetNameNoTierNoTooltip]."
clergy_land_inform_priest_might_fail_tt: "@warning_icon! #X #bold [actor.GetShortUIName] will attempt to convince [recipient.GetShortUIName] to give [target.GetName] to [actor.GetHerHim], and may fail#!#!"
clergy_land_inform_priest_can_force_tt: "@alert_icon! #alert_trial #bold [actor.GetShortUIName] may force [recipient.GetShortUIName] to give [target.GetName] to [actor.GetHerHim], but may choose to risk failure instead#!#!"
clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.GetShortUIName] will give [target.GetName] to [actor.GetShortUIName] without resistance#!#!#!"
high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold Your [GetLaw('church_authority_3').GetName] [law|E] allows you to force [recipient.GetShortUIName] to give [target.GetName] to [actor.GetShortUIName] without resistance#!#!#!"

# recipient receives letter and option to immediately accept
pam_interactions_events.0032.opening: "As holy arbiter, I hereby begin negotiations."
pam_interactions_events.0032_intro: "You have cared for [target.GetNameNoTier] ably, but it is the will of [recipient.GetFaith.HighGodName] that this [target.GetTierAsNameNoTooltip] belong to [actor.GetName]. Please, can we have you cede this land to [actor.GetHerHim] without bloodshed?\n\n"
pam_interactions_events.0032_de_jure: "For [target.GetNameNoTierNoTooltip] is [actor.GetHersHis] by #EMP de jure#! right."
pam_interactions_events.0032_claim: "For, in the eyes of the Almighty, [actor.GetHerHis] claim to [target.GetNameNoTierNoTooltip] is the truest of all."
pam_interactions_events.0032.aa: "Now, where's my pen..."
pam_interactions_events.0032.aa.flavor: "To all the world, shall I prove it so: that [recipient.GetFaith.HighGodName] denied these sinful charlatans every [recipient.GetFaith.GetAdjectiveNoTooltip] virtue. All they possess — and shall ever possess — is shameless temerity."
clergy_interaction_scholar_block_tt: "#P #bold #EMP [actor.GetShortUINamePossessive] attempt to gain [target.GetName] fails#!#!#!"
pam_interactions_events.0032.a: "If [actor.GetFaith.HighGodName] wishes it, I shall give up [target.GetNameNoTierNoTooltip]."
pam_interactions_events.0032.b: "No. I am unconvinced by you both."
pam_interactions_events.0032.b.tt: "If only [actor.GetTitledFirstNameNoTooltip] and [secondary_recipient.GetTitledFirstNameNoTooltip] could be so easily silenced..."
clerical_land_transfer_actor_attempt_tt: "@alert_icon! #alert_trial #bold May induce you to accept [actor.GetHerHis] seizure of [target.GetName] with one of the following methods:#!#!"

# Actor picks negotiation tactic after interaction 
pam_interactions_events.0030.t: "Negotiations for [target.GetNameNoTierNoTooltip]"
pam_interactions_events.0030.desc_intro_envoy: "On sacred ground, my envoy [secondary_recipient.GetTitledFirstNameRegnal] makes my case for [target.GetNameNoTier]."
pam_interactions_events.0030.desc_intro: "With the blessing of [secondary_recipient.GetTitledFirstNameRegnal] and the protection of sacred ground, I make my case for [target.GetNameNoTier]."
pam_interactions_events.0030.desc: "Words of peaceful concord, laced with threats of war. Declarations of my ordained rights. And on, and on...\n\n"
pam_interactions_events.0030.desc_target: "[recipient.GetTitledFirstNameNicknamed] will not be cast from [recipient.GetHerHis] [target.GetTierAsNameNoTooltip] so cheaply. This matter of land must be sealed by earthly promises, or with wicked threats."
pam_interactions_events.0030.desc_vassal: "[recipient.GetTitledFirstNameNicknamed] will not loose [recipient.GetHerHis] grip on [vassal.GetName] so cheaply. By gilded offers or with fearsome threats: my vassal must be earned."
pam_interactions_events.0030.a: "Remind [recipient.GetFirstNameNoTooltip] [recipient.GetSheHe] has certain... obligations."
pam_interactions_events.0030.a.flavor: "And that it is the [actor.GetTitleAsNameNoTooltip] of [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] who can call upon them!"
pam_interactions_events.0030.b: "I need no [ROOT.Char.Custom2('RelationToMe', recipient)]. I need [target.GetNameNoTierNoTooltip]."
pam_interactions_events.0030.b.flavor: "Make it plain: if [recipient.GetFirstNameNoTooltip] refuses this, [recipient.GetSheHe] is nothing to you."
pam_interactions_events.0030.c: "If [recipient.GetSheHe] will not yield, disgrace this holy ground."
pam_interactions_events.0030.c.tt: "Lambast the filthy sinner with vile accusations! Call forth damnation and scorn on you both! [secondary_recipient.GetTitledFirstNameNoTooltip] and all the other [actor.GetFaith.PriestNeuterPlural] will make [recipient.GetFirstNameNoTooltip] yield!"
pam_interactions_events.0030.d: "Threaten to make a delegitimizing scandal of this."
pam_interactions_events.0030.d.flavor: "The little-respected [recipient.GetTitleAsNameNoTooltip] can hardly last, if names and reputations are placed on the line..."
pam_interactions_events.0030.e: "Simply offer to buy the [target.GetTierAsNameNoTooltip]."
pam_interactions_events.0030.f: "I leave this to [ROOT.Char.GetFaith.HighGodName], and [recipient.GetFirstNamePossessiveNoTooltip] judgement."
clergy_land_no_method_warning_tt: "@warning_icon!#X #bold With no incentives given, it is unlikely [recipient.GetShortUIName] will accept!#!#!"
clergy_land_no_method_warning_soft_tt: "@alert_icon! #alert_trial With no incentives given, [recipient.GetShortUIName] is less likely to accept#!"

# recipient receives actor's negotiation tactic
pam_interactions_events.0034.t: "The Disputing of [target.GetNameNoTierNoTooltip]"
pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.GetTitledFirstNameRegnal] argues further after [target.GetNameNoTier] on [actor.GetNamePossessive] behalf — on the behalf too, [secondary_recipient.GetSheHe] claims, of [recipient.GetFaith.HighGodNamePossessive] earthy order and all the [recipient.GetFaith.GetAdjective] clergy."
pam_interactions_events.0034.desc_intro: "[actor.GetName] makes [actor.GetHerHis] case for [target.GetNameNoTier]: [actor.GetSheHe] retreads the demand protected and endorsed by the [recipient.GetFaith.GetAdjective] faith."
pam_interactions_events.0034.desc_vassal: "Never mind that I am sworn the loyalty of [target.GetHolder.GetName] unto death. That loyalty, it seems, can be bargained for."
pam_interactions_events.0034.desc_target: "Never mind that the [target.GetTierAsNameNoTooltip] is mine by blood and conquest. Anything on this earth can be bargained for."
pam_interactions_events.0034.desc: "\n\nApproached on holy ground, I bear these assaults on my rights in peace. I may only contemplate what is offered...\n\n"
pam_interactions_events.0034.desc_method_hook: "The promise that the obligations held over me by [actor.GetTitledFirstNameNoTooltip] will be made null."
pam_interactions_events.0034.desc_method_relation: "A ruinous end to all warmth, trust and love between us. [actor.GetHerHim|U] heart, according to [actor.GetFirstNameNoTooltip], rests on this matter of land.\n\n[actor.GetSheHe|U] will hate me forever for denying her this."
pam_interactions_events.0034.desc_method_piety: "The threat of my already-tenuous relationship with the faith meeting utter ruin. This would impugn [actor.GetTitledFirstNameNoTooltip] too, but [actor.GetHerHis] piety is better-established than mine."
pam_interactions_events.0034.desc_method_legitimacy: "A grave threat against my legitimacy. A hideous public squabble over [target.GetNameNoTierNoTooltip], a scandal that makes laughing-stocks of us both..."
pam_interactions_events.0034.desc_method_gold: "A heap of glittering coin. A fitting price, the [actor.GetTitleAsNameNoTooltip] claims, for a [target.GetTierAsNameNoTooltip]."
pam_interactions_events.0034.desc_no_method: "...#EMP nothing at all#!. There is simply the demand made for [target.GetNameNoTier], and the assumption that I fear the scorn of [recipient.GetFaith.PriestNeuterPlural] and the horrors of war."
pam_interactions_events.0034.a: "[actor.GetSheHe|U] may raise [actor.GetHerHis] banner over [target.GetNameNoTierNoTooltip]."
pam_interactions_events.0034.b: "As long as I live, the [target.GetTierAsNameNoTooltip] is mine."

pam_interactions_events.0035.t: "[target.GetNameNoTierNoTooltip], Acquired"
pam_interactions_events.0035.desc_intro: "After some deliberation, [recipient.GetFirstNameNicknamed] gives in! Negotiations for the cession of [target.GetNameNoTier] are swift and fruitful.\n\n[secondary_recipient.GetTitledFirstNamePossessive] decree of my rights is fulfilled."
pam_interactions_events.0035.desc_hook: "The obligation I held over [recipient.GetFirstNameNoTooltip] has been honorably met."
pam_interactions_events.0035.desc_relation: "Yes, bitter tears are shed, joy and admiration ended. I have grievously harrowed [recipient.GetFirstNameNoTooltip] for want of [target.GetNameNoTierNoTooltip]. But..."
pam_interactions_events.0035.desc_piety: "And, thus, my threats to drown both [recipient.GetFirstNameNoTooltip] and myself in wicked ignominy... need not be realized."
pam_interactions_events.0035.desc_legitimacy: "And, thus, my threats of controversy and slander... need not be realized." 
pam_interactions_events.0035.desc_gold: "With word sent out to my coin-keepers and creditors, the price I willingly pay."
pam_interactions_events.0035.desc_fallback: "Such power [actor.GetFaith.HighGodName] invested in our [actor.GetFaith.GetAdjective] [actor.GetFaith.PriestNeuterPlural], and in me! With no need of armies or war-making — the world is reordered by our command." 
pam_interactions_events.0035.desc_vassal: "\n\n[vassal.GetName] shall swear [vassal.GetHerHis] loyalty to me."
pam_interactions_events.0035.desc: "\n\nThe [target.GetTierAsNameNoTooltip] is mine."
pam_interactions_events.0035.a: "All over [target.GetNameNoTierNoTooltip], raise my banners high!"

pam_interactions_events.0036.t: "[target.GetNameNoTierNoTooltip], Denied"
pam_interactions_events.0036.desc_intro_afraid_admin: "[recipient.GetTitledFirstName] gives [recipient.GetHerHis] response guarded by doughty soldiers, ill at ease despite [secondary_recipient.GetTitledFirstNamePossessive] peaceable mediation:\n\n"
pam_interactions_events.0036.desc_intro_afraid: "[recipient.GetTitledFirstName] gives [recipient.GetHerHis] response guarded by stout [recipient.Custom('KnightCulturePluralNoTooltip')|l], ill at ease despite [secondary_recipient.GetTitledFirstNamePossessive] peaceable mediation:\n\n"
pam_interactions_events.0036.desc_intro_pious: "[recipient.GetTitledFirstName] gives [recipient.GetHerHis] response alone and unbowed, made bold by [secondary_recipient.GetTitledFirstNamePossessive] peaceable mediation:\n\n"
pam_interactions_events.0036.desc_intro_admin: "[recipient.GetTitledFirstName] gives [recipient.GetHerHis] response flanked by bodyguards, wearing scorn for [secondary_recipient.GetTitledFirstNamePossessive] peaceable mediation:\n\n"
pam_interactions_events.0036.desc_intro: "[recipient.GetTitledFirstName] gives [recipient.GetHerHis] response flanked by stout [recipient.Custom('KnightCulturePluralNoTooltip')|l], wearing scorn for [secondary_recipient.GetTitledFirstNamePossessive] peaceable mediation:\n\n"
pam_interactions_events.0036.desc_hook: ""[target.GetNameNoTierPossessive] place in my heart is above any obligation you could invoke upon me."
pam_interactions_events.0036.desc_relation: ""The [actor.GetTitleAsName] of [actor.GetPrimaryTitle.GetNameNoTier] spits on my heart. Rends my soul to rags. I will hear no more from [actor.GetHerHim]."
pam_interactions_events.0036.desc_piety: ""If refused [target.GetNameNoTier], you will degrade us both with sin and accusation? Very well."
pam_interactions_events.0036.desc_legitimacy: ""Speak your poisonous lies. Turn the people of [target.GetNameNoTier], and all other peoples, against us both."
pam_interactions_events.0036.desc_gold: ""You think you can buy [target.GetNameNoTier] with gold and silver? Far too simple a transaction for such a noble [target.GetTierAsNameNoTooltip]."
pam_interactions_events.0036.desc_fallback: ""Can a [actor.GetTitleAsName] and a [secondary_recipient.GetTitleAsNameNoTooltip] win [target.GetNameNoTier] with but a few simple words...? No."
pam_interactions_events.0036.desc_afraid: "Send [recipient.GetFaith.PriestNeuterPlural], and I will welcome them. Send envoys, and I will treat with them..."\n\n"But I cannot give up the [target.GetTierAsNameNoTooltip] like this.""
pam_interactions_events.0036.desc_pious: "Send more corrupted [recipient.GetFaith.PriestNeuterPlural], send devilish hosts to [target_capital.GetTitle.GetNameNoTier] under arms..."\n\n"I will not give up the [target.GetTierAsNameNoTooltip] [recipient.GetFaith.HighGodName] granted to me.""
pam_interactions_events.0036.desc: "Send more caterwauling [recipient.GetFaith.PriestNeuterPlural], send hosts of [actor.Custom('GetFighterTermPlural')] to [target_capital.GetTitle.GetNameNoTier] under arms..."\n\n"I will not give up the [target.GetTierAsNameNoTooltip] so easily.""
pam_interactions_events.0036.a_relation: "How could [recipient.GetSheHe] refuse me?!?"
pam_interactions_events.0036.a: "Denying the will of a [secondary_recipient.GetTitleAsNameNoTooltip]? Disgraceful..."
clergy_land_transfer_refusal_tt: "Refused to cede [target.GetName] to [actor.GetShortUIName]"

pam_interactions_events.0037.opening: "[ROOT.Char.GetFirstNameNicknamed], [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
pam_interactions_events.0037.desc: "I regret the suddenness of these tidings, but I must inform you: the [actor.GetTitleAsName] of [actor.GetPrimaryTitle.GetNameNoTier] is your liege from henceforth.\n\nSuch is the will of [secondary_recipient.GetTitledFirstNameRegnal], who led the negotiations over your [ROOT.Char.GetPrimaryTitle.GetTierAsName] between [actor.GetTitledFirstNameNicknamed] and myself. As you have been true to [recipient.GetPrimaryTitle.GetNameNoTier], be true to your new liege."
pam_interactions_events.0037_new_liege_tt: "[actor.GetShortUIName] has become your [liege|E]"
pam_interactions_events.0037.a: "My oath is now forfeit. No one can order me hence."
pam_interactions_events.0037.a.tt: "[recipient.GetTitledFirstNameNoTooltip] has ceded [recipient.GetHerHis] suzerainty. And if [actor.GetTitledFirstNameNoTooltip] wishes to take it up... [actor.GetSheHe] must come to [target.GetNameNoTierNoTooltip] well-armed."
pam_interactions_events.0037.b: "[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]? Truly?"
pam_interactions_events.0037.b.tt: "Where once my people gazed toward [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], I suppose they look to [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] now."
