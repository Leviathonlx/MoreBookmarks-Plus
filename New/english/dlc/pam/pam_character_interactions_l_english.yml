pam_interactions_events.0090.opening: "O [puppet_or_actor.GetMotherFather|U] of the Realm,"
pam_interactions_events.0090.desc: "Truly, [recipient.GetFaith.HighGodName] gazes down on [recipient.GetPrimaryTitle.GetNameNoTier] with loving favor! By your pronouncement, I am made [recipient.GetTitleAsName] of the land, and the [recipient.GetFaith.GetAdjective] faithful are made joyous.\n\nWith my life, I will guard this [recipient.GetPrimaryTitle.GetTierAsName]. With my laws, govern wisely. With my sword and scepter, rule firmly. And I will heed well your counsel."
pam_interactions_events.0090.a: "[actor.GetFaith.HighGodName] has granted us a new [recipient.GetTitleAsNameNoTooltip]."
pam_interactions_events.0090.a.flavor: "And, in [actor.GetFaith.HighGodHerHis|U] wisdom... [recipient.GetFirstNameNoTooltip] is a [recipient.GetTitleAsNameNoTooltip] dearly indebted to me."
