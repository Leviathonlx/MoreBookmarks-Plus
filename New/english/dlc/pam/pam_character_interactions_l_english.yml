# Grant claim from clergy accept
pam_interactions_events.0020.opening: "[actor.GetFirstName], O [actor.GetTitledFirstNameNoTooltip] the wrongly bereft!"
pam_interactions_events.0020_threatened: "Stay the punitive duties, the foul censure, the wicked force that you would wield against my [secondary_recipient.GetFaith.GetReligion.GetAdjective] [secondary_recipient.GetFaith.HouseOfWorshipPlural]! Your fearsome resolve will be needed in days to come — for a claim to [target.GetNameNoTier] is yours."
pam_interactions_events.0020_offer_hook: "Your promise to favor [secondary_recipient.GetPrimaryTitle.GetNameNoTier] has stirred my hand, and so I have uncovered your long-ignored right — to claim [target.GetNameNoTier]!"
pam_interactions_events.0020_indebted: "This humble [secondary_recipient.GetFaith.PriestNeuter] is in your debt, and thus I have sought — and found — indisputable proof that [target.GetNameNoTier] rightly belongs to your line, and has been denied you!"
pam_interactions_events.0020: "It is your right to claim [target.GetNameNoTier]: an ancient right by divine providence! I have supplied your council with proof this is so."
pam_interactions_events.0020_end: "\n\n[recipient.GetNameRegnal] will hardly be pleased by this revelation. But [secondary_recipient.GetFaith.FateGodName] does not heed a charlatan's protests."
pam_interactions_events.0020.a.low_zeal: "And so history is rewritten..."
pam_interactions_events.0020.a.high_zeal: "[target.GetNameNoTierNoTooltip] is mine by sacred right!"
 pam_interactions_events.0020.a: "My claim is made, [recipient.GetTitledFirstNameNoTooltip] be damned."
 pam_interactions_events.0020.toast_puppeteer: "[secondary_recipient.GetShortUIName] granted [puppet_or_actor.GetShortUIName] a claim on [target.GetNameNoTier]"

# Grant claim from clergy refuse
pam_interactions_events.0021.opening: "[actor.GetName],"
pam_interactions_events.0021: "If you were meant to rule [target.GetNameNoTier], would not [secondary_recipient.GetFaith.HighGodName] have tendered it unto you by right of birth?\n\nNo, I will not slight [recipient.GetTitledFirstNameRegnal] — and betray our mortal souls, yours and mine both — by writing falsehoods for your wicked cause.\n\nPray on the error of your ways."
 pam_interactions_events.0021.a: "[secondary_recipient.GetFaith.HouseOfWorship|U] walls lend [secondary_recipient.GetHerHim] a fool's courage!"
 pam_interactions_events.0021.toast_puppeteer: "[secondary_recipient.GetShortUIName] refused [puppet_or_actor.GetShortUINamePossessive] request for a claim on [target.GetNameNoTier]"

# Grant claim from clergy - claim's holder event
pam_interactions_events.0022.opening: "Holder of my birthright,"
pam_interactions_events.0022_shrimp: "Though I am a mere [actor.GetTitleAsName], the [actor.GetFaith.GetAdjective] [secondary_recipient.GetFaith.AltPriestTermPlural] have discovered that in my blood runs an ancient claim to all [target.GetName]."
pam_interactions_events.0022_shark: "[target.GetName] belongs among the titles passed from [actor.GetFaith.HighGodName] unto my [actor.Custom('GetTitleTierAdjective')] line. This has always been so, though it was unknown until now."
pam_interactions_events.0022: "Among learned scholars, it has long been known — and is newly proven — that [target.GetName] is mine to claim by right."
pam_interactions_events.0022_end: "\n\n[secondary_recipient.GetTitledFirstNameRegnal] has given his holy sanction to my claim. [secondary_recipient.GetPrimaryTitle.GetName] backs me to the hilt.\n\nAnd so I begin to hope and pray that, one day, I will be welcomed as master of fair [target.GetNameNoTierNoTooltip]..."
pam_interactions_events.0022.a: "Lies! A false claim backed by a false [secondary_recipient.GetFaith.PriestNeuter]!"

# Grant claim from clergy - clergy event
pam_interactions_events.0023.opening: "Holy [secondary_recipient.GetMotherFather],"
pam_interactions_events.0023_shrimp: "If I were armed with a rightful claim, could I not lead [target.GetName] more virtuously than the [actor.Custom2('InsultAdjective', recipient)] [recipient.GetFirstNameRegnal]? Please, permit [actor.GetFaith.HighGodNamePossessive] light to shine on this mere [actor.GetTitleAsName]."
pam_interactions_events.0023_shark: "By [actor.GetFaith.HighGodNamePossessive] will, I am already the master and protector of sundry lands and peoples. Yet [target.GetName] lies beyond my realm, and my rights."
pam_interactions_events.0023: "There is confusion among the faithful. Some dearly wish for me to claim [target.GetName], while others deny I have any right to the title."
pam_interactions_events.0023_end: "\n\nSurely, one as learned as you could #EMP discover#! the needed proof within the histories... and supply me with a sanctioned claim on [target.GetNameNoTierNoTooltip]?"
pam_interactions_events.0023.a: "May [target.GetNameNoTierNoTooltip] be yours, my [actor.Custom('GetDaughterSon')]."
pam_interactions_events.0023.b: "A [secondary_recipient.GetTitleAsNameNoTooltip] mustn't trade in falsehoods."
