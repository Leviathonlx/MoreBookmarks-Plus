pam_interactions_events.0039.opening: "[ROOT.Char.GetFirstName], my loyal servant,"
pam_interactions_events.0039.desc: "I regret the suddenness of these tidings, but I must inform you: I am releasing [target.GetName] to [actor.GetTitleAsName] of [actor.GetPrimaryTitle.GetNameNoTier].\n\nSuch is the will of [secondary_recipient.GetTitledFirstNameRegnal], who led the negotiations over your [ROOT.Char.GetPrimaryTitle.GetTierAsName] between [actor.GetTitledFirstNameNicknamed] and myself. Return to [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] and you soon shall be reassigned."
