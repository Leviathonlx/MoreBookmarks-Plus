pam_interactions_events.0100.t: "Bastard No More"
pam_interactions_events.0100.desc: "In the sight of [ROOT.Char.GetFaith.HighGodName] and the assembled faithful, [actor.GetTitledFirstName] has proclaimed me true-born. The clergy have granted, with holy rites and a stroke of ink, what my birth refused me.\n\nBastard is a name I will not hear again."
pam_interactions_events.0100.a: "The stain is washed away!"
pam_interactions_events.0101.opening: "Blessings upon your house,"
pam_interactions_events.0101.desc: "It is my joy to send you glad tidings. I have declared your [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetFirstNameNoTooltip] true-born before [ROOT.Char.GetFaith.HighGodName].\n\nNo law nor gossip may hold [recipient.GetHerHis] birth against [recipient.GetHerHim] any longer."
pam_interactions_events.0101.a: "Welcome news indeed."

