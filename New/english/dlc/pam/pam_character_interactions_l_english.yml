pam_negotiate_land_possible_acceptance_tt: "To convince [recipient.GetShortUIName] to give over a [title|E], [actor.GetShortUIName] require either:\n$BULLET_WITH_TAB$A [hook_i][hook|E] on [recipient.GetShortUIName]\n$BULLET_WITH_TAB$The [friend|E], [disciple|E] or [soulmate|E] [relation|E]\n$BULLET_WITH_TAB$Higher @piety_icon![piety_level|E]\n$BULLET_WITH_TAB$Higher @legitimacy_icon![legitimacy_level|E]\n$BULLET_WITH_TAB$#high [recipient.MakeScope.ScriptValue('pam_transfer_land_gold_value')]#! @gold_icon![gold|E] or @treasury_icon![treasury|E]\n$BULLET_WITH_TAB$[recipient.GetShortUIName] is @intimidated_icon![intimidated|E] and has less than #high 25%#! of your Military Strength (counting [allies|E])\n$BULLET_WITH_TAB$[recipient.GetShortUIName] is @terrified_icon![cowed|E] and has less than #high 50%#! of your Military Strength (counting [allies|E])"
