pam_interactions_events.0097.opening: "My [ROOT.Char.Custom('GetTitleTierAdjective')] child,"
pam_interactions_events.0097.desc: "Your petition is granted. [target.GetName] lay vacant while the [ROOT.Char.GetFaith.GetAdherentName] souls there went unshepherded, a poor way to honor [ROOT.Char.GetFaith.HighGodName].\n\nWear it humbly. A [title|E] the Church bestows remains the Church's concern."
pam_interactions_events.0097.desc_holy_war: "Your petition is granted, and your vow is written down where it will not be forgotten. [target.GetName] is yours, yet part of it still bows to those who deny [ROOT.Char.GetFaith.HighGodName].\n\nGo and take what your title already names as yours. No faithful [ROOT.Char.GetFaith.PriestNeuter] will question your war, but five years from now we shall ask what came of it, and a vow left idle is a vow broken."
