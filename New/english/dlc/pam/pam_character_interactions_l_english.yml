 pam_interactions_events.0002.opening: "[ROOT.Char.GetTitledFirstNameRegnal],"
pam_interactions_events.0002: "The symbols of your authority already fill your hands, festoon your body... what need have you for the reverent voices that serve [recipient.GetFaith.HighGodName]? Brutal force, dark deeds, and hideous plots are all yours to wield.\n\nGuard your [ROOT.Char.Custom('GetTitleTierAdjective')] finery well. For the servants of [recipient.GetFaith.HighGodName] will take no part in your keeping it."
