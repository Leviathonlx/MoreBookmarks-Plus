pam_interactions_events.0050.opening: "[recipient.GetTitledFirstNameRegnal],"
pam_interactions_events.0050.desc: "In [puppet_or_actor.GetFaith.ReligiousText], marriage is a holy union. In the living world of men and women... it is rather less perfect.\n\nYou have refused to separate [secondary_recipient.GetTitledFirstName] and me. What are we to do with the shambles that remains...?"
pam_interactions_events.0050.aa: "It is carnal desire that brings you misery."
pam_interactions_events.0050.aa.tt: "Teach this loveless lout what [puppet_or_actor.GetSheHe] needs to forsake all needs and expectations of the flesh..."
pam_interactions_events.0050.a: "The paths to [recipient.GetFaith.PositiveAfterLife]? Love. Devotion."
pam_interactions_events.0050.a.tt: "By your guidance, this nearly-broken couple may find salvation in one another."
pam_interactions_events.0050.b: "Honor the vows you gave before [recipient.GetFaith.GoodGodNames]."
pam_interactions_events.0050.c: "This scorn for holy matrimony is blasphemy!"
pam_interactions_events.0050.d: "Pray, together, for [recipient.GetFaith.HighGodNamePossessive] guidance."

 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nIt is an incestuous union, an unnatural arrangement, you would be ending!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nOur [puppet_or_actor.GetFaith.GetAdjective] faith compels me to rid this [secondary_recipient.GetWomanMan] from my bed!."
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE: "\n\nNote that [secondary_recipient.GetFirstNameNoTooltip] stands accused of piteous impotence..."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER: "\n\n[secondary_recipient.GetFirstNameNoTooltip] openly commits vile incest, in contempt of our union! It is a disgrace!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING: "\n\n[secondary_recipient.GetFirstNameNoTooltip] has not been faithful to me, and all know it!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH: "\n\n[puppet_or_actor.GetFaith.HighGodName] means for me to be married to man! And [secondary_recipient.GetFirstNameNoTooltip]... has no manhood to speak of."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER: "\n\nBy [puppet_or_actor.GetFaith.HighGodName], my demon of a [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] tried to have me murdered!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS: "\n\n[secondary_recipient.GetFirstNameNoTooltip] is a polygamist! I am not but a single head among [secondary_recipient.GetHerHis] herd of chattel. Release me!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH: "\n\nSurely, [puppet_or_actor.GetFaith.HighGodName] does not wish for me to keep sharing my bed with a vile [secondary_recipient.GetFaith.GetAdjective] heathen?"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT: "\n\nWhy I beg this of you is no secret! [secondary_recipient.GetFirstNameNoTooltip], the lecherous [puppet_or_actor.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))] has been disloyal to me."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY: "\n\nOur marriage is childless, and has no hope of ever bearing fruit."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED: "\n\nYou must fabricate some justification, but by [puppet_or_actor.GetFaith.HighGodName]! My hatred for [secondary_recipient.GetFirstNameNoTooltip] should be cause enough on its own."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED: "\n\nI bring no legal justification... but trust in your mastery of religious law to #EMP discover#! grounds for annulment."


