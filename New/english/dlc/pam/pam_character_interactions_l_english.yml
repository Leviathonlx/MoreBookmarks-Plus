ecclesiastical_bestow_title_interaction: "Bestow Title"
ecclesiastical_bestow_title_interaction_desc: "Using your spiritual authority, grant a currently uncreated [title|E] directly to [recipient.GetShortUIName], potentially increasing [recipient.GetHerHis] [rank|E]"
