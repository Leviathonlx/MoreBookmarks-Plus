pam_interactions_events.0072.opening: "Vile [recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)],"
pam_interactions_events.0072.desc_joined_war: "I come to you now. As a missionary, to bring light to your darkness. As a [puppet_or_actor.GetMotherFather], to bring punishment.\n\nAnd by your [puppet_or_actor.Custom('MotherFatherPossessive')] side comes a warrior of [puppet_or_actor.GetFaith.GoodGodNames], [secondary_recipient.GetName]. [secondary_recipient.GetHerHis|U] armies shall free [target.GetNameNoTier] of its evil."
pam_interactions_events.0072.desc: "It is too late for you. There can be no repentance.\n\nLo, and the wicked land of [recipient.GetPrimaryTitle.GetNameNoTier] shall be sundered! Lo, and the servants of [puppet_or_actor.GetFaith.DevilName] shall be butchered! I have raised up the arms of the faithful, and set [secondary_recipient.GetName] to your destruction!"
pam_interactions_events.0072.a: "[puppet_or_actor.GetFaith.HighGodName] must be cruel, to unleash such [puppet_or_actor.GetWomenMen] upon us!"
