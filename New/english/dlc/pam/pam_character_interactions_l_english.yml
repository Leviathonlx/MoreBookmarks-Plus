pam_interactions_events.0080.opening: "By the authority vested in [recipient.GetFaith.GetReligion.GetNameNoTooltip],"
pam_interactions_events.0080: "Know that I have heard the pleas of [actor.GetTitledFirstName] and, as the [recipient.GetTitleAsNameNoTooltip] of the [recipient.GetPrimaryTitle.GetName], I impose a white peace upon your war.\n\nLet the shedding of Christian blood cease."
