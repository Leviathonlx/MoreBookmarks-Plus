pam_interactions_events.0001.normal: "\n\nAt my insistence,"

pam_interactions_events.0001_disgust: "\n\nDo not blacken these words with evil deeds."
pam_interactions_events.0001_disapprove: "\n\nPlease, do justice to these laudatory words."
pam_interactions_events.0001_approve: "\n\nOurs will be true and grateful praise."
pam_interactions_events.0001_offer_hook_end: "\n\nLet this favor not be forgotten."
pam_interactions_events.0001.a.low_zeal: "'Tis good the people are more easily convinced than I..."
pam_interactions_events.0001.a.high_zeal: "To doubt me is to doubt the word of [ROOT.Char.GetFaith.HighGodName]!"
 pam_interactions_events.0001.a: "From [ROOT.Char.GetFaith.HighGodName] was [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] given to me."
