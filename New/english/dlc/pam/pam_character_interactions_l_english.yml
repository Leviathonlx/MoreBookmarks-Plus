pam_interactions_events.0060.t: "Justifying Divorce"
pam_interactions_events.0060.desc: "[puppet_or_actor.GetTitledFirstName] wishes an end to [puppet_or_actor.GetHerHis] marriage, yes, but for all the ill will [puppet_or_actor.GetSheHe] and [secondary_recipient.GetTitledFirstName] may have toward one another... they made their union before [puppet_or_actor.GetFaith.HighGodName]. And they have no sound reason for ending it.\n\nThus, I must fabricate some lie to vindicate their annulment. A blasphemy that deserves, perhaps, some recompense..."
pam_interactions_events.0060.a: "This separation deserves... a bloody scandal."
pam_interactions_events.0060.a.tt: "No noble lies shall I produce, but vile accusations against [secondary_recipient.GetFirstNameNoTooltip]! [secondary_recipient.GetHerHis|U] family will be forced to come to [secondary_recipient.GetHerHis] defense... and [puppet_or_actor.GetFirstNamePossessiveNoTooltip] kin to [puppet_or_actor.GetHerHis]."
pam_interactions_events.0060.b: "Have the [puppet_or_actor.GetTitleAsNameNoTooltip] donate land to the faithful."
pam_interactions_events.0060.b.tt: "Giving a title over to the [lease_order.GetName] will ease this burden on all our souls..."
pam_interactions_events.0060.c: "A favor that merits a favor in turn."
pam_interactions_events.0060.d: "Claim that [secondary_recipient.GetFirstNameNoTooltip] was promised to the cloth."
pam_interactions_events.0060.d.tt: "If [secondary_recipient.GetSheHe] made vows to the [divorcee_joining_order.GetName] long ago, this marriage would stand invalidated! And, then, who better to guide [secondary_recipient.GetFirstNamePossessiveNoTooltip] new life than I?"
pam_interactions_events.0060.e: "Make no demands of the unhappy couple."
divorce_cleric_perspective_tt: "[puppet_or_actor.GetShortUIName] divorces [secondary_recipient.GetShortUIName]"

