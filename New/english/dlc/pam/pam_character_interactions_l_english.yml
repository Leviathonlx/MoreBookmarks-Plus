divorce_justified_tt: "Any of the following:\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] attempted to murder you\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] is an [GetTrait('adulterer').GetName( secondary_recipient )]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] has very low [fertility|E] and your marriage is childless\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINamePossessive] [faith|E] is [faith_hostile|E] or [faith_evil|E]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] has multiple [spouses|E], despite polygamy being forbidden\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] is impotent\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] has an [incestuous|E] lover\n$EFFECT_LIST_BULLET$Your marriage with [secondary_recipient.GetShortUIName] is [incestuous|E]\n$EFFECT_LIST_BULLET$Your marriage with [secondary_recipient.GetShortUIName] is same-sex, and forbidden"
divorce_justified_secondary_tt: "Any of the following:\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] attempted to murder [secondary_actor.GetShortUIName]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] is an [GetTrait('adulterer').GetName( secondary_recipient )]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] has very low [fertility|E] and their marriage is childless\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINamePossessive] [faith|E] is [faith_hostile|E] or [faith_evil|E]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] has multiple [spouses|E], despite polygamy being forbidden\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] is impotent\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] has an [incestuous|E] lover\n$EFFECT_LIST_BULLET$[secondary_actor.GetShortUINamePossessive|U] marriage with [secondary_recipient.GetShortUIName] is [incestuous|E]\n$EFFECT_LIST_BULLET$[secondary_actor.GetShortUINamePossessive|U] marriage with [secondary_recipient.GetShortUIName] is same-sex, and forbidden"
