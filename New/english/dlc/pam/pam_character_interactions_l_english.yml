pam_interactions_events.0010: "How very long has [actor.GetFaith.HighGodNamePossessive] own dispensation of land and title been ignored? How long have the [target.GetTierAsNamePossessiveNoTooltip] people languished without a shepherd of the [actor.GetHouse.GetName] blood?\n\nI shall press your claim to [target.GetNameNoTierNoTooltip] in every court, in every council, in every treatise.\n\nYour claim shall not die with you."
pam_interactions_events.0010.a.low_zeal: "And so, an ancestral right is forged..."
pam_interactions_events.0010.a.high_zeal: "May [target.GetNameNoTierPossessiveNoTooltip] salvation come long before then!"
 pam_interactions_events.0010.a: "May it never be forgotten."
 pam_interactions_events.0010.toast_puppeteer: "[recipient.GetShortUIName] agreed to press [puppet_or_actor.GetShortUINamePossessive] claim on [target.GetNameNoTier]"

 pam_interactions_events.0011.opening: "Ever-unsatisfied [actor.GetTitleAsName],"
pam_interactions_events.0011: "This missive I send with care and concern. Does it not degrade what dignity you have... to insist so shamelessly after what does not belong to you? Do you not worry of offense to [actor.GetFaith.HighGodName]? To your [actor.GetFaith.GetReligion.GetAdjective] brothers and sisters?\n\nWhen your spirit rests in [actor.GetFaith.PositiveAfterLife] or — if fate is vindictive — [actor.GetFaith.NegativeAfterLife], let us pray that then [target.GetNameNoTier] will know peace."
 pam_interactions_events.0011.a: "The [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('recipient'))] denies me?!?"
 pam_interactions_events.0011.toast_puppeteer: "[recipient.GetShortUIName] refused to press [puppet_or_actor.GetShortUINamePossessive] claim on [target.GetNameNoTier]"
