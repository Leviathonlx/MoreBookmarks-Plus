pam_interactions_events.0001.opening: "Noble [ROOT.Char.GetTitledFirstNameRegnal],"

pam_interactions_events.0001.hook_intro: "Of course! I must assist you,"
pam_interactions_events.0001.intro: "It is right and meet that you seek a [recipient.GetTitleAsNamePossessive] approval,"
pam_interactions_events.0001: "for all [recipient.GetFaith.GetReligion.GetAdjective] titles of this world are held only by [recipient.GetFaith.HighGodNamePossessive] holy will."
pam_interactions_events.0001.mid: "the [recipient.GetFaith.HouseOfWorshipPlural] of your realm shall resound with sermons raising high your mandate, and praising [recipient.GetFaith.HighGodName] for bringing a [ROOT.Char.GetTitleAsNameNoTooltip] such as you to [actor.GetPrimaryTitle.GetNameNoTier]."
