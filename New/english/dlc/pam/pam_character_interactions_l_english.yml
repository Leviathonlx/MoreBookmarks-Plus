pam_interactions_events.0091.opening: "My benefactor,"
pam_interactions_events.0091.desc_hook_theocrat: "Your intercession leaves me with a great obligation. In one hand is placed the shepherd's crook; around the other, the very hand of [recipient.GetFaith.HighGodName] clasps tight. So it must be, as I am [recipient.GetFaith.HighGodHerHis|U] faithful servant! [target.GetNameNoTier] is a grand gift, and I a grateful beneficiary.\n\nLet it be known through all the lands: by the will of [ROOT.Char.GetTitledFirstNameRegnal], this [target.GetTierAsName] belongs to the clergy!"
pam_interactions_events.0091.desc_hook: "Your intercession leaves me with a great obligation. In one hand is placed the scepter of rule; around the other, the very hand of [recipient.GetFaith.HighGodName] clasps tight. So it must be. [target.GetNameNoTier] is a grand gift, and I a grateful beneficiary.\n\nLet it be known through all the lands: by the will of [ROOT.Char.GetTitledFirstNameRegnal], the [target.GetTierAsName] is mine!"
pam_interactions_events.0091.desc: "Your intercession is a blessing beyond what I thought possible. Long is the reach of the Holy [ROOT.Char.GetMotherFather|U], and kindly too — thanks be to [recipient.GetFaith.HighGodName]!\n\n[target.GetName] is a noble land. I will bear its title and rule its [recipient.GetFaith.GetAdherentNamePlural] with humility and grace."
pam_interactions_events.0091.a: "I shall watch [target.GetNameNoTierNoTooltip] keenly."
pam_interactions_events.0092.opening_theocratic: "Most reverent [ROOT.Char.GetFaith.PriestNeuter],"
pam_interactions_events.0092.opening: "My [ROOT.Char.Custom('GetTitleTierAdjective')] child,"
pam_interactions_events.0092.desc_hook: "As you pray over the mighty gift [recipient.GetFaith.HighGodName] and [recipient.GetFaith.HighGodHerHis|U] prelates have lavished unto you, consider well how truly worthy you are of this [target.GetTierAsName]. There remain, perhaps, worshipful devotions still to be made on your behalf.\n\nI shall avail you of my counsel in this. We must ensure that your rule in [target.GetNameNoTierNoTooltip] pleases and serves [recipient.GetFaith.HighGodName]."
pam_interactions_events.0092.desc: "Your [target.GetTierAsNameNoTooltip] is proclaimed!\n\nGuided by my prayers, I have indeed taken a special interest in your advancement. I ask only that you rule well, so that your reign may prove a benediction to the [recipient.GetFaith.GetAdherentNamePlural] of [target.GetNameNoTier]."
pam_interactions_events.0092.a: "A mandate directly from [recipient.GetFaith.PositiveAfterLife]!"

