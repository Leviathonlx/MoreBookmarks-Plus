pam_interactions_events.0070.t: "A War for the [puppet_or_actor.GetTitleAsNameNoTooltip]"
pam_interactions_events.0070.desc_intro_pagan: ""For the wicked pagans of [target.GetNameNoTier],"
pam_interactions_events.0070.desc_intro_heretic: ""For the heretic [recipient.GetFaith.GetAdherentNamePlural] of [target.GetNameNoTier],"
pam_interactions_events.0070.desc_intro_infidel: ""For the [recipient.GetFaith.GetReligion.GetAdjective] infidels of [target.GetNameNoTier],"
pam_interactions_events.0070.desc_intro_heathen: ""For the heathen [recipient.GetFaith.GetReligion.GetAdherentNamePlural] of [target.GetNameNoTier],"
pam_interactions_events.0070.desc: "#EMP damnation, ruination — death by the sword!#!" cries [puppet_or_actor.GetTitledFirstNameRegnal], and [puppet_or_actor.GetHerHis] message is carried to the restless masses of [secondary_recipient.GetPrimaryTitle.GetNameNoTier].\n\n"Raise the holy standard of [ROOT.Char.GetFaith.random_GoodGodNames], [ROOT.Char.GetTitledFirstName]! I call on you to cast [recipient.GetTitledFirstName] from the land of [target.GetNameNoTierNoTooltip]! To cast [recipient.GetHerHis] [recipient.GetPrimaryTitle.GetAdjective] [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] into the fires of [ROOT.Char.GetFaith.NegativeAfterLife]!"\n\n"
pam_interactions_events.0070.desc_outro_joining_war: "Truly, the [puppet_or_actor.GetTitleAsNameNoTooltip] yearns to spread [puppet_or_actor.GetFaith.HighGodNamePossessive] dominion! [puppet_or_actor.GetSheHe|U] swears to ride to war [puppet_or_actor.GetHerselfHimself], and place [puppet_or_actor.GetHerHis] forces at my disposal."
pam_interactions_events.0070.desc_outro_funding_war: "These demands are backed by coin: the [puppet_or_actor.GetTitleAsNameNoTooltip] promises a war chest of funds, so that my [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] may be fired by more than faith alone."
pam_interactions_events.0070.a: ""[ROOT.Char.GetFaith.WarGodName] is with us! #EMP To war!#!""
pam_interactions_events.0070.b: "Leave [recipient.GetTitledFirstNamePossessiveNoTooltip] people in peace."
cultural_acceptance_gain_refused_incited_holy_war: "A secular ruler prevented holy war from taking place"

pam_interactions_events.0071.t: "[ROOT.Char.GetFaith.HighGodNamePossessive] Conquest of [target.GetNameNoTierNoTooltip]"
pam_interactions_events.0071.desc_intro: "In battle-cries, in song, in prayers for victory — [ROOT.Char.GetFaith.HighGodNamePossessive] holy word is carried to a [target.GetTierAsNameNoTooltip] of [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)]! From the principal [ROOT.Char.GetFaith.HouseOfWorship] of [secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTier], [secondary_recipient.GetName] proclaims holy war against"
pam_interactions_events.0071.desc_intro_pagan: "the [recipient.GetPrimaryTitle.GetAdjective] pagans.\n\nLike brutish animals, [recipient.GetTitledFirstName] and [recipient.GetHerHis] [recipient.GetCulture.GetCollectiveNoun] will surely scatter at the righteous coming of [secondary_recipient.GetPrimaryTitle.GetNameNoTierPossessive] [secondary_recipient.GetFaith.GetReligion.GetAdjective] hosts!"
pam_interactions_events.0071.desc_intro_heretic: "the [recipient.GetPrimaryTitle.GetAdjective] heretics.\n\nIn a great tide of blood, [recipient.GetTitledFirstName] and [recipient.GetHerHis] filthy [recipient.GetFaith.GetAdherentNamePlural] will be swept from the land! Thus, always, unto those who corrupt the word of [ROOT.Char.GetFaith.HighGodName]!"
pam_interactions_events.0071.desc_intro_infidel: "the [recipient.GetTitleAsName] of [recipient.GetPrimaryTitle.GetNameNoTier].\n\nThe [recipient.GetFaith.GetReligion.GetAdjective] infidels, like all who have failed before the The Prophet's #EMP jihad#!, will soon be made to submit!"
pam_interactions_events.0071.desc_intro_heathen: "the [recipient.GetTitleAsName] of [recipient.GetPrimaryTitle.GetNameNoTier].\n\nBy [ROOT.Char.GetFaith.WarGodName], [secondary_recipient.GetSheHe] shall shatter the heathen hosts! And all [ROOT.Char.GetFaith.GetReligion.GetAdjective] peoples will gaze on in wonderment."
pam_interactions_events.0071.desc_outro_joining_war: "\n\nMy own troops shall not sit idly by. No! They shall breach [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] alongside [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] [secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l]."
pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\nAlready, from [secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] and beyond, fervent warriors gather under [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] banner."
pam_interactions_events.0071.desc_outro_funding_war: "\n\n[ROOT.Char.GetFaith.HighGodNamePossessive] favor alone promises [secondary_recipient.GetTitledFirstNameNoTooltip] victory. But my generous donative ensures [secondary_recipient.GetHerHis] confidence."
pam_interactions_events.0071.a: "May those who die for this cause be forever envied."
