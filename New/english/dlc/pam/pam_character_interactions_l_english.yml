ecclesiastical_de_jure_shifting_grant_interaction_notification:  "As a [puppet_or_actor.GetMotherFather] minds a beloved child, I wish [puppet_or_actor.GetPrimaryTitle.GetName] to nurture and safeguard [target.GetName] for all eternity. Let us decree this a legal and sacred bond."
pam_interactions_events.0096.opening: "Judicious is the hand of [ROOT.Char.GetFaith.random_GoodGodNames]!"
pam_interactions_events.0096.desc: "The hewing of [target.GetNameNoTier] from [former_de_jure_liege.GetNameNoTier] is a most wise and blessed deed!\n\nLet it be as you have decreed: through all the ages, [de_jure_master.GetPrimaryTitle.GetNameNoTier] shall be a buttress standing between this [target.GetTierAsNameNoTooltip] and [ROOT.Char.GetFaith.PositiveAfterLife], so that faithful [target.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.GetAdherentNamePlural] may be forever guided to [ROOT.Char.GetFaith.HighGodNamePossessive] light.\n\nThis I shall adopt into my sacred [de_jure_master.Custom('GetTitleTierAdjective')] oath."
pam_interactions_events.0096.a: "May this, indeed, prove a harmonious union."
