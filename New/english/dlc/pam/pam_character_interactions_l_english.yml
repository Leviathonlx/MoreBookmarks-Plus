DEMAND_DIVORCE_NOTIFICATION: "It falls to me to demand that you put aside your spouse, [secondary_recipient.GetTitledFirstName]."
DEMAND_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nYou share blood with [secondary_recipient.GetFirstNameNoTooltip], and all the world knows it. Such incest cannot stand before [actor.GetFaith.HighGodName]."
DEMAND_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nYour union mocks the marriage bed as [actor.GetFaith.HighGodName] ordained it. It cannot stand."
DEMAND_DIVORCE_NOTIFICATION_HEATHEN: "\n\n[secondary_recipient.GetFirstNameNoTooltip] bows to strange gods, yet shares your bed. I cannot suffer such a union to stand."
DEMAND_DIVORCE_NOTIFICATION_HERETIC: "\n\n[secondary_recipient.GetFirstNameNoTooltip] has strayed from the true faith, and drags your soul along. The union cannot stand."
DEMAND_DIVORCE_NOTIFICATION_INFIDELITY: "\n\nAll the world knows [secondary_recipient.GetFirstNameNoTooltip] has betrayed your marriage bed. What is broken must now be ended."
DEMAND_DIVORCE_NOTIFICATION_POLYGAMY: "\n\nYou keep [secondary_recipient.GetFirstNameNoTooltip] as one spouse among many, an arrangement [actor.GetFaith.HighGodName] abhors. It cannot stand."
DEMAND_DIVORCE_NOTIFICATION_PRETEXT: "\n\nLearned men have traced your line and [secondary_recipient.GetFirstNameNoTooltip]'s, and found them entwined within the forbidden degrees. Consanguinity — the findings are quite conclusive."
