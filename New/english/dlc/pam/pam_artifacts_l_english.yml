l_english:
 artifact_pedestal_bible_name: "$artifact_name_prefix$ Bible"
 artifact_pedestal_bible_description: "An illuminated Bible bound in jeweled covers, each verse the fruit of patient and devoted copying."
 artifact_pedestal_thurible_name: "$artifact_name_prefix$ Thurible"
 artifact_pedestal_thurible_description: "A finely wrought censer on polished chains. Lit, it wreathes the room in fragrant clouds of incense that bear prayers heavenward."
 artifact_pedestal_situla_name: "$artifact_name_prefix$ Situla"
 artifact_pedestal_situla_description: "A richly decorated vessel for holy water, carried in procession so that blessings may be sprinkled upon the faithful."
 artifact_pedestal_crozier_name: "$artifact_name_prefix$ Crozier"
 artifact_pedestal_crozier_description: "A bishop's pastoral staff, wrought in the manner of a shepherd's crook to guide the faithful and prod the wayward."
