l_english:

 # Activity: The Investiture Council
 activity_investiture_council:0 "The Investiture Council"
 activity_investiture_council_desc:0 "A council convened at the close of the [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] to settle, once and for all, who shall invest the clergy: the Church or the crown."
 activity_investiture_council_province_desc:0 "Host the Investiture Council here."
 activity_investiture_council_host_desc:0 "Convene the Investiture Council to settle the appointment of the clergy."
 activity_investiture_council_guest_desc:0 "Attend the Investiture Council and lend your voice to the appointment of the clergy."
 # Travel plan name (engine looks up TRAVEL_NAME_FOR_<activity key>); without it the raw key showed on travellers.
 TRAVEL_NAME_FOR_activity_investiture_council:0 "[Character.GetFirstNamePossessiveNoTooltip] journey to the Investiture Council"
 # Reason shown on the guest invite-acceptance for the clergy summoned to the council.
 pam_investiture_council_summons_clergy_value:0 "Summoned to the Investiture Council"

 pam_investiture_council_start_log_title:0 "The Investiture Council Convenes"
 pam_investiture_council_start_log:0 "[CHARACTER.GetTitledFirstName] opened the council to settle the appointment of the clergy."

 # Conclusion-page log entries; their nested effect renders as the activity's "Effects from ..." section
 pam_investiture_council_concluded_spiritual_log_title:0 "The Church Prevails"
 pam_investiture_council_concluded_spiritual_log:0 "[CHARACTER.GetTitledFirstName] proclaimed the council's ruling: the clergy are invested by the Church alone, and no crown may unseat them."
 pam_investiture_council_concluded_temporal_log_title:0 "The Crown Prevails"
 pam_investiture_council_concluded_temporal_log:0 "[CHARACTER.GetTitledFirstName] proclaimed the council's ruling: the Church invests the clergy, but a secular lord may still strip a prelate who fails him."
 pam_investiture_council_conclusion.intro:0 "The Investiture Council has reached its conclusion."
 pam_investiture_council_conclusion.spiritual:0 "The assembled fathers upheld the Church's sole right to invest the clergy, and set it beyond the reach of any crown: once consecrated, a prelate holds office for life.\n\nThe long [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] is over; the Church emerges ascendant and turns at once to reforming herself from within."
 pam_investiture_council_conclusion.temporal:0 "The assembled fathers left the appointment of the clergy to the Church, but kept for the secular lords the right to strip any prelate who fails them. The long [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] is over, but the Church's authority is diminished and its unity left fragile."

 # Activity window character labels (one key per window_characters slot)
 activity_window_character_prelate_guest_arrived:0 "Prelate\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_secular_guest_arrived:0 "[activity_guest_short|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_church_rep:0 "Conservative\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_crown_rep:0 "Innovator\n[Character.GetShortUINameNoTooltip|U]"

 # The ruling as a single line under the conclusion page's "Effects from ..." readout
 pam_investiture_resolution_spiritual_tt:0 "Replaced the [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] Clerical Appointment [doctrine|E] with [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]"
 pam_investiture_resolution_temporal_tt:0 "Replaced the [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] Clerical Appointment [doctrine|E] with [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName]"

 # Activity phase names + descriptions
 investiture_council_phase_summons:0 "Summons"
 investiture_council_phase_summons_desc:0 "The faithful assemble as news spreads of the coming reckoning over the appointment of the clergy."
 investiture_council_phase_debate:0 "The Debate"
 investiture_council_phase_debate_desc:0 "The council debates who shall invest the clergy, the Church or the crown, and puts it to a vote."

 # Arrival flavour (guest) - the host welcomes me
 pam_investiture_council_events.0001.t:0 "Arrival"
 pam_investiture_council_events.0001.desc:0 "[arrival_host.GetTitledFirstName] greets me warmly on the threshold; beyond [arrival_host.GetHerHim], prelates and princes of the faith are stirring. Soon the great question of the clergy's appointment goes to the assembly."
 pam_investiture_council_events.0001.a:0 "I am honoured to be among them."
 pam_investiture_council_events.0001.a.tt:0 "The debate will begin once the rest of guests have arrived."

 # The council convenes (host)
 pam_investiture_council_events.0002.t:0 "A Reckoning for the Church"
 pam_investiture_council_events.0002.desc:0 "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] has run its course. Now the assembled faithful must decide how the clergy are to be appointed hereafter, and I mean to see the Church's authority upheld."
 pam_investiture_council_events.0002.a:0 "So it shall be."

 # Pre-debate flavour (guest)
 pam_investiture_council_events.0003.t:0 "The Debate Begins"
 pam_investiture_council_events.0003.desc:0 "The gathering hushes as the council begins on the question that has pitted Church against crown: which of them shall invest the clergy. Each voice present will weigh on the answer."
 pam_investiture_council_events.0003.a:0 "It is time."

 # Post-choice persuasion (clergy voter): a single duel to sway the assembly
 pam_investiture_council_events.0032.t:0 "A Word in the Right Ear"
 pam_investiture_council_events.0032.desc:0 "The vote is not yet sealed. A persuasive word in the right ear might bring waverers of the opposing side round to my cause, though a clumsy appeal could be costly."
 pam_investiture_council_events.0032.a:0 "Sway the assembly to my cause."
 pam_investiture_council_events.0032.b:0 "Leave it be."

 # Post-choice persuasion (secular attendee): back either side by bribe or conviction
 pam_investiture_council_events.0033.t:0 "The Weight of a Crown"
 pam_investiture_council_events.0033.desc:0 "I have no vote in this assembly of churchmen, but a secular lord is never short of means. A heavy purse loosens consciences, and a well-argued case moves the undecided. I might lend my weight to the Church's cause or the crown's, or stay silent."
 pam_investiture_council_events.0033.a:0 "Let's try and bribe to vote for the church."
 pam_investiture_council_events.0033.b:0 "Let's try and convince to vote for the church."
 pam_investiture_council_events.0033.c:0 "I will attempt to bribe towards temporal."
 pam_investiture_council_events.0033.d:0 "I will attempt to convince towards temporal."
 pam_investiture_council_events.0033.e:0 "Stay out of it."

 # Persuasion feedback toast: simple header, outcome in the tooltip (numbers coloured)
 pam_investiture_persuade_toast_title:0 "The Assembly Responds"
 pam_investiture_persuade_toast_swayed_tt:0 "You swayed #P [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! voters."
 pam_investiture_persuade_toast_backfired_tt:0 "Your misstep drove #N [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! voters the other way."

 # Secular sway per-side availability (grays the option when there is no one left to win to that side)
 pam_investiture_persuade_target_spiritual_tt:0 "There are voters not yet on the Church's side to win over"
 pam_investiture_persuade_target_temporal_tt:0 "There are voters not yet on the crown's side to win over"

 # Persuasion duel outcome tooltips (shared by 0032 clergy / 0033 secular). Side-specific (the key names the
 # destination camp) so both perspectives read naturally; only numbers coloured; counts must match the duel tiers.
 pam_investiture_persuade_tt_great_innovator:0 "Sway up to #P 10#! voters to the Church's cause."
 pam_investiture_persuade_tt_great_conservative:0 "Sway up to #P 10#! voters to the crown's cause."
 pam_investiture_persuade_tt_good_innovator:0 "Sway up to #P 5#! voters to the Church's cause."
 pam_investiture_persuade_tt_good_conservative:0 "Sway up to #P 5#! voters to the crown's cause."
 pam_investiture_persuade_tt_modest_innovator:0 "Sway up to #P 3#! voters to the Church's cause."
 pam_investiture_persuade_tt_modest_conservative:0 "Sway up to #P 3#! voters to the crown's cause."
 pam_investiture_persuade_tt_backfire_innovator:0 "A misstep drives #N 5#! voters to the Church's cause."
 pam_investiture_persuade_tt_backfire_conservative:0 "A misstep drives #N 5#! voters to the crown's cause."

 # Player interrupt: busy/travelling when the council convenes
 pam_investiture_council_events.0004.t:0 "The Council Summons You"
 pam_investiture_council_events.0004.desc:0 "News arrives that the Investiture Council is convening to rule on the appointment of the clergy, and I am many days' ride away. I could drop everything and ride hard to lend my voice, or leave the prelates to rule in my absence."
 pam_investiture_council_events.0004.a:0 "Abandon everything and ride for the council."
 pam_investiture_council_events.0004.b:0 "Let them decide without me."
 pam_investiture_council_haste_modifier:0 "Hastening to the Council"
 pam_investiture_council_haste_modifier_desc:0 "This [ruler|E] has abandoned all other business to attend the Investiture Council ahead of its ruling on the appointment of the [clergy|E]."

 # The debate opens (host)
 pam_investiture_council_events.0010.t:0 "The Church's Right"
 pam_investiture_council_events.0010.desc:0 "I lay the matter before the council: the right to invest the clergy belongs to the Church, and no crown may unmake what she has consecrated. Let the assembly speak, and let their voices decide."
 pam_investiture_council_events.0010.a:0 "Champion the Church's authority."

 # The debate: guest picks a side
 pam_investiture_council_events.0031.t:0 "Where Do You Stand?"
 pam_investiture_council_events.0031.desc:0 "The Head of Faith calls for the Church's sole right to appoint the clergy, beyond any crown's power to undo. The secular lords would keep for themselves the right to strip a prelate who fails them. The council awaits your voice."
 pam_investiture_council_events.0031.a:0 "Support the Church: appointment by the Church, and held for life."
 pam_investiture_council_events.0031.b:0 "Uphold the crowns: appointment by the Church, but revocable by their lords."

 # Letter from the host to a non-attending player Head of Faith with the decided outcome
 pam_investiture_council_events.0060.opening:0 "Most Holy Father,"
 pam_investiture_council_events.0060.desc.spiritual:0 "The council has concluded, and as you were not among us I set the outcome to parchment at once. The assembled fathers have affirmed the Church's sole right to invest the clergy, and set it beyond the reach of any crown: those she consecrates hold their office for life. The [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] is ended."
 pam_investiture_council_events.0060.desc.temporal:0 "The council has concluded, and as you were not among us I set the outcome to parchment at once. It grieves me to write that the assembled fathers, though they left appointment in our hands, have granted the secular lords leave to strip any prelate who fails them. The [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] is ended."
 pam_investiture_council_events.0060.a:0 "Read the decree."

 # Letter from the court chaplain to a non-attending secular player relaying the council's outcome
 pam_investiture_council_events.0061.opening:0 "My lord,"
 pam_investiture_council_events.0061.desc.spiritual:0 "Word reaches your chapel from the great council. The assembled fathers have affirmed the Church's sole right to invest the clergy, and those she appoints are now beyond your power to unseat. The long [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] is ended, and the crozier keeps what the crown coveted."
 pam_investiture_council_events.0061.desc.temporal:0 "Word reaches your chapel from the great council. The assembled fathers have left the appointment of the clergy to the Church, yet any prelate who fails you remains yours to strip of office. The long [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] is ended, and the crown has prevailed over the crozier."
 pam_investiture_council_events.0061.a:0 "So it is settled."

 # Informs a player Head of Faith that an archbishop will host in their stead
 pam_investiture_council_events.0050.t:0 "A Council Convenes"
 pam_investiture_council_events.0050.desc.named:0 "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] draws to a close, and a council will settle the appointment of the clergy.\n\n[investiture_nominee_host.GetTitledFirstName] takes on the task of hosting it. As the head of faith, you are expected to attend and voice your opinion on the decision, although you will be informed of the outcome even if you don't attend."
 pam_investiture_council_events.0050.desc:0 "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] draws to its close, and a council must settle the appointment of the clergy. As you will not host it yourself, a senior archbishop of the faith takes up the task in your stead. You may yet attend and add your voice."
 pam_investiture_council_events.0050.a:0 "Very well."

 # Deterministic backstop: the crisis lapses in the Church's favour if no council convenes
 pam_investiture_crisis_lapsed_toast:0 "The [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetNameNoTooltip] Ends"
 pam_investiture_crisis_lapsed_tt:0 "With no council convened, the [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] lapses in the Church's favour: the clergy are henceforth appointed by the Church, and hold their office for life."
