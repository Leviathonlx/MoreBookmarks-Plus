 pam_saint_relic_tooth_buddhism_desc: "An elegant reliquary enshrining a sarira: a tooth of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_buddhism_desc: "An elegant reliquary enshrining a sarira: a rib of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_talisman_desc: "A talisman drawn by [relic_creator_saint.GetShortUINameNotMe], said to expel evil or heal the holder."
 pam_saint_relic_pellet_desc: "A bottle of immortal pellets concocted by [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_footprint_desc: "An elegant reliquary enshrining the footprint of [relic_creator_saint.GetShortUINameNotMe]."
