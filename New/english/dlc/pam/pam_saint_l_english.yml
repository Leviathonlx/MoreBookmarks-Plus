l_english:
 # Canonizing Saints
 # Christian faiths use Saint/Canonize wording; religions with an attested term for the venerated dead use it (Wali, Divus, Siddha, Kami - see pam_saint_custom_loc.txt); everything else uses Venerated Ancestor/Venerate (matches the vanilla saint trait and 20_pam_flavorization.txt). Three mechanisms: (1) scopeless keys pick the _saint/_va variant via SelectLocalization on the local player's religion, and the _va branch pulls its per-religion noun from a custom loc on GetPlayer; (2) scope-bearing keys whose only divergence is a single word/phrase swap just that fragment via a custom loc, keeping the sentence one key so its saved scopes stay live (called on the saint's scope where one exists, so gendered terms resolve); (3) clause-level scope-bearing keys (petition_sent, 0001.a.tt, 0002.desc, 0003.desc) keep the _saint/_va split and branch in script (triggered_desc), because their wording diverges across several phrases and they lean on multiple saved scopes a custom loc can't carry.

 # Canonize decision
 pam_canonize_saint_decision: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] [GetPlayer.Custom('PamVenerateObjectTitle')]"
 pam_canonize_saint_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_desc_saint', 'pam_canonize_saint_decision_desc_va' )]"
 pam_canonize_saint_decision_desc_saint: "I shall put forward one of my departed kin to be recognized as a holy saint, consecrated and laid to rest in light."
 pam_canonize_saint_decision_desc_va: "I shall raise one of my departed kin to be honoured as [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], their remains [GetPlayer.Custom('PamConsecratedEnshrined')] with all due reverence."
 pam_canonize_saint_decision_tooltip: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_tooltip_saint', 'pam_canonize_saint_decision_tooltip_va' )]"
 pam_canonize_saint_decision_tooltip_saint: "Elevate a departed member of your [dynasty|EU] to [sainthood|EU]."
 pam_canonize_saint_decision_tooltip_va: "Elevate a departed member of your [dynasty|EU] to [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]."
 pam_canonize_saint_decision_confirm: "Choose a Resting Place"
 pam_canonize_saint_decision_req_candidate: "A #EMP departed#! ancestor of your [dynasty|EU], free of [sinful|EU] traits, bearing a [virtuous|EU] trait, and as of yet unvenerated"
 pam_canonize_saint_decision_req_site: "An [Concept('ecclesiastical_domicile','Ecclesiastical Estate')|E] with a [Concept('ecclesiastical_domicile_building','Cathedral')|E] in your [realm|EU] in which to consecrate them - or, once every one is occupied, a neighbouring province"
 pam_canonize_saint_decision_req_site_holy_site: "A [Concept('holy_site','Holy Site')|E] of your [faith|EU] within your [realm|EU] at which to consecrate them - or, once every one is occupied, a neighbouring province"
 pam_canonize_saint_decision_canonize_tt: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] the chosen departed dynast, [GetPlayer.Custom('PamConsecratingEnshrining')] their remains"
 pam_canonize_saint_decision_choose_1_tt: "Choose the [Concept('ecclesiastical_domicile_building','Cathedral')|E] within your [realm|EU] in which to consecrate them"
 pam_canonize_saint_decision_choose_1_holy_site_tt: "Choose the [Concept('holy_site','Holy Site')|E] of your [faith|EU] within your [realm|EU] at which to consecrate them"
 # Clause-level split kept in script (triggered_desc): three phrases diverge and the sentence needs saint_candidate / consecration_province / petition_recipient, which a custom loc can't all carry.
 pam_canonize_saint_petition_sent_tt_saint: "A petition to recognize [saint_candidate.GetFirstName] as a holy [Concept('canonized','Saint')|E], to be consecrated at [consecration_province.GetName], will be sent to [petition_recipient.GetTitledFirstName] for approval"
 pam_canonize_saint_petition_sent_tt_va: "A petition to honour [saint_candidate.GetFirstName] as [saint_candidate.Custom('PamVeneratedSaintOrAncestor')], to be [GetPlayer.Custom('PamConsecratedEnshrined')] at [consecration_province.GetName], will be sent to [petition_recipient.GetTitledFirstName] for approval"
 # Sentence stays a single key (saint_candidate / canonizer saved scopes stay live via custom_tooltip); only the canonize/venerate verb swaps, via the PamCanonizeVenerateVerb custom loc.
 pam_canonize_saint_hof_chance_tt: "Judged by [saint_candidate.GetShortUIName]'s number of virtuous [Concept('trait','traits')|E], [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] is around #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance')|0%]#! likely to grant the petition to [GetPlayer.Custom('PamCanonizeVenerateVerb')] them"
 pam_canonize_saint_hof_chance_cynical_tt: "Judged by [saint_candidate.GetShortUIName]'s number of virtuous [Concept('trait','traits')|E], yet tempered by [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName]'s cynical nature, [canonizer.GetFaith.GetReligiousHead.GetSheHe] is around #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance_cynical')|0%]#! likely to grant the petition to [GetPlayer.Custom('PamCanonizeVenerateVerb')] them"
 pam_canonize_saint_hof_chance_puppet_tt: "With [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] answering to you, the petition to [GetPlayer.Custom('PamCanonizeVenerateVerb')] [saint_candidate.GetShortUIName] is #EMP certain#! to be granted"
 # Custom-loc vocabulary fragments (Christian / per-religion / fallback), referenced only by pam_saint_custom_loc.txt. The surrounding sentences stay full keys so their saved scopes stay live. Terms match the saint flavorization (20_pam_flavorization.txt) and trait names.
 pam_canonize_verb_christian: "canonize"
 pam_canonize_verb_hellenism: "deify"
 pam_canonize_verb_confucianism: "honorifics"
 pam_canonize_verb_taoism: "investiture"
 pam_canonize_verb_other: "venerate"
 pam_saint_noun_christian: "[Concept('canonized','Saint')|E]"
 pam_saint_noun_islam: "[Concept('canonized','Wali')|E]"
 pam_saint_noun_islam_female: "[Concept('canonized','Waliyya')|E]"
 pam_saint_noun_hellenism: "[Concept('canonized','Divus')|E]"
 pam_saint_noun_hellenism_female: "[Concept('canonized','Diva')|E]"
 pam_saint_noun_jainism: "[Concept('canonized','Siddha')|E]"
 pam_saint_noun_shintoism: "[Concept('canonized','Kami')|E]"
 pam_saint_noun_confucianism: "[Concept('canonized','Xianru')|E]"
 pam_saint_noun_buddhism: "[Concept('canonized','Ārya')|E]"
 pam_saint_noun_taoism: "[Concept('canonized','Zhenren')|E]"
 pam_saint_noun_judaism: "[Concept('canonized','Tzadik')|E]"
 pam_saint_noun_other: "venerated ancestor"
 # Every branch carries its own article (a/an varies per term) - the calling sentence must not add one.
 pam_venerated_saint_christian: "a saint"
 pam_venerated_saint_christian_capitalized: "a Saint"
 pam_venerated_saint_islam: "a Wali"
 pam_venerated_saint_islam_female: "a Waliyya"
 pam_venerated_saint_hellenism: "a Divus"
 pam_venerated_saint_hellenism_female: "a Diva"
 pam_venerated_saint_jainism: "a Siddha"
 pam_venerated_saint_shintoism: "a Kami"
 pam_venerated_saint_confucianism: "a Xianru"
 pam_venerated_saint_buddhism: "an Ārya"
 pam_venerated_saint_taoism: "a Zhenren"
 pam_venerated_saint_judaism: "a Tzadik"
 pam_venerated_saint_judaism_female: "a Tzadeket"
 pam_venerated_saint_other: "a venerated ancestor"
 pam_blessed_ones_christian: "the blessed ones"
 pam_blessed_ones_islam: "the Awliya"
 pam_blessed_ones_hellenism: "the Divi"
 pam_blessed_ones_jainism: "the Siddhas"
 pam_blessed_ones_shintoism: "the Kami"
 pam_blessed_ones_confucianism: "the Xianru"
 pam_blessed_ones_buddhism: "the Āryah"
 pam_blessed_ones_taoism: "the Zhenren"
 pam_blessed_ones_judaism: "the Tzadik"
 pam_blessed_ones_other: "the venerated ancestors"
 # Plain bare noun for names/titles/possessives (no concept link, capitalized fallback), via PamSaintOrAncestorTitleNoun.
 pam_saint_title_noun_christian: "Saint"
 pam_saint_title_noun_islam: "Wali"
 pam_saint_title_noun_hellenism: "Divus"
 pam_saint_title_noun_jainism: "Siddha"
 pam_saint_title_noun_shintoism: "Kami"
 pam_saint_title_noun_confucianism: "Xianru"
 pam_saint_title_noun_buddhism: "Ārya"
 pam_saint_title_noun_taoism: "Zhenren"
 pam_saint_title_noun_judaism: "Tzadik"
 pam_saint_title_noun_other: "Venerated Ancestor"
 pam_saint_title_noun_plural_christian: "Saints"
 pam_saint_title_noun_plural_islam: "Awliya"
 pam_saint_title_noun_plural_hellenism: "Divi"
 pam_saint_title_noun_plural_jainism: "Siddhas"
 pam_saint_title_noun_plural_shintoism: "Kami"
 pam_saint_title_noun_plural_confucianism: "Xianru"
 pam_saint_title_noun_plural_buddhism: "Āryah"
 pam_saint_title_noun_plural_taoism: "Zhenren"
 pam_saint_title_noun_plural_judaism: "Tzadikim"
 pam_saint_title_noun_plural_other: "Venerated Ancestors"
 # Title-cased fallbacks for the name-context commands; the bespoke branches reuse the pam_venerated_saint_* fragments above.
 pam_venerated_saint_other_title: "a Venerated Ancestor"
 pam_venerate_object_other: "an Ancestor"
 pam_consecrate_christian: "consecrate"
 pam_consecrate_others: "enshrine"
 pam_consecrate_christian_past: "consecrated"
 pam_consecrate_others_past: "enshrined"
 pam_consecrate_christian_present: "consecrating"
 pam_consecrate_others_present: "enshrining"

 # Canonize decision - step 2: choose the consecration site (cathedral / holy-site barony)
 pam_choose_consecration_site_decision: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_saint', 'pam_choose_consecration_site_decision_va' )]"
 pam_choose_consecration_site_decision_saint: "Consecrate the Saint"
 pam_choose_consecration_site_decision_va: "Consecrate the [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_choose_consecration_site_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_saint', 'pam_choose_consecration_site_decision_desc_va' )]"
 pam_choose_consecration_site_decision_desc_saint: "I shall choose the [Concept('ecclesiastical_domicile_building','Cathedral')|E] within my [realm|EU] in which to consecrate this holy [Concept('canonized','Saint')|E] and lay their remains to rest, that they may draw the faithful."
 pam_choose_consecration_site_decision_desc_va: "I shall choose the holy place within my [realm|EU] in which to consecrate this [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] and lay their remains to rest, that they may draw the faithful."
 pam_choose_consecration_site_decision_desc_holy_site: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_holy_site_saint', 'pam_choose_consecration_site_decision_desc_holy_site_va' )]"
 pam_choose_consecration_site_decision_desc_holy_site_saint: "I shall choose the [Concept('holy_site','Holy Site')|E] of my [faith|EU] within my [realm|EU] at which to consecrate this holy [Concept('canonized','Saint')|E] and lay their remains to rest, that they may draw the faithful."
 pam_choose_consecration_site_decision_desc_holy_site_va: "I shall choose the [Concept('holy_site','Holy Site')|E] of my [faith|EU] within my [realm|EU] at which to consecrate this [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] and lay their remains to rest, that they may draw the faithful."
 pam_choose_consecration_site_decision_tooltip: "Choose where to consecrate the chosen [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]."
 pam_choose_consecration_site_decision_confirm: "Consecrate"
 pam_choose_consecration_site_decision_select_tt: "Select a site at which to consecrate the [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 # Shown on already-occupied sites in the picker (greyed) - one saint rests per site.
 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"

 # Extract relic decision
 pam_extract_relic_decision: "Extract a Relic"
 pam_extract_relic_decision_desc: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U] lies [GetPlayer.Custom('PamConsecratedEnshrined')] within my realm. With due reverence, a relic may be drawn from their remains to bless the faithful."
 pam_extract_relic_decision_tooltip: "Take a relic from [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')] buried in lands you control."
 pam_extract_relic_decision_confirm: "Extract the Relic"
 pam_extract_relic_decision_req_saint: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U] you may yet draw a relic from rests within your [realm|EU]"
 pam_extract_relic_decision_req_saint_count: "[CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')] of [CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')] [Concept('artifact','relics')|E] extracted from [CHARACTER.GetShortUIName] so far"
 pam_extract_relic_decision_extract_tt: "Create a holy [Concept('artifact','Relic')|E] from the remains of [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_extract_relic_decision_choose_tt: "Choose which buried [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] to draw a [Concept('artifact','Relic')|E] from"
 pam_extract_relic_decision_item_valid_tt: "A holy [Concept('artifact','Relic')|E] may still be drawn from this [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]."

 # Canonization petition sent - awaiting the Head of Faith
 pam_saint_events.0001.t: "The Petition Departs"
 pam_saint_events.0001.desc: "The cause of [saint_candidate.GetFirstName] is made ready, and a place of honour at [consecration_province.GetName] awaits their blessed remains.\n\nNow the matter passes beyond my hands: a petition rides to [petition_recipient.GetTitledFirstName], and I can only pray the judgement is favourable."
 pam_saint_events.0001.a: "Then we wait, and pray."
 pam_saint_events.0001.a.tt_saint: "A petition to recognize [saint_candidate.GetFirstName] as a holy [Concept('canonized','Saint')|E], to be consecrated at [consecration_province.GetName], has been sent to [petition_recipient.GetTitledFirstName]. Their answer will come in time."
 pam_saint_events.0001.a.tt_va: "A petition to honour [saint_candidate.GetFirstName] as [saint_candidate.Custom('PamVeneratedSaintOrAncestor')], to be [saint_candidate.Custom('PamConsecratedEnshrined')] at [consecration_province.GetName], has been sent to [petition_recipient.GetTitledFirstName]. Their answer will come in time."

 # Head of Faith approval request
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]"
 pam_saint_events.0002.t_saint: "A Petition for Sainthood"
 pam_saint_events.0002.t_va: "A Petition for Veneration"
 pam_saint_events.0002.desc_saint: "[canonizer.GetTitledFirstName] beseeches us to number [saint_candidate.GetFirstName] among the blessed saints, consecrated within [consecration_province.GetName]."
 pam_saint_events.0002.desc_va: "[canonizer.GetTitledFirstName] beseeches us to honour [saint_candidate.GetFirstName] among [saint_candidate.Custom('PamBlessedOnesOrAncestors')], [saint_candidate.Custom('PamConsecratedEnshrined')] within [consecration_province.GetName]."
 pam_saint_events.0002.desc.traits_1: "\n\nIn life, [saint_candidate.GetFirstNameNoTooltip] was a [saint_candidate.GetWomanMan] known for being [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_2: "\n\nIn life, [saint_candidate.GetFirstNameNoTooltip] was a [saint_candidate.GetWomanMan] known as [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l] and [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_3: "\n\nIn life, [saint_candidate.GetFirstNameNoTooltip] was a [saint_candidate.GetWomanMan] known as [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l], [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l], and [pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint: "A flickering light emanates from this soul; a modest flame, yet not every saint was forged in a greater fire.\n\nThe judgement rests with us."
 pam_saint_events.0002.desc.virtue_1_va: "A flickering light emanates from this soul; a modest flame, yet not every venerated soul was forged in a greater fire.\n\nThe judgement rests with us."
 pam_saint_events.0002.desc.virtue_2: "Accomplishment of this soul to please [saint_candidate.GetFaith.HighGodName] was not to be undermined — the mark of an evident, if imperfect, grace.\n\nThe judgement rests with us."
 pam_saint_events.0002.desc.virtue_3: "Virtue is the embodiment of this soul; rare is a mortal who wears so much of the divine so plainly.\n\nThe judgement rests with us."
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName] is truly worthy."
 pam_saint_events.0002.a.dynasty_opinion_tt: "[canonizer.GetShortUINamePossessive] [canonizer.GetFaith.GetAdherentName] [Concept('dynasty','dynasty')|E] members gain #P 10#! [Concept('opinion','Opinion')|E] of you for 20 years"
 pam_saint_events.0002.b: "We shall not approve."
 pam_saint_events.0002.b.dynasty_opinion_tt: "[canonizer.GetShortUINamePossessive] [canonizer.GetFaith.GetAdherentName] [Concept('dynasty','dynasty')|E] members lose #N 10#! [Concept('opinion','Opinion')|E] of you for 20 years"

 # Opinion Modifiers
 pam_canonization_approved_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_approved_petitioner_opinion_saint', 'pam_canonization_approved_petitioner_opinion_va' )]"
 pam_canonization_approved_petitioner_opinion_saint: "Approved Canonization of [dynasty|E] Member"
 pam_canonization_approved_petitioner_opinion_va: "Approved Veneration of [dynasty|E] Member"
 pam_canonization_approved_dynasty_opinion: "$pam_canonization_approved_petitioner_opinion$"
 pam_canonization_denied_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_denied_petitioner_opinion_saint', 'pam_canonization_denied_petitioner_opinion_va' )]"
 pam_canonization_denied_petitioner_opinion_saint: "Denied Canonization of [dynasty|E] Member"
 pam_canonization_denied_petitioner_opinion_va: "Denied Veneration of [dynasty|E] Member"
 pam_canonization_denied_dynasty_opinion: "$pam_canonization_denied_petitioner_opinion$"
 pam_canonization_celebrated_dynasty_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_celebrated_dynasty_opinion_saint', 'pam_canonization_celebrated_dynasty_opinion_va' )]"
 pam_canonization_celebrated_dynasty_opinion_saint: "Canonized a [dynasty|E] Member"
 pam_canonization_celebrated_dynasty_opinion_va: "Venerated a [dynasty|E] Member"

 # Canonization approved
 pam_saint_events.0003.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va' )]"
 pam_saint_events.0003.t_saint: "A New Saint"
 pam_saint_events.0003.t_va: "A New [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_saint_events.0003.desc_saint: "It is done. [saint_candidate.GetFirstName] is numbered among the saints, consecrated within [consecration_province.GetName]. May [saint_candidate.GetHerHis] light bless my fellow [saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip] for generations to come."
 pam_saint_events.0003.desc_va: "It is done. [saint_candidate.GetFirstName] is honoured among [saint_candidate.Custom('PamBlessedOnesOrAncestors')], [saint_candidate.Custom('PamConsecratedEnshrined')] within [consecration_province.GetName]. May [saint_candidate.GetHerHis] light bless our realm for generations to come."
 pam_saint_events.0003.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va' )]"
 pam_saint_events.0003.a_saint: "Deo gratias."
 pam_saint_events.0003.a_va: "We give thanks."
 pam_saint_events.0003.a.dynasty_opinion_tt: "Members of your [dynasty|E] who share your [faith|EU] gain #P 20#! [Concept('opinion','Opinion')|E] of you for 20 years"

 # Canonization denied
 pam_saint_events.0004.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va' )]"
 pam_saint_events.0004.t_saint: "Sainthood Denied"
 pam_saint_events.0004.t_va: "Veneration Denied"
 pam_saint_events.0004.desc: "Our petition to [GetPlayer.Custom('PamCanonizeVenerateVerb')] [saint_candidate.GetFirstName] has been refused by [petition_recipient.GetTitledFirstName]. [saint_candidate.GetSheHe|U] shall not be counted among [GetPlayer.Custom('PamBlessedOnesOrAncestors')] this day."
 pam_saint_events.0004.a: "So be it."

 # Relic extraction begun - awaiting the relic
 pam_saint_events.0005.t: "The Reliquary Prepared"
 pam_saint_events.0005.desc: "At [extract_site.GetName], reverent hands set to their solemn labour, that a holy relic of [relic_saint.GetShortUIName] might be drawn from [relic_saint.GetHerHis] blessed remains.\n\nPreparations are underway to celebrate this sacred occasion."
 pam_saint_events.0005.a: "Let it be done with all reverence."
 pam_saint_events.0005.a.tt: "A holy [Concept('artifact','Relic')|E] of [relic_saint.GetShortUIName] will be drawn from [extract_site.GetName] soon."

 # The relic is drawn
 pam_saint_events.0006.t: "A Sacred Relic"
 pam_saint_events.0006.desc_relic: "From the hallowed remains of [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')] within [extract_site.GetName], we have drawn a holy relic: #EMP [relic_artifact.GetName]#!. May it bless the believers of my realm for generations to come."
 pam_saint_events.0006.desc: "From the hallowed remains of [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')] within [extract_site.GetName], a holy [Concept('artifact','Relic')|E] has been drawn to bless our realm."
 pam_saint_events.0006.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va' )]"
 pam_saint_events.0006.a_saint: "Gloria Deo!"
 pam_saint_events.0006.a_va: "We give thanks."
 pam_saint_events.0006.a.tt: "[relic_artifact.GetName] has been drawn and now rests in your keeping."
 pam_dulia_relic_dynasty_prestige_tt: "From the [GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )] [tenet|E]:"

 # Dulia: the faith-wide reward for a canonization, and the message that carries the news to every other ruler of the faith.
 pam_dulia_canonization_faith_bonus_tt: "From the [GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )] [tenet|E], every [ruler|E] of your [faith|E] gains $pam_dulia_new_saint_modifier$ for #EMP 5#! years"
 pam_dulia_new_saint_message_t: "A New Intercessor"
 pam_dulia_new_saint_message_desc: "[pam_new_saint.GetTitledFirstName] is proclaimed a saint, and the faithful of [pam_new_saint.GetFaith.GetName] gain an advocate in heaven"

