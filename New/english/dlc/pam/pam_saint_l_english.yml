# Drawn-relic descriptions - one per type so the description always matches the name
 pam_saint_relic_finger_desc: "An elegant reliquary enshrining a holy finger drawn from the blessed remains of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tooth_desc: "An elegant reliquary enshrining a holy tooth drawn from the blessed remains of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_desc: "An elegant reliquary enshrining a sacred rib drawn from the blessed remains of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hair_desc: "An elegant reliquary enshrining a lock of the holy hair of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_vestment_desc: "An elegant reliquary enshrining a fragment of the vestments once worn by [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hand_desc: "An elegant reliquary enshrining the holy hand preserved from the blessed remains of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_arm_desc: "An elegant reliquary enshrining the sacred arm preserved from the blessed remains of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_desc: "An elegant reliquary enshrining the venerated skull of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_blood_desc: "An elegant reliquary enshrining a vial of the holy blood of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_heart_desc: "An elegant reliquary enshrining the holy heart of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_effigy_desc: "A venerated effigy wrought in the likeness of [relic_creator_saint.GetShortUINameNotMe], honoured by the faithful."
 pam_saint_relic_letter_desc: "An elegant reliquary enshrining a letter written by [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_drawing_desc: "A famous picture drawn by [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_stationery_desc: "A set of stationery that was used by [relic_creator_saint.GetShortUINameNotMe]. It's said that it will bring same wisdom for its holder."
 pam_saint_relic_ash_desc: "An elegant reliquary enshrining the holy cremains of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_canopic_jar_desc: "A jar containing the internal organs of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_staff_desc: "A staff that was used by [relic_creator_saint.GetShortUINameNotMe] on [relic_creator_saint.GetHerHis] pilgrimage trip."
 pam_saint_relic_water_filter_desc: "A piece of cloth that was used by [relic_creator_saint.GetShortUINameNotMe] on [relic_creator_saint.GetHerHis] journeys as a water filter."
 pam_saint_relic_bowl_desc: "A bowl that was used by [relic_creator_saint.GetShortUINameNotMe] while begging for food on [relic_creator_saint.GetHerHis] journeys."
 pam_saint_relic_robe_desc: "An elegant reliquary enshrining the holy robe of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_sword_desc: "A scared sword that was wielded by [relic_creator_saint.GetShortUINameNotMe], said to grant divine protection and strength to the faithful who bear it."
 pam_saint_relic_sarira_desc: "An elegant reliquary enshrining a sarira of [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_buddhism_desc: "An elegant reliquary enshrining a sarira: the usnisa of [relic_creator_saint.GetShortUINameNotMe]."
