 pam_saint_relic_relic_desc: "An elegant reliquary enshrining the holy relic of [relic_creator_saint.GetShortUINameNotMe]."

 # Buried-saint point of interest
 poi_buried_saint: "Tomb of [GetPlayer.Custom('PamVeneratedSaintOrAncestorTitle')]"
 poi_buried_saint.visit: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'poi_buried_saint.visit_saint', 'poi_buried_saint.visit_va' )]"
 poi_buried_saint.visit_saint: "Saint Tomb Visit"
 poi_buried_saint.visit_va: "Ancestral Tomb Visit"
 poi_buried_saint.visit_desc: "Visiting the tomb of [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], you are filled with devotion."
 poi_buried_saint.preset_visit_desc: "You pause at the tomb of [visited_saint.GetShortUIName] and pay your respects."
 poi_buried_saint.foreign_visit: "Ancient Tomb Visit"
 poi_buried_saint.foreign_visit_desc: "Your faith does not venerate [visited_saint.GetShortUIName], but there is much to learn at this tomb."
 pam_poi_buried_saint_on_visit_preset_relic_tt: "Pay your respects for modest [piety_i|E][piety|E], with an option to draw forth a holy [Concept('artifact','Relic')|E] for #EMP less#! than it would cost from afar."
 pam_poi_buried_saint_on_visit_relic_tt: "Pay your respects to [visited_saint.GetShortUIName] with an option to draw forth a holy [Concept('artifact','Relic')|E] for #EMP less#! than it would cost from afar."
 pam_poi_buried_saint_on_visit_no_relic_tt: "Pay your respects to [visited_saint.GetShortUIName], the [visited_saint.Custom('PamSaintOrAncestorNoun')] resting here."

 # Visiting a saint's tomb (player homage)
 pam_saint_events.0007.t: "At the Tomb of [visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.desc: "My travels bring me before the resting place of [visited_saint.GetShortUIName], [visited_saint.Custom('PamVeneratedSaintOrAncestor')] of my faith. The air hangs heavy with sanctity, and about the tomb the faithful kneel in quiet prayer."
 pam_saint_events.0007.a: "I shall pay my respects and move on."
 pam_saint_events.0007.b: "Let us draw forth a sacred relic."
 pam_saint_events.0007.b.tt: "A holy [Concept('artifact','Relic')|E] will be drawn from the remains of [visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.b.toast: "A Sacred Relic Drawn"
 pam_saint_events.0007.b.toast_desc: "With reverent hands, [relic_artifact.GetName] is drawn from the remains of [visited_saint.GetShortUINameNoTooltip] to bless my [realm|EU]."
