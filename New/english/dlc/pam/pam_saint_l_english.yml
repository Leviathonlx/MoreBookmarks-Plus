 pam_saint_relic_ring_desc: "A holy ring that was owned by [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_bracelet_desc: "A holy bracelet that was owned by [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_commentary_desc: "A collection of commentaries written by [relic_creator_saint.GetShortUINameNotMe], showing [relic_creator_saint.GetHerHis] interpretation of [relic_creator_saint.GetFaith.ReligiousText]."
