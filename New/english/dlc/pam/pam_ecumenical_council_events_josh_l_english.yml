l_english:
 ecumenical_council_events_josh.0001.t: "Murder at Compline"
 ecumenical_council_events_josh.0001.desc: "The faithful are so predictable. As [murder_target.GetTitledFirstName] bows in prayer at [Glossary( 'Compline', 'COMPLINE_GLOSS' )], I lurk in the shadows. \n\n[murder_target.GetHerHis|U] long prayers leave [murder_target.GetHerHim] exposed. When we are alone, even fine robes — vestment or velvet — can become a noose."
 ecumenical_council_events_josh.0001.a: "Move to tighten [murder_target.GetHerHis] adornments."
 ecumenical_council_events_josh.0001.a.tt: "A bit too tight for comfort"
 ecumenical_council_events_josh.0001.a.tt2: "[murder_target.GetSheHe|U] escapes my grip"
 ecumenical_council_events_josh.0001.a.toast.success: "Murder succeeded"
 ecumenical_council_events_josh.0001.a.toast.failure: "Murder attempt failed"
 ecumenical_council_events_josh.0001.a.flavor: "Someone that prays that much must be a sinner..."
 ecumenical_council_events_josh.0001.b: "No, not during a sacred act..."
 COMPLINE_GLOSS: "Compline is the night prayer. The final prayer of the day in the Liturgy of the Hours, the daily cycle of prayer used in the Christian tradition."

 ecumenical_council_events_josh.0010.t: "A Saintly Celebration"
 ecumenical_council_events_josh.0010.desc: "The clergy have gathered, and there is no greater joy than celebrating one of our guiding stars. This month, we find it most appropriate to honor [monthly_saint.GetTitledFirstName].\n\n"In [ROOT.Char.GetFaith.HighGodNamePossessive] name, we shall direct this day's worship.""
 ecumenical_council_events_josh.0010.a: "Dedicate the mass."
 ecumenical_council_events_josh.0010.b: "I will hold a sermon."
 ecumenical_council_events_josh.0010.c: "Just add an extra psalm or hymn."

 ecumenical_council_events_josh.0011.t: "Like Thunder"
 ecumenical_council_events_josh.0011.desc: "When I greet the guests, I cannot help but notice [guest_giant.GetTitledFirstName] standing out in the crowd with [guest_giant.GetHerHis] giant posture. But it is when [guest_giant.GetSheHe] speaks, "Greetings, my fellow guardians of the Faith", that I see his true potential. \n\nWith a booming voice like thunder [guest_giant.GetSheHe] could be very useful. The psalms at [Glossary( 'Vesper', 'VESPER_GLOSS' )] could need another bass..."

 ecumenical_council_events_josh.0011.a: "Let [guest_giant.GetHerHis] voice carry our prayers to [ROOT.Char.GetFaith.HighGodName]."
 ecumenical_council_events_josh.0011.a.flavor: "[ROOT.Char.GetFaith.HighGodName] and everyone assembled are awed."
 ecumenical_council_events_josh.0011.b: "I could use his resonant support in the debate instead."
 ecumenical_council_events_josh.0011.b.tt: "[guest_giant.GetSheHe|U] becomes one to rely on"
 ecumenical_council_events_josh.0011.b.tt2: "[guest_giant.GetSheHe|U] can only be trusted when [guest_giant.GetSheHe] gets his share"
 ecumenical_council_events_josh.0011.b.toast.success: "You convince [guest_giant.GetHerHim] to support you."
 ecumenical_council_events_josh.0011.b.toast.failure: "[guest_giant.GetSheHe|U] wants something back to support you."
 ecumenical_council_events_josh.0011.b.flavor: "With [guest_giant.GetTitledFirstName] shouting approvals at the right times I will have the upper hand."
 ecumenical_council_events_josh.0011.c: "[guest_giant.GetSheHe|U] is a guest, not an instrument."
 ecumenical_council_events_josh.0011.c.flavor: "Let [guest_giant.GetHerHim] find [guest_giant.GetHerHis] own place among us."
 ecumenical_council_events_josh.0011.c.tt: "You do not press [guest_giant.GetTitledFirstName] into choir or debate"
 friend_giant_support_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] decided to support [CHARACTER.GetShortUIName] at an Ecumenical Council."
 VESPER_GLOSS: "Vesper is the evening prayer. Usually the prayer before supper in the Liturgy of the Hours, the daily cycle of prayer used in the Christian tradition."

 ecumenical_council_events_josh.0012.t: "A Bishop's Ring"
 ecumenical_council_events_josh.0012.desc: "[guest_bishoplover.GetTitledFirstName] and [guest_bishop.GetTitledFirstName] have been inseparable since the council opened. During [Glossary( 'Laud', 'LAUD_GLOSS' )], [guest_bishoplover.GetFirstName] arrives late and unkempt, and is that [guest_bishop.GetFirstNamePossessive] ring on [guest_bishoplover.GetHerHis] finger? I nod to [guest_bishoplover.GetHerHim] and lift an eyebrow.\n\n[guest_bishoplover.GetFirstName] realizes [guest_bishoplover.GetHerHis] mistake, blushes, and stammers:\n\n"Please, this must stay between us..."" 
 ecumenical_council_events_josh.0012.b: ""Give me the ring and be quiet"."
 ecumenical_council_events_josh.0012.c: ""This is between me, you and [ROOT.Char.GetFaith.HighGodName]"."
 ecumenical_council_events_josh.0012.bishopringname: "Bishop's Ring"
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\nA visible sign of the wearers apostolic ministry."
 LAUD_GLOSS: "Laud is the dawn prayer of the Liturgy of the Hours, the daily cycle of prayer in the Christian tradition."

 ecumenical_council_events_josh.0013.t: "A Crime of Fashion"
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.GetTitledFirstName|U] stands robed in splendor. Wearing a freshly woven vestment made for the occasion, no doubt a gift from [fashion_criminal.GetHerHis] adoring flock. An embroidery of [ROOT.Char.GetFaith.WealthGodName] stares from the stole made of silk. \n\nThe audacity! Is [fashion_criminal.GetSheHe] openly violating the tenets of [fashion_criminal.GetFaith.GetName], or is [fashion_criminal.GetSheHe] just a vain peacock?"
 ecumenical_council_events_josh.0013.a: ""Remove this disgrace from my sight.""
 ecumenical_council_events_josh.0013.b: ""Be gone, you have proven yourself unworthy!""
 ecumenical_council_events_josh.0013.b.toast.success: "You get [fashion_criminal.GetHerHim] expelled."
 ecumenical_council_events_josh.0013.b.toast.failure: "[fashion_criminal.GetSheHe|U] manages to stay at the council."
 fashion_criminal_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] wore something inappropriate at an Ecumenical Council."

 ecumenical_council_events_josh.0020.t: "The Beacon of Fervor"
 ecumenical_council_events_josh.0020.desc.intro: ""Look upon this pillar of [ROOT.Char.GetFaith.GetName]! A true testament to how the righteous follows the cross." \n\n[host.GetTitledFirstName]"
 ecumenical_council_events_josh.0020.desc_battle_memory: " is referring to when [faith_battle_memory.GetDescription]. The heathens must be opposed at every turn. I raise my sword and accept his praise. "For the faithful!""
 ecumenical_council_events_josh.0020.desc.fallback: " is recognizing my recent contributions to the faith. Being called out in company of the gathered clergy makes my chest burst with pride."" 
 ecumenical_council_events_josh.0020.a: ""In [ROOT.Char.GetFaith.HighGodNamePossessive] name we will prevail!""
 ecumenical_council_events_josh.0020.a.flavor: "My actions have moved the attending clergy."
 ecumenical_council_events_josh.0020.b: "I will just bask in the glory."

 ecumenical_council_events_josh.0021.t: "In the Light"
 ecumenical_council_events_josh.0021.desc: "A shaft of light spills across the floor as the debate drags on. I step into it, and suddenly every eye turns towards me. \n\nAs if my words were not enough, the divine light strengthens my cause. My debate opponent [council_opponent.GetFirstName] is left in the shadows. [council_opponent.GetHerHis|U] arguments seems even murkier."
 ecumenical_council_events_josh.0021.a: "Press my advantage against [council_opponent.GetFirstName]."
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.GetShortUINameNoTooltip|U] abandons the [ec_conservatives|E] and joins the [ec_innovators|E]"
 ecumenical_council_events_josh.0021.b: "Let the light win over the assembly."
 ecumenical_council_events_josh.0021.b.ct: "Up to #V 3#! [ec_conservatives|E] join the [ec_innovators|E]"
 ecumenical_council_events_josh.0021.c: "Let them see my splendor."
 ecumenical_council_events_josh.0021.c.ct: "Add #V 50#! [appointment|E] investment toward a [clerical_title|E]"

 ecumenical_council_events_josh.0022.t: "United in Faith"
 ecumenical_council_events_josh.0022.desc: "When making the rounds at the council, [host.GetTitledFirstName|U] sees an opportunity to align [host.GetHerHis] followers against external threats. [host.GetSheHe|U] calls me and [alliance_target.GetTitledFirstName] to stand in front of [host.GetHerHim].\n\n"My devoted, as you stand in faith, you should also stand side by side when facing adversity.""

 ecumenical_council_events_josh.0022.a: "Let the Church bless our alliance."
 ecumenical_council_events_josh.0022.a.flavor: "I will use my pious standing to seal the alliance."
 ecumenical_council_events_josh.0022.b: "The alliance will be built on mutual understanding."
 ecumenical_council_events_josh.0022.b.toast.success: "[alliance_target.GetSheHe|U] agrees to the alliance."
 ecumenical_council_events_josh.0022.b.toast.failure: "[alliance_target.GetSheHe|U] feels offended by your advances."
 ecumenical_council_events_josh.0022.b.flavor: "My charming way with people, will surely be enough."
 ecumenical_council_events_josh.0022.c: "A council is not the place."
 ecumenical_council_events_josh.0022.c.flavor: "A bow in respect is enough."
 alliance_target_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] refused an inappropriate alliance."

 ecumenical_council_events_josh.0023.t: "Pray for Me"
 ecumenical_council_events_josh.0023.desc: ""Grace and peace be upon you." [host.GetTitledFirstName|U] is blessing the guests as they approach. I can seize this moment to throw myself in front of this pillar of the faith. If I could make [host.GetHerHim] to put me in [host.GetHerHis] [Glossary( 'Laud', 'LAUD_GLOSS' )] prayers, I would surely get closer to salvation. \n\n "Move aside, and stop driveling. You are holding up the line." [prayer_opponent.GetFirstName|U] next in line whispers behind me."
 ecumenical_council_events_josh.0023.a: ""A sizable donation, to keep me in your prayers.""
 ecumenical_council_events_josh.0023.b: "Kiss the hem of the hosts vestment"
 ecumenical_council_events_josh.0023.b.tt: "I make sure my request is heard"
 ecumenical_council_events_josh.0023.b.tt2: "I break etiquette and get pushed aside"
 ecumenical_council_events_josh.0023.b.toast.success: "[host.GetTitledFirstName|U] will pray for you."
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.GetTitledFirstName|U] brushes your request away."
 ecumenical_council_events_josh.0023.c: "It is better to step aside and be pious."

 ecumenical_council_events_josh.0024.t: "The Beauty of Mysteries"
 ecumenical_council_events_josh.0024.desc: "Some came here absolutely spoiling for talk of the sacred mysteries, eager to make novel interpretations and squabble. [tenet_target_a.GetName] is one such attendee.\n\n"[tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]! [tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )], my brethren. Honor these strictures [ROOT.Char.GetFaith.HighGodName] has laid before us, seek the wisdom in this way, and you will come to understand the divine!"\n\nVoices rise and fall amid the crowd. The [tenet_target_b.Custom('FormalComplimentAdjective')] [tenet_target_b.GetTitledFirstName], meanwhile, is enthralled by an unfamiliar text. The only words of it I can make out are: "[tenet_target_b_shareable_tenet.GetName( tenet_target_b.GetRite )].""
 ecumenical_council_events_josh.0024.a: ""Wisdom, you say, [tenet_target_a.GetFirstNameNoTooltip]?""
 ecumenical_council_events_josh.0024.b: "That book seems quite interesting."
 ecumenical_council_events_josh.0024.c: "[ROOT.Char.GetFaith.HighGodName] has already shown me the true path."

 ecumenical_council_events_josh.0025.t: "One Theologian Too Many"
 ecumenical_council_events_josh.0025.desc: "A commotion stirs at the edge of the great gathering. A few unusual new arrivals shake off the dust of the road; our prelates whisper and stare, and beckon the newcomers away. The [theologian.GetWomanMan] leading the strangers cries out:\n\n"I have traveled far to bear witness for my fellow [theologian.GetFaith.GetAdherentNamePlural]. Our fathers of old, the holy apostles, were as brothers. Why, then, may I not be admitted among you?""
 ecumenical_council_events_josh.0025.a: "Entrance will come at a cost..."
 ecumenical_council_events_josh.0025.a.flavor: "I can easily add [theologian.GetHerHim] at the bottom of my invite."
 ecumenical_council_events_josh.0025.b: ""Your teachings are a disgrace!""
 ecumenical_council_events_josh.0025.c: ""Fascinating. Let's have our own council later.""
 ecumenical_council_events_josh.0025.d: "Politely usher [theologian.GetHerHim] away."
 
