l_english:
 ##################################################
 # CHRISTIAN SITUATION EVENTS 
 ##################################################

 #Fragile Unity Phase
 pam_the_christian_church.0051.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0051.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName] spans many realms and is composed of myriad, diverse peoples along with their tongues, cultures, and conflicts.\n\nWhile doctrinal disputes are as old as the Church, in these end times, ravaged by plague, war, and heresy, our unity is tested.\n\nAs [st_paul.GetName] the Apostle petitioned the Corinthians to pursue unity, so too should all [christians|E] heed [st_paul.GetHerHis] guidance and [Glossary( 'non sint in vobis schismata', '1_CORINTHIANS_1_10_LATIN_GLOSS' )]. If not, we shall find ourselves mired in heresy, to be but playthings for the Antichrist.\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "Our soft-bodied neighbors, the [christians|E] follow a weak and jealous god, bickering like children over the nature of their doll. All the while their vigilance is dulled, their swords starve, so long it's been since they've feasted on honest bloodletting.\n\nThey hope to send us holy men to spread their weakness in our lands. Might we make our own visitation and pillage their coffers! By our example they may learn again to be strong."
 pam_the_christian_church.0051.desc.heathen_rulers: "Our [christian|E] neighbors are crude, squabbling peoples. They are like silt in the water, a crude mirror for followers of [ROOT.Char.GetFaith.HighGodName]. Stuck in the past, their false beliefs will only lead to their ruin.\n\nTheir treasures, meager as they are, are there for the taking. Their people, ill disciplined as they are, are ripe for subjugation."
 pam_the_christian_church.0051.desc.heretic_rulers: "The ass in the seat of [st_peter.GetName] would name us heretics for being true believers. Were Christ reborn, he would surely make himself a pharisee and call again for our Lord's crucifixion.\n\nLook at the division among us who call Christ our lord! The false priest in Rome is the seedman to this tillage of discord.\n\nThis vice regent of Satan would seek to martyr us. Truly this canker must be lanced for the salvation of all [christians|E]!"
 pam_the_christian_church.0051.desc.western: "With the Bishop of Rome's power diminished we must mend these fissures in the faith as we approach the Last Judgement." 
 pam_the_christian_church.0051.desc.eastern: "Hemmed in by enemies of Christ, we must seek common cause with the Bishop of Rome as we approach the Last Judgement."
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\nThe council has left the crowns free to depose the prelates the Church appoints."
 pam_the_christian_church.0051.desc.oriental_orthodox: ""[Glossary( 'Mia physis tou theou logou sesarkomene', 'MIAPHYSITISM_GLOSS' )]". We must bring our brother's back to the light as we approach the Last Judgement."
 pam_the_christian_church.0051.a: "With Christ as our guide!"
 pam_the_christian_church.0051.b: "We must keep an eye on these followers of Christ."
 MIAPHYSITISM_GLOSS: "#bold "There is one Nature of the Word of God made flesh!"#! St. Cyril of Alexandria proclaimed at the Council of Ephesus in AD 431. This Christological view known as Miaphysitism is commonly held by the Oriental Orthodox."

 #Saeculum Obscurum Phase
 pam_the_christian_church.0052.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0052.desc.intro: "A chorus of voices ring out in the darkness that envelopes [GetSituation('the_christian_church').GetTopSubRegion.GetName].\n\n#EMP "Rome casts itself to play a modern Sodom!"#!\n\n#EMP "The Pope makes himself both pimp and prostitute!"#!\n\nEven those with a more tempered view must admit the Church is in crisis and reform must be sought." 
 pam_the_christian_church.0052.desc.unreformed_pagan: "Our weak-spirited neighbors, the [christians|E] cry out, "Our end is near! Our Pope is as savage as a pagan."\n\nAt least one of those things is true. Let us help them find the end they so often call into being!"
 pam_the_christian_church.0052.desc.heathen_rulers: ""Our Church is in crisis!" the [christians|E] cry out.\n\nGood of them to acknowledge what we have always known. These heathen fools may but hope to one day follow our example in embracing the ways of [ROOT.Char.GetFaith.HighGodName].\n\nTheir treasures, meager as they are, are there for the taking. Their people, ill disciplined as they are, are ripe for subjugation."
 pam_the_christian_church.0052.desc.heretic_rulers: "This Antichrist in the robes of St. Peter must be stopped!"  
 pam_the_christian_church.0052.desc.western: "Change must first be found in Rome, only then can [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip] heal."
 pam_the_christian_church.0052.desc.eastern: "Hemmed in by enemies of Christ, we must cure the corruption in Rome or be consumed by it."
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.a: "May the Lord light our path!"
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$"

 #Conversion Phase
 pam_the_christian_church.0053.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0053.desc.intro: "We must rejoice at the great progress of our mission! The borders of [GetSituation('the_christian_church').GetTopSubRegion.GetName] expand as pagan brutes learn to walk the path of Christ.\n\nRegrettably not all welcome the teachings of the Church. Fear not, if they deny our missionaries, they may learn our prayers at the tip of a sword!\n\n" 
 pam_the_christian_church.0053.desc.unreformed_pagan: "The [christians|E] come to our lands with their holy men. If we turn them away, they come again with their swords.\n\nWhile many of us try to maintain the ways of [ROOT.Char.GetFaith.HighGodName], there are some who see advantages to serving this man-god, this Christ. One's power becomes divinely ordained, the church may serve as our messengers and most enticing, they collect tax."
 pam_the_christian_church.0053.desc.heathen_rulers: "Our neighbors the [christians|E] forcibly convert the idolaters, when they are worth little more than to be slaughtered.\n\nWhile their swords are pointed away from us, [ROOT.Char.GetFaith.HighGodName] opens a window of opportunity. Their treasures, meager as they are, are there for the taking. Their people, ill disciplined as they are, are ripe for subjugation."
 pam_the_christian_church.0053.desc.heretic_rulers: "The pretender in Rome hopes to convert pagans to his misguided worship! This antichrist is not satisfied with simply poisoning the minds of [christians|E], but his perverse appetite calls for bringing those callow idolaters into his hellish embrace."
 pam_the_christian_church.0053.desc.western: "We must be careful these newly born Christians are shepherded to worship [ROOT.Char.GetRite.GetName], as sanctioned by the seat of St. Peter."
 pam_the_christian_church.0053.desc.eastern: "While Rome claims to only seek the conversion of those outside of [GetSituation('the_christian_church').GetTopSubRegion.GetName], we must stay vigilant, should they rob of us our [ROOT.Char.GetRite.GetName], or worse, turn their swords freshly whetted with pagan blood on their fellow Christians."
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$"

 #Reform Phase
 pam_the_christian_church.0054.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.GetTitledFirstName] has a tall task before [christianity.GetReligiousHead.GetHerHim], but the Church is not beyond rescue.\n\n"
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\nYet, the Church is not beyond rescue!\n\n"
 pam_the_christian_church.0054.desc.intro.common: "Our faith in God may be unwavering, but many have lost faith in the Church. Once exemplary in their Christ-like actions, the clergy now bicker about the most basic doctrines."

 pam_the_christian_church.0054.desc.unreformed_pagan: "The [christianity.GetAdherentNamePlural] are tearing at their own clerical finery, hoping God will not notice the patches. If they are busy mending chasubles and annals, perhaps they will send fewer clerics to trouble our groves and river-shrines."
 pam_the_christian_church.0054.desc.heathen_rulers: "The [christianity.GetAdherentNamePlural] are rehearsing a great renovation of their laws and altars, each faction claiming a purer service to a god of suffering. We may mark their new slogans, but the edge of our axes still answers more plainly than their councils."
 pam_the_christian_church.0054.desc.heretic_rulers: "The sectaries of Rome now squabble over reformation! What they call renewal is a reordering of the same yoke, tightened by a deadlier self-righteousness. Let their reform crack skulls in their own basilicas before they remember ours."
 pam_the_christian_church.0054.desc.western: "Though some may call this righting of the tiller reform, the people are wary of innovation and may be more receptive to this being framed as a 'return to the ways of old.'"
 pam_the_christian_church.0054.desc.eastern: "Rome, or whichever curial chamber styles itself the arbiter of the oikoumene, labors to polish its rites: new canons, new oaths, new scolds for ancient sins. We watch, we rebuke, and we strengthen our own synods, lest a western temperance be mistaken for a universal yoke."
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\nThe council has decided for the Church's appointment right, held for life."
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$"

 #Investiture Crisis Phase
 pam_the_christian_church.0055.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\nLay princes press oaths upon [christianity.GetReligiousHeadTitle.GetNamePossessive|U] bishops, as if ordination were another farm to lease. Meanwhile, [christianity.GetReligiousHeadTitle.GetName] forbids crowned hands from blessing mitres they did not consecrate.\n\n"
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\nWithout a shepherd all can recognize, each throne appoints bishops as it pleases; the robes are holy, but the consecrations smell of coin, not incense.\n\n"
 pam_the_christian_church.0055.desc.intro.common: "Across [GetSituation('the_christian_church').GetTopSubRegion.GetName] the feud between altar and throne is no longer mere gossip."

 pam_the_christian_church.0055.desc.unreformed_pagan: "While [christianity.GetAdherentNamePlural] feud about which ordains a bishop, the crown or the cope, fewer missionaries look our way. May kings and pontiffs choke on each other's charters; their division leaves our groves in peace."
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "Rome cries tyranny over investiture, yet would clap our teachers in fetters if it could grasp them! Strike the collars from your necks, Pharisees, and then lecture us!"
 pam_the_christian_church.0055.desc.western: "If we bend the crozier too far toward the sceptre, the two may even get conflated.\n\n"
 pam_the_christian_church.0055.desc.eastern: "Western kings squabble with Rome over rings and staffs, and their sins stain the entire Church.\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$"

 #Crusade Phase
 pam_the_christian_church.0056.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0056.desc.intro: "Across all [GetSituation('the_christian_church').GetTopSubRegion.GetName] the faithful claim for the liberation of the Holy Sepulcher. Crosses are polished for march, relics pawned into war chests.\n\nFervor burns with a passion, but should this fever cool, zeal may curdle into doubt as quickly as ash drifts from a pyre.\n\n"
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers: "Their war-preachers call crusade while neglecting their own lands: let Romans exhaust themselves on distant dunes."
 pam_the_christian_church.0056.desc.western: "Steel may get what sermons cannot reach.\n\n"
 pam_the_christian_church.0056.desc.eastern: "The western hosts march towards the Holy Land.\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$"

 #Concord Phase
 pam_the_christian_church.0057.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$ under [christianity.GetReligiousHeadTitle.GetNamePossessive|U] attentive watch.\n\n"
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$.\n\nEven without one undisputed shepherd, faith is bound to reason anew.\n\n"
 pam_the_christian_church.0057.desc.intro.common: "The Church's quarrels are put to a halt. [GetSituation('the_christian_church').GetTopSubRegion.GetName] welcomes an age of peace and communion"

 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.western: "The schools may pile argument on argument, yet most souls still catch God through the words of a priest.\n\nWe must not forget that ours is a religion of the people."
 pam_the_christian_church.0057.desc.eastern: "We still raise prayer in chant while western desks groan under heavy treaties. Harmony is welcome, but their school quarrels ought not stroll into our chanceries."
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$"

 #Shared notification: a council is coming (fired when the crisis timer elapses)
 pam_the_christian_church.0058.t: "A Council Is Summoned"
 pam_the_christian_church.0058.desc: "The long years of the [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] reach their climax. A council is summoned to settle, once and for all, who shall invest the clergy: the Church or the crown."
 pam_the_christian_church.0058.a: "Let it be decided."

 #Shared notification: the Investiture Council has convened (fired from the activity as it starts)
 pam_the_christian_church.0059.t: "The Council Convenes"
 pam_the_christian_church.0059.desc.located: "The summons are sent, and the fathers of the Church gather for the Investiture Council, convened by [investiture_convene_host.GetTitledFirstName] in [investiture_convene_location.GetName]. For all of Christendom, their ruling will decide which invests the clergy: the Church or the crown."
 pam_the_christian_church.0059.desc: "The summons are sent, and the fathers of the Church gather for the Investiture Council. For all of Christendom, their ruling will decide which invests the clergy: the Church or the crown."
 pam_the_christian_church.0059.a: "Let them deliberate."

 pam_the_christian_church_not_hof_trigger_tt: "You are not the Head of Faith"

 #Shared option tooltip on the "council is coming" notifications (0058, and the HoF letter 0050)
 pam_investiture_upcoming_council_tt: "A special council of the Church will soon convene to decide your [faith|E]'s next Clerical Appointment [doctrine|E]."

 pam_the_christian_church.0060.t: "No Divisions Among You"
 pam_the_christian_church.0060.desc: "Christendom balances on a knife's edge. [schism_mainline_rite.GetName] claims the inheritance of the apostles, and [schism_competitor_rite.GetName] refuses to yield.\n\nChrist Himself warned that [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. If the wound festers through this crisis, the Church may never again have one voice."
 pam_the_christian_church.0060.a: "I stand with [schism_mainline_rite.GetNameNoTooltip]."
 pam_the_christian_church.0060.a.tt: "Contributes toward the [GetDecisionWithKey('pam_cause_great_schism_decision').GetName] [decision|E]"
 pam_the_christian_church.0060.b: "I stand with [schism_competitor_rite.GetNameNoTooltip]."
 pam_the_christian_church.0060.b.tt: "Contributes toward the [GetDecisionWithKey('pam_cause_great_schism_decision').GetName] [decision|E]"
 pam_the_christian_church.0060.c: "A body must have two arms."
 pam_the_christian_church.0060.c.tt: "Contributes toward the [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName] [decision|E]"

 pam_the_christian_church.0061.t: "The Great Schism"
 pam_the_christian_church.0061.desc: "Envoys from [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] have cast their sentence upon the altar:\n\n"May [schism_eastern_faith.GetReligiousHead.GetFirstName], falsely called [schism_eastern_faith.ReligiousHeadName], and all his followers be anathematized. [Glossary( 'Maranatha', 'MARANATHA_GLOSS' )] with all heretics! Nay, with the devil and his angels, unless they should repent."\n\n"This impious document shall be anathematized along with those who edited it, wrote it, or had anything to do with it." Replies [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip].\n\nThe faithful are divided into [schism_western_faith.GetAdherentNamePlural] and [schism_eastern_faith.GetAdherentNamePlural]. My soul is now [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 pam_the_christian_church.0061.desc.bystander: "Word comes from [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]: the legates have laid a sentence of anathema upon the altar, and [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip] has answered them in kind.\n\nThose who called themselves one Church are divided now into [schism_western_faith.GetAdherentNamePlural] and [schism_eastern_faith.GetAdherentNamePlural]. Their quarrel was never mine, and the [ROOT.Char.GetFaith.GetName] faith is unchanged by it, yet it is a bitter thing to watch."
 pam_the_christian_church.0061.a: "So be it."
 pam_the_christian_church.0061.a.shame: "Truly a shame."
 pam_the_christian_church.0061.a.bystander: "Such a shame when brothers fight."
 MARANATHA_GLOSS: "An Aramaic cry meaning #bold "Our Lord, come!"#! From 1 Corinthians 16:22, it became a formula of anathema: those cursed are cast out until the Lord returns."

 pam_the_christian_church.0062.t: "Communion Preserved"
 pam_the_christian_church.0062.desc: "The wound that threatened to split Christendom is stitched closed. Through the labors of [schism_peacemaker.GetTitledFirstName], the quarreling sees share a table once more.\n\n[Glossary( 'Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus... Unus Dominus, una fides, unum baptisma.', 'EPHESIANS_4_3_6_LATIN_GLOSS' )]\n\n[ROOT.Char.GetFaith.GetName] stays in communion."
 pam_the_christian_church.0062.a: "Blessed be the Lord."
 pam_the_christian_church.0062.a.peacemaker: "No single see shall rule the rest."
 pam_the_christian_church.0062.b: "Let [new_head_of_faith.GetTitledFirstNameNoTooltip] shepherd us all."
 pam_the_christian_church.0062.b.self: "Then the whole flock shall answer to me."

 pam_the_christian_church.0063.t: "The One Left Behind"
 pam_the_christian_church.0063.desc: "I have crossed to [ROOT.Char.GetRite.GetName], but [schism_dissenter.GetTitledFirstName] has not followed. [schism_dissenter.GetSheHe|U] will not stop fretting over my soul and the flock I abandoned:\n\n"You have left us," [schism_dissenter.GetSheHe] says quietly. "When the Church is torn asunder... and it will be... you and I shall stand on opposite sides of the wound.""
 pam_the_christian_church.0063.a: "The same God hears us both."
 pam_the_christian_church.0063.b: "Let me show you why I crossed."
 pam_the_christian_church.0063.b.success: "[schism_dissenter.GetTitledFirstNameNoTooltip] crosses with me"
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.GetTitledFirstNameNoTooltip] will not be moved"
 pam_the_christian_church.0063.c: "Keep your fears to yourself."

 pam_the_christian_church.0064.t: "The Wound Will Open"
 pam_the_christian_church.0064.desc.opening.self_mainline: "My voice rings against that of the [schism_competitor_head.GetTitledFirstName]."
 pam_the_christian_church.0064.desc.opening.self_competitor: "My voice rings against that of the [schism_mainline_head.GetTitledFirstName]."
 pam_the_christian_church.0064.desc.opening: "The voices of [schism_mainline_head.GetTitledFirstName] and [schism_competitor_head.GetTitledFirstName] ring against each other. "
 pam_the_christian_church.0064.desc: "I hear no path back to concord between [schism_mainline_rite.GetName] and [schism_competitor_rite.GetName].\n\nThe warning of Scripture has become a sentence: [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. Communion within [christianity.GetName] has not yet broken, but the wound will open. Its hour is inevitable."
 pam_the_christian_church.0064.a: "God, do not forsake us."
 pam_the_christian_church.0064.a.tt: "Great Schism progress has reached its threshold"
