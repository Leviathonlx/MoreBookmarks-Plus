l_english:
 pam_curse_enemy_decision: "Curse an Enemy"
 pam_curse_enemy_decision_desc: "#F Who is this fool to stand against me? I will name them before the spirits and pour every grievance, every insult, and every curse upon them. Let them laugh while they can; their reckoning will come soon enough.#!"
 pam_curse_enemy_decision_tooltip: "Perform a ritual against a rival or opponent in one of your [wars|E]"
 pam_curse_enemy_decision_confirm: "Begin the Rite"
 pam_curse_enemy_decision_valid_target: "You have a living adult [rival|E], [nemesis|E], or war enemy"
 pam_curse_enemy_decision_selected_target_valid: "Your selected enemy is still a living adult [rival|E], [nemesis|E], or war enemy"
 pam_curse_enemy_decision_no_item_selected: "No enemy selected"

 pam_seek_war_aid_decision: "Seek Aid for War"
 pam_seek_war_aid_decision_desc: "#F War tests more than arms and numbers. I will petition the spirits for insight, vigor, or endurance enough to carry my cause through the trials ahead.#!"
 pam_seek_war_aid_decision_tooltip: "Petition the spirits for aid in your current wars"
 pam_seek_war_aid_decision_confirm: "Call on the Spirits"

 pam_adorcism_events.0001.t: "A Name Before the Spirits"
 pam_adorcism_events.0001.desc: "In a secluded place, I scratch [pam_adorcism_curse_target.GetTitledFirstNamePossessive] name into the earth and speak every grievance aloud. The rite cannot break bones or wither crops, but that is not its purpose.\n\nWhen I rise, my anger has cooled into intent. Every rumor about [pam_adorcism_curse_target.GetHerHim] now seems like a thread waiting to be pulled."
 pam_adorcism_events.0001.a: "My purpose is clear."

 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]"
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U], I have spoken your name before the spirits and laid a curse upon you. When misfortune finds you, remember that it was my will that called it forth."
 pam_adorcism_events.0002.desc.default: "\n\nI have spoken your name before the spirits and laid a curse upon you. When misfortune finds you, remember that it was my will that called it forth."
 pam_adorcism_events.0002.a: "Someone fetch the [ROOT.Char.GetFaith.PriestNeuter] — quickly!"
 pam_adorcism_events.0002.a.flavor: "The curse gnaws at your thoughts, and every shadow feels like an omen."

 pam_adorcism_events.0101.t: "Counsel from the Unseen"
 pam_adorcism_events.0101.desc: "Beyond the camp's last fire, I pour out an offering and listen while the sounds of the host fade behind me. Wind stirs the dust, carrying no clear voice, yet the ritual steadies my thoughts.\n\nI must decide what aid to seek for the campaign ahead."
 pam_adorcism_events.0101.a: "Show me the path to victory."
 pam_adorcism_events.0101.b: "Lend strength to my sword arm."
 pam_adorcism_events.0101.c: "Give my host endurance."

 pam_adorcism_curse_focus_modifier: "Anger Redirected"
 pam_adorcism_curse_focus_modifier_desc: "This character has named the object of their fury and cast it outward through ritual."
 pam_adorcism_ill_omen_modifier: "Marked by Ill Omen"
 pam_adorcism_ill_omen_modifier_desc: "Members of this character's rite regard them with suspicion after rumors of a curse."
 pam_adorcism_curse_anxiety_modifier: "Dreading the Curse"
 pam_adorcism_curse_anxiety_modifier_desc: "This character cannot shake the thought that every coming misfortune was called down upon them."
 pam_adorcism_battle_guidance_modifier: "Spirit-Guided Strategy"
 pam_adorcism_battle_guidance_modifier_desc: "This character believes the spirits have revealed favorable signs for battle."
 pam_adorcism_personal_vigor_modifier: "Spirit-Given Vigor"
 pam_adorcism_personal_vigor_modifier_desc: "Ritual confidence lends this character strength in personal combat."
 pam_adorcism_campaign_endurance_modifier: "Spirit-Sustained Host"
 pam_adorcism_campaign_endurance_modifier_desc: "This character's armies endure long campaigns with renewed conviction."
