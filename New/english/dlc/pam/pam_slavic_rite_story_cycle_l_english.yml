l_english:

 # MAIN EVENTS
 # Introduction by the realm priest
 slavic_rite.1000.t: "The Glagolitic Script"
 slavic_rite.1000.desc: ""Go on, brother [greek_preacher.GetFirstName]," my [court_chaplain.GetActiveCouncilTask.GetPositionName] ushers the [greek_preacher.Custom('MyPriestTitle')] who is a follower of the [GetRiteByKey('byzantine_rite').GetAdjective].\n\n"Blessed be your realm, O [ROOT.Char.GetTitleAsNameNoTooltip]. My brothers are progressing well on a script for your people. Alas, we work under the shadow and threat of [GetRiteByKey('carolingian_christianity').GetAdherentName] priests who hope to claim ecclesiastical authority over your lands. [Glossary('Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS')] asked me to request more time to develop a strategy to avoid conflicts and work out a diplomatic solution.""
 slavic_rite.1000.a: "We have come this far. I am counting on them."
 slavic_rite.1000.a_tt: "[Glossary( 'Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS' )], the brothers who created a new Slavic script, will soon inform you of their next move to spread a new [court_chaplain.GetFaith.GetAdjective] [rite|E] in your realm."
 slavic_rite.1000.b: "Better to abandon this course than feel [GetRiteByKey('carolingian_christianity').GetAdherentNameNoTooltip] wrath."
 slavic_rite.1000.b_tt: "All efforts of developing a local script and establishing a new [rite|E] by [Glossary('Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS')] are abandoned."
 slavic_rite.1000.b_tt_2: "$story_slavic_rite$ [story_cycle|E] ends."

 # Travel to Rome Initiation
 slavic_rite.0001.t: "The Moravian Mission"
 slavic_rite.0001.desc: "I am relieved to see [Glossary( 'Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS' )] again, and hope they have a plan to contend with [GetRiteByKey('carolingian_christianity').GetAdherentName] interference.\n\n"Honorable [ROOT.Char.GetTitleAsNameNoTooltip], it would seem the only way to assure the safety of your people's form of worship is to journey to [pope_scope.GetCapitalLocation.GetBaronyNameExplicitly] and receive the blessing of [pope_scope.GetTitledFirstName]."\n\nI do hope the authority of the throne of St. Peter may reign in the domineering [GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip], but they seem to only honor their own."
 slavic_rite.0001.a: "Godspeed."
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName] and [methodius_scope.GetFirstName] will begin their journey. If it proves successful, their return may spark a new religious movement throughout your realm."
 slavic_rite.0001.b: "I won't have you leave empty-handed."
 slavic_rite_travel_toast_title: "Cyril and Methodius begin their journey"
 slavic_rite_moravian_mission_gift_sent_tooltip: "A gift package will be sent to [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. The brothers will inform you of the reception upon returning."

 # Archbishop of Salzburg informed of the Rite
 slavic_rite.0003.t: "Birth of [methodius_scope.GetRite.GetName]"
 slavic_rite.0003.desc: "I have received word that [methodius_scope.GetFirstNameNoTooltip], with the aid of [moravia_liege_scope.GetTitledFirstNameNoTooltip] is trying to spread a new way of practicing [methodius_scope.GetFaith.GetNameNoTooltip] far and wide within the [moravia_liege_scope.GetCulture.GetNameNoTooltip] lands. My scholars call it [methodius_scope.GetRite.GetName].\n\nDespite our previous efforts to liken the locals to us, [methodius_scope.GetSheHe] managed to secure an approval from [pope_scope.GetTitledFirstName] to exercise a newly found script upon them."
 slavic_rite.0003.a: "Let's see how successful [methodius_scope.GetHerHis] ways are."

 # Vassals of Moravia informed of the Rite
 slavic_rite.0004.t: "The [ROOT.Char.GetCulture.GetNameNoTooltip] [methodius_scope.GetRite.GetNameNoTooltip]"
 slavic_rite.0004.desc_pagan: "Intriguing news have arrived to my court this morning.\n\n[liege_scope.GetTitledFirstNameNoTooltip] has allowed the [methodius_scope.GetCulture.GetNameNoTooltip] priest [methodius_scope.GetFirstNam] to further spread [methodius_scope.GetHerHis] profane ways in our lands for years. [methodius_scope.GetFaith.GetNameNoTooltip] will be shaped to ease the [ROOT.Char.GetCulture.GetNameNoTooltip] way of living for those who wish to practice it.\n\nThere has been far too much fuss lately regarding the spiritual nature of our traditions. I may finally have to think about how to proceed with all of this."
 slavic_rite.0004.desc_chalcedonian: "Our [liege_scope.GetTitleAsNameNoTooltip] has decreed the establishment of [methodius_scope.GetRite.GetNameNoTooltip] to be spread throughout [liege_scope.GetHerHis] realm. According to my scholars, it is a more convenient path to practice [methodius_scope.GetFaith.GetNameNoTooltip] without compromising our way of life.\n\nPerhaps it is worth the attention?"
 slavic_rite.0004.a_pagan: "Our ancestors' customs are superior." 
 slavic_rite.0004.b_pagan: "Perhaps there is some truth to this..."
 slavic_rite.0004.a_chalcedonian: "I have no desire to stray from the true path." 
 slavic_rite.0004.b_chalcedonian: "Bring forth the scholars."

 # Return of Methodius and the Slavic Rite
 slavic_rite.0005.t: "A Bittersweet Journey"
 slavic_rite.0005.desc: "[methodius_scope.GetFirstName] stands before me, alone this time after [methodius_scope.GetHerHis] return from [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. When I ask him about [cyril_scope.GetFirstName], [methodius_scope.GetHerHis] expression sours.\n\n"The good news, merciful [ROOT.Char.GetTitleAsNameNoTooltip], is that [pope_scope.GetTitledFirstName] has given [pope_scope.GetHerHis] blessing for us to spread the faith among the [ROOT.Char.GetCulture.GetNameNoTooltip] people and throughout your realm, using our own methods and scripture." He takes a deep breath. "But alas, I was forced to leave my brother behind. I will do my best to ensure that our efforts are not in vain. May [ROOT.Char.GetFaith.HighGodName] help us all.""
 slavic_rite.0005.a: "Together, we will make your brother proud!"
 slavic_rite.0005.b: "Least I can do is to honor his legacy."
 pam_cyril_statue_modifier: "Memorial of Cyril"
 pam_brothers_travel_safety_modifier: "Cautious Travel"
 slavic_rite.0005.c: "Good luck on your mission."
 slavic_rite_mass_conversion_tooltip: "A Mass Conversion [great_project|E] is planned for all [duchies|E] in [moravia_liege_scope.GetPrimaryTitle.GetNameNoTier] with the goal of converting their [counties|E] to [methodius_scope.GetRite.GetName]"
 slavic_rite_moravian_mission_gift_received_tooltip: "Your gift to [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] has been received with gratitude."
 slavic_rite_ecclesiastical_title_creation_tooltip: "$slavic_rite_ecclesiastical_title$ is created and [methodius_scope.GetFirstName] becomes its first [holder|E]"
 slavic_rite_ecclesiastical_title: "$d_et_archdiocese_prefix$ of Moravia"
 slavic_rite_ecclesiastical_title_name: "Moravia"

 # Return of Methodius and the Slavic Rite
 slavic_rite.0006.t: "End of the Moravian Mission"
 slavic_rite.0006.desc.brothers_are_dead: "With the passing of brothers, [Glossary('Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS')], no one is sufficiently qualified to continue their liturgical work. We must develop our own approaches to accomplish the complete conversion of my people if we still desire it."
 slavic_rite.0006.desc.no_longer_christian: "I have seen the path to glory. What once motivated me to bring happiness to my people and my house now seems utterly insignificant. The route they were destined for was different from what I desired for them. Thankfully, [ROOT.Char.GetFaith.HighGodName] has shown us the straight path."
 slavic_rite.0006.desc.no_longer_king: "Recent events and the loss of my powerful position have taught me not to take on more than one can handle. We cannot currently sustain the Moravian mission. Maybe once we recover, we can attempt it again under new terms.\n\nUntil then, [ROOT.Char.GetPrimaryTitle.GetNameNoTier] needs to be protected to avoid the same fate."
 slavic_rite.0006.desc.no_longer_slav: "My ancestors would probably not be so proud of who I have become.\n\nSo be it. It is not for them to decide how to rule [ROOT.Char.GetPrimaryTitle.GetNameNoTier], only I can."
 slavic_rite.0006.a.brothers_are_dead: "It was not meant to be..."
 slavic_rite.0006.a.no_longer_christian: "[ROOT.Char.GetFaith.HighGodName] be praised!"
 slavic_rite.0006.a.no_longer_king: "I can't afford such ambitions anymore."
 slavic_rite.0006.a.no_longer_slav: "The Glagolitic alphabet was a burden upon my people."
 slavic_rite.0006.a.tooltip: "$story_slavic_rite$ to evangelize the realm has been obsolete."

 # All counties under the new archdiocese are successfully converted to Slavic Rite, and the story ends
 slavic_rite.0007.t: "A Realm United by [ROOT.Char.GetFaith.HighGodName]"
 slavic_rite.0007.desc: ""#italic ...that under [ROOT.Char.GetHerHis] rule we may lead a quiet and peaceable life\nin all godliness and dignity.\n\nFor Thine is the kingdom, the power, and the glory,\nnow and ever, and unto ages of ages. Amen.#!"\n\nAs [archdiocese_holder.GetTitledFirstName] concludes the prayer, a feeling of eternal bliss washes over my soul. Our mission to have our own heavenly tradition reach all corners of my realm proved to be triumphant. May [ROOT.Char.GetFaith.HighGodName] bless my house, [Glossary( 'Cyril and Methodius', 'CYRIL_AND_METHODIUS_GLOSS' )], and the fair folk of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 slavic_rite.0007.a: "We were destined to tread the consecrated path."
 pam_slavic_rite_clergy_opinion_modifier: "Blessed Monarch"
 slavic_rite.0007.b: "There is nothing my people cannot endure."
 pam_slavic_rite_culture_opinion_modifier: "People's Monarch"

 # RANDOM EVENTS
 # 0010 - Conflict with Frankish preachers
 slavic_rite.0010.t: "Clandestine Preachers"
 slavic_rite.0010.desc: "Escorted by my chaplain, [court_chaplain.GetTitledFirstName], a [undercover_preacher.GetCulture.GetNameNoTooltip] [undercover_preacher.Custom('MyPriestTitle')] and [undercover_preacher.GetHerHis] entourage of preachers enter my hall with shameless faces.\n\n"Salutations, my [ROOT.Char.GetTitleAsNameNoTooltip]. We found these infiltrators preaching the words of [ROOT.Char.GetFaith.HighGodName] without honoring the authority of [court_chaplain_superior.GetTitledFirstName], or yourselves." [court_chaplain.GetSheHe|U] pauses to eye the foreigner from head to foot, before facing you once more.\n\n"Word is, they have been lurking in the shadows for quite a while now, attempting to persuade and defile the souls of your unsuspecting subjects. How would you like us to treat them?""
 slavic_rite.0010.a: "Begone, and do not ever return to my lands."
 slavic_rite.0010.b: "Our previous warnings were not sufficient, apparently."
 slavic_rite.0010.c: "You do not have to face your disappointed masters."
 slavic_rite.0010.c.success: "[undercover_preacher.GetSheHe|U] is eager to start a new life at your court"
 slavic_rite.0010.c.failure: "[undercover_preacher.GetSheHe|U] is not persuaded"
 preacher_recruited.t: "Preacher Recruited"
 preacher_left.t: "Preacher Left"

 # 0020
 slavic_rite.0020.t: "Grant for a Godly Cause"
 slavic_rite.0020.desc: ""They do not wish to take advantage of the locals, my [ROOT.Char.GetTitleAsNameNoTooltip]. [court_chaplain_superior.GetTitledFirstNamePossessive]'s roaming preachers are very considerate in that way. They even wanted me to talk to you, which was commendable humility. A confirmation would make the whole effort much easier on them and your people."\n\n[court_chaplain.GetTitledFirstNamePossessive] effort to persuade me on behalf of others is notable, but I can't help wondering whether [court_chaplain.GetSheHe] should focus these talents on helping my people let go of their old traditions instead.\n\n"I have a feeling that this is [ROOT.Char.GetFaith.HighGodNamePossessive] way of providing you an opportunity to be closer.""
 slavic_rite.0020.a: "The faster we rid my people of ungodliness, the better."
 pam_slavic_rite_great_project_speed_modifier: "Funded Conversion Project"
 slavic_rite.0020.b: "This is all we can spare."
 slavic_rite.0020.c: "Absolutely not."

 # 0030
 slavic_rite.0030.t: "A Debate of East and West"
 slavic_rite.0030.desc: "A gentle breeze sways leaves in the monastery garden as two guest clerics of [court_chaplain_superior.GetTitledFirstName] face each other among debating groups. One is dressed in the eastern tradition, the other commands western authority. Their initially humble voices grow confident and passionate.\n\nThey discuss many liturgical topics, moving from scholarly debate to fascinating arguments as I become increasingly interested in every sentence.\n\nThis is more than a conversation; it symbolizes a contest between two worlds, hinting at fragile harmony or a deeper divide."
 slavic_rite.0030.a: "The [visiting_byzantine_clergy.GetCulture.GetNameNoTooltip] [visiting_byzantine_clergy.Custom('MyPriestTitle')] makes a lot of sense."
 slavic_rite.0030.b: "There is something intriguing about [visiting_carolingian_clergy.GetNamePossessiveNoTooltip] argument."
 slavic_rite.0030.c: "Knowledge is knowledge, I agree with both."
 slavic_rite.0030.d: "Our ways are superior to these ancient principles."
