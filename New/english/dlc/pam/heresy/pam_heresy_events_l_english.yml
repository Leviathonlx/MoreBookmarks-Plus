l_english:
 ##############################################
 # PAM heresy system - rite type localization #
 ##############################################
 cathar_rite: "$cathar$"
 cathar_rite_name: "Cathar"
 cathar_rite_adj: "Cathar"
 cathar_rite_adherent: "Cathar"
 cathar_rite_adherent_plural: "Cathars"
 cathar_rite_desc: "An austere dualist rite that holds the material world to be the work of an evil demiurge. Its perfecti take vows of poverty and chastity, reject the sacraments of the established church, and refuse military service in the name of God."

 waldensian_rite: "$waldensian$"
 waldensian_rite_name: "Waldensian"
 waldensian_rite_adj: "Waldensian"
 waldensian_rite_adherent: "Waldensian"
 waldensian_rite_adherent_plural: "Waldensians"
 waldensian_rite_desc: "A rite of barefoot mendicant preachers who insist that the laity may preach scripture, that the institutional church has no exclusive claim on grace, and that Christians should hold no property or take up arms."

 lollard_rite: "$lollard$"
 lollard_rite_name: "Lollard"
 lollard_rite_adj: "Lollard"
 lollard_rite_adherent: "Lollard"
 lollard_rite_adherent_plural: "Lollards"
 lollard_rite_desc: "A vernacular reform rite that rejects ornate ritual, transubstantiation, the cult of relics, and a wealthy clergy. The Bible is read in the common tongue and every believer is held to be a priest in their own right."

 hussite_rite: "$hussite$"
 hussite_rite_name: "Hussite"
 hussite_rite_adj: "Hussite"
 hussite_rite_adherent: "Hussite"
 hussite_rite_adherent_plural: "Hussites"
 hussite_rite_desc: "A Bohemian reform rite that demands the chalice for the laity, scripture in the vernacular, and an end to clerical wealth and the sale of indulgences. Its preachers draw heavily on Wycliffite arguments and the burning conviction that Rome has strayed from the apostolic path."

 joachimite_rite: "$joachimite$"
 joachimite_rite_name: "Joachimite"
 joachimite_rite_adj: "Joachimite"
 joachimite_rite_adherent: "Joachimite"
 joachimite_rite_adherent_plural: "Joachimites"
 joachimite_rite_desc: "An apocalyptic rite that reads history in three ages: Father, Son, and a coming Age of the Holy Spirit that will dissolve the institutional Church and raise up a new contemplative order. Its adherents wander in apostolic poverty, preach in the marketplaces, and gaze with bright eyes at the imminent end of the world."

 iconoclast_rite: "$iconoclast$"
 iconoclast_rite_name: "Iconoclast"
 iconoclast_rite_adj: "Iconoclast"
 iconoclast_rite_adherent: "Iconoclast"
 iconoclast_rite_adherent_plural: "Iconoclasts"
 iconoclast_rite_desc: "A revival of the old eastern aniconist movement, condemning the veneration of images as a creeping idolatry and demanding that icons be stripped from churches and homes alike."

 bogomilist_rite: "$bogomilist$"
 bogomilist_rite_name: "Bogomilist"
 bogomilist_rite_adj: "Bogomilist"
 bogomilist_rite_adherent: "Bogomilist"
 bogomilist_rite_adherent_plural: "Bogomilists"
 bogomilist_rite_desc: "A Slavic dualist rite that traces its roots to the priest Bogomil. Its preachers travel barefoot, reject hierarchy, refuse to bear arms, and teach that Satan is the maker of the visible world."

 paulician_rite: "$paulician$"
 paulician_rite_name: "Paulician"
 paulician_rite_adj: "Paulician"
 paulician_rite_adherent: "Paulician"
 paulician_rite_adherent_plural: "Paulicians"
 paulician_rite_desc: "A martially-oriented dualist rite born in Asia Minor. Scornful of icons and established religious hierarchies, its followers prize the unmediated reading of Paul's epistles, and are quite willing to take up arms in defense of their purity."

 messalian_rite: "$messalian$"
 messalian_rite_name: "Messalian"
 messalian_rite_adj: "Messalian"
 messalian_rite_adherent: "Messalian"
 messalian_rite_adherent_plural: "Messalians"
 messalian_rite_desc: "An esoteric, ascetic rite which regards ceaseless prayer as the only sacrament of any worth. For once the demon dwelling within a believer is expelled, no carnal act can ever defile that believer again."

 adoptionist_rite: "$adoptionist$"
 adoptionist_rite_name: "Adoptionist"
 adoptionist_rite_adj: "Adoptionist"
 adoptionist_rite_adherent: "Adoptionist"
 adoptionist_rite_adherent_plural: "Adoptionists"
 adoptionist_rite_desc: "A Christological rite from Iberia teaching that Christ, in his humanity, was the adopted and not the natural Son of God — a doctrine the Carolingian church condemned as Crypto-Nestorianism."

 ###################################
 # Fervor reset descriptions       #
 ###################################
 pam_heresy_fervor_reset_component_1_desc: "Faithful rallied against rising [rite_divergence|E]"
 pam_heresy_fervor_reset_component_2_desc: "Faithful rallied against a new schismatic [rite|E]"
 pam_heresy_fervor_reset_component_3_desc: "Faithful rallied against a heretical revival"

 ###################################
 # Component 1 - Light divergence  #
 ###################################
 heresy_light.0010.t: "Heretical Divergence"
 heresy_light.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName] "
 heresy_light.0010.desc.body.uneasy: "has bent [new_rite.GetName] further still from [source_rite.GetAdjective], "
 heresy_light.0010.desc.body.alarming: "has pulled [new_rite.GetName] dangerously far from accepted [source_rite.GetAdjective] practice, "
 heresy_light.0010.desc.body.dangerous: "has diverged [new_rite.GetName] into something [source_rite.GetAdjective] can barely recognise as kin, "
 heresy_light.0010.desc.differing.tenet: "with the most striking departure being [differing_tenet.GetBaseName]."
 heresy_light.0010.desc.differing.doctrine: "with the most striking departure being [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )]."
 heresy_light.0010.desc.differing.fallback: "the new emphases too subtle for any single name."

 ###################################################
 # Component 2 - New dangerously divergent rite    #
 ###################################################
 heresy_dangerous_rite.0010.t: "A Heretical Rite"
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "The [founder.GetCulture.GetName] Archbishop [founder.GetFirstName] "
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName] "
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "of the [founder_clerical_title.GetNameNoTier] "
 heresy_dangerous_rite.0010.desc.opener.lands: "of [founder.GetPrimaryTitle.GetBaseNameNoTier] "
 heresy_dangerous_rite.0010.desc.body.alarming: "has broken sharply with [source_rite.GetAdjective] and proclaimed [new_rite.GetName] — "
 heresy_dangerous_rite.0010.desc.body.severe: "has torn free of [source_rite.GetAdjective] in everything but name and proclaimed [new_rite.GetName] — "
 heresy_dangerous_rite.0010.desc.differing.tenet: "boldest among its new edicts, [differing_tenet.GetBaseName] is preached openly."
 heresy_dangerous_rite.0010.desc.differing.doctrine: "boldest among its new edicts, [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )] is preached openly."
 heresy_dangerous_rite.0010.desc.differing.fallback: "the new edicts too many to set down in a single line."
 heresy_dangerous_rite.0010.desc.outro: "\n\nPreachers are fanning out across the realm — [origin_faith.ReligiousText] in one hand, torches in the other. The elders of [origin_faith.GetName] will have no kind word for any of it.\n\nA potential heresy has been set in ink and shouted from the pulpit; sword and fire will answer where sermons cannot."
 heresy_dangerous_rite.0010.a: "Let it begin."
 heresy_dangerous_rite.0010.c: "Smells like heresy to me..."

 heresy_dangerous_rite.spread.title: "The New Rite Spreads"

 ###################################################
 # Component 3 - Historical heresy outbreak        #
 ###################################################
 # First-fire titles for the named historical heresies use the iconic founder.
 # Resurgences and the always-anonymous heresies fall back on a generic title.
 heresy_historical.0050.t.lollard.first: "Wycliffe's Heresy"
 heresy_historical.0050.t.hussite.first: "Hus's Heresy"
 heresy_historical.0050.t.joachimite.first: "Joachim's Heresy"
 heresy_historical.0050.t.cathar.first: "The Cathar Heresy"
 heresy_historical.0050.t.waldensian.first: "Waldo's Heresy"
 heresy_historical.0050.t.bogomilist.first: "Bogomil's Heresy"
 heresy_historical.0050.t.resurgence: "The [heresy_faith.GetAdjectiveNoTooltip] Heresy Returns"
 heresy_historical.0050.t.fallback: "A [heresy_faith.GetAdjectiveNoTooltip] Heresy"

 heresy_historical.0050.desc.nearby.first: "It has become impossible to ignore [founder.GetTitledFirstName] as [founder.GetSheHe] preaches the [heresy_faith.GetAdjective] cause in nearby [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. Our [origin_faith.PriestMalePlural] have denounced [founder.GetHerHis] teachings from their pulpits, which seems to have only made them more attractive to the common men and women of the church.\n\n"
 heresy_historical.0050.desc.nearby.resurgence: "The [heresy_faith.GetAdjective] cause has been rekindled in [epicenter_ruler.GetCapitalLocation.GetTitle.GetName], not far from where it once burned brightly. As [founder.GetTitledFirstName] speaks, courtiers and common folk still recall the heresy's wicked temptation.\n\n"
 heresy_historical.0050.desc.distant.first: "Pilgrims and traders bring us news of the [heresy_faith.GetAdjective] cause, which has inflamed the minds of distant [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. The sermons of [founder.GetTitledFirstName] slowly wend their way toward our gates.\n\n"
 heresy_historical.0050.desc.distant.resurgence: "Word comes that the [heresy_faith.GetAdjective] cause is rekindled in distant [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. It seems that [founder.GetTitledFirstName] fears not the fire of damnation, nor the censures and decrees cast against [founder.GetHerHis] manner of blasphemy.\n\n"
 heresy_historical.0050.desc.insider.first: "In [epicenter_ruler.GetCapitalLocation.GetTitle.GetName], [founder.GetTitledFirstName] boldly professes the [heresy_faith.GetAdjective] cause. The whispers of years past have finally become a sermon for all the world to hear.\n\n"
 heresy_historical.0050.desc.insider.resurgence: "[founder.GetTitledFirstName] rekindles the [heresy_faith.GetAdjective] cause in [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. The world wakens once more to our holy light, and the divine truth is professed anew!\n\n"

 heresy_historical.0050.gloss.lollard: "[founder.GetSheHe|U] preaches scripture in the common tongue, no land for the priesthood, and no theatre at the altar."
 heresy_historical.0050.gloss.hussite: "[founder.GetSheHe|U] preaches communion in both kinds for the laity, scripture in Bohemian, and a Church stripped of its purchased dignities."
 heresy_historical.0050.gloss.joachimite: "[founder.GetSheHe|U] preaches the imminent Age of the Spirit, in which the priestly orders of Rome give way to a contemplative church of poor men."
 heresy_historical.0050.gloss.cathar: "[founder.GetSheHe|U] preaches a stark dualism, naming the world the work of an evil god and the Church of Rome the Whore of Babylon."
 heresy_historical.0050.gloss.waldensian: "[founder.GetSheHe|U] preaches a poor church of barefoot lay preachers: oaths and warfare renounced, and scripture belonging to all."
 heresy_historical.0050.gloss.bogomilist: "[founder.GetSheHe|U] preaches a Slavonic dualism: the world is Satan's, and only ceaseless prayer wins back the soul."
 heresy_historical.0050.gloss.paulician: "[founder.GetSheHe|U] preaches the old eastern fire — dualism, iconoclasm, and a hard reading of Paul. [founder.GetHerHis|U] followers prefer the sword to the stake."
 heresy_historical.0050.gloss.iconoclast: "[founder.GetSheHe|U] preaches the iconoclast cause reborn: every painted Christ and gilded saint an idol, Nicaea II an error never atoned for."
 heresy_historical.0050.gloss.adoptionist: "[founder.GetSheHe|U] revives the Iberian argument: in [founder.GetHerHis] humanity, Christ was adopted."
 heresy_historical.0050.gloss.messalian: "[founder.GetSheHe|U] preaches prayer without end in place of the sacraments, and a demon within, beyond any priest's power to expel."
 heresy_historical.0050.gloss.generic: "[founder.GetSheHe|U] preaches a doctrine of stark renewal, rooted in the [heresy_faith.GetAdjective] tradition."

 heresy_historical.0050.history.lollard: "\n\nIt began at Oxford, where masters and students had been questioning canon law. Now their translated scriptures are spreading from cloister to town, at a speed no priest can hinder."
 heresy_historical.0050.history.hussite: "\n\nThis movement began in Prague's Bethlehem Chapel, where sermons were first given in the Bohemian tongue, and the holy chalice was first offered to the laity's lips."
 heresy_historical.0050.history.joachimite: "\n\nIt began in a Calabrian cloister, where an abbot read Revelation as a calendar and counted the years to the next coming age. Far-ranging mendicants took up this count, and now it is the talk of markets across the land."
 heresy_historical.0050.history.cathar: "\n\nThese beliefs crossed westward from the Balkans, and now in Languedoc are professed by weavers and viscounts alike. Their spiritual leaders, the Perfecti, go about barefoot in twos and tend to the sick and dying."
 heresy_historical.0050.history.waldensian: "\n\nIt began with a Lyonese merchant who gave his wealth to the poor, who preached in the streets. Now, those he's inspired walk barefoot through high mountains, and share the word of God with the lowest of men."
 heresy_historical.0050.history.bogomilist: "\n\nThis movement first stirred when village priests taught that bread and wine were simply that: bread and wine. Slavic country folk cling to this revelation, and no patriarch's anathema has yet dissuaded them."
 heresy_historical.0050.history.paulician: "\n\nFounded around a hard reading of Paul, this movement is older than any cathedral on the Bosphorus. In Tephrike, in the Armenian highlands, Paulicians once prospered, before the Byzantine Empire extinguished their state."
 heresy_historical.0050.history.iconoclast: "\n\nTwice the empire stripped its churches of painted Christs and gilded saints and twice these icons returned. Now the question of idolatry has been raised once more."
 heresy_historical.0050.history.adoptionist: "\n\nIn the Iberian borderlands, certain bishops teach that the carpenter's son was adopted into glory, instead of born to it. Frankfurt and Aachen have condemned this, and yet the locals continue asking where the truth truly lies."
 heresy_historical.0050.history.messalian: "\n\nIt rose in the deserts of Mesopotamia — wandering monks who prayed without sleep and held that every soul harbored a demon no priest could exorcise. Condemned at Ephesus, the faithful still persevere."
 heresy_historical.0050.history.generic: "\n\nEvery age throws up its own such fire — cloisters that broke their rule, preachers who stepped out of the cathedral and never returned. This one is on the road now."

 heresy_historical.0050.a: "Their cause is just. I will embrace it."
 heresy_historical.0050.b: "Such conviction... I wish it was me."
 heresy_historical.0050.c: "Heretics..."
 heresy_historical.0050.c.insider: "We endure. The cause grows."

 heresy_historical.spread.title: "The Heresy Spreads"
