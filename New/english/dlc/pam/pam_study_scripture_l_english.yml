 pam_inspired_study_modifier: "Inspired Study"
 pam_inspired_study_modifier_desc: "A thoughtful gift carries these studies forward."
 pam_cloistered_rigor_modifier: "Cloistered Rigor"
 pam_cloistered_rigor_modifier_desc: "These studies are pursued behind closed doors, with unstinting rigor."
 pam_cloistered_rigor_personal_modifier: "Cloistered in Study"
 pam_cloistered_rigor_personal_modifier_desc: "This character has withdrawn from worldly affairs to pursue sacred learning with unstinting rigor."
 pam_measured_devotion_modifier: "Measured Devotion"
 pam_measured_devotion_modifier_desc: "These studies advance steadily, in hours set apart for them."
 pam_measured_devotion_personal_modifier: "Devoted Student of Scripture"
 pam_measured_devotion_personal_modifier_desc: "This character is pursuing sacred learning with steady, measured devotion."
 pam_mortified_flesh_modifier: "Mortification of the Flesh"
 pam_mortified_flesh_modifier_desc: "Fasting and vigils have sharpened the mind for these studies."
 pam_divine_favor_modifier: "Divine Favor"
 pam_divine_favor_modifier_desc: "These studies proceed under a blessing."
 pam_devoted_acolyte_modifier: "Devoted Acolyte"
