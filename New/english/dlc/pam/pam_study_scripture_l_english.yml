l_english:
 # Religious Study scheme (study_scripture): a personal self-study scheme for theocratic rulers.

 study_scripture: "Religious Study"
 study_scripture_action: "Religious Study"
 study_scripture_desc: "I will give myself to sacred learning — the [GetPlayer.GetFaith.ReligiousText], the doctrines of my faith, and the mysteries beyond them."
 study_scripture_desc_general: "$study_scripture$ is a [personal_scheme|E] in which you attempt to gain [piety|E], [skill|E], and the [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E]."
 STUDY_SCRIPTURE_SCHEME_SUCCESS_DESC: "You improve your skills, gain piety, or find an opportunity"
 STUDY_SCRIPTURE_PURSUIT_OF_KNOWLEDGE: "You embrace [GetTenetType('tenet_pursuit_of_knowledge').GetBaseName]: $VALUE|+0=$"
 STUDY_SCRIPTURE_SCHOLASTICISM: "You embrace [GetTenetType('tenet_scholasticism').GetBaseName]: $VALUE|+0=$"
 STUDY_SCRIPTURE_CLERICAL_SUPERIOR: "Your clerical superior's [learning|E]: $VALUE|+0=$"
 STUDY_SCRIPTURE_RENEWED_ZEAL: "You have [GetModifier('pam_renewed_zeal_modifier').GetNameWithTooltip]: $VALUE|+0=$"
 STUDY_SCRIPTURE_STRESSED: "Your [stress|E] weighs upon your study: $VALUE|+0=$"
 STUDY_SCRIPTURE_ZEALOUS: "You are [GetTrait('zealous').GetName( owner )]: $VALUE|+0=$"
 STUDY_SCRIPTURE_CYNICAL: "You are [GetTrait('cynical').GetName( owner )]: $VALUE|+0=$"

 pam_study_scripture_decision: "Study the [ROOT.Char.GetFaith.ReligiousText|U]"
 pam_study_scripture_decision_desc: "The [ROOT.Char.GetFaith.ReligiousText] do not read themselves, nor do the doctrines of [ROOT.Char.GetFaith.GetName] unfold to idle minds. Set aside the hours between [ROOT.Char.Custom('StudyOfficesWord')] — study, contemplate, and let the flock see its shepherd learn."
 pam_study_scripture_decision_tooltip: "Start a [GetScheme('study_scripture').GetTypeName] [scheme|E] targeting yourself"
 pam_study_scripture_decision_tt: "You start a [GetScheme('study_scripture').GetTypeName] [scheme|E] targeting yourself\n\nAnticipated Rewards:\n$EFFECT_LIST_BULLET$ [piety_i][piety|E]\n$EFFECT_LIST_BULLET$ [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E] / [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ [learning_i][stewardship_i][diplomacy_i] [skill|E] #weak (up to 8)#!\n$EFFECT_LIST_BULLET$ Opportunities among the [clergy|E]\n\nDrawbacks:\n$EFFECT_LIST_BULLET$ May gain [stress_i][stress|E]\n$EFFECT_LIST_BULLET$ Reduced [prestige_i][prestige|E] gain"
 pam_study_scripture_decision_confirm: "Let the lesson begin."
 pam_study_scripture_decision_req_tt: "You are not already performing a [GetScheme('study_scripture').GetTypeName] [scheme|E]"
 pam_study_scripture_decision_end_scheme_tt: "@alert_icon!#alert_trial Your ongoing [personal_scheme|E] will end#!"

 study_scripture_title: "$study_scripture$: "
 study_scripture_outcome_piety: "$study_scripture_title$Devotion Rewarded"
 study_scripture_outcome_fragment_tt: "#EMP "[owner.Custom('RandomStudyVerseFragment')]"#!"
 study_scripture_outcome_scholarship: "$study_scripture_title$Insight into the Scriptures"
 study_scripture_outcome_mystery: "$study_scripture_title$A Glimpse of the Mysteries"
 study_scripture_outcome_stress: "$study_scripture_title$Wearying Study"

 # Toast verse fragments: short plain-text lines; the full verses live in event text instead
 pam_ss_fragment_psalm_119_105: "A lamp to my feet, a light to my path..."
 pam_ss_fragment_psalm_119_165: "Great peace have those who love your law..."
 pam_ss_fragment_proverbs_9_9: "Give instruction to the wise..."
 pam_ss_fragment_proverbs_4_7: "The beginning of wisdom is this..."
 pam_ss_fragment_joshua_1_8: "Meditate on it day and night..."
 pam_ss_fragment_matthew_7_7: "Search, and you will find..."
 pam_ss_fragment_james_1_5: "If any of you is lacking in wisdom..."
 pam_ss_fragment_2_timothy_2_15: "Present yourself to God as one approved..."
 pam_ss_fragment_verbum_domini: "Verbum Domini manet in aeternum..."
 pam_ss_fragment_generic_1: "The mysteries deepen..."
 pam_ss_fragment_generic_2: "Wisdom takes root..."
 pam_ss_fragment_generic_3: "The texts unfold their meaning..."

