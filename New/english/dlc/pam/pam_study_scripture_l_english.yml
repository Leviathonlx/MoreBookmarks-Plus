 pam_amanuensis_modifier: "Faithful Amanuensis"
 pam_amanuensis_modifier_desc: "A faithful assistant keeps notes and pages in perfect order."
 pam_persistent_devotions_modifier: "Persistent Devotions"
 pam_persistent_devotions_modifier_desc: "Setbacks have only deepened the discipline of these studies."
 pam_renowned_exegete_modifier: "Renowned Exegete"
 pam_renowned_exegete_modifier_desc: "This character's reading of the holy texts makes them an [Glossary('Exegete', 'GLOSS_EXEGETE')]."
 pam_doctrinal_clarity_modifier: "Doctrinal Clarity"
 pam_doctrinal_clarity_modifier_desc: "This character sees the doctrines of their faith with rare clarity.\n\n$sway_ruler_to_my_rite_interaction$ Acceptance: #p +20#!\n$pam_evangelize_personal_tenet_interaction$ Acceptance: #p +20#!\n$pam_evangelize_personal_tenet_interaction$ [piety|E] Cost: #p -50%#!"
 pam_known_in_the_synod_modifier: "Known in the Synod"
 pam_known_in_the_synod_modifier_desc: "This character's learning is spoken of among the clergy."
 pam_assisted_by_theologians_modifier: "Assisted by Theologians"
 pam_assisted_by_theologians_modifier_desc: "Learned theologians are assisting this character."
 pam_known_by_mystics_modifier: "Known by Mystics"
 pam_known_by_mystics_modifier_desc: "This character is well-regarded among mystics and contemplatives."
 pam_monastic_copyists_modifier: "Monastic Copyists"
 pam_monastic_copyists_modifier_desc: "Tireless monastic copyists supply these studies with fresh texts."
 pam_charterhouse_silence_modifier: "Silence of the Charterhouse"
 pam_charterhouse_silence_modifier_desc: "The discipline of silent contemplatives steadies these studies."
 pam_pastoral_letter_county_modifier: "A Pastoral Letter"
 pam_pastoral_letter_county_modifier_desc: "A faraway shepherd's epistle of consolation and instruction is recited at each service."
