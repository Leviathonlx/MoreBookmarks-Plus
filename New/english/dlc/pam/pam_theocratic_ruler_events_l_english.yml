l_english:
 pam_theocratic_ruler_events.0001.t: "A Bequest for the Church"
 pam_theocratic_ruler_events.0001.desc: "A wealthy merchant has left a bequest to the Church, and the sum is not trifling.\n\nMy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))] [subordinate_priest.GetFirstName] has brought the tallies and letters of intent. [subordinate_priest.GetSheHe|U] looks to me for judgment. \n\n"The will states the funds should be used to strengthen the belief in [ROOT.Char.GetFaith.HighGodName]"."
 pam_theocratic_ruler_events.0001.a: "I find evidence [subordinate_priest.GetSheHe] mishandled sacred funds…"
 pam_theocratic_ruler_events.0001.b: ""Let's reason together as clergy.""
 pam_theocratic_ruler_events.0001.c: "Into the treasury, with thanksgiving and care."
 pam_theocratic_ruler_events.0001.b.success: "Gods ways are mysterious"
 pam_theocratic_ruler_events.0001.b.failure: "The priest does not see reason"
 pam_theocratic_ruler_events.0001.b.toast.success: "You persuade [subordinate_priest.GetHerHim] and take the bequest."
 pam_theocratic_ruler_events.0001.b.toast.failure: "[subordinate_priest.GetSheHe|U] keeps the donation for [ROOT.Char.GetFaith.HighGodName]."

 pam_theocratic_ruler_events.0002.t: "A Traveler from Across the Border"
 pam_theocratic_ruler_events.0002.desc: "[foreign_ruler.GetTitledFirstName], a neighbor and a follower of the old ways of [foreign_ruler.GetFaith.GetName], has crossed into my lands.\n\nThe small retinue is bound elsewhere, but passes so near that custom demands I greet them formally as they pass.\n\nHow shall I receive them?"
 pam_theocratic_ruler_events.0002.a: "A modest gift and offer of peace."
 pam_theocratic_ruler_events.0002.b: ""I seek honest understanding between our peoples.""
 pam_theocratic_ruler_events.0002.b.success: "My courtesy wins them over"
 pam_theocratic_ruler_events.0002.b.failure: "My words ring hollow"
 pam_theocratic_ruler_events.0002.b.toast.success: "Your courtesy wins, tolerance between your peoples grows"
 pam_theocratic_ruler_events.0002.b.toast.failure: "[foreign_ruler.GetSheHe|U] is unmoved; your words ring hollow"
 pam_theocratic_ruler_events.0002.b.acceptance: "Courtly embassy"
 pam_theocratic_ruler_events.0002.c: "Heathens have no place in our lands."

 TRUCE_PAM_NEIGHBOR_GIFT: "\nTruce based on gifts and mutual respect between neighbors"

 pam_theocratic_ruler_events.0003.t: "Counsel for a Hardened Border"
 pam_theocratic_ruler_events.0003.desc: "War and raiders have tested my lands enough. I summon [advisor.GetTitledFirstName], my trusted [advisor.GetCouncilTitle], and we weigh what must be done. \n\n"We can reach out to [alliance_target.GetTitledFirstName]. As a fellow theocratic ruler of our faith [alliance_target.GetSheHe] could come to our aid."\n\nOr should I keep this burden in my own hands?"
 pam_theocratic_ruler_events.0003.a: "Send envoys. We must stand together."
 pam_theocratic_ruler_events.0003.a.tt: "You form an [alliance|E] with [alliance_target.GetShortUINameNoTooltip]"
 pam_theocratic_ruler_events.0003.b: "Raise faithful peasants for border defense."
 pam_theocratic_ruler_events.0003.b.army: "Faithful Peasants"
 pam_theocratic_ruler_events.0003.c: "Send aid and restore one recently raided county."
 pam_theocratic_ruler_events.0003.d: "I place this in [ROOT.Char.GetFaith.HighGodNamePossessive] hands."

 pam_theocratic_ruler_events.0004.t: "Brethren as Neighbors"
 pam_theocratic_ruler_events.0004.desc: "With [monastic_order_head.GetPrimaryTitle.GetName] so close. I have invited [monastic_order_head.GetTitledFirstName], to discuss how we might deepen our collaboration.\n\n"[monastic_order_head.GetFaith.HighGodName], judge us not by our pride but by our willingness to serve." [monastic_order_head.GetTitledFirstNameNoTooltip] speaks softly."
 pam_theocratic_ruler_events.0004.a: "Please, let your brethren bless my lands."
 pam_theocratic_ruler_events.0004.b: "Your disciple [monastic_monk.GetTitledFirstNameNoTooltip] would strengthen my court."
 pam_theocratic_ruler_events.0004.c: "Let us share some prayers."

 pam_theocratic_ruler_events.0005.t: "Swords for the Faith"
 pam_theocratic_ruler_events.0005.desc: "With [military_order_head.GetPrimaryTitle.GetName] settled in my realm, I invite [military_order_head.GetTitledFirstName] to discuss how the swords of the faithful might serve one another.\n\n\"[military_order_head.GetFaith.HighGodName] blesses not idle steel, but blades raised in defense of the faithful," [military_order_head.GetTitledFirstNameNoTooltip] says, while [military_order_head.GetHerHis] follower [order_knight.GetTitledFirstName] bows in silence next to [military_order_head.GetHerHim]."
 pam_theocratic_ruler_events.0005.a: "Drill my [ROOT.Char.Custom('GetFighterTermPlural')] in your order's discipline."
 pam_theocratic_ruler_events.0005.b: "Let [order_knight.GetTitledFirstNameNoTooltip] stand as my bodyguard."
 pam_theocratic_ruler_events.0005.c: "Let us speak of righteous war."

 pam_theocratic_ruler_events.0006.t: "Tithes or Mercy"
 pam_theocratic_ruler_events.0006.desc: "A local leader, [local_peasant_leader.GetTitledFirstName], is hauled in to face me. [local_peasant_leader.GetHerHis|U] villagers have withheld the church tithe, pleading of hardships.\n\n"The winter was cruel, my [ROOT.Char.GetLadyLord], and our granaries are all but empty," [local_peasant_leader.GetSheHe] laments.\n\nI see few alternatives: these disaffected souls must either be quelled by fear, or made whole by my mercy."
 pam_theocratic_ruler_events.0006.a: "No exceptions and seize the ringleader."
 pam_theocratic_ruler_events.0006.a.tt: "You gain [gold_i][EmptyScope.ScriptValue('minor_gold_value')|0], imprison [local_peasant_leader.GetShortUINameNoTooltip], and [troubled_county.GetName] gains #N Forced Tithes#! for 5 years (#N -20#! [county_opinion|E])."
 pam_theocratic_ruler_events.0006.b: "Let this pass. Mercy can also serve God."
 pam_theocratic_ruler_events.0006.b.tt: "You gain [piety_i][EmptyScope.ScriptValue('minor_piety_gain')|0], and [troubled_county.GetName] gains #P Merciful Tithes#! for 5 years (#P +20#! [county_opinion|E])."
 pam_theocratic_ruler_events.0006.c: "My steward failed me. The blame is his."
 pam_theocratic_ruler_events.0006.c.tt: "If possible, you gain an [hook|E] on [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] (a stronger obligation hook is used when available). [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] loses [opinion|E] of you (#N -20#!, decays over 5 years)."

 pam_theocratic_ruler_events.0007.t: "Blissful Harmony"
 pam_theocratic_ruler_events.0007.desc: "As the gentle sun's rays lift the morning dew and warm the stones of the churchyard, I realize: for once, duty does not claw at my sleeve. Even an industrious honey bee seems to take breaks to warm its back in the dawn rays.\n\nMy lands are in quiet order. There is gold in the coffers, and my flock is content and respectful. Even my liege, [ROOT.Char.GetLiege.GetTitledFirstName], speaks approvingly of how I steer [ROOT.Char.GetLiege.GetHerHis] subjects towards Christ."
 pam_theocratic_ruler_events.0007.a: "Peace is sweet, but [ROOT.Char.GetFaith.HighGodName] still has greater works for me."
 pam_theocratic_ruler_events.0007.b: "Spread the gospel of a well-ordered, godly life."
 pam_theocratic_ruler_events.0007.c: "Let me just listen and be still."

 pam_theocratic_ruler_events.0008.t: "Stone upon Stone"
 pam_theocratic_ruler_events.0008.desc: "Since inheriting [stone_province.GetName], a castle with [GetBuilding('curtain_walls_01').GetName], I have eyed its impressive stonework, built to suit a more worldly rule. Do the faithful truly need such defenses?\n\nMy estate has no [GetDomicileBuilding('episcopal_palace_01').GetName] worthy of my name, and the cut stone is there for the taking."
 pam_theocratic_ruler_events.0008.a: "I can use excess stone from these primitive walls."
 pam_theocratic_ruler_events.0008.b: "Tear down the walls and raise my [GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip]."

 pam_theocratic_ruler_events.0008.c: "Every work of human hands is prayer made visible."
 pam_theocratic_ruler_events.0008.c.flavor: "You have tenet [GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )]"
 pam_theocratic_ruler_events.0008.d: "They might need the walls."

 pam_theocratic_ruler_events.0009.t: "Try to Be the Shepherd"
 pam_theocratic_ruler_events.0009.desc: "I have received tear-ridden reports from my congregation, relaying that [heir.GetTitledFirstName] has lost [heir.GetHerHis] temper during [heir.GetHerHis] last sermon, and that they are unable to hold themselves to the strictures [heir.GetSheHe] demands of them.\n\nWhen questioning [heir.GetHerHim], [heir.GetSheHe] flies into a rage.\n\n"Oh, these vile sinners! I cannot stomach their pitiful attempts at redemption.""
 pam_theocratic_ruler_events.0009.a: ""A Shepherd is calm. Temper your passion.""
 pam_theocratic_ruler_events.0009.a.success: "Your counsel reaches [heir.GetHerHim]"
 pam_theocratic_ruler_events.0009.a.failure: "Your words fail to calm [heir.GetHerHim]"
 pam_theocratic_ruler_events.0009.a.toast.success: "Successful counsel"
 pam_theocratic_ruler_events.0009.a.toast.failure: "Failed counsel"
 pam_theocratic_ruler_events.0009.b: "I gently shake my head in disappointment."
 pam_theocratic_ruler_events.0009.b.flavor: " [heir.GetSheHe|U] does not have my blessing and is unfit to rule "
 pam_theocratic_ruler_events.0009.c: ""Say your prayers. Discipline your flesh.""

 pam_theocratic_ruler_events.0010.t: "The Sword or the Crozier"
 pam_theocratic_ruler_events.0010.desc: "As the ruler of my lands, I have been forced to serve [ROOT.Char.GetFaith.HighGodName] with blade as well as blessings.\n\nWith vivid clarity I remember when [pilgrimage_memory.GetDescription], and when [battle_memory.GetDescription]. Corpses piled high upon the field; my followers know that I do not shy away from the task at hand.\n\nLooking towards the future of the realm, my [ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle], [ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName], and my [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle], [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName], both want me to put their tool at the forefront of our effort."
 pam_theocratic_ruler_events.0010.a: "Honor the sword."
 pam_theocratic_ruler_events.0010.b: "The crozier should lead."
 pam_theocratic_ruler_events.0010.c: "Let sword and crozier serve together."

 pam_theocratic_ruler_events.0011.t: "Rest for the Fallen Knight"
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.GetTitledFirstName] kneels before me with word of [landed_subject.GetHerHis] kinsman who fell defending [ROOT.Char.GetFaith.HighGodName]. \n\n"He held his own against many heathens, but his wounds where too deep. At least we got to say our final goodbyes." \n\n"Please grant him a resting place beneath the altar aisle, with his sword by his side. I will be forever grateful.""
 pam_theocratic_ruler_events.0011.a: "Pay for the stone, and he will rest here."
 pam_theocratic_ruler_events.0011.a.flavor: "The knight will rest inside the church."
 pam_theocratic_ruler_events.0011.b: "We can use the crypt, if you donate the blade."
 pam_theocratic_ruler_events.0011.b.flavor: "The knight will rest without his sword."
 pam_theocratic_ruler_events.0011.c: "Fighting men belong beneath the open sky."
 pam_theocratic_ruler_events.0011.c.flavor: "The knight is buried outside the church walls."

 pam_fallen_knight_crusader_sword_name: "Crusader's Sword"
 pam_fallen_knight_crusader_sword_desc: "The blade of a knight fallen in defense of the faith, notched by heathen swords, with a small cross engraved in the hilt."

 pam_theocratic_ruler_events.0012.t: "A Once-Sacred Grove"
 pam_theocratic_ruler_events.0012.desc: "My retinue slows where the forest closes over the path. [grove_subject.GetTitledFirstName], one of the faithful of [grove_county.GetNameNoTier], steps from the trees with palms spread in greeting.\n\n"Wish you to win a great flock in these lands? Listen, and happily embrace what [ROOT.Char.GetFaith.HighGodName] Himself planted in this soil long ago. Honor the ancient groves of [grove_province.GetName] with a sacred temple, and the people will know whose shepherd you are.""
 pam_theocratic_ruler_events.0012.a: "Let nature guide my faith."
 pam_theocratic_ruler_events.0012.b: "Show me these groves."
 pam_theocratic_ruler_events.0012.b.success: "Your men return later to collect the timber"
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.GetShortUINameNoTooltip] sees through your ruse"
 pam_theocratic_ruler_events.0012.b.toast.success: "The ancient trees are hauled away for coin."
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.GetShortUINameNoTooltip] spreads word of your desecration."
 pam_theocratic_ruler_events.0012.c: "This wilderness reeks of the Devil."

 pam_theocratic_ruler_events.0013.t: "An Angelic Inspiration"
 pam_theocratic_ruler_events.0013.desc: "At mass today, as if struck by divine inspiration a voice rose above the cantor, clear and unearthly in its beauty.\n\nThe faithful fall silent when [angelic_singer.GetTitledFirstName] sings, and long after the final note fades I find myself still listening."
 pam_theocratic_ruler_events.0013.a: ""Your gift belongs to [ROOT.Char.GetFaith.HighGodName]. Take the vows and serve.""
 pam_theocratic_ruler_events.0013.a.success: "Your words move [angelic_singer.GetHerHim] to devotion"
 pam_theocratic_ruler_events.0013.a.failure: "[angelic_singer.GetShortUINameNoTooltip] will not be persuaded"
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.GetShortUINameNoTooltip] takes the vows and joins your court."
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.GetShortUINameNoTooltip] declines and leaves."
 pam_theocratic_ruler_events.0013.b: "Stay as my guest. I would hear that voice again."
 pam_theocratic_ruler_events.0013.c: "Let our cantors do the singing."

 pam_theocratic_ruler_events.0014.t: "A Convert's Plea"
 pam_theocratic_ruler_events.0014.desc: "At my sermon, [convert_peasant.GetTitledFirstName], a [convert_peasant.GetCulture.GetNameNoTooltip] convert from the old ways of [neighbour_faith.GetNameNoTooltip] pushes through the crowd.\n\n"There is much to learn from the old ways still. I know that if you could find it in your heart to consider them, our people would know you honor our traditions. My kind will flock to your side and support every effort."\n\n[convert_peasant.GetSheHe|U] waits for my blessing, and a silent nod as my answer."
 pam_theocratic_ruler_events.0014.a: "Remove this filth from my sight."
 pam_theocratic_ruler_events.0014.a.flavor: "You have the [GetTrait('arrogant').GetName( GetNullCharacter )] [trait|E]"
 pam_theocratic_ruler_events.0014.a.acceptance: "Rejected convert's plea"
 pam_theocratic_ruler_events.0014.b: "Embrace [offered_tenet_a.GetBaseNameNoTooltip] as my own."
 pam_theocratic_ruler_events.0014.b.tt: "Your next #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! contribution on a [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] [great_project|E] is free."
 pam_theocratic_ruler_events.0014.c: "Embrace [offered_tenet_b.GetBaseNameNoTooltip] as my own."
 pam_theocratic_ruler_events.0014.c.tt: "Your next #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! contribution on a [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] [great_project|E] is free."
 pam_theocratic_ruler_events.0014.d: "Does the sheep guide the shepherd?"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "A Convert's Plea"

 pam_theocratic_ruler_events.0015.t: "Guiding the Successors"
 pam_theocratic_ruler_events.0015.desc: "After me the see will need a shepherd who can lead in prayer as well as in judgment. [succession_heir_first.GetTitledFirstName], first in the line of succession, and [succession_heir_second.GetTitledFirstName], close behind, have been called to recite scripture before me in private. \n\nOne of them will inherit my burden and I cannot shape them both equally today.\n\n"My children in the faith. Show me not only what you have memorized, but what you have made your own."" 
 pam_theocratic_ruler_events.0015.a: "Tutor [succession_heir_first.GetFirstNameNoTooltip] in the scripture."
 pam_theocratic_ruler_events.0015.b: "Guide [succession_heir_second.GetFirstNameNoTooltip] through the holy texts."
 pam_theocratic_ruler_events.0015.c: "I am the Shepherd yet. I will do the reciting."
 pam_theocratic_ruler_events.0015.c.success: "Your learning outshines their recitation"
 pam_theocratic_ruler_events.0015.c.failure: "You stumble over a passage they know by heart"
 pam_theocratic_ruler_events.0015.c.toast.success: "They are moved by your mastery of doctrine."
 pam_theocratic_ruler_events.0015.c.toast.failure: "Your subordinates exchange glances at your mistake."
