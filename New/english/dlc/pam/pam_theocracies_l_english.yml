 theocracy_lease: "Theocratic Lease"
 theocracy_lease_desc: "This holding is [leased|E] out to a [realm_priest|E] of the [faith|E] of the holder.\n\nThey will contribute [tax|E] and [levies|E] to both their [liege|E] (if they have approval) and their [religious_superior|E].\n\nTheir religious superior is the [realm_priest|E] of their [liege|E], if they have the same faith. Else it will be their faith's [head_of_faith|E]."
 ecclesiastical_lease: "Ecclesiastical Lease"
 ecclesiastical_lease_desc: "This holding is [leased|E] out to a [realm_priest|E] of the [ecclesiastical|E] [faith|E] of the holder.\n\nThey will contribute [tax|E] and [levies|E] to their [liege|E] (if they have approval), their [religious_superior|E], and their [head_of_faith|E] directly.\n\nTheir religious superior is the [holder|E] of the Ecclesiastical [clerical_title|E] that their liege's capital belongs to. Else it will be their faith's [head_of_faith|E]."

