l_english:

 # Monastic funeral — the order's care when a funeral is held at one of its houses

 # Funeral planner province line (activity_funeral province_description / ai_will_select_province)
 activity_funeral_monastic: "#P +++ Monastery#!\n"

 pam_monastic_funeral.0001.t: "Prayers Without End"
 pam_monastic_funeral.0001.desc.intro: "The final chant fades beneath the vaults. The rites for [deceased.GetTitledFirstName] are done, and stillness returns to the house of the [abbot.GetPrimaryTitle.GetNameNoTier|l].\n\n"
 pam_monastic_funeral.0001.desc.brothers: "The brothers file out two by two, cowls drawn, leaving us all in reverent silence."
 pam_monastic_funeral.0001.desc.sisters: "The sisters file out two by two, veils drawn, leaving us all in reverent silence."
 pam_monastic_funeral.0001.desc.outro: "\n\n[abbot.GetTitledFirstName] remains at my side. "The dead are in good keeping here, [ROOT.Char.Custom('FormOfAddressForLiege')]," [abbot.GetSheHe] says. "And our prayers need not end at the graveside. [deceased.GetHerHis|U] name will stand in [Glossary( 'our necrology', 'PAM_NECROLOGY_GLOSS' )] for as long as one voice remains to read it.""
 pam_monastic_funeral.0001.a: "Pray for my house, now and always."
 pam_monastic_funeral.0001.b: "Invite pilgrims to pray for [deceased.GetFirstNamePossessiveNoTooltip] soul."
 pam_monastic_funeral.0001.c: "The dead are in good keeping. That is enough for me."
 # Monastic register of the dead, read aloud in the daily office - https://en.wikipedia.org/wiki/Necrology
 PAM_NECROLOGY_GLOSS: "The register in which a monastic house recorded the names of its dead — brothers, patrons, and benefactors alike. Each day the names fallen due were read aloud in chapter, and the community prayed for those souls; a name once entered was remembered for as long as the house stood."

 pam_monastic_commemoration_modifier: "Perpetual Commemoration"
 pam_monastic_commemoration_modifier_desc: "This character's house is entered in the necrology of a monastic order, its dead remembered in the order's daily prayers."
 pam_monastic_chronicle_modifier: "Resting Place of a Noble"
 pam_monastic_chronicle_modifier_desc: "A noble's resting place is drawing pious pilgrims to pray for them."
