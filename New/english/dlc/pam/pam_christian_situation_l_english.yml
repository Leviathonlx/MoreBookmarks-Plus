 saeculum_obscurum_desc: "The dark age of the See of Peter: a papacy surrounded by sin and secured in the beds of the powerful."
 
 the_christian_church_conversion_phase_situation_phase: "$conversion_phase$"
 conversion_phase: "Conversion"
 conversion_phase_icon: "@pam_the_christian_church_conversion_phase_icon! $conversion_phase$"
 conversion_phase_desc: "A season of new baptisms. Kings raise crosses over river-forts and market towns, mission peddlers and royal armies outbid each other for the souls of borderlands, and a single ruler's conversion can tip whole peoples toward the same font."
 
 reform_phase: "Reform"
 reform_phase_icon: "@pam_the_christian_church_reform_phase_icon! $reform_phase$"
 reform_phase_desc: "Discipline, law, and puritan zeal return to the clergy. The internal structure of Christianity is put under scrutiny, and the price of a cleaner Church is often paid in blood."
 the_christian_church_reform_phase_situation_phase: "$reform_phase$"
 
 investiture_crisis: "Investiture Controversy"
 investiture_crisis_icon: "@pam_the_christian_church_investiture_crisis_icon! $investiture_crisis$"
 investiture_crisis_desc: "Crown and crozier stand toe to toe over who owns the keys to God's barns; secular patrons invest prelates with staff and ring while the Church refuses to recognise their legitimacy."
 the_christian_church_investiture_crisis_situation_phase: "$investiture_crisis$"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING: "Next council: [GetGameTimeDifferenceForDiffDays( Situation.MakeScope.VarRemaining('investiture_council_countdown') )]"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING_TT: "Time remaining before the [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] reaches its climax and is resolved.\n\nWhen the timer runs out, an Investiture Council convenes to dispute the [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] Clerical Appointment [doctrine|E], replacing it with either [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName] or [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName] based on the votes. Secular [rulers|E] can force the [clergy|E] to vote the other way by using the $PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$ [casus_belli|E], or by obtaining [puppets|E]."
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CHURCH_AHEAD: "#weak The Church holds the upper hand#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CROWN_AHEAD: "#weak The crowns hold the upper hand#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_BALANCED: "#weak The coming vote hangs in the balance.#!"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS: "[schism|e] progress: [Situation.MakeScope.ScriptValue('pam_great_schism_progress_value')|V0] / [Situation.MakeScope.ScriptValue('pam_great_schism_progress_threshold_value')|V0]"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "How near the quarrels between the [GetRiteByKey('roman_rite').GetAdherentNamePlural] and the [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] have brought Christendom to the [Concept( 'schism', 'Great Schism')|E].\n\nWhen grievances mount, the Church may split. $GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial [GetFaithByKey( 'christian_faith').GetName] cannot establish a [head_of_faith|E] as long as the [Concept( 'schism', 'Great Schism')|E] remains undecided#!\n\n#help Increased by:\n$BULLET_WITH_TAB$[GetActivityType('activity_ecumenical_council').GetName] vote removing a [core_tenet|E] or [doctrine|E] from the [rites|E]\n$BULLET_WITH_TAB$A quarrel between the Rites ahead of the debates of an [GetActivityType('activity_ecumenical_council').GetName]\n$BULLET_WITH_TAB$A [war|E] between [kings|E] or greater rulers of the Rites within [GetSituation('the_christian_church').GetName]\n$BULLET_WITH_TAB$A [holy_site|E] converting from Rite to Rite\n$BULLET_WITH_TAB$Demoting a [holy_site|E] of either Rite\n$BULLET_WITH_TAB$A [head_of_rite|E] murdered by the other Rite#!"
 GREAT_SCHISM_PROGRESS_EFFECT_TT: "The next [GetSituationType('the_christian_church').GetPhaseType('saeculum_obscurum').GetName] will unlock access to [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName] and [GetDecisionWithKey('pam_cause_great_schism_decision').GetName] [decisions|E], and #V $pam_sway_schism_stance_interaction$#! [interaction|E]"
 pam_great_schism_decision_taken: "The [Concept( 'schism', 'Great Schism')|E] happened or was prevented"
 msg_pam_great_schism_progress_title: "Progress Towards the Great Schism"
 
 crusade_phase: "Crusade"
