 the_christian_church_participant_group_christian_regular_heretic_rulers_desc: "A [secular_ruler|E] of at least [county|E] [title_tier|E] of a non-ecumenical [christian|E] [faith|E] other than the Main Power."
 
 the_christian_church_fragile_unity_situation_phase: "$fragile_unity$"
 fragile_unity: "Fragile Unity"
 fragile_unity_icon: "@pam_the_christian_church_fragile_unity_icon! $fragile_unity$"
 fragile_unity_desc: "The Christian world lacks a single throne that all must obey. Kings, bishops, and heretics all claim to speak in God's name, yet none seems to listen."
