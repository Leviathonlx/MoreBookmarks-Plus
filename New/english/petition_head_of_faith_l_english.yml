 # Invalidation event
 petition_head_of_faith.0601.t: "Petition Abandoned"
 petition_head_of_faith.0601.desc.no_head: "By the time I am ready to present my case, there is no longer a fitting spiritual shepherd to receive my petition."
 petition_head_of_faith.0601.desc.head_dead: "[recipient.GetTitledFirstName] has died before my petition could be heard."
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.GetTitledFirstName] is imprisoned and cannot receive formal petitions."
 petition_head_of_faith.0601.desc.head_changed: "The head of my faith has changed, and my petition can no longer be presented to [recipient.GetTitledFirstName]."
 petition_head_of_faith.0601.desc.at_war: "I cannot make a formal petition while I am at war with [recipient.GetTitledFirstName]."
 petition_head_of_faith.0601.desc.repentance_resolved: "There is no longer any excommunication for me to have lifted."
 petition_head_of_faith.0601.desc.repentance_too_soon: "My repentance would not be heard so soon after my last censure."
 petition_head_of_faith.0601.desc.target_dead: "[petition_target.GetTitledFirstName] has died before the petition could be heard."
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.GetTitledFirstName] no longer belongs to my faith, so no formal excommunication can be requested."
 petition_head_of_faith.0601.desc.target_too_low: "[petition_target.GetTitledFirstName] is no longer a king or greater ruler, and so falls outside this formal petition."
 petition_head_of_faith.0601.desc.target_already_excommunicated: "[petition_target.GetTitledFirstName] is already excommunicated."
 petition_head_of_faith.0601.desc.fallback: "My petition can no longer be pursued, and the journey comes to nothing."
 petition_head_of_faith.0601.desc.refund.piety: "The pious offering I had committed for this petition is restored."
 petition_head_of_faith.0601.desc.refund.none: "At least nothing had yet changed hands."
 petition_head_of_faith.0601.a: "So be it."

 # Arrival event (shared by 1000 and 3000)
 petition_head_of_faith.1000.t.repentance: "Petition: Repentance"
 petition_head_of_faith.1000.t.excommunication: "Petition: Excommunication"
 petition_head_of_faith.1000.desc.court_low_grandeur: "The once-great palace lies in shambles around me. I pray it is not a reflection of the [recipient.GetFaith.ReligiousHeadName]'s spiritual poverty.\n\n"
 petition_head_of_faith.1000.desc.court_high_grandeur: "The palace, famed for its grand halls, is truly humbling to enter. I pray its heavenly gilding is a reflection of the justice and spiritual wealth within.\n\n"
 petition_head_of_faith.1000.desc.intro: "There sits God's vice-regent on earth. "
 petition_head_of_faith.1000.desc.recipient_sinful: "Though it is well known [recipient.GetSheHe] is [petition_hof_gravest_sin.GetName(recipient)], through some manner of devilry [recipient.GetSheHe] has found [recipient.GetHerHis] way to Saint Peter's throne."
 petition_head_of_faith.1000.desc.recipient_virtuous: "Surely [recipient.GetHerHis] judgment will be guided by [recipient.GetHerHis] [petition_hof_gravest_virtue.GetName(recipient)] nature."
 petition_head_of_faith.1000.desc.health_noble: "\n\n[recipient.GetHerHis|U] failing health is plainly the fruit of a life of noble toil."
 petition_head_of_faith.1000.desc.health_excess: "\n\n[recipient.GetHerHis|U] failing health is plainly the dividends of a life of ruinous excess."
 petition_head_of_faith.1000.desc.address: "\n\nI put my request before [recipient.GetHerHim]: "Holy [recipient.GetMotherFather|U], "
 petition_head_of_faith.1000.desc.repentance: "I come in humility, begging release from the censure laid upon my soul and praying to be restored to the communion of the faithful.""
 petition_head_of_faith.1000.desc.excommunication: "[petition_target.GetTitledFirstName] has committed crimes against God. I come as a humble messenger; it is of course your purview to pass judgment on [petition_target.GetHerHis] immortal soul.""
 petition_head_of_faith.1000.a.argue: "I will make my case."
 petition_head_of_faith.1000.a.argue_tt: "Attempt to persuade [recipient.GetShortUINameNoTooltip] during the audience"

 # Disposition indicators in arrival desc
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n\"We have heard you, my child. Speak the particulars of request and we will receive it with favor.""
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n\"Your petition is before us. We shall judge as canon and Holy Church require.""
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n\"Fair words are easily spoken. We receive your petition with the skepticism the Lord demands,""
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\n\"You presume much coming here. Weigh your next words well.""
 petition_head_of_faith.1000.desc.conclusion: "[recipient.GetSheHe] says, waiting expectantly."

 # Human Head of Faith decision events (1310/1320)
 petition_head_of_faith.1310.t: "Petition: [actor.GetTitledFirstNamePossessiveNoTooltip] Repentance"
 petition_head_of_faith.1310.desc.intro: ""Holy [ROOT.Char.GetMotherFather|U], I am excommunicated, barred from the sacraments and severed from the faithful. I beg you, lift this censure from my soul and restore me to communion," says the kneeling [actor.GetTitledFirstName].\n\n"Show [ROOT.Char.GetFaith.HighGodName] your contrition first," I reply."
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n"You have ever shown me charity, Holy [ROOT.Char.GetMotherFather|U]. I do not ask for earthly favor, only that God and Holy Church see the truth of my contrition.""
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n"Before God I stand as any penitent, and ask only justice under canon.""
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n"Do not take me for [SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )], using fair speech to lead you astray. I swear by [ROOT.Char.GetFaith.HighGodName] and by the vice-regent on earth that I am penitent.""
 petition_head_of_faith.1310.serpent.christian: "the serpent in the garden"
 petition_head_of_faith.1310.serpent.generic: "a serpent"
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n"We have been enemies in the world. I do not ask you to speak well of me in earthly matters, but recognize my penance and do not jeopardize my soul.""
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n"You are known to us as [petition_gravest_sin.GetName(actor)]. Fair speech cannot cleanse a stained soul. How will you make amends?""
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n"Little vice clings to your name. Perhaps the ban has done its healing work. We shall see if your soul matches your bearing.""
 petition_head_of_faith.1310.a: ""Rise, my child. You are restored to the communion of the faithful.""
 petition_head_of_faith.1310.b: ""The censure stands. Return when your repentance is plain.""

 petition_head_of_faith.1320.t: "Petition: [petition_target.GetTitledFirstNamePossessiveNoTooltip] Excommunication"
 petition_head_of_faith.1320.desc.intro: ""Holy [ROOT.Char.GetMotherFather|U], [petition_target.GetTitledFirstName] has committed crimes against God. If this rot is not cut out, all our souls will be compromised." says [actor.GetTitledFirstName]\n\n"We do not wield excommunication as a prince's private weapon. Make plain your charge before God." I reply."
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n"You have ever shown me justice, Holy [ROOT.Char.GetMotherFather|U]. I do not ask for earthly favor, only that God and Holy Church see the truth of [petition_target.GetTitledFirstNamePossessiveNoTooltip] transgressions."
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n"Before God I lay this charge as simple subject of the Lord Jesus Christ, and ask only what justice Holy Church requires."
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n"Think of me not, the snake in the garden using fair words to settle a private quarrel. I swear before [ROOT.Char.GetFaith.HighGodName] and his vice-regent on earth that this charge is just."
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n"We have been enemies in the world, but please weigh [petition_target.GetTitledFirstNamePossessiveNoTooltip] soul as canon demands."
 petition_head_of_faith.1320.desc.target_sinful: "The rot of [petition_target.GetTitledFirstNamePossessiveNoTooltip] sin spawns from [petition_target.GetHerHis] [petition_gravest_sin.GetName(petition_target)] nature.""
 petition_head_of_faith.1320.desc.finish: "concludes [actor.GetTitledFirstName]."
 petition_head_of_faith.1320.desc.target_clean: "[petition_target.GetTitledFirstNamePossessiveNoTooltip] hides [petition_target.GetHerHis] wickedness well, but I have faith if you seek guidance from the Lord [petition_target.GetHerHis] sin will be made clear.""
 petition_head_of_faith.1320.a: ""I cast [petition_target.GetHerHim] from the communion of the faithful.""
 petition_head_of_faith.1320.b: ""Your case is unconvincing, no censure will fall upon [petition_target.GetHerHim].""

 # Excommunication success result event (2020/4020)
 petition_head_of_faith.2020.t: "Excommunication Pronounced"
 petition_head_of_faith.2020.desc: "The [recipient.GetFaith.ReligiousHeadName] rises, to dispense with the Lord's justice:\n\n"[petition_target.GetTitledFirstName] is excommunicated, cut off from the body of the faithful, [petition_target.GetHerHis] soul consigned to peril until such time as true repentance is made.""
 petition_head_of_faith.2020.a: "[recipient.GetFaith.HighGodName] has spoken through His servant."

 # Excommunication failure result event (2030/4030, argument-specific)
 petition_head_of_faith.2030.t: "The Petition Refused"
 petition_head_of_faith.2030.desc.intro: "The [recipient.GetFaith.ReligiousHeadName] rises, to dispense with the Lord's justice:\n\n"
 petition_head_of_faith.2030.desc.cite_sins: ""The sins you name are not grave enough to merit so terrible a sentence. [petition_target.GetTitledFirstName] will not be excommunicated.""
 petition_head_of_faith.2030.desc.finesse: ""We do not cast out the faithful simply because a princely fee is paid to us. That which is Caesar's cannot purchase the judgments of [recipient.GetFaith.HighGodName].""
 petition_head_of_faith.2030.desc.learning_duel: ""You would trap a [petition_target.GetTitleAsNameNoTooltip] in deliberate distortions of canon law? [petition_target.GetTitledFirstName] will not be excommunicated on the... strength of your scholarship.""
 petition_head_of_faith.2030.desc.fallback: ""You presume much! I see no reason for [petition_target.GetTitledFirstName] to be excommunicated.""
 petition_head_of_faith.2030.a: "I suppose [recipient.GetFaith.HighGodName] has spoken through His servant."

 # Excommunication argument event (2000/4000, AI Head of Faith)
 petition_head_of_faith.2000.t: "The Argument"
 petition_head_of_faith.2000.desc.atmosphere_aniconism: ""Would you prove [petition_target.GetTitledFirstNamePossessiveNoTooltip] crimes by Scripture and the canons of the Church? Has [petition_target.GetSheHe] knelt to graven images? ""
 petition_head_of_faith.2000.desc.atmosphere_khachkar: ""And so you would accuse [petition_target.GetTitledFirstNameNoTooltip] beneath the stone cross that the local people revere?""
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: ""Does [petition_target.GetTitledFirstNameNoTooltip] not deserve the mercy of the Mother of God? Can any, even you, claim to stand untarnished by man's sin?""
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: ""Would you have us cast [petition_target.GetTitledFirstNameNoTooltip] from the sacred liturgy on the heat of private feud, and not on proof of grave sin?""
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: ""Would you bar [petition_target.GetTitledFirstNameNoTooltip] from Christ's altar? Deny [petition_target.GetHerHim] the nourishment of the flesh of our Lord? Should [petition_target.GetSheHe] no longer drink of His blood?""
 petition_head_of_faith.2000.desc.atmosphere_communion: ""Would you see fit to cast out [petition_target.GetTitledFirstNameNoTooltip] from the communion of the faithful?""
 petition_head_of_faith.2000.desc.atmosphere_confession: ""Would you have us act against [petition_target.GetTitledFirstNameNoTooltip] on what was spoken under the seal of confession?""
 petition_head_of_faith.2000.desc.atmosphere_purgatory: ""Would you have us expel [petition_target.GetTitledFirstNameNoTooltip] while gentler remedies might still reclaim [petition_target.GetHerHim] from sin?""
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: ""Would you call upon the authority of the Apostles and have us condemn [petition_target.GetTitledFirstNameNoTooltip] on earth, and in heaven?""
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: ""You disturb us from our study of the canons to condemn [petition_target.GetTitledFirstNameNoTooltip]. May your rhetoric be grounded in the Church Fathers' writings and Scripture?""
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: ""Would you move us against [petition_target.GetTitledFirstNameNoTooltip] for blood spilled in holy season or violence upon church lands? Has [petition_target.GetSheHe] been in breach of the Peace and Truce of God?""
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: ""Is your grievance against [petition_target.GetTitledFirstNameNoTooltip] best judged here? Would it not be better for you to both take the Cross and make war against the enemies of Christ?""
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: ""You come to us to have [petition_target.GetTitledFirstNameNoTooltip] cast out while we five patriarchal thrones attempt to hold together a fractious Christendom? Do you believe all the [Glossary( 'oikoumene', 'OIKOUMENE_GLOSS' )] would stand by your charge?""
 petition_head_of_faith.2000.desc.atmosphere_dulia: ""Has [petition_target.GetTitledFirstNameNoTooltip] affronted the veneration of the martyrs through open contempt?""
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: ""You would have us cast out [petition_target.GetTitledFirstNameNoTooltip]. Give us some indication [petition_target.GetSheHe] has lived in disobedience and sloth, for it is idleness that is the enemy of the soul.""
 petition_head_of_faith.2000.desc.atmosphere_original_sin: ""Would you have us condemn [petition_target.GetTitledFirstNameNoTooltip] as though [petition_target.GetSheHe] alone inherited Adam's guilt? Each soul enters the world wounded by the Fall, and the Church expels only those reveling in their sinful inclination.""
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: ""You come clamoring for justice against [petition_target.GetTitledFirstNameNoTooltip] in all your finery and yet our friars wander among the poor with nothing but the clothes they wear. Would a mendicant not rather counsel patience or is the sin so great?""
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: ""You would deny [petition_target.GetTitledFirstNameNoTooltip] the sacraments. You would jeopardize [petition_target.GetHerHis] share in the riches of eternal life with Christ in Heaven? It is on earth that we seek vows of poverty.""
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: ""You would have us expel a soldier of Christ on the testimony of [petition_target.GetHerHis] enemy?""
 petition_head_of_faith.2000.desc.atmosphere_fallback: ""How would you have Holy Church settle your quarrel with [petition_target.GetTitledFirstNameNoTooltip]?""
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n"You must know we do not wield excommunication as a prince's private weapon. We will deem what justice need be meted out. State your case before God!" The Holy [recipient.GetMotherFather|U] demands."
 petition_head_of_faith.2000.desc.target_sinful: "\n\nThough the [recipient.GetFaith.GetReligiousHeadTitle.GetNamePossessive] words must appear impartial, it is evident that word of [petition_target.GetTitledFirstNamePossessiveNoTooltip] sinful nature has already reached these sacred halls. I must but confirm [petition_target.GetHerHis] transgressions."
 petition_head_of_faith.2000.desc.target_clean: "\n\nIt seems [recipient.GetTitledFirstName] knows that [petition_target.GetTitledFirstNameNoTooltip] is not robed in sin. Lacking evidence of wickedness to present to the court, I must find another way to the justice I seek."
 OIKOUMENE_GLOSS: "Greek for "the inhabited world." In Eastern Roman speech, the #bold oikoumene#! named the civilized world: the empire and the wider Christian order its church oversaw."

 # Argument options
 petition_head_of_faith.2000.a.cite_sins: "Proclaim [petition_target.GetTitledFirstNameNoTooltip] [petition_gravest_sin.GetName(petition_target)] before God."
 petition_head_of_faith.2000.a.cite_sins_fallback: "Name [petition_target.GetTitledFirstNamePossessiveNoTooltip] sins before God."
 petition_head_of_faith.2000.b.finesse: ""The Church has many needs. Permit me to see to a few.""
 petition_head_of_faith.2000.c.learning_duel: "I will cite niche Scripture, to trap the wicked [petition_target.GetTitleAsNameNoTooltip]."
 petition_head_of_faith.2000.d.hook: "Remind the [recipient.GetFaith.ReligiousHeadName] of certain... private matters."
 petition_head_of_faith.2000.e.withdraw: "...perhaps this is between [petition_target.GetFaith.HighGodName] and [petition_target.GetTitledFirstNameNoTooltip]."
 petition_head_of_faith.5000.e.withdraw: "...perhaps I am not yet ready for this."
 petition_head_of_faith_hook_committed_tt: "You are spending a [hook|E] to have this arranged"
 petition_head_of_faith_target_cite_sins_unavailable_tt: "[petition_target.GetTitledFirstNameNoTooltip] is more virtuous than sinful"

 # Duel outcome descriptions
 petition_head_of_faith_duel_success: "The [recipient.GetFaith.ReligiousHeadName] is persuaded"
 petition_head_of_faith_cite_sins_success_desc: "The [recipient.GetFaith.ReligiousHeadName] is convinced"
 petition_head_of_faith_cite_sins_failure_desc: "The [recipient.GetFaith.ReligiousHeadName] remains unconvinced"
 petition_head_of_faith_argument_affronted: "The [recipient.GetFaith.ReligiousHeadName] is affronted"
 petition_head_of_faith_argument_dismissed: "The [recipient.GetFaith.ReligiousHeadName] dismisses your argument"
 petition_head_of_faith_affronted_opinion: "Offended by Bribery"
 petition_head_of_faith_affronted_opinion_desc: "This character was offended by a petitioner who presumed to purchase a religious judgment with gold."
 petition_head_of_faith_dismissed_debate_opinion: "Unmoved by Argument"
 petition_head_of_faith_dismissed_debate_opinion_desc: "This character rebuffed a petitioner whose distortions of canon law failed to persuade them."

 # Setup interaction strings
 petition_head_of_faith_repentance_setup_interaction: "Seek Absolution"
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$"
 petition_head_of_faith_repentance_setup_interaction_desc: "Travel to your [head_of_faith|E] and beg to have your [excommunication|E] lifted."
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "You will travel to [recipient.GetCapitalLocation.GetName] and formally petition [recipient.GetTitledFirstName] to lift your [excommunication|E]"

 #####################################################################
 # REPENTANCE: argument events (5000/7000)
 #####################################################################

 petition_head_of_faith.5000.t: "The Confession"
 petition_head_of_faith.5000.desc.atmosphere_aniconism: ""You come for absolution. Have you bowed to graven images knowing that only Scripture and penance will cleanse you?""
 petition_head_of_faith.5000.desc.atmosphere_khachkar: ""I hope you come to plead for absolution at the foot of the carved stone cross.""
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: ""The Mother of God abounds in mercy, but we cannot lift your censure for Her sake alone.""
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: ""You seek again the Divine Liturgy. Think on what has kept you from the altar and the faithful.""
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: ""You are barred from Christ's altar and from the nourishment of His flesh and blood.""
 petition_head_of_faith.5000.desc.atmosphere_communion: ""You stand cut off from the communion of the faithful.""
 petition_head_of_faith.5000.desc.atmosphere_confession: ""The sacrament of confession demands a full and truthful account.""
 petition_head_of_faith.5000.desc.atmosphere_purgatory: ""Excommunication is the Church's medicine. A gift given so you may amend your life and shorten your purgation.""
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: ""We hold the keys of Peter. This authority can unbind you if you are indeed penitent.""
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: ""You seek reconciliation. Satisfy the law by chapter and distinction from the Decretum.""
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: ""Has your sin been the breaking of Peace and Truce of God? Have you spilled blood in the holy season?""
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: ""If you wore the cross in name and harmed Christendom all the same, you know you have broken the law.""
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: ""The five patriarchal thrones look on. We will not cheapen absolution while the entire [Glossary( 'oikoumene', 'OIKOUMENE_GLOSS' )] watches.""
 petition_head_of_faith.5000.desc.atmosphere_dulia: ""The martyrs earned their place in heaven with their blood.""
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: ""Idleness is the enemy of the soul. Kneel not only in contrition but in readiness for penance, prayer and toil.""
 petition_head_of_faith.5000.desc.atmosphere_original_sin: ""You were born in sin, as were we all. Why add fresh wickedness to that inheritance?""
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: ""Our friars wander among the poor with nothing but threadbare habits.""
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: ""We cherish vows of poverty: the luxuries of rank will not regain you the sacraments.""
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: ""You wore the cross upon your breast and yet offended Christendom.""
 petition_head_of_faith.5000.desc.atmosphere_fallback: ""Absolution is not earned only by your long pilgrimage.""
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n"You must know we do not lift a censure for show or flattery. Make plain your contrition before God!" The Holy [recipient.GetMotherFather|U] demands."
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\nWord of my [petition_gravest_sin.GetName(actor)] nature has surely reached these sacred halls."
 petition_head_of_faith.5000.desc.penitent_clean: "\n\nWith little wickedness to lay bare, the court should be able to see that the ban has done its healing work."

 # Repentance argument options
 petition_head_of_faith.5000.a.confess: "Confess my sins, holding nothing back."
 petition_head_of_faith.5000.b.canon_law: "Argue that Church law demands my reconciliation."
 petition_head_of_faith.5000.c.weep: "Cast myself upon the mercy of the court."

 # Repentance duel outcomes
 petition_head_of_faith_repentance_duel_success: "The [recipient.GetFaith.ReligiousHeadName] is moved"
 petition_head_of_faith_repentance_duel_failure: "The [recipient.GetFaith.ReligiousHeadName] is unmoved"
 petition_head_of_faith_repentance_confess_duel_success: "The [recipient.GetFaith.ReligiousHeadName] accepts your confession"
 petition_head_of_faith_repentance_confess_duel_failure: "The [recipient.GetFaith.ReligiousHeadName] is unconvinced by your words"
 petition_head_of_faith_repentance_weep_duel_success: "The [recipient.GetFaith.ReligiousHeadName] is moved by your humility"
 petition_head_of_faith_repentance_weep_duel_failure: "The [recipient.GetFaith.ReligiousHeadName] is unmoved by your display"

 # Repentance success result event (5020/7020)
 petition_head_of_faith.5020.t: "Absolution Granted"
 petition_head_of_faith.5020.desc: "The [recipient.GetFaith.ReligiousHeadName] rises, to dispense with the Lord's mercy:\n\n"Rise, my child. You are restored to the communion of the faithful. The ban upon your soul is lifted.""
 petition_head_of_faith.5020.a: "Thanks be to [recipient.GetFaith.HighGodName]."

 # Repentance failure result event (5030/7030, argument-specific)
 petition_head_of_faith.5030.t: "No Absolution"
 petition_head_of_faith.5030.desc.intro: "The [recipient.GetFaith.ReligiousHeadName] rises, to dispense with the Lord's justice:\n\n"
 petition_head_of_faith.5030.desc.confess: ""Your confession rings hollow."
 petition_head_of_faith.5030.desc.canon_law: ""Your poor scholarship is a reflection of your soul."
 petition_head_of_faith.5030.desc.weep: ""Tears are not penance."
 petition_head_of_faith.5030.desc.fallback: ""You presume much."
 petition_head_of_faith.5030.desc.conclusion: " The censure stands.""
 petition_head_of_faith.5030.a: "I suppose [recipient.GetFaith.HighGodName] has spoken through His servant."
