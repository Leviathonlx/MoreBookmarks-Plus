l_english:
 # Major relics enshrined at holy sites at game start (MB_saint_holy_relics)

 # Christianity
 MB_artifact_relic_veronica_name: "Veil of Veronica"
 MB_artifact_relic_veronica_desc: "The cloth with which Veronica wiped the face of Christ on the road to Calvary, which kept the imprint of his features. Kept at Saint Peter's and shown to the pilgrims of Rome."
 MB_artifact_relic_descension_stone_name: "Stone of the Descension"
 MB_artifact_relic_descension_stone_desc: "The stone on which the Virgin Mary set her feet when she came down into the cathedral of Toledo to clothe Archbishop Ildefonsus in a chasuble from heaven."
 MB_artifact_relic_axion_estin_name: "Axion Estin"
 MB_artifact_relic_axion_estin_desc: "The icon of the Mother of God at Karyes, before which the archangel Gabriel appeared to a monk of the Holy Mountain and taught him the hymn 'It is truly meet', writing its words with his finger on a slate of stone."
 MB_artifact_relic_vladimir_theotokos_name: "Theotokos of Vyshhorod"
 MB_artifact_relic_vladimir_theotokos_desc: "An icon of the Mother of God tenderly embracing her child, which the Patriarch of Constantinople sent to Grand Prince Mstislav of Kiev. Tradition holds it was painted by Saint Luke on a board from the table of the Holy Family."
 MB_artifact_relic_burning_bush_name: "Branch of the Burning Bush"
 MB_artifact_relic_burning_bush_desc: "A branch of the bush which burned and was not consumed, from which God spoke to Moses, still growing within the walls of the monastery of Saint Catherine at the foot of Mount Sinai."
 MB_artifact_relic_nino_cross_name: "Cross of Saint Nino"
 MB_artifact_relic_nino_cross_desc: "The cross of vine branches which Nino bound with her own hair when she came to convert the Georgians, and which the Georgian church has kept ever since."
 MB_artifact_relic_geghard_lance_name: "Holy Lance of Geghard"
 MB_artifact_relic_geghard_lance_desc: "The lance which pierced the side of Christ, which the Armenians hold was brought to Armenia by the apostle Thaddeus and which gave the monastery of Geghard its name."
 MB_artifact_relic_varag_sign_name: "Holy Sign of Varag"
 MB_artifact_relic_varag_sign_desc: "A fragment of the True Cross which Saint Hripsime carried to Armenia, hidden on Mount Varag near Van and found again in 653 in a vision of crosses of light."
 MB_artifact_relic_ani_cross_name: "True Cross of Ani"
 MB_artifact_relic_ani_cross_desc: "A fragment of the True Cross which Prince Ablgharib Pahlavuni brought from Constantinople, for which he built the Church of the Holy Redeemer at Ani."
 MB_artifact_relic_karapet_relics_name: "Relics of the Forerunner"
 MB_artifact_relic_karapet_relics_desc: "Relics of John the Baptist which Gregory the Illuminator brought from Caesarea and laid at Mush, founding the monastery of Surb Karapet, the Holy Forerunner, the greatest pilgrimage of Armenia."
 MB_artifact_relic_gandzasar_head_name: "Head of the Forerunner"
 MB_artifact_relic_gandzasar_head_desc: "The head of John the Baptist, which tradition holds was carried to Khachen and buried beneath the cathedral of Gandzasar built by Prince Hasan-Jalal."
 MB_artifact_relic_lalibela_cross_name: "Cross of Lalibela"
 MB_artifact_relic_lalibela_cross_desc: "The processional cross of King Gebre Mesqel Lalibela, who hewed the churches of Roha from the living rock to be a New Jerusalem."
 MB_artifact_relic_abgar_letter_name: "Letter of Christ to Abgar"
 MB_artifact_relic_abgar_letter_desc: "The letter which Christ is said to have written to King Abgar of Edessa, promising that his city would never be taken by an enemy."
 MB_artifact_relic_barsauma_hand_name: "Right Hand of Mor Barsauma"
 MB_artifact_relic_barsauma_hand_desc: "The right hand of Barsauma, father of the Syriac monks, kept in his monastery near Melitene, where the Syriac Orthodox patriarchs were consecrated by its touch."
 MB_artifact_relic_john_manna_name: "Manna of Saint John"
 MB_artifact_relic_john_manna_desc: "The fragrant dust which rose from the empty tomb of John the Evangelist at Ephesus each year on his feast day, gathered by pilgrims as a cure for every illness."
 MB_artifact_relic_thomas_mount_cross_name: "Bleeding Cross of Saint Thomas"
 MB_artifact_relic_thomas_mount_cross_desc: "A cross carved in stone with an inscription in Pahlavi, from the hill near Mylapore where Thomas the Apostle was martyred, said to sweat blood on his feast day."
 MB_artifact_relic_angels_cross_name: "Cross of the Angels"
 MB_artifact_relic_angels_cross_desc: "A cross of gold and gems which King Alfonso II of Asturias gave to his church of San Salvador at Oviedo, said to have been wrought by two angels who came to the king's palace disguised as pilgrim goldsmiths."
 MB_artifact_relic_victory_cross_name: "Cross of Victory"
 MB_artifact_relic_victory_cross_desc: "The oak cross which Pelayo is said to have carried at Covadonga, the first victory over the Moors, sheathed in gold and gems by King Alfonso III of Asturias and given to the church of San Salvador at Oviedo."
 MB_artifact_relic_khakhuli_name: "Khakhuli Triptych"
 MB_artifact_relic_khakhuli_desc: "The icon of the Mother of God from the monastery of Khakhuli in Tao, which King David the Builder brought to his monastery of Gelati, set in a great triptych of gold and enamel adorned by the kings of Georgia."
 MB_artifact_relic_holy_ampulla_name: "Holy Ampulla"
 MB_artifact_relic_holy_ampulla_desc: "The phial of chrism which a dove brought down from heaven to Saint Remigius for the baptism of Clovis, kept at the abbey of Saint-Remi in Reims, from which every king of France is anointed at his coronation."

 # Judaism
 MB_artifact_relic_aaron_rod_name: "Rod of Aaron"
 MB_artifact_relic_aaron_rod_desc: "The almond rod of Aaron, which budded, blossomed and bore ripe almonds overnight in the Tabernacle to show that God had chosen the house of Levi for the priesthood."
 MB_artifact_relic_ezekiel_torah_name: "Torah of Ezekiel"
 MB_artifact_relic_ezekiel_torah_desc: "A Sefer Torah kept at the tomb of the prophet Ezekiel at al-Kifl, which tradition holds was written by the prophet's own hand during the Babylonian exile."
 MB_artifact_relic_ezra_torah_name: "Torah of Ezra the Scribe"
 MB_artifact_relic_ezra_torah_desc: "A Torah scroll which the Jews of Egypt held to have been written by Ezra the Scribe, who restored the Law to Israel on the return from Babylon, and given by him to their congregation at Fustat."
 MB_artifact_relic_maimonides_mishneh_torah_name: "Mishneh Torah of Maimonides"
 MB_artifact_relic_maimonides_mishneh_torah_desc: "A copy of the Mishneh Torah bearing the signature of Moses ben Maimon, attesting it was checked against his own book - his great code of all the law of the Torah, completed at Fustat around 1180."

 # Zoroastrianism
 MB_artifact_relic_kashmar_cypress_name: "Cypress of Kashmar"
 MB_artifact_relic_kashmar_cypress_desc: "A bough of the great cypress of Kashmar, which Zarathustra brought from paradise and planted to mark the conversion of King Vishtaspa, and which had grown for more than a thousand years."
 MB_artifact_relic_adur_burzen_mihr_name: "Embers of the Adur Burzen-Mihr"
 MB_artifact_relic_adur_burzen_mihr_desc: "Embers carried from the Adur Burzen-Mihr on Mount Rivand, the great fire of the farmers, which tradition holds King Vishtaspa enthroned there when he received the faith of Zarathustra."
 MB_artifact_relic_adur_gushnasp_name: "Embers of the Adur Gushnasp"
 MB_artifact_relic_adur_gushnasp_desc: "Embers carried from the Adur Gushnasp at Shiz, the great fire of the warriors and kings, which tradition holds Kay Khosrow founded on the ruins of a demon fortress he had cast down."
 MB_artifact_relic_fereydun_mace_name: "Gorz-e Gavsar"
 MB_artifact_relic_fereydun_mace_desc: "The ox-headed mace of Fereydun, with which he struck down the serpent-king Zahhak before binding him in chains beneath Mount Damavand."
 MB_artifact_relic_muqanna_veil_name: "Veil of al-Muqanna"
 MB_artifact_relic_muqanna_veil_desc: "The green silk veil which Hashim ibn Hakim wore over his face at all times, saying no mortal could look upon its radiance and live, and from which he was named al-Muqanna, the Veiled One."

 # Jainism
 MB_artifact_relic_rishabhanatha_paduka_name: "Charan Paduka of Rishabhanatha"
 MB_artifact_relic_rishabhanatha_paduka_desc: "The Charan Paduka beneath the Rayan tree on Mount Shatrunjaya, a stone bearing the impression of the feet of Rishabhanatha, the first Tirthankara, who is said to have preached on the mountain many times."
 MB_artifact_relic_neminatha_paduka_name: "Charan Paduka of Neminatha"
 MB_artifact_relic_neminatha_paduka_desc: "The Charan Paduka from the summit of Mount Girnar, a stone bearing the impression of the feet of Neminatha, the twenty-second Tirthankara, who renounced the world there on his wedding day and attained moksha on its peak."
 MB_artifact_relic_mahavira_paduka_name: "Charan Paduka of Mahavira"
 MB_artifact_relic_mahavira_paduka_desc: "The Charan Paduka from Pavapuri, a stone bearing the impression of the feet of Mahavira, the twenty-fourth Tirthankara, marking the place where he attained nirvana."
 MB_artifact_relic_bhadrabahu_paduka_name: "Charan Paduka of Bhadrabahu"
 MB_artifact_relic_bhadrabahu_paduka_desc: "A stone bearing the impression of the feet of Bhadrabahu, last of the Shrutakevalins, from the cave at Shravanabelagola where he fasted unto death after leading the Jain community south out of famine."
 MB_artifact_relic_siddhahema_name: "Siddhahema"
 MB_artifact_relic_siddhahema_desc: "The Siddhahema-shabdanushasana, the great grammar of Sanskrit and Prakrit composed by the Jain monk Hemachandra for Jayasimha Siddharaja, who had it carried through Anahilapataka on the royal elephant."

 # Hinduism
 MB_artifact_relic_andal_garland_name: "Garland of Andal"
 MB_artifact_relic_andal_garland_desc: "A garland of the kind Andal wove for Vishnu at Srivilliputhur and wore herself before offering it, which the Lord is said to have preferred to all others. Her temple has sent such garlands to the Lord's other shrines ever since."
 MB_artifact_relic_tiruvasagam_name: "Tiruvasagam"
 MB_artifact_relic_tiruvasagam_desc: "Palm leaves of the Tiruvasagam, the hymns of Manikkavasagar, which tradition holds Shiva himself wrote down at Chidambaram from the saint's lips and signed in his own hand."
 MB_artifact_relic_gorakhnath_dhuni_name: "Akhand Dhuni of Gorakhnath"
 MB_artifact_relic_gorakhnath_dhuni_desc: "Embers of the ever-burning fire of Gorakhnath, which the Nath yogis have kept alight since the master first kindled it, and from which they carry fire to each new seat of the order."

 # Buddhism
 MB_artifact_relic_padmasambhava_phurba_name: "Phurba of Padmasambhava"
 MB_artifact_relic_padmasambhava_phurba_desc: "A three-sided ritual dagger of Padmasambhava, the Precious Guru, who used the phurba to bind the demons of Tibet under oath to protect the dharma before the founding of Samye."
 MB_artifact_relic_kukai_sanko_name: "Hiko Sanko"
 MB_artifact_relic_kukai_sanko_desc: "The flying three-pronged vajra of Kukai, which he cast eastward from the shore at Mingzhou before sailing home from China, and which he found again caught in a pine tree on Mount Koya, where he founded his monastery."
 MB_artifact_relic_milarepa_robe_name: "Cotton Cloth of Milarepa"
 MB_artifact_relic_milarepa_robe_desc: "The single cotton cloth that was all Milarepa wore through the Himalayan winters, kept warm by the inner fire of tummo, from which he was called the Cotton-Clad."
 MB_artifact_relic_tripitaka_koreana_name: "Tripitaka Koreana"
 MB_artifact_relic_tripitaka_koreana_desc: "Prints from the eighty thousand wooden blocks of the Buddhist canon carved by the Goryeo court during the Mongol invasions, in the hope that the Buddha would turn back the invaders as he had turned back the Khitan when the first carving was made."
 MB_artifact_relic_ranjatai_name: "Ranjatai"
 MB_artifact_relic_ranjatai_desc: "A great log of aloeswood brought from the south seas, kept in the Shosoin treasury of Todai-ji since the reign of Emperor Shomu, from which only emperors and the mightiest of the realm are permitted to cut a sliver of incense."
 MB_artifact_relic_emille_bell_name: "Divine Bell of King Seongdeok"
 MB_artifact_relic_emille_bell_desc: "The great bronze bell cast in memory of King Seongdeok of Silla, whose voice is said to carry for forty li, and which legend holds was given its sound by a child cast into the molten bronze."

 # Taoism
 MB_artifact_relic_tianshi_seal_name: "Seal of the Celestial Master"
 MB_artifact_relic_tianshi_seal_desc: "The Seal of the Yangping Commandery, handed down by Zhang Daoling to his heirs on Mount Longhu, by which each Celestial Master in turn seals the registers of ordination."
 MB_artifact_relic_tianshi_sword_name: "Demon-Slaying Sword"
 MB_artifact_relic_tianshi_sword_desc: "The sword which Zhang Daoling received from Laozi with the Way of the Celestial Masters, and with which he subdued the demon kings of Shu - handed down with the seal to each Celestial Master in turn."
 MB_artifact_relic_lu_dongbin_sword_name: "Sword of Lu Dongbin"
 MB_artifact_relic_lu_dongbin_sword_desc: "The sword of the Immortal Lu Dongbin, with which he severs greed, anger and desire, and wanders the world slaying evil and aiding those in need."

 # Shinto
 MB_artifact_relic_kusanagi_name: "Kusanagi no Tsurugi"
 MB_artifact_relic_kusanagi_desc: "The Grass-Cutting Sword, drawn by Susanoo from the tail of the eight-headed serpent and given to Yamato Takeru at Ise, with which he cut the burning grass about him and turned the fire on his enemies. One of the three Imperial Regalia of Japan."
 MB_artifact_relic_tide_jewels_name: "Kanju and Manju"
 MB_artifact_relic_tide_jewels_desc: "The tide-ruling jewels of the sea god, with which Empress Jingu lowered and raised the sea during her crossing to Silla, carrying her fleet onto the shore."
 MB_artifact_relic_tobiume_name: "Branch of the Tobiume"
 MB_artifact_relic_tobiume_desc: "A branch of the Flying Plum, the tree Sugawara no Michizane loved in his garden in the capital, which flew to him overnight at Dazaifu to keep him company in his exile."

 # Hellenism
 MB_artifact_relic_nemean_lion_name: "Skin of the Nemean Lion"
 MB_artifact_relic_nemean_lion_desc: "The hide of the Nemean Lion, which no blade could pierce, which Herakles strangled with his bare hands as the first of his labours and wore ever after as his armour."
 MB_artifact_relic_romulus_lituus_name: "Lituus of Romulus"
 MB_artifact_relic_romulus_lituus_desc: "The curved augur's staff with which Romulus marked out the regions of the sky when founding Rome, kept by the Salii on the Palatine, where it was found unharmed in the ashes after the Gauls burned the city."
 MB_artifact_relic_asclepius_staff_name: "Staff of Asclepius"
 MB_artifact_relic_asclepius_staff_desc: "The staff of Asclepius, around which his sacred serpent coils - god of healing, son of Apollo, whose sanctuary stands on the slope of the Acropolis."
