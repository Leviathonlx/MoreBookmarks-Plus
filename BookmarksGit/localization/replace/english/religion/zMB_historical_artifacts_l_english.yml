l_english:
 # Major historical artifacts added by More Bookmarks+ (historical_artifacts.0023)
 MB_artifact_holy_crown_hungary_name: "Holy Crown of Hungary"
 MB_artifact_holy_crown_hungary_desc: "The crown of Saint Stephen, with which the kings of Hungary have been crowned since the first, believed to have been sent by Pope Sylvester II for his coronation in the year 1000. Its lower band was a gift of the Byzantine emperor. The crown is held to embody the kingdom itself, and no king is lawful until crowned with it."
 MB_artifact_holy_lance_empire_name: "Holy Lance of the Empire"
 MB_artifact_holy_lance_empire_desc: "The lance of Saint Maurice, holding a nail of the True Cross in its blade, which King Rudolf of Burgundy surrendered to King Henry at Worms. Carried before the German kings into battle, it was borne at the Lechfeld, and became the most sacred of the imperial regalia."
 MB_artifact_mantle_roger_name: "Coronation Mantle of Roger II"
 MB_artifact_mantle_roger_desc: "A mantle of red silk embroidered in gold and pearls with two lions striking down camels about a palm, made in the royal workshops of Palermo and bearing an Arabic inscription of the year 528 of the Hijra. Made for King Roger II of Sicily, it passed with the Sicilian crown to the Hohenstaufen and into the imperial regalia."
 MB_artifact_oriflamme_name: "Oriflamme"
 MB_artifact_oriflamme_desc: "The red banner of the abbey of Saint-Denis, which the kings of France take from the altar of the martyr when they go to war. When it is raised, no quarter is given."
 MB_artifact_joyeuse_name: "Joyeuse"
 MB_artifact_joyeuse_desc: "The sword of Charlemagne, kept in the treasury of Saint-Denis and carried before the king of France at his coronation in Reims."
 MB_artifact_hodegetria_name: "Hodegetria"
 MB_artifact_hodegetria_desc: "The icon of the Mother of God Who Shows the Way, held to have been painted by Saint Luke, the palladium of Constantinople. It is carried around the walls when the city is besieged and before the emperor on campaign."
 MB_artifact_qadib_prophet_name: "Staff of the Prophet"
 MB_artifact_qadib_prophet_desc: "Al-Qadib, the staff of the Prophet Muhammad, which the Abbasid caliphs bear with his mantle as the insignia of the caliphate."
 MB_artifact_quran_uthman_name: "Qur'an of Uthman"
 MB_artifact_quran_uthman_desc: "A copy of the Qur'an held to be one of the codices sent out by the caliph Uthman, stained with his blood. It was kept in the Great Mosque of Cordoba until the Almohads carried it to Marrakesh, and their caliphs bore it before their armies on campaign."
 MB_artifact_vladimir_theotokos_name: "Theotokos of Vladimir"
 MB_artifact_vladimir_theotokos_desc: "The icon of the Mother of God tenderly embracing her child, painted in Constantinople and held to be the work of Saint Luke, which Prince Andrey Bogolyubsky carried off from Vyshhorod to his new capital at Vladimir."
 MB_artifact_kollur_diamond_name: "Great Diamond of Kollur"
 MB_artifact_kollur_diamond_desc: "A diamond of enormous size, said to have come from the mines of Kollur on the Krishna and to have been kept by the Kakatiya kings in their treasury at Warangal. Tradition holds it was carried off to Delhi with the Kakatiya treasure. It will later be known as the Koh-i-Noor, the Mountain of Light."
 MB_artifact_yasakani_no_magatama_name: "Yasakani no Magatama"
 MB_artifact_yasakani_no_magatama_desc: "The curved jewel of the Imperial Regalia, hung on the sakaki tree before the cave of Amaterasu and handed down by Ninigi to the emperors. Unlike the sword and the mirror, it is kept by the emperor himself and never leaves his side."
 MB_artifact_katashiro_kusanagi_name: "Katashiro of Kusanagi"
 MB_artifact_katashiro_kusanagi_desc: "The sword kept in the imperial palace in place of the Kusanagi no Tsurugi, which is enshrined at Atsuta. It is carried before the emperor at his accession as one of the Imperial Regalia."
 MB_artifact_crown_of_thorns_name: "Crown of Thorns"
 MB_artifact_crown_of_thorns_desc: "The crown of thorns pressed upon the head of Christ before the Crucifixion. Pawned by the Latin emperor Baldwin II to the Venetians, it was redeemed by Louis IX of France, who walked barefoot before it into Paris and built the Sainte-Chapelle as its reliquary."
 MB_artifact_black_stone_qarmatian_name: "Black Stone of the Kaaba"
 MB_artifact_black_stone_qarmatian_desc: "The Black Stone, torn from the corner of the Kaaba when the Qarmatians of Bahrain sacked Mecca during the Hajj of 930 and carried off to their capital at Hajar."
 MB_artifact_horses_saint_mark_name: "Horses of Saint Mark"
 MB_artifact_horses_saint_mark_desc: "Four gilded bronze horses of ancient work which stood above the starting gates of the Hippodrome of Constantinople, until the Venetians carried them off after the sack of 1204 and set them on the facade of San Marco."
 MB_artifact_croes_naid_name: "Croes Naid"
 MB_artifact_croes_naid_desc: "A fragment of the True Cross set in a cross of gold, the most precious relic of the princes of Gwynedd. Edward I took it from the Welsh in 1283 and carried it in procession through London."
 MB_artifact_reichskreuz_name: "Imperial Cross"
 MB_artifact_reichskreuz_desc: "A cross of gold and gems made for the emperor Conrad II, hollowed to hold the Holy Lance in its beam and a fragment of the True Cross in its shaft, and carried before the emperor at his coronation."
 MB_artifact_reichsapfel_name: "Imperial Orb"
 MB_artifact_reichsapfel_desc: "A golden orb surmounted by a jewelled cross, made in the Rhineland for the coronation of the German kings, signifying the emperor's rule over the world under Christ."
 MB_artifact_kebra_nagast_name: "Kebra Nagast"
 MB_artifact_kebra_nagast_desc: "The Glory of the Kings, which tells how the Queen of Sheba bore Solomon a son, Menelik, who brought the Ark of the Covenant to Aksum, and how the kings of Ethiopia descend from him. Translated into Ge'ez in the reign of Amda Seyon."
 MB_artifact_sacro_catino_name: "Sacro Catino"
 MB_artifact_sacro_catino_desc: "A hexagonal bowl of green glass, believed to be cut from a single emerald and to be the dish from which Christ ate at the Last Supper, which the Genoese took as their share of the spoils at the sack of Caesarea in 1101."
 MB_artifact_cathach_name: "Cathach of Saint Columba"
 MB_artifact_cathach_desc: "The psalter said to have been copied by Saint Columba himself, kept in a silver shrine by the O'Donnells of Tir Conaill and carried three times sunwise around their army before battle to bring victory."
 MB_artifact_holy_chalice_name: "Holy Chalice"
 MB_artifact_holy_chalice_desc: "A cup of agate on a golden foot, held to be the cup from which Christ drank at the Last Supper, kept by the monks of San Juan de la Pena under the patronage of the kings of Aragon."
 MB_artifact_crown_saint_edward_name: "Crown of Saint Edward"
 MB_artifact_crown_saint_edward_desc: "The crown of King Edward the Confessor, kept by the monks of Westminster with the rest of his regalia after he was raised to the altars, and placed on the head of each king of England at his coronation in the abbey."
 MB_artifact_crown_charlemagne_france_name: "Crown of Charlemagne"
 MB_artifact_crown_charlemagne_france_desc: "The crown kept in the treasury of Saint-Denis and held to have been Charlemagne's own, with which the kings of France have been crowned at Reims since the coronation of Philip Augustus."
 MB_artifact_crown_boleslaw_name: "Crown of Boleslaw the Brave"
 MB_artifact_crown_boleslaw_desc: "The crown of the kings of Poland, made for the coronation of Wladyslaw the Elbow-high at Krakow in 1320 when the kingdom was restored, and called after Boleslaw the Brave, the first king of the Poles."
 MB_artifact_cap_monomakh_name: "Cap of Monomakh"
 MB_artifact_cap_monomakh_desc: "A cap of gold filigree trimmed with sable, held to have been sent by the Byzantine emperor Constantine Monomachos to his grandson Vladimir Monomakh, and handed down by the grand princes as the sign of their rule."
