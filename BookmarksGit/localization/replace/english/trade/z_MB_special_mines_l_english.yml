l_english:

 # The Quicksilver Mines of Almadén
 building_type_almaden_mines_01: "The Quicksilver Mines of Almadén"
 building_type_almaden_mines_01_desc: "The mines of al-Maʿdin, worked since the Romans, yield the red cinnabar from which quicksilver is distilled, and the Order of Calatrava guards them jealously."
 almaden_mines_01: "Almadén Mining Settlement"
 almaden_mines_01_desc: "A small settlement has sprung up where the deposits lie. The first workers are only scratching at the surface, but the yield is promising."
 almaden_mines_02: "Almadén Mines"
 almaden_mines_02_desc: "As the settlement grows, more is being dug out each year, and skilled workers have arrived to open proper workings."
 almaden_mines_03: "Great Almadén Mines"
 almaden_mines_03_desc: "The workings have spread across the site, with new pits and shafts opened to reach the richer deposits below."
 almaden_mines_04: "Almadén Mining Complex"
 almaden_mines_04_desc: "Processing yards, stores and wharves have grown up around the workings, and the whole district now lives by its trade."
 almaden_mines_01_district: "$building_type_almaden_mines_01$"
 almaden_mines_01_district_desc_flavor: "$building_type_almaden_mines_01_desc$"
 building_almaden_mines_destination_desc: "The [GetBuildingType('almaden_mines_01').GetName] is busy from dawn to dusk, and the quicksilver trade draws merchants from far away."

