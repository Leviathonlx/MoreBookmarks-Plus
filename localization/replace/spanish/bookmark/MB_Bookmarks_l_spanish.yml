 # Clave general del escenario
 PRELUDE: "Preludio"

 #####1194
 bm_1194: "Ricardo y Felipe"
 bm_1194_desc: "Ricardo Corazón de León y Felipe II Augusto se observan a ambos lados del canal de la Mancha. La herencia, las alianzas matrimoniales, las intrigas y las conquistas han permitido a los Plantagenet acumular vastos dominios en Francia, hasta el punto de amenazar la autoridad de los Capetos sobre buena parte del reino. Felipe II, decidido a fortalecer la monarquía francesa y recuperar los territorios bajo dominio inglés, se enfrenta a un adversario formidable: Ricardo, recién liberado de su cautiverio y dispuesto a recuperar sus posesiones. Mientras ambos monarcas se preparan para reanudar su rivalidad, en el Sacro Imperio Romano Germánico Enrique VI ha hecho valer sus derechos dinásticos sobre el reino de Sicilia. ¿Quién logrará imponer su autoridad sobre sus rivales y alterar el equilibrio de poder en Europa?"

 # Personajes

 # Felipe II Augusto de Francia
 bookmark_france1194: "Felipe II"
 bookmark_france1194_subheading: "Rey de Francia"
 bookmark_france1194_desc: "Felipe II, conocido como Augusto, ha dedicado su reinado a fortalecer la autoridad de la Corona y contrarrestar el poder de los Plantagenet, cuyos dominios en Francia amenazan con eclipsar al propio reino. Su rivalidad con Enrique II y, posteriormente, con sus hijos ha marcado buena parte de su política. Ahora, Ricardo Corazón de León ha recuperado la libertad tras años de cautiverio y vuelve a representar una amenaza para los intereses franceses. Felipe debe aprovechar la oportunidad para afianzar sus conquistas y debilitar a la dinastía rival. Sin embargo, enfrentarse al formidable rey inglés no será tarea sencilla. ¿Conseguirá Felipe consolidar el poder de los Capetos y devolver a Francia su antigua grandeza?"

 # Ricardo I Corazón de León de Inglaterra
 bookmark_england1194: "Ricardo Corazón de León"
 bookmark_england1194_subheading: "Rey de Inglaterra"
 bookmark_england1194_desc: "Ricardo I, conocido como Corazón de León, es célebre por su destreza militar y su participación en la Tercera Cruzada. Sin embargo, su prolongada ausencia de sus dominios y su cautiverio a manos del duque Leopoldo V de Austria han debilitado su posición. Tras pagar un cuantioso rescate, Ricardo ha recuperado la libertad y regresa a sus tierras, donde debe hacer frente a las consecuencias de su ausencia y a las ambiciones de Felipe II de Francia. Sus dominios continentales están amenazados y su autoridad en Inglaterra necesita reafirmarse. ¿Podrá Ricardo recuperar la iniciativa y preservar el vasto patrimonio de los Plantagenet?"

 # Enrique VI del Sacro Imperio Romano Germánico
 bookmark_hre1194: "Enrique VI"
 bookmark_hre1194_subheading: "Emperador del Sacro Imperio Romano Germánico"

 #####1200
 bm_fourth: "La Cuarta Cruzada"
 bm_fourth_desc: "La tristemente célebre y malograda Cuarta Cruzada, que debía recuperar Jerusalén mediante una invasión de Egipto, fue desviada por los intrigantes venecianos, por la corrupción de sus dirigentes y por el príncipe Alejo Ángelo, hijo del emperador depuesto Isaac II, que aspiraba a recuperar el trono para su familia. El resultado fue el trágico saqueo de Constantinopla y el establecimiento del llamado Imperio latino. Casi ningún cruzado llegó siquiera a Tierra Santa. Mientras tanto, el rey Juan, hermano de Ricardo Corazón de León, gobierna en Inglaterra, los reinos cristianos de España se enfrentan a la poderosa dinastía almohade, el Sacro Imperio Romano Germánico comienza a perder su control sobre Italia y, muy al este, Temujin empieza a unir a los mongoles..."

 # Personajes

 # Balduino I, emperador latino de Constantinopla
 bookmark_latin: "Balduino I"
 bookmark_latin_subheading: "Emperador latino de Constantinopla"
 bookmark_latin_desc: "Balduino I ocupa el trono del Imperio latino de Constantinopla, el estado cruzado surgido sobre las ruinas del dominio romano. Fue uno de los líderes más destacados de la Cuarta Cruzada, la expedición que acabó saqueando la ciudad que ahora gobierna. Su nuevo imperio es frágil: los griegos huidos se agrupan en torno a Nicea y el Epiro, y Kaloyan, soberano de Bulgaria, acecha sus fronteras. ¿Conseguirá Balduino consolidar su imperio o sucumbirá ante sus numerosos enemigos?"

 # Teodoro I Láscaris, emperador de Nicea
 bookmark_nikaea: "Teodoro I"
 bookmark_nikaea_subheading: "Emperador de Nicea"
 bookmark_nikaea_desc: "Teodoro I Láscaris gobierna Nicea. Aunque nació en el seno de una oscura familia aristocrática, su madre estaba emparentada con el clan imperial de los Comnenos. Los griegos que huyen del Imperio latino, el estado cruzado surgido en el corazón del antiguo dominio romano, acuden en masa a Asia Menor para vivir bajo su autoridad. Los latinos han capturado a su suegro y se han aliado con Alejo I de Trebisonda, pero Teodoro ha derrotado a sus ejércitos, se ha asegurado el apoyo de la mayoría de los aristócratas de Bitinia y ha sometido a quienes se resistían. ¿Conseguirá convertir Nicea en el centro de la restauración romana o su legitimidad será disputada por otros gobernantes griegos?"

 # Juan, rey de Inglaterra
 bookmark_england1200: "Juan"
 bookmark_england1200_subheading: "Rey de Inglaterra"
 bookmark_england1200_desc: "Juan, hermano de Ricardo Corazón de León, ocupa el trono de Inglaterra y gobierna un extenso conjunto de territorios en Francia, el llamado Imperio angevino, bajo la amenaza constante de Felipe II de Francia. El ducado de Normandía y las demás tierras francesas dependen de su capacidad para defenderlas. ¿Conseguirá Juan conservar Normandía y el resto de sus dominios franceses frente a Felipe II?"

 # Felipe II Augusto, rey de Francia
 bookmark_france1200: "Felipe II"
 bookmark_france1200_subheading: "Rey de Francia"
 bookmark_france1200_desc: "Felipe II reina en Francia desde hace décadas. Sus predecesores se titularon reyes de los francos, pero desde hace años él se proclama rey de Francia. Ha reforzado la autoridad real, ha fortificado París, ha reorganizado el gobierno y ha dado estabilidad financiera al reino, y su enfrentamiento con la Casa de Plantagenet atraviesa un momento decisivo ahora que el trono inglés ha pasado a Juan. ¿Conseguirá Felipe poner fin al Imperio angevino y convertir Francia en el país más próspero y poderoso de Europa?"

 # Sancho I el Poblador, rey de Portugal
 bookmark_portugal: "Sancho I"
 bookmark_portugal_subheading: "Rey de Portugal"
 bookmark_portugal_desc: "Sancho I, apodado el Poblador, gobierna Portugal y dedica gran parte de su reinado a la organización política y administrativa del joven reino. Ha acumulado un tesoro nacional, apoya las nuevas industrias y a la clase media de comerciantes, funda ciudades y villas y se esfuerza por poblar zonas remotas de las regiones cristianas del norte de Portugal, de ahí su apodo. Amante del conocimiento y de la literatura, cultiva la poesía y utiliza el tesoro real para enviar estudiantes portugueses a las universidades europeas. ¿Conseguirá consolidar un reino aún joven entre vecinos poderosos?"

 # Kilij Arslan III, sultán de Rum
 bookmark_rum1200: "Kilij Arslan III"
 bookmark_rum1200_subheading: "Sultán de Rum"
 bookmark_rum1200_desc: "Kilij Arslan III ha heredado el trono del sultanato selyúcida de Rum tras la muerte de su padre, Solimán II. Su autoridad es incierta: el trono ya ha conocido las disputas entre los hijos de su abuelo, Kilij Arslan II, y su tío Kaykhusraw I es un posible rival. ¿Conseguirá conservar el trono frente a los ambiciosos miembros de su dinastía?"

 # Gengis Kan, gran kan del Imperio mongol
 bookmark_mongol: "Gengis Kan"
 bookmark_mongol_subheading: "Gran Kan del Imperio mongol"
 bookmark_mongol_desc: "Gengis Kan, nacido Temüjin Borjigin, unifica a las tribus de las estepas y funda el Imperio mongol, del que es el primer gran kan. Su ambición no parece tener límites: los qara kitai, Corasmia y las dinastías Xia occidental y Jin son vecinos que podrían convertirse en sus objetivos, y las tierras de Georgia, la Rus de Kiev y la Bulgaria del Volga quedan al alcance de sus jinetes. ¿Hasta dónde llegará la expansión del nuevo imperio?"

 # Alejo I Comneno, emperador de Trebisonda
 bookmark_alexios1200: "Alejo I"
 bookmark_alexios1200_subheading: "Emperador de Trebisonda"
 bookmark_alexios1200_desc: "Alejo I Comneno, junto con su hermano David, ha fundado el Imperio de Trebisonda. Ambos son los únicos descendientes varones del emperador Andrónico I, derrocado y asesinado, por lo que pretenden representar el gobierno legítimo del Imperio tras la conquista de Constantinopla por la Cuarta Cruzada. Su pretensión choca con la de los gobernantes de Nicea, que también aspiran a ser los sucesores legítimos. Alejo destaca su herencia y su conexión con la dinastía comnena y se hace llamar Megas Komnenos, el Gran Comneno. ¿Conseguirá imponer sus derechos dinásticos sobre el trono imperial?"

 # Miguel I Comneno Ducas, déspota de Epiro
 bookmark_epirus: "Miguel I"
 bookmark_epirus_subheading: "Déspota de Epiro"
 bookmark_epirus_desc: "Miguel I Comneno Ducas es el fundador y primer gobernante del Despotado de Epiro. Sus dominios se han convertido en refugio y centro de resistencia de los griegos frente a los cruzados latinos. Para evitar la invasión y ganar tiempo para consolidar su posición, Miguel ha entablado negociaciones con el papa Inocencio III y ha concluido tratados con el Imperio latino y la República de Venecia. Su gobierno ha ganado además legitimidad al rescatar del cautiverio al depuesto Alejo III. ¿Conseguirá consolidar el Epiro como baluarte griego sin verse arrastrado a una guerra con los latinos?"

 # Felipe de Suabia, rey de Alemania
 bookmark_hre1200: "Felipe de Suabia"
 bookmark_hre1200_subheading: "Rey de Alemania"
 bookmark_hre1200_desc: "La muerte de su hermano mayor, el emperador Enrique VI, hundió el dominio de los Hohenstaufen en la Italia imperial y creó un vacío de poder al norte de los Alpes. En un imperio sin constitución escrita, las reservas sobre la realeza del hijo menor de edad de Enrique VI, Federico, dieron lugar a dos elecciones reales, de modo que Felipe de Suabia y el welfo Otón de Brunswick reclaman el trono alemán para sí. Felipe impone cada vez más su autoridad frente a Otón en el norte de los Alpes. ¿Conseguirá poner fin a la disputa y reunificar el trono alemán?"

 # Clave general del escenario
 FOURTH: "Cuarta"

 #####1220
 bm_1220: "La edad de los mongoles"
 bm_1220_desc: "Con el cambio de siglo, Constantinopla ha sido saqueada por la Cuarta Cruzada y el Imperio romano ha quedado muy debilitado. Los turcos siguen reinando en Oriente Medio y Persia, y en la India numerosos reinos nuevos se disputan el poder tras la caída de las antiguas dinastías. La conquista normanda ha traído nuevas luchas políticas y dinásticas a Inglaterra y Francia, los reinos cristianos de España se fortalecen sin cesar y Escandinavia ha dejado atrás el paganismo y se centraliza. En Rusia, varios principados luchan por el poder a la sombra de los búlgaros del Volga y de los cumanos del este. En Alemania e Italia, el Sacro Imperio Romano Germánico aún se mantiene firme, pero más allá de todo ello, al este, un nuevo poder está a punto de entrar en escena: los mongoles avanzan por Persia y amenazan con irrumpir en Europa oriental, alterando el equilibrio de poder en toda Eurasia occidental..."

 # Personajes
 # Gengis Kan, gran kan del Imperio mongol
 bookmark_ghengis: "Gengis Kan"
 bookmark_ghengis_subheading: "Gran Kan del Imperio mongol"
 bookmark_ghengis_desc: "Gengis Kan, nacido Temüjin Borjigin, es el fundador y primer gran kan del Imperio mongol. Sus campañas contra los qara kitai, los corasmios y las dinastías Xia occidental y Jin muestran una ambición sin límites, y suelen ir acompañadas de matanzas a gran escala de la población civil, sobre todo en las tierras controladas por los corasmios y los Xia occidentales. Debido a esa brutalidad, que deja millones de muertos, muchos lo consideran un gobernante despiadado. Las tierras de Georgia, la Rus de Kiev y la Bulgaria del Volga podrían ser las siguientes en conocer a sus ejércitos. ¿Hasta dónde llegará la expansión del imperio más extenso que han visto las estepas?"

 # Iltutmish, sultán de Delhi
 bookmark_india: "Iltutmish"
 bookmark_india_subheading: "Sultán de Delhi"
 bookmark_india_desc: "Shams ud-Din Iltutmish es el tercero de los reyes mamelucos que gobiernan los antiguos territorios ghuríes del norte de la India y el primer soberano musulmán que gobierna desde Delhi, lo que lo convierte en el verdadero fundador del sultanato de Delhi. Organiza la administración y ha introducido el tanka de plata y el jital de cobre, las dos monedas básicas del sultanato, con un peso estándar de 175 granos. Ha establecido además el sistema de iqtas, una división del imperio en territorios que se asignan a nobles y oficiales en lugar de un salario. También erige mezquitas, monasterios, dargahs (santuarios o tumbas de personas influyentes) y un embalse para los peregrinos. ¿Conseguirá asentar los cimientos de un sultanato duradero en el norte de la India?"

 # Muhammad II, sah del Imperio corasmio
 bookmark_khwar: "Muhammad II"
 bookmark_khwar_subheading: "Sah del Imperio corasmio"
 bookmark_khwar_desc: "Ala ad-Din Muhammad II gobierna el Imperio corasmio, que se extiende desde el Hindu Kush hasta Mesopotamia y el mar de Aral, al norte. Sin embargo, ha provocado a los mongoles al ejecutar a los mensajeros de Gengis Kan, una ofensa que amenaza con acarrear la destrucción de su imperio y la masacre de su pueblo. ¿Podrá el sah detener una invasión que amenaza con borrar su imperio del mapa?"

 # Isabel II, reina de Jerusalén
 bookmark_jerusalem1220: "Isabel II"
 bookmark_jerusalem1220_subheading: "Reina de Jerusalén"
 bookmark_jerusalem1220_desc: "Isabel II, hija única de la reina María de Montferrat y de Juan de Brienne, nació en Andria, en el sur del reino de Sicilia. Su madre, hija de la reina Isabel I de Jerusalén y de su segundo marido, Conrado I, y heredera del reino a la muerte de esta, murió poco después del parto, posiblemente por fiebre puerperal, por lo que la niña fue proclamada reina de Jerusalén a los pocos días de vida. Su padre, que no tiene derecho directo al trono, gobierna como regente. ¿Qué futuro aguarda a un reino cuya reina aún es una niña?"

 # Federico II, emperador del Sacro Imperio Romano Germánico
 bookmark_hre1220: "Federico II"
 bookmark_hre1220_subheading: "Emperador del Sacro Imperio Romano Germánico"
 bookmark_hre1220_desc: "Federico II acaba de acceder al trono del Sacro Imperio Romano Germánico y sus ambiciones políticas y culturales son enormes: gobierna una vasta zona que comienza en Sicilia y se extiende por Italia hasta el norte de Alemania. Fue coronado rey de Sicilia a los tres años, como cogobernante con su madre, Constanza de Hauteville, hija de Roger II de Sicilia. Con el papado acorralado entre sus tierras del norte de Italia y el reino de Sicilia, el Regno, al sur, su relación con Roma promete ser tensa, y a medida que avanzan las cruzadas podría intentar adquirir el control de Jerusalén. ¿Hasta dónde llegarán las ambiciones del joven emperador?"

 # Fernando III el Santo, rey de Castilla
 bookmark_castille: "Fernando III"
 bookmark_castille_subheading: "Rey de Castilla"
 bookmark_castille_desc: "Fernando III, llamado el Santo, ocupa el trono de Castilla desde hace pocos años. Su ambición es doble: asegurar la unión permanente de las coronas de Castilla y León y emprender la campaña de Reconquista más expansiva hasta la fecha. Mediante esfuerzos militares y diplomáticos podría ampliar enormemente los dominios castellanos en el sur de España y anexionar grandes ciudades antiguas de al-Ándalus, entre ellas las antiguas capitales andaluzas de Córdoba y Sevilla. ¿Conseguirá Fernando establecer los límites del estado castellano para los siglos venideros?"

 # Enrique III, rey de Inglaterra
 bookmark_england1220: "Enrique III"
 bookmark_england1220_subheading: "Rey de Inglaterra"
 bookmark_england1220_desc: "Enrique III, también conocido como Enrique de Winchester, es todavía un rey muy joven que gobierna como rey de Inglaterra, señor de Irlanda y duque de Aquitania. La Carta Magna, reeditada en su nombre, limita el poder real y protege los derechos de los principales barones, y su gobierno está dominado por consejeros poderosos como Hubert de Burgh y Peter des Roches, que han restablecido la autoridad real tras la guerra. ¿Conseguirá el joven rey reconquistar las provincias de Francia que pertenecieron a su padre?"

 # Felipe II Augusto, rey de Francia
 bookmark_france1220: "Felipe II"
 bookmark_france1220_subheading: "Rey de Francia"
 bookmark_france1220_desc: "Felipe II reina en Francia desde hace décadas y ha transformado un pequeño estado feudal en el país más próspero y poderoso de Europa. Sus predecesores fueron conocidos como reyes de los francos, pero él es el primer monarca francés que se titula rey de Francia. Tras décadas de conflictos con la Casa de Plantagenet, puso fin al Imperio angevino al derrotar a una coalición en Bouvines, y su hijo, el príncipe Luis, ayudó a los barones ingleses a rebelarse contra el rey Juan, a quien habían forzado a asentir a la Carta Magna. Ha controlado el poder de los nobles, ha ayudado a las ciudades a liberarse de la autoridad señorial concediendo privilegios y libertades a la burguesía emergente, ha construido una gran muralla alrededor de París y ha reorganizado el gobierno, dando estabilidad financiera a su país. ¿Conseguirá que su obra sobreviva a su reinado?"

 # Yuri II, gran príncipe de Vladimir
 bookmark_vladimir: "Yuri II"
 bookmark_vladimir_subheading: "Gran Príncipe de Vladimir"
 bookmark_vladimir_desc: "Yuri II es Gran Príncipe de Vladimir y preside Vladimir-Suzdal, uno de los principados más poderosos de la Rus. Gobierna en una época de rivalidades entre los príncipes rusos, a la sombra de los pueblos de las estepas y de un nuevo poder mongol que se aproxima desde el este. Sus decisiones determinarán cómo responderá la Rus ante una amenaza desconocida. ¿Sabrá Yuri unir a los príncipes rusos ante el peligro que se acerca?"

 1200: "1200"

 #####1241
 bm_1241: "La caída de Kiev"
 bm_1241_desc: "Marchando hacia el oeste con una fuerza aparentemente imparable, la horda mongola de Batu ha capturado Kiev, el corazón de la Rus de Kiev. Miles de personas yacen muertas en la ciudad, como si presagiaran lo que está por venir en las tierras más occidentales. ¿Será Kiev la última ciudad en sufrir tal destino? En el Sacro Imperio Romano Germánico, los burgueses de las ciudades imperiales libres de Lübeck y Hamburgo, en el norte de Alemania, acaban de formar una alianza comercial que acabará siendo conocida como la Liga Hanseática. Mientras tanto, la temible horda mongola ha arrasado Europa oriental como una guadaña, segando sin esfuerzo toda oposición, y hasta el emperador Federico II contempla con inquietud el avance de los jinetes de las estepas."

 # Personajes

 # Batu Kan, kan de la Horda de Oro
 bookmark_golden1241: "Batu Kan"
 bookmark_golden1241_subheading: "Kan de la Horda de Oro"
 bookmark_golden1241_desc: "Batu Kan, hijo de Jochi y nieto de Gengis Kan, es el soberano de la Horda de Oro, una división del Imperio mongol. Su ulus es el estado principal de la Horda de Oro, que domina la Rus, la Bulgaria del Volga, Cumania y el Cáucaso, y sus ejércitos amenazan ya a Polonia y Hungría. Es el príncipe más respetado del imperio y lleva el título de agha, «hermano mayor». Junto con Subutai prepara la invasión de Austria, Italia y Alemania, pero los príncipes de sangre, y el propio Subutai, podrían ser llamados a Karakorum, donde se celebraría el kurultai que elige al gran kan. ¿Continuará Batu la conquista de Occidente o volverá a Mongolia para disputar el título de gran kan?"

 # Hulagu Kan, ilkan del Ilkanato
 bookmark_ilk1241: "Hulagu Kan"
 bookmark_ilk1241_subheading: "Ilkan del Ilkanato"
 bookmark_ilk1241_desc: "Hulagu Kan, nieto de Gengis Kan e hijo de Tolui y de la princesa queraíta Sorghaghtani Beki, es hermano de Ariq Böke, Möngke Kan y Kublai Kan. Aspira a extender el dominio mongol por el suroeste de Asia y a levantar en Persia un Ilkanato desde el que podría lanzarse contra los ismailíes y contra Bagdad, capital del califato abasí. De sus campañas podría depender el desplazamiento de la influencia islámica hacia el sultanato mameluco de El Cairo. ¿Conseguirá Hulagu convertir sus ejércitos en el cimiento de un nuevo estado en Persia?"

 # Yesü Möngke, kan del Kanato de Chagatai
 bookmark_chag1241: "Yesü Möngke"
 bookmark_chag1241_subheading: "Kan del Kanato de Chagatai"
 bookmark_chag1241_desc: "Yesü Möngke, quinto hijo de Chagatai Kan y de Yesülün Katun, es jefe del ulus del Kanato de Chagatai. Fue nombrado kan por su primo, el gran kan Güyük, del que es amigo, tras la deposición de Qara Hülegü. Su posición depende por completo del favor de Güyük y de la casa de Ögedei, y una nueva sucesión imperial podría cambiar las reglas del juego. ¿Conseguirá conservar el trono si cambia el equilibrio de poder entre los descendientes de Gengis Kan?"

 # Güyük Kan, gran kan del Imperio mongol
 bookmark_mongol1241: "Güyük Kan"
 bookmark_mongol1241_subheading: "Gran Kan del Imperio mongol"
 bookmark_mongol1241_desc: "Güyük, hijo mayor de Ögedei y nieto de Gengis Kan, ocupa el trono del Imperio mongol como tercer gran kan. Ha revocado varios edictos impopulares de su madre, la regente, y se ha revelado como un kan sorprendentemente capaz: ha enviado a Eljigidei a Persia para preparar un ataque contra Bagdad y los ismailíes y prosigue la guerra contra la dinastía Song. No obstante, se muestra inseguro y se ha ganado la desaprobación de sus súbditos al ejecutar por traición a varios altos funcionarios del régimen anterior. Bajo su mandato, los funcionarios uigures aumentan su dominio, relegando a los chinos del norte y a los musulmanes. Estricto e inteligente, aunque taciturno y enfermizo, su afición a la bebida perjudica su salud. ¿Logrará Güyük imponer su autoridad sobre un imperio cada vez más dividido?"

 # Fernando III el Santo, rey de Castilla
 bookmark_spain1241: "Fernando III"
 bookmark_spain1241_subheading: "Rey de Castilla"
 bookmark_spain1241_desc: "Fernando III, llamado el Santo, ocupa el trono de Castilla y ha asegurado la unión permanente de las coronas de Castilla y León. Dirige la campaña de Reconquista más expansiva hasta la fecha: mediante esfuerzos militares y diplomáticos ha ampliado enormemente los dominios de Castilla en el sur de España y ha anexionado ya Córdoba, antigua capital de al-Ándalus, con Sevilla en el horizonte. ¿Conseguirá Fernando fijar los límites del estado castellano para mucho tiempo?"

 # Federico II, emperador del Sacro Imperio Romano Germánico
 bookmark_hre1241: "Federico II"
 bookmark_hre1241_subheading: "Emperador del Sacro Imperio Romano Germánico"
 bookmark_hre1241_desc: "Federico II es emperador del Sacro Imperio Romano Germánico desde hace años y rey de Jerusalén. Sus ambiciones políticas y culturales son enormes: gobierna una vasta zona que comienza en Sicilia y se extiende por Italia hasta el norte de Alemania. A medida que avanzaban las cruzadas, adquirió el control de Jerusalén y se proclamó su rey. Coronado rey de Sicilia a los tres años, como cogobernante con su madre, Constanza de Hauteville, hija de Roger II de Sicilia, está en guerra frecuente con el papado, acorralado entre las tierras de Federico en el norte de Italia y el Regno, al sur. Ha sido excomulgado en varias ocasiones y las crónicas pro papales lo vilipendian; el papa Gregorio IX ha llegado a llamarlo Anticristo. ¿Podrá defender el Imperio frente a la amenaza mongola mientras mantiene su pulso con Roma?"

 # Béla IV, rey de Hungría
 bookmark_hungary1241: "Béla IV"
 bookmark_hungary1241_subheading: "Rey de Hungría"
 bookmark_hungary1241_desc: "Béla IV gobierna Hungría y Croacia con los mongoles a las puertas del reino. Su país está desprotegido: para prepararlo ante la invasión podría permitir a barones y prelados erigir fortalezas de piedra y crear sus propias fuerzas armadas, promover el desarrollo de ciudades fortificadas y atraer a miles de colonos del Sacro Imperio Romano Germánico, Polonia y otras regiones vecinas para instalarse en las tierras despobladas. ¿Sobrevivirá Hungría a la tormenta mongola y logrará levantarse de nuevo?"

 # Ala ud-Din Masud Shah, sultán de Delhi
 bookmark_india1241: "Ala ud-Din Masud Shah"
 bookmark_india1241_subheading: "Sultán de Delhi"
 bookmark_india1241_desc: "Ala ud-Din Masud, hijo de Rukn ud-Din Firuz y de Shah Turkan, nieto del sultán Iltutmish y sobrino de la sultana Raziyya, ocupa el trono de Delhi como séptimo sultán de la dinastía mameluca. Los jefes lo eligieron tras el asesinato de su tío y predecesor, Muiz ud-Din Bahram, a manos del ejército, después de años de desórdenes. Es más una marioneta de los jefes que un gobernante con verdadero poder o influencia, y se le conoce por su afición al entretenimiento y al vino. Al igual que su predecesor, algunos lo consideran incompetente e inútil. ¿Se resignará a ser un instrumento de los nobles o intentará ejercer una autoridad real?"

 # Sundiata Keita, mansa de Malí
 bookmark_mali1241: "Sundiata Keita"
 bookmark_mali1241_subheading: "Mansa de Malí"
 bookmark_mali1241_desc: "Sundiata Keita es el príncipe fundador del Imperio de Malí, que gobierna como su primer mansa. Su prestigio como fundador es inmenso, pero un imperio joven necesita instituciones, aliados y un linaje capaz de sostenerlo. ¿Conseguirá consolidar el imperio recién fundado y legar un trono poderoso a su linaje?"

 #####1267
 1267: "Preludio"

 bm_1267: "La casa de Mindaugas restaurada"
 bm_1267_desc: "Tras el breve reinado del usurpador Treniota, el pueblo de Lituania ha considerado oportuno restaurar la casa del rey Mindaugas en el trono, y su primer hijo, Vaišvilkas, gobierna como soberano. Vaišvilkas ha expandido Lituania hacia el este y, al hacerlo, ha convertido inadvertidamente al país en una de las puertas de entrada de Europa, junto con los reinos de Polonia, Hungría y Bulgaria y el Gran Ducado de Nóvgorod. Aunque su reino sigue siendo relativamente pequeño, su piadoso cristianismo le hace ganar tiempo y el posible apoyo de otros gobernantes cristianos. Si consigue ese apoyo y lo utiliza para contener a la horda mongola, el ambicioso y joven soberano de Lituania podría recuperar algunas de las tierras ancestrales perdidas a manos de los caballeros teutónicos...\n\nMientras tanto, en el resto de Europa, la Casa de Hohenstaufen pierde el Regno con la muerte de Manfredo y Carlos I de Anjou pasa a gobernar Sicilia."

 # Personajes

 # Vaišvilkas, gran duque de Lituania
 bookmark_lith1267: "Vaišvilkas"
 bookmark_lith1267_subheading: "Gran Duque de Lituania"
 bookmark_lith1267_desc: "Vaišvilkas, hijo de Mindaugas, el primero y único rey cristiano de Lituania, gobierna como gran duque. Cristiano devoto, procura mantener relaciones amistosas con los caballeros teutónicos y la Orden de Livonia y ha firmado con esta un tratado de paz sobre el comercio en el río Daugava. Esa política tiene un coste: el apoyo lituano al Gran Levantamiento Prusiano ha cesado y las órdenes avanzan sin oposición contra semigalianos y curonios. Junto con Shvarn, ha atacado Polonia para vengar la devastación sufrida por los yotvingios. ¿Conseguirá proteger a Lituania de las órdenes sin renunciar a su fe ni a la paz?"

 # Boleslao V el Casto, alto duque de Polonia
 bookmark_poland1268: "Boleslao V"
 bookmark_poland1268_subheading: "Alto Duque de Polonia"
 bookmark_poland1268_desc: "Boleslao V, llamado el Casto, ostenta el título de alto duque de Polonia y pertenece a la rama menor polaca de los Piastas. Su gobierno ha conocido conflictos con Lituania y la colaboración con Hungría para hacer frente a los mongoles durante la segunda invasión de Polonia. ¿Logrará mantener Polonia a salvo de las amenazas lituana y mongola?"

 # Béla IV, rey de Hungría
 bookmark_hungary1267: "Béla IV"
 bookmark_hungary1267_subheading: "Rey de Hungría"
 bookmark_hungary1267_desc: "Béla IV gobierna Hungría y Croacia desde hace décadas. Los mongoles invadieron su reino y aniquilaron a su ejército en la batalla de Mohi; Béla escapó del campo de batalla, pero un destacamento mongol lo persiguió de ciudad en ciudad hasta Trogir, en la costa del Adriático. Aunque sobrevivió a la invasión, los mongoles devastaron el país antes de su inesperada retirada. Para preparar el reino ante una segunda invasión introdujo reformas radicales: permitió a los barones y a los prelados erigir fortalezas de piedra y crear sus propias fuerzas armadas, promovió el desarrollo de ciudades fortificadas y atrajo a miles de colonos del Sacro Imperio Romano Germánico, Polonia y otras regiones vecinas para instalarse en las tierras despobladas. Sus esfuerzos por reconstruir un país devastado le han valido el epíteto de «segundo fundador del Estado». ¿Conseguirá mantener a salvo el reino que ha reconstruido?"

 # Konstantin Tih, zar de Bulgaria
 bookmark_bulgaria1267: "Konstantin Tih"
 bookmark_bulgaria1267_subheading: "Zar de Bulgaria"
 bookmark_bulgaria1267_desc: "Konstantin Tih es el zar de Bulgaria y su gobierno se caracteriza por el conflicto con Hungría y con el Imperio romano. ¿Conseguirá mantener la independencia de Bulgaria entre dos vecinos tan poderosos?"

 # Carlos I de Anjou, rey de Sicilia
 bookmark_sicily1267: "Carlos I"
 bookmark_sicily1267_subheading: "Rey de Sicilia"
 bookmark_sicily1267_desc: "Carlos I, comúnmente llamado Carlos de Anjou, es miembro de la dinastía real de los Capetos y fundador de la segunda Casa de Anjou. Tras años de negociaciones aceptó la oferta de la Santa Sede de arrebatar el Reino de Sicilia a los Hohenstaufen. Este reino incluye, además de la isla de Sicilia, el sur de Italia hasta bien al norte de Nápoles, y es conocido como el Regno. El papa Urbano IV declaró una cruzada contra el titular, Manfredo de Sicilia, y ayudó a Carlos a recaudar fondos para la campaña militar. Coronado rey en Roma, Carlos aniquiló el ejército de Manfredo y ocupó el Regno casi sin resistencia. Sus victorias le han asegurado un liderazgo indiscutible entre los partidarios italianos del papado, los güelfos, pero su influencia en las elecciones papales y su fuerte presencia militar en Italia empiezan a molestar a los papas. ¿Conseguirá mantener el apoyo del papado mientras extiende su poder?"

 # Luis IX, rey de Francia
 bookmark_france1267: "Luis IX"
 bookmark_france1267_subheading: "Rey de Francia"
 bookmark_france1267_desc: "Luis IX fue coronado a los doce años, tras la muerte de su padre, Luis VIII; su madre, Blanca de Castilla, gobernó el reino como regente hasta que alcanzó la mayoría de edad. Ya adulto, se enfrentó a conflictos recurrentes con algunos de los nobles más poderosos de su reino, como Hugo X de Lusignan y Pedro de Dreux. Al mismo tiempo, Enrique III de Inglaterra intentó restaurar las posesiones continentales angevinas, pero fue rápidamente derrotado en la batalla de Taillebourg. Sus colegas europeos lo estiman por su preeminencia militar y porque gobierna el reino más rico, pero sobre todo por su reputación de justicia e integridad moral, hasta el punto de que a menudo se le pide que arbitre sus disputas. ¿Conseguirá mantener la paz y la justicia en un reino que otros miran con admiración?"

 # Enrique III, rey de Inglaterra
 bookmark_england1267: "Enrique III"
 bookmark_england1267_subheading: "Rey de Inglaterra"
 bookmark_england1267_desc: "Enrique III, también conocido como Enrique de Winchester, gobierna Inglaterra desde hace décadas y es además señor de Irlanda y duque de Aquitania. Prometió respetar la Carta Magna, que limita el poder real y protege los derechos de los principales barones. Sus primeros años de gobierno estuvieron dominados por Hubert de Burgh y Peter des Roches, que restablecieron la autoridad real tras la guerra. Cuando intentó reconquistar las provincias de Francia que habían pertenecido a su padre, la invasión fue un desastre, y la revuelta dirigida por el hijo de Guillermo Mariscal, Ricardo Mariscal, solo terminó con un acuerdo de paz negociado por la Iglesia. ¿Conseguirá mantener el equilibrio entre la corona y los barones?"

 # Alfonso X el Sabio, rey de Castilla
 bookmark_castille1267: "Alfonso X"
 bookmark_castille1267_subheading: "Rey de Castilla"
 bookmark_castille1267_desc: "Alfonso X gobierna como rey de Castilla, León y Galicia. Una facción disidente lo eligió rey de Alemania y él mantiene sus pretensiones imperiales, aunque su alianza con el Reino de Inglaterra le llevó a renunciar a sus pretensiones sobre el ducado de Gascuña. Impulsa una corte cosmopolita que fomenta el aprendizaje, en la que judíos, musulmanes y cristianos tienen un papel destacado. Al promover la traducción de obras del árabe y el latín a la lengua vernácula de Castilla, favorece grandes cambios intelectuales, como el uso del castellano como lengua principal de la enseñanza superior, la ciencia y el derecho. ¿Conseguirá convertir sus ambiciones intelectuales y políticas en un legado duradero para Castilla?"

 # Abu Yusuf Yaqub, sultán meriní
 bookmark_marin1267: "Abu Yusuf"
 bookmark_marin1267_subheading: "Sultán meriní"
 bookmark_marin1267_desc: "Los meriníes llevan décadas luchando contra los almohades por la supremacía de Marruecos. A la muerte de Abu Yahya, los meriníes quedaron instalados en Fez y controlaron el este y el norte de Marruecos, mientras que los almohades quedaron reducidos a los distritos del sur, alrededor de su capital, Marrakech. Aunque Abu Yahya había designado a su hijo como sucesor en Fez, Abu Yusuf Yaqub, entonces gobernador de Taza, consiguió con poca dificultad desplazar a su sobrino y hacerse reconocer como emir de los meriníes. Aspira ahora a acabar con los almohades, unificar Marruecos, establecer una nueva y grandiosa capital en Fez el-Jedid y dar a los meriníes un punto de apoyo en España. ¿Conseguirá convertirse en el verdadero fundador del Estado meriní?"

 # Uli, mansa de Malí
 bookmark_mali1267: "Uli"
 bookmark_mali1267_subheading: "Mansa de Malí"
 bookmark_mali1267_desc: "Mansa Uli, conocido también como Ali o Wali en las fuentes árabes, es el segundo mansa del Imperio de Malí. Ha aumentado considerablemente la producción agrícola del imperio y ha sentado un precedente en el plano económico y político al realizar el Hajj a La Meca durante su reinado. A diferencia de su padre, no tiene herederos de sangre, por lo que el trono podría ser disputado por sus hermanos de adopción. ¿Conseguirá asegurar una sucesión pacífica y mantener la fortaleza del imperio?"

 # Baibars, sultán mameluco
 bookmark_egypt1267: "Baibars"
 bookmark_egypt1267_subheading: "Sultán del Sultanato mameluco"
 bookmark_egypt1267_desc: "Al-Malik al-Zahir Rukn al-Din Baibars al-Bunduqdari, conocido comúnmente como Baibars, es el cuarto sultán de Egipto de la dinastía mameluca bahrí y sucesor de Qutuz. Fue uno de los comandantes de las fuerzas egipcias que infligieron una derrota a la Séptima Cruzada del rey Luis IX de Francia, y dirigió la vanguardia del ejército egipcio en la batalla de Ain Yalut, la primera derrota sustancial del ejército mongol, que se considera un punto de inflexión en la historia. Hoy refuerza la unión de Egipto y Siria como el estado musulmán preeminente de la región, capaz de rechazar las amenazas de cruzados y mongoles, y prepara el camino para el fin de la presencia cruzada en el Levante. ¿Conseguirá inaugurar una era de dominio mameluco en el Mediterráneo oriental?"

 # Abaqa Kan, ilkan del Ilkanato
 bookmark_ilkhanate1267: "Abaqa Kan"
 bookmark_ilkhanate1267_subheading: "Ilkan del Ilkanato"
 bookmark_ilkhanate1267_desc: "Abaqa Kan, hijo de Hulagu Kan y de la dama Yesünčin y nieto de Tolui, es el segundo gobernante mongol, o ilkan, del Ilkanato. Su reinado está dominado por las guerras civiles dentro del Imperio mongol, en especial contra el kanato del norte, la Horda de Oro, y por el deseo de someter Siria. ¿Conseguirá imponerse a sus rivales mongoles y a los mamelucos?"

 # Möngke Temür, kan de la Horda de Oro
 bookmark_golden1267: "Möngke Temür"
 bookmark_golden1267_subheading: "Kan de la Horda de Oro"
 bookmark_golden1267_desc: "Möngke Temür, hijo de Toqoqan y de Buka Ujin de los oirates y nieto de Batu Kan, es kan de la Horda de Oro, una división del Imperio mongol. Su autoridad se extiende sobre los príncipes rusos, sus vasallos, que le acompañan en sus campañas, mientras los cruzados alemanes y los lituanos ponen en peligro la seguridad de las tierras rusas. Ha concedido a la Iglesia ortodoxa rusa la exención del pago de tributos a la Horda de Oro mediante el primer yarlyk (licencia) que conocen los historiadores. ¿Podrá ampliar la influencia de la Horda de Oro sobre las tierras rusas y sus vecinos?"

 # Baraq, kan del Kanato de Chagatai
 bookmark_chagatai1267: "Baraq"
 bookmark_chagatai1267_subheading: "Kan del Kanato de Chagatai"
 bookmark_chagatai1267_desc: "Baraq, hijo de Yesünto'a y bisnieto de Chagatai Kan, es kan del Kanato de Chagatai y se ha convertido al islam. A principios de la década anterior viajó a Asia central y se ganó la confianza de Mubarak Shah; cuando este fue entronizado de nuevo como kan de Chagatai, Baraq obtuvo el apoyo del ejército para dar un golpe de estado y lo depuso. Casi inmediatamente ha repudiado la autoridad de Kublai como gran kan: ha destituido al representante de este en el Turquestán chino y lo ha sustituido por gobernadores propios. Su ejército, muy superior, impide que los oficiales de Kublai lo expulsen, y Jotán ha sido asolada por sus fuerzas. ¿Podrá Baraq mantener su independencia frente a Kublai y Kaidu?"

 # Ghiyas ud-Din Balban, sultán de Delhi
 bookmark_india1267: "Ghiyas ud-Din Balban"
 bookmark_india1267_subheading: "Sultán de Delhi"
 bookmark_india1267_desc: "Ghiyas ud-Din Balban es el noveno sultán de la dinastía mameluca de Delhi. Realizó varias conquistas, algunas de ellas como visir, y derrotó a los mewat que acosaban Delhi. Aspira ahora a reconquistar Bengala mientras hace frente a la amenaza mongola. Reforma la administración civil y el ejército con el propósito de dar al sultanato un gobierno estable y próspero. ¿Será capaz de contener a los mongoles y asegurar una sucesión sólida?"

 # Ricardo de Cornualles, rey de los romanos
 bookmark_hre1267: "Ricardo"
 bookmark_hre1267_subheading: "Rey de los romanos"
 bookmark_hre1267_desc: "Ricardo es rey de Alemania y uno de los hombres más ricos de Europa. Se unió a la Cruzada de los Barones, donde tuvo éxito como negociador para la liberación de prisioneros y colaboró en la construcción de la ciudadela de Ascalón. ¿Conseguirá imponerse como rey de los romanos en un imperio sumido en el Gran Interregno?"

 # Miguel VIII Paleólogo, basileo del Imperio romano
 bookmark_ere1267: "Miguel VIII"
 bookmark_ere1267_subheading: "Basileo del Imperio romano"
 bookmark_ere1267_desc: "Miguel VIII Paleólogo reina como emperador y es el fundador de la dinastía de los Paleólogos. Ha recuperado Constantinopla del Imperio latino y ha transformado el Imperio de Nicea en un Imperio romano restaurado. Su reinado ha traído una considerable recuperación del poder romano, con la ampliación del ejército y de la armada, la reconstrucción de la ciudad de Constantinopla y el aumento de su población. Ha restablecido además la Universidad de Constantinopla, que podría dar lugar a un renacimiento cultural. Al mismo tiempo, el foco de atención del ejército se ha desplazado a los Balcanes, contra los búlgaros, mientras la frontera de Anatolia queda descuidada. ¿Conseguirá asegurar la restauración del Imperio sin descuidar sus fronteras orientales?"

 # Kublai Kan, gran kan del Imperio mongol
 bookmark_yuan1267: "Kublai Kan"
 bookmark_yuan1267_subheading: "Gran Kan del Imperio mongol"
 bookmark_yuan1267_desc: "Kublai, quinto jagán del Imperio mongol, es el cuarto hijo de Tolui (su segundo hijo con Sorghaghtani Beki) y nieto de Gengis Kan. Sucedió a su hermano mayor, Möngke, como gran kan, pero tuvo que derrotar a su hermano menor, Ariq Böke, en la guerra civil toluida, un episodio que marcó el inicio de la desunión del imperio. Su poder real se limita a China y Mongolia, aunque como gran kan conserva influencia sobre el Ilkanato y, en un grado significativamente menor, sobre la Horda de Oro. Aspira a fundar en China una dinastía de conquista y a gobernar como su primer emperador. En teoría, su reino se extiende desde el océano Pacífico hasta el mar Negro, y desde Siberia hasta lo que hoy es Afganistán. ¿Conseguirá mantener unido un imperio ya fracturado?"

 #####1285
 bm_1285: "Los Habsburgo"
 bm_1285_desc: "Rodolfo de Habsburgo, actual rey de los romanos, ha derrotado a Otakar II de Bohemia, su único rival por el trono imperial. Con la derrota de Otakar, gran parte de sus tierras han vuelto a la corona, incluido el ducado de Austria, que Rodolfo ha confiado a su hijo Alberto. Aunque la sucesión está asegurada y ha comenzado una nueva era con el control de los Habsburgo sobre Austria, no todo va bien en el Imperio.\n\nTras las sangrientas secuelas de las Vísperas Sicilianas, una guerra en la que el rey aragonés intentó hacer valer su derecho al reino de Sicilia, el sur de la península italiana está dividido. En la isla de Sicilia se ha proclamado el Reino de Trinacria, en el que gobierna el hermano del rey aragonés, que reclama los derechos sobre la totalidad del reino. En tierra firme, el antiguo rey de Sicilia, que ya no puede titularse como tal, se ha proclamado rey de Nápoles y mira con celos la isla que debería ser suya por derecho. Ambos bandos del conflicto cuentan con poderosos aliados: el rey de Trinacria está protegido por los reyes de Aragón y Castilla, y el rey de Nápoles cuenta con el apoyo de Hungría-Croacia, por lo que la nueva guerra no será fácil. También en la península ibérica, Felipe IV de Francia ha llegado a ser rey de Navarra, y puede contarse igualmente en la lucha ibérica. ¿Quién se moverá primero, y contra quién?"

 # Personajes

 # Rodolfo I de Habsburgo, rey de los romanos
 bookmark_hre1285: "Rodolfo I"
 bookmark_hre1285_subheading: "Rey de los romanos"
 bookmark_hre1285_desc: "Rodolfo I es el primer rey de Alemania de la Casa de Habsburgo, el primer conde-rey de Alemania. Su elección puso fin al Gran Interregno, iniciado tras la muerte del emperador Federico II de Hohenstaufen. De origen condal suabo, fue el primer Habsburgo que adquirió los ducados de Austria y Estiria frente a su poderoso rival, el rey Otakar II de Bohemia, de la casa Přemysl, al que derrotó en la batalla de Marchfeld. Ha desempeñado un papel fundamental en la elevación de la casa condal de Habsburgo al rango de príncipes imperiales. ¿Conseguirá convertir esos territorios en el núcleo de un poder duradero para su dinastía?"

 # Carlos II el Cojo, rey de Nápoles
 bookmark_naples1285: "Carlos II"
 bookmark_naples1285_subheading: "Rey de Nápoles"
 bookmark_naples1285_desc: "Carlos II, también conocido como Carlos el Cojo, es rey de Nápoles; se ha autoproclamado además rey de Albania y reclama el reino de Jerusalén. Es hijo de Carlos I de Anjou, uno de los monarcas europeos más poderosos de su época, y de Beatriz de Provenza. Su padre le concedió el principado de Salerno, en el Reino de Sicilia (o Regno), y lo nombró regente en Provenza y Forcalquier. Tras el levantamiento conocido como las Vísperas Sicilianas contra su padre, la isla de Sicilia se convirtió en un reino independiente bajo el gobierno de Pedro III de Aragón. Un año después, su padre nombró a Carlos regente en los territorios continentales del Regno, o Reino de Nápoles. Carlos celebró una asamblea general en la que se abolieron los impuestos impopulares y se confirmaron las libertades de los nobles y los clérigos, pero no pudo evitar que los aragoneses ocuparan Calabria y las islas del golfo de Nápoles. ¿Conseguirá recuperar la isla de Sicilia y defender el Regno?"

 # Jaime II el Justo, rey de Sicilia
 bookmark_trinacria1285: "Jaime II"
 bookmark_trinacria1285_subheading: "Rey de Sicilia"
 bookmark_trinacria1285_desc: "Jaime, apodado el Justo, es hermano del rey Alfonso III de Aragón y gobierna la isla de Sicilia, proclamada como Reino de Trinacria, cuyos derechos reclama sobre la totalidad del reino. Como hermano de Alfonso III, podría llegar a heredar las coronas de Aragón y Valencia y el condado de Barcelona. Un tratado de paz con Carlos II de Anjou podría obligarle a renunciar a Sicilia, pero los sicilianos podrían entronizar en su lugar a su hermano Federico. ¿Conseguirá conservar Sicilia frente a Carlos II de Anjou o tendrá que plegarse a un acuerdo de paz?"

 # Felipe IV el Hermoso, rey de Francia
 bookmark_france1285: "Felipe IV"
 bookmark_france1285_subheading: "Rey de Francia"
 bookmark_france1285_desc: "Felipe IV, llamado Felipe el Hermoso, es rey de Francia. Aunque es conocido por su apostura, de ahí el epíteto de le Bel, su personalidad rígida e inflexible le vale, tanto entre amigos como entre enemigos, otros apodos, como el de Rey de Hierro. Prefiere apoyarse en hábiles juristas y funcionarios antes que en la nobleza para gobernar el reino, y con sus consejeros pretende transformar Francia de un país feudal en un estado centralizado. Aspira a una monarquía incontestada, obligar a sus vasallos mediante guerras y restringir los usos feudales. Sus ambiciones lo hacen muy influyente en los asuntos europeos: desea colocar a sus parientes en tronos extranjeros, y príncipes de su casa gobiernan ya en Nápoles y Hungría. ¿Conseguirá convertir a un pariente en emperador del Sacro Imperio Romano Germánico y continuar el avance de Francia hacia el este?"

 # Alfonso III el Liberal, rey de Aragón
 bookmark_aragon1285: "Alfonso III"
 bookmark_aragon1285_subheading: "Rey de Aragón"
 bookmark_aragon1285_desc: "Alfonso III, llamado el Liberal o el Franco, es rey de Aragón, rey de Valencia, conde de Rosellón, conde de Cerdaña y conde de Barcelona (como Alfonso II). Poco después de asumir el trono emprende una campaña para reincorporar las islas Baleares al reino de Aragón, perdidas por la división del reino que dispuso su abuelo, Jaime I. Su principal desafío será la creciente lucha constitucional con los nobles aragoneses, que podría desembocar en los artículos de la Unión de Aragón, la llamada «Carta Magna de Aragón», que devolvería varios poderes reales clave a manos de los nobles menores. ¿Podrá mantener la autoridad real ante una nobleza que cada vez ve menos motivos para respetar el trono?"

 # Sancho IV el Bravo, rey de Castilla
 bookmark_castille1285: "Sancho IV"
 bookmark_castille1285_subheading: "Rey de Castilla"
 bookmark_castille1285_desc: "Sancho IV, llamado el Bravo, es rey de Castilla, León y Galicia desde hace poco. Su reinado se abre en un momento de alianzas y rivalidades por Sicilia, Aragón y Navarra, y Castilla se cuenta entre los protectores del Reino de Trinacria. ¿Podrá consolidar su reinado entre los conflictos que sacuden la península ibérica y el Mediterráneo?"

 # Andrónico II Paleólogo, basileo del Imperio romano
 bookmark_ere1285: "Andrónico II"
 bookmark_ere1285_subheading: "Basileo del Imperio romano"
 bookmark_ere1285_desc: "Andrónico II Paleólogo reina como emperador en un momento en el que el Imperio romano comienza a mostrar signos de declive. Los turcos amenazan con conquistar la mayor parte de los territorios de Anatolia occidental y la frontera oriental ha quedado desatendida. ¿Conseguirá frenar el avance turco y devolver fuerza al Imperio?"

 # Eduardo I Piernas Largas, rey de Inglaterra
 bookmark_england1285: "Eduardo I"
 bookmark_england1285_subheading: "Rey de Inglaterra"
 bookmark_england1285_desc: "Eduardo I, también conocido como Eduardo Piernas Largas, es rey de Inglaterra. Ha pasado gran parte de su reinado reformando la administración real y el derecho común. A través de una amplia investigación legal ha estudiado la tenencia de varias libertades feudales, mientras la ley se ha reformado mediante una serie de estatutos que regulan el derecho penal y de propiedad. Sin embargo, su atención se ha dirigido cada vez más a los asuntos militares: respondió a una segunda rebelión galesa con una guerra de conquista a gran escala, sometió Gales al dominio inglés, construyó una serie de castillos y ciudades en el campo y los pobló con ingleses. Ahora su mirada se dirige hacia el Reino de Escocia, donde podría reclamar la soberanía feudal. ¿Conseguirá imponerse también a los escoceses?"

 # Ghiyas ud-Din Balban, sultán de Delhi
 bookmark_rajastan1285: "Ghiyas"
 bookmark_rajastan1285_subheading: "Sultán de Delhi"
 bookmark_rajastan1285_desc: "Ghiyas ud-Din Balban es el noveno sultán de la dinastía mameluca de Delhi. Realizó varias conquistas, algunas de ellas como visir, derrotó a los mewat que acosaban Delhi y reconquistó Bengala, todo ello mientras se enfrentaba con éxito a la amenaza mongola, una lucha que acaba de costarle la vida a su hijo y heredero. Sus reformas de la administración civil y militar han dado estabilidad y prosperidad a su gobierno y lo sitúan entre los sultanes más poderosos de Delhi, junto a Iltutmish. ¿Quién heredará un sultanato fortalecido pero sin un sucesor evidente?"

 # Kublai Kan, emperador de la dinastía Yuan
 bookmark_yuan1285: "Kublai Kan"
 bookmark_yuan1285_subheading: "Emperador de la dinastía Yuan"
 bookmark_yuan1285_desc: "Kublai, también conocido como el emperador Shizu de Yuan, es el quinto jagán del Imperio mongol. Fundó en China la dinastía Yuan, una dinastía de conquista, y gobierna como su primer emperador. Es el cuarto hijo de Tolui (su segundo hijo con Sorghaghtani Beki) y nieto de Gengis Kan. Sucedió a su hermano mayor, Möngke, como gran kan, pero tuvo que derrotar a su hermano menor, Ariq Böke, en la guerra civil toluida, un episodio que marcó el inicio de la desunión del imperio. Su poder real se limita a China y Mongolia, aunque como gran kan conserva influencia sobre el Ilkanato y, en un grado significativamente menor, sobre la Horda de Oro. Si se cuenta el Imperio mongol como un todo, su reino se extiende desde el océano Pacífico hasta el mar Negro, y desde Siberia hasta lo que hoy es Afganistán. ¿Conseguirá mantener unidos unos dominios tan vastos y dispares?"

 # Arghun, ilkan del Ilkanato
 bookmark_ilkhanate1285: "Arghun"
 bookmark_ilkhanate1285_subheading: "Ilkan del Ilkanato"
 bookmark_ilkhanate1285_desc: "Arghun Kan es el cuarto gobernante del Ilkanato del Imperio mongol. Hijo de Abaqa Kan, es, al igual que su padre, un devoto budista, aunque favorable a los cristianos. Es conocido por enviar varias embajadas a Europa en un intento de formar una alianza franco-mongola contra los musulmanes de Tierra Santa. Ha solicitado además una nueva esposa a su tío abuelo, Kublai Kan, y la joven Kököchin está llamada a viajar a través de Asia para reunirse con él. ¿Logrará convencer a los príncipes cristianos de Europa de unirse a su causa?"

 # Tuda Möngke, kan de la Horda de Oro
 bookmark_golden1285: "Tode Möngke"
 bookmark_golden1285_subheading: "Kan de la Horda de Oro"
 bookmark_golden1285_desc: "Tuda Möngke, también conocido como Tode Möngke, es kan de la Horda de Oro, división del Imperio mongol. Piadoso, se convirtió al islam, y debido a su profunda religiosidad no ha sido agresivo en la expansión de su territorio. Mantiene un buen contacto con el sultanato mameluco de Egipto contra el Ilkanato, enemigo infiel de ambos estados. Según Rashid ad-Din, está dispuesto a mantener buenas relaciones con Kublai Kan y envió a su hijo Nomoghan a la corte Yuan. Durante su gobierno ha aumentado mucho la influencia de Nogai Kan en la Horda de Oro, y el segundo ataque contra Hungría ha supuesto un desastre total para su ejército. ¿Podrá mantener su autoridad frente a la creciente influencia de Nogai?"

 # Duwa, kan del Kanato de Chagatai
 bookmark_chagatai1285: "Duwa"
 bookmark_chagatai1285_subheading: "Kan del Kanato de Chagatai"
 bookmark_chagatai1285_desc: "Duwa, también conocido como Du'a, es kan del Kanato de Chagatai y segundo hijo de Baraq. Mantiene la tradición política de su casa en Asia central, pero deberá decidir si acepta la supremacía nominal de la dinastía Yuan como gran kan. ¿Conseguirá llevar al Kanato de Chagatai a su máximo esplendor?"

 # Abu Yusuf Yaqub, sultán meriní
 bookmark_maghreb1285: "Yusuf"
 bookmark_maghreb1285_subheading: "Sultán meriní"
 bookmark_maghreb1285_desc: "Los meriníes llevaron décadas luchando contra los almohades por la supremacía de Marruecos. A la muerte de Abu Yahya, los meriníes quedaron instalados en Fez y controlaron el este y el norte de Marruecos, mientras que los almohades quedaron reducidos a los distritos del sur, alrededor de su capital, Marrakech. Aunque Abu Yahya había designado a su hijo como sucesor en Fez, Abu Yusuf Yaqub, entonces gobernador de Taza, consiguió con poca dificultad desplazar a su sobrino y hacerse reconocer como emir de los meriníes. Aunque suele designarse a Abd al-Haqq o a Abu Yahya como fundadores de la dinastía meriní, no cabe duda de que Abu Yusuf Yaqub debe ser considerado con razón el fundador del Estado meriní: acabó definitivamente con los almohades, unificó Marruecos, estableció su nueva y grandiosa capital en Fez el-Jedid y dio a los meriníes un punto de apoyo en España mediante cuatro expediciones militares a la península. ¿Conseguirá asegurar la herencia de su dinastía y mantener su posición en la península ibérica?"

 # Sakura, mansa de Malí
 bookmark_mali1285: "Sakura"
 bookmark_mali1285_subheading: "Mansa de Malí"
 bookmark_mali1285_desc: "Sakura, o Sakoura, es el sexto mansa del Imperio de Malí. Esclavo de nacimiento, fue liberado y se convirtió en general del ejército de Sundiata Keita, legendario fundador del Imperio. Tras una debilitadora lucha por la sucesión entre los hijos de Sundiata, Ouati y Khalifa Keita, y Abu Bakr, Sakura se ha hecho con el control del trono. Aspira a nuevas conquistas, entre ellas la de Gao, y a convertir Malí en la fuerza política, económica y militar dominante en el Sudán occidental. ¿Conseguirá convertir el imperio en la mayor potencia de la región?"

 # Ladislao IV el Cumano, rey de Hungría
 bookmark_hungary1285: "Ladislao IV"
 bookmark_hungary1285_subheading: "Rey de Hungría"
 bookmark_hungary1285_desc: "Ladislao IV, también conocido como Ladislao el Cumano, es rey de Hungría y Croacia. Un legado papal, Felipe, obispo de Fermo, llegó a Hungría para ayudarle a consolidar su autoridad, pero el prelado se sorprendió por la presencia de miles de cumanos paganos en el reino. Ladislao prometió que les obligaría a adoptar un estilo de vida cristiano, pero se negaron a obedecer las exigencias del legado. Ladislao decidió apoyar a los cumanos, por lo que Felipe de Fermo lo excomulgó. Los cumanos encarcelaron al legado y los partidarios de este capturaron a Ladislao, que aceptó persuadir a los cumanos para que se sometieran al legado, aunque muchos prefirieron abandonar Hungría. Derrotó a un ejército cumano que invadió el reino, y Hungría acaba de resistir una nueva invasión mongola, aunque Ladislao se ha vuelto tan impopular que muchos de sus súbditos lo acusan de haber incitado a los mongoles. ¿Podrá recuperar la confianza de sus súbditos y de la Iglesia?"

 # Osman I, bey del Beylicato otomano
 bookmark_ottoman1285: "Osman I"
 bookmark_ottoman1285_subheading: "Bey del Beylicato otomano"
 bookmark_ottoman1285_desc: "Osman I, u Osman Gazi, es el líder de los turcos otomanos y el fundador de la dinastía que lleva su nombre. Gobierna un pequeño principado turcomano, el beylicato u emirato otomano, de modestas dimensiones pero con una ambición que va mucho más allá. ¿Conseguirá convertir ese modesto principado en la base de un poder mayor?"

 #####1307
 1307: "Preludio"
 bm_1307: "El sueño de Osman"
 bm_1307_desc: "La desintegración del sultanato de Rum y el progresivo debilitamiento del Imperio bizantino han dejado Anatolia sumida en un vacío de poder que numerosos señores de la guerra aspiran a aprovechar. Entre ellos destaca Osman, un hombre piadoso y decidido que comienza a forjar su propio dominio. Según cuenta la tradición, un sueño que tuvo años atrás le reveló un destino extraordinario para él y sus descendientes, cuyo mayor anhelo podría ser algún día la conquista de Constantinopla. Sin embargo, el camino hacia esa empresa será largo y difícil: el Imperio bizantino ha resistido innumerables amenazas durante casi mil años y no entregará sus territorios sin luchar.\n\nEn Europa, la muerte prematura del monarca polaco sin un heredero aceptable ha permitido que Wenceslao II Přemysl, rey de Bohemia, sea coronado en su lugar. Heredero de las ambiciones de su padre, Otakar II, y de su profundo resentimiento hacia los Hohenstaufen, Wenceslao dispone ahora de una posición privilegiada para extender su influencia. Si logra consolidar su poder, el Sacro Imperio Romano Germánico podría encontrar grandes dificultades para reafirmar su autoridad sobre Bohemia, especialmente mientras su dominio sobre la península italiana continúa debilitándose. La oportunidad de actuar está al alcance de su mano."


 #####1311

 # Personajes

 # Andrónico II Paleólogo, basileo del Imperio bizantino
 bookmark_ere1311: "Andrónico II"
 bookmark_ere1311_subheading: "Basileo del Imperio bizantino"
 bookmark_ere1311_desc: "Andrónico II Paleólogo gobierna un Imperio bizantino cada vez más debilitado por las dificultades económicas, las disputas internas y el avance de sus enemigos. Durante su prolongado reinado, las posesiones imperiales de Anatolia han caído progresivamente en manos de los beilicatos turcos, mientras las fronteras occidentales también se ven amenazadas. A sus problemas exteriores se suman las tensiones dentro de su propia dinastía, especialmente con su nieto Andrónico, cuya creciente ambición amenaza con sumir al Imperio en una lucha por la sucesión. ¿Conseguirá el basileo preservar la autoridad de los Paleólogos y contener la desintegración de su legado?"

 # Osmán I, bey de los otomanos
 bookmark_osman1311: "Osmán I"
 bookmark_osman1311_subheading: "Bey del beilicato otomano"
 bookmark_osman1311_desc: "Osmán I, también conocido como Osmán Gazi, es el fundador de la dinastía otomana y señor de un pequeño beilicato turcomano en el noroeste de Anatolia. Aprovechando la fragmentación política de la región y el debilitamiento de los bizantinos, ha conseguido reunir bajo su autoridad a numerosos guerreros y extender sus dominios a costa de sus vecinos. Su dinastía lleva su nombre y sus ambiciones apuntan mucho más allá de las fronteras de su pequeño principado. ¿Lograrán Osmán y sus descendientes convertir este modesto dominio en una potencia capaz de desafiar a los grandes imperios?"

 # Alejo II de Megas Comneno, emperador de Trebisonda
 bookmark_trebizond1311: "Alejo II"
 bookmark_trebizond1311_subheading: "Emperador de Trebisonda"
 bookmark_trebizond1311_desc: "Alejo II Megas Comneno, hijo de Juan II y Eudoxia Paleóloga, gobierna el Imperio de Trebisonda con determinación y habilidad. Bajo su autoridad, el Estado póntico disfruta de una etapa de prosperidad y florecimiento cultural, mientras su corte se convierte en un importante centro de las artes y las ciencias. Entre sus protegidos se encuentran el astrónomo bizantino Gregorio Quioníades y el erudito Constantino Lukites. Sin embargo, su posición no está exenta de amenazas: los beilicatos turcos presionan sus fronteras y las repúblicas marítimas de Génova y Venecia compiten por su influencia comercial. ¿Conseguirá Alejo preservar la prosperidad de su imperio frente a sus ambiciosos vecinos?"

 # Roberto de Anjou, rey de Nápoles
 bookmark_naples1311: "Roberto"
 bookmark_naples1311_subheading: "Rey de Nápoles"
 bookmark_naples1311_desc: "Roberto de Anjou, conocido como Roberto el Sabio, es rey de Nápoles, conde de Provenza y Forcalquier, y titular de la corona de Jerusalén. Figura destacada de la política italiana, ejerce una considerable influencia sobre los asuntos de la península y aspira a consolidar la posición de su dinastía entre las grandes casas europeas. Bajo su gobierno, Nápoles experimenta un notable florecimiento económico y cultural, impulsado en buena medida por los comerciantes toscanos, cuyo capital contribuye a transformar la ciudad en un destacado centro de arte y arquitectura. Su reputación como pacificador de Italia contrasta con las rivalidades políticas que siguen dividiendo la península. ¿Podrá Roberto mantener su influencia y asegurar el prestigio de la casa de Anjou?"

 # Teodoro Svetoslav, zar de Bulgaria
 bookmark_bulgaria1311: "Teodoro Svetoslav"
 bookmark_bulgaria1311_subheading: "Zar de Bulgaria"
 bookmark_bulgaria1311_desc: "Teodoro Svetoslav gobierna Bulgaria tras décadas de inestabilidad e injerencias mongolas en los asuntos internos del Imperio. Prudente y capaz, ha conseguido restaurar buena parte de la autoridad real y devolver la estabilidad a sus dominios. La recuperación del sur de Besarabia y sus victorias frente a los bizantinos, a quienes ha arrebatado importantes territorios del norte de Tracia, han reforzado su posición. Desde entonces, mantiene una política de prudencia hacia sus vecinos, favoreciendo la expansión del comercio y la recuperación económica. Sin embargo, preservar la independencia y la prosperidad de Bulgaria exigirá mantener a raya tanto a sus rivales balcánicos como a las potencias de la estepa."

 # Toqta, kan de la Horda de Oro
 bookmark_goldenhorde1311: "Toqta"
 bookmark_goldenhorde1311_subheading: "Kan de la Horda de Oro"
 bookmark_goldenhorde1311_desc: "Toqta, hijo de Mengu-Timur y bisnieto de Batu, gobierna la Horda de Oro y trabaja para consolidar su autoridad sobre los vastos dominios de la estepa. Buena parte de sus esfuerzos se han dirigido a reforzar el control sobre los principados rusos y someter a los poderes que amenazan la supremacía mongola. Su gobierno también representa la continuidad de las antiguas tradiciones religiosas de la Horda, pues es el último de sus grandes kanes que profesa una fe distinta del islam. ¿Conseguirá mantener unidos sus dominios y preservar la autoridad de su dinastía?"

 # Esen Buqa I, kan del kanato de Chagatai
 bookmark_chagatai1311: "Esen Buqa I"
 bookmark_chagatai1311_subheading: "Kan del kanato de Chagatai"
 bookmark_chagatai1311_desc: "Esen Buqa I, hijo de Duwa, gobierna el kanato de Chagatai en medio de crecientes tensiones con sus poderosos vecinos. La dinastía Yuan y el Ilkanato representan una amenaza constante para la independencia de sus dominios, especialmente ante el temor de que ambas potencias establezcan una alianza contra los chagataidas. Los informes de los emisarios mongoles y las revelaciones de Abishqa, enviado de los Yuan ante el Ilkanato, han alimentado estas sospechas y hacen temer una intervención militar coordinada. Esen Buqa deberá recurrir a toda su habilidad diplomática y militar para proteger su kanato de las ambiciones de sus vecinos."

 # Öljeitü, ilkan del Ilkanato
 bookmark_ilkhanate1311: "Öljeitü"
 bookmark_ilkhanate1311_subheading: "Ilkan del Ilkanato"
 bookmark_ilkhanate1311_desc: "Öljeitü, octavo gobernante de la dinastía ilkaní, gobierna desde Tabriz un vasto territorio que se extiende por Persia y buena parte de Oriente Próximo. Durante su reinado, las relaciones comerciales y diplomáticas con las potencias extranjeras han adquirido una importancia creciente. Los mercaderes genoveses mantienen una presencia destacada en su capital, mientras los venecianos disfrutan de privilegios comerciales concedidos por el ilkan. Siguiendo la política diplomática de sus predecesores Arghun y Ghazan, Öljeitü mantiene contactos con las cortes europeas y busca posibles alianzas contra los mamelucos, pese a su propia conversión al islam. ¿Podrá aprovechar estas relaciones para ampliar la influencia del Ilkanato y asegurar su posición entre las potencias mongolas?"

 # Ala al-Din Jalyi, sultán de Delhi
 bookmark_india1311: "Ala al-Din Jalyi"
 bookmark_india1311_subheading: "Sultán de Delhi"
 bookmark_india1311_desc: "Ala al-Din Jalyi gobierna el sultanato de Delhi con una autoridad firme y una administración profundamente reformada. Sus medidas abarcan la recaudación fiscal, el control de los precios y la organización de la sociedad, con el propósito de reforzar el poder de la corona y sostener un ejército capaz de defender sus dominios. Sus campañas y victorias frente a las invasiones mongolas han consolidado su prestigio militar, pero su gobierno también se caracteriza por una política fiscal especialmente severa hacia la población hindú y sus élites. Aunque la administración y el ejército están dominados por musulmanes, personas de otras confesiones también ocupan puestos de responsabilidad y sirven en sus filas. Entre las ambiciones del sultán figuran mantener a raya a sus rivales, preservar la estabilidad del sultanato y extender su autoridad por el subcontinente indio."

 # Külüg Kan, emperador de la dinastía Yuan
 bookmark_yuan1311: "Külüg Kan"
 bookmark_yuan1311_subheading: "Emperador de la dinastía Yuan"
 bookmark_yuan1311_desc: "Külüg Kan, conocido también por su nombre de templo Wuzong, gobierna la dinastía Yuan y ostenta el título imperial de China. Como descendiente de la casa de Gengis Kan, también es reconocido nominalmente como gran kan del Imperio mongol, aunque la fragmentación de los dominios de sus antepasados limita considerablemente su autoridad sobre los demás kanatos. Su posición le permite ejercer una enorme influencia en Asia oriental, pero mantener la cohesión de la dinastía y preservar el prestigio de la casa imperial constituye un desafío constante."

 # Musa I, mansa del Imperio de Malí
 bookmark_musa1311: "Mansa Musa"
 bookmark_musa1311_subheading: "Mansa del Imperio de Malí"
 bookmark_musa1311_desc: "Musa I, conocido como Mansa Musa, gobierna uno de los imperios más poderosos de África occidental. Sus dominios comprenden extensos territorios de la región del antiguo Imperio de Ghana y abarcan tierras que hoy forman parte de Malí, Guinea, Senegal, Mauritania y Gambia. Bajo su autoridad, el comercio transahariano y la explotación de las minas de oro de Wangara proporcionan al Imperio de Malí una enorme riqueza. Entre sus numerosos títulos figuran los de emir de Melle, señor de las minas de Wangara y conquistador de Ghanata. Su poderío militar y económico le permite ejercer una considerable influencia sobre los pueblos y ciudades de la región. ¿Hasta dónde llegará la ambición de este poderoso mansa?"

 # Fernando IV el Emplazado, rey de Castilla y León
 bookmark_castille1311: "Fernando IV"
 bookmark_castille1311_subheading: "Rey de Castilla y León"
 bookmark_castille1311_desc: "Fernando IV de Castilla, conocido como el Emplazado, gobierna Castilla y León en medio de las constantes disputas entre la corona y la alta nobleza. Su autoridad se ve cuestionada por poderosos magnates, entre ellos su tío Juan de Castilla, señor de Valencia de Campos, y Juan Núñez II de Lara, cuyas ambiciones amenazan con debilitar el poder real. También debe vigilar a otros miembros de la nobleza, como Juan Manuel, príncipe de Villena, cuya posición y aspiraciones lo convierten en un actor relevante de la política castellana. Mientras tanto, Fernando continúa la lucha contra los musulmanes de la península: aunque la conquista de Algeciras ha fracasado, la toma de Gibraltar y Alcaudete ha reforzado su posición en la frontera. El rey también pretende reformar la administración de justicia y fortalecer las instituciones de la corona. ¿Conseguirá someter a la nobleza y proseguir la expansión de sus dominios?"

 # Enrique VII de Luxemburgo, emperador del Sacro Imperio Romano Germánico
 bookmark_hre1311: "Enrique VII"
 bookmark_hre1311_subheading: "Emperador del Sacro Imperio Romano Germánico"
 bookmark_hre1311_desc: "Enrique VII de Luxemburgo, primer emperador de su dinastía, ha devuelto parte de su antiguo vigor a la autoridad imperial tras décadas de inestabilidad. Su intervención en Italia ha reavivado las aspiraciones del Sacro Imperio Romano Germánico sobre la península, donde las facciones güelfas y gibelinas mantienen una encarnizada lucha por el poder. Sus ambiciones han despertado la admiración de figuras como Dante Alighieri, que ven en él la posibilidad de restaurar la grandeza imperial. Sin embargo, su autoridad sigue siendo frágil y las rivalidades entre los príncipes alemanes amenazan con frustrar sus proyectos. La sucesión imperial también constituye una preocupación para la casa de Luxemburgo: su hijo Juan de Bohemia deberá asegurar la continuidad de su legado en un escenario político incierto."

 # Eduardo II de Inglaterra
 bookmark_england1311: "Eduardo II"
 bookmark_england1311_subheading: "Rey de Inglaterra"
 bookmark_england1311_desc: "Eduardo II, también conocido como Eduardo de Caernarfon, ha heredado la corona inglesa de su padre, Eduardo I. A diferencia de su progenitor, cuya vida estuvo marcada por las campañas militares y la expansión de la autoridad real, Eduardo deberá enfrentarse a las dificultades de un reino dividido por las rivalidades entre la corona y sus magnates. Su matrimonio con Isabel, hija del rey Felipe IV de Francia, pretende fortalecer las relaciones entre ambas monarquías y resolver las tensiones que persisten entre ellas. Sin embargo, la corte inglesa está lejos de ser un lugar tranquilo, y las preferencias del monarca y sus relaciones personales pueden convertirse en motivo de conflicto. ¿Conseguirá Eduardo gobernar con firmeza y preservar la autoridad de la corona?"

 # Felipe IV el Hermoso, rey de Francia
 bookmark_france1311: "Felipe IV"
 bookmark_france1311_subheading: "Rey de Francia"
 bookmark_france1311_desc: "Felipe IV, conocido como Felipe el Hermoso, gobierna Francia con una determinación que le ha valido tanto admiradores como poderosos enemigos. Su carácter inflexible y su ambición de fortalecer la autoridad de la monarquía lo han llevado a rodearse de juristas y administradores capaces, entre ellos Guillermo de Nogaret y Enguerrand de Marigny, a quienes confía buena parte de las tareas de gobierno. Mediante reformas administrativas, medidas fiscales y conflictos con sus vasallos, Felipe busca transformar el reino en una monarquía más centralizada, sometida a una autoridad real indiscutible. Sus ambiciones también se extienden más allá de sus fronteras: pretende colocar a miembros de su familia en los tronos de Europa y aumentar la influencia francesa en Italia, Hungría y el Sacro Imperio Romano Germánico. Sin embargo, sus proyectos expansionistas y sus disputas con otros poderes amenazan con multiplicar sus enemigos. ¿Conseguirá convertir la casa de Francia en la dinastía más influyente de la cristiandad?"

 # Esteban Uroš II Milutin, rey de Serbia
 bookmark_serbia1311: "Esteban Milutin"
 bookmark_serbia1311_subheading: "Rey de Serbia"
 bookmark_serbia1311_desc: "Esteban Uroš II Milutin, miembro de la dinastía Nemanjić, gobierna Serbia y se cuenta entre los soberanos más poderosos de los Balcanes. Durante su reinado, el reino ha experimentado un notable crecimiento económico, impulsado especialmente por la explotación de sus recursos mineros. La fundación de Novo Brdo y el desarrollo de sus yacimientos de plata han convertido sus dominios en un importante centro de producción y comercio. Milutin también ha defendido la independencia religiosa de Serbia frente a las presiones del Imperio bizantino, que tras la Unión de Lyon trató de extender la influencia de la Iglesia romana en los Balcanes. Su poder y sus recursos le permiten intervenir en los asuntos de sus vecinos, pero las rivalidades dinásticas y las ambiciones territoriales siguen amenazando la estabilidad de la región. ¿Conseguirá Milutin asegurar el futuro de la dinastía Nemanjić y consolidar la posición de Serbia?"


 #####1337
 bm_1337: "La Guerra de los Cien Años"
 bm_1337_desc: "La muerte de Carlos IV de Francia sin descendencia masculina ha desencadenado una grave disputa sucesoria. Eduardo III de Inglaterra, nieto de Felipe IV por línea materna, reclama la corona francesa como pariente varón más próximo del difunto monarca. Sin embargo, la nobleza francesa rechaza la posibilidad de que el trono pase a un soberano extranjero a través de una mujer y respalda la candidatura de Felipe de Valois, primo de Carlos IV por línea paterna. Coronado como Felipe VI, el nuevo monarca deberá defender su legitimidad frente a las pretensiones inglesas. Las tensiones entre ambas coronas no dejan de aumentar y amenazan con desembocar en un conflicto de enormes proporciones. La guerra ha comenzado.\n\nEn Escandinavia, Magnus IV gobierna Suecia por elección y Noruega por derecho hereditario, reuniendo bajo una misma corona buena parte de la región. Sin embargo, mantener unidos ambos reinos no será tarea sencilla: las diferencias entre sus nobles y las dificultades para ejercer una autoridad efectiva sobre territorios tan extensos amenazan con debilitar la unión. ¿Será Magnus capaz de consolidar su poder y convertir la unión escandinava en algo más duradero? Algunos ya sueñan con la fundación de un gran Imperio del Norte bajo su autoridad.\n\nEn Persia, el antiguo Ilkanato se encuentra sumido en la fragmentación. Sus antiguos vasallos y numerosos señores locales compiten por hacerse con los territorios y recursos del desaparecido poder ilkaní. Mientras las dinastías rivales luchan por imponer su autoridad, en el seno del clan Barlas nace un niño llamado Timur, hijo de Taraghai. Nadie puede imaginar todavía el destino que le aguarda."

 # Personajes

 # Toghon Temür, emperador de la dinastía Yuan
 bookmark_yuan1337: "Toghon Temür"
 bookmark_yuan1337_subheading: "Emperador de la dinastía Yuan"
 bookmark_yuan1337_desc: "Toghon Temür, hijo de Khutughtu Kan Kusala, gobierna la dinastía Yuan y ostenta el trono imperial de China. Como descendiente de Gengis Kan, también reclama la dignidad de gran kan del Imperio mongol, aunque la fragmentación de los antiguos dominios imperiales limita considerablemente su autoridad sobre los demás kanatos. Su posición se ve amenazada por las tensiones internas de la corte y por las dificultades para mantener el control sobre los extensos territorios de China. A pesar de ello, la dinastía Yuan continúa siendo una de las mayores potencias de Asia oriental. Toghon Temür también muestra un profundo interés por el budismo tibetano y mantiene vínculos con los maestros de la escuela Karma Kagyu, entre ellos los karmapas. ¿Conseguirá preservar el poder de su dinastía frente a las crecientes dificultades del imperio?"

 # Öz Beg, kan de la Horda de Oro
 bookmark_golden1337: "Öz Beg"
 bookmark_golden1337_subheading: "Kan de la Horda de Oro"
 bookmark_golden1337_desc: "Öz Beg, también conocido como Uzbeg, es uno de los gobernantes más poderosos de la estepa y lleva la Horda de Oro a una etapa de gran prosperidad y expansión. Hijo de Toghrilcha y nieto de Mengu-Timur, ascendió al trono con el apoyo de importantes miembros de la corte, aunque tuvo que enfrentarse a la oposición de numerosos nobles mongoles. Su conversión al islam, favorecida por el influyente sufí Ibn Abd al-Hamid, ha marcado profundamente su gobierno. Öz Beg promueve la fe musulmana entre la élite mongola y refuerza su posición mediante una política religiosa más definida, sin renunciar por ello a la tolerancia hacia las comunidades cristianas y paganas que reconocen su autoridad y cumplen con sus obligaciones tributarias. Su gobierno ha contribuido a consolidar el islam como una de las principales fuerzas religiosas de la Horda. Sin embargo, las tensiones entre las distintas tradiciones de sus dominios siguen siendo un desafío para su autoridad. ¿Conseguirá mantener la unidad de la Horda y asegurar la continuidad de su dinastía?"

 # Changshi, kan del kanato de Chagatai
 bookmark_chagatai1337: "Changshi"
 bookmark_chagatai1337_subheading: "Kan del kanato de Chagatai"
 bookmark_chagatai1337_desc: "Changshi, descendiente de Duwa e hijo del príncipe Ebugen, gobierna el kanato de Chagatai en una época de profundas divisiones políticas y religiosas. Su autoridad se enfrenta a la oposición de los príncipes musulmanes, cuya influencia ha crecido considerablemente en las últimas generaciones. A diferencia de muchos de sus predecesores, Changshi mantiene una actitud distante hacia el islam y muestra una mayor tolerancia hacia los cristianos y otras comunidades religiosas. Sus esfuerzos por limitar el poder de las facciones musulmanas han provocado tensiones entre los miembros de la dinastía y amenazan con desestabilizar el kanato. ¿Podrá mantener su autoridad frente a las disputas internas y las ambiciones de sus propios parientes?"

 # Luis IV de Baviera, emperador del Sacro Imperio Romano Germánico
 bookmark_hre1337: "Luis IV"
 bookmark_hre1337_subheading: "Emperador del Sacro Imperio Romano Germánico"
 bookmark_hre1337_desc: "Luis IV de Baviera, miembro de la casa de Wittelsbach, gobierna el Sacro Imperio Romano Germánico tras una controvertida elección imperial. Su ascenso al trono estuvo disputado por su primo Federico de Habsburgo, quien también reclamaba la corona de los romanos. Aunque Luis logró imponerse militarmente y ambos rivales llegaron a reconciliarse, su autoridad continúa cuestionada por numerosos príncipes y, especialmente, por el papado. Su enfrentamiento con el papa Juan XXII ha culminado en su excomunión y en una abierta disputa sobre los límites del poder imperial y pontificio. Luis no está dispuesto a someterse a las pretensiones de Roma y ha llegado incluso a promover la deposición del pontífice y el nombramiento de un antipapa. ¿Conseguirá preservar la autoridad imperial frente a sus adversarios?"

 # Andrónico III Paleólogo, basileo del Imperio bizantino
 bookmark_ere1337: "Andrónico III"
 bookmark_ere1337_subheading: "Basileo del Imperio bizantino"
 bookmark_ere1337_desc: "Andrónico III Paleólogo, hijo de Miguel IX y Rita de Armenia, ocupa el trono imperial tras una prolongada lucha contra su abuelo, Andrónico II. Su ascenso al poder estuvo marcado por una guerra civil que dividió al Imperio y puso de manifiesto las profundas rivalidades existentes dentro de la dinastía Paleóloga. Una vez consolidada su autoridad, el nuevo basileo ha tratado de recuperar los territorios perdidos y restaurar el prestigio imperial. Sus campañas le han permitido recuperar importantes posesiones en el mar Egeo, Tesalia y Epiro, aunque la amenaza turca en Anatolia continúa siendo uno de los mayores peligros para el Imperio. También debe vigilar las relaciones con Bulgaria, cuya creciente influencia en los Balcanes amenaza los intereses bizantinos. ¿Podrá Andrónico restaurar la grandeza imperial y asegurar la estabilidad de su dinastía?"

 # Gediminas, gran duque de Lituania
 bookmark_lith1337: "Gediminas"
 bookmark_lith1337_subheading: "Gran duque de Lituania"
 bookmark_lith1337_desc: "Gediminas gobierna el gran ducado de Lituania y ha convertido sus dominios en una potencia cada vez más influyente en Europa oriental. Bajo su autoridad, el territorio lituano se ha expandido considerablemente hacia las antiguas tierras de la Rus, extendiendo su influencia desde las costas del Báltico hasta las regiones próximas al mar Negro. Su gobierno también se distingue por una política religiosa pragmática: aunque conserva las tradiciones paganas de sus antepasados, permite la presencia de comunidades cristianas y mantiene relaciones diplomáticas con los poderes de la cristiandad. Mientras los caballeros teutónicos continúan amenazando sus fronteras occidentales, Gediminas busca consolidar su autoridad y fortalecer su dinastía. ¿Conseguirá asegurar la expansión y el futuro de Lituania frente a sus numerosos adversarios?"

 # Casimiro III el Grande, rey de Polonia
 bookmark_poland1337: "Casimiro III"
 bookmark_poland1337_subheading: "Rey de Polonia"
 bookmark_poland1337_desc: "Casimiro III, conocido como el Grande, ha heredado un reino debilitado por décadas de conflictos y disputas territoriales. Desde su ascenso al trono, trabaja para fortalecer la autoridad de la corona, reorganizar el ejército y reformar la administración de justicia. Su política busca consolidar las instituciones reales y favorecer la prosperidad económica de Polonia mediante la fundación de ciudades y el desarrollo de sus dominios. También ha impulsado la protección de las comunidades judías y confirmado los privilegios que les permiten establecerse y prosperar en el reino. Sin embargo, las disputas territoriales con sus vecinos y la necesidad de asegurar la continuidad de la dinastía siguen siendo importantes desafíos. Casimiro carece de descendencia masculina legítima, por lo que el futuro de la corona podría depender de las alianzas que consiga establecer. ¿Logrará convertir Polonia en un reino fuerte y próspero?"

 # Orhan, bey del beilicato otomano
 bookmark_osman1337: "Orhan"
 bookmark_osman1337_subheading: "Bey del beilicato otomano"
 bookmark_osman1337_desc: "Orhan Gazi, hijo de Osmán, ha heredado el gobierno del pequeño beilicato otomano y continúa la expansión iniciada por su padre. Sus principales objetivos se encuentran en el noroeste de Anatolia, donde los territorios bizantinos y los dominios de otros señores turcos ofrecen oportunidades para extender su influencia. Sus victorias frente a los bizantinos, incluida la batalla de Pelecano contra el basileo Andrónico III, han reforzado su prestigio militar y abierto el camino hacia nuevas conquistas. También ha incorporado territorios pertenecientes a los beilicatos de Karasi y a otros poderes locales. La consolidación de su autoridad y la organización de un ejército permanente serán fundamentales para el futuro de su dinastía. ¿Conseguirá Orhan transformar el legado de su padre en una potencia capaz de desafiar a Bizancio?"

 # Muhammad bin Tughluq, sultán de Delhi
 bookmark_india1337: "Muhammad"

 # Abu al-Hasan Ali, sultán del sultanato benimerín
 bookmark_marin1337: "Abu al-Hasan"
 bookmark_marin1337_subheading: "Sultán del sultanato benimerín"
 bookmark_marin1337_desc: "Abu al-Hasan Ali ibn Uthman gobierna el sultanato benimerín desde Fez y aspira a extender su autoridad sobre todo el Magreb. Su política expansionista ya le ha permitido arrebatar Gibraltar a los castellanos, aunque sus ambiciones sobre el estrecho se han encontrado con la resistencia de sus adversarios. En el norte de África, sus dominios se extienden sobre amplias regiones de Marruecos y el Magreb central, mientras sus ejércitos presionan las fronteras de los territorios vecinos. La influencia de los benimerines alcanza así una dimensión comparable a la que ejercieron antaño los almohades. Sin embargo, las rivalidades entre las tribus y las dificultades para mantener unidos sus extensos dominios amenazan con frustrar sus proyectos. ¿Conseguirá Abu al-Hasan consolidar su poder y restaurar la unidad del Magreb?"

 # Jorge V el Brillante, rey de Georgia
 bookmark_georgia1337: "Jorge V"
 bookmark_georgia1337_subheading: "Rey de Georgia"
 bookmark_georgia1337_desc: "Jorge V, conocido como el Brillante, gobierna Georgia tras décadas de sometimiento e injerencias mongolas. Mediante una hábil política diplomática y militar, ha conseguido restaurar buena parte de la autoridad de la corona y recuperar la estabilidad del reino. Su gobierno busca fortalecer las instituciones reales, revitalizar la economía y proteger la tradición cristiana georgiana. Sin embargo, la influencia mongola todavía pesa sobre la región y las rivalidades entre los poderes vecinos amenazan con comprometer la independencia del reino. ¿Conseguirá Jorge consolidar la recuperación de Georgia y devolverle el lugar que antaño ocupó entre las potencias del Cáucaso?"

 # Alfonso XI el Justiciero, rey de Castilla y León
 bookmark_castille1337: "Alfonso XI"
 bookmark_castille1337_subheading: "Rey de Castilla y León"
 bookmark_castille1337_desc: "Alfonso XI, conocido como el Justiciero, ha conseguido consolidar su autoridad tras una infancia marcada por las disputas entre los regentes que gobernaron en su nombre. Hijo de Fernando IV y Constanza de Portugal, ha dedicado sus primeros años de gobierno a someter a la nobleza y reforzar el poder de la corona. Sin embargo, su mayor desafío se encuentra en la frontera meridional, donde el reino nazarí de Granada y el sultanato benimerín amenazan los dominios castellanos y el control del estrecho de Gibraltar. La defensa de sus territorios y la continuación de la Reconquista exigirán una combinación de determinación militar y habilidad diplomática. ¿Conseguirá Alfonso asegurar las fronteras del reino y consolidar la autoridad de la monarquía?"

 # Magnus IV de Suecia y VII de Noruega, rey de Suecia
 bookmark_sweden1337: "Magnus IV"
 bookmark_sweden1337_subheading: "Rey de Suecia"
 bookmark_sweden1337_desc: "Magnus IV gobierna Suecia desde su elección y Noruega por derecho hereditario, reuniendo bajo su autoridad dos de los principales reinos escandinavos. Su posición le permite ejercer una considerable influencia en el norte de Europa, aunque la unión de ambas coronas plantea importantes desafíos administrativos y políticos. La nobleza sueca y noruega conserva sus propios intereses y no siempre está dispuesta a aceptar las decisiones del monarca. Además, las ambiciones de Dinamarca y las intervenciones de potencias extranjeras como Mecklemburgo amenazan con debilitar su posición. Magnus deberá demostrar que es capaz de gobernar con firmeza y mantener la cohesión de sus dominios. ¿Podrá convertir su unión de coronas en una potencia duradera?"

 # Eduardo III, rey de Inglaterra
 bookmark_england1337: "Eduardo III"
 bookmark_england1337_subheading: "Rey de Inglaterra"
 bookmark_england1337_desc: "Eduardo III gobierna Inglaterra desde su ascenso al trono y aspira a restaurar la autoridad de la monarquía tras los turbulentos años del reinado de su padre. Su juventud no le impide albergar grandes ambiciones militares y políticas, y sus éxitos frente a Escocia han reforzado su confianza. Sin embargo, su principal desafío se encuentra al otro lado del canal de la Mancha. Como nieto de Felipe IV de Francia por línea materna, Eduardo reclama la corona francesa tras la muerte de Carlos IV, cuya sucesión ha recaído en Felipe VI de Valois. La nobleza francesa rechaza sus pretensiones, pero el monarca inglés no está dispuesto a renunciar a sus derechos dinásticos. Las tensiones entre ambas coronas amenazan con desembocar en una guerra que podría transformar el equilibrio de poder en Europa occidental. ¿Conseguirá Eduardo hacer valer su reclamación y llevar a Inglaterra a la victoria?"

 # Felipe VI de Valois, rey de Francia
 bookmark_france1337: "Felipe VI"
 bookmark_france1337_subheading: "Rey de Francia"
 bookmark_france1337_desc: "Felipe VI de Valois es el primer monarca de su dinastía en ocupar el trono francés. Su ascenso al poder se produjo tras la muerte de Carlos IV sin descendencia masculina, cuando la nobleza del reino rechazó las pretensiones de Eduardo III de Inglaterra, nieto del difunto rey por línea materna, y respaldó la candidatura de Felipe, primo de Carlos por línea paterna. Aunque su coronación ha asegurado inicialmente la continuidad de la monarquía francesa, Eduardo no ha renunciado a sus derechos y las relaciones entre ambos reinos se deterioran rápidamente. La rivalidad dinástica amenaza con convertirse en una guerra abierta, mientras Felipe debe demostrar que es capaz de defender su corona y preservar la autoridad de la casa de Valois. ¿Conseguirá mantener unido el reino frente a las ambiciones inglesas?"

 # Taraghai, señor del clan Barlas
 bookmark_timur1337: "Taraghai"
 bookmark_timur1337_subheading: "Señor del clan Barlas"
 bookmark_timur1337_desc: "Taraghai pertenece al clan Barlas, una poderosa comunidad de origen mongol asentada en las tierras de Asia Central y estrechamente vinculada a las antiguas estructuras del Imperio mongol. Aunque los dominios del clan se encuentran lejos de la influencia de los grandes kanatos, sus señores conservan una posición relevante entre los poderes locales de la región. Taraghai es padre de un joven llamado Timur, nacido en el seno de esta comunidad y destinado a crecer en un mundo marcado por las disputas entre los herederos del antiguo Imperio mongol. Por ahora, la familia Barlas debe desenvolverse entre las rivalidades de los señores de Transoxiana y las luchas por el control de sus territorios. ¿Qué futuro aguarda a esta familia en una región tan convulsa?"
 bookmark_india1337_subheading: "Sultán de Delhi"


 ##Additional Bookmarks

 #####1099

 bm_1099: "La Primera Cruzada"
 bm_1099_desc: "Concluida con la sangrienta caída de Jerusalén, la Primera Cruzada supuso una grave alteración de la estabilidad del Levante. En el norte, los principados de Antioquía y Edesa están en tensión no sólo entre sí, sino también con sus vecinos musulmanes y armenios. Al sur, el naciente Reino de Jerusalén se equilibra con el debilitado Califato Fatimí, el gran Emirato de Damasco y una miríada de atabegs menores que lo dividen de los Príncipes del norte. ¿Podrán los católicos resistir lo suficiente para unificarse, o habrá que convocar otra Cruzada para asegurar una Tierra Santa católica?"

 bm_1031: "Los Reyes Taifas"
 bm_1031_desc: "Tras dos décadas de continuas crisis sucesorias, el Califato de Córdoba ya no existe, ni siquiera como régimen figurado. Andalucía entra ahora en una nueva era de hombres fuertes y oportunistas locales independientes, que se conocerían como reyes de taifa ("facción"). El sur de Andalucía está dominado por varias tribus bereberes, incluida la dinastía bereberizada de los sayyid hammudíes, que habían sido invitados allí como auxiliares califales en las últimas décadas. La costa oriental de Andalucía ha sido tomada por antiguos esclavos saqaliba ("eslavos") de al-Mansur ibn Abi 'Amir (Almanzor), verdadero poder tras el trono responsable de degradar enormemente la autoridad califal décadas antes. En otros lugares, notables árabes locales, como el antiguo visir Jahwar en Córdoba, han sido elegidos para dirigir ayuntamientos, mientras que descendientes de las primeras tribus de colonos árabes y bereberes, como Banu Tujib y Banu Dhu 'l-Nun, siguen ejerciendo su dominio sobre territorios fronterizos.\n\n#bold -> Haz clic en "Juega como cualquier Gobernante" en la parte inferior izquierda para jugar a este marcador <- #!."

 bm_1043: "Época de los Normandos"
 bm_1043_desc: "Los normandos acaban de establecer un condado independiente en la Apulia bizantina, y el joven Guillermo el Bastardo acaba de alcanzar la mayoría de edad en Normandía y empieza a dejar su huella en el mundo. Se ha restablecido el dominio nativo en Inglaterra, con Eduardo el Confesor ocupando el trono mientras Magnus el Bueno de Noruega asciende al poder en Dinamarca tras la muerte de Harthacnut, hijo de Canuto el Grande. Mientras tanto, en Oriente, el mundo musulmán está al borde de la guerra cuando los selyúcidas se alzan con el poder en Jorasán tras la batalla de Dandanaqan, volviendo sus ojos hacia las ricas tierras centrales de Persia e Irak. La hegemonía de los gaznávidas y los buyíes pronto podría dar paso al ascenso de un imperio túrquico más joven y fuerte que transformaría la faz de Oriente Próximo y desencadenaría el comienzo de un choque de civilizaciones.\n\n#bold -> Haz clic en "Juega como cualquier Gobernante" en la parte inferior izquierda para jugar a este marcador <- #!."





 #Characters




 #Characters


 #####1144

 bm_1144: "La Anarquía"
 bm_1144_desc: "La Anarquía fue un periodo de la historia inglesa temprana en el que la dinastía del conquistador normando Guillermo se rompió y fue sustituida por la casa cadete de los Plantagenet. Comenzó cuando el segundo rey normando de Inglaterra, Enrique I, murió sin descendencia legítima. Aunque Enrique intentó colocar a su hija Matilde en el trono, los señores de Inglaterra no lo permitieron. En lugar de su hija, un descendiente masculino de Guillermo por línea femenina, Esteban de Blois, fue declarado rey. Sin embargo, el apoyo a Esteban no fue absoluto, y hubo muchos leales que se pusieron del lado de Matilde en la sucesión. La propia Matilde estaba casada con el primer hijo del rey Foulque de Jerusalén, Geoffrey de Anjou, que más tarde sería conocido como Geoffrey Plantagenet. Geoffrey ha conseguido conquistar Normandía en su nombre, y la crisis sucesoria entre el poderoso vasallo y el débil rey Esteban de Inglaterra parece inevitable."

 bookmark_england1144: "Esteban de Blois"
 bookmark_england1144_subheading: "Rey de Inglaterra"
 bookmark_england1144_desc: "Esteban, a menudo llamado Esteban de Blois, fue rey de Inglaterra desde el 22 de diciembre de 1135 hasta su muerte en 1154. Hijo menor del Conde de Blois, fue Conde de Boulogne jure uxoris desde 1125 hasta 1147 y Duque de Normandía desde 1135 hasta 1144. Su reinado estuvo marcado por la Anarquía, una guerra civil con su prima y rival, la emperatriz Matilde, cuyo hijo, Enrique II, sucedió a Esteban como el primero de los reyes angevinos de Inglaterra tras la firma del Tratado de Winchester, en el que Esteban reconoció a Enrique como su heredero a cambio de la paz, pasando por encima de Guillermo, el segundo hijo de Esteban. Esteban murió al año siguiente."

 bookmark_anjou1144: "Geoffrey el Guapo"
 bookmark_anjou1144_subheading: "Duke of Normandy"
 bookmark_anjou1144_desc: "Geoffrey V, llamado el Hermoso, el Hermoso o Plantagenet, fue conde de Anjou, Touraine y Maine por herencia desde 1129, y también duque de Normandía por conquista desde 1144. Su matrimonio con la emperatriz Matilde, hija del rey Enrique I de Inglaterra, dio lugar al reinado durante siglos de la dinastía Plantagenet en Inglaterra. El nombre "Plantagenet" se tomó del epíteto de Geoffrey. El dominio ancestral de Geoffrey, Anjou, dio lugar al nombre de Angevin, y a lo que se conoció como el Imperio Angevino en el siglo XII."


 #Characters


 #####1229

 bm_1229: "Azote de Dios"
 bm_1229_desc: "Vinieron de Oriente, despiadados y sin piedad: hombres extraños, vestidos con armaduras exóticas y hablando en lenguas guturales que nadie entendía. Los rumores que atravesaban la Ruta de la Seda y el Océano Índico contaban cómo Gengis Kan y sus invencibles hordas mongolas destrozaron los mayores imperios del mundo conocido, desde Catay hasta Persia. Aunque Gengis Khan ha muerto, los hijos y nietos de Gengis pretenden continuar sus conquistas. Tienen sus ojos puestos en Europa y el resto de Oriente Medio, y el mundo entero podría unirse bajo el estandarte de Gengis... si sus descendientes no acaban luchando entre ellos, claro. Tal vez el fin de los días haya llegado por fin, un castigo por los pecados de los malvados... o tal vez esta sea la mayor prueba de Dios para los fieles.\n\nLa Cuarta Cruzada ha dejado a Bizancio paralizado, y a sus anteriores estados vasallos no les va mucho mejor. Tres poderosos duques se disputan el control de Grecia, y sólo uno de ellos es griego. El odio entre los imperios latino y bizantino no ha disminuido, pero tampoco se ha avanzado hacia el descubrimiento del vencedor final en su lucha. La gloria y los títulos están ahí, para un hombre lo suficientemente fuerte como para aprovecharlos."

 bookmark_russia1229: "Miguel"
 bookmark_russia1229_subheading: "Prince of Chernigov"
 bookmark_russia1229_desc: "San Miguel de Chernigov fue gran príncipe de Kiev 1236-1240, 1240, 1241-1243. Las pruebas arqueológicas revelan que las ciudades de Chernihiv disfrutaron de un grado de prosperidad sin precedentes durante su periodo, lo que sugiere que la promoción del comercio era una prioridad para él. Los intereses comerciales, en parte, también le motivaron a hacerse con el control de Halych y Kiev porque eran canales por los que pasaban las mercancías del valle del Rin y de Hungría a Chernihiv. También negoció tratados comerciales y alianzas políticas con los polacos y los húngaros y alivió la carga fiscal de los novgorodianos y concedió a sus boyardos mayor libertad política frente al príncipe. Fue el último príncipe mayor autónomo de Kiev, donde fue depuesto no por un príncipe más poderoso, sino por los invencibles mongoles. En vísperas de la invasión mongola, era uno de los príncipes más poderosos de la Rus'. Mijaíl fue el primer príncipe de los Olgovichi (la dinastía de Chernigov) que se convirtió en mártir según el significado común de la palabra: sufrió la pena de muerte por persistir en su fe cristiana. Él y su boyardo Fedor (Teodoro) fueron torturados y decapitados por los tártaros."

 bookmark_norway1229: "Haakon IV"
 bookmark_norway1229_subheading: "King of Norway"
 bookmark_norway1229_desc: "Haakon IV Haakonsson fue rey de Noruega de 1217 a 1263. Haakon nació en la agitada época de la guerra civil en Noruega, pero su reinado consiguió finalmente poner fin a los conflictos internos. Bajo el gobierno de Haakon, se considera que la Noruega medieval alcanzó su cenit o edad de oro. Su reputación y su formidable flota naval le permitieron mantener la amistad tanto con el papa como con el emperador del Sacro Imperio Romano Germánico, a pesar de sus conflictos. El Papa le ofreció en distintos momentos la corona imperial, una delegación de reyes irlandeses le ofreció la alta realeza irlandesa y el rey francés el mando de la flota cruzada francesa. Amplió la influencia de la cultura europea en Noruega importando y traduciendo la literatura europea contemporánea al nórdico antiguo, y construyendo edificios monumentales de piedra de estilo europeo. Junto con esto, empleó una política exterior activa y agresiva, y al final de su gobierno añadió Islandia y la comunidad nórdica de Groenlandia a su reino, dejando a Noruega en su apogeo territorial. Aunque por el momento consiguió asegurar el control noruego de las islas situadas frente a las costas del norte y el oeste de Gran Bretaña, cayó enfermo y murió cuando pasaba el invierno en las Orcadas tras algunos enfrentamientos militares con el reino escocés en expansión."

 bookmark_denmark1229: "Valdemar II"
 bookmark_denmark1229_subheading: "King of Denmark"
 bookmark_denmark1229_desc: "Valdemar II el Conquistador era el rey de Dinamarca. En 1223, el rey Valdemar y su hijo mayor, el príncipe Valdemar, fueron secuestrados por el conde Enrique I de Schwerin mientras cazaban. El conde Enrique exigió que Dinamarca entregara las tierras conquistadas en Holstein 20 años atrás y se convirtiera en vasallo del emperador del Sacro Imperio Romano Germánico. Los enviados daneses rechazaron estas condiciones y Dinamarca declaró la guerra. Mientras Valdemar estaba en prisión, la mayoría de los territorios alemanes se separaron de Dinamarca y la guerra terminó con la derrota danesa. Para asegurar su liberación, Valdemar tuvo que reconocer los territorios escindidos en Alemania, pagar 44.000 marcos de plata y firmar una promesa de no buscar venganza contra el conde Enrique. Valdemar apeló inmediatamente al Papa Honorio III para que declarara nulo su juramento. Honorio III eximió a Valdemar de su juramento forzoso, e inmediatamente se puso a intentar restaurar los territorios alemanes. Una serie de derrotas danesas cimentaron la pérdida de los territorios alemanes del norte de Dinamarca. A partir de ese momento, el rey Valdemar II centró sus esfuerzos en los asuntos internos. Uno de los cambios que instituyó fue el sistema feudal. Esto aumentó el poder de las familias nobles y dio lugar a los nobles menores, que controlaban la mayor parte de Dinamarca. Los campesinos libres perdieron los derechos y privilegios tradicionales de los que habían disfrutado desde la época vikinga."

 bookmark_wales1229: "Llywelyn el Grande"
 bookmark_wales1229_subheading: "Prince of Wales"
 bookmark_wales1229_desc: "Llywelyn el Grande fue un rey de Gwynedd, en el norte de Gales, y acabó gobernando todo el país. Mediante una combinación de guerra y diplomacia, dominó Gales durante 45 años. En 1200 era el único gobernante de Gwynedd y ese año firmó un tratado con el rey Juan de Inglaterra. Las relaciones de Llywelyn con Juan siguieron siendo buenas durante los diez años siguientes. Se casó con la hija natural de Juan, Juana, en 1205, y cuando Juan arrestó a Gwenwynwyn ap Owain de Powys en 1208, Llywelyn aprovechó la oportunidad para anexionar el sur de Powys. En 1210, las relaciones se deterioraron y Juan invadió Gwynedd en 1211. Llywelyn se vio obligado a buscar condiciones y a renunciar a todas las tierras al este del río Conwy, pero pudo recuperarlas al año siguiente en alianza con los demás príncipes galeses. Se alió con los barones que obligaron a Juan a firmar la Carta Magna en 1215. En 1216, era el poder dominante en Gales, y ese año celebró un consejo en Aberdyfi para repartir las tierras entre los demás príncipes. Tras la muerte del rey Juan, Llywelyn concluyó el Tratado de Worcester con su sucesor, Enrique III, en 1218. Durante los quince años siguientes, Llywelyn se vio envuelto con frecuencia en luchas con los señores de las Marcas y a veces con el rey, pero también estableció alianzas con varias potencias importantes de las Marcas. La Paz de Middle en 1234 marcó el final de la carrera militar de Llywelyn, ya que la tregua acordada de dos años se prolongó año tras año durante el resto de su reinado. Mantuvo su posición en Gales hasta su muerte en 1240 y le sucedió su hijo Dafydd ap Llywelyn."

 bookmark_mali1229: "Sundiata Keita"
 bookmark_mali1229_subheading: "Mansa of Mali"
 bookmark_mali1229_desc: "Sundiata Keita fue un príncipe y fundador del Imperio de Malí. El gobernante maliense Mansa Musa, que peregrinó a La Meca, era su sobrino nieto. Fue durante su reinado cuando Malí empezó a convertirse en una potencia económica, tendencia que continuaron sus sucesores y que mejoraron gracias al trabajo de base realizado por Sundiata, que controlaba las rutas comerciales y los yacimientos de oro de la región. La constitución social y política de Malí comenzó a codificarse durante el reinado de Mansa Sundiata Keita. Conocidas como el Gbara y el Kouroukan Fouga, aunque no estaban escritas e incluso estaban sujetas a alteraciones en su redacción y cuando se registraron por primera vez en forma escrita, formaban parte de las normas sociales y políticas de Malí. Muchas de estas leyes se han incorporado a la constitución del Malí actual. Sundiata Keita no sólo fue un conquistador que supo gobernar un gran imperio con diferentes tribus y lenguas, sino que también desarrolló los mecanismos de la agricultura maliense y se dice que introdujo el algodón y el tejido en Malí. Hacia el final de su reinado, la "seguridad absoluta" habría "prevalecido en todo su dominio"."

 bookmark_almohad1229: "Abd al-Wahid II"
 bookmark_almohad1229_subheading: "Califato del Almohad Califato"
 bookmark_almohad1229_desc: "Abu Muhammad ar-Rashid Abd al-Wahid fue un califa rival almohade que reinó desde 1232 hasta su muerte. Abd al-Wahid sucedió a su padre Idris I, que había muerto mientras marchaba contra Yahya, que controlaba la capital, Marrakech. Su reinado marcó el inicio de la fragmentación final del imperio almohade. No pudo expulsar a Yahya de Marrakech, mientras que el emir de Tlemcen se independizó a partir de 1236 (fundando la dinastía zayyaní), siguiendo el ejemplo del gobernante hafsí Abu Zakariya Yahya en Túnez."

 bookmark_delhi1229: "Iltutmish"
 bookmark_delhi1229_subheading: "Sultan of Delhi"
 bookmark_delhi1229_desc: "Shams ud-Din Iltutmish fue el tercero de los reyes mamelucos que gobernaron los antiguos territorios ghuríes del norte de la India. Fue el primer soberano musulmán que gobernó desde Delhi, por lo que se le considera el fundador efectivo del sultanato de Delhi, que gobernaría el norte de la India durante 3 siglos. Iltutmish organizó la administración del sultanato, sentando las bases de su dominio sobre el norte de la India hasta la invasión mogol. Introdujo el tanka de plata y el jital de cobre, las dos monedas básicas del periodo del sultanato, con un peso estándar de 175 granos. Estableció el sistema Iqtadari: división del imperio en Iqtas, que se asignaban a los nobles y oficiales en lugar de un salario. Erigió muchos edificios, como mezquitas, monasterios, dargahs (santuarios o tumbas de personas influyentes) y un embalse para los peregrinos."

 bookmark_golden1229: "Batu Khan"
 bookmark_golden1229_subheading: "Kan de la Horda de Oro"
 bookmark_golden1229_desc: "Batu Khan fue un gobernante mongol y fundador de la Horda de Oro, una división del Imperio Mongol. Batu era hijo de Jochi y nieto de Gengis Kan. Su ulus fue el estado principal de la Horda de Oro, que gobernó la Rus, la Bulgaria del Volga, Cumania y el Cáucaso durante unos 250 años, tras destruir también los ejércitos de Polonia y Hungría. Tras la muerte de los hijos de Gengis Kan, se convirtió en el príncipe más respetado, llamado agha ("hermano mayor"), del Imperio Mongol. La conquista de la Rus de Kiev se produjo de su mano. A finales de 1241, Batu y Subutai estaban ultimando los planes para invadir Austria, Italia y Alemania cuando llegó la noticia de la muerte de Ögedei Khan, que falleció en diciembre de 1241. Batu quería continuar la guerra, pero Subutai le recordó la ley de Yassa (Их Засаг). Los mongoles se retiraron a finales de la primavera de 1242, ya que los príncipes de la sangre, y Subutai, fueron llamados a Karakorum, donde se celebró el kurultai. Batu era un Gran Kan en potencia, pero al no conseguir el título se dedicó a consolidar sus conquistas en Asia y los Urales."

 bookmark_ilkhanate1226: "Hülegü Khan"
 bookmark_ilkhanate1226_subheading: "Kan del Ilkanato"
 bookmark_ilkhanate1226_desc: "Hülegü Khan fue un gobernante mongol que conquistó gran parte de Asia occidental. Hijo de Tolui y de la princesa queraíta Sorghaghtani Beki, era nieto de Gengis Khan y hermano de Ariq Böke, Möngke Khan y Kublai Khan. El ejército de Hulagu expandió en gran medida la parte suroccidental del Imperio mongol, fundando el Iljanato de Persia, precursor de la eventual dinastía safávida, y luego del moderno estado de Irán. Bajo el liderazgo de Hulagu, el asedio de Bagdad (1258) destruyó la posición de Bagdad en la Edad de Oro islámica y debilitó a Damasco, lo que provocó un desplazamiento de la influencia islámica hacia el sultanato mameluco de El Cairo y puso fin a la dinastía abasí."

 bookmark_mongol1229: "Ögedei Khan"
 bookmark_mongol1229_subheading: "Gran Khan del Imperio Mongol"
 bookmark_mongol1229_desc: "Ögedei fue el tercer hijo de Gengis Kan y el segundo khagan-emperador del Imperio Mongol, sucediendo a su padre. Continuó la expansión del imperio que había iniciado su padre, y fue una figura mundial cuando el Imperio Mongol alcanzó su máxima extensión hacia el oeste y el sur durante las invasiones mongolas de Europa y Asia oriental. Como todos los hijos principales de Gengis, participó ampliamente en las conquistas de China, Irán y Asia Central."

 bookmark_persia1229: "Jalal al-Din"
 bookmark_persia1229_subheading: "Sah del Imperio corasmio"
 bookmark_persia1229_desc: "Jalal al-Din Mangburni fue el último Khwarazmshah de la línea Anushtegin. Al año siguiente, la capital jwarazmiana de Gurganj fue capturada y devastada por los mongoles. Mientras tanto, en la ciudad de Ghazni, Jalal al-Din reunió un importante ejército formado por jwarazmianos, turcos y ghuríes, y posteriormente derrotó a las fuerzas perseguidoras del líder mongol Gengis Khan en la batalla de Ustuva, la batalla de Kendakhar, la batalla de Waliyan, la batalla de Djerdin y la batalla de Parwan. Sin embargo, Jalal al-Din se vio obligado a retirarse al noroeste de la India por las fuerzas mongolas.Alal ad-Din pasó el resto de sus días luchando contra los mongoles, los pretendientes al trono y los selyúcidas de Rûm. Jalal ad-Din obtuvo una breve victoria sobre los selyúcidas y arrebató a los ayubíes la ciudad de Akhlat, en Turquía. En 1227, luchó contra los mongoles en la aproximación a Isfahan y, aunque no derrotó a los invasores tras sus grandes pérdidas, no pudieron aprovechar su victoria y se retiraron después a través del río Oxus. En 1231, los mongoles habían conquistado por completo lo que quedaba de Khwarazm y Jalal al-Din fue asesinado por un kurdo."

 bookmark_egypt1229: "Al-Kamil"
 bookmark_egypt1229_subheading: "Sultan of Egypt"
 bookmark_egypt1229_desc: "Al-Kamil fue un gobernante musulmán y el cuarto sultán ayubí de Egipto. Durante su mandato como sultán, los ayubíes derrotaron a la Quinta Cruzada. Los cruzados francos lo conocían como Meledin, nombre con el que todavía se le conoce en algunas fuentes occidentales antiguas. Como resultado de la Sexta Cruzada, cedió Jerusalén a los cristianos y se sabe que se reunió con San Francisco.\n\nEn 1218, a la muerte de Al-Adil, los dominios ayubíes se dividieron en tres partes: Al-Kamil gobernaba Egipto, su hermano Al-Muazzam Isa gobernaba en Palestina y Transjordania, y un tercer hermano, Al-Ashraf Musa, en Siria y la Jazira. Los otros dos reconocieron nominalmente la supremacía de Al-Kamil como sultán. En este punto, y de forma inusual para una sucesión ayubí, no hubo disensiones ni rivalidades evidentes entre los hermanos, en parte porque justo antes de la muerte de Al-Adil, Egipto había sido atacado por las fuerzas de la Quinta Cruzada. Al-Kamil ejemplificó las leyes islámicas de la guerra. Por ejemplo, después de que Al-Kamil derrotara a los francos durante las Cruzadas, Oliverus Scholasticus elogió y comentó cómo Al-Kamil abastecía de alimentos al ejército franco derrotado."

 bookmark_jerusalem1229: "Alicia"
 bookmark_jerusalem1229_subheading: "Regente de Jerusalén"
 bookmark_jerusalem1229_desc: "Alicia de Champaña fue reina consorte de Chipre de 1210 a 1218, regente de Chipre de 1218 a 1223 y de Jerusalén de 1243 a 1246. Era la hija mayor de la reina Isabel I de Jerusalén y del conde Enrique II de Champaña. En 1210, Alicia se casó con su hermanastro, el rey Hugo I de Chipre, recibiendo como dote el condado de Jaffa. Tras la muerte de su marido en 1218, asumió la regencia del hijo de ambos, el rey Enrique I. Con el tiempo, empezó a buscar contactos en los condados de su padre en Francia para reforzar su reclamación de Champagne y Brie frente a su primo Teobaldo IV. Sin embargo, los reyes de Francia nunca reconocieron su reclamación. Cuando su hijo alcanzó la mayoría de edad en 1232, Alicia abdicó de su regencia y partió hacia Francia para reclamar Champaña y Brie. Posteriormente, renunció a sus pretensiones y regresó a Tierra Santa."

 bookmark_latin1229: "Juan"
 bookmark_latin1229_subheading: "Emperador latino de Constantinopla"
 bookmark_latin1229_desc: "Juan de Brienne, también conocido como Juan I, fue rey de Jerusalén de 1210 a 1225 y emperador latino de Constantinopla de 1229 a 1237. Era el hijo menor de Erard II de Brienne, un rico noble de Champaña. Juan, destinado en un principio a la carrera eclesiástica, se convirtió en caballero y poseía pequeñas propiedades en Champaña hacia 1200. Tras la muerte de su hermano, Walter III, gobernó el condado de Brienne en nombre de su sobrino menor Walter IV (que vivía en el sur de Italia).\n\nFue elegido emperador en 1229 como co-gobernante principal (con Balduino II) del Imperio Latino, y fue coronado en Constantinopla en 1231. Juan III Vatatzes, emperador de Nicea, e Iván Asen II de Bulgaria ocuparon los últimos territorios latinos en Tracia y Asia Menor, asediando Constantinopla a principios de 1235. Juan dirigió la defensa de su capital durante los meses que duró el asedio, y los sitiadores sólo se retiraron después de que Geoffrey II de Acaya y las flotas unidas de las ciudades italianas derrotaran a su flota en 1236. Al año siguiente, Juan murió como fraile franciscano."

 bookmark_treb1229: "Juan I"
 bookmark_treb1229_subheading: "Emperador de Trebizond"
 bookmark_treb1229_desc: "Juan I Axouchos fue emperador de Trebisonda de 1235 a 1238. Poco se sabe del reinado de Juan, salvo que éste murió mientras jugaba al tzykanion, una variante del polo de moda entre la nobleza bizantina, al caer de su caballo y morir pisoteado. Su heredero fue un tal Ioannikios, que fue confinado en un monasterio y el segundo hermano de Juan, Manuel I, ascendió al trono."

 bookmark_nikaea1229: "Juan III"
 bookmark_nikaea1229_subheading: "Emperador de Nicaea"
 bookmark_nikaea1229_desc: "Juan III Doukas Vatatzes fue un gobernante de éxito que sentó las bases para la recuperación de Constantinopla por parte de Nicea. Consiguió mantener relaciones generalmente pacíficas con sus vecinos más poderosos, Bulgaria y el sultanato de Rum, y su red de relaciones diplomáticas se extendió al Sacro Imperio Romano y al Papado, mientras que sus fuerzas armadas incluían mercenarios francos. Juan III llevó a cabo la expansión nicaica en Europa, donde al final de su reinado había anexionado a su antiguo rival Tesalónica y se había expandido a expensas de Bulgaria y Epiro. También amplió el control de Nicea sobre gran parte del Egeo y se anexionó la importante isla de Rodas, al tiempo que apoyaba las iniciativas para liberar a Creta de la ocupación veneciana con vistas a su reunificación con el imperio bizantino de Nicea. Además, a Juan III se le atribuye el mérito de haber desarrollado cuidadosamente la prosperidad y la economía internas de su reino, fomentando la justicia y la caridad. A pesar de su epilepsia, Juan III ejerció un liderazgo activo tanto en la paz como en la guerra, se reivindicó como el verdadero heredero del Imperio Romano y fue conocido por sus abundantes fiestas de la cosecha. Medio siglo después de su muerte, Juan III fue canonizado como santo, con el nombre de Juan el Misericordioso."

 bookmark_england1229: "Enrique III"
 bookmark_england1229_subheading: "Rey de Inglaterra"
 bookmark_england1229_desc: "Enrique III, también conocido como Enrique de Winchester, fue rey de Inglaterra, señor de Irlanda y duque de Aquitania desde 1216 hasta su muerte. Enrique prometió respetar la Gran Carta de 1225, que limitaba el poder real y protegía los derechos de los principales barones. Su primer gobierno estuvo dominado primero por Hubert de Burgh y luego por Peter des Roches, que restableció la autoridad real tras la guerra. En 1230, el rey intentó reconquistar las provincias de Francia que habían pertenecido a su padre, pero la invasión fue una debacle. En 1232 estalló una revuelta dirigida por el hijo de Guillermo Mariscal, Ricardo Mariscal, que terminó con un acuerdo de paz negociado por la Iglesia."

 bookmark_france1229: "Luis IX"
 bookmark_france1229_subheading: "Rey de Francia"
 bookmark_france1229_desc: "Luis IX, conocido comúnmente como San Luis o Luis el Santo, es el único rey de Francia canonizado por la Iglesia Católica. Luis fue coronado a la edad de 12 años, tras la muerte de su padre Luis VIII; su madre, Blanca de Castilla, gobernó el reino como regente hasta que alcanzó la madurez. De adulto, Luis IX se enfrentó a conflictos recurrentes con algunos de los nobles más poderosos de su reino, como Hugo X de Lusignan y Pedro de Dreux. Simultáneamente, Enrique III de Inglaterra intentó restaurar las posesiones continentales angevinas, pero fue rápidamente derrotado en la batalla de Taillebourg. Su reinado es recordado como una edad de oro medieval en la que el Reino de Francia alcanzó su máximo nivel económico y político. Sus colegas europeos lo estimaban mucho, no sólo por su preeminencia militar o por el hecho de que gobernaba el reino más rico, sino también por su reputación de imparcialidad e integridad moral: a menudo se le pedía que arbitrara sus disputas."

 bookmark_hre1229: "Federico II"
 bookmark_hre1229_subheading: "Santo Emperador Romano"
 bookmark_hre1229_desc: "Federico II fue rey de Sicilia desde 1198, rey de Alemania desde 1212, rey de Italia y emperador del Sacro Imperio Romano Germánico desde 1220. Sus ambiciones políticas y culturales eran enormes, ya que gobernaba una vasta zona, empezando por Sicilia y extendiéndose por Italia hasta el norte de Alemania. Sin embargo, el papado se convirtió en su enemigo y acabó imponiéndose. Viéndose a sí mismo como un sucesor directo de los emperadores romanos de la antigüedad, fue emperador de los romanos desde su coronación papal en 1220 hasta su muerte; también fue reclamante del título de rey de los romanos desde 1212 y titular sin oposición de esa monarquía desde 1215. Como tal, fue rey de Alemania, de Italia y de Borgoña. Frecuentemente en guerra con el papado, que estaba acorralado entre las tierras de Federico en el norte de Italia y su reino de Sicilia en el sur, fue excomulgado tres veces y a menudo vilipendiado en las crónicas pro-papales de la época y posteriores. El Papa Gregorio IX llegó a llamarlo Anticristo. Tras su muerte, su linaje no sobrevivió y la Casa de Hohenstaufen llegó a su fin. Además, el Sacro Imperio Romano Germánico entró en un largo periodo de decadencia durante el Gran Interregno del que no se recuperó completamente hasta el reinado de Carlos V, 250 años después."

 bookmark_castille1229: "Fernando III"
 bookmark_castille1229_subheading: "Rey de Castilla y León"
 bookmark_castille1229_desc: "Fernando III, llamado el Santo, fue rey de Castilla desde 1217 y de León desde 1230, así como de Galicia desde 1231. Era hijo de Alfonso IX de León y de Berenguela de Castilla. A través de su segundo matrimonio fue también conde de Aumale. Fernando III fue uno de los reyes más exitosos de Castilla, asegurando no sólo la unión permanente de las coronas de Castilla y León, sino también dirigiendo la campaña de Reconquista más expansiva hasta la fecha.\NPor medio de esfuerzos militares y diplomáticos, Fernando amplió enormemente los dominios de Castilla anexionando el valle del río Guadalquivir en el sur de la Península Ibérica, estableciendo los límites del estado castellano para los dos siglos siguientes. Los nuevos territorios incluían importantes ciudades como Baeza, Úbeda, Jaén, Córdoba o Sevilla, que fueron objeto de Repartimiento, dotadas de un nuevo fuero general y repobladas en los años siguientes."

 bookmark_epirus1229: "Miguel II"
 bookmark_epirus1229_subheading: "Despot of Epirus"
 bookmark_epirus1229_desc: "Miguel II Komnenos Doukas fue desde 1230 hasta su muerte en 1266/68 el gobernante del Despotado de Epiro. Tras el asesinato de su padre en 1215 y la sucesión de su tío Teodoro Komnenos Doukas, se exilió. Según la hagiografía de su posterior esposa, Santa Teodora de Arta, Teodoro le envió a él y a su madre al exilio en el Peloponeso[5] Tras la derrota de Teodoro y su captura por Iván Asen II de Bulgaria en la batalla de Klokotnitsa, el trono de Tesalónica pasó a ser ocupado por el hermano de Teodoro, Manuel Komnenos Doukas, que consiguió escapar de Klokotnitsa. Miguel aprovechó la oportunidad y regresó al Epiro. Miguel consiguió rápidamente, al parecer con el apoyo de la población local, hacerse con el control del país."

 #Characters


 #####1297

 bm_1297: "Guerra de la Independencia de Escocia"
 bm_1297_desc: "En toda Escocia se produjo un descontento y un desorden generalizados después de que la Corona inglesa extendiera su dominio sobre Escocia. Andrew de Moray y William Wallace surgieron como los primeros patriotas escoceses importantes. Cuando la noticia del ataque de Wallace a los ingleses se extendió por toda Escocia, los hombres se unieron a él. A principios de junio, Wallace y Douglas planearon un ataque simbólico para liberar Scone, la sede del Justiciero de Escocia nombrado por los ingleses, William de Ormesby. Desde Scone, un lugar considerado sagrado por los escoceses, Ormesby había estado impartiendo justicia inglesa. Ormesby fue advertido del inminente asalto de Wallace y huyó apresuradamente. Al enterarse del inicio de un levantamiento aristocrático, Eduardo I, aunque ocupado en los acontecimientos de Francia, envió una fuerza de soldados de a pie y de jinetes bajo el mando de Sir Henry Percy y Sir Robert Clifford para resolver el "problema escocés". Al recibir informes de que Sir William Douglas había desertado a los rebeldes, Eduardo envió a Robert Bruce, conde de Carrick, junto con los vasallos de su padre de Annandale, para atacar la fortaleza de Douglas en Lanarkshire. Mientras viajaba hacia el norte para enfrentarse a Douglas, Bruce empezó a pensar dónde estaban realmente sus lealtades. Decidió seguir la causa escocesa, y se le cita diciendo: "Ningún hombre siente odio por su carne y su sangre, y yo no soy una excepción. Debo unirme a mi propio pueblo y a la nación en la que nací"."

 bookmark_scotland1297: "Roberto Bruce"
 bookmark_scotland1297_subheading: "King of Scotland"
 bookmark_scotland1297_desc: "Roberto I, conocido popularmente como Roberto Bruce, fue rey de Escocia desde 1306 hasta su muerte en 1329. Robert fue uno de los guerreros más famosos de su generación y acabó liderando a Escocia durante la Primera Guerra de la Independencia Escocesa contra Inglaterra. Luchó con éxito durante su reinado para recuperar el lugar de Escocia como país independiente y ahora es venerado en Escocia como un héroe nacional."

 bookmark_england1297: "Eduardo I"
 bookmark_england1297_subheading: "Rey de Inglaterra"
 bookmark_england1297_desc: "Eduardo I, también conocido como Eduardo Longshanks y el Martillo de los Escoceses, fue rey de Inglaterra desde 1272 hasta 1307. Eduardo pasó gran parte de su reinado reformando la administración real y el derecho común. A través de una amplia investigación legal, investigó la tenencia de varias libertades feudales, mientras que la ley fue reformada a través de una serie de estatutos que regulaban el derecho penal y de propiedad. Sin embargo, la atención de Eduardo se dirigió cada vez más hacia los asuntos militares. Eduardo respondió a una segunda rebelión galesa en 1282-83 con una guerra de conquista a gran escala. Tras una exitosa campaña, sometió a Gales al dominio inglés, construyó una serie de castillos y ciudades en el campo y los pobló con ingleses. A continuación, sus esfuerzos se dirigieron hacia el Reino de Escocia. Inicialmente invitado a arbitrar una disputa de sucesión, Eduardo reclamó la soberanía feudal sobre Escocia. La guerra que siguió continuó después de la muerte de Eduardo, aunque los ingleses parecieron victoriosos en varios momentos."

 bookmark_bohemia1297: "Wenceslao II"
 bookmark_bohemia1297_subheading: "Rey de Bohemia"
 bookmark_bohemia1297_desc: "Wenceslao II Přemyslid fue rey de Bohemia (1278-1305), duque de Cracovia (1291-1305) y rey de Polonia (1300-1305). Era el único hijo del rey Ottokar II de Bohemia y de la segunda esposa de éste, Kunigunda. En 1291, Przemysł II, Alto Duque de Polonia, cedió el ducado soberano de Cracovia a Wenceslao. Cracovia quedó asociada al señorío de Polonia, pero Przemysł mantuvo los demás ducados y en 1295 fue coronado rey de Polonia. Tras la muerte de Przemysł en 1296, Wenceslao se convirtió en señor de Polonia y en 1300 se hizo coronar rey de Polonia. En 1301, el pariente de Wenceslao, Andrés III de Hungría, murió y la dinastía Árpád se extinguió en la línea masculina. Wenceslao fue uno de los parientes que reclamó el trono, y lo aceptó de un grupo de húngaros en nombre de su joven hijo, prometido a la única hija de Andrés, Isabel. El 27 de agosto de 1301, su hijo fue coronado en Székesfehérvár como rey de Hungría. En aquella época, el Reino de Hungría estaba dividido en varios principados de facto, y el joven Wenceslao sólo fue aceptado como rey de Hungría por los gobernantes de la Alta Hungría, en el actual Burgenland y en el territorio alrededor de la capital, Buda. Pero los Abas y Mateo Csák cambiaron de bando en 1303 y comenzaron a apoyar al rival de Wenceslao, Carlos Roberto de Anjou. En consecuencia, el joven Wenceslao, en Ofen (Buda), tuvo miedo y escribió a su padre en Praga para pedirle ayuda. Su padre tomó un gran ejército e invadió Buda, pero tras considerar la situación, tomó a su hijo y la corona húngara y regresó a Bohemia (1304)."

 bookmark_hre1297: "Adolfo"
 bookmark_hre1297_subheading: "Rey de Alemania"
 bookmark_hre1297_desc: "Adolfo fue conde de Nassau desde aproximadamente 1276 y rey electo de Alemania desde 1292 hasta su deposición por los príncipes electores en 1298. Nunca fue coronado por el Papa, lo que le habría asegurado el título imperial. Fue el primer gobernante del Sacro Imperio Romano Germánico física y mentalmente sano que fue depuesto sin una excomunión papal. Adolfo murió poco después en la batalla de Göllheim luchando contra su sucesor Alberto de Habsburgo. Fue el segundo en la sucesión de los llamados condes-rey de varias casas comitales rivales que luchaban por la dignidad real romano-germana. En Pentecostés de 1297, el elector de Brandeburgo, el duque de Sajonia y el rey de Bohemia se unieron para hacer valer sus intereses. El Elector de Maguncia, Gerhard II, se asoció a este grupo."

