 bm_1066: "La Alta Edad Media"
 bm_1066_desc: "El mundo musulmán se encuentra en plena transformación, con dinastías turcas que consolidan su poder en Persia. El Imperio bizantino aún resiste, mientras las potencias cristianas de Europa occidental y central se disputan la hegemonía. En la península ibérica, los reinos cristianos avanzan sobre los territorios de al-Ándalus, debilitados por sus divisiones internas. Escandinavia abraza el cristianismo, y los antiguos dominios vikingos de Rusia y Britania se integran en nuevos órdenes políticos y culturales. Mientras tanto, los normandos extienden su influencia por el Mediterráneo, y las rivalidades entre gobernantes, las ambiciones dinásticas y los conflictos religiosos anuncian una nueva era de conquistas y cruzadas..."
 bookmark_iberia_king_alfonso_alt_sancha: "$Sancha$"
 bookmark_iberia_king_alfonso_alt_nuno: "$NuN_o$"
 bookmark_india1337_desc: "El sultanato de Delhi atraviesa un periodo de grandes transformaciones bajo el gobierno de Muhammad bin Tughluq. Sus ambiciosos proyectos, decisiones impredecibles y métodos de gobierno despiertan tanto admiración como temor entre sus súbditos. Su corte reúne a eruditos, viajeros y hombres de distintas tierras, aunque su autoridad se sostiene mediante una combinación de generosidad, severidad y voluntad inquebrantable. En un reino marcado por las tensiones internas y las aspiraciones de sus gobernantes, el sultán busca reafirmar su poder y mantener la unidad de sus dominios."
 bookmark_hre1194_desc: "La dinastía Hohenstaufen aspira a consolidar su dominio sobre el Sacro Imperio Romano Germánico y extender su influencia por Italia. La unión con la casa real siciliana vincula las ambiciones imperiales con los derechos de una de las coronas más poderosas del Mediterráneo. Su autoridad, sin embargo, despierta recelos entre príncipes, ciudades y rivales que temen una concentración excesiva de poder. Entre disputas dinásticas, alianzas y pretensiones territoriales, el emperador deberá hacer frente a quienes se oponen a sus designios y decidir hasta dónde está dispuesto a llevar sus ambiciones.\n\n#bold La ambición imperial no conoce límites, pero tampoco la resistencia de sus enemigos. ¿Podrá la casa Hohenstaufen imponer su hegemonía sobre Europa?#!"
 bookmark_merchants_1178_guido_guerra: "Guido Guerra II"
 bookmark_merchants_1178_guido_guerra_desc: "Los Guidi figuran entre las casas más antiguas y poderosas de la Toscana, con dominios que se extienden por el valle del Arno y las tierras del Casentino. Sus castillos, derechos señoriales y recursos les otorgan una posición privilegiada en una región marcada por las rivalidades entre nobles, ciudades y autoridades imperiales. Guido Guerra ha mantenido la herencia familiar frente a las disputas que sacuden la región, pero el futuro de la casa depende ahora de sus sucesores. Con las posesiones repartidas a ambos lados de los Apeninos y numerosas ambiciones por satisfacer, los Guidi tienen la oportunidad de fortalecer su linaje y asegurar su lugar entre las grandes casas italianas.\n\n#bold ¿Podrás hacer que tu condado pase a la historia?#!"
 bookmark_merchants_1178_guido_guerra_iii: "Guido Guerra"
