 #Consolidated Bookmarks - Removed excessive parts of character names for space reasons. Epitaphs and ordinal numbers are kept but titles and dynasty names are removed (especially when the dynasty name is right below the character name anyway)

 #####769
 # Alta Edad Media
 bm_769: "Alta Edad Media"
 bm_769_desc: "\n\nEl mundo antiguo se transforma y sus antiguos poderes afrontan el desafío de una nueva era. Desde Constantinopla, el Imperio romano aún resiste las presiones de sus adversarios y lucha por preservar sus dominios en Oriente. Mientras tanto, el califato abasí se alza sobre las ruinas de los omeyas y extiende su autoridad desde Oriente Próximo, inaugurando una nueva etapa de esplendor político, cultural y religioso para el mundo islámico. En Occidente, la antigua dinastía merovingia ha cedido su lugar a los carolingios, cuyo creciente poder amenaza con alterar el equilibrio entre los reinos francos y sus vecinos. Los lombardos mantienen su dominio sobre buena parte de Italia, mientras Asturias resiste en las montañas de la península ibérica. Más allá, las grandes dinastías de la India rivalizan por la supremacía, los jázaros controlan las rutas comerciales de las estepas y los pueblos escandinavos contemplan nuevas oportunidades más allá de sus tierras. Antiguos imperios se debilitan, nuevas dinastías reclaman su lugar y pueblos enteros buscan su destino entre la guerra, la fe y la ambición. ¿Quiénes serán los artífices del nuevo orden y qué poderes perdurarán ante el paso de los siglos?"

 # Personajes
 # Viduquindo
 bookmark_saxony769: "Viduquindo"
 bookmark_saxony769_subheading: "Noble sajón"
 bookmark_saxony769_desc: "Viduquindo pertenece a la nobleza sajona, un pueblo que conserva sus propias leyes, costumbres y creencias tradicionales frente a la expansión del poder franco. Sajonia se encuentra bajo una creciente presión política y religiosa por parte de los carolingios, cuya influencia amenaza la autonomía de sus comunidades. La resistencia a la autoridad franca y a la expansión del cristianismo constituye uno de los principales desafíos para los dirigentes sajones.\n\n#bold ¿Logrará Viduquindo preservar la independencia de su pueblo y hacer frente a la creciente influencia de los francos?#!"

 # Krishna I
 bookmark_maharastra769: "Krishna"
 bookmark_maharastra769_subheading: "Maharajá del Imperio rashtrakuta"
 bookmark_maharastra769_desc: "Krishna I gobierna el Imperio rashtrakuta, una potencia que extiende su influencia por el Decán. Su dinastía rivaliza con otros grandes poderes de la India, especialmente los Chalukyas y los Gangas occidentales, mientras busca consolidar su autoridad sobre los territorios sometidos. Su patrocinio religioso y arquitectónico ofrece la oportunidad de dejar una huella duradera en sus dominios.\n\n#bold ¿Conseguirá Krishna ampliar el poder de los Rashtrakutas y convertir su imperio en la principal potencia del subcontinente indio?#!"

 # Al-Mansur
 bookmark_abassid769: "Al-Mansur"
 bookmark_abassid769_subheading: "Califa del Imperio abasí"
 bookmark_abassid769_desc: "Abu Yáfar al-Mansur es el segundo califa abasí y una figura decisiva para afianzar la autoridad de la dinastía sobre el mundo islámico. Su gobierno se enfrenta al desafío de fortalecer la administración central, reorganizar el poder califal y contener las rebeliones que amenazan la estabilidad del imperio. Entre sus grandes proyectos se encuentra la creación de una nueva capital que sirva como centro político y administrativo de sus dominios.\n\n#bold ¿Conseguirá consolidar el poder abasí y establecer una capital digna de la grandeza de su dinastía?#!"

 # Abderramán I
 bookmark_andalusia769: "Abderramán I"
 bookmark_andalusia769_subheading: "Emir de al-Ándalus"
 bookmark_andalusia769_desc: "Abderramán I, miembro de la dinastía omeya, encuentra refugio en al-Ándalus tras escapar de la persecución abasí que acabó con gran parte de su familia en Oriente. Su linaje le otorga una poderosa legitimidad, pero hacerse con el poder y conservarlo exige imponerse a los gobernantes rivales y a las distintas facciones que disputan la influencia en la península. Como emir, gobierna al margen de la autoridad del califato abasí, aunque la unidad de sus dominios dista mucho de estar asegurada.\n\n#bold ¿Logrará afianzar el poder omeya en al-Ándalus y asegurar la continuidad de su emirato?#!"

 # Constantino V
 bookmark_ere769: "Constantino V"
 bookmark_ere769_subheading: "Basileo del Imperio romano"
 bookmark_ere769_desc: "Aunque las conquistas perdidas y las guerras han reducido sus dominios, el Imperio romano continúa siendo una gran potencia en Oriente. Desde Constantinopla, su autoridad se extiende sobre territorios que aún conservan la fuerza de una antigua tradición imperial, mientras sus ejércitos contienen la presión de los califatos musulmanes y los búlgaros. Constantino V debe preservar ese legado y defender las fronteras de un Imperio que, pese a sus reveses, dista mucho de haber perdido su grandeza. Firme defensor de la iconoclasia, también busca imponer su doctrina frente al culto de las imágenes sagradas, una política que despierta profundas divisiones entre los fieles y los sectores monásticos.\n\n#bold ¿Logrará mantener la fortaleza de Roma en Oriente y conducir al Imperio hacia una nueva era de esplendor?#!"

 # Desiderio I
 bookmark_italy769: "Desiderio I"
 bookmark_italy769_subheading: "Rey de los lombardos"
 bookmark_italy769_desc: "Desiderio gobierna el reino lombardo y busca consolidar la autoridad de su dinastía sobre los dominios de Italia. Su poder debe convivir con la autonomía de los ducados lombardos y con la creciente influencia del papado, cuyas pretensiones territoriales y políticas amenazan con deteriorar las relaciones con la corona. La alianza con los francos constituye una pieza importante de su estrategia diplomática, aunque también puede convertirse en una fuente de incertidumbre.\n\n#bold ¿Conseguirá preservar la independencia del reino lombardo y fortalecer su dominio sobre la península itálica?#!"

 # Carlos I
 bookmark_francia769: "Carlos I"
 bookmark_francia769_subheading: "Rey de Neustria"
 bookmark_francia769_desc: "Hijo de Pipino el Breve, Carlos gobierna Neustria y comparte el trono franco con su hermano Carlomán, rey de Austrasia. La división de los dominios carolingios deja a ambos hermanos al frente de sus propias cortes y rodeados de nobles cuyas lealtades pueden resultar decisivas. La rivalidad entre los dos herederos amenaza con debilitar la autoridad de la dinastía y poner en peligro la unidad del reino.\n\n#bold ¿Conseguirá Carlos imponerse a su hermano, reunificar los dominios francos y forjar un reino digno de su linaje?#!"

 # Carlomán I
 bookmark_middlefrancia769: "Carlomán I"
 bookmark_middlefrancia769_subheading: "Rey de Austrasia"
 bookmark_middlefrancia769_desc: "Hijo de Pipino el Breve, Carlomán gobierna Austrasia y comparte el trono franco con su hermano Carlos, rey de Neustria. Aunque ambos heredaron conjuntamente el reino de su padre, sus intereses y ambiciones amenazan con enfrentarlos. Carlomán debe asegurar la fidelidad de sus nobles, mantener su autoridad sobre sus dominios y hacer frente a las aspiraciones de su hermano.\n\n#bold ¿Logrará preservar su independencia, imponerse en la disputa dinástica y reclamar para sí el dominio de todos los francos?#!"

 # Aurelio
 bookmark_asturias769: "Aurelio"
 bookmark_asturias769_subheading: "Rey de Asturias"
 bookmark_asturias769_desc: "Aurelio ocupa el trono asturiano tras suceder a Fruela I. Su reino conserva su independencia frente al poder omeya de al-Ándalus, aunque las tensiones internas y la lealtad de la nobleza representan desafíos constantes para la monarquía. Las disputas entre señores y siervos amenazan también la estabilidad de sus dominios.\n\n#bold ¿Conseguirá Aurelio mantener la paz en su reino, fortalecer la autoridad de la corona y asegurar el futuro de la monarquía asturiana?#!"

 #####867
 bm_867_carolingians2: "Los Carolingios"
 bm_867_carolingians2_desc: "La herencia de Carlomagno se encuentra repartida entre distintos reinos y principados, gobernados por miembros de su dinastía y otros señores que buscan consolidar su propia autoridad. Francia Occidental, Francia Oriental y Lotaringia compiten por la supremacía, mientras las disputas sucesorias, las rivalidades entre nobles y las amenazas externas debilitan la estabilidad de sus dominios. Aunque los lazos de sangre aún unen a los descendientes de Carlomagno, sus ambiciones e intereses amenazan con perpetuar la fragmentación del antiguo imperio.\n\n#bold ¿Logrará alguno de los herederos reunir los dominios carolingios bajo una sola corona, o quedará la grandeza de su linaje relegada a los recuerdos del pasado?#!"

 # Personajes
 # Carlos el Calvo
 bookmark_carolingians_charles_the_bald: "Carlos el Calvo"
 bookmark_carolingians_charles_the_bald_subheading: "Rey de Francia Occidental"
 bookmark_carolingians_charles_the_bald_desc: "Carlos el Calvo gobierna Francia Occidental, uno de los reinos surgidos de la división del Imperio carolingio. Aunque su autoridad se extiende sobre vastos territorios, debe mantener a raya las ambiciones de los grandes nobles y vigilar las pretensiones de sus parientes, cuyas aspiraciones amenazan constantemente el equilibrio entre los reinos francos. Su linaje representa una de las ramas principales de la dinastía carolingia, pero su continuidad depende de la fortuna de sus herederos. #bold ¿Conseguirá Carlos afianzar su reino y asegurar que sus descendientes preserven la herencia de su ilustre familia?#!"

 bookmark_carolingians_charles_the_bald_alt_judith: "$Judith$"
 bookmark_carolingians_charles_the_bald_alt_louis: "$Louis$ $nick_the_stammerer$"

 # Lotario II
 bookmark_carolingians_king_lothaire: "Lotario II"
 bookmark_carolingians_king_lothaire_subheading: "Rey de Lotaringia"
 bookmark_carolingians_king_lothaire_desc: "Lotario II gobierna Lotaringia, un reino cuya posición entre sus poderosos parientes lo convierte tanto en una herencia codiciada como en un territorio difícil de preservar. Su matrimonio con Teutberga, impuesto por razones dinásticas, amenaza con frustrar sus aspiraciones de asegurar la sucesión de sus hijos con Waldrada. La disputa matrimonial ha trascendido los asuntos de la corte y ha atraído la atención de las autoridades eclesiásticas, convirtiéndose en un peligro para su legitimidad y su autoridad. #bold ¿Logrará Lotario resolver la disputa sucesoria y proteger su reino de quienes esperan aprovecharse de sus dificultades?#!"

 bookmark_carolingians_king_lothaire_alt_waldrada: "$Waldrada$"
 bookmark_carolingians_king_lothaire_alt_teutberga: "$Teutberga$"

 # Luis el Germánico
 bookmark_carolingians_ludwig_the_german: "Luis el Germánico"
 bookmark_carolingians_ludwig_the_german_subheading: "Rey de Francia Oriental"
 bookmark_carolingians_ludwig_the_german_desc: "Luis el Germánico gobierna Francia Oriental, pero la herencia carolingia sigue siendo motivo de disputa entre los descendientes de su padre. Sus ambiciones territoriales lo han llevado a enfrentarse con sus parientes, mientras que las rebeliones de sus propios hijos amenazan la unidad de su reino y la autoridad de la corona. A pesar de su edad, todavía puede aspirar a preservar la fuerza de su linaje y decidir el destino de los dominios francos. #bold ¿Conseguirá Luis contener las ambiciones de sus hijos y asegurar para su descendencia un lugar entre los grandes soberanos de Occidente?#!"

 bookmark_carolingians_ludwig_the_german_alt_youngerludwig: "$Ludwig$ $nick_the_younger$"
 bookmark_carolingians_ludwig_the_german_alt_karl: "$Karl$"

 # Luis II de Italia
 bookmark_carolingians_king_louis: "Luis II"
 bookmark_carolingians_king_louis_subheading: "Emperador de Italia"
 bookmark_carolingians_king_louis_desc: "Luis II ostenta la dignidad imperial y gobierna el reino de Italia, pero la autoridad de su corona dista mucho de abarcar todos los dominios que una vez estuvieron sometidos a los emperadores carolingios. Sus parientes gobiernan territorios con considerable autonomía, mientras que las disputas entre los poderes de la península amenazan con debilitar aún más su posición. Rodeado de rivales y obligado a defender tanto su autoridad como su prestigio, Luis debe demostrar que el título imperial todavía puede inspirar obediencia. #bold ¿Logrará restaurar la autoridad de la corona y devolver a los dominios carolingios la grandeza que una vez conocieron?#!"

 bookmark_carolingians_king_louis_alt_ermengarde: "$Ermengarde$"
 bookmark_carolingians_king_louis_alt_engelberga: "$Engelberga$"

 # Carlomán de Baviera
 bookmark_carolingians_king_karlmann: "Carlomán"
 bookmark_carolingians_king_karlmann_subheading: "Rey de Baviera"
 bookmark_carolingians_king_karlmann_desc: "Carlomán, hijo mayor de Luis el Germánico, gobierna Baviera tras enfrentarse a la autoridad de su propio padre para obtener el dominio de sus territorios. Su posición le permite ejercer una influencia considerable en las tierras orientales del mundo franco, aunque las ambiciones de sus hermanos y la presión de los pueblos vecinos ponen a prueba su autoridad. Como miembro de la dinastía carolingia, puede aspirar a mucho más que el gobierno de Baviera, pero cualquier expansión exigirá fuerza, prudencia y el respaldo de sus nobles. #bold ¿Conseguirá Carlomán ampliar sus dominios y forjar un legado propio entre los herederos de Carlomagno?#!"

 bookmark_carolingians_king_karlmann_alt_arnulf: "$Arnulf$"
 bookmark_carolingians_king_karlmann_alt_hemma: "$Hemma$"


 # Al-Mu'tazz
 bookmark_mutazz: "Al-Mu'tazz"
 bookmark_mutazz_subheading: "Califa abasí"
 bookmark_mutazz_desc: "Al-Mu'tazz ocupa el trono del califato abasí en una época de profunda inestabilidad. La autoridad de los califas se encuentra debilitada por las luchas entre facciones de la corte, las rivalidades entre los mandos militares y las tensiones que recorren las provincias. En Samarra, los jefes turcos ejercen una influencia decisiva sobre el gobierno, mientras que los poderes locales y las aspiraciones de autonomía amenazan la cohesión de sus dominios. El califato conserva el prestigio de una institución que abarca buena parte del mundo islámico, pero su unidad política dista mucho de estar asegurada. #bold ¿Conseguirá Al-Mu'tazz recuperar la autoridad de su dinastía y mantener unido el califato frente a quienes buscan aprovechar su debilidad?#!"

 # Yaqub al-Saffar
 bookmark_saffar: "Yaqub"
 bookmark_saffar_subheading: "Emir de Sistán"
 bookmark_saffar_desc: "Yaqub ibn al-Layth al-Saffar, antiguo artesano del cobre, ha alcanzado el poder gracias a su talento militar y a su capacidad para reunir seguidores en torno a su causa. Desde Sistán, al frente de sus hombres, desafía a los poderes establecidos y aspira a extender su autoridad más allá de las fronteras de su tierra natal. Su ascenso representa una amenaza para los gobernantes que durante generaciones han dominado las provincias orientales del mundo islámico. Sin el prestigio de las antiguas dinastías, Yaqub deberá demostrar que la fuerza de sus ejércitos basta para sostener un nuevo poder. #bold ¿Logrará convertir sus victorias en los cimientos de una dinastía duradera y hacer de Sistán el corazón de un gran dominio?#!"

 # Basilio I
 bookmark_basil: "Basilio I"
 bookmark_basil_subheading: "Basileo del Imperio romano"
 bookmark_basil_desc: "Basilio, llamado el Macedonio, ha alcanzado el trono imperial y abre una nueva etapa para el Imperio romano. Aunque sus orígenes son humildes, su ascenso en la corte y su cercanía al difunto Miguel III le han permitido hacerse con el poder en Constantinopla. El Imperio conserva una considerable fuerza militar y política en Oriente, pero aún debe hacer frente a sus enemigos y preservar la estabilidad de sus dominios. Basilio aspira a afianzar su autoridad, restaurar el prestigio de la corona y dar continuidad a su linaje. #bold ¿Conseguirá convertir su inesperado ascenso en el comienzo de una nueva era de grandeza para el Imperio romano?#!"

 #####1018
 # Personajes

 # Canuto el Grande
 bm_1018: "Canuto el Grande"
 bm_1018_desc: "\n\nEl mundo conocido atraviesa una época de transformación. En el norte de Europa, los pueblos escandinavos extienden su influencia por los mares y las costas, mientras las coronas de Inglaterra y Dinamarca se encuentran bajo el dominio de un mismo soberano. En Oriente, el Imperio romano observa las disputas entre los príncipes de la Rus, mientras intenta preservar su influencia en los Balcanes tras la caída del poder búlgaro. En el Mediterráneo, los fatimíes afianzan su presencia en el Levante bajo el gobierno de al-Hakim, cuya controvertida autoridad despierta tensiones dentro y fuera del califato. Más al este, los gaznávidas extienden su poder hacia las tierras del Punjab y Persia, mientras los pueblos túrquicos de las estepas se preparan para alterar el equilibrio de poder en Asia. Las ambiciones de los soberanos y el destino de sus dinastías anuncian una nueva era de conquistas y rivalidades."

 # Canuto el Grande
 bookmark_canute: "Canuto el Grande"
 bookmark_canute_subheading: "Rey de Inglaterra"
 bookmark_canute_desc: "Canuto, hijo de Sueno Barbapartida, ha conquistado el trono de Inglaterra y ahora reúne bajo su autoridad las coronas de los daneses y los anglosajones. Su dominio se extiende a ambos lados del mar del Norte, pero mantener unidos pueblos con tradiciones, leyes y costumbres distintas exige algo más que la fuerza de las armas. Los nobles ingleses deben aceptar a un soberano extranjero, mientras que las ambiciones de los señores escandinavos amenazan con poner a prueba su autoridad. Canuto tiene ante sí la oportunidad de forjar un poder capaz de rivalizar con los grandes reinos de Occidente.\n\n#bold ¿Conseguirá consolidar su dominio sobre Inglaterra y Dinamarca y convertir sus conquistas en los cimientos de un imperio duradero?#!"

 # Basilio II
 bookmark_ere1018: "Basilio II"
 bookmark_ere1018_subheading: "Basileo del Imperio romano"
 bookmark_ere1018_desc: "Basilio II gobierna un Imperio romano que vuelve a proyectar su poder sobre Oriente y Occidente. Tras largas campañas contra los búlgaros, sus ejércitos han llevado las fronteras imperiales hasta el Danubio y han devuelto a Constantinopla una influencia que parecía perdida. Sin embargo, la guerra continúa en las fronteras orientales, donde los poderes del Cáucaso y las disputas entre los príncipes vecinos amenazan la estabilidad imperial. En el interior, Basilio debe contener las ambiciones de las grandes familias aristocráticas, cuyo poder rivaliza con el de la propia corona. El tesoro imperial y la fuerza de sus ejércitos constituyen los pilares de una autoridad que aspira a perdurar.\n\n#bold ¿Logrará Basilio preservar la grandeza de Roma y asegurar que el Imperio mantenga su supremacía en Oriente?#!"

 # Mahmud de Gazni
 bookmark_kabulistan1018: "Mahmud"
 bookmark_kabulistan1018_subheading: "Sultán del Imperio gaznávida"
 bookmark_kabulistan1018_desc: "Mahmud gobierna el Imperio gaznávida, una potencia en expansión que extiende su influencia desde las tierras de Persia hasta las fronteras del subcontinente indio. Sus ejércitos han convertido Gazni en el centro de un poder militar formidable, mientras sus campañas hacia el Punjab prometen nuevas riquezas y territorios. Heredero de las tradiciones administrativas y culturales persas, Mahmud busca rodear su autoridad de una corte esplendorosa, capaz de rivalizar con los grandes centros del mundo islámico. Sin embargo, sus dominios se encuentran expuestos a las ambiciones de los pueblos túrquicos de las estepas y a la resistencia de los poderes vecinos.\n\n#bold ¿Conseguirá Mahmud extender su dominio y convertir Gazni en uno de los grandes centros políticos y culturales de Oriente?#!"

 # Abu Shuja
 bookmark_persia1018: "Abu Shuja"
 bookmark_persia1018_subheading: "Emir de Fars e Irak"
 bookmark_persia1018_desc: "Abu Shuja, conocido como al-Dawla, gobierna los dominios búyidas de Fars e Irak, aunque la autoridad de su dinastía se encuentra amenazada por las rivalidades entre sus propios miembros. Su hermano Qawam al-Dawla observa con ambición los territorios occidentales, mientras las disputas familiares amenazan con quebrar la unidad de la casa búyida. A estas tensiones se suma la difícil convivencia entre los contingentes militares daylamitas y los mercenarios turcos, cuyas lealtades resultan decisivas para sostener el poder del emir. La riqueza de sus dominios y el prestigio de su linaje todavía le permiten aspirar a preservar la integridad de su herencia.\n\n#bold ¿Logrará Abu Shuja mantener unidos los dominios búyidas y someter las ambiciones de sus rivales?#!"

 # Rodolfo III
 bookmark_burgundy1018: "Rodolfo III"
 bookmark_burgundy1018_subheading: "Rey de Borgoña"
 bookmark_burgundy1018_desc: "Rodolfo III gobierna el reino de Borgoña, una antigua monarquía cuya posición entre el Imperio romano-germánico y los reinos de Occidente la convierte en objeto de constantes intereses dinásticos. Su autoridad se enfrenta a la creciente autonomía de los grandes señores territoriales, mientras la falta de herederos directos amenaza la continuidad de su linaje. Los vínculos con el emperador y las pretensiones de las casas vecinas pesan cada vez más sobre el destino del reino. Rodolfo debe demostrar que la corona todavía conserva la fuerza necesaria para gobernar sus dominios.\n\n#bold ¿Conseguirá preservar la independencia de Borgoña y asegurar la continuidad de su dinastía?#!"

 # Al-Hakim
 bookmark_egypt1018: "Al-Hakim"
 bookmark_egypt1018_subheading: "Califa fatimí"
 bookmark_egypt1018_desc: "Al-Hakim gobierna el califato fatimí, una potencia cuya influencia se extiende desde Egipto hasta buena parte del Levante. Como imán y califa ismailí, reivindica una autoridad religiosa y política que rivaliza con la de los abasíes de Bagdad. Sus dominios, sin embargo, albergan profundas tensiones entre las distintas facciones de la corte y del ejército, especialmente entre los contingentes bereberes y turcos. Mientras sus ejércitos afianzan la influencia fatimí en Siria, las decisiones imprevisibles del califa despiertan inquietud entre sus súbditos y vecinos. Su gobierno puede consolidar la hegemonía de su dinastía o sumirla en nuevas disputas.\n\n#bold ¿Logrará Al-Hakim fortalecer el califato fatimí y mantener bajo su autoridad las diversas fuerzas que amenazan con dividirlo?#!"

 # Boleslao I el Valiente
 bookmark_poland1018: "Boleslao I el Valiente"
 bookmark_poland1018_subheading: "Rey de Polonia"
 bookmark_poland1018_desc: "Boleslao I gobierna Polonia y aspira a convertir su reino en una de las grandes potencias de Europa central. Su autoridad se extiende más allá de las tierras tradicionales de los polanos, gracias a una política de expansión que ha llevado sus ejércitos a enfrentarse con los poderes vecinos. Sin embargo, sus ambiciones lo sitúan en una posición de rivalidad con el Imperio romano-germánico, mientras las tierras de Bohemia, Moravia y las regiones fronterizas siguen siendo objeto de disputa. Boleslao busca fortalecer la Iglesia, consolidar las instituciones del reino y asegurar el reconocimiento de su dignidad real.\n\n#bold ¿Conseguirá ampliar sus dominios y convertir Polonia en una potencia capaz de rivalizar con los grandes reinos de Occidente?#!"

 # Yaroslav el Sabio
 bookmark_novgorod1018: "Yaroslav el Sabio"
 bookmark_novgorod1018_subheading: "Príncipe de Nóvgorod"
 bookmark_novgorod1018_desc: "Yaroslav, hijo de Vladimiro el Grande, gobierna Nóvgorod mientras la Rus de Kiev se encuentra desgarrada por las disputas sucesorias. La muerte de su padre ha abierto una lucha entre los descendientes de la dinastía ruríkida, y el poder en Kiev permanece en manos de su hermano Sviatopolk. Con el respaldo de los novgorodianos y la posibilidad de recurrir a guerreros varegos, Yaroslav puede desafiar a quienes pretenden monopolizar la herencia paterna. La unidad de la Rus depende de la capacidad de sus príncipes para superar sus rivalidades y someter a los poderes regionales.\n\n#bold ¿Logrará Yaroslav hacerse con el trono de Kiev y reunir bajo su autoridad los principados de la Rus?#!"

 # Esteban I
 bookmark_hungary1018: "Esteban I"
 bookmark_hungary1018_subheading: "Rey de Hungría"
 bookmark_hungary1018_desc: "Esteban I gobierna Hungría y trabaja para transformar el legado de los antiguos principados magiares en un reino cristiano sólidamente organizado. La consolidación de su autoridad exige someter a los señores que todavía se resisten al poder real y afianzar la nueva fe frente a las tradiciones paganas. Con el respaldo de la Iglesia y la creación de obispados, monasterios y centros de administración, Esteban busca integrar sus dominios en el orden político de la Europa cristiana. Sin embargo, la transformación del reino despierta resistencias entre quienes temen perder sus antiguas prerrogativas.\n\n#bold ¿Conseguirá Esteban consolidar la monarquía húngara y establecer una dinastía capaz de guiar a su pueblo hacia el futuro?#!"

 # Roberto II el Piadoso
 bookmark_france1018: "Roberto II"
 bookmark_france1018_subheading: "Rey de Francia"
 bookmark_france1018_desc: "Roberto II, llamado el Piadoso, ocupa el trono de Francia y gobierna una corona cuya autoridad todavía se encuentra limitada por el poder de los grandes señores feudales. Los duques y condes de sus dominios actúan con considerable independencia, mientras las disputas sucesorias y las rivalidades territoriales ponen a prueba la autoridad de la dinastía capeta. Roberto busca ampliar los dominios reales y reforzar el prestigio de la monarquía, aunque sus aspiraciones chocan con los intereses de las casas principescas. La suerte de la corona dependerá de su capacidad para convertir el prestigio dinástico en poder efectivo.\n\n#bold ¿Conseguirá Roberto ampliar los dominios de la corona y fortalecer la autoridad de los Capetos sobre el reino?#!"

 # Alfonso V el Noble
 bookmark_leon1018: "Alfonso V el Noble"
 bookmark_leon1018_subheading: "Rey de León"
 bookmark_leon1018_desc: "Alfonso V gobierna el reino de León tras una infancia marcada por las luchas internas y las incursiones de los ejércitos andalusíes. Su autoridad debe afianzarse sobre una nobleza poderosa y unos territorios que todavía se recuperan de las devastaciones sufridas durante los conflictos anteriores. Al sur, los dominios musulmanes siguen representando una amenaza constante, mientras que la reorganización de las instituciones y la restauración de las ciudades resultan esenciales para fortalecer el reino. Alfonso tiene ante sí la tarea de devolver la estabilidad a la monarquía y asegurar la continuidad de su linaje.\n\n#bold ¿Logrará reconstruir la fuerza del reino leonés y consolidar su posición entre los soberanos cristianos de la península?#!"

 # Enrique II
 bookmark_hre1018: "Enrique II"
 bookmark_hre1018_subheading: "Emperador del Sacro Imperio Romano Germánico"
 bookmark_hre1018_desc: "Enrique II gobierna el Sacro Imperio Romano Germánico y busca reforzar la autoridad imperial sobre los numerosos ducados y señoríos que componen sus dominios. Sus ambiciones chocan con las de Boleslao de Polonia, cuyas conquistas amenazan el equilibrio de Europa central, mientras que las disputas en Italia obligan al emperador a intervenir más allá de los Alpes. Enrique encuentra en la Iglesia un aliado fundamental para fortalecer la corona y consolidar su autoridad frente a los grandes nobles. Sin embargo, mantener la unidad de un imperio tan vasto exige una constante labor diplomática y militar.\n\n#bold ¿Conseguirá Enrique preservar la unidad imperial, someter a sus rivales y restaurar la autoridad de la corona en todos sus dominios?#!"

 # Jorge I
 bookmark_georgia1018: "Jorge I"
 bookmark_georgia1018_subheading: "Rey de Georgia"
 bookmark_georgia1018_desc: "Jorge I gobierna Georgia, un reino cuya posición en el Cáucaso lo sitúa entre las ambiciones de las grandes potencias de Oriente. La influencia del Imperio romano sobre los territorios vecinos y las disputas por las regiones fronterizas amenazan la independencia de la corona georgiana. El joven monarca debe afianzar su autoridad sobre la nobleza y preservar la integridad de sus dominios frente a un vecino mucho más poderoso. La defensa de su herencia exige prudencia, pero también la determinación necesaria para resistir las pretensiones imperiales.\n\n#bold ¿Logrará Jorge defender la independencia de Georgia y asegurar la grandeza de su dinastía?#!"

 # Guaimario III
 bookmark_salerno1018: "Guaimario III"
 bookmark_salerno1018_subheading: "Príncipe de Salerno"
 bookmark_salerno1018_desc: "Guaimario III gobierna el principado de Salerno, uno de los principales poderes lombardos del sur de Italia. Bajo su autoridad, la ciudad disfruta de una posición destacada en el comercio y la política de la región, mientras los territorios vecinos de Amalfi, Gaeta y Sorrento se encuentran sometidos a su influencia. Sin embargo, la presencia bizantina en Apulia y Calabria y las rivalidades entre los principados lombardos amenazan el equilibrio de sus dominios. Guaimario aspira a extender su autoridad por el sur de la península y convertir Salerno en el centro de un poder regional aún mayor.\n\n#bold ¿Conseguirá ampliar sus dominios y hacer de Salerno la potencia dominante del sur de Italia?#!"

