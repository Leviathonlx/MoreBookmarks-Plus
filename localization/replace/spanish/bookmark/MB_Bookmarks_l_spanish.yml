 #####1066
 # Personajes
 # Murchad Briain, rey de Munster
 bookmark_rags_to_riches_petty_king_murchad: "Murchad"
 bookmark_rags_to_riches_petty_king_murchad_subheading: "Rey de Munster"
 bookmark_rags_to_riches_petty_king_murchad_desc: "La Alta Realeza de Irlanda ha estado al alcance de la casa Briain, aunque las rivalidades entre las grandes familias del país han impedido consolidar un dominio duradero. Los señores irlandeses luchan por sus territorios y sus derechos dinásticos, mientras las comunidades de origen nórdico conservan su influencia en las costas. Murchad gobierna Munster y pertenece a un linaje que aspira a recuperar la supremacía sobre Irlanda. Sin embargo, su posición dista mucho de garantizarle el éxito.\n\n#bold ¿Podrá Murchad devolver a la casa Briain el trono de Irlanda y someter a sus rivales?#!"
 bookmark_rags_to_riches_petty_king_murchad_alt_brian: "$Brian$"
 bookmark_rags_to_riches_petty_king_murchad_alt_bebinn: "$BE_binn$"

 # Matilde de Canossa, duquesa de Toscana
 bookmark_rags_to_riches_duchess_matilda: "Matilde"
 bookmark_rags_to_riches_duchess_matilda_subheading: "Duquesa de Toscana"
 bookmark_rags_to_riches_duchess_matilda_desc: "Matilde de Canossa pertenece a una de las familias más poderosas del norte de Italia y está llamada a heredar extensos dominios en la región. Su linaje, sus vínculos con la Iglesia y su posición entre los grandes señores italianos le ofrecen la posibilidad de ejercer una influencia extraordinaria. Las disputas entre el papado y el Imperio pueden convertirla en una figura decisiva de la política italiana, aunque también amenazan con arrastrar sus territorios a conflictos interminables.\n\n#bold ¿Conseguirá Matilde consolidar el poder de los Canossa y asegurar la continuidad de su linaje?#!"

 # Yahya Dhunnunid, emir de Toledo
 bookmark_rags_to_riches_emir_yahya: "Yahya"
 bookmark_rags_to_riches_emir_yahya_subheading: "Emir de Toledo"
 bookmark_rags_to_riches_emir_yahya_desc: "La casa Dhunnunid gobierna Toledo y ejerce su autoridad sobre buena parte de las tierras circundantes. Sin embargo, el equilibrio político de al-Ándalus es frágil: los reinos de taifas compiten entre sí, mientras los monarcas cristianos del norte aprovechan sus divisiones para extender sus dominios. Yahya debe mantener la lealtad de sus súbditos, contener las ambiciones de sus vecinos y decidir hasta dónde está dispuesto a llegar para preservar la independencia de su emirato.\n\n#bold ¿Podrá Yahya imponerse a sus rivales y asegurar un futuro para la casa Dhunnunid?#!"
 bookmark_rags_to_riches_emir_yahya_alt_zahida: "$Zahida$"
 bookmark_rags_to_riches_emir_yahya_alt_yahya2: "$Yahya$"

 # Vratislao Přemyslida, duque de Bohemia
 bookmark_rags_to_riches_duke_vratislav: "Vratislao"
 bookmark_rags_to_riches_duke_vratislav_subheading: "Duque de Bohemia"
 bookmark_rags_to_riches_duke_vratislav_desc: "La casa Přemyslida gobierna Bohemia desde hace generaciones y ha consolidado su posición mediante una compleja red de alianzas y vínculos familiares. Sin embargo, las disputas sucesorias amenazan con dividir a la dinastía. Vratislao debe equilibrar sus propias ambiciones con las de sus hermanos y mantener la autonomía de su ducado frente a las presiones de los grandes poderes vecinos.\n\n#bold ¿Conseguirá Vratislao fortalecer su autoridad y convertir Bohemia en un reino independiente?#!"
 bookmark_rags_to_riches_duke_vratislav_alt_judita: "$Judita$"
 bookmark_rags_to_riches_duke_vratislav_alt_ota: "$Ota$ $nick_the_handsome$"

 # Roberto el Zorro de Hauteville, duque de Apulia
 bookmark_rags_to_riches_duke_robert: "Roberto el Zorro"
 bookmark_rags_to_riches_duke_robert_subheading: "Duque de Apulia"
 bookmark_rags_to_riches_duke_robert_desc: "Roberto de Hauteville se ha abierto camino en el sur de Italia mediante la guerra, la astucia y una ambición difícil de contener. Procedente de una familia normanda numerosa, ha pasado de encabezar partidas de guerreros y aventureros a convertirse en uno de los señores más poderosos de la región. Sus dominios aún no están asegurados: lombardos, romanos y otros gobernantes normandos disputan el control del sur de Italia, mientras Sicilia permanece bajo dominio musulmán. Las oportunidades de conquista son inmensas, pero también lo son los peligros.\n\n#bold ¿Podrá Roberto consolidar sus dominios y abrir a la casa Hauteville el camino hacia un reino en Sicilia?#!"

 # García Fernández, rey de Galicia
 bookmark_iberia_king_garcia: "García"
 bookmark_iberia_king_garcia_subheading: "Rey de Galicia"
 bookmark_iberia_king_garcia_desc: "García gobierna el reino de Galicia, la parte occidental de los dominios que su padre ha repartido entre sus hijos. Su posición es vulnerable: sus hermanos Alfonso y Sancho también poseen coronas y ambiciones propias, y ninguno parece dispuesto a aceptar una autoridad compartida. Las tensiones familiares amenazan con convertirse en una guerra abierta, mientras los nobles gallegos observan con atención el equilibrio de poder entre los tres reinos.\n\n#bold ¿Podrá García defender su herencia frente a sus hermanos y convertir Galicia en el corazón de un reino más poderoso?#!"

 # Alfonso VI Fernández, rey de León
 bookmark_iberia_king_alfonso: "Alfonso VI"
 bookmark_iberia_king_alfonso_subheading: "Rey de León"
 bookmark_iberia_king_alfonso_desc: "Alfonso, hijo de Fernando el Grande, gobierna el reino de León, la parte central de los dominios paternos. Su posición le proporciona importantes recursos y una base desde la que aspirar a reunir los territorios de sus hermanos. Sin embargo, Sancho de Castilla y García de Galicia también reclaman su lugar dentro de la herencia familiar. La rivalidad entre los tres príncipes amenaza con desgarrar los reinos cristianos del norte, mientras los gobernantes musulmanes de al-Ándalus observan cualquier oportunidad para aprovechar sus divisiones.\n\n#bold ¿Conseguirá Alfonso reunir los tres reinos bajo una sola corona?#!"

 # Sancho II Fernández, rey de Castilla
 bookmark_iberia_king_sancho: "Sancho II"
 bookmark_iberia_king_sancho_subheading: "Rey de Castilla"
 bookmark_iberia_king_sancho_desc: "Sancho gobierna Castilla, el reino que le corresponde tras el reparto de los dominios de su padre, Fernando el Grande. Considera que su herencia no hace justicia a sus ambiciones y contempla con recelo las posesiones de sus hermanos Alfonso y García. Su carácter decidido y su experiencia militar pueden convertirlo en el más peligroso de los tres pretendientes a la supremacía familiar, pero cualquier intento de reunir los reinos por la fuerza amenaza con desencadenar una guerra prolongada.\n\n#bold ¿Podrá Sancho imponerse a sus hermanos y reunir los dominios de su padre bajo su autoridad?#!"
 bookmark_iberia_king_sancho_alt_rodrigo: "$Rodrigo$"

 # Urraca Fernández, condesa de Zamora
 bookmark_iberia_infanta_urraca: "Urraca"
 bookmark_iberia_infanta_urraca_subheading: "Condesa de Zamora"
 bookmark_iberia_infanta_urraca_desc: "Urraca, hija de Fernando el Grande, ocupa una posición singular entre los miembros de su familia. Su influencia se extiende más allá de sus dominios y mantiene vínculos con las instituciones eclesiásticas de los reinos heredados por sus hermanos. Junto a su hermana Elvira, ejerce autoridad sobre numerosos monasterios y puede intervenir en las disputas que amenazan con enfrentar a los príncipes. Su inteligencia política y sus alianzas pueden convertirla en una figura decisiva en el destino de la dinastía.\n\n#bold ¿Podrá Urraca superar las ambiciones de sus hermanos y asegurar su propia influencia sobre los reinos de su padre?#!"
 bookmark_iberia_infanta_urraca_alt_elvira: "$Elvira$"

 # Antso IV Garcés, rey de Navarra
 bookmark_iberia_king_antso: "Antso IV"
 bookmark_iberia_king_antso_subheading: "Rey de Navarra"
 bookmark_iberia_king_antso_desc: "Antso IV gobierna Navarra en medio de una nobleza dividida y de una autoridad regia que todavía debe consolidarse. Varios señores de las tierras occidentales se muestran reacios a aceptar su gobierno, mientras las rivalidades con sus parientes amenazan la estabilidad del reino. El poder de los monarcas vecinos y las disputas dentro de su propia familia hacen que la posición de Antso sea especialmente delicada.\n\n#bold ¿Podrá Antso imponerse a sus rivales y asegurar la continuidad de su dinastía en Navarra?#!"

 # Harold Godwinson, rey de Inglaterra
 bookmark_hastings_england: "Harold"
 bookmark_hastings_england_subheading: "Rey de Inglaterra"
 bookmark_hastings_england_desc: "Harold Godwinson pertenece a una de las familias más poderosas de Inglaterra y ha sido elegido rey por los principales señores del reino tras la muerte de Eduardo el Confesor. Su coronación, sin embargo, no ha puesto fin a las disputas sucesorias. Guillermo, duque de Normandía, reclama la corona y cuenta con el respaldo de sus seguidores, mientras Harald Hardrada de Noruega también prepara una expedición para hacer valer sus derechos. Tostig, hermano exiliado de Harold, se ha unido a los enemigos de su propia familia.\n\n#bold Con los señores anglosajones a su lado, ¿podrá Harold defender la corona frente a quienes pretenden arrebatársela?#!"
 bookmark_hastings_england_alt_tostig: "$Tostig$"
 bookmark_hastings_england_alt_eadgifu: "$Eadgifu$ $nick_the_fair$"

 # Guillermo el Bastardo, duque de Normandía
 bookmark_hastings_normandy: "Guillermo el Bastardo"
 bookmark_hastings_normandy_subheading: "Duque de Normandía"
 bookmark_hastings_normandy_desc: "La casa de Normandía desciende de los vikingos que se asentaron en el norte de Francia y fundaron allí un poderoso ducado. Guillermo ha tenido que defender su autoridad desde la infancia frente a las facciones rivales de la nobleza normanda, pero ha logrado imponerse y consolidar su dominio. Ahora dirige sus ambiciones hacia Inglaterra: sostiene que Eduardo el Confesor le prometió la sucesión y que Harold Godwinson reconoció sus derechos. La coronación de Harold ha convertido esa disputa en una guerra por la corona inglesa.\n\n#bold ¿Podrá Guillermo reunir sus fuerzas, derrotar a Harold y conquistar el reino que considera suyo por derecho?#!"
 bookmark_hastings_normandy_alt_robert: "$Robert$ $nick_the_curthose$"
 bookmark_hastings_normandy_alt_william: "$William$ $nick_the_red$"

 # Harald Hardrada, rey de Noruega
 bookmark_hastings_norway: "Harald Hardrada"
 bookmark_hastings_norway_subheading: "Rey de Noruega"
 bookmark_hastings_norway_desc: "Harald Hardrada es un veterano de incontables campañas y uno de los guerreros más temidos del norte. Tras sus infructuosos intentos de someter Dinamarca, dirige ahora su atención hacia Inglaterra. Según sus pretensiones, la corona inglesa le corresponde por los acuerdos sucesorios vinculados a la muerte del anterior monarca. La invitación de Tostig Godwinson, hermano exiliado del nuevo rey, le ofrece una oportunidad para intervenir en la disputa. Una expedición a través del mar del Norte podría abrirle las puertas de un reino, aunque también podría poner en peligro todo cuanto ha conseguido.\n\n#bold ¿Podrá Harald aprovechar las divisiones de Inglaterra y convertirse en su nuevo rey?#!"
 bookmark_hastings_norway_alt_olaf: "$Olaf$"
 bookmark_hastings_norway_alt_ingegerd: "$Ingegerd$"

 # Svend Estridsson, rey de Dinamarca
 bookmark_hastings_denmark: "Svend"
 bookmark_hastings_denmark_subheading: "Rey de Dinamarca"
 bookmark_hastings_denmark_desc: "Svend de Dinamarca mantiene vínculos dinásticos con las casas reinantes de Inglaterra y Noruega, lo que le proporciona posibles reclamaciones sobre ambos reinos. Sin embargo, sus recursos militares son limitados y sus dominios no están en condiciones de sostener una gran guerra de conquista. La diplomacia, los matrimonios y las alianzas pueden ofrecerle oportunidades más provechosas que una invasión directa. Si consigue fortalecer su posición entre las potencias del norte, quizá pueda convertir sus pretensiones dinásticas en una realidad.\n\n#bold ¿Podrá Svend aprovechar sus vínculos familiares y diplomáticos para extender el poder de Dinamarca más allá de sus fronteras?#!"
 bookmark_hastings_denmark_alt_harald: "$Harald$ $nick_the_whetstone$"
 bookmark_hastings_denmark_alt_knud: "$Knud$"

 # Malcolm III, rey de Escocia
 bookmark_hastings_scotland: "Malcolm"
 bookmark_hastings_scotland_subheading: "Rey de Escocia"
 bookmark_hastings_scotland_desc: "Malcolm III gobierna Escocia en una posición tan peligrosa como prometedora. La guerra sucesoria en Inglaterra ofrece la posibilidad de extender su influencia hacia el sur y reclamar territorios fronterizos, pero los señores nórdicos y los jefes gaélicos todavía desafían la autoridad real en distintas partes de su reino. Para consolidar su corona, Malcolm debe mantener unidos a sus magnates y aprovechar las debilidades de sus vecinos sin descuidar las amenazas internas.\n\n#bold ¿Podrá Malcolm imponerse a sus rivales y convertir las divisiones de las islas británicas en una oportunidad para Escocia?#!"

 # Al-Mustansir Billah, califa fatimí
 bookmark_egypt1066: "Al-Mustansir Billah"
 bookmark_egypt1066_subheading: "Califa fatimí"
 bookmark_egypt1066_desc: "Abū Tamīm Ma'ad al-Mustanṣir bi-llāh ocupa el trono del califato fatimí y ejerce su autoridad sobre Egipto y extensos territorios del norte de África y Oriente Próximo. Su largo reinado ha estado marcado por las tensiones políticas, las dificultades económicas y las rivalidades entre las facciones que sostienen el poder de la dinastía. La sucesión de al-Mustansir plantea además un desafío decisivo para el futuro del ismailismo: sus hijos Nizār y Aḥmad cuentan con partidarios propios, y la disputa entre ambos amenaza con dividir el califato."

 # Alp Arslan, sultán del Imperio selyúcida
 bookmark_persia1066: "Alp Arslan"
 bookmark_persia1066_subheading: "Sultán del Imperio selyúcida"
 bookmark_persia1066_desc: "Alp Arslan, segundo gran sultán de la dinastía selyúcida y descendiente de su fundador epónimo, gobierna un vasto imperio que se extiende por Persia y las tierras vecinas. Su autoridad se ha fortalecido mediante campañas contra sus rivales y la expansión de sus dominios, pero el poder selyúcida todavía debe consolidarse frente a los desafíos internos y externos. El Imperio romano constituye uno de sus principales adversarios, y las disputas por el control de Armenia y Anatolia amenazan con provocar un enfrentamiento de consecuencias imprevisibles. Su nombre, Alp Arslan, significa «León heroico» en turco."

 # Someshvara I, maharajá de los Chalukyas occidentales
 bookmark_india1066: "Someshvara I"
 bookmark_india1066_subheading: "Maharajá de los Chalukyas occidentales"
 bookmark_india1066_desc: "Someshvara I gobierna el poderoso reino de los Chalukyas occidentales, cuya influencia se extiende por buena parte del Decán. Sus campañas militares han reforzado la autoridad de la dinastía y ampliado sus dominios hacia la India central y occidental. Sin embargo, sus vecinos y rivales siguen disputando la supremacía regional, y mantener la cohesión de un territorio tan extenso exige tanto habilidad militar como diplomática."

 # Enrique IV, rey de romanos
 bookmark_hre1066: "Enrique IV"
 bookmark_hre1066_subheading: "Rey de romanos"
 bookmark_hre1066_desc: "Enrique IV, hijo de Enrique III y de Inés de Poitou, ocupa el trono de Alemania bajo la tutela de su madre. Su juventud coincide con un periodo de tensiones entre la monarquía, los grandes príncipes y la Iglesia. La autoridad imperial todavía debe afirmarse, y las disputas en torno a la elección de los papas amenazan con alterar el equilibrio entre el poder secular y el eclesiástico. Enrique tendrá que demostrar que puede gobernar por sí mismo y mantener unidos los dominios de su dinastía frente a una nobleza ambiciosa."

 # Constantino X Ducas, basileo del Imperio romano
 bookmark_ere1066: "Constantino X Ducas"
 bookmark_ere1066_subheading: "Basileo del Imperio romano"
 bookmark_ere1066_desc: "Constantino X Ducas ocupa el trono del Imperio romano y gobierna en un momento de creciente presión sobre sus fronteras. En Italia, los normandos amenazan las últimas posesiones imperiales, mientras que en los Balcanes y las provincias orientales se multiplican los desafíos militares. La corte debe hacer frente, además, a las tensiones entre las grandes familias aristocráticas y las dificultades para mantener la capacidad defensiva del Estado. La expansión selyúcida representa una amenaza cada vez mayor para las tierras de Anatolia.\n\n#bold ¿Podrá Constantino preservar la autoridad imperial y contener a los enemigos que amenazan sus fronteras?#!"


 #####1067
 # Personajes
 CONQUERER_WILLIAM: "Guillermo el Conquistador"

 # Después de Hastings
 bm_1066_posthastings: "Guillermo el Conquistador"
 bm_1066_posthastings_desc: "La victoria normanda en Hastings ha cambiado el destino de Inglaterra. Guillermo, duque de Normandía, se ha proclamado rey y comienza a repartir las tierras del reino entre sus seguidores, desplazando a buena parte de la antigua nobleza anglosajona. Sin embargo, la conquista todavía no está asegurada: las rebeliones y la resistencia local amenazan con prolongar la guerra. Mientras tanto, en Anatolia, el avance de los selyúcidas bajo el mando del sultán Alp Arslan pone en peligro las posesiones orientales del Imperio romano. El equilibrio de poder en Europa y Oriente puede cambiar de forma irreversible."

 # Guillermo el Conquistador, rey de Inglaterra
 bookmark_hastings_normandyengland: "Guillermo el Conquistador"
 bookmark_hastings_normandyengland_subheading: "Rey de Inglaterra"
 bookmark_hastings_normandyengland_desc: "Descendiente del jefe vikingo Rollo, Guillermo heredó el ducado de Normandía durante su infancia y tuvo que defender su autoridad frente a las facciones rivales de la nobleza. Pese a las conspiraciones y los conflictos que marcaron sus primeros años, consiguió imponerse y consolidar su dominio sobre el ducado. Ahora, tras derrotar a Harold Godwinson en Hastings, se ha hecho con la corona inglesa. Sin embargo, conquistar el reino no equivale a gobernarlo: los señores anglosajones desplazados pueden rebelarse, y la nueva dinastía normanda todavía debe asegurar su autoridad sobre un territorio hostil.\n\n#bold ¿Podrá Guillermo someter Inglaterra y consolidar el dominio de su dinastía a ambos lados del canal de la Mancha?#!"

 #####936
 bm_otto_the_first: "El siglo de hierro"
 bm_otto_the_first_desc: "El mundo atraviesa un periodo de profundos cambios. En el este de Francia, Otón se dispone a consolidar su autoridad como rey de los germanos y a someter a los nobles que desafían su poder. Mientras tanto, los magiares afianzan su dominio sobre la cuenca de los Cárpatos y continúan sus incursiones contra los pueblos vecinos, extendiendo el temor por toda Europa. En el norte, los misioneros cristianos intentan abrirse paso en Escandinavia para convertir a sus gobernantes, aunque la antigua fe germánica conserva su fuerza entre los pueblos nórdicos. Más al sur, el califato abasí ha perdido gran parte de su antiguo esplendor y su autoridad se limita al corazón de sus dominios. En el norte de África, el califato fatimí representa una nueva potencia dispuesta a expandir su influencia sobre los territorios musulmanes. \n\n#bold ¿Quién saldrá victorioso de este tumultuoso momento de la historia?#!"

 # Personajes

 # Otón el Grande, rey de Francia Oriental
 OTTO_GREAT: "Otón el Grande"
 bookmark_otto: "Otón el Grande"
 bookmark_otto_subheading: "Rey de Francia Oriental"
 bookmark_otto_desc: "Tras la muerte de su padre, Enrique I, Otón hereda el trono de Francia Oriental y debe enfrentarse a una nobleza poco dispuesta a aceptar su autoridad. La rebelión de Eberhard de Baviera y la alianza de sus adversarios en Lorena y Francia Occidental amenazan con debilitar su posición. Sin embargo, sus ambiciones van más allá de asegurar el reino: Italia y la corona imperial podrían aguardar a quien consiga imponerse a sus rivales. ¿Logrará Otón consolidar su poder y convertirse en el soberano más poderoso de la cristiandad?"

 # Al-Qa'im, califa fatimí
 bookmark_Qaim: "Al-Qa'im"
 bookmark_Qaim_subheading: "Califa fatimí"
 bookmark_Qaim_desc: "Al-Qa'im, hijo y sucesor de Ubayd Allah al-Mahdi, ocupa el trono del califato fatimí de Ifriqiya y es reconocido como el duodécimo imán por los ismailíes. Su autoridad se enfrenta a las ambiciones de sus adversarios y a las dificultades de gobernar un califato cuya influencia aspira a extenderse por el norte de África. ¿Conseguirá afianzar el poder fatimí y ampliar los dominios de su dinastía?"

 # Æthelstan, rey de Inglaterra
 bookmark_ethelstan: "Æthelstan"
 bookmark_ethelstan_subheading: "Rey de Inglaterra"
 bookmark_ethelstan_desc: "Æthelstan, hijo de Eduardo el Viejo, gobierna sobre una Inglaterra cuya unidad aún depende de la fuerza de su autoridad. Ha reforzado el poder de la corona, ampliado el alcance de sus leyes y convocado a sus consejos a gobernantes de tierras vecinas, incluidos los reyes galeses. Su corte también destaca por el impulso que concede a la cultura, la enseñanza y la vida religiosa. Sin embargo, sus dominios siguen rodeados de rivales que podrían desafiar su supremacía. ¿Logrará Æthelstan preservar la unidad de Inglaterra y afianzar su legado?"

 # Zoltán, gran príncipe de Hungría
 bookmark_arpad: "Zoltán"
 bookmark_arpad_subheading: "Gran Príncipe de Hungría"
 bookmark_arpad_desc: "Zoltán, descendiente de Árpád, gobierna a los magiares y mantiene la autoridad de su linaje sobre las tribus húngaras. Aunque se conocen pocos detalles de su gobierno, su posición resulta fundamental para la continuidad de la dinastía que dirige a su pueblo. Los territorios vecinos observan con inquietud el poder de los magiares, cuyas incursiones siguen marcando el destino de Europa central. ¿Conseguirá Zoltán preservar la unidad de su pueblo y asegurar el futuro de su linaje?"

 # Haakon el Bueno, rey de Noruega
 bookmark_hakon: "Haakon el Bueno"
 bookmark_hakon_subheading: "Rey de Noruega"
 bookmark_hakon_desc: "Haakon Haraldsson, conocido como el Bueno, ocupa el trono de Noruega tras regresar de Inglaterra, donde fue criado en la corte del rey Æthelstan. Cristiano por influencia de su educación, aspira a introducir su fe entre los noruegos, aunque las antiguas creencias siguen profundamente arraigadas. Su intento de transformar las costumbres del reino podría granjearle tantos aliados como enemigos. ¿Conseguirá Haakon cristianizar Noruega sin perder el apoyo de sus propios súbditos?"

 # Abderramán III, califa de Córdoba
 bookmark_andalusia: "Abderramán III"
 bookmark_andalusia_subheading: "Califa de Córdoba"
 bookmark_andalusia_desc: "Abderramán III gobierna al-Ándalus desde Córdoba y ostenta el título de califa, con el que proclama la independencia religiosa y política de los omeyas frente a sus rivales. Conocido como al-Nasir li-Din Allah, «el Defensor de la religión de Dios», busca consolidar su autoridad sobre los territorios de la península y contener la influencia fatimí en el norte de África. Su reinado promete ser una prueba de fuerza para el califato y sus adversarios. ¿Logrará Abderramán convertir Córdoba en el centro indiscutible del poder musulmán en Occidente?"

 # Igor el Viejo, príncipe de Kiev
 bookmark_yngvar: "Igor de Kiev"
 bookmark_yngvar_subheading: "Príncipe de Kiev"
 bookmark_yngvar_desc: "Igor el Viejo gobierna la Rus desde Kiev, donde debe mantener unidos a los pueblos y territorios sometidos a su autoridad. Sus ambiciones comerciales y militares lo llevan a mirar hacia el sur, especialmente hacia las ricas tierras del Imperio romano. Constantinopla representa una oportunidad para obtener riquezas y reconocimiento, pero también un poderoso adversario. ¿Conseguirá Igor fortalecer la Rus y asegurar su posición frente a sus vecinos?"

 # Nasr II, emir del Imperio samánida
 bookmark_samanid: "Nasr II"
 bookmark_samanid_subheading: "Emir del Imperio samánida"
 bookmark_samanid_desc: "Nasr ibn Ahmad gobierna el Imperio samánida desde Transoxiana y Jorasán. Bajo su autoridad, la dinastía alcanza una posición de gran influencia en el mundo iranio, mientras sus dominios prosperan gracias al comercio, la cultura y la administración. Sin embargo, mantener la cohesión de un territorio tan extenso exige equilibrar las ambiciones de sus gobernadores y las amenazas de sus vecinos. ¿Podrá Nasr preservar la prosperidad y el poder de su dinastía?"

 # Alí ibn Buya, emir de Fars
 bookmark_burid: "Imad al-Dawla"
 bookmark_burid_subheading: "Emir de Fars"
 bookmark_burid_desc: "Alí ibn Buya, conocido como Imad al-Dawla, es el fundador de la dinastía buyí. De origen daylamita, ha establecido su autoridad sobre Fars y aspira a extender su influencia por las tierras del antiguo Imperio sasánida. Los buyíes reivindican las tradiciones y los símbolos de la antigua monarquía iraní, y su creciente poder amenaza con alterar el equilibrio político de la región. ¿Conseguirá Alí ibn Buya convertir a su dinastía en la fuerza dominante de Persia?"

 # Ramiro II, rey de León
 bookmark_leon936: "Ramiro II"
 bookmark_leon936_subheading: "Rey de León"
 bookmark_leon936_desc: "Ramiro II ocupa el trono de León tras imponerse a sus rivales dinásticos y reunir bajo su autoridad los dominios leoneses y gallegos. Decidido a contener el poder de al-Ándalus, impulsa campañas militares contra los territorios musulmanes y busca reforzar las fronteras de su reino. La amenaza del califato omeya sigue siendo considerable, pero Ramiro no parece dispuesto a ceder terreno. ¿Logrará frenar la expansión musulmana y afianzar el poder de León?"

 # Romano I Lecapeno, basileo del Imperio romano
 bookmark_ere936: "Romano I"
 bookmark_ere936_subheading: "Basileo del Imperio romano"
 bookmark_ere936_desc: "Romano Lecapeno ha alcanzado el trono imperial gracias a su poder militar y a su alianza con la familia de Constantino VII, cuya hija Helena ha contraído matrimonio con él. Aunque el emperador legítimo conserva su título, Romano ejerce la autoridad efectiva y ocupa la posición de emperador mayor. En los Balcanes, el Imperio se enfrenta a una prolongada guerra contra Bulgaria, mientras las tensiones en la corte amenazan con poner en peligro el equilibrio de poder. ¿Conseguirá Romano preservar su autoridad y asegurar la estabilidad del Imperio?"

 #####993
 bm_993: "Un nuevo milenio"
 bm_993_desc: "El paso de un nuevo milenio invita a sacerdotes y eruditos cristianos a reflexionar sobre el legado de Cristo y la expansión de la Santa Madre Iglesia. En Hungría, Esteban acaba de suceder a su padre como gran príncipe y se enfrenta al desafío de consolidar su autoridad sobre las tribus magiares, mientras impulsa la conversión al cristianismo. En Europa oriental y septentrional, la cristianización de Polonia, la Rus de Kiev y los reinos escandinavos transforma el equilibrio religioso y político de la región. Más al este, en los confines del mundo islámico, Mahmud de Gazni recibe del califa abasí el título honorífico de Yamin al-Dawla («Mano derecha del Estado»), reconocimiento que refuerza su posición como gobernante de Jorasán. Entre estos territorios se extiende un mundo de califatos, reinos e imperios, cuyas ambiciones e intereses se entrecruzan. ¿Qué poderes lograrán imponerse en este nuevo milenio?"

 # Roberto II de Francia
 bookmark_france997: "Roberto II"
 bookmark_france997_subheading: "Rey de Francia"
 bookmark_france997_desc: "Roberto II, hijo y sucesor de Hugo Capeto, acaba de asumir el trono de Francia. Su autoridad, como la de su padre, depende en buena medida de los vínculos con los grandes señores del reino, cuyas ambiciones limitan el poder de la Corona. Devoto y profundamente comprometido con la Iglesia, Roberto busca fortalecer la monarquía y preservar la estabilidad de sus dominios. Sin embargo, las disputas sucesorias y la resistencia de la nobleza amenazan con poner a prueba su gobierno."

 # Svend I de Dinamarca
 bookmark_denmark997: "Svend"
 bookmark_denmark997_subheading: "Rey de Dinamarca"
 bookmark_denmark997_desc: "Svend, conocido como Barba Hendida, gobierna Dinamarca en una época de expansión y rivalidad entre los reinos escandinavos. Hijo de Harald Blåtand, ha consolidado su posición tras enfrentarse a su propio padre y aspira a extender su influencia más allá de las fronteras danesas. Inglaterra, dividida por las tensiones políticas y las incursiones vikingas, representa una oportunidad para acrecentar su poder. ¿Logrará Svend imponer su autoridad sobre las tierras al otro lado del mar?"

 # Samuel de Bulgaria
 bookmark_bulgaria997: "Samuel"
 bookmark_bulgaria997_subheading: "Zar de Bulgaria"
 bookmark_bulgaria997_desc: "Samuel gobierna el Imperio búlgaro en medio de una prolongada lucha contra Bizancio. Tras consolidar su autoridad sobre buena parte de los territorios búlgaros, debe contener las ambiciones del emperador Basilio II, decidido a restaurar el dominio imperial sobre los Balcanes. La supervivencia de Bulgaria depende de su capacidad militar y de mantener unidos sus dominios frente a un adversario poderoso. ¿Podrá Samuel preservar la independencia de su reino?"

 # Basilio II
 bookmark_ere997: "Basilio II"
 bookmark_ere997_subheading: "Basileo del Imperio bizantino"
 bookmark_ere997_desc: "Basilio II gobierna el Imperio bizantino con la determinación de restaurar la autoridad imperial y asegurar sus fronteras. Su principal adversario es el Imperio búlgaro, cuya resistencia obstaculiza la expansión bizantina en los Balcanes. Al mismo tiempo, las amenazas en las fronteras orientales y las tensiones internas exigen la atención del emperador. Su firmeza y capacidad militar serán decisivas para preservar la estabilidad del Imperio y afirmar su supremacía en la región."

 # Vladímir I de Kiev
 bookmark_kiev997: "Vladímir"
 bookmark_kiev997_subheading: "Gran príncipe de Kiev"
 bookmark_kiev997_desc: "Vladímir gobierna la Rus de Kiev tras imponerse en una cruenta lucha por la sucesión. Su autoridad se extiende sobre un conjunto de territorios y pueblos diversos, unidos por vínculos políticos todavía frágiles. La elección de una nueva fe puede ofrecerle una vía para consolidar su poder y estrechar sus relaciones con los grandes Estados vecinos. Mientras considera las distintas tradiciones religiosas, el cristianismo bizantino gana terreno en su corte. ¿Qué rumbo elegirá Vladímir para el futuro de la Rus?"

 # Esteban I de Hungría
 bookmark_hungary997: "Esteban"
 bookmark_hungary997_subheading: "Gran príncipe de Hungría"
 bookmark_hungary997_desc: "Esteban ha sucedido recientemente a su padre, Géza, como gran príncipe de los magiares. Su autoridad todavía debe afianzarse frente a los nobles y otros miembros de la dinastía que cuestionan su derecho a gobernar. Decidido a transformar las estructuras políticas de Hungría, impulsa la adopción del cristianismo y estrecha sus vínculos con la cristiandad occidental. Sin embargo, la resistencia de quienes defienden las antiguas costumbres y tradiciones amenaza con frustrar sus proyectos. ¿Conseguirá Esteban unir a los magiares bajo una nueva fe y una autoridad común?"

 #####1081
 bm_komnenos_dynasty: "La Alexíada"
 bm_komnenos_dynasty_desc: "Tras una sucesión de derrotas ante los ejércitos turcos, el Imperio romano atraviesa una profunda crisis. Anatolia se encuentra amenazada y la autoridad imperial parece incapaz de contener el avance de sus adversarios. Pero una nueva esperanza acaba de surgir: el general Alejo Comneno ha arrebatado el trono a Nicéforo III y se dispone a restaurar el poder imperial. Su hija Ana dejará constancia de su vida y de su dinastía en la Alexíada, pero el futuro aún está por escribirse. Mientras tanto, Solimán I, miembro de la dinastía selyúcida, gobierna gran parte de Anatolia y establece su propio sultanato, al que da el nombre de Rum, reivindicando así la herencia romana. \n\n#bold ¿Podrá el Imperio romano recuperar sus territorios o el sultanato de Rum acabará imponiéndose en Anatolia?#!"

 # Personajes

 # Alejo I Comneno, basileo del Imperio romano
 ALEXIOS: "Alejo"
 bookmark_alexios: "Alejo I"
 bookmark_alexios_subheading: "Basileo del Imperio romano"
 bookmark_alexios_desc: "Alejo Comneno ha alcanzado el trono imperial tras derrocar a Nicéforo III. General experimentado, conoce de primera mano las amenazas que se ciernen sobre el Imperio: los turcos selyúcidas avanzan por Anatolia, mientras los normandos representan un peligro en Occidente. Su ascenso despierta esperanzas de recuperación, pero el tesoro está debilitado y las fronteras amenazadas. ¿Conseguirá Alejo restaurar la autoridad imperial y devolver al Imperio su antigua fortaleza?"

 # Solimán I, sultán de Rum
 SULEYMAN: "Suleyman"
 bookmark_suleyman: "Solimán I"
 bookmark_suleyman_subheading: "Sultán de Rum"
 bookmark_suleyman_desc: "Solimán I, miembro de la dinastía selyúcida, gobierna un sultanato independiente en Anatolia y reclama para sí la herencia de Roma con el nombre de Rum. Hijo de un príncipe que disputó el trono del Gran Imperio selyúcida, sobrevivió a las luchas dinásticas que acabaron con su familia y logró establecer su propio poder en tierras anatolias. La llegada al trono de Alejo Comneno podría alterar el equilibrio de la región y amenazar sus conquistas. ¿Conseguirá Solimán consolidar el sultanato y resistir el resurgimiento del Imperio romano?"

 #####1124
 bm_jerusalem: "Jerusalén en su apogeo"
 bm_jerusalem_desc: "El Reino de Jerusalén se encuentra en la cúspide de su poder. El Principado de Antioquía ha sido absorbido y los dominios cruzados se extienden por el interior, la península del Sinaí y Damasco. Aunque su tamaño y fortaleza parecen asegurar la presencia católica en el Levante, su posición dista mucho de ser inexpugnable. Damasco y Alepo siguen actuando como barreras frente al poderoso sultanato selyúcida, mientras el califa fatimí no olvida los territorios que Egipto perdió durante la Primera Cruzada. Jerusalén está rodeada de enemigos y cuenta con pocos aliados. En la distancia, comienza a escucharse el grito de la yihad..."

 BM_SELJUK: "Colapso de los selyúcidas"
 BM_SELJUK_desc: "El gran Imperio selyúcida se ha fragmentado y sus últimos dominios atraviesan un periodo de profunda inestabilidad. La captura del sultán Sanjar por los rebeldes oghuz y su posterior muerte han dejado un vacío de poder que amenaza con acabar definitivamente con la unidad de la dinastía. Antiguos vasallos, miembros de la familia selyúcida y ambiciosos señores de la guerra se disputan los territorios del antiguo imperio. El califa abasí, los atabegs y numerosos emires, entre ellos los últimos representantes de la aristocracia persa, aguardan la oportunidad de extender sus dominios a costa de sus antiguos señores. Mientras tanto, Manuel Comneno gobierna el Imperio romano y dirige su atención hacia Hungría. Tiempo atrás, había acordado con Esteban III que su hermano Béla recibiría educación en Constantinopla y contraería matrimonio con María, hija del emperador. Manuel esperaba que ambos llegaran a gobernar bajo la tutela imperial, pero las disputas sucesorias húngaras le han ofrecido la oportunidad de intervenir directamente en los asuntos del reino. Ahora respalda las pretensiones de Béla sobre Croacia y Dalmacia, con la intención de convertirlo en un aliado estrechamente vinculado a Constantinopla. Si sus planes prosperan, la influencia romana podría extenderse hasta el corazón de Europa central. Sin embargo, la continuidad de la dinastía Comnena tampoco está asegurada y Manuel debe afrontar sus propios desafíos sucesorios. ¿Conseguirán los romanos aprovechar la fragmentación de sus vecinos para ampliar su influencia, o acabarán sus ambiciones debilitando al propio Imperio?"

 # Personajes

 # Balduino II, rey de Jerusalén
 BAUD: "Balduino"
 bookmark_baud: "Balduino II"
 bookmark_baud_subheading: "Rey de Jerusalén"
 bookmark_baud_desc: "Balduino de Bourg, primo de Balduino I, ocupa el trono de Jerusalén tras una vida marcada por las campañas militares y las intrigas políticas de los Estados cruzados. Antiguo conde de Edesa, conoce bien las amenazas que rodean al reino y debe mantener unida a la nobleza franca frente a sus numerosos adversarios. Los dominios de Jerusalén se encuentran en una posición favorable, pero los poderes musulmanes de la región siguen representando un peligro constante. ¿Conseguirá Balduino preservar la fortaleza del reino y asegurar su futuro?"

 # David IV el Constructor, rey de Georgia
 bookmark_davit: "David IV"
 bookmark_davit_subheading: "Rey de Georgia"
 bookmark_davit_desc: "David IV, conocido como el Constructor, pertenece a la dinastía Bagrationi y gobierna Georgia con la ambición de restaurar su antigua grandeza. Sus campañas contra los turcos selyúcidas han permitido recuperar territorios y reforzar la autoridad real, mientras sus reformas militares y administrativas consolidan el poder de la corona. La victoria de Didgori ha abierto nuevas oportunidades para extender la influencia georgiana por el Cáucaso. Devoto de la Iglesia y promotor de la cultura cristiana, David aspira a convertir su reino en un bastión de la cristiandad oriental. ¿Logrará completar la reunificación de Georgia y asegurar el legado de su dinastía?"

 # Al-Amir, califa fatimí
 bookmark_almir: "Al-Amir"
 bookmark_almir_subheading: "Califa fatimí"
 bookmark_almir_desc: "Abu Ali al-Mansur, conocido como al-Amir, ocupa el trono del califato fatimí y es reconocido por los ismailíes musta'líes como su vigésimo imán. Durante buena parte de su reinado, el visir al-Afdal Shahanshah ha ejercido el poder efectivo, relegando al califa a un papel secundario. Sin embargo, tras la muerte del visir, al-Amir ha comenzado a asumir las riendas del gobierno y a prescindir de sus intermediarios. La expansión de los cruzados amenaza los dominios fatimíes en Palestina, mientras las tensiones internas ponen a prueba la estabilidad del califato. ¿Conseguirá al-Amir recuperar la autoridad de su cargo y contener el avance de sus enemigos?"

 # Arslan Shah II, sultán de los selyúcidas de Irak
 bookmark_esfa: "Arslan Shah II"
 bookmark_esfa_subheading: "Sultán de los selyúcidas de Irak"
 bookmark_esfa_desc: "El vasto Imperio selyúcida, fundado por Tugril Beg y llevado a su apogeo por Alp Arslan, se ha fragmentado en numerosos dominios rivales. Arslan Shah II ocupa el trono de los selyúcidas de Irak y reclama autoridad sobre territorios de Azerbaiyán, Irak y Persia occidental, aunque su poder depende en gran medida de la lealtad de emires independientes como Eldiguz. Los antiguos dominios imperiales se encuentran expuestos a las ambiciones de sus vecinos y de numerosos señores de la guerra. ¿Conseguirá Arslan Shah restaurar la autoridad de su dinastía o será su sultanato otra víctima de la fragmentación selyúcida?"

 # Amalarico I, rey de Jerusalén
 bookmark_baud3: "Amalarico"
 bookmark_baud3_subheading: "Rey de Jerusalén"
 bookmark_baud3_desc: "Amalarico, segundo hijo de Melisenda y Fulco de Jerusalén, ha heredado el trono tras la muerte de su hermano Balduino III. Su reinado se enfrenta a un panorama cada vez más complicado: los Estados cruzados necesitan aliados poderosos y el Imperio romano representa un socio fundamental para contener a sus adversarios. Al mismo tiempo, los territorios musulmanes de Siria y Egipto se encuentran en proceso de unificación bajo el poder de Nur al-Din y sus sucesores. Amalarico contempla la posibilidad de intervenir en Egipto para impedir que caiga en manos de sus enemigos. ¿Conseguirá preservar Jerusalén y mantener el equilibrio de poder en Tierra Santa?"

 # Yelü Yilie, emperador del Qara-Kitai
 bookmark_yelu: "Yelü Yilie"
 bookmark_yelu_subheading: "Emperador del Qara-Kitai"
 bookmark_yelu_desc: "Los kitán, antiguos señores de un vasto imperio en Asia oriental, han encontrado refugio en Asia central tras la caída de su dinastía en manos de los jurchen. Bajo el mando de Yelü Yilie, han derrotado a los kara-jánidas y extendido su dominio por las estepas y los oasis de la región. Su nuevo imperio combina las tradiciones nómadas kitán con elementos de la cultura china y la fe budista. Rodeado de pueblos y potencias rivales, Yelü debe decidir si continúa sus conquistas o consolida los territorios que ya controla. ¿Logrará reconstruir la grandeza de su pueblo en tierras extranjeras?"

 # Abu Yaqub Yusuf, califa almohade
 bookmark_abd: "Abu Yaqub Yusuf"
 bookmark_abd_subheading: "Califa almohade"
 bookmark_abd_desc: "Abu Yaqub Yusuf, segundo califa almohade, gobierna desde Marrakech un imperio que se extiende por el Magreb y al-Ándalus. Su autoridad se apoya en la fuerza de un movimiento religioso y político que ha reunificado gran parte del Occidente islámico. Al otro lado del estrecho, los reinos cristianos peninsulares siguen representando una amenaza para sus dominios, mientras las ciudades andalusíes requieren una administración firme. Yusuf también impulsa la construcción de grandes obras y fortalece la posición de Sevilla como centro de poder. ¿Conseguirá mantener unidos sus extensos dominios y contener el avance de los reinos cristianos?"

 # Federico I Barbarroja, emperador del Sacro Imperio Romano Germánico
 bookmark_barbarossa: "Federico Barbarroja"
 bookmark_barbarossa_subheading: "Emperador del Sacro Imperio Romano Germánico"
 bookmark_barbarossa_desc: "Federico I, conocido como Barbarroja, ocupa el trono imperial y aspira a reforzar la autoridad del Sacro Imperio Romano Germánico sobre sus numerosos territorios. Su apodo, «Barbarroja», procede de las ciudades del norte de Italia, donde sus campañas buscan restablecer los derechos imperiales frente a las ambiciones de los poderes locales. Dotado de una gran capacidad militar y política, Federico pretende restaurar la autoridad de la corona y recuperar la tradición del derecho romano. Sin embargo, sus aspiraciones lo enfrentan tanto a los príncipes alemanes como a las ciudades italianas y al papado. ¿Conseguirá imponer su autoridad y fortalecer el poder imperial?"

 # Manuel I Comneno, basileo del Imperio romano
 bookmark_manuel: "Manuel I"
 bookmark_manuel_subheading: "Basileo del Imperio romano"
 bookmark_manuel_desc: "Manuel I Comneno ocupa el trono imperial en un momento de renovada influencia romana. Heredero de la restauración iniciada por sus antepasados, aspira a recuperar la posición de su imperio como gran potencia del Mediterráneo. Sus campañas y alianzas han extendido la influencia imperial por los Balcanes y el Mediterráneo oriental, mientras Hungría y los Estados cruzados se encuentran cada vez más vinculados a Constantinopla. Conocido por la lealtad que inspira entre sus seguidores, Manuel debe mantener sus ambiciones sin descuidar las amenazas que acechan en las fronteras orientales y occidentales. ¿Logrará devolver al Imperio romano su antigua hegemonía?"

 # Luis VII el Joven, rey de Francia
 bookmark_louis: "Luis VII"
 bookmark_louis_subheading: "Rey de Francia"
 bookmark_louis_desc: "Luis VII, conocido como el Joven, ocupa el trono de Francia y debe hacer frente al creciente poder de los Plantagenet. La anulación de su matrimonio con Leonor de Aquitania ha permitido que esta se case con Enrique, duque de Normandía y conde de Anjou, quien posteriormente ha heredado la corona inglesa. Los dominios de Enrique se extienden ahora desde las islas británicas hasta los Pirineos, amenazando con rodear los territorios de la corona francesa. Mientras tanto, Luis busca reforzar la autoridad real y consolidar el prestigio de su reino. ¿Conseguirá contener a los Plantagenet y preservar la autoridad de los Capetos?"

 # Enrique II Plantagenet, rey de Inglaterra
 bookmark_henry: "Enrique II"
 bookmark_henry_subheading: "Rey de Inglaterra"
 bookmark_henry_desc: "Enrique II, primer monarca de la dinastía Plantagenet, gobierna un vasto conjunto de territorios que abarca Inglaterra, gran parte de las islas británicas y extensos dominios en Francia. Su matrimonio con Leonor de Aquitania ha incorporado a sus posesiones uno de los territorios más ricos de Europa occidental, mientras sus derechos sobre Normandía y Anjou refuerzan su posición frente a la corona francesa. Sin embargo, mantener unido un patrimonio tan extenso exige contener las ambiciones de sus vasallos y las rivalidades de sus propios familiares. Su relación con Luis VII continúa marcada por la competencia y la desconfianza. ¿Conseguirá Enrique preservar sus dominios y asegurar la continuidad de su dinastía?"

 # Saladino, sultán de Egipto y Siria
 bookmark_saladin: "Saladino"
 bookmark_saladin_subheading: "Sultán de Egipto y Siria"
 bookmark_saladin_desc: "Saladino, fundador de la dinastía ayubí, ha consolidado su autoridad en Egipto y aspira a extenderla por Siria y los territorios musulmanes vecinos. Tras la muerte de Nur al-Din, ha aprovechado las disputas entre los gobernantes sirios para establecer su presencia en Damasco y ampliar sus dominios. Su objetivo es reunir bajo una misma autoridad a los poderes musulmanes de la región y dirigir sus fuerzas contra los Estados cruzados. Sin embargo, sus ambiciones también despiertan la desconfianza de otros gobernantes musulmanes. ¿Conseguirá unificar sus dominios y cambiar el equilibrio de poder en Tierra Santa?"

 # Khusrau Malik, sultán gaznávida
 bookmark_ghaznavi: "Khusrau Malik"
 bookmark_ghaznavi_subheading: "Sultán gaznávida"
 bookmark_ghaznavi_desc: "Khusrau Malik gobierna los últimos dominios de la dinastía gaznávida desde Lahore, después de que las incursiones oghuz obligaran a abandonar la antigua capital de Gazni. Desde el Punyab, intenta preservar el poder de su linaje y mantener a raya a los ghuríes, cuya influencia crece en las tierras vecinas. Sus campañas en el norte de la India y sus alianzas con los jhokar le permiten conservar cierta iniciativa, pero el sultanato se encuentra cada vez más aislado. ¿Conseguirá Khusrau Malik preservar el legado gaznávida frente a sus poderosos adversarios?"

 # Clave general sin personaje asignado (MUHAMMED)
 MUHAMMED: "Balduino"

 #####1187
 bm_prelude: "La Tercera Cruzada"
 bm_prelude_desc: "Los Comnenos han caído del trono imperial y el Imperio romano se tambalea con ellos. Los nuevos reinos de Serbia y Bulgaria han declarado su independencia de la corona romana, los sultanes selyúcidas de Rum presionan las fronteras restauradas del Imperio en Anatolia y Béla III gobierna Hungría y Croacia sin tutela imperial. Todos los sueños de Manuel Comneno se han esfumado, pero es una época de oportunidades para quienes sean lo bastante sabios como para verlas. En Trebisonda gobierna Alejo Comneno, un joven miembro de la dinastía imperial. Si logra reunir el apoyo suficiente para presentar su reclamación en Constantinopla, podría trabajar para restaurar la edad dorada que la caída prematura de su familia truncó. Mientras tanto, Jerusalén está a punto de caer en manos de Saladino, mientras el rey Enrique II de Inglaterra, el rey Felipe II de Francia y el emperador del Sacro Imperio Romano Germánico, Federico «Barbarroja», siguen enfrentados entre sí."

 # Personajes

 # Isaac II Ángelo, basileo del Imperio romano
 bookmark_isaakios: "Isaac II"
 bookmark_isaakios_subheading: "Basileo del Imperio romano"
 bookmark_isaakios_desc: "Isaac II Ángelo, hijo de Andrónico Ducas Ángelo y de Eufrosine Kastamonitissa, pertenece a la extensa familia imperial de los Comnenos por su abuela Teodora, hija menor de Alejo I Comneno y de Irene Ducas. Ocupa el trono tras el tumulto popular que puso fin al odiado gobierno de Andrónico I: cuando los hombres del emperador intentaron arrestarlo, mató a su lugarteniente Esteban Hagiocristóforo y se refugió en Santa Sofía, desde donde apeló al pueblo de Constantinopla. Ahora debe restaurar la autoridad imperial en un Imperio acosado por la independencia de Serbia y Bulgaria y por la presión de los selyúcidas de Rum. ¿Conseguirá Isaac devolver la estabilidad al trono de Constantinopla?"

 # Alejo I Comneno, emperador de Trebisonda
 bookmark_alexios2: "Alejo I"
 bookmark_alexios2_subheading: "Emperador de Trebisonda"
 bookmark_alexios2_desc: "Alejo Comneno gobierna Trebisonda junto a su hermano David. Ambos son los únicos descendientes varones del emperador Andrónico I, derrocado y asesinado, y representan a una dinastía caída que aún aspira a recuperar el trono. Aunque todavía es muy joven, su linaje imperial podría servirle para reclamar Constantinopla si logra reunir el apoyo suficiente. ¿Conseguirá Alejo restaurar la edad dorada de los Comnenos?"

 # Kilij Arslan II, sultán de Rum
 bookmark_arslan: "Kilij Arslan II"
 bookmark_arslan_subheading: "Sultán de Rum"
 bookmark_arslan_desc: "Kilij Arslan II gobierna desde hace décadas el sultanato selyúcida de Rum. Aprovechó la inestabilidad del Imperio romano tras la muerte de Manuel para asegurarse la mayor parte de la costa meridional de Anatolia, envió a su visir Ikhtiyar al-Din a concertar una alianza con Saladino, sucesor de Nur al-Din, y arrebató Cotyaeum a los romanos antes de hacer la paz con Isaac II Ángelo. Recientemente ha repartido el poder entre sus once hijos, que ya se disputan el control de los territorios. ¿Conseguirá el veterano sultán mantener unido Rum frente a las ambiciones de sus hijos y la amenaza de nuevos ejércitos cristianos?"

 # Béla III, rey de Hungría
 bookmark_bela: "Béla III"
 bookmark_bela_subheading: "Rey de Hungría"
 bookmark_bela_desc: "Béla III gobierna Hungría y Croacia, y ha dado un fuerte impulso al uso de registros escritos y a la organización de la Cancillería Real. En Esztergom levanta un palacio cuya arquitectura gótica es una novedad en Europa central, y sus ingresos lo sitúan entre los monarcas más ricos de su tiempo. Formado en la corte de Constantinopla y curtido en la política del Imperio romano, gobierna ahora sin tutela imperial. ¿Sabrá aprovechar su riqueza y su experiencia para convertir Hungría en la gran potencia de la región?"

 # Guy de Lusignan, rey de Jerusalén
 bookmark_guy: "Guy"
 bookmark_guy_subheading: "Rey de Jerusalén"
 bookmark_guy_desc: "Guy de Lusignan, caballero poitevino de la casa de Lusignan e hijo de Hugo VIII, reina en Jerusalén por derecho de su esposa Sibila, tras la muerte de Balduino IV y del joven Balduino V. Llegó a Tierra Santa, donde ya destacaba su hermano Aimerico de Lusignan, y se casó apresuradamente con Sibila para evitar un incidente político en el reino. Su reinado está marcado por el aumento de las hostilidades con los ayubíes gobernados por Saladino. ¿Sabrá Guy defender un reino cada vez más amenazado?"

 # Felipe II Augusto, rey de Francia
 bookmark_philippe: "Felipe II"
 bookmark_philippe_subheading: "Rey de Francia"
 bookmark_philippe_desc: "Felipe II, joven y ambicioso, reina sobre un dominio real modesto, rodeado por las vastas posesiones de los Plantagenet, que gobiernan más tierras en Francia que la propia corona. Sus predecesores se titularon reyes de los francos, pero Felipe aspira a gobernar como rey de Francia. Su estrategia pasa por reforzar la autoridad real, reducir el poder de los grandes nobles y ganarse el apoyo de las ciudades y la burguesía emergente. ¿Conseguirá transformar un pequeño estado feudal en el reino más poderoso de Europa?"

 # Saladino, sultán de Egipto y Siria
 bookmark_saladin2: "Saladino"
 bookmark_saladin2_subheading: "Sultán de Egipto y Siria"
 bookmark_saladin2_desc: "Saladino, fundador de la dinastía ayubí, ha sido descrito como el califa de facto del islam. Su imperio incluye Egipto, Siria, la Alta Mesopotamia, el Hiyaz, Yemen y otras partes del norte de África. Ha dirigido incursiones contra los cruzados en Palestina, ha conquistado Yemen y ha contenido las rebeliones fatimíes en el Alto Egipto. Poco después de la muerte de Nur al-Din se lanzó a la conquista de Siria y entró pacíficamente en Damasco a petición de su gobernador. Ahora dirige sus fuerzas contra el Reino cruzado de Jerusalén, que conquistó la región hace casi un siglo. ¿Conseguirá Saladino expulsar a los cruzados de Palestina y reunir bajo su mando a los poderes musulmanes?"

 # Federico I Barbarroja, emperador del Sacro Imperio Romano Germánico
 bookmark_barbarossa2: "Federico Barbarroja"
 bookmark_barbarossa2_subheading: "Emperador del Sacro Imperio Romano Germánico"
 bookmark_barbarossa2_desc: "Federico Barbarroja ocupa desde hace décadas el trono del Sacro Imperio Romano Germánico. Su apodo, «barba roja» en italiano y Rotbart en alemán, procede de las ciudades del norte de Italia que intentó gobernar, y refleja la importancia de las campañas italianas en su reinado. Sus contemporáneos admiran su longevidad, su ambición, su extraordinaria capacidad de organización y su perspicacia militar y política, cualidades que lo hacen parecer casi sobrehumano. Ha impulsado el restablecimiento del Corpus Iuris Civilis, el derecho romano, para contrarrestar el poder papal que dominaba los estados alemanes desde la Querella de las Investiduras. ¿Conseguirá el emperador imponer su autoridad sobre Italia y el papado?"

 # Enrique II Plantagenet, rey de Inglaterra
 bookmark_henry2: "Enrique II"
 bookmark_henry2_subheading: "Rey de Inglaterra"
 bookmark_henry2_desc: "Enrique II, primer rey de la Casa de Plantagenet, ocupa el trono de Inglaterra desde hace décadas. Su matrimonio con Leonor, duquesa de Aquitania, cuya unión con Luis VII había sido anulada, lo convirtió en duque de Aquitania, y un tratado reciente lo ha hecho conde de Nantes. Controla Inglaterra, gran parte de Gales, la mitad oriental de Irlanda y la mitad occidental de Francia, y en distintos momentos ha dominado parcialmente Escocia y el ducado de Bretaña. Con la corona francesa libra desde hace décadas una «guerra fría», primero con Luis VII y ahora con Felipe II, y a pesar de numerosas conferencias y tratados de paz no se ha alcanzado ningún acuerdo duradero. ¿Conseguirá Enrique mantener unido su vasto dominio?"

 # Ghiyath al-Din Muhammad, sultán del Imperio ghurí
 bookmark_ghurid2: "Ghiyath al-Din Muhammad"
 bookmark_ghurid2_subheading: "Sultán del Imperio ghurí"
 bookmark_ghurid2_desc: "Ghiyath al-Din Muhammad gobierna la dinastía ghurí, cuyo poder crece desde su corazón en Ghur. Tras derrotar a los pretendientes al trono, disputa a los corasmios el señorío de Jorasán y ha ocupado Herat. Su hermano Mu'izz al-Din le sirve con la mayor lealtad y deferencia y se ocupa de gestionar y ampliar las posesiones orientales, en dirección a la India. ¿Conseguirá la dinastía ghurí convertirse en la gran potencia entre Persia y el subcontinente indio?"

