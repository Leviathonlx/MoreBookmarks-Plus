########################## ARTEFACTOS HISTÓRICOS ##########################
 ### Entradas
 MB_artifact_holy_crown_hungary_name: "Santa Corona de Hungría"

 MB_artifact_holy_crown_hungary_desc: "La corona de San Esteban, con la que han sido coronados los reyes de Hungría desde el primero, que se cree enviada por el papa Silvestre II para su coronación en el año 1000. Su banda inferior fue un regalo del emperador bizantino. Se considera que la corona encarna el propio reino, y ningún rey es legítimo hasta ser coronado con ella."

 MB_artifact_holy_lance_empire_name: "Lanza Sagrada del Imperio"

 MB_artifact_holy_lance_empire_desc: "La lanza de San Mauricio, que lleva un clavo de la Vera Cruz en la hoja, y que el rey Rodolfo de Borgoña entregó al rey Enrique en Worms. Llevada ante los reyes alemanes en la batalla, fue portada en el Lechfeld y se convirtió en la más sagrada de las insignias imperiales."

 MB_artifact_mantle_roger_name: "Manto de coronación de Roger II"

 MB_artifact_mantle_roger_desc: "Un manto de seda roja bordado en oro y perlas con dos leones abatiendo camellos en torno a una palmera, hecho en los talleres reales de Palermo y con una inscripción en árabe del año 528 de la Hégira. Confeccionado para el rey Roger II de Sicilia, pasó con la corona siciliana a los Hohenstaufen y a las insignias imperiales."

 MB_artifact_oriflamme_name: "Oriflama"

 MB_artifact_oriflamme_desc: "El estandarte rojo de la abadía de Saint-Denis, que los reyes de Francia toman del altar del mártir cuando van a la guerra. Cuando se alza, no se da cuartel."

 MB_artifact_joyeuse_name: "Joyeuse"

 MB_artifact_joyeuse_desc: "La espada de Carlomagno, guardada en el tesoro de Saint-Denis y llevada ante el rey de Francia en su coronación en Reims."

 MB_artifact_hodegetria_name: "Hodegetria"

 MB_artifact_hodegetria_desc: "El icono de la Madre de Dios que Muestra el Camino, que se cree pintado por San Lucas, paladión de Constantinopla. Se lleva en torno a las murallas cuando la ciudad es asediada y ante el emperador en campaña."

 MB_artifact_qadib_prophet_name: "Bastón del Profeta"

 MB_artifact_qadib_prophet_desc: "Al-Qadib, el bastón del profeta Mahoma, que los califas abasíes portan junto a su manto como insignia del califato."

 MB_artifact_quran_uthman_name: "Corán de Uthman"

 MB_artifact_quran_uthman_desc: "Un ejemplar del Corán que se considera uno de los códices enviados por el califa Uthman, manchado con su sangre. Se conservó en la Gran Mezquita de Córdoba hasta que los almohades lo llevaron a Marrakech, y sus califas lo portaban ante sus ejércitos en campaña."

 MB_artifact_vladimir_theotokos_name: "Theotokos de Vladímir"

 MB_artifact_vladimir_theotokos_desc: "El icono de la Madre de Dios abrazando tiernamente a su hijo, pintado en Constantinopla y considerado obra de San Lucas, que el príncipe Andréi Bogoliubski se llevó de Vyshhorod a su nueva capital en Vladímir."

 MB_artifact_kollur_diamond_name: "Gran Diamante de Kollur"

 MB_artifact_kollur_diamond_desc: "Un diamante de enorme tamaño, que se dice procedente de las minas de Kollur, junto al Krishna, y que los reyes Kakatiya guardaban en su tesoro de Warangal. La tradición sostiene que fue llevado a Delhi con el tesoro de los Kakatiya. Más tarde será conocido como Koh-i-Noor, la Montaña de Luz."

 MB_artifact_yasakani_no_magatama_name: "Yasakani no Magatama"

 MB_artifact_yasakani_no_magatama_desc: "La joya curva de las Insignias Imperiales, colgada del árbol sakaki ante la cueva de Amaterasu y transmitida por Ninigi a los emperadores. A diferencia de la espada y el espejo, la guarda el propio emperador y nunca se separa de su lado."

 MB_artifact_katashiro_kusanagi_name: "Katashiro de Kusanagi"

 MB_artifact_katashiro_kusanagi_desc: "La espada guardada en el palacio imperial en lugar de la Kusanagi no Tsurugi, que está consagrada en Atsuta. Se lleva ante el emperador en su ascenso al trono como una de las Insignias Imperiales."

 MB_artifact_crown_of_thorns_name: "Corona de Espinas"

 MB_artifact_crown_of_thorns_desc: "La corona de espinas clavada en la cabeza de Cristo antes de la Crucifixión. Empeñada por el emperador latino Balduino II a los venecianos, fue rescatada por Luis IX de Francia, que caminó descalzo ante ella hasta París y construyó la Sainte-Chapelle como su relicario."

 MB_artifact_black_stone_qarmatian_name: "Piedra Negra de la Kaaba"

 MB_artifact_black_stone_qarmatian_desc: "La Piedra Negra, arrancada de la esquina de la Kaaba cuando los qarmatas de Bahréin saquearon La Meca durante el Hajj del año 930 y la llevaron a su capital, Hajar."

 MB_artifact_horses_saint_mark_name: "Caballos de San Marcos"

 MB_artifact_horses_saint_mark_desc: "Cuatro caballos de bronce dorado de factura antigua que se alzaban sobre las puertas de salida del Hipódromo de Constantinopla, hasta que los venecianos se los llevaron tras el saqueo de 1204 y los colocaron en la fachada de San Marcos."

 MB_artifact_croes_naid_name: "Croes Naid"

 MB_artifact_croes_naid_desc: "Un fragmento de la Vera Cruz engastado en una cruz de oro, la reliquia más preciada de los príncipes de Gwynedd. Eduardo I se la arrebató a los galeses en 1283 y la llevó en procesión por Londres."

 MB_artifact_reichskreuz_name: "Cruz Imperial"

 MB_artifact_reichskreuz_desc: "Una cruz de oro y gemas hecha para el emperador Conrado II, hueca para alojar la Lanza Sagrada en el travesaño y un fragmento de la Vera Cruz en el fuste, y llevada ante el emperador en su coronación."

 MB_artifact_reichsapfel_name: "Orbe Imperial"

 MB_artifact_reichsapfel_desc: "Un orbe de oro rematado por una cruz con joyas, hecho en Renania para la coronación de los reyes alemanes, que simboliza el dominio del emperador sobre el mundo bajo Cristo."

 MB_artifact_kebra_nagast_name: "Kebra Nagast"

 MB_artifact_kebra_nagast_desc: "La Gloria de los Reyes, que cuenta cómo la reina de Saba dio a Salomón un hijo, Menelik, que llevó el Arca de la Alianza a Axum, y cómo los reyes de Etiopía descienden de él. Traducido al ge'ez durante el reinado de Amda Seyon."

 MB_artifact_sacro_catino_name: "Sacro Catino"

 MB_artifact_sacro_catino_desc: "Un cuenco hexagonal de vidrio verde, que se cree tallado de una sola esmeralda y que sería el plato del que comió Cristo en la Última Cena, y que los genoveses se llevaron como parte del botín en el saqueo de Cesarea en 1101."

 MB_artifact_cathach_name: "Cathach de San Columba"

 MB_artifact_cathach_desc: "El salterio que se dice copiado por el propio San Columba, guardado en un relicario de plata por los O'Donnell de Tir Conaill y llevado tres veces en sentido solar alrededor de su ejército antes de la batalla para traer la victoria."

 MB_artifact_holy_chalice_name: "Santo Cáliz"

 MB_artifact_holy_chalice_desc: "Una copa de ágata sobre un pie de oro, que se considera la copa de la que bebió Cristo en la Última Cena, guardada por los monjes de San Juan de la Peña bajo el patrocinio de los reyes de Aragón."

 MB_artifact_crown_saint_edward_name: "Corona de San Eduardo"

 MB_artifact_crown_saint_edward_desc: "La corona del rey Eduardo el Confesor, guardada por los monjes de Westminster junto con el resto de sus insignias tras ser elevado a los altares, y colocada sobre la cabeza de cada rey de Inglaterra en su coronación en la abadía."

 MB_artifact_crown_charlemagne_france_name: "Corona de Carlomagno"

 MB_artifact_crown_charlemagne_france_desc: "La corona guardada en el tesoro de Saint-Denis y considerada la propia de Carlomagno, con la que han sido coronados los reyes de Francia en Reims desde la coronación de Felipe Augusto."

 MB_artifact_crown_boleslaw_name: "Corona de Boleslao el Bravo"

 MB_artifact_crown_boleslaw_desc: "La corona de los reyes de Polonia, hecha para la coronación de Ladislao el Breve en Cracovia en 1320, cuando se restauró el reino, y llamada así por Boleslao el Bravo, el primer rey de los polacos."

 MB_artifact_cap_monomakh_name: "Gorro de Monómaco"

 MB_artifact_cap_monomakh_desc: "Un gorro de filigrana de oro ribeteado de cebellina, que se cree enviado por el emperador bizantino Constantino Monómaco a su nieto Vladímir Monómaco, y transmitido por los grandes príncipes como signo de su gobierno."
###########################################################################
