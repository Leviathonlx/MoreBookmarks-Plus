l_spanish:
 MB_artifact_relic_veronica_name: "Velo de la Verónica"
 MB_artifact_relic_veronica_desc: "El paño con el que la Verónica enjugó el rostro de Cristo en el camino del Calvario, que conservó la huella de sus facciones. Se guarda en San Pedro y se muestra a los peregrinos de Roma."
 MB_artifact_relic_descension_stone_name: "Piedra de la Descensión"
 MB_artifact_relic_descension_stone_desc: "La piedra sobre la que la Virgen María posó los pies cuando descendió a la catedral de Toledo para revestir al arzobispo Ildefonso con una casulla del cielo."
 MB_artifact_relic_axion_estin_name: "Axion Estin"
 MB_artifact_relic_axion_estin_desc: "El icono de la Madre de Dios en Karyes, ante el cual el arcángel Gabriel se apareció a un monje de la Montaña Sagrada y le enseñó el himno «Es verdaderamente digno», escribiendo sus palabras con el dedo sobre una pizarra de piedra."
 MB_artifact_relic_vladimir_theotokos_name: "Theotokos de Vyshhorod"
 MB_artifact_relic_vladimir_theotokos_desc: "Un icono de la Madre de Dios abrazando tiernamente a su hijo, que el patriarca de Constantinopla envió al gran príncipe Mstislav de Kiev. La tradición sostiene que lo pintó San Lucas sobre una tabla de la mesa de la Sagrada Familia."
 MB_artifact_relic_burning_bush_name: "Rama de la Zarza Ardiente"
 MB_artifact_relic_burning_bush_desc: "Una rama de la zarza que ardía sin consumirse, desde la cual Dios habló a Moisés, y que aún crece dentro de los muros del monasterio de Santa Catalina, al pie del monte Sinaí."
 MB_artifact_relic_nino_cross_name: "Cruz de Santa Nino"
 MB_artifact_relic_nino_cross_desc: "La cruz de sarmientos de vid que Nino ató con sus propios cabellos cuando vino a convertir a los georgianos, y que la Iglesia georgiana conserva desde entonces."
 MB_artifact_relic_geghard_lance_name: "Lanza Sagrada de Geghard"
 MB_artifact_relic_geghard_lance_desc: "La lanza que traspasó el costado de Cristo, que los armenios sostienen que fue llevada a Armenia por el apóstol Tadeo y que dio su nombre al monasterio de Geghard."
 MB_artifact_relic_varag_sign_name: "Signo Sagrado de Varag"
 MB_artifact_relic_varag_sign_desc: "Un fragmento de la Vera Cruz que Santa Hripsime llevó a Armenia, oculto en el monte Varag, cerca de Van, y hallado de nuevo en 653 en una visión de cruces de luz."
 MB_artifact_relic_ani_cross_name: "Vera Cruz de Ani"
 MB_artifact_relic_ani_cross_desc: "Un fragmento de la Vera Cruz que el príncipe Ablgharib Pahlavuni trajo de Constantinopla, para el cual construyó la iglesia del Santo Redentor en Ani."
 MB_artifact_relic_karapet_relics_name: "Reliquias del Precursor"
 MB_artifact_relic_karapet_relics_desc: "Reliquias de Juan el Bautista que Gregorio el Iluminador trajo de Cesarea y depositó en Mush, fundando el monasterio de Surb Karapet, el Santo Precursor, la mayor peregrinación de Armenia."
 MB_artifact_relic_gandzasar_head_name: "Cabeza del Precursor"
 MB_artifact_relic_gandzasar_head_desc: "La cabeza de Juan el Bautista, que según la tradición fue llevada a Khachen y enterrada bajo la catedral de Gandzasar, construida por el príncipe Hasan-Jalal."
 MB_artifact_relic_lalibela_cross_name: "Cruz de Lalibela"
 MB_artifact_relic_lalibela_cross_desc: "La cruz procesional del rey Gebre Mesqel Lalibela, que talló las iglesias de Roha en la roca viva para que fueran una Nueva Jerusalén."
 MB_artifact_relic_abgar_letter_name: "Carta de Cristo a Abgar"
 MB_artifact_relic_abgar_letter_desc: "La carta que se dice que Cristo escribió al rey Abgar de Edesa, prometiéndole que su ciudad jamás sería tomada por un enemigo."
 MB_artifact_relic_barsauma_hand_name: "Mano derecha de Mor Barsauma"
 MB_artifact_relic_barsauma_hand_desc: "La mano derecha de Barsauma, padre de los monjes siríacos, guardada en su monasterio cerca de Melitene, donde los patriarcas sirio-ortodoxos eran consagrados por su contacto."
 MB_artifact_relic_john_manna_name: "Maná de San Juan"
 MB_artifact_relic_john_manna_desc: "El polvo fragante que se elevaba cada año de la tumba vacía de Juan el Evangelista en Éfeso el día de su fiesta, recogido por los peregrinos como cura para toda enfermedad."
 MB_artifact_relic_thomas_mount_cross_name: "Cruz Sangrante de Santo Tomás"
 MB_artifact_relic_thomas_mount_cross_desc: "Una cruz tallada en piedra con una inscripción en pahlavi, de la colina cercana a Mylapore donde fue martirizado el apóstol Tomás, de la que se dice que suda sangre el día de su fiesta."
 MB_artifact_relic_angels_cross_name: "Cruz de los Ángeles"
 MB_artifact_relic_angels_cross_desc: "Una cruz de oro y gemas que el rey Alfonso II de Asturias entregó a su iglesia de San Salvador de Oviedo, que se dice forjada por dos ángeles que llegaron al palacio del rey disfrazados de orfebres peregrinos."
 MB_artifact_relic_victory_cross_name: "Cruz de la Victoria"
 MB_artifact_relic_victory_cross_desc: "La cruz de roble que se dice que Pelayo portó en Covadonga, la primera victoria sobre los moros, recubierta de oro y gemas por el rey Alfonso III de Asturias y entregada a la iglesia de San Salvador de Oviedo."
 MB_artifact_relic_khakhuli_name: "Tríptico de Khakhuli"
 MB_artifact_relic_khakhuli_desc: "El icono de la Madre de Dios del monasterio de Khakhuli, en Tao, que el rey David el Constructor llevó a su monasterio de Gelati, engastado en un gran tríptico de oro y esmalte adornado por los reyes de Georgia."
 MB_artifact_relic_holy_ampulla_name: "Santa Ampolla"
 MB_artifact_relic_holy_ampulla_desc: "El frasco de crisma que una paloma trajo del cielo a San Remigio para el bautismo de Clodoveo, guardado en la abadía de Saint-Remi, en Reims, con el cual es ungido cada rey de Francia en su coronación."
 MB_artifact_relic_aaron_rod_name: "Vara de Aarón"
 MB_artifact_relic_aaron_rod_desc: "La vara de almendro de Aarón, que brotó, floreció y dio almendras maduras en una sola noche en el Tabernáculo para mostrar que Dios había elegido a la casa de Leví para el sacerdocio."
 MB_artifact_relic_ezekiel_torah_name: "Torá de Ezequiel"
 MB_artifact_relic_ezekiel_torah_desc: "Un Sefer Torá guardado en la tumba del profeta Ezequiel en al-Kifl, que según la tradición fue escrito de puño y letra del propio profeta durante el exilio en Babilonia."
 MB_artifact_relic_ezra_torah_name: "Torá de Esdras el Escriba"
 MB_artifact_relic_ezra_torah_desc: "Un rollo de la Torá que los judíos de Egipto consideraban escrito por Esdras el Escriba, quien restauró la Ley en Israel a la vuelta de Babilonia, y entregado por él a su congregación de Fustat."
 MB_artifact_relic_maimonides_mishneh_torah_name: "Mishné Torá de Maimónides"
 MB_artifact_relic_maimonides_mishneh_torah_desc: "Una copia de la Mishné Torá con la firma de Moisés ben Maimón, que atestigua que fue cotejada con su propio libro: su gran código de toda la ley de la Torá, completado en Fustat hacia 1180."
 MB_artifact_relic_kashmar_cypress_name: "Ciprés de Kashmar"
 MB_artifact_relic_kashmar_cypress_desc: "Una rama del gran ciprés de Kashmar, que Zoroastro trajo del paraíso y plantó para señalar la conversión del rey Vishtaspa, y que había crecido durante más de mil años."
 MB_artifact_relic_adur_burzen_mihr_name: "Brasas del Adur Burzen-Mihr"
 MB_artifact_relic_adur_burzen_mihr_desc: "Brasas traídas del Adur Burzen-Mihr, en el monte Rivand, el gran fuego de los agricultores, en el que según la tradición el rey Vishtaspa fue entronizado cuando recibió la fe de Zoroastro."
 MB_artifact_relic_adur_gushnasp_name: "Brasas del Adur Gushnasp"
 MB_artifact_relic_adur_gushnasp_desc: "Brasas traídas del Adur Gushnasp, en Shiz, el gran fuego de los guerreros y reyes, que según la tradición Kay Josrow fundó sobre las ruinas de una fortaleza de demonios que había derribado."
 MB_artifact_relic_fereydun_mace_name: "Gorz-e Gavsar"
 MB_artifact_relic_fereydun_mace_desc: "La maza con cabeza de buey de Fereydún, con la que abatió al rey-serpiente Zahhak antes de encadenarlo bajo el monte Damavand."
 MB_artifact_relic_muqanna_veil_name: "Velo de al-Muqanna"
 MB_artifact_relic_muqanna_veil_desc: "El velo de seda verde que Hashim ibn Hakim llevaba siempre sobre el rostro, diciendo que ningún mortal podía mirar su resplandor y vivir, y del cual recibió el nombre de al-Muqanna, el Velado."
 MB_artifact_relic_rishabhanatha_paduka_name: "Charan Paduka de Rishabhanatha"
 MB_artifact_relic_rishabhanatha_paduka_desc: "La Charan Paduka bajo el árbol Rayan, en el monte Shatrunjaya, una piedra con la huella de los pies de Rishabhanatha, el primer Tirthankara, de quien se dice que predicó muchas veces en la montaña."
 MB_artifact_relic_neminatha_paduka_name: "Charan Paduka de Neminatha"
 MB_artifact_relic_neminatha_paduka_desc: "La Charan Paduka de la cumbre del monte Girnar, una piedra con la huella de los pies de Neminatha, el vigésimo segundo Tirthankara, que renunció allí al mundo el día de su boda y alcanzó el moksha en su cima."
 MB_artifact_relic_mahavira_paduka_name: "Charan Paduka de Mahavira"
 MB_artifact_relic_mahavira_paduka_desc: "La Charan Paduka de Pavapuri, una piedra con la huella de los pies de Mahavira, el vigésimo cuarto Tirthankara, que marca el lugar donde alcanzó el nirvana."
 MB_artifact_relic_bhadrabahu_paduka_name: "Charan Paduka de Bhadrabahu"
 MB_artifact_relic_bhadrabahu_paduka_desc: "Una piedra con la huella de los pies de Bhadrabahu, el último de los Shrutakevalins, de la cueva de Shravanabelagola donde ayunó hasta la muerte tras conducir a la comunidad jaina hacia el sur para huir de la hambruna."
 MB_artifact_relic_siddhahema_name: "Siddhahema"
 MB_artifact_relic_siddhahema_desc: "El Siddhahema-shabdanushasana, la gran gramática del sánscrito y el prácrito compuesta por el monje jaina Hemachandra para Jayasimha Siddharaja, que la hizo pasear por Anahilapataka a lomos del elefante real."
 MB_artifact_relic_andal_garland_name: "Guirnalda de Andal"
 MB_artifact_relic_andal_garland_desc: "Una guirnalda como las que Andal tejía para Vishnu en Srivilliputhur y se ponía ella misma antes de ofrecerla, y que el Señor prefería, según se dice, a todas las demás. Su templo ha enviado desde entonces tales guirnaldas a los demás santuarios del Señor."
 MB_artifact_relic_tiruvasagam_name: "Tiruvasagam"
 MB_artifact_relic_tiruvasagam_desc: "Hojas de palma del Tiruvasagam, los himnos de Manikkavasagar, que según la tradición el propio Shiva puso por escrito en Chidambaram de labios del santo y firmó de su puño y letra."
 MB_artifact_relic_gorakhnath_dhuni_name: "Akhand Dhuni de Gorakhnath"
 MB_artifact_relic_gorakhnath_dhuni_desc: "Brasas del fuego eterno de Gorakhnath, que los yoguis Nath mantienen encendido desde que el maestro lo prendió por primera vez, y del que llevan fuego a cada nueva sede de la orden."
 MB_artifact_relic_padmasambhava_phurba_name: "Phurba de Padmasambhava"
 MB_artifact_relic_padmasambhava_phurba_desc: "Una daga ritual de tres filos de Padmasambhava, el Guru Precioso, que usó la phurba para obligar bajo juramento a los demonios del Tíbet a proteger el dharma antes de la fundación de Samye."
 MB_artifact_relic_kukai_sanko_name: "Hiko Sanko"
 MB_artifact_relic_kukai_sanko_desc: "El vajra volador de tres puntas de Kukai, que lanzó hacia el este desde la costa de Mingzhou antes de zarpar de regreso a casa desde China, y que volvió a encontrar prendido en un pino del monte Koya, donde fundó su monasterio."
 MB_artifact_relic_milarepa_robe_name: "Tela de algodón de Milarepa"
 MB_artifact_relic_milarepa_robe_desc: "La única tela de algodón que Milarepa vestía durante los inviernos del Himalaya, abrigado por el fuego interior del tummo, por lo que lo llamaban el Vestido de Algodón."
 MB_artifact_relic_tripitaka_koreana_name: "Tripitaka Koreana"
 MB_artifact_relic_tripitaka_koreana_desc: "Impresiones de los ochenta mil bloques de madera del canon budista grabados por la corte de Goryeo durante las invasiones mongolas, con la esperanza de que Buda hiciera retroceder a los invasores como había hecho retroceder a los kitán cuando se realizó el primer grabado."
 MB_artifact_relic_ranjatai_name: "Ranjatai"
 MB_artifact_relic_ranjatai_desc: "Un gran tronco de madera de áloe traído de los mares del sur, guardado en el tesoro Shosoin de Todai-ji desde el reinado del emperador Shomu, del cual solo los emperadores y los más poderosos del reino pueden cortar una astilla de incienso."
 MB_artifact_relic_emille_bell_name: "Campana Divina del rey Seongdeok"
 MB_artifact_relic_emille_bell_desc: "La gran campana de bronce fundida en memoria del rey Seongdeok de Silla, cuya voz se dice que se oye a cuarenta li, y a la que según la leyenda dio su sonido un niño arrojado al bronce fundido."
 MB_artifact_relic_tianshi_seal_name: "Sello del Maestro Celestial"
 MB_artifact_relic_tianshi_seal_desc: "El Sello de la Comandancia de Yangping, transmitido por Zhang Daoling a sus herederos en el monte Longhu, con el que cada Maestro Celestial sella por turno los registros de ordenación."
 MB_artifact_relic_tianshi_sword_name: "Espada Mata Demonios"
 MB_artifact_relic_tianshi_sword_desc: "La espada que Zhang Daoling recibió de Laozi junto con el Camino de los Maestros Celestiales, y con la que sometió a los reyes demonio de Shu; se transmite junto con el sello a cada Maestro Celestial por turno."
 MB_artifact_relic_lu_dongbin_sword_name: "Espada de Lu Dongbin"
 MB_artifact_relic_lu_dongbin_sword_desc: "La espada del Inmortal Lu Dongbin, con la que corta la codicia, la ira y el deseo, y recorre el mundo matando el mal y ayudando a los necesitados."
 MB_artifact_relic_kusanagi_name: "Kusanagi no Tsurugi"
 MB_artifact_relic_kusanagi_desc: "La Espada Corta Hierba, sacada por Susanoo de la cola de la serpiente de ocho cabezas y entregada a Yamato Takeru en Ise, con la que cortó la hierba ardiente que lo rodeaba y volvió el fuego contra sus enemigos. Una de las tres Insignias Imperiales de Japón."
 MB_artifact_relic_tide_jewels_name: "Kanju y Manju"
 MB_artifact_relic_tide_jewels_desc: "Las joyas que dominan las mareas, pertenecientes al dios del mar, con las que la emperatriz Jingu bajó y subió el mar durante su travesía hacia Silla, llevando su flota hasta la orilla."
 MB_artifact_relic_tobiume_name: "Rama del Tobiume"
 MB_artifact_relic_tobiume_desc: "Una rama del Ciruelo Volador, el árbol que Sugawara no Michizane amaba en su jardín de la capital, y que voló hasta él en una noche en Dazaifu para hacerle compañía en su exilio."
 MB_artifact_relic_nemean_lion_name: "Piel del León de Nemea"
 MB_artifact_relic_nemean_lion_desc: "La piel del León de Nemea, que ninguna hoja podía atravesar, al que Heracles estranguló con sus propias manos como el primero de sus trabajos y que vistió después como armadura."
 MB_artifact_relic_romulus_lituus_name: "Lituus de Rómulo"
 MB_artifact_relic_romulus_lituus_desc: "El bastón curvo de augur con el que Rómulo trazó las regiones del cielo al fundar Roma, guardado por los Salios en el Palatino, donde se halló intacto entre las cenizas después de que los galos incendiaran la ciudad."
 MB_artifact_relic_asclepius_staff_name: "Bastón de Asclepio"
 MB_artifact_relic_asclepius_staff_desc: "El bastón de Asclepio, en torno al cual se enrosca su serpiente sagrada: dios de la curación, hijo de Apolo, cuyo santuario se alza en la ladera de la Acrópolis."
