 illyrian_kingdom.preview.ttc: "Si son propiedad, [GetTitleByKey('d_istria').GetNameNoTier] y [GetTitleByKey('d_vidin').GetNameNoTier] se convertirán cada uno en [de_jure|E] de [GetTitleByKey('k_illyria').GetNameNoTier]"

