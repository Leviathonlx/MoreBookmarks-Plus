 ### BALCANES
 ### Restauración del Principado de Carantania
 asdac_east_europe.9101.t: "Carantania restaurada"

 asdac_east_europe.9101.desc: "Ahora que mi dominio se extiende por el corazón del antiguo principado de Carantania, he proclamado su restauración y me he declarado su príncipe.\n\nDurante demasiado tiempo, los eslovenos hemos vivido bajo el dominio de los alemanes. Ahora podemos tomar las riendas de nuestro propio destino."

 asdac_east_europe.9101.a: "¡Mi legado será recordado durante siglos!"

 asdac_east_europe.9101.b: "¡[restorer.GetFaith.HighGodName] nos bendice!"

 asdac_east_europe.9101.c: "¡Sinceramente, mientras sea [restorer.GetTitleAsNameNoTooltip] de #EMP algún lugar#!..."

 asdac_east_europe.9102.t: "$asdac_east_europe.9101.t$"

 asdac_east_europe.9102.desc: "TEXTO"

 asdac_east_europe.9102.a: "Un patético advenedizo, en el mejor de los casos."

 asdac_east_europe.9102.b: "¡Salve [restorer.GetShortUINameNoTooltip]!"

 asdac_east_europe.9102.c: "Veremos cuánto dura esto..."

 ### Formar el Imperio búlgaro
 DE_decision_event.0006.t: "Surge una nueva Roma"

 DE_decision_event.0006.desc: "Desde los tiempos de Asparuh, nuestro pueblo ha desafiado el poder del Imperio romano de Oriente. Gracias a nuestra fuerza, los griegos han perdido su influencia sobre los Balcanes y nuestro reino ha ocupado su lugar. Ahora nos atrevemos a compararnos con el antiguo Imperio romano, pues tanto el emperador romano de Oriente como el patriarca de Constantinopla contemplan nuestro poder con asombro. Mi familia y yo nos hemos convertido en la potencia hegemónica indiscutible de la península balcánica.\nHa llegado el momento de que se me reconozca como zar de los búlgaros y basileus de los romanos, con todos los honores y la autoridad que esos títulos conllevan. Nuestra capital será conocida como la Tercera Roma y nuestro imperio, como el verdadero Imperio romano: ¡un imperio de búlgaros y romanos!"

 DE_decision_event.0006.a: "Ahora me alzo como emperador de búlgaros y romanos."

 ### Reformar el jaganato ávaro
 DE_decision_event.0007.t: "El jaganato ávaro"

 DE_decision_event.0007.desc: "Los ávaros gobernaron antaño un vasto imperio que se extendía desde las estepas pónticas hasta las fronteras de los germanos. Incapaces de resistir el implacable avance de los francos, nuestro imperio se desmoronó ante nuestros ojos. Nuestra lucha por sobrevivir ha sido larga y penosa, pero hoy dejamos atrás aquellos días de sufrimiento. El jaganato ávaro ha sido restaurado y está preparado para conducir a nuestro pueblo hacia una nueva era de gloria y prosperidad."

 DE_decision_event.0007.a: "¡Por el nuevo jagán!"

 ### Fundación del Reino de Iliria
 found_kingdom_of_illyria_decision: "Formar el Reino de Iliria"

 found_kingdom_of_illyria_decision_desc: "Hace muchos siglos, nos establecimos en estas tierras bajo la soberanía de los romanos. Mucho ha cambiado desde entonces.\n\nA medida que el dominio romano sobre Iliria desaparecía lentamente, establecimos muchas entidades tribales dispares como Raška, Croacia o Zachlumia. Pero divididos somos débiles: ¡ha llegado el momento de unir a nuestro pueblo bajo un único estandarte ilirio!"

 found_kingdom_of_illyria_decision_tooltip: "Iliria se convierte en un [kingdom|E] [de_jure|E]"

 found_kingdom_of_illyria_decision_confirm: "¡Hurra!"

