 ### El fin de Axum
 ce_title_event_abyssinia_name_change.title: "El fin de Axum"

 ce_title_event_abyssinia_name_change.desc: "¡El reinado de los reyes salomónidas ha llegado a su fin! [abyssinia_title.GetName] se ha escapado finalmente de sus manos. Con los salomónidas eliminados, los últimos restos del antiguo Imperio axumita ya no existen. Conmigo como futuro [ROOT.Char.GetTitleAsNameNoTooltip], tenemos un nuevo y brillante destino por delante. Por lo tanto, es justo eliminar #EMP todos y cada uno#! de los recordatorios de su influencia. Incluido el propio nombre."

