 ### Budismo y tradiciones religiosas de Sri Lanka
 sri_lanka.0005.a: "Una nueva era amanece para el [buddhism.GetNameNoTooltip] en esta región."

 sri_lanka.0005.desc.intro: "Durante siglos, la Sangha [buddhism.GetAdjective], la comunidad monástica de [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], ha estado dividida por la rivalidad entre sus tres grandes monasterios: Mahavihara, Abhayagiri y Jetavana.\n\nAunque los tres comparten muchas creencias, como la adhesión al [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName], también difieren en sus doctrinas, rituales y otras prácticas. Las élites, tanto budistas como no budistas, han alimentado estas rivalidades al favorecer a una u otra escuela, convirtiendo las disputas religiosas en un asunto político.\n\n"

 sri_lanka.0014.desc.not_budal_reward: "[budal.GetHerHim] y [budal.GetHerHis] descendientes gozarán de extraordinarios privilegios legales y políticos a perpetuidad.\n\nEstos privilegios han quedado inscritos en una placa de cobre y han sido enviados formalmente a [budal.GetFirstNameNoTooltip], para que nadie pueda cuestionarlos."

 sri_lanka.0014.desc.not_vijayabahu_intro: "Hace años, cuando [vijayabahu.GetTitledFirstName] era apenas un niño y un príncipe, [vijayabahu.GetHerHis] futuro era incierto. Los invasores chola y los señores de la guerra locales suponían una amenaza constante para [vijayabahu.GetHerHis] seguridad. En aquellos años decisivos, uno de los más valientes defensores de [vijayabahu.GetHerHim] fue [budal.GetTitledFirstName].\n\nGracias a la ayuda de [budal.GetFirstNamePossessiveNoTooltip], [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] pudo reunificarse."

 sri_lanka.0016.c: "Este es un nuevo día para [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]."

 sri_lanka.0102.t.bodhi: "El árbol Bodhi"

 sri_lanka.0102.t.dharmadhatu: "El Dharmadhatu"

 sri_lanka.0102.t.tooth: "El diente de Buda"

 sri_lanka.0150.a: "Me pregunto qué equipo habrá ganado esta vez."

 sri_lanka.0150.a.failure: "El equipo de Pattini pierde el juego."

 sri_lanka.0150.a.success: "El equipo de Pattini gana el juego."

 sri_lanka.0150.pattini_games_intro: "En [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], existe la antigua costumbre de organizar juegos rituales en honor a la diosa [GetPlayer.Custom('RICE_pattini')] durante ciertas celebraciones.\n\nLos participantes suelen ser hombres, y estos juegos ofrecen una ocasión para demostrar su destreza. Un equipo representa a la diosa y el otro a su esposo o a alguna otra divinidad masculina. Si vence el equipo de la diosa, se considera un buen augurio para la fertilidad de los campos y la prosperidad del año. Sin embargo, ambos equipos deben competir con seriedad para que el ritual sea considerado legítimo.\n\n"

 ### Socotra y el comercio del océano Índico
 socotra.0005.t: "Piratas del océano Índico"

 socotra.0021.tooltip: "Ofrecer un premio mayor animará a más personas a participar y te proporcionará, como anfitrión, mayor fama. Los premios más cuantiosos otorgan más [prestige|E] y mejores bonificaciones al finalizar la competición, aunque también requieren un mayor gasto de oro."

 ### ORIENTE PRÓXIMO, ISLAM Y ÁFRICA
 ### Fundar el Reino de Omán
 DE_decision_event.0001.t: "El Reino de Omán"

 DE_decision_event.0001.desc: "Durante siglos, el pueblo ibadí ha carecido de un reino propio. Mientras los persas del norte y los califas del oeste sometían nuestras tierras a influencias extranjeras y gobernantes impuestos, otros pueblos se burlaban de nuestras tribus. Pero eso ha llegado a su fin. Las tribus, antes divididas, se arrodillan ahora unidas ante el sultán de Omán. Con mi coronación como [founder.GetTitleAsNameNoTooltip], dará comienzo una edad dorada de prosperidad para todos los fieles de nuestro reino."

 DE_decision_event.0001.a: "¡Por fin!"

 ### Establecer El Cairo
 DE_decision_event.0020.t: "La fundación de El Cairo"

 DE_decision_event.0020.desc: "Desde tiempos inmemoriales, Egipto ha sido considerado la cuna de la civilización. Sus tierras han sido testigo de algunos de los primeros avances de la humanidad en la escritura, la agricultura, la urbanización y el gobierno centralizado. Para inaugurar una nueva era en la larga historia de Egipto, he encargado la construcción de una nueva capital en el corazón del país. Estoy seguro de que, con el tiempo, mi nueva capital eclipsará incluso a Alejandría."

 DE_decision_event.0020.a: "Una nueva capital para una nueva era"

 DE_decision_event.0020.b: "Este será el logro que defina mi legado"

 # Evento musulmán de Sicilia: la moneda
 DE_decision_event.0023.t: "¿Un ducado a cambio de tus pensamientos?"

 DE_decision_event.0023.desc: "Sicilia, situada en el corazón del mar Mediterráneo, ha sido durante mucho tiempo un punto clave para el comercio que atraviesa sus aguas. Ahora parece que [rey_de_sicilia.GetTitledFirstName] ha decidido aprovechar esta circunstancia para introducir una nueva moneda.\nLlamada ducado e inspirada en el trachy bizantino, quizá nos convendría aceptar esta moneda como medio de pago válido en nuestro reino. Tal vez incluso pudiera servirnos de inspiración para acuñar nuestra propia moneda..."

 DE_decision_event.0023.a: "Esto solo puede beneficiar a nuestros bolsillos"

 DE_decision_event.0023.b: "Nuestra vieja moneda sigue siendo igual de válida"

 # Evento musulmán de Sicilia: la fe
 DE_decision_event.0024.t: "Una cuestión de fe"

 DE_decision_event.0024.desc: "Como centro del mar Mediterráneo y de su comercio, mi reino acoge a un gran número de personas que no son cristianas, entre ellas griegos, judíos y musulmanes. Aunque quizá no constituyan la mayoría de sus respectivas comunidades, son muchos los que consideran Sicilia su hogar.\nSin embargo, mi ascenso al trono siciliano no ha traído consigo una paz social y religiosa plena. Me han dicho que incluso ahora hay grupos que esperan restaurar el dominio del islam en la isla.\nMuchos de mis consejeros me han presionado para que tome algún tipo de medida, pero hasta ahora me he resistido. Sin embargo, ha llegado el momento de actuar."

 DE_decision_event.0024.a: "Pueden permanecer en mi reino, pero no en la propia Sicilia"

 DE_decision_event.0024.b: "Todos somos creación de Dios y, como tales, los aceptaré como son"

 DE_decision_event.0024.c: "El islam no tiene cabida en mi reino"

 DE_decision_event.0024.d: "¡El único musulmán bueno es un musulmán muerto!"

 relocate_sicilian_muslims_decision_tooltip: "Reasientas a la población musulmana siciliana en la Italia continental. En ese entorno controlado, no deberían poder desafiar la autoridad real, aunque seguirán contribuyendo a la corona mediante el pago de impuestos y el servicio militar."

 protect_sicilian_muslims_decision_tooltip: "Sean cuales sean tus razones, permites que los musulmanes sicilianos permanezcan en la isla sin sufrir injerencias de la autoridad real. Queda por ver si la población local acepta o condena su presencia."

 exile_sicilian_muslims_decision_tooltip: "Ordenas que todos los musulmanes se conviertan o sean expulsados de Sicilia. Aunque esto favorecerá la cohesión religiosa y, sobre todo, el control real de la isla, sus consecuencias para la economía son imprevisibles."

 massacre_sicilian_muslims_decision_tooltip: "Como dice el buen Libro: \"El Señor es vengativo contra sus enemigos; se ensaña con ellos\". Y los musulmanes son, sin duda, mis enemigos. Bueno, aunque no lo sean, más vale masacrarlos a todos para estar seguros."

 ### Ascenso de los mamelucos
 mamluk_events.0001.t: "De la pobreza a la riqueza"

 mamluk_events.0001.desc: "Los mamelucos fuimos traídos aquí desde nuestros hogares como guerreros esclavos, pero ahora hemos llegado a controlar las tierras de nuestros amos."

 mamluk_events.0001.a: "Que Alá nos guíe"

