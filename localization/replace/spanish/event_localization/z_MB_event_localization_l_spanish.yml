 south_ethiopia.0010.base: "Las tierras del interior de África oriental albergan numerosos pueblos y reinos unidos por vínculos de parentesco y comercio.\n\nUn [courtier.GetWomanMan] de origen [courtier.GetCulture.GetName], llamado [courtier.GetFirstName], ha llegado a mis dominios con la esperanza de ser recibido en mi corte. [courtier.GetSheHe|U] mantiene valiosos vínculos con [courtier.GetHerHis] parientes de su tierra natal, que podrían resultarnos útiles.\n\n"

