################################# EVENTOS #################################
 ### IRÁN Y EL CÁUCASO
 ### Unir los tronos georgianos
 unite_the_georgian_thrones_decision: "Unir los tronos georgianos"

 unite_the_georgian_thrones_decision_desc: "Georgia se encuentra dividida entre dos reinos, cada uno gobernado por su propio monarca. Aunque ambos comparten una misma identidad y tradición, sus coronas permanecen separadas, debilitando al país frente a sus enemigos. La unión de ambos tronos permitirá restablecer la unidad del reino y fortalecer el poder de Georgia."

 unite_the_georgian_thrones_decision_confirm: "Unir los tronos"

 unite_the_georgian_thrones_decision_tooltip: "Los tronos georgianos volverán a unirse."

 unite_the_georgian_thrones_decision_titles_tt: "Cada [title|E] [kingdom|E] georgiano que poseas, salvo tu [primary_title|E], será destruido y sus territorios pasarán a formar parte del [de_jure|E] de tu título principal ([THIS.Char.GetPrimaryTitle.GetNameNoTier])."

 unite_the_georgian_thrones_decision_primary: "Tu [primary_title|E] es un [kingdom|E] ibérico."

 unite_the_georgian_thrones_decision_effects_de_jure_tt: "[title_d_imeretia.GetNameNoTier], [title_d_georgia.GetNameNoTier], [title_d_abkhazia.GetNameNoTier], [title_d_racha.GetNameNoTier], [title_d_mingrelia.GetNameNoTier], [title_d_meshketi.GetNameNoTier], [title_d_kartli.GetNameNoTier], [title_d_kakheti.GetNameNoTier] y [title_d_hereti.GetNameNoTier] pasan a formar parte del [de_jure|E] del #V [title_k_georgia.GetName]#."

 mb_events.0001.t: "Una Georgia unida"

 mb_events.0001.desc: "Los tronos de Georgia vuelven a estar unidos bajo un solo [ROOT.Char.GetTitleAsNameNoTooltip]. Las coronas rivales han quedado reunidas bajo una misma autoridad y el [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ejerce ahora su dominio sobre todas las tierras georgianas."

 mb_events.0001.a: "Una sola corona para Georgia."

 ### Establecer Transcaucasia
 DE_decision_event.0025.t: "Un Imperio Propio"

 DE_decision_event.0025.desc: "Durante siglos, nuestra patria ha sido escenario de rivalidades políticas, militares, religiosas y culturales, y de expansionismo por parte de cualquier potencia que considerara oportuno tratar de imponer su voluntad... pero ya no. Por mi mano, guiada por mis antepasados, las tierras de Transcaucasia se mantienen unificadas e independientes quizá por primera vez en la historia. Nunca más mi pueblo será ignorado y descontado; dejado a merced de poderes mayores que utilizan sus tierras como su campo de batalla personal. Dirigida por mí y mis descendientes, Transcaucasia se ganará su lugar entre los grandes imperios de la historia."

 DE_decision_event.0025.a: "¡Estamos unidos!"

 ### Ascenso de Adharestán
 iranian_flavour.0001.t: "El ascenso de Adharestán"

 iranian_flavour.0001.desc: "En la antigüedad, las tierras noroccidentales de Irán estaban habitadas por diversos pueblos, como los medos, los cadusios y los albanos, entre otros. Cuando cayó el Imperio aqueménida, Atropates, sátrapa de Media, siguió gobernando el norte de la antigua satrapía que pasaría a llamarse Atropatene.\n\nDesde entonces, los lugareños han sido fuertemente eranianizados y persianizados, dando lugar a las diversas tribus adhari que viven allí en la actualidad. Dividida durante mucho tiempo entre diversas políticas tribales, o gobernada por señores extranjeros sin lazos con la tierra, finalmente he conseguido poner la zona bajo mi dominio, consolidándola en una única entidad política.\n\nYa no estaremos sometidos a los extranjeros, sino que gobernaremos la tierra nosotros mismos. Al igual que Atropates antes que yo, yo también forjaré un Adharestán fuerte e independiente que resista el paso del tiempo."

 iranian_flavour.0001.a: "Atropates estaría orgulloso."

 iranian_flavour.0001.b: "¡Eran aún no está perdido!"

 ### Surgimiento del pueblo talyshi
 iranian_flavour.0002.t: "El Pueblo Talyshi"

 iranian_flavour.0002.desc: "Talysh ha estado habitada por iraníes desde la antigüedad; conocida en su día como Cadusios, la tierra ha sido gobernada por varios imperios y dinastías que han influido de forma variable en la cultura local, dando lugar a Deilami, Adhari, Gilaki y otros.\n\nCon nuestra reciente política de solidificar la zona bajo una única entidad política, los lugareños han empezado a cambiar de nuevo su identidad hacia una nueva talyshi."

 iranian_flavour.0002.a: "¡Deberíamos promover esta tendencia!"

 iranian_flavour.0002.b: "Son las mismas personas que antes."

 ### Restaurar el zoroastrismo
 DE_decision_event.0017.t: "El retorno a la antigua fe"

 DE_decision_event.0017.desc.intro: "No es ningún secreto que he albergado... dudas sobre mi fe [old_faith.GetAdjective]."

 DE_decision_event.0017.desc.excommunicated: "La excomunión ha sido una dura carga para mí. Ha pesado injustamente sobre mi alma y provocado no pocas disputas con otros [old_faith.GetAdherentNamePluralNoTooltip] de mi entorno."

 DE_decision_event.0017.desc.rivalry_with_hof: "Las constantes disputas con [old_faith.GetReligiousHead.GetTitledFirstName], fruto de una mezquina rivalidad por decidir quién de los dos [old_faith.GetReligiousHead.GetSheHe] #EMP debería#! estar por encima, me han dejado profundamente desilusionado."

 DE_decision_event.0017.desc.negative_piety_level: "Mis actos me han señalado como un pecador, alguien cuya fe parece dispuesta a abandonarlo en su camino espiritual. No puedo negar lo aislado que me he sentido."

 DE_decision_event.0017.desc.lorgar: "Aunque el fuego de mi fe arde con tanto fulgor como el Sol, no puedo evitar sentir que el universo encierra algo #EMP más#! que [old_faith.HighGodName]. Una verdad más antigua y primordial."

 DE_decision_event.0017.desc.sinful_traits: "Siento que cada uno de mis actos, cada uno de mis pensamientos y mi propia forma de vida son considerados inherentemente pecaminosos."

 DE_decision_event.0017.desc.virtuous_basque_pagan_traits: "A veces me pregunto cómo pude llegar a amarla, cuando toda mi personalidad parece #EMP hecha#! para algo distinto."

 DE_decision_event.0017.desc.naked_cynicism: "Me resulta una fe poco interesante y, peor aún, parece completamente sometida a poderes sobre los que apenas tengo control."

 DE_decision_event.0017.desc.outro: "Por fin, sin embargo, creo haber encontrado consuelo en [mazdayasna.GetName]. Quienes siguen esta antigua fe de Erán no me juzgan; en ellos solo encuentro esperanza y el anhelo de recuperar una época semejante a la del Imperio sasánida."

 DE_decision_event.0017.a: "¡[mazdayasna.GetNameNoTooltip] ya no será perseguido!"

 ### IMPERIO ROMANO
 ### Restaurar el Imperio romano
 custom_nb_restore_byzantine_decision_desc: "Debemos reunificar el Imperio y recuperar la grandeza de Roma."

 custom_nb_restore_byzantine_decision_tooltip: "Restaurar el poder del Imperio romano."

 custom_nb_restore_byzantine_decision_effect_tooltip: "Restaurar el poder del Imperio romano."

 custom_nb_restore_byzantine_decision_confirm: "¡Ha llegado la hora de devolver al Imperio su antigua grandeza!"

 custom_nb_restore_byzantine_decision.0001.l: "El Imperio romano perdurará para siempre."

 custom_nb_restore_byzantine_decision.0001.l.tt: "El Imperio romano perdurará para siempre."

 custom_nb_byzantine_decision_opinions_vassals: "Todos los vasallos del Imperio romano restaurado"

 custom_nb_byzantine_decision_opinions: "Emperador romano"

 asdac_roman_restoration.1001.t: "El Imperio romano reunificado"

 asdac_roman_restoration.1001.desc: "Una vez más, los estandartes del Imperio romano ondean sobre Constantinopla. [scoped_emperor.GetTitledFirstName] ha reunificado los antiguos dominios imperiales, y el Imperio romano vuelve a alzarse con fuerza, dispuesto a someter a sus antiguos enemigos tanto en Oriente como en Occidente.\n\nEl Imperio romano de Oriente sufrió una derrota tras otra, hasta perder gran parte de sus territorios ante los numerosos estados hostiles que lo rodeaban. Pero, al igual que en tiempos pasados, sus enemigos no pudieron impedir que recuperase su poder y volviese a ocupar un lugar destacado en el mundo.\n\nEl Imperio romano vuelve a ser uno e indivisible. ¡Salve [scoped_emperor.GetTitledFirstName], emperador de los romanos!"

 asdac_roman_restoration.1001.a: "Todo nuevo comienzo nace del final de otro."

 ### Abandonar Britania
 abandon_britannia_decision: "Abandonar Britania"

 abandon_britannia_decision_confirm: "No hay alternativa"

 abandon_britannia_decision_desc: "El Imperio romano de Occidente está en peligro de ser alcanzado por los bárbaros que yacen fuera de nuestras fronteras. No podemos dejar el destino de nuestras tierras centrales a la suerte, así que nuestras provincias menos productivas económicamente deben ser abandonadas para aliviar la carga y permitir que nuestros ejércitos se centren en la defensa del continente. Britania, aunque leal al Imperio durante siglos, debe prepararse para luchar por su cuenta contra las tribus celtas y germánicas."

 abandon_britannia_decision_tooltip: "Un gran coste quizás, pero hay que hacerlo."

 abandon_britannia_decision_effect_tooltip: "La administración romana abandona la provincia de Britania. La #V Diócesis de $k_britannia$#! es destruida y eliminada de las fronteras [de_jure|E] del Imperio"

 abandon_britannia_decision_effect_tooltip_2: "¡Esto libera considerables tropas y administradores para el resto del Imperio, y te otorgará una gran cantidad de [gold_i|E] [gold|E]\n #F ¡Dejarla ahora liberará #V [gold_i|E][EmptyScope.ScriptValue('abandon_britannia_oro_ganado')|0]#! para nuestro tesoro imperial#!"

 abandon_britannia_decision_effect_tooltip_3: "¡Abandonar la provincia provocará una #N disminución global de las infraestructuras en toda la provincia#!, y varios [edificios|E] serán #N demolidos o desactivados#!"

 ### Reclamación del trono imperial
 central_claim: "Reclama el Trono de [ROOT.Char.GetLiege.GetNameNoTooltip]"

 central_claim_desc: "¡Como parte central del Imperio, has ganado suficiente poder en el reino para presionar tu reclamación sobre la totalidad del Imperio! Ya no se puede confiar en nuestros antiguos gobernantes."

 central_claim_tooltip: "Reclamas el trono de tu señor"

 central_claim_confirm: "¡Reclamaré lo que es mío por derecho!"

 ### Adopción del gobierno burocrático imperial
 change_to_imperial: "Adopta modos burocráticos"

 change_to_imperial_desc: "Tras nuestra integración en los imperios romanos, es hora de dar un giro al futuro de mi reino y dinastía y adoptar sus modos burocráticos."

 change_to_imperial_tooltip: "Adoptas los modos burocráticos"

 change_to_imperial_confirm: "Ya es hora"

 ### Restauración del gobierno burocrático romano
 change_to_imperial_byz: "Restablecer formas burocráticas"

 change_to_imperial_byz_desc: "Tras la disolución de los modos burocráticos del Imperio, es hora de dar un giro al futuro del Imperio y restablecer los modos burocráticos."

 change_to_imperial_byz_tooltip: "Adoptas los modos burocráticos"

 change_to_imperial_byz_confirm: "Ya es hora"

 ### Adopción del gobierno imperial romano
 change_to_imperial_feudal: "Adoptas las maneras romanas [GetGovernment( 'gobierno_imperial' ).GetName]"

 change_to_imperial_feudal_desc: "¡Para cimentar nuestro legado a través de las generaciones, debemos seguir las formas y enseñanzas anteriores del Imperio romano! Es hora de que nuestra dinastía resuene a través de las generaciones."

 change_to_imperial_feudal_tooltip: "Adoptas las formas burocráticas romanas"

 change_to_imperial_feudal_confirm: "Es la hora"

 ### Adopción del gobierno autocrático
 change_to_autocratic: "Adoptas los modos autocráticos"

 change_to_autocratic_desc: "Tras nuestra separación de los imperios romanos, es hora de dar un giro al futuro de mi reino y dinastía y adoptar nuestros propios modos autocráticos."

 change_to_autocratic_tooltip: "Adoptas las formas autocráticas"

 change_to_autocratic_confirm: "Ya es hora"

 ### Restauración de las competencias imperiales
 restore_military_comp: "Restaurar [military_comp|E]"

 restore_military_comp_desc: "Tras nuestra desastrosa incompetencia militar, hemos recuperado nuestra posición y el mundo vuelve a reconocer a nuestro ejército como el mejor."

 restore_military_comp_tooltip: "Restaurar tu [military_comp|E]"

 restore_military_comp_confirm: "¡Por el Imperio!"

 restore_civic_comp: "Restaurar [civic_comp|E]"

 restore_civic_comp_desc: "Tras nuestra desastrosa incompetencia en la administración civil, hemos recuperado nuestra posición y el mundo vuelve a reconocer nuestro reino como el mejor."

 restore_civic_comp_tooltip: "Restaurar tu [civic_comp|E]"

 restore_civic_comp_confirm: "¡Por el Imperio!"

 restore_diplo_comp: "Restaurar [diplo_comp|E]"

 restore_diplo_comp_desc: "Tras nuestra desastrosa incompetencia diplomática, tanto dentro como fuera de nuestro reino, los gobernantes cercanos y lejanos vuelven a confiar en nosotros. Nuestras relaciones con otras potencias han mejorado y nuestra diplomacia vuelve a ser considerada la mejor."

 restore_diplo_comp_tooltip: "Restaurar tu [diplo_comp|E]"

 restore_diplo_comp_confirm: "¡Por el Imperio!"

 ### Reliquias imperiales romanas
 find_aurelian_helmet: "Encontrar el casco de Aureliano"

 find_aurelian_helmet_tooltip: "Enviar a tu anticuario en busca del casco del emperador Aureliano, perdido hace mucho tiempo."

 find_aurelian_helmet_desc: "Envía a tu anticuario en busca del casco perdido del emperador Aureliano. No hay garantías de encontrarlo, pero recuperarlo supondría revivir el poder, la grandeza y la gloria de su reinado."

 find_aurelian_helmet_confirm: "¡Que comience la búsqueda!"

 forge_roman_regalia: "Forjar las insignias imperiales romanas"

 forge_roman_regalia_desc: "¡El Imperio está unido! Ha llegado el momento de dejar atrás los tiempos oscuros que hemos atravesado. Sin embargo, por mucho que intentemos seguir adelante, las antiguas insignias siguen ahí, recordándonos y atormentándonos con los recuerdos del pasado. Me he reunido con mis consejeros para poner fin a todo esto."

 forge_roman_regalia_tooltip: "¡El Imperio está unido! Sin embargo, las antiguas insignias siguen recordándonos los tiempos oscuros del pasado."

 forge_roman_regalia_confirm: "Es hora de pasar página."

 ### El Espectáculo de la Novia
 ce_host_a_bride_show.0001.t: "El Espectáculo de la Novia"

 ce_host_a_bride_show.0001.desc: "Espero ansioso mientras las mujeres que pronto podrían ser mi esposa se filtran por las puertas hacia uno de los muchos espléndidos salones del palacio imperial. En los últimos días, los miembros más cercanos de mi familia y mis consejeros han hecho una selección de las jóvenes tras haber enviado funcionarios a reunir a las mujeres más bellas y bien nacidas de las provincias. Mi canciller, [canciller_imperial.GetTitledFirstName], anuncia a cada candidata con su nombre, familia, puesto y cualidades notables. Pero no importa lo que mis allegados piensen de las mujeres que tengo ante mí, la elección final depende de mí.\nEn mis manos descansa la acostumbrada manzana de oro. Al igual que Paris en su infame Juicio, ahora debo decidir a quién se le concederá la manzana y ascenderá a la posición de emperatriz..."

 ce_host_a_bride_show.0001.a: "[bride_1.GetTitledFirstName] será mi esposa"

 ce_host_a_bride_show.0001.b: "[bride_2.GetTitledFirstName] es mi elección"

 ce_host_a_bride_show.0001.c: "[bride_3.GetTitledFirstName] es mi elección"

 ce_host_a_bride_show.0001.d: "¡Ninguna de estas candidatas es la adecuada!"

 ce_refuse_to_marry_any_option_tt: "Te niegas a casarte con cualquiera de las opciones que tienes delante"

 ### La conquista de Constantinopla
 DE_decision_event.0018.t: "La conquista de Constantinopla"

 DE_decision_event.0018.desc: "Decenas de ejércitos han intentado tomar Constantinopla y han fracasado. Nuestros propios antepasados sucumbieron ante estas murallas, al igual que tantos otros que intentaron conquistar esta gran ciudad. Hoy hemos vengado sus derrotas. Así lo ha querido Alá.\n\nEl Profeta dijo: \"Conquistarás Constantinopla. ¡Qué magnífico líder será su líder y qué magnífico ejército será ese ejército!\" Ahora debemos emplear nuestras manos y nuestras mentes para forjar una nueva era a partir de las cenizas. La Manzana Roja ha sido entregada a los fieles."

 DE_decision_event.0018.a: "¡Alá es grande!"

 ### LA RUS
 ### La formación de la Rus
 global_culture.5001.t: "$global_culture.5000.t$"

 global_culture.5001.desc: "Estamos lejos de las tierras que nuestros antepasados nórdicos llamaban hogar, pero consideramos las tierras de Garðar nuestro país. Como líder de mi pueblo, es mi responsabilidad asegurar su prosperidad futura y, para ello, debemos adaptarnos a nuestro nuevo entorno. También debemos aprender de quienes conocen estas fértiles tierras desde tiempos antiguos.\n\nCon este decreto, adoptaremos nuevas costumbres y formas de vida en beneficio de nuestro pueblo. Forjaremos nuestro propio camino como un nuevo pueblo."

 global_culture.5001.a: "¡Desde hoy, nos llamamos rus!"

 global_culture.5001.b: "No debemos dar la espalda a nuestras antiguas tribus."

 global_culture.5002.t: "$global_culture.5001.t$"

 global_culture.5002.desc: "Un grupo de colonos nórdicos procedentes de Escandinavia se ha asentado en las vastas tierras de Europa oriental y ha establecido allí un nuevo hogar.\n\nSu líder, [russian_founder.GetTitledFirstName], ha decretado que [russian_founder.GetHerHis] pueblo adopte diversas costumbres y tradiciones locales para prosperar en estas nuevas tierras."

 global_culture.5002.a: "¿Qué significa esto para la región?"

 ### Surgimiento del pueblo de la Rus
 rus_culture.0002.t: "El Pueblo de Rus"

 rus_culture.0002.desc: "Han pasado muchas décadas desde que los nórdicos invadieron las tierras de los eslavos orientales. Pero a medida que ha pasado el tiempo, los nórdicos han ido adoptando cada vez más la lengua y las costumbres de los lugareños; simultáneamente, los nórdicos han prestado sus conocimientos en gobierno y guerra a los eslavos a los que gobiernan, creando una nueva identidad que trasciende la antigua."

 rus_culture.0002.a: "¡Debemos abrazar estos cambios dentro de nuestro reino!"

 rus_culture.0002.b: "Deberíamos seguir con las viejas costumbres..."

 ### La formación de la Rus de Kiev
 global_culture.5000.t: "El auge de la Rus de Kiev"

 global_culture.5000.desc: "Las tierras de Garðar han ofrecido a nuestro pueblo un territorio fértil y propicio para asentarse y expandirse.\n\nAl adoptar algunas de las tradiciones de sus habitantes, podremos integrarnos mejor en esta región."

 global_culture.5000.a: "¡Por los nuevos amigos y los nuevos comienzos!"

 global_culture.5003.t: "La expansión de la cultura [russian.GetNameNoTooltip]"

 global_culture.5003.desc: "El auge de la Rus de Kiev ha provocado una transformación cultural en Europa oriental.\n\n¡Los habitantes de [county_to_change.GetName] ya no se consideran [old_culture.GetName], sino que ahora se identifican con el pueblo [russian.GetCollectiveNoun]!"

 global_culture.5003.a: "Un desarrollo interesante..."

 global_culture.5010.a: "¡Maravilloso!"

 ### El establecimiento de la cultura rusa
 establish_russian_culture_decision: "Establecer la cultura de la Rus"

 establish_russian_culture_decision_desc: "Nuestras antiguas tradiciones ya no bastan para desenvolvernos en nuestro nuevo hogar. Debemos observar a los pueblos de estas tierras y aprender de sus costumbres."

 establish_russian_culture_decision_confirm: "¡La Rus de Kiev se alza!"

 establish_russian_culture_decision_tooltip: "Fusionar nuestra cultura nórdica con la de las tribus rus locales."

 establish_russian_culture_decision_effect.tt: "Muchos [old_culture_1.GetName] y otros condados y personajes eslavos orientales de la Rus de Kiev adoptarán la cultura [new_culture.GetName]."

 establish_russian_culture_decision_effect.tt.2: "[normandy_title.GetName] pasa a llamarse $d_normandy$"

 ### La evolución de la Rus de Nóvgorod
 global_culture.5004.t: "El auge de Nóvgorod"

 global_culture.5004.desc: "La unificación política de la región propició que sus clases dirigentes adoptaran una serie de dialectos estrechamente emparentados. Sin embargo, la lengua de Nóvgorod evolucionó de manera distinta a la hablada en la Rus de Kiev, al sur."

 global_culture.5004.a: "¡Somos novgorodianos, ahora y siempre!"

 global_culture.5004.b: "No debemos dar la espalda a la Rus de Kiev."

 global_culture.5005.t: "$global_culture.5004.t$"

 global_culture.5005.desc: "Aunque comparte sus orígenes con la Rus de Kiev, la región de Nóvgorod se ha diferenciado de las tierras meridionales hasta desarrollar una cultura y una lengua propias."

 global_culture.5005.a: "¿Serán capaces de prosperar por sí mismos?"

 ### La división de la Rus
 global_culture.8002.t: "El destino de la Rus"

 global_culture.8002.desc: "La Rus ya no es la que fue. Sus antiguas tierras se encuentran divididas y sus gentes han tomado caminos distintos. Aunque todavía nos une el recuerdo de un pasado común, las diferencias entre nuestros pueblos son cada vez mayores. Hoy nos reconocemos como [great_russian.GetCollectiveNoun], [ukrainian.GetCollectiveNoun] y [belarusian.GetCollectiveNoun], cada uno con su propia identidad."

 global_culture.8002.a: "$global_culture.0002.a$" #placeholder

 global_culture.8002.b: "$global_culture.0002.b$" #placeholder

 global_culture.8005.t: "$global_culture.8002.t$"

 global_culture.8005.desc: "$global_culture.8002.desc$" #placeholder

 global_culture.8005.a: "$global_culture.3005.a$" #placeholder

 global_culture.8005.desc_russian: "$global_culture.8002.desc$" #placeholder

 global_culture.8005.b: "$global_culture.0015.b$" #placeholder

 ### FRANCIA, LORENA E ITALIA
 ### De los francos a los franceses
 global_culture.5007.t: "Los franceses"

 global_culture.5007.desc: "Los francos hicieron de la antigua Galia su hogar y, con el paso de las generaciones, se mezclaron con los galorromanos que habitaban estas tierras. De esa unión nacieron nuevas costumbres y una lengua propia, que nos distinguen cada vez más de nuestros antepasados.\n\nYa no somos los francos de antaño. Somos un pueblo con una identidad propia, forjada en estas tierras. Ha llegado el momento de dejar atrás las antiguas divisiones y reconocernos como franceses."

 global_culture.5007.a: "¡Somos franceses, ahora y siempre!"

 global_culture.5007.b: "No debemos dar la espalda a nuestro pasado."

 global_culture.5008.t: "$global_culture.5007.t$"

 global_culture.5008.desc: "Los francos y los galorromanos de estas tierras han acabado compartiendo una misma lengua y unas mismas costumbres. Sus antiguas diferencias se desvanecen y ambos pueblos comienzan a reconocerse bajo una nueva identidad: la francesa."

 global_culture.5008.a: "¿Serán capaces de prosperar por sí mismos?"

 ### Integrar Aquitania
 DE_decision_event.0008.t: "Unidos en uno"

 DE_decision_event.0008.desc: "Desde la conquista carolingia de Aquitania, estas tierras han sido escenario de disputas y conflictos entre la nobleza y sus soberanos. El reino de Aquitania no ha hecho más que dividir a nuestro pueblo, pero eso se acaba hoy. A partir de ahora, todos los francos estarán unidos bajo la corona de Francia Occidental."

 DE_decision_event.0008.a: "Que nunca volvamos a dividirnos."

 ### Restaurar el Reino de Aquitania
 DE_decision_event.0009.t: "No volveremos a someternos"

 DE_decision_event.0009.desc: "Durante demasiado tiempo, el pueblo de Aquitania ha vivido sometido al dominio de reyes del norte de Francia, distantes y ajenos a sus intereses. Siglos de dominio extranjero han convertido la idea de un reino independiente en un sueño lejano. Pero eso se acaba hoy. Bajo mi liderazgo, una Aquitania libre e independiente dejará de ser un sueño. Nuestro pueblo es ahora libre y está preparado para labrarse su propio destino entre las grandes potencias de Europa."

 DE_decision_event.0009.a: "Solo nosotros decidiremos nuestro destino."

 ### Conflictos dinásticos y guerras por Lorena
 LT.0003.t: "El traidor de Lorena"

 LT.0003.desc: "El traidor duque Giselberto de Lorena abandonó nuestro servicio tras la muerte de nuestro estimado padre, el rey Enrique. Ahora ha buscado la protección de los carolingios de Francia Occidental y les ha pedido ayuda contra nosotros.\n\nNo solo ha renegado de su lealtad a nuestra casa, sino que nuestros espías nos informan de que Giselberto ha estado conspirando con señores traidores del reino. El insulto es demasiado grave para tolerarlo por más tiempo. Ha llegado la hora de recuperar lo que legítimamente nos pertenece."

 LT.0003.a: "Lorena no debe quedar en manos de los carolingios ni de sus vasallos."

 LT.0003.b: "Cumpliremos nuestra parte del pacto."

 LT.0003.b.tt: "Giselberto y Lorena serán dejados en paz."

 LT.0004.t: "Ataque de los alemanes"

 LT.0004.desc: "Los informes de nuestros exploradores en el este confirman nuestras sospechas: Otón prepara un ataque contra nuestras tierras. Durante mucho tiempo, el rey de los germanos ha buscado un pretexto para someter de nuevo a Lorena a su autoridad, pero ahora parece haber abandonado toda cautela.\nEs hora de reunir a nuestros hombres y defendernos. Lorena es nuestra, y nos aseguraremos de que los alemanes paguen caro cada paso que den en ella."

 LT.0004.a: "No pondrán un pie en nuestras tierras sin oposición."

 ### Intervención franca en Italia
 LT.0012.t: "El Reino de Italia"

 LT.0012.desc: "Bajo el desastroso gobierno de [italian_king.GetTitledFirstName], Italia se ha convertido en una sombra de lo que fue. El glorioso legado de los romanos y sus descendientes ha quedado hecho añicos por las guerras civiles y el caos de las últimas décadas.\n\nAhora, muchos de los señores menores de Italia sometidos a su autoridad nos han enviado emisarios en busca de ayuda. Al parecer, añoran los días en que vivían bajo nuestro lejano dominio. Si queremos volver a enarbolar los estandartes de Carlomagno, el Reino de Italia será esencial para extender nuestra influencia en la península."

 LT.0012.a: "Preparad a nuestros hombres. Italia quedará asegurada para bien de todos."

 LT.0012.b: "Esta región no nos interesa. Que sigan enzarzados en sus mezquinas disputas."

 LT.0013.t: "La invasión de Otón"

 LT.0013.desc: "Otón, el rey de los germanos al norte de nuestras fronteras, nos ha declarado la guerra. Proclama a los cuatro vientos que actúa por el bien del pueblo italiano y pretende liberar a Italia del dominio de [italian_king.GetTitledFirstName].\n\nLos alemanes se preparan para cruzar los Alpes y poner fin de una vez por todas al caos que asola Italia. ¿Quién se enfrentará a ellos como invasores y quién los recibirá como antiguos vecinos y amigos?"

 LT.0013.a: "¡Que vengan!"

 LT.0013.b: "Interesante..."

 ### Unificar Italia, por Flavio Verna (del juego base)
 DE_decision_event.0012.t: "El Imperio italiano"

 DE_decision_event.0012.desc: "Desde la caída del Imperio romano de Occidente, la península itálica ha permanecido dividida entre ciudades-estado enfrentadas, obispos ambiciosos y conquistadores extranjeros.\n\nSin embargo, bajo el gobierno de mi dinastía, Italia ha dejado atrás sus disputas internas y vuelve a estar unida, erigiéndose en una potencia dominante en Occidente. Ya no seremos un territorio por el que se disputen francos y griegos, ni volveremos a sufrir los abusos de piratas y pretendientes extranjeros. A partir de hoy, Italia recuperará su lugar entre las grandes potencias de Europa."

 DE_decision_event.0012.a: "¡Labor omnia vincit!"

 ### Formar el Gran Ducado de Sajonia
 DE_decision_event.0002.t: "Los antiguos sajones"

 DE_decision_event.0002.desc: "El pueblo sajón fue antaño una poderosa fuerza que se enfrentó a los ejércitos de Carlomagno, hasta que finalmente sucumbió ante ellos. Desde entonces, los sajones han vivido sometidos al dominio de otros, sin poder decidir su propio destino. Pero nuestros enemigos han sido derrotados y hemos recuperado nuestra independencia. Ha llegado el momento de restaurar el Reino de Sajonia. Como [founder.GetTitleAsNameNoTooltip], ¡guiaré a mi pueblo hacia un futuro glorioso!"

 DE_decision_event.0002.a: "¡Sajonia vuelve a alzarse!"

 DE_decision_event.0003.t: "El Gran Ducado de Sajonia"

 DE_decision_event.0003.desc: "Gracias a mis logros en la consolidación de las tierras centrales de Sajonia y a la enorme influencia que mi dinastía ha adquirido en el Sacro Imperio Romano Germánico, [scoped_emperor.GetTitledFirstName] ha reconocido finalmente la preeminencia tradicional de Sajonia sobre los numerosos ducados menores de Alemania.\n\nA partir de hoy, todos mis sucesores ostentarán el distinguido título de #EMP Gran Duque#!, equiparable al de un rey, para distinguirse de los príncipes y princesas de menor rango del Imperio."

 DE_decision_event.0003.a: "¡Sajonia será la última en el mundo!"

 ### Formar el Gran Ducado de Franconia
 DE_decision_event.0004.t: "El Gran Ducado de Franconia"

 DE_decision_event.0004.desc: "Gracias a mis logros en la consolidación de las tierras de Franconia y a la enorme influencia que mi dinastía ha adquirido en el Sacro Imperio Romano Germánico, [scoped_emperor.GetTitledFirstName] ha reconocido finalmente a Franconia como la principal potencia entre los numerosos ducados menores de Alemania.\n\nA partir de hoy, todos mis sucesores ostentarán el distinguido título de #EMP Gran Duque#!, equiparable al de un rey, para distinguirse de los príncipes y princesas de menor rango del Imperio."

 DE_decision_event.0004.a: "¡Franconia será la última en el mundo!"

 ### Formar el Gran Ducado de Suabia
 DE_decision_event.0005.t: "El Gran Ducado de Suabia"

 DE_decision_event.0005.desc: "Gracias a mis logros en la consolidación de las tierras centrales de Suabia y a la enorme influencia que mi dinastía ha adquirido en el Sacro Imperio Romano Germánico, [scoped_emperor.GetTitledFirstName] ha reconocido finalmente la preeminencia de las tierras tradicionales de Alamania sobre los numerosos ducados menores de Alemania.\n\nA partir de hoy, todos mis sucesores ostentarán el distinguido título de #EMP Gran Duque#!, equiparable al de un rey, para distinguirse de los príncipes y princesas de menor rango del Imperio."

 DE_decision_event.0005.a: "¡Suabia será la última en el mundo!"

 ### Formar la Confederación Suiza
 middle_europe_decisions.0001.desc: "Durante mucho tiempo, las ciudades de los Alpes centrales se han visto amenazadas por otros actores del Imperio. Unidas bajo una sola bandera, ahora han forjado alianzas mutuamente beneficiosas y han recibido el honor de la inmediatez imperial.\n\nEn honor a las contribuciones de mi dinastía a las ciudades-estado suizas, he sido elegido como jefe de esta unión, el que será el mascarón de proa de todos los cantones de nuestra nueva Confederación Suiza. Ya no seremos amenazados por extraños, sino que nos alzaremos como un fuerte actor independiente en el Imperio."

 middle_europe_decisions.0002.desc.emperor: "Después de años de luchas e incómodos acuerdos diplomáticos, me he visto obligado a conceder a los cantones suizos la inmediatez imperial.\n\nEste conjunto de ciudades alpinas se ha unido en una gran Confederación para protegerse de las depredaciones de los borgoñones y los señores alemanes. Debo tener cuidado de mantenerlos a raya, no vaya a ser que sus logros siembren la disensión entre los burgueses vecinos."

 middle_europe_decisions.0002.desc.vassals: "Una nueva entidad conocida como la Confederación Suiza se ha levantado en el Imperio. Son un conglomerado de ciudades con inmediatez imperial asentadas alrededor de los Alpes centrales, y han entrado en una alianza defensiva para protegerse de los otros electores que les rodean.\n\nUna fuerza independiente con la que hay que contar, se han liberado de cualquier reclamación anterior sobre sus tierras, ya sea de los antiguos borgoñones al oeste o de los señores alemanes al norte.\n\nDebería tener cuidado con esta nueva amenaza potencial en el Imperio."

 ### GERMANIA Y ESLAVIA
 ### Restaurar el Imperio de Samo
 DE_decision_event.0010.t: "El Imperio de Samo"

 DE_decision_event.0010.desc: "Nuestro pueblo estuvo antaño unido bajo el liderazgo de Samo, cuyo imperio congregó a numerosos pueblos eslavos occidentales. Hoy, con orgullo y júbilo, proclamo la restauración del Imperio de Samo, la «Tierra de los Vendos». Nuestro reino superará al de antaño y nos conducirá hacia un futuro glorioso."

 DE_decision_event.0010.a: "Volveremos a unirnos."

 ### Restaurar el Reino de Frisia
 DE_decision_event.0011.t: "Un reino renacido"

 DE_decision_event.0011.desc: "Los antiguos frisones lograron conservar su independencia frente al dominio franco hasta que finalmente no pudieron resistirlo. Siglos de dominio extranjero han convertido la idea de un reino independiente en un sueño lejano. Pero, bajo mi liderazgo, el Reino de Frisia vuelve a ser una realidad. Nuestro pueblo es ahora libre y está preparado para labrarse su propio destino entre las grandes potencias de Europa."

 DE_decision_event.0011.a: "Seremos dueños de nuestro destino."

 ### Consolidación de la identidad lechita oriental
 consolidate_polish_identity_txt: "Unir a los lechitas orientales"

 consolidate_polish_identity_tooltip: "Unir a los lechitas de Polania y Vistulia en una sola cultura"

 consolidate_polish_identity_desc: "Los Hijos de Lech se asentaron en toda la sección oriental de la Llanura del Norte de Europa, habitando una vasta zona que se extiende desde el río Elba hasta el Bug, con el Oder formando una línea divisoria entre ambos.\n\nDebemos asumir una posición preeminente entre los lechitas del Vístula para defendernos de los ataques del sur y el este. No nos dividiremos entre polanos o lendios, sino que nos reconoceremos mutuamente como herederos iguales de Lech."

 consolidate_polish_identity.preview.tta: "Adoptarás una nueva [culture|E] basada en la anterior"

 consolidate_polish_identity.preview.ttb: "El [title|E] [kingdom|E] de [GetTitleByKey('k_poland').GetNameNoTier] adoptará un nuevo nombre"

 consolidate_polish_identity.preview.ttc: "El 40% de [counties|E] eslavos occidentales en [GetGeographicalRegion('ce_custom_poland').GetName] adoptarán la nueva [culture|E]"

 consolidate_polish_identity_confirm: "¡Vivan los hijos de Lech!"

 ### Consolidación de la identidad lechita occidental
 consolidate_polabian_identity_txt: "Unir a los lechitas occidentales"

 consolidate_polabian_identity_tooltip: "Unir a los lechitas de Polabia y Sorbia en una sola cultura"

 consolidate_polabian_identity_desc: "Los Hijos de Lech se asentaron en toda la sección oriental de la Llanura del Norte de Europa, habitando una vasta zona que se extiende desde el río Elba hasta el Bug, con el Oder formando una línea divisoria entre ambos. \n\nTenemos que unir a los lechitas a lo largo del Elba en un solo pueblo que pueda resistir la tormenta que se avecina de los reinos germánicos expansionistas al norte y al oeste. Ya no divididos entre obotritas y sorbios, seremos conocidos como wendos, ¡los herederos de los vénetos y verdaderos gobernantes de estas tierras!"

 consolidate_polabian_identity.preview.tta: "Adoptarás una nueva [culture|E]"

 consolidate_polabian_identity.preview.ttb: "Tu nueva [culture|E] se extenderá dinámicamente a [counties|E] eslavos occidentales en [GetGeographicalRegion('ce_custom_wendia').GetName] si son propiedad directa tuya o de tu [vassal|E]"

 consolidate_polabian_identity_effect: "El 40% de los [county|E] eslavos occidentales en [GetGeographicalRegion('ce_custom_wendia').GetName] adoptarán la nueva [culture|E]"

 consolidate_polabian_identity_confirm: "¡Viva Wendia!"

 ce_custom_poland: "Lechia oriental"

 ce_custom_wendia: "Wendia"

 ### Asentamiento de colonos germánicos
 invite_german_settlers_txt: "Invitar colonos"

 invite_german_settlers_tooltip: "Invita a nuevos colonos a tu reino"

 invite_german_settlers_desc: "Las tierras de nuestro reino están escasamente pobladas y presentan una variedad de pantanos, bosques y colinas que dificultan su desarrollo. \n\nSi no queremos quedarnos gravemente rezagados respecto al resto de Europa, tenemos que promulgar medidas drásticas e invitar tanto a colonos como a ingenieros experimentados a reclamar estas tierras para cultivarlas de forma rentable."

 invite_german_settlers.preview.tta: "Recibiremos un impulso a nuestro desarrollo en un [county|E] aleatorio"

 invite_german_settlers.preview.ttb: "Cada [county|E] puede recibir un segundo impulso con sus modificadores reducidos a la mitad tras 10 años"

 invite_german_settlers_confirm: "¡Envíen el mensaje!"

 ### Decisiones de Alemania central
 embrace_upper_saxon_identity_txt: "Convertirse en alto sajón"

 embrace_upper_saxon_identity_tooltip: "Adopta un nuevo nombre para tu [culture|E]"

 embrace_upper_saxon_identity_desc: "Al dejar de estar unida la región histórica de Sajonia, los diversos bajos sajones se separan cada vez más en nuevos grupos por las tierras bajas, mientras que simultáneamente, tanto los colonos sajones como los francos se desplazan constantemente hacia el este, a las tierras altas sorabas. Aunque muchos de ellos conservan o adoptan la identidad sajona, las diferencias culturales son cada vez más evidentes. \nEs hora de hacer oficial esta divergencia."

 embrace_upper_saxon_identity.preview.tta: "La [culture|E] sajona pasará a llamarse baja sajona"

 embrace_upper_saxon_identity.preview.ttb: "La [culture|E] milcénica pasará a ser conocida como alta sajona"

 embrace_upper_saxon_identity_confirm: "Era inevitable"

 n_polan_c_noun: "Polaco"

 ### BRITANIA
 ### Reclamación de Britania
 reclaim_britannia_custom_decision1: "Todo su [powerful_vassals|E] tiene un [culture|E] con una [heritage|E] britónica o goidélica"

 ### Unificar a los anglosajones
 unify_saxons_decision: "Unificar la heptarquía"

 unify_saxons_decision_tooltip: "Unir los siete reinos anglosajones bajo un solo monarca."

 unify_saxons_decision_desc: "Los antiguos reinos anglosajones se encuentran ahora bajo el gobierno de un único monarca. Los pueblos de estas tierras comparten lengua, costumbres y tradiciones, pero sus antiguos reinos aún conservan sus propias identidades. Ha llegado el momento de superar esas divisiones y unirlos bajo una sola corona."

 unify_saxons_decision_confirm: "Unir los reinos sajones"

 unite_angles_decision: "Unir a los anglosajones"

 unite_angles_decision_tooltip: "Unir a los pueblos anglosajones bajo un mismo reino."

 unite_angles_decision_desc: "Aunque nuestros reinos han seguido caminos distintos, compartimos una misma lengua, unas mismas costumbres y un origen común. Ya no debemos vernos como pueblos separados, sino como parte de una misma nación. Ha llegado el momento de dejar atrás nuestras diferencias y unir a todos los anglosajones bajo una sola identidad."

 unite_angles.preview.tt: "Los anglos, sajones, jutos y demás pueblos de Britania pasarán a compartir una misma cultura anglosajona."

 unite_angles_confirm: "¡Por una Inglaterra unida!"

 ### Unir la Heptarquía
 DE_decision_event.0026.t: "Unidos como uno"

 DE_decision_event.0026.desc: "Inglaterra ha estado históricamente dividida en siete reinos independientes, también conocidos como la Heptarquía. La Heptarquía solo ha servido para dividir a nuestro pueblo y nos ha hecho vulnerables a los invasores, pero ya no más. A partir de ahora todos los sajones serán gobernados bajo la Corona de Inglaterra."

 DE_decision_event.0026.a: "No nos dividamos nunca más."

 ### Restauración de Yr Hen Ogledd
 restore_hen_ogledd_decision_title: "Restaurar el Reino de Yr Hen Ogledd"

 restore_hen_ogledd_decision_desc: "Yr Hen Ogledd, «el antiguo Norte», estuvo una vez unido bajo el próspero gobierno de reyes legendarios como Coel Hen o Urien Rheged. Sin embargo, con el paso del tiempo, Hen Ogledd se dividió en una serie de pequeños reinos de los que hoy solo queda [GetTitleByKey('d_galloway').GetNameNoTier].\n\nPor lo tanto, nos corresponde a nosotros restaurar Cumbria a su antigua gloria. ¡Yma o Hyd!"

 restore_hen_ogledd_decision_tooltip: "Restaurar el antiguo Reino del Norte"

 restore_hen_ogledd_decision_confirm: "Paz y prosperidad al fin"

 restore_hen_ogledd_decision.preview.tta: "Obtendrás [GetTitleByKey('k_cumbria').GetName]"

 restore_hen_ogledd_decision.preview.ttb: "Obtendrás [GetTitleByKey('d_cumbria').GetName]"

 restore_hen_ogledd_decision.preview.ttc: "[GetTitleByKey('d_cumbria').GetNameNoTier] y [GetTitleByKey('d_galloway').GetNameNoTier] se convertirán en [de_jure|E] de [GetTitleByKey('k_cumbria').GetNameNoTier]"

 restore_hen_ogledd_decision.preview.ttd: "Si son propiedad, los [title|E] de [GetTitleByKey('d_lothian').GetNameNoTier], [GetTitleByKey('d_lancaster').GetNameNoTier], [GetTitleByKey('d_northumberland').GetNameNoTier] y [GetTitleByKey('d_york').GetNameNoTier] pasarán a ser [de_jure|E] de [GetTitleByKey('k_cumbria').GetNameNoTier]."

 ### Restauración de las fronteras de Pengwern
 restore_pengwern_decision_title: "Restaurar las fronteras de Powys"

 restore_pengwern_decision_desc: "El Reino de Pengwern fue un poderoso reino británico postromano y altomedieval situado en las Midlands occidentales. \n\nPengwern, antaño hegemón regional de Gran Bretaña, hace tiempo que fue absorbido por Mercia, y sus últimos vestigios se han convertido en los restos de Powys, así como en el ya desaparecido reino de Ergyng.\n\nRestaurar este reino debería ser el primer paso hacia la reconquista de toda Gran Bretaña a los invasores sajones."

 restore_pengwern_decision_tooltip: "Restaurar las fronteras de Pengwern"

 restore_pengwern_decision_confirm: "Un gran reino reforzado"

 restore_pengwern_decision.preview.tta: "Obtendrás [GetTitleByKey('d_ergyng').GetName]"

 restore_pengwern_decision.preview.ttb: "Las fronteras de [GetTitleByKey('d_powys').GetNameNoTier] y [GetTitleByKey('k_wales').GetNameNoTier] se ampliarán hasta el río Severn"

 ### Saqueo de Alt Clut y caída de Strathclyde
 british_flavour.0001.t: "El saqueo de Alt Clut"

 british_flavour.0001.desc: "Reúno las pertenencias que puedo llevar antes de salir corriendo hacia la puerta. El campo de los alrededores ya ha sido saqueado y gran parte de la tierra ha sido pasto de las llamas. Tardaremos un rato en llegar a la explotación temporal de Gwovan, río arriba. Durante el viaje, reflexiono sobre lo sucedido.\n\nLa fortaleza de [GetTitleByKey('c_lennox').GetNameNoTier] ha sido finalmente saqueada. Aquellos que no lograron escapar del asedio han sido asesinados o capturados por los invasores. Solo puedo imaginar el horror de los que no lo lograron. \n\nA medida que llegamos a Gwovan, se hace cada vez más evidente que no volveremos a [GetTitleByKey('b_dumbarton').GetNameNoTier] en un futuro próximo. El viejo castillo ya no es más que una ruina y una presa fácil para cualquier invasor exterior. Tendremos que conformarnos con lo que nos queda y, por tanto, el reino de [GetTitleByKey('d_galloway').GetNameNoTier], el último bastión de Hen Ogledd, ya no existe. En su lugar se alza Strathclyde, dispuesta a defender el [ROOT.Char.GetCulture.GetCollectiveNoun] en el futuro."

 british_flavour.0001.a: "¡Venceremos!"

 ### Auge de los anglosajones
 british_culture.0002.t: "El auge de los anglosajones"

 british_culture.0002.desc: "Tras la caída del Imperio romano de Occidente, varias tribus germánicas comenzaron a emigrar a las Islas Británicas, entre ellas los jutos, los anglos y los sajones, que llegarían a formar sus propios pequeños reinos en gran parte del territorio que colonizaron. Tras un largo periodo de expansión contra los nativos británicos y de consolidación de las tribus circundantes, reinos como los de Kent, Mercia y Northumbria empezaron a forjar nuevas culturas regionales únicas en la isla, con sus propios dialectos e identidades. Esto cambiaría poco a poco con la invasión vikinga, que vio caer muchos de estos antiguos reinos en rápida sucesión, mientras el resto era absorbido gradualmente por lo que más tarde se convertiría en Inglaterra. Como tal, una nueva cultura ha comenzado a surgir, una que se define por la fe compartida, el origen y la lengua de estos germanos nativos de Gran Bretaña, que se encuentra en contraste con los del otro lado del mar. Por fin, estos pueblos han empezado a verse a sí mismos ya no como mercianos, sajones occidentales o reyes, sino como un pueblo inglés común."

 british_culture.0002.a: "Esto cambiará el curso de la historia."

 ### Reforma del Reino de Pengwern
 british_culture.0003.t: "La reforma de Pengwern"

 british_culture.0003.desc: "Hace mucho tiempo, gran parte de las Tierras Medias estaban gobernadas por la Casa de Pengwern, hasta que la descentralización y las invasiones extranjeras pusieron al reino de rodillas. \n\nAunque la ubicación exacta de la corte de Pengwern se ha perdido en el tiempo, sabemos que una vez gobernó una parte considerable del territorio que se extendía desde Powys hasta el Severn, posiblemente incluso hasta el sur del canal de Bristol. Sin embargo, cuando las comunidades rurales de Powys comenzaron a afirmar su independencia y los mercios empezaron a invadir el territorio desde el este, el reino acabó siendo subsumido y olvidado.\n\nPero por fin, mi casa ha conseguido recuperar los territorios perdidos de Ergyng, Pengwern y Powys, empujando a los anglos más allá del Severn. \nCon Pengwern de nuevo en manos británicas, es solo cuestión de tiempo que subyuguemos a los últimos ingleses rebeldes que una vez intentaron contenernos en las tierras montañosas de Cambria; ¡pronto toda Gran Bretaña jurará lealtad a mi casa!"

 british_culture.0003.a: "¡Levantaos, herederos de Pengwern!"

 ### Divergencia de las culturas bretonas
 british_culture.0011.t: "La divergencia de Brythonica"

 british_culture.0011.desc: "Desde la caída de Caergloui a manos de los anglosajones, los britanos de Britania y Bretaña han divergido entre sí lenta pero constantemente. Tras siglos de relativo aislamiento, han surgido dos variedades bretonas únicas a partir de los dialectos de Dumnonia y Cambria respectivamente: aunque ambos siguen identificándose como bretones, la variedad de cada zona se ha vuelto en gran medida ininteligible para la otra."

 british_culture.0011.a: "¡Brythonwyr o hyd!"

 ### Restaurar el sacerdocio druídico
 restore_the_druids_decision: "Restaurar el sacerdocio [ROOT.Char.GetFaith.GetNameNoTooltip]"

 restore_the_druids_decision_confirm: "¡Viva el Myrdidin!"

 restore_the_druids_decision_desc: "¡Ha llegado el momento de traer a los antiguos druidas de [ROOT.Char.GetFaith.GetName]!"

 restore_the_druids_decision_tooltip: "El sacerdocio de [ROOT.Char.GetFaith.GetAdjective] está establecido."

 restore_the_druids_decision_effect_tooltip: "El sacerdocio [THIS.Char.GetFaith.GetAdjective] está establecido"

 ### Misión gregoriana en Britania
 gregorian_mission: "Iniciar la misión gregoriana"

 gregorian_mission_desc: "Paganos y herejes campan a sus anchas por nuestras amadas tierras. Para asegurar la continuidad y prosperidad de nuestra fe y nuestro reino, debemos solicitar la ayuda del clero y de los gobernantes cristianos en nuestra lucha contra ellos."

 gregorian_mission_tooltip: "Solicitar ayuda al clero para combatir a los herejes en Britania."

 gregorian_mission_confirm: "¡Por la fe!"

 ### IBERIA
 ### Formación del Reino de Aragón - Deriva de iure
 form_the_kingdom_of_aragon_decision.tt.drift.d_zaragoza: "Si [completely_control|E] [d_zaragoza.GetDefinitiveName], se [de_jure_drift_drifted|E] en [k_aragon.GetDefinitiveName]."

 form_the_kingdom_of_aragon_decision.tt.drift.d_teruel: "Si [completely_control|E] [d_teruel.GetDefinitiveName], será [de_jure_drift_drifted|E] en [k_aragon.GetDefinitiveName]."

