 ### Ascenso de los Ha-Mimitas
 hamim.1001.t: "El ascenso de los Ha-Mimitas"

 hamim.1001.desc: "Parece que una creencia marginal se está imponiendo en el [hamim_county.GetName]. El movimiento religioso está encabezado por un autodenominado profeta de la tribu Ghomara. Este profeta afirma haber recibido una nueva revelación de Alá, en lengua bereber.\n\nLos magistrados locales están preocupados, pero seguramente un grupo religioso marginal liderado por un autodenominado profeta tribal no es nada de lo que preocuparse."

 hamim.1001.a: "¿Por qué habría de preocuparme?"

 hamim.1001.a.flavor: "¿Cuándo un grupo religioso marginal de provincias ha causado problemas a alguien?"

 hamim.1001.b: "Vamos a erradicar esto antes de que se arraigue bien..."

 hamim.1001.b.conversion_tt: "¡Si ya estás convirtiendo la fe en [hamim_county.GetName], el progreso puede perderse si eliges esta opción!"

 hamim.1001.player_warning: "@warning_icon! #X No convertir [hamim_county.GetNameNoTier] lejos de [ghomara_pagan.GetName] lo suficientemente rápido llevará a un levantamiento de los Ha-Mimitas. Prepárate.#!"

 hamim.1002.desc: "El levantamiento de los Ha-Mim, encabezado por su autodenominado profeta Ha-Mim, que inicialmente echó raíces en las montañas del Rif, ha crecido rápidamente en apoyo entre las tribus Ghomara. Estos sectarios afirman que pretenden recuperar el Magreb de los árabes en nombre de su nuevo Mahdi. Su líder, [hamim.GetTitledFirstName], al que llaman profeta, cuenta también con el apoyo de un par de brujas. La primera es su tía, a la que llaman Sahira o Tanqit, y la segunda bruja es la hermana del profeta, una hermosa mujer llamada Daggu. Se dice que estas mujeres dominan los poderes de la adivinación, y Daggu especialmente se ha convertido en objeto de devoción e inspiración entre los hombres de Ha-Mim. Ha-Mim, por su parte, afirma haber recibido una revelación divina de Alá en lengua bereber, e incluso ha creado un Corán bereber basado en estas visiones. Sea como fuere, [hamim.GetSheHe] ha encontrado ahora un fuerte núcleo de seguidores, que han declarado a [hamim.GetHerHim] nada menos que el Mahdi."

 hamim.1002.a: "¡Como si este «profeta» trastornado supusiera alguna amenaza!"

 hamim.1002.a.target.tt: "¡Los Ha-Mimitas van a la guerra contra ti!"

 hamim.1002.a.not_target.tt: "¡Los Ha-Mimitas van a la guerra contra tu señor!"

 hamim.1002.b: "[hamim.GetSheHe|U] tiene algunos puntos muy buenos, en realidad."

 hamim.1002.b.flavor: "Difícilmente puedo llamarme un fiel digno..."

 hamim.1003.desc: "El fundador epónimo de los Ha-Mimitas, [hamim.GetTitledFirstName], ha fallecido, y con ello uno esperaría que el movimiento [hamim.GetHerHis] pasara a la historia. Si tuviéramos tanta suerte. En cambio, ¡un nuevo líder ha surgido! [daggu.GetTitledFirstName] no solo ha mantenido unidas a las tribus, ¡[daggu.GetSheHe] ha reunido a #EMP más#! personas a la bandera de [daggu.GetHerHis]!"

 hamim.1003.a: "¡Estos fanáticos siguen llegando!"

 hamim.1003.a.tt: "Los Ha-Mimitas vuelven, más fuertes que nunca."

