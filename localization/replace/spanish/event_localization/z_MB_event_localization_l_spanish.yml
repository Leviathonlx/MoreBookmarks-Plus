 ### Unificación cultural de los ilirios
 unite_the_illyrians_decision: "Abrazar la herencia iliria"

 unite_the_illyrians_decision_tooltip: "Unir a los [south_slavs|E] de Iliria en una sola cultura"

 unite_the_illyrians_decision_desc: "A medida que pasa el tiempo, las muchas tribus dispares de Iliria se acostumbran cada vez más las unas a las otras, especialmente frente a los imperios extranjeros que buscan subyugarlas en cuanto surge la oportunidad.\n\nCon los incentivos adecuados, podemos fomentar este sentimiento y unir de verdad a nuestro pueblo no solo políticamente, sino también culturalmente."

 unite_the_illyrians.preview.tt: "Los eslavos del sur de Iliria se unirán en una sola cultura."

 unite_the_illyrians_confirm: "¡Slava Iliriji!"

 illyrian_slav.preview.tta: "Crea una nueva [culture|E] eslava del sur"

 illyrian_slav.preview.ttb: "Todos los [counties|E] eslavos del sur en [GetGeographicalRegion('ce_custom_serbo_croatia').GetName], con la excepción del búlgaro, tienen un 40% de posibilidades de cambiar a la nueva cultura"

 illyrian_slav.preview.ttc: "La nueva [culture|E] se extenderá dinámicamente en los condados eslavos del sur dentro de [GetGeographicalRegion('ce_custom_illyria').GetName]"

 ce_custom_serbo_croatia: "Dinaria"

 ce_custom_illyria: "Iliria"

 ### Restauración del Reino de Iliria
 ce_custom_kingdom_event.0001.t: "La restauración de Iliria"

 ce_custom_kingdom_event.0001.desc: "Hoy celebramos el resurgimiento del Reino de Iliria. Desde su caída ante la República romana en el siglo II a.C., Iliria ha permanecido bajo el yugo del dominio extranjero, cambiando de manos entre varios usurpadores romanos, invasores germánicos y, finalmente, jefes y príncipes eslavos.\n\nPero, por fin, he conseguido lo que ni siquiera Pleuratus podría haber soñado: he unido Iliria bajo una sola corona, reunido a sus muchas tribus bajo un estandarte común. Esta antigua tierra ya no se doblegará ante tiranos extranjeros, ¡sino que prosperará como un reino unido bajo mi benévolo gobierno!"

 ce_custom_kingdom_event.0001.a: "Los batonianos han sido vengados"

 ### Consolidación de la frontera danubiana
 consolidate_danubian_frontier_decision: "Consolidar la frontera danubiana"

 consolidate_danubian_frontier_decision_desc: "Muchos fuertes antiguos salpican las orillas del Danubio. Utilizado por los romanos como línea defensiva natural hace cientos de años, el río marca hoy la frontera entre búlgaros y francos. \n\nCon la inversión adecuada podemos reocupar estos fuertes y además establecer una nueva marca para consolidar la frontera del Danubio."

 consolidate_danubian_frontier_decision_tooltip: "Restaurar la antigua frontera romana"

 consolidate_danubian_frontier_decision_confirm: "Reunir el reino"

 danubian_frontier_duchy.preview.tta: "Crea el [duchy|E] de [GetTitleByKey('d_szekesfehervar').GetNameNoTier]"

 danubian_frontier_duchy.preview.ttb: "Los [counties|E] de [GetTitleByKey('c_szekesfehervar').GetNameNoTier], [GetTitleByKey('c_esztergom').GetNameNoTier], [GetTitleByKey('c_komarom').GetNameNoTier] y [GetTitleByKey('c_veszprem').GetNameNoTier] se convertirán en [de_jure|E] de [GetTitleByKey('d_szekesfehervar').GetNameNoTier]."

 danubian_frontier_duchy.preview.ttc: "El [duchy|E] de [GetTitleByKey('d_szekesfehervar').GetNameNoTier] se disolverá si el [title|E] es destruido o usurpado por un gobernante que no sea ni eslavo ni romano y que también posea el [duchy|E] de [GetTitleByKey('d_visegrad').GetNameNoTier]."

 ce_custom_transdanubia: "Transdanubio"

 ce_custom_roman_pannonia: "Panonia eslava"

 ### Unificación de Panonia
 restore_roman_pannonia_decision: "Unir Panonia"

 restore_roman_pannonia_decision_desc: "Los principados de Blatno y Savia solían estar unidos bajo una única administración provincial en la antigüedad. Sin embargo, tras las invasiones hunas, Panonia quedó permanentemente dividida, ya que godos, lombardos y ávaros ocuparon las tierras alrededor del lago Blatno, mientras que las tierras de Savia se convirtieron en una frontera salvaje entre los romanos y estos mismos ocupantes. \n\nPero con la desaparición de los ávaros y el debilitamiento gradual de la autoridad franca en la gran Panonia, ha llegado el momento de corregir este error. Desde los Alpes hasta el Danubio, Panonia volverá a alzarse triunfante."

 restore_roman_pannonia_decision_tooltip: "Fundar el Reino de Panonia"

 restore_roman_pannonia_decision_confirm: "Reunido el reino"

 restore_roman_pannonia.preview.tta: "Evita que el [duchy|E] de [GetTitleByKey('d_szekesfehervar').GetNameNoTier] se disuelva"

 restore_roman_pannonia.preview.ttb: "Si se posee, [GetTitleByKey('d_syrmia').GetNameNoTier] se convertirá en la capital [de_jure|E] de [GetTitleByKey('k_balaton').GetNameNoTier]"

 restore_roman_pannonia.preview.ttc: "Surgirá una nueva cultura eslava"

 ### Ascenso de la cultura panónica
 balkan_culture.0006.t: "Las tierras de Panonia"

 balkan_culture.0006.desc: "Hace muchos siglos, [GetTitleByKey('k_balaton').GetNameNoTier] fue invadida por las viles hordas de los hunos, que saquearon y devastaron la tierra. Tras su desaparición, la tierra fue ocupada por pueblos como los godos, los lombardos, los ávaros y, por último, nosotros, los [pannonian_founder.GetCulture.GetNameNoTooltip]s.  \n\nPero ahora, después de incontables siglos, he conseguido reunir estas tierras bajo un solo estandarte. Mi autoridad se extiende desde las fortalezas vitales de [GetTitleByKey('b_sisak').GetNameNoTier] y [GetTitleByKey('b_vakovo').GetNameNoTier] en el río Sava hasta la antigua ciudad de [GetTitleByKey('b_gyor').GetNameNoTier] en el río Danubio. Por fin, Panonia está completa una vez más. \n¡Es hora de forjar un nuevo destino para estas tierras que resonará a través de los siglos!"

 balkan_culture.0006.a: "¡Somos los verdaderos herederos de Panonia, ahora y siempre!"

 balkan_culture.0006.b: "¡Ha llegado la hora de los Dulebov!"

 balkan_culture.0006.c: "¡Dunavia resistirá triunfante la prueba del tiempo!"

 establish_pannonian_culture_effect.tta: "Adoptas la nueva cultura."

 establish_pannonian_culture_decision_effect.tta: "Una nueva cultura eslava panónica surgirá después de un cierto tiempo"

 establish_pannonian_culture_decision_effect.ttb: "Dulebov comenzará a extenderse en Transdanubia"

 establish_pannonian_culture_decision_effect.ttc: "Dunavian surgirá después de un cierto tiempo"

 establish_pannonian_culture_decision_effect.ttd: "[GetTitleByKey('k_balaton').GetNameNoTier] se conocerá como Panonia"

 establish_pannonian_culture_decision_effect.tte: "[GetTitleByKey('k_balaton').GetNameNoTier] se conocerá como Dulebia"

 establish_pannonian_culture_decision_effect.ttf: "[GetTitleByKey('k_balaton').GetNameNoTier] se conocerá como Dunavia"

 ### Ascenso de un nuevo pueblo panónico
 balkan_culture.0007.t: "El ascenso de un nuevo pueblo"

 balkan_culture.0007.desc: "Enfrentados a la constante amenaza exterior de francos, búlgaros, magiares e incluso compañeros eslavos, los habitantes de mi reino han forjado cada vez más un nuevo vínculo que ha crecido más allá de las divisivas líneas tribales de antaño."

 balkan_culture.0007.a: "Fascinante."

 ### Transformación del Principado de Savia
 balkan_flavour.0001.t: "Las tierras de Eslavonia"

 balkan_flavour.0001.desc: "Ante la amenaza potencial de los magiares, el Principado de Savia se transforma lentamente en una mera región fronteriza."

 balkan_flavour.0001.a: "Interesante."

 ### Llegada de los magiares
 balkan_flavour.0003.t: "La llegada de los magiares"

 balkan_flavour.0003.desc: "En un giro inesperado de los acontecimientos, tras aplastar cualquier oposición a su migración, los magiares han logrado cruzar los montes Cárpatos y se han hecho con el control de la cuenca oriental. Gran parte de las tierras que han conquistado hasta ahora han sido pasto de las llamas y sus habitantes han huido o han sido esclavizados por estos recién llegados. \n\nEs solo cuestión de tiempo que estos magiares intenten ampliar sus ganancias a nuestra costa."

 balkan_flavour.0003.a: "¡Vamos a capear el temporal!"

 ### Descubrimiento de una antigua ciudad panónica
 balkan_flavour.0004.t: "Susurros de una ciudad antigua"

 balkan_flavour.0004.desc: "Mientras mis exploradores recorrían las tierras de Panonia, se toparon con la ciudad fortificada de Castei, cuyos habitantes hablan una lengua extraña e ininteligible para los pueblos de los alrededores, e informaron a mi mayordomo al respecto. \nCuriosamente, los habitantes de la ciudad parecen diferir no solo en su forma de hablar, sino también en su estilo de vida, ya que parecen ser artesanos de gran talento, fabricando artefactos únicos de todo tipo, nunca vistos en el resto de Panonia. \nDel mismo modo, su ciudad es diferente a muchas otras de la zona, ya que cuenta con fortificaciones de piedra respetables y una arquitectura única que recuerda a tiempos pasados.\nMientras estaba allí, mis exploradores fueron abordados por un local que desea una audiencia conmigo."

 balkan_flavour.0004.a: "Permíteles una audiencia. Deseo escuchar su historia."

 balkan_flavour.0004.b: "No tengo tiempo para esto."

 balkan_flavour.0005.t: "La Panonia"

 balkan_flavour.0005.desc: "Un hombre se pone delante de mí y se presenta:\n\n'Salutio, dominu.\n\nMe llamo [ce_pannonian_romance_guest_spawn.GetTitledFirstName] y le agradezco humildemente que me haya concedido esta audiencia. Nosotros, los [ce_pannonian_romance_guest_spawn.GetCulture.GetNameNoTooltip]s, hemos vivido en estas tierras entre los ávaros y los eslavos durante incontables generaciones. Pero últimamente, nuestras ciudades se han vuelto escasas y nuestros campos, estériles. Temo que nuestras costumbres [ce_pannonian_romance_guest_spawn.GetCulture.GetName] y lengua [ce_pannonian_romance_guest_spawn.GetCulture.GetLanguage.GetName] pronto se pierdan para siempre.\n\n¿Quizás podrías escuchar nuestras historias y permitirnos mezclarnos aquí en la corte para que otros puedan escuchar la historia de la vieja Panonia?"

 balkan_flavour.0005.a: "¡Por favor, enséñame sobre tu gente!"

 balkan_flavour.0005.b: "Entiendo tus preocupaciones, puedes quedarte aquí como invitado."

 balkan_flavour.0005.c: "Esto no es de mi incumbencia."

 ### Surgimiento de la identidad bosnia
 balkan_culture.0002.t: "Un pueblo bosnio"

 balkan_culture.0002.desc: "Cuando se estableció el Reino de Bosnia, no muchos podían imaginar el renacimiento que traería consigo; independiente tanto de Serbia como de Croacia, el pueblo de los Alpes Dináricos centrales y a lo largo del río Bosna ha empezado a verse a sí mismo ni como serbio ni como croata, sino como un nuevo y distinto pueblo bosnio con su propia cultura y herencia, ambas fundadas en nuestro mismo reino. "

 balkan_culture.0002.a: "¡Živjela slobodna Bosna!"

 ### Surgimiento de la identidad iliria
 balkan_culture.0004.t: "El pueblo ilirio"

 balkan_culture.0004.desc: "Cuando los eslavos emigraron por primera vez a los Balcanes en el siglo VI, estaban formados por muchas tribus dispares que simplemente huían de los invasores ávaros. \n\nPero desde que unimos las tierras de Iliria, las tribus se han acostumbrado unas a otras; poetas e intelectuales de todo el mundo conocido viajan a la corte iliria, contribuyendo a un emergente Renacimiento eslavo. Bajo la estabilidad de mi reino, el pueblo ilirio ha desarrollado por fin una identidad común que trasciende las antiguas fronteras tribales.\nPor lo tanto, es justo que fomentemos este incipiente sentimiento de unidad y lo desarrollemos hasta convertirlo en algo verdaderamente nuevo y duradero."

 balkan_culture.0004.a: "¡Slava Iliriji!"

 balkan_culture.0005.t: "El pueblo ilirio"

 balkan_culture.0005.desc: "Cuando los eslavos emigraron por primera vez a los Balcanes en el siglo VI, estaban formados por muchas tribus dispares que simplemente huían de los invasores ávaros.\nPero desde la formación del Reino ilirio, estas tribus se han acercado cada vez más unas a otras hasta el punto de que ahora se consideran un solo pueblo."

 balkan_culture.0005.a: "Bien por ellos."

 ### CHINA Y ASIA ORIENTAL
 ### Adopción del gobierno chino
 adopt_chinese_government_decision: "Adoptar un gobierno $chinese_government$"

 adopt_chinese_government_decision_desc: "Aunque gobierno sobre territorio en $e_celestia_china$ como rey, mi estilo de gobernar sigue siendo ajeno a China, lo que provoca cierta resistencia por parte de los nobles locales. Quizá reformando el estado y adoptando una forma de gobierno más acorde con las creencias locales, podría hacer más estable mi control del poder en la región."

 adopt_chinese_government_decision_tooltip: "Cambiar el tipo de [government|E] adoptando un gobierno $chinese_government$."

 adopt_chinese_government_decision_confirm: "Adoptar la burocracia confuciana"

 ### Guerras por el Mandato del Cielo
 mandate.0001.t: "La guerra por el Mandato del Cielo"

 mandate.0001.desc: "El momento de decidir el destino del Mandato del Cielo por fin ha llegado. Un señor regional ha levantado sus ejércitos para reclamar el dominio sobre todo el territorio. La historia está en tus manos. Si te unes a los rebeldes y logran derrocar al emperador, quienes hayan contribuido a su victoria recibirán grandes recompensas. Si, por el contrario, apoyas a la corte imperial, serás recordado como un leal servidor del trono. Sin embargo, ambas opciones entrañan el riesgo de fracasar. Quizá exista un tercer camino..."

 mandate.0001.a: "Entonces, ¡me uniré a ellos!"

 mandate.0001.b: "No puedo hacerlo. Elijo el honor."

 mandate.0001.c: "¡Alzo ahora mis ejércitos para pacificar el reino y traer de vuelta a nuestro soberano!"

 mandate.0001.c_desc: "Quizá yo también pueda..."

 mandate.0002.title: "Guerra por el Mandato del Cielo"

 mandate.0002.base.desc: "El reino se encuentra sumido en el caos y el pueblo sufre. Si no acudo en su auxilio, el Cielo me hará responsable. ¿Acaso el trono pertenece siempre a una misma dinastía? ¡Solo quien posee la virtud merece gobernar! ¡Ha llegado el momento de castigar a los traidores y derrocar al tirano!"

 mandate.0002.a: "¡El Cielo se apiada de mí!"

 mandate.0003.title: "Guerra por el Mandato del Cielo"

 mandate.0003.base.desc: "Los rebeldes se han alzado en armas y proclaman que el Mandato del Cielo ha cambiado de manos. Sus ejércitos marchan directamente hacia la capital, desafiando la autoridad imperial. ¡Semejante afrenta no puede quedar impune! Reuniré de inmediato las tropas de la corte y ordenaré a los señores de las provincias que acudan en defensa del trono. ¿Qué destino le espera al emperador si cae de su trono?"

 mandate.0003.a: "¡¿Cómo te atreves?!"

 mandate.0005.title: "La caída de los Tang tardíos"

 mandate.0005.base.desc: "La dinastía Tang ha caído ante nosotros y nuestros aliados kitán, y con ello el norte de China vuelve a estar unido. A cambio de su ayuda, los kitán exigen que les entreguemos las Dieciséis Prefecturas. Si nos negamos, es probable que entren en guerra con nosotros y perdamos mucho más que esas tierras. ¿Debemos aceptar sus exigencias o rechazarlas y confiar en nuestra capacidad para resistir su poderío?"

 mandate.0005.a: "Nos someteremos a sus exigencias..."

 mandate.0005.b: "¡No cederemos ninguna tierra que nos pertenezca por derecho!"

 ### Cambio de dinastía
 east_title.0001.t: "Cambio de dinastía"

 east_title.0001.desc: "Esta tierra ha cambiado de dueño y el gobierno del antiguo emperador ha llegado a su fin. Con la caída de la vieja dinastía, una nueva familia ha ocupado el trono y reclama el gobierno del Imperio. Si eliges jurarle lealtad, te convertirás en un gobernador de confianza de la nueva dinastía. Si la rechazas, podrás independizarte y gobernar tus propios territorios. A partir de entonces, podrás alzar tus estandartes contra los usurpadores y reclamar el trono, o unir fuerzas con otros señores para restaurar la legitimidad imperial. En estos tiempos turbulentos, ¿qué camino elegirás?"

 east_title.0001.a: "¡El Mandato del Cielo ha cambiado de manos! Quienes lo sigan prosperarán; quienes se opongan perecerán."

 east_title.0001.b: "¡Nunca he visto a alguien tan desvergonzado! ¡Qué vergüenza!"

 east_title.0005: "Lealtad a la nueva dinastía"

 east_title.0005.opening: "Una nueva dinastía"

 east_title.0005.desc: "Únete a la dinastía que acaba de reclamar el trono."

 east_title.0005.a: "Eres sabio."

 east_title.0005.b: "¡Me las arreglaré por mi cuenta!"

 east_title.0006: "Desobediencia"

 east_title.0006.opening: "Una nueva dinastía"

 east_title.0006.desc: "Rechaza a la dinastía que acaba de reclamar el trono."

 east_title.0006.a: "¡Maldita sea!"

 east_title.0007.opening: "Mi señor:"

 east_title.0007.desc: "No puedes alcanzar el rango de reino mientras seas un burócrata o tengas una ley de sucesión oficial, a menos que la cultura de tu señor posea la innovación «Oficiales de la corte»."

 east_title.0007.a: "Así que..."

 ### Conquistar Huaxia
 CONQUEST_HUAXIA_CB_NAME: "Conquista de Huaxia"

 ### Administración y nombramiento de funcionarios
 bureaucracy.0001.t: "Investigación y traslado de funcionarios"

 bureaucracy.0001.desc: "Tras examinar tus méritos y tu labor al servicio del pueblo, la corte imperial ha reconocido tu diligencia y tus logros. Por orden del gobierno central, se te ha asignado un nuevo cargo. Entrega los sellos y documentos de tu puesto actual y prepárate para asumir tus nuevas responsabilidades. Esperamos que estés a la altura de la confianza depositada en ti y sigas velando por el bienestar del pueblo."

 bureaucracy.0001.a: "¡Cumpliré con la orden de la corte imperial y no escatimaré esfuerzos!"

 bureaucracy.0001.b: "¿Qué demonios? ¡No pienso ir!"

