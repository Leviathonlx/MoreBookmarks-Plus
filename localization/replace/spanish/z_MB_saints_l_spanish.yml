 pam_choose_consecration_site_decision_desc_holy_site_saint: "Elegiré el [Concept('holy_site','Lugar sagrado')|E] de mi [faith|EU] dentro de mi [realm|EU] donde consagrar a este santo [Concept('canonized','Santo')|E] y dar descanso a sus restos, para que atraiga a los fieles."
 pam_choose_consecration_site_decision_desc_holy_site_va: "Elegiré el [Concept('holy_site','Lugar sagrado')|E] de mi [faith|EU] dentro de mi [realm|EU] donde consagrar a este [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] y dar descanso a sus restos, para que atraiga a los fieles."
 pam_choose_consecration_site_decision_tooltip: "Elige dónde consagrar al [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] elegido."
 pam_choose_consecration_site_decision_confirm: "Consagrar"
 pam_choose_consecration_site_decision_select_tt: "Elige un lugar donde consagrar al [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 pam_extract_relic_decision: "Extraer una reliquia"
 pam_extract_relic_decision_desc: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U] yace [GetPlayer.Custom('PamConsecratedEnshrined')] en mi reino. Con la debida reverencia, puede extraerse una reliquia de sus restos para bendecir a los fieles."
 pam_extract_relic_decision_tooltip: "Toma una reliquia de [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')] enterrado en tierras que controlas."
 pam_extract_relic_decision_confirm: "Extraer la reliquia"
 pam_extract_relic_decision_req_saint: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U] del que aún puedes extraer una reliquia reposa en tu [realm|EU]"
 pam_extract_relic_decision_req_saint_count: "Hasta ahora se han extraído [CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')] de [CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')] [Concept('artifact','reliquias')|E] de [CHARACTER.GetShortUIName]"
 pam_extract_relic_decision_extract_tt: "Crea una [Concept('artifact','Reliquia')|E] sagrada a partir de los restos de [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_extract_relic_decision_choose_tt: "Elige de qué [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] enterrado extraer una [Concept('artifact','Reliquia')|E]"
 pam_extract_relic_decision_item_valid_tt: "Aún puede extraerse una [Concept('artifact','Reliquia')|E] sagrada de este [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]."
 pam_saint_events.0001.t: "La petición parte"
 pam_saint_events.0001.desc: "La causa de [saint_candidate.GetFirstName] está preparada, y un lugar de honor en [consecration_province.GetName] aguarda sus benditos restos.\n\nAhora el asunto escapa de mis manos: una petición cabalga hacia [petition_recipient.GetTitledFirstName], y solo puedo rezar para que el juicio sea favorable."
 pam_saint_events.0001.a: "Entonces esperemos y recemos."
 pam_saint_events.0001.a.tt_saint: "Se ha enviado a [petition_recipient.GetTitledFirstName] una petición para reconocer a [saint_candidate.GetFirstName] como [Concept('canonized','Santo')|E], para ser consagrado en [consecration_province.GetName]. La respuesta llegará a su debido tiempo."
 pam_saint_events.0001.a.tt_va: "Se ha enviado a [petition_recipient.GetTitledFirstName] una petición para honrar a [saint_candidate.GetFirstName] como [saint_candidate.Custom('PamVeneratedSaintOrAncestor')], para ser [saint_candidate.Custom('PamConsecratedEnshrined')] en [consecration_province.GetName]. La respuesta llegará a su debido tiempo."
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]"
 pam_saint_events.0002.t_saint: "Una petición de santidad"
 pam_saint_events.0002.t_va: "Una petición de veneración"
 pam_saint_events.0002.desc_saint: "[canonizer.GetTitledFirstName] nos suplica que incluyamos a [saint_candidate.GetFirstName] entre los benditos santos, consagrado en [consecration_province.GetName]."
 pam_saint_events.0002.desc_va: "[canonizer.GetTitledFirstName] nos suplica que honremos a [saint_candidate.GetFirstName] entre [saint_candidate.Custom('PamBlessedOnesOrAncestors')], [saint_candidate.Custom('PamConsecratedEnshrined')] en [consecration_province.GetName]."
 pam_saint_events.0002.desc.traits_1: "\n\nEn vida, [saint_candidate.GetFirstNameNoTooltip] fue una persona conocida por ser [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_2: "\n\nEn vida, [saint_candidate.GetFirstNameNoTooltip] fue una persona conocida como [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l] y [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_3: "\n\nEn vida, [saint_candidate.GetFirstNameNoTooltip] fue una persona conocida como [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l], [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l] y [pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint: "Una luz titilante emana de esta alma; una llama modesta, pero no todos los santos fueron forjados en un fuego mayor.\n\nEl juicio nos corresponde."
 pam_saint_events.0002.desc.virtue_1_va: "Una luz titilante emana de esta alma; una llama modesta, pero no toda alma venerada fue forjada en un fuego mayor.\n\nEl juicio nos corresponde."
 pam_saint_events.0002.desc.virtue_2: "No debía menospreciarse lo que esta alma logró para complacer a [saint_candidate.GetFaith.HighGodName]: la marca de una gracia evidente, aunque imperfecta.\n\nEl juicio nos corresponde."
 pam_saint_events.0002.desc.virtue_3: "La virtud es la encarnación de esta alma; raro es el mortal que viste tanto de lo divino con tanta claridad.\n\nEl juicio nos corresponde."
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName] es verdaderamente digno."
 pam_saint_events.0002.a.dynasty_opinion_tt: "Los miembros de la [Concept('dynasty','dinastía')|E] de [canonizer.GetShortUINamePossessive] que son [canonizer.GetFaith.GetAdherentName] ganan #P 10#! de [Concept('opinion','Opinión')|E] sobre ti durante 20 años"
 pam_saint_events.0002.b: "No lo aprobaremos."
 pam_saint_events.0002.b.dynasty_opinion_tt: "Los miembros de la [Concept('dynasty','dinastía')|E] de [canonizer.GetShortUINamePossessive] que son [canonizer.GetFaith.GetAdherentName] pierden #N 10#! de [Concept('opinion','Opinión')|E] sobre ti durante 20 años"
