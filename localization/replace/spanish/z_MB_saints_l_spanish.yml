 pam_choose_consecration_site_decision_saint: "Consagrar al santo"
 pam_choose_consecration_site_decision_va: "Consagrar al [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_choose_consecration_site_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_saint', 'pam_choose_consecration_site_decision_desc_va' )]"
 pam_choose_consecration_site_decision_desc_saint: "Elegiré la [Concept('ecclesiastical_domicile_building','Catedral')|E] de mi [realm|EU] donde consagrar a este santo [Concept('canonized','Santo')|E] y dar descanso a sus restos, para que atraiga a los fieles."
 pam_choose_consecration_site_decision_desc_va: "Elegiré el lugar sagrado de mi [realm|EU] donde consagrar a este [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] y dar descanso a sus restos, para que atraiga a los fieles."
