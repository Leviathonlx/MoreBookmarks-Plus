 pam_saint_relic_hair_desc: "Un elegante relicario que guarda un mechón del cabello sagrado de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_vestment_desc: "Un elegante relicario que guarda un fragmento de las vestiduras que llevó [relic_creator_saint.GetShortUINameNotMe]."
