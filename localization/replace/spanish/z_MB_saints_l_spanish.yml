 pam_saint_relic_rib_buddhism_desc: "Un elegante relicario que guarda una sarira: una costilla de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_talisman_desc: "Un talismán dibujado por [relic_creator_saint.GetShortUINameNotMe], del que se dice que expulsa el mal o cura a quien lo posee."
 pam_saint_relic_pellet_desc: "Un frasco de píldoras de inmortalidad elaboradas por [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_footprint_desc: "Un elegante relicario que guarda la huella de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_afarganyu_desc: "Un afarganyu que perteneció a [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_ring_desc: "Un anillo sagrado que perteneció a [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_bracelet_desc: "Un brazalete sagrado que perteneció a [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_commentary_desc: "Una colección de comentarios escritos por [relic_creator_saint.GetShortUINameNotMe], que muestran [relic_creator_saint.GetHerHis] interpretación de [relic_creator_saint.GetFaith.ReligiousText]."
 pam_saint_relic_tzitzit_desc: "Un hilo sagrado del tzitzit de [relic_creator_saint.GetShortUINamePossessiveNotMy], que muestra [relic_creator_saint.GetHerHis] piedad."
 pam_saint_relic_relic_desc: "Un elegante relicario que guarda la sagrada reliquia de [relic_creator_saint.GetShortUINameNotMe]."
 poi_buried_saint: "Tumba de [GetPlayer.Custom('PamVeneratedSaintOrAncestorTitle')]"
 poi_buried_saint.visit: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'poi_buried_saint.visit_saint', 'poi_buried_saint.visit_va' )]"
 poi_buried_saint.visit_saint: "Visita a la tumba de un santo"
 poi_buried_saint.visit_va: "Visita a la tumba de un antepasado"
 poi_buried_saint.visit_desc: "Al visitar la tumba de [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], te llenas de devoción."
 poi_buried_saint.preset_visit_desc: "Te detienes ante la tumba de [visited_saint.GetShortUIName] y presentas tus respetos."
 poi_buried_saint.foreign_visit: "Visita a una tumba antigua"
 poi_buried_saint.foreign_visit_desc: "Tu fe no venera a [visited_saint.GetShortUIName], pero hay mucho que aprender en esta tumba."
 pam_poi_buried_saint_on_visit_preset_relic_tt: "Presenta tus respetos a cambio de una modesta cantidad de [piety_i|E][piety|E], con la opción de extraer una [Concept('artifact','Reliquia')|E] sagrada por #EMP menos#! de lo que costaría desde lejos."
 pam_poi_buried_saint_on_visit_relic_tt: "Presenta tus respetos a [visited_saint.GetShortUIName] con la opción de extraer una [Concept('artifact','Reliquia')|E] sagrada por #EMP menos#! de lo que costaría desde lejos."
 pam_poi_buried_saint_on_visit_no_relic_tt: "Presenta tus respetos a [visited_saint.GetShortUIName], el [visited_saint.Custom('PamSaintOrAncestorNoun')] que descansa aquí."
 pam_saint_events.0007.t: "Ante la tumba de [visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.desc: "Mis viajes me llevan ante el lugar de descanso de [visited_saint.GetShortUIName], [visited_saint.Custom('PamVeneratedSaintOrAncestor')] de mi fe. El aire está cargado de santidad, y en torno a la tumba los fieles se arrodillan en silenciosa oración."
 pam_saint_events.0007.a: "Presentaré mis respetos y seguiré mi camino."
 pam_saint_events.0007.b: "Extraigamos una reliquia sagrada."
 pam_saint_events.0007.b.tt: "Se extraerá una [Concept('artifact','Reliquia')|E] sagrada de los restos de [visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.b.toast: "Reliquia sagrada extraída"
 pam_saint_events.0007.b.toast_desc: "Con manos reverentes, se extrae [relic_artifact.GetName] de los restos de [visited_saint.GetShortUINameNoTooltip] para bendecir mi [realm|EU]."
