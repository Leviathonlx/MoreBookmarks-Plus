 pam_canonize_saint_decision_desc_saint: "Propondré a uno de mis parientes difuntos para que sea reconocido como santo, consagrado y puesto a descansar en la luz."
 pam_canonize_saint_decision_desc_va: "Elevaré a uno de mis parientes difuntos para que sea honrado como [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], [GetPlayer.Custom('PamConsecratedEnshrined')] con toda la reverencia debida."
 pam_canonize_saint_decision_tooltip: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_tooltip_saint', 'pam_canonize_saint_decision_tooltip_va' )]"
 pam_canonize_saint_decision_tooltip_saint: "Eleva a un miembro difunto de tu [dynasty|EU] a la [sainthood|EU]."
 pam_canonize_saint_decision_tooltip_va: "Eleva a un miembro difunto de tu [dynasty|EU] a [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]."
 pam_canonize_saint_decision_confirm: "Elegir un lugar de reposo"
 pam_canonize_saint_decision_req_candidate: "Un antepasado #EMP difunto#! de tu [dynasty|EU], sin rasgos [sinful|EU], con algún rasgo [virtuous|EU] y aún no venerado"
 pam_canonize_saint_decision_req_site: "Un [Concept('ecclesiastical_domicile','Dominio eclesiástico')|E] con una [Concept('ecclesiastical_domicile_building','Catedral')|E] en tu [realm|EU] donde consagrarlo o, cuando todos estén ocupados, una provincia vecina"
 pam_canonize_saint_decision_req_site_holy_site: "Un [Concept('holy_site','Lugar sagrado')|E] de tu [faith|EU] dentro de tu [realm|EU] donde consagrarlo o, cuando todos estén ocupados, una provincia vecina"
 pam_canonize_saint_decision_canonize_tt: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] al dinasta difunto elegido, [GetPlayer.Custom('PamConsecratingEnshrining')] sus restos"
 pam_canonize_saint_decision_choose_1_tt: "Elige la [Concept('ecclesiastical_domicile_building','Catedral')|E] de tu [realm|EU] donde consagrarlo"
 pam_canonize_saint_decision_choose_1_holy_site_tt: "Elige el [Concept('holy_site','Lugar sagrado')|E] de tu [faith|EU] dentro de tu [realm|EU] donde consagrarlo"
 pam_canonize_saint_petition_sent_tt_saint: "Se enviará a [petition_recipient.GetTitledFirstName] para su aprobación una petición para reconocer a [saint_candidate.GetFirstName] como [Concept('canonized','Santo')|E], para ser consagrado en [consecration_province.GetName]"
 pam_canonize_saint_petition_sent_tt_va: "Se enviará a [petition_recipient.GetTitledFirstName] para su aprobación una petición para honrar a [saint_candidate.GetFirstName] como [saint_candidate.Custom('PamVeneratedSaintOrAncestor')], para ser [GetPlayer.Custom('PamConsecratedEnshrined')] en [consecration_province.GetName]"
 pam_canonize_saint_hof_chance_tt: "A juzgar por el número de [Concept('trait','rasgos')|E] virtuosos de [saint_candidate.GetShortUIName], hay aproximadamente un #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance')|0%]#! de probabilidad de que [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] conceda la petición de [GetPlayer.Custom('PamCanonizeVenerateVerb')] a esta persona"
 pam_canonize_saint_hof_chance_cynical_tt: "A juzgar por el número de [Concept('trait','rasgos')|E] virtuosos de [saint_candidate.GetShortUIName], pero moderado por la naturaleza cínica de [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName], hay aproximadamente un #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance_cynical')|0%]#! de probabilidad de que conceda la petición de [GetPlayer.Custom('PamCanonizeVenerateVerb')] a esta persona"
 pam_canonize_saint_hof_chance_puppet_tt: "Como [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] responde ante ti, la petición de [GetPlayer.Custom('PamCanonizeVenerateVerb')] a [saint_candidate.GetShortUIName] será concedida con #EMP total seguridad#!"
