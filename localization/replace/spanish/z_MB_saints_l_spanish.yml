 pam_saint_relic_arm_desc: "Un elegante relicario que guarda el brazo sagrado conservado de los benditos restos de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_desc: "Un elegante relicario que guarda el venerado cráneo de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_blood_desc: "Un elegante relicario que guarda una ampolla con la sangre sagrada de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_heart_desc: "Un elegante relicario que guarda el corazón sagrado de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_effigy_desc: "Una venerada efigie labrada a semejanza de [relic_creator_saint.GetShortUINameNotMe], honrada por los fieles."
 pam_saint_relic_letter_desc: "Un elegante relicario que guarda una carta escrita por [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_drawing_desc: "Un famoso dibujo trazado por [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_stationery_desc: "Un juego de papelería que usó [relic_creator_saint.GetShortUINameNotMe]. Se dice que otorga la misma sabiduría a quien lo posee."
 pam_saint_relic_ash_desc: "Un elegante relicario que guarda las cenizas sagradas de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_canopic_jar_desc: "Un vaso que contiene los órganos internos de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_staff_desc: "Un bastón que usó [relic_creator_saint.GetShortUINameNotMe] en [relic_creator_saint.GetHerHis] peregrinación."
 pam_saint_relic_water_filter_desc: "Un trozo de tela que usó [relic_creator_saint.GetShortUINameNotMe] como filtro de agua en [relic_creator_saint.GetHerHis] viajes."
 pam_saint_relic_bowl_desc: "Un cuenco que usó [relic_creator_saint.GetShortUINameNotMe] para pedir comida en [relic_creator_saint.GetHerHis] viajes."
 pam_saint_relic_robe_desc: "Un elegante relicario que guarda la túnica sagrada de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_sword_desc: "Una espada sagrada que empuñó [relic_creator_saint.GetShortUINameNotMe], de la que se dice que concede protección divina y fuerza a los fieles que la portan."
 pam_saint_relic_sarira_desc: "Un elegante relicario que guarda una sarira de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_buddhism_desc: "Un elegante relicario que guarda una sarira: la usnisa de [relic_creator_saint.GetShortUINameNotMe]."
