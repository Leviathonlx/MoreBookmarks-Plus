 pam_saint_events.0003.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va' )]"
 pam_saint_events.0003.t_saint: "Un nuevo santo"
 pam_saint_events.0003.t_va: "Un nuevo [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_saint_events.0003.desc_saint: "Está hecho. [saint_candidate.GetFirstName] cuenta entre los santos, consagrado en [consecration_province.GetName]. Que [saint_candidate.GetHerHis] luz bendiga a mis hermanos [saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip] durante generaciones."
 pam_saint_events.0003.desc_va: "Está hecho. [saint_candidate.GetFirstName] es honrado entre [saint_candidate.Custom('PamBlessedOnesOrAncestors')], [saint_candidate.Custom('PamConsecratedEnshrined')] en [consecration_province.GetName]. Que [saint_candidate.GetHerHis] luz bendiga a nuestro reino durante generaciones."
 pam_saint_events.0003.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va' )]"
 pam_saint_events.0003.a_saint: "Deo gratias."
 pam_saint_events.0003.a_va: "Damos gracias."
 pam_saint_events.0003.a.dynasty_opinion_tt: "Los miembros de tu [dynasty|E] que comparten tu [faith|EU] ganan #P 20#! de [Concept('opinion','Opinión')|E] sobre ti durante 20 años"
 pam_saint_events.0004.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va' )]"
 pam_saint_events.0004.t_saint: "Santidad denegada"
 pam_saint_events.0004.t_va: "Veneración denegada"
 pam_saint_events.0004.desc: "Nuestra petición de [GetPlayer.Custom('PamCanonizeVenerateVerb')] a [saint_candidate.GetFirstName] ha sido rechazada por [petition_recipient.GetTitledFirstName]. [saint_candidate.GetSheHe|U] no contará entre [GetPlayer.Custom('PamBlessedOnesOrAncestors')] este día."
 pam_saint_events.0004.a: "Que así sea."
 pam_saint_events.0005.t: "El relicario preparado"
 pam_saint_events.0005.desc: "En [extract_site.GetName], manos reverentes se han puesto a su solemne labor para extraer una santa reliquia de [relic_saint.GetShortUIName] de [relic_saint.GetHerHis] bendito cuerpo.\n\nSe preparan los festejos para celebrar esta sagrada ocasión."
 pam_saint_events.0005.a: "Que se haga con toda reverencia."
 pam_saint_events.0005.a.tt: "Pronto se extraerá de [extract_site.GetName] una [Concept('artifact','Reliquia')|E] sagrada de [relic_saint.GetShortUIName]."
 pam_saint_events.0006.t: "Una reliquia sagrada"
 pam_saint_events.0006.desc_relic: "De los sagrados restos de [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')] en [extract_site.GetName], hemos extraído una santa reliquia: #EMP [relic_artifact.GetName]#!. Que bendiga a los creyentes de mi reino durante generaciones."
 pam_saint_events.0006.desc: "De los sagrados restos de [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')] en [extract_site.GetName], se ha extraído una [Concept('artifact','Reliquia')|E] sagrada para bendecir nuestro reino."
 pam_saint_events.0006.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va' )]"
