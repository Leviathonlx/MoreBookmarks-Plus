l_spanish:
 building_type_almaden_mines_01: "Las minas de mercurio de Almadén"
 building_type_almaden_mines_01_desc: "Las minas de al-Ma‘din, explotadas desde los romanos, producen el cinabrio rojo del que se destila el azogue, y la Orden de Calatrava las guarda celosamente."
 almaden_mines_01: "Asentamiento minero de Almadén"
 almaden_mines_01_desc: "Ha surgido un pequeño asentamiento donde se hallan los yacimientos. Los primeros trabajadores apenas rascan la superficie, pero el rendimiento es prometedor."
 almaden_mines_02: "Minas de Almadén"
 almaden_mines_02_desc: "A medida que crece el asentamiento, se extrae más cada año y han llegado trabajadores cualificados para abrir explotaciones en regla."
 almaden_mines_03: "Grandes minas de Almadén"
 almaden_mines_03_desc: "Las explotaciones se han extendido por todo el lugar, con nuevas fosas y pozos abiertos para alcanzar los yacimientos más ricos del fondo."
 almaden_mines_04: "Complejo minero de Almadén"
 almaden_mines_04_desc: "En torno a las explotaciones han crecido patios de procesado, almacenes y muelles, y todo el distrito vive ahora de su comercio."
 almaden_mines_01_district: "$building_type_almaden_mines_01$"
 almaden_mines_01_district_desc_flavor: "$building_type_almaden_mines_01_desc$"
 building_almaden_mines_destination_desc: "[GetBuildingType('almaden_mines_01').GetName] bulle de actividad de sol a sol, y el comercio de azogue atrae a mercaderes de lugares lejanos."
 building_type_cornish_stannaries_01: "Las minas de estaño de Cornualles"
 building_type_cornish_stannaries_01_desc: "Los mineros de estaño de Cornualles trabajan bajo su propia ley y tribunales estanníferos, y cada lingote debe llevarse a las ciudades de acuñación para ser ensayado y gravado."
