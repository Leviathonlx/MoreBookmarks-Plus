 trade_good_camels: "Camellos"
 trade_good_camels_desc: "A lo largo del cinturón árido del mundo, el camello cargaba lo que el caballo y el buey no podían. Los dromedarios transportaban las caravanas de Arabia, Egipto y el Sáhara, y el camello bactriano, de dos jorobas, cruzaba los desiertos fríos y los pasos de montaña de Asia Central.\n\nLos pastores nómadas los criaban por millares, y una ciudad caravanera vivía o moría según los mercados de camellos de sus puertas."
