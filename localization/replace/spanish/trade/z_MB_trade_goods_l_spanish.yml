 trade_good_marble: "Mármol y piedra fina"
 trade_good_marble_desc: "El mármol, el alabastro y otras piedras finas se cortaban para columnas, altares, tumbas, pilas bautismales y pavimentos. Las canteras de Luni y Proconeso abastecían las iglesias de Italia y Constantinopla, la piedra de Purbeck y de Tournai se enviaba por toda Inglaterra y los Países Bajos, y el mármol de Macael iba a parar a los palacios de al-Ándalus.\n\nEn la India se tallaba el mármol blanco de Makrana para los templos, y la piedra veteada de Dali, en Yunnan, dio a los chinos su palabra para el mármol."
