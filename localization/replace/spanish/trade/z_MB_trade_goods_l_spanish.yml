 trade_good_pearls: "Perlas y coral"
 trade_good_pearls_desc: "Los tesoros del mar: perlas sacadas por buceadores de los bancos del golfo Pérsico, el mar Rojo y el golfo de Mannar, coral rojo cortado de los arrecifes del Mediterráneo, el carey de la tortuga marina, el nácar reluciente y las conchas de cauri de las Maldivas que servían de moneda desde Bengala y Yunnan hasta Malí.\n\nTodo ello se trabajaba en joyas, cuentas, incrustaciones y amuletos, y era codiciado por príncipes desde El Cairo hasta Hangzhou."
