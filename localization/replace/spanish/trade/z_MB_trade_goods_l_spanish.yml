 trade_good_spices_desc: "Pimienta de Malabar, canela de Lanka, jengibre de la India y China, y clavo y nuez moscada de las lejanas Molucas: las especias recorrían medio mundo antes de llegar a una mesa de El Cairo o Venecia. Se compraban para dar sabor a la comida, como medicina y, sobre todo, como muestra de riqueza, y en Inglaterra una libra de pimienta podía costar a un jornalero más que el salario de una semana.\n\nLos mercaderes Karimi de Egipto y las galeras de Venecia y Génova se enriquecieron transportándolas entre el mar Rojo y el Mediterráneo."
 trade_good_beer_desc: "Elaborada con cebada, avena o trigo, la cerveza era la bebida cotidiana del norte, hecha en casi todos los hogares y vendida por cerveceras en todas las aldeas. Para los pobres era una parte importante de su alimento diario.\n\nLa cerveza lupulada, que se conservaba mucho más tiempo, pasó de los monasterios a las ciudades del norte de Alemania, y en el siglo XIV Hamburgo la enviaba por cargamentos enteros a Holanda y Flandes. En Oriente, los vinos elaborados con arroz y mijo ocupaban el mismo lugar."
 trade_good_tea_desc: "Preparado con las hojas secas y procesadas de la planta del té, el té se convirtió en la bebida cotidiana de China bajo los Tang, cuando Lu Yu escribió su Clásico del té. Prensado en ladrillos y tortas, viajó mucho más allá de las fronteras de China.\n\nLos tibetanos y los pueblos de la estepa lo adoptaron con entusiasmo, y el Estado Song estableció mercados de té y caballos en su frontera, intercambiando té por los caballos de guerra que necesitaban sus ejércitos. Los monjes llevaron la costumbre a Corea y Japón, donde Eisai trajo semillas en 1191."
 trade_good_horses_desc: "Los caballos llevaban a caballeros, nómadas y mensajeros, tiraban de carros y carretas y, desde el siglo XII, empezaron a tirar del arado en partes del norte de Europa, aunque la mayoría de los campos aún se labraban con bueyes.\n\nLos mejores eran los caballos árabes y persas, los resistentes caballos de la estepa y los caballos jinetes de al-Ándalus. Los reinos de la India, donde los buenos caballos no se reproducían, los importaban por millares cada año a través de los puertos del Golfo y de Malabar."
 trade_good_fruit_desc: "La fruta fresca se estropeaba pronto, por lo que el comercio de fruta a larga distancia se basaba en higos secos, pasas, dátiles, almendras y ciruelas pasas. Los dátiles de los oasis de Irak y el norte de África alimentaban caravanas enteras, y los barcos llevaban pasas e higos de al-Ándalus y el Levante a los mercados del norte.\n\nMás cerca de casa, cada señorío y cada monasterio tenía huertos de manzanos, perales, cerezos y membrillos."
 trade_good_silk_desc: "La más fina de todas las fibras textiles, la seda se hila a partir de los capullos de los gusanos de seda y se teje en telas de extraordinaria suavidad y lustre. China guardó el secreto durante siglos, pero en esta época la seda también se tejía en Bizancio, cuyos talleres imperiales fabricaban telas púrpuras dignas solo de emperadores, y en Persia y Sogdiana.\n\nDe allí el oficio se extendió a al-Ándalus y Sicilia, y en el siglo XIII los telares de Lucca eran famosos en toda Europa."
 trade_good_books_paper_desc: "Los libros conservan la ley, las escrituras y el saber, y el papel los hizo más baratos. La fabricación de papel llegó a Samarcanda y Bagdad en el siglo VIII y se extendió hacia el oeste a Damasco, El Cairo y Játiva, en al-Ándalus, mientras la Europa cristiana aún escribía sobre todo en pergamino.\n\nEn Oriente, los libros se imprimían con bloques de madera tallada: la China Song imprimió los clásicos y el canon budista en vastas ediciones, y Goryeo grabó todo el Tripitaka Koreana en más de ochenta mil bloques."
 trade_good_ivory_desc: "El marfil procedía de los colmillos de los elefantes de África Oriental y la India, enviados a través de Kilwa, Adén y El Cairo, y de las morsas del lejano norte, cazadas por los nórdicos frente a Groenlandia y en el mar Blanco. Los colmillos de narval se vendían como cuernos de unicornio.\n\nLos tallistas lo trabajaban en piezas de ajedrez, peines, crucifijos, cofres y paneles de relicario de gran delicadeza."
 trade_good_alum_desc: "El alumbre es el mordiente que fija los tintes en la tela y hace sus colores firmes y vivos, y pocos tintoreros podían trabajar sin él. También se usaba para curtir cuero fino y para detener hemorragias.\n\nEl mejor alumbre procedía de las minas de Focea y el oeste de Anatolia, cuyo comercio controlaron los genoveses durante buena parte de los siglos XIII y XIV. Egipto, Castilla y las tierras en torno al mar Negro suministraban el resto."
 trade_good_flax_desc: "Cultivado tanto por sus fibras de lino como por el aceite de linaza que se extrae de sus semillas, el lino es uno de los cultivos más antiguos del hombre. Aunque la cosecha puede requerir mucho trabajo, el lino no es tan exigente como otros cultivos de fibra y puede crecer casi en cualquier lugar.\n\nEl lino de Egipto era célebre en todo el mundo islámico, y Flandes y Champaña tejían lino fino para toda Europa."
 trade_good_wood_desc: "La madera es el material cotidiano de casas, graneros, barcos, carros y combustible, y la mayoría de las regiones cortaban la suya. Los grandes bosques del Báltico y Escandinavia enviaban tablas, vigas y mástiles a las costas sin árboles.\n\nDonde se talaron los bosques, la madera se volvió escasa y cara, y Egipto y las tierras del Golfo tenían que importar casi toda la suya."
 trade_good_hemp_desc: "Una planta versátil cultivada por sus fibras resistentes, que se trenzan en cuerdas y cordeles y se tejen en lona y sacos. Todo barco necesitaba kilómetros de cuerda, y el cáñamo es esencial para cualquier economía marítima.\n\nEn China y Corea, el cáñamo fue además la tela común de la gente corriente mucho antes que el algodón."
 trade_good_wine_desc: "El vino es la bebida de la Iglesia, la nobleza y las ciudades del sur. Después de 1152, los vinos de Gascuña fluyeron de Burdeos a Inglaterra, los monjes del Císter cuidaron las laderas de Borgoña y el vino del Rin bajó por el río hacia los Países Bajos.\n\nMás al este, los vinos de Shiraz eran alabados por los poetas persas, y los monasterios cristianos mantenían viñedos desde Armenia hasta Egipto."
 trade_good_furs_desc: "Pieles de cebellina, armiño, marta, zorro, castor y, sobre todo, ardilla, cuyo vero gris y blanco forraba las vestiduras de la mitad de la nobleza de Europa. Cientos de miles de pieles de ardilla al año salían de los bosques del norte.\n\nLos búlgaros del Volga y los mercaderes de Nóvgorod se enriquecieron con el comercio de pieles, y la cebellina de más allá de los Urales era la más apreciada de todas."
 trade_good_millet_desc: "Un cereal resistente que prospera en suelos pobres y climas secos donde otros granos fracasan. El mijo cola de zorra y el mijo de escoba eran los alimentos básicos del norte de China, y el mijo perla y el sorgo alimentaban el Sahel y el Decán.\n\nEl mijo se conserva bien almacenado y, en toda África, se elaboraba con él cerveza además de hervirlo en gachas."
 trade_good_rice_desc: "El cereal dominante del sur y el este de Asia, el arroz rinde abundantemente en arrozales inundados y alimenta a vastas poblaciones. Bajo los Song, el arroz Champa de maduración rápida, procedente de Vietnam, permitió a los agricultores del sur de China obtener dos cosechas al año.\n\nTambién se cultivaba arroz de secano en las laderas áridas, y en África Occidental se cultivaba a lo largo del Níger un arroz propio."
 trade_good_jade_desc: "Una piedra dura y hermosa de gran significado cultural en Asia Oriental, el jade se trabaja en herramientas, adornos y objetos rituales. Alcanza precios enormes en las cortes chinas y es símbolo de virtud y rango.\n\nLa mayor parte del jade de China, la nefrita apreciada por encima del oro, se recogía en los lechos de los ríos de Jotán y se transportaba hacia el este por la Ruta de la Seda."
 trade_good_gold_desc: "El más precioso de los metales, el oro es la base de los tesoros reales y de la moneda de mayor valor. Su rareza y su brillo lo convierten en el material preferido para coronas, reliquias y objetos de ostentación.\n\nGran parte del oro del mundo islámico, y más tarde de Europa, procedía de los campos de Bambuk y Bure, en África Occidental, y se llevaba a través del Sáhara hasta Sijilmasa. Mansa Musa gastó tanto en El Cairo camino de La Meca en 1324 que su precio cayó durante años."
 trade_good_gems_desc: "Las piedras preciosas, incluidos rubíes, zafiros y esmeraldas, figuran entre los bienes más valiosos de cualquier ruta comercial. Talladas y pulidas, adornan coronas, relicarios y las joyas de los poderosos.\n\nLos rubíes y el lapislázuli procedían de las minas de Badajshán, los zafiros y rubíes de Lanka, las esmeraldas de los desiertos de Egipto y la turquesa de Nishapur."
 trade_good_incense_desc: "Resinas aromáticas como el incienso y la mirra, quemadas en ceremonias religiosas de todas las confesiones. El incienso procedía de Dhofar, Hadramaut y la costa somalí, y la mirra de Arabia y Etiopía.\n\nAún más ricos eran el almizcle de los ciervos del Tíbet, la madera de áloe de los bosques de Champa y Camboya, el alcanfor de Sumatra y Borneo, y el ámbar gris arrojado a las costas del océano Índico."
