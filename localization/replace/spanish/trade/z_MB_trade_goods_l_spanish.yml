 trade_good_beeswax: "Cera de abeja"
 trade_good_beeswax_desc: "La cera era la luz de la Iglesia medieval. Los cirios de altar y votivos se hacían con cera de abeja, que ardía más clara y limpia que el humeante sebo, y las grandes iglesias la quemaban por quintales en los días de fiesta. También sellaba cartas y documentos, y escribanos, estudiantes y mercaderes escribían sus borradores y cuentas en tablillas de cera. La gran fuente era el bosque de la Rus y Polonia, donde los apicultores vaciaban colmenas en árboles vivos; Nóvgorod enviaba cera hacia el oeste a través de la Hansa por cargamentos enteros, y Bugía, en la costa berberisca, vendía tanta a Europa que los franceses dieron a sus velas el nombre de la ciudad."
