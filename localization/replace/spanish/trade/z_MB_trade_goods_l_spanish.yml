 trade_good_sulfur: "Azufre y salitre"
 trade_good_sulfur_desc: "El azufre se recogía de las fumarolas y costras del suelo volcánico: la Solfatara cerca de Nápoles, las islas Eolias, el Damavand, Islandia y las montañas de Java y Japón. Los médicos lo quemaban contra las enfermedades, los bataneros blanqueaban la lana con sus vapores y los alquimistas buscaban sus secretos.\n\nEn Oriente, el azufre se unió al salitre y al carbón vegetal en la droga de fuego de la China Song, y el azufre japonés se enviaba por mar en cargamentos enteros."
