 trade_good_betel: "Betel y kola"
 trade_good_betel_desc: "En todos los trópicos la gente mascaba frutos secos para mantenerse despierta, calmar el hambre y dar la bienvenida a un invitado. En la India y las tierras de los mares del sur, la nuez de areca se envolvía en una hoja de betel con cal, y ofrecerla era la primera cortesía de toda casa.\n\nEn África Occidental, la nuez de kola del bosque se llevaba hacia el norte a través del Sahel, y en Yemen y Etiopía se mascaban de la misma manera las hojas de qat."
