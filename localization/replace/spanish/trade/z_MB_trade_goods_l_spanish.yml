 trade_good_fine_woods: "Maderas finas"
 trade_good_fine_woods_desc: "Cierta madera valía mucho más que su peso en leña. La teca de Malabar y Birmania construía los barcos del océano Índico, el ébano negro de Lanka y África se incrustaba en cofres y muebles, y los cedros del Líbano y del Atlas cubrían palacios y mezquitas.\n\nEl boj de la costa del Cáucaso era apreciado por tallistas y torneros por su grano duro y cerrado."
