l_spanish:
 trade_good_tin: "Estaño"
 trade_good_tin_desc: "El estaño es la parte menor del bronce y la mayor del peltre, y se trabaja en campanas, platos, copas y vasos litúrgicos. Pocos lugares lo producen, por lo que viaja lejos: desde las minas de estaño de Cornualles y Devon y los Montes Metálicos hasta los mercados de Europa, y desde Yunnan y la península malaya a través de los mares orientales.\n\nLa mayor parte del estaño se obtenía por lavado, separando el pesado mineral negro de las gravas fluviales, antes de que los mineros siguieran las vetas bajo tierra."
 trade_good_tin_name: "estaño"
 trade_good_tin_production_add: "@resource_tin! [GetTradeGoodType('trade_good_tin').GetName] [production|E]"
