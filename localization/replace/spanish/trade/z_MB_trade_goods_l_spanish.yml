 trade_good_coal: "Carbón"
 trade_good_coal_desc: "Donde se habían talado los bosques, los hombres quemaban en su lugar la piedra negra. La China Song alimentaba sus hornos de hierro y los hogares de Kaifeng con carbón de Shanxi y Hebei, y los mineros de Lieja ya lo extraían en el siglo XII.\n\nDesde Newcastle, el carbón marino se enviaba costa abajo hasta Londres y a Flandes para herreros, caleros y cerveceros."
