 trade_good_falcons: "Halcones de caza"
 trade_good_falcons_desc: "La cetrería era el deporte de los reyes desde Irlanda hasta Japón, y un buen ave era un regalo digno de un sultán o de un emperador. Los gerifaltes blancos de Islandia, Noruega y Groenlandia, los sacres de la estepa y los haidongqing de los bosques yurchen eran los más apreciados de todos.\n\nLos cazadores sacaban los polluelos de los nidos, y los cetreros pasaban meses amansándolos antes de poder venderlos."
