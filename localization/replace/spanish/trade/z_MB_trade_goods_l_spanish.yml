 trade_good_pitch: "Pez y alquitrán"
 trade_good_pitch_desc: "La pez, el alquitrán, la resina y la potasa eran los pertrechos navales sin los cuales no se podía calafatear ningún barco, conservar ninguna cuerda ni mantener sano ningún casco. Se obtenían quemando madera de pino en hornos lentos y sofocados en lo profundo de los bosques.\n\nLos pinares del Báltico, Escandinavia y la Rus, las Landas, la Sila y los pinares de Castilla enviaban su alquitrán a los astilleros de las costas."
