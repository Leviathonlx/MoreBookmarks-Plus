 trade_good_lead: "Plomo y mercurio"
 trade_good_lead_desc: "El plomo era el pesado metal gris de los tejados, canalones, tuberías y emplomados de las vidrieras, y el vidriado de los alfareros. Rara vez se extraía por sí solo: el plomo y la plata procedían de los mismos minerales, desde las Mendips y el Peak hasta el Harz, Cerdeña y las minas de Serbia.\n\nEl azogue, destilado del cinabrio en lugares como Almadén, era apreciado por igual por doradores, médicos y alquimistas."
