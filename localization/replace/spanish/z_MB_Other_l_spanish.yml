 british_isles.1001.desc: "Ahora que los distintos reinos de Inglaterra están bajo un solo rey, es hora de eliminar los múltiples títulos y sustituirlos por uno solo: ¡el Reino de Inglaterra!"
 british_isles.1001.a: "¡Amanece una nueva era!"
 reunite_two_sicilies_decision: "Reunir las Dos Sicilias"
 reunite_two_sicilies_decision_desc: "Si los dos reinos de Sicilia fueran gobernados por un único rey, podrían volver a reunirse en una sola Sicilia, como lo fueron antaño."
 reunite_two_sicilies_decision_confirm: "$reunite_two_sicilies_decision$"
 reunite_two_sicilies_decision_tooltip: "Fusiona Nápoles y Trinacria en un único [kingdom|E] [de_jure|E]"
 form_mamluk_decision: "Fundar el Sultanato mameluco"
 form_mamluk_decision_desc: "Los mamelucos fueron traídos a estas tierras como esclavos guerreros del Cáucaso y de la estepa. Recibimos una formación exhaustiva en distintos campos, como las artes marciales, la etiqueta cortesana y las ciencias islámicas, y ahora nos hallamos en posición de gobernar las tierras de nuestros antiguos amos y fundar un nuevo sultanato bajo el gobierno de los mamelucos."
