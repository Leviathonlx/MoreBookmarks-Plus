 germanic_religion_desc: "En la Alta Edad Media, el antiguo sistema de creencias germánico sigue siendo dominante en Escandinavia y el norte de Alemania. Un panteón de dioses, bajo el sabio dios guerrero Odín (o Wodan), gobierna todas las ramas del árbol del mundo, Yggdrasil. Los otros dos dioses principales son Thor (Thunar), amigo de la humanidad, y Frey, dios de la fertilidad."
