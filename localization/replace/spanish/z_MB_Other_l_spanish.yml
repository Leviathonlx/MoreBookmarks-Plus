 DOMAIN: "Dominio"
 task_manage_domain: "Gestionar el dominio"
 task_manage_domain_effect_desc: "[councillor.GetShortUINameNoTooltip] se centra en tu dominio y en tus posesiones personales\n\nEl apoyo de [councillor.GetHerHis|U] te proporciona:\n[councillor.GetModifierDescForTask('task_manage_domain')]"
 innovation_guilds_desc: "A medida que nuestras tierras se expanden, resulta cada vez más ineficiente gestionar directamente todo el comercio de nuestro dominio. Al conceder cartas gremiales a las organizaciones de mercaderes y artesanos, podemos darles más autonomía sobre sus negocios y, al mismo tiempo, seguir beneficiándonos de sus empresas."
 innovation_seigneurialism_desc: "Al delegar más responsabilidades en los nobles locales, podemos tanto satisfacerlos como liberar más de nuestra atención para centrarnos en nuestro propio dominio."
 THEOCRATIC_LEASE_INCOME_DOMAIN: "Templos en el dominio de [CHARACTER.GetShortUINamePossessive]"
 major_decisions.0501.desc: "Mediante matrimonios, alianzas y conquistas cuidadosamente planeados, la dinastía [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] ha ocupado el lugar que le corresponde entre las verdaderas potencias del mundo conocido.\n\n[realm_1.GetNameNoTierNoTooltip|U], [realm_2.GetNameNoTierNoTooltip|U], [realm_3.GetNameNoTierNoTooltip|U], [realm_4.GetNameNoTierNoTooltip|U]... Nuestro dominio se extiende a lo largo y ancho. Muchas coronas descansan sobre nuestras cabezas, pero por la sangre estamos unidos como uno solo."
 roman_restoration.0023.desc: "La isla de Hibernia es la última incorporación al dominio, en constante expansión, del Imperio romano. Esta tierra de suaves colinas y verdes campos nunca fue conquistada por el antiguo imperio, pero debería convertirse en un agradable feudo que gobernar, siempre que a uno no le moleste la lluvia ni los colonos nórdicos malolientes de la costa."
 nobility_domain: "dominio"
 nobility_domain_plural: "dominios"
 stewardship_duty.1071.desc: "Una afluencia de siervos ha llegado a [target_county.GetName] desde el vecino [origin_county.GetName]. Afirman que huyen del gobierno abusivo de [origin_county_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] y que desean vivir en mi dominio en lugar de en el de [origin_county_owner.GetHerHis].\n\nLegalmente siguen sujetos a [origin_county_owner.GetFirstName], pero si les permito asentarse en mis tierras, a [origin_county_owner.GetHerHim] le resultaría casi imposible demostrar que en realidad son siervos de [origin_county_owner.GetHerHis]."
 diplomacy_foreign.1153.desc: "[ruler.GetTitledFirstName] me ha presentado hoy una propuesta peculiar.\n\n[ruler.GetSheHe|U] afirma que renunciaría a [ruler.GetHerHis] control sobre [neighbor_county.GetNameNoTier], una provincia sobre la que mi reino tiene antiguas pretensiones, a cambio de [county.GetName], sobre la que sus antepasados habrían ejercido dominio."
 martial_authority.2050.desc.vassal: "dentro de su propio dominio."
 vassal.1001.desc: "Mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))], el [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_liege'))] [religious_liege.GetTitledFirstName], está pasando por mi dominio. Mientras [religious_liege.GetSheHe] observa los edificios, [religious_liege.GetSheHe] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_liege'))] y frunce el ceño.\n\n\"¿Sabéis qué falta en esta vista? Un [religious_liege.GetFaith.HouseOfWorship]: ¡un glorioso tributo a [religious_liege.GetFaith.HighGodName]!\""
 vassal.1101.desc: "\"Mi [ROOT.Char.GetLadyLord], ha llegado a mi conocimiento que hay sitio para un [religious_vassal.GetFaith.HouseOfWorship] en vuestro dominio.\"\n\nMi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))], el [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_vassal'))] [religious_vassal.GetTitledFirstName], [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_vassal'))] antes de continuar: \"Si construís uno, sin duda tendréis la gratitud de [religious_vassal.GetFaith.HighGodNameAlternatePossessive], así como la mía."
 stress_threshold.3411.desc.just: "justo que sea, por muy fervientemente que persiga el imperio de la ley, el crimen sigue pudriéndose en todos los rincones de mi dominio."
 ostentatious_follies_modifier_desc: "El dominio de este personaje está salpicado de feos monumentos a medio terminar en honor a su grandeza."
 raiding.0004.desc.spared_plundered: "A pesar de haber asediado con éxito el asentamiento de [sacked_barony.GetNameNoTierNoTooltip], una fortificación que protege amplias zonas del gran [sacked_county.GetNameNoTierNoTooltip], [raider.GetTitledFirstName] ha refrenado a [raider.GetHerHis] tropas. El saqueo resultante ha sido aislado y esporádico.\n\nAunque tu vasallo se ha librado, los [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] miran con avidez tu dominio personal..."
 stewardship_domain_focus: "Enfoque en el dominio"
 stewardship_domain_focus_effect_desc: "Centrarse en el dominio otorga:"
