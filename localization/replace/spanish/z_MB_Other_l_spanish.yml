 innovation_nomad_boats: "Capacidad naval nómada"
 innovation_nomad_boats_desc: "Los pueblos de la estepa no eran conocidos por su destreza naval y siempre dependieron de otras culturas conquistadas para contar con flotas, como cuando los mongoles se apoyaron en los han y los coreanos para su invasión de Japón."
 innovation_mongol_acceptance: "Imperio mongol"
