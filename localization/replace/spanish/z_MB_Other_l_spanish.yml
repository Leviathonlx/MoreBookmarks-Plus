 holy_order_county_government: "Orden sagrada"
 holy_order_county_government_desc: "Esta es una orden sagrada que ha conquistado una región y ha asumido un papel más propio de los reinos feudales. Aunque es sagrada en nombre y apariencia, y quizá en algunas de sus funciones de gobierno, los hermanos de este capítulo funcionan en gran medida como una monarquía electiva."
 holy_order_county_government_adjective: "de orden sagrada"
 holy_order_county_government_realm: "Orden sagrada"
 landed_order_elective_title_succession_law: "Electiva de orden con tierras"
 landed_order_elective_title_succession_law_effects: "El [ruler|E] y todos los [vassals|E] directos de la misma fe pueden nominar a un [title_heir|E] entre los maestres de orden y todos los consejeros de la misma fe del [ruler|E]. El [title_heir|E] heredará todos los títulos primarios del [ruler|E]. \n$EFFECT_LIST_BULLET$Se preferirá a los candidatos de más edad, más prestigio y más destreza"
 landed_order_elective_candidates: "Consejeros y vasallos de órdenes con tierras"
 landed_order_elective_candidates_tooltip: "Para ser un candidato válido bajo la sucesión electiva de orden con tierras, un personaje debe cumplir una de las siguientes condiciones:\n$EFFECT_LIST_BULLET$Ser consejero de la misma fe del gobernante actual\n$EFFECT_LIST_BULLET$Ser vasallo directo de orden con tierras y de la misma fe del gobernante actual"
 landed_order_elective_electors: "Gobernante y vasallos de la misma fe"
 landed_order_elective_electors_tooltip: "Para ser un [elector|E] válido bajo la sucesión electiva de orden con tierras, un vasallo debe cumplir todas las siguientes condiciones:\n$EFFECT_LIST_BULLET$Ser vasallo directo del gobernante actual\n$EFFECT_LIST_BULLET$Seguir la misma [faith|E] que el gobernante actual"
 holy_order_county_succession_law: "Orden sagrada"
 holy_order_county_succession_law_effects: "Los guerreros santos de las órdenes han dedicado su vida a combatir a los infieles y a servir a su fe. Pueden poseer castillos entregados por piadosos terratenientes. El líder de la orden se elige entre los miembros de sus filas."
 holy_elective_candidates: "Familiares cercanos, pretendientes y electores"
 holy_elective_candidates_tooltip: "Para ser un candidato válido bajo la sucesión electiva feudal, un personaje debe cumplir una de las siguientes condiciones:\n$EFFECT_LIST_BULLET$Ser un miembro legítimo de la [close_family|E] del gobernante actual que no esté en la línea de sucesión de una teocracia o república\n$EFFECT_LIST_BULLET$Ser un [claimant|E] al título que no esté en la línea de sucesión de una teocracia o república\n$EFFECT_LIST_BULLET$Ser un [elector|E] feudal válido del título\n$EFFECT_LIST_BULLET$Se preferirá a los candidatos de más edad, más prestigio y más destreza"
 holy_elective_electors: "Gobernante y vasallos"
 holy_elective_electors_tooltip: "Para ser un [elector|E] válido bajo la sucesión electiva feudal, un vasallo debe cumplir todas las siguientes condiciones:\n$EFFECT_LIST_BULLET$Ser vasallo directo del título\n$EFFECT_LIST_BULLET$Estar solo uno o dos [ranks|E] por debajo del título"
 muhammad_succession_sunnikaraite_doctrine_name: "Caraísmo"
 muhammad_succession_sunnikaraite_doctrine_desc: "Los judíos caraítas constituían una gran parte de la población de Egipto y, en el mundo musulmán, también alcanzaron altas posiciones sociales, como recaudadores de impuestos, médicos y escribas, e incluso obtuvieron cargos especiales en la corte egipcia"
