 MY_REALM_WINDOW_DOMAIN_TAB: "Dominio"
 MY_REALM_WINDOW_DOMAIN_LIMIT: "Dominio:"
 MY_REALM_WINDOW_DOMAIN_LIMIT_WARNING: "#X Dominio: #!"
 lesson_basics_domain: "XII — Dominio"
 lesson_basics_domain_2_desc: "Ten en cuenta que hay un límite a la cantidad de tierra que puedes poseer personalmente antes de empezar a sufrir penalizaciones: el [domain_limit|E].\n\n#TUT Cuando superes tu límite de dominio, puede ser buena idea usar la interacción #TUT_KW Conceder título#! con [characters|E] con los que tengas buena relación, convirtiéndolos en tus [vassals|E].\n\nComo no tienes títulos de sobra que regalar, ahora mismo no puedes hacerlo, pero normalmente lo encontrarías en el menú de $game_concept_character$, visible al hacer clic derecho sobre un $game_concept_character$.#!"
 reactive_advice_domain_limit_step_1: "Límite de dominio"
 reactive_advice_domain_limit_desc: "Actualmente tienes más tierras en tu [domain|E] de las que tu personaje puede gestionar por sí mismo: ¡es hora de crear nuevos [vassals|E]!\n\nComo querrás conservar los títulos valiosos en tu dominio, te recomendamos ir a la pestaña Dominio de la vista de Reino, donde puedes ver cuánto vale cada título para ti. Ten en cuenta también qué títulos están en tu [de_jure|E].\n\n#TUT Conviene evitar permanecer demasiado tiempo por encima del [domain_limit|E], ya que tiene consecuencias.\n\nPara mantenerte por debajo del límite, debes conceder los [titles|E] sobrantes a nuevos vasallos. Aunque puedes concedérselos a tus vasallos actuales, a menudo es mejor buscar a alguien sin tierras.\n\nLos miembros lejanos de la [dynasty|E] o los [courtiers|E] con el [trait|E] [GetTrait('content').GetName( GetPlayer )] son excelentes vasallos. Los [claimants|E] a tus títulos, o los cortesanos [GetTrait('ambitious').GetName( GetPlayer )], no tanto.#!"
 reactive_advice_vassal_limit_desc: "Nadie puede gestionar una horda de condes: ¡los aspirantes a conquistadores deben apoyarse en [vassals|E] de mayor rango, como los duques, para que administren sus tierras!\n\nPuedes ver tu límite de vasallos actual en la vista de Dominio.\n\n#TUT Al igual que con tu límite de dominio, no te conviene superar tu [vassal_limit|E]. Para evitar esta penalización, debes consolidar a tus vasallos.\n\nLa mejor manera de hacerlo es conceder [duchies|E] a tus vasallos, para que gobiernen un área mayor y tú no tengas que hacerlo. Para que esto funcione, tú mismo debes poseer un [kingdom|E] o un [empire|E]: ¡no cometas el error de regalar uno de tus [primary_titles|E]!\n\nSi como duque superas el límite de vasallos, te sugerimos formar un reino lo antes posible."
 princely_elective_succession_law_effects: "El emperador y los siete príncipes electores pueden nominar a un [title_heir|E] entre ellos mismos, los hijos [legitimate|E] y los hermanos del [ruler|E], así como cualquier otro [vassal|E] [de_jure|E] importante del Imperio. Si un [title|E] electoral histórico está en manos de infieles o no existe, otro vasallo [de_jure|E] ocupará su lugar. Esta [succession_law|E] otorga gran importancia a la [faith|E] y a la [piety|E].\n\nLos títulos electorales de este reino son los arzobispados de Colonia, Maguncia y Tréveris, el Reino de Bohemia, el Condado Palatino del Rin, el Ducado de Sajonia y el Margraviato de Brandeburgo (Nordmark)."
 princely_elective_electors_tooltip: "Para ser un [elector|E] válido bajo la sucesión electiva principesca, un gobernante debe poseer uno de los siguientes títulos:\n$EFFECT_LIST_BULLET$El Sacro Imperio Romano Germánico\n$EFFECT_LIST_BULLET$Arzobispado de Colonia\n$EFFECT_LIST_BULLET$Arzobispado de Maguncia\n$EFFECT_LIST_BULLET$Arzobispado de Tréveris\n$EFFECT_LIST_BULLET$Reino de Bohemia\n$EFFECT_LIST_BULLET$Condado Palatino del Rin\n$EFFECT_LIST_BULLET$Ducado de Sajonia\n$EFFECT_LIST_BULLET$Margraviato de Brandeburgo (Nordmark)."
 game_concept_levies_desc: "La mayor parte de los [armies|E] se compone de $game_concept_levies$.\n\nCada [holding|E] aporta un número fijo de $game_concept_levies$ a su [holder|E]. A su vez, los [vassals|E] aportan una parte de sus $game_concept_levies$ a su [liege|E].\n\nLas $game_concept_levies$ están formadas en su mayoría por combatientes mal armados que tenían que costearse su propio equipo #weak (hombres libres plebeyos, mercenarios locales, nobles empobrecidos, pequeños terratenientes, etc.)#! y se consideran un tipo de unidad propio.\n\nUna $game_concept_levy$ tiene [GetDefine('NCombat', 'LEVY_ATTACK')|0] de [damage|E] y [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] de [toughness|E]. El otro tipo de [soldiers|E] del juego son los [men_at_arms|E]: profesionales entrenados y costosos."
 LV_FLAVOR: "Las levas se componen de nobles menores, mercenarios y hombres libres plebeyos que servían a un noble superior y se equipaban con lo que podían permitirse. Su gran número constituye la mayor parte de la mayoría de los ejércitos."
