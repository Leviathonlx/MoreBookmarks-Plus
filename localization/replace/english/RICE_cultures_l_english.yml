 ### Culture Hybrid/Divergence Unique Text
 iranian_hun_history_loc:0 "Formed from various cultures of $iranian_group$ and $turkic_group$ [heritage|E] in the year [DATE.GetYear]"

 elymaean_history_loc:0 "Descended from Neo-[CULTURE.GetName] remnants under Persian rule in the first millennium BCE"

 khuzi_history_loc:0 "Formed from [CULTURE.GetName] as the last vestige of ancient [TARGET_CULTURE.GetCollectiveNoun] after the Arab Conquest"

 tuareg_history_loc:0 "Formed from [CULTURE.GetName] who settled in the southern Sahara among $central_african_group$ peoples"

 afro_roman_history_loc:0 "Formed from [CULTURE.GetName] and Punic in the year 146 BCE"

 RICE_kinh_history_loc:0 "Formed from [CULTURE.GetName] and [TARGET_CULTURE.GetName] in [Glossary( 'Vietnam', 'VIETNAMESE_GLOSS' )]"

 RICE_dorset_history_loc:0 "The [Glossary( 'Tuniit', 'DORSET_GLOSS' )] are long-time inhabitants of north Canada and Greenland"

 RICE_inuit_history_loc:0 "The [Glossary( 'Inuit', 'INUIT_GLOSS' )] are a recent wave of newcomers to north Canada and Greenland"

 RICE_laurentian_history_loc:0 "The [Glossary( '$laurentian_collective_noun|q$', 'LAURENTIAN_GLOSS' )] are native to the Saint Lawrence river valley"

 RICE_innu_history_loc:0 "The [Glossary( '$innu_collective_noun|q$', 'INNU_GLOSS' )] are native to the Labrador and Quebec"

 RICE_east_cree_history_loc:0 "The [Glossary( '$east_cree_collective_noun|q$', 'EAST_CREE_GLOSS' )] are native to much of Canada"

 RICE_mikmaq_history_loc:0 "The [Glossary( '$mikmaq_collective_noun|q$', 'MIKMAQ_GLOSS' )] are native to Canada's Atlantic provinces"

 RICE_maliseet_history_loc:0 "The [Glossary( '$maliseet_collective_noun|q$', 'MALISEET_GLOSS' )] are native to New Brunswick, Quebec, and Maine"

 RICE_passamaquoddy_history_loc:0 "The [Glossary( '$passamaquoddy_collective_noun|q$', 'PASSAMAQUODDY_GLOSS' )] are native to New Brunswick and Maine"

 RICE_penobscot_history_loc:0 "The [Glossary( '$penobscot_collective_noun|q$', 'PENOBSCOT_GLOSS' )] are native to Maine"

 RICE_abenaki_history_loc:0 "The [Glossary( '$abenaki_collective_noun|q$', 'ABENAKI_GLOSS' )] are native to Maine, Vermont, New Hampshire, and Quebec"

 RICE_beothuk_history_loc:0 "The [Glossary( '$beothuk_collective_noun|q$', 'BEOTHUK_GLOSS' )] are native to Newfoundland"

 RICE_goliad_history_loc:0 "Descended from $baltic_group$ tribes living in the Dnieper basin in the first millennium CE"

 RICE_chagga_history_loc:0 "Formed from $heritage_bantu_name$ settlers around Mt. Kilimanjaro in the early 2nd millennium CE"

 RICE_nabati_history_loc:0 "Formed from the descendants of ancient southern Mesopotamians"

 RICE_kutai_history_loc:0 "Formed from Dayaks in eastern Borneo with some foreign influences"

 ### Traditions
 tradition_RICE_siberian_survivalists_name:0 "Siberian Survivalism"

 tradition_RICE_siberian_survivalists_desc:1 "Since time immemorial, the peoples of Siberia have lived, survived, and thrived in the frozen lands of the far north. Their knowledge of life and death in these regions serve them well."

 tradition_RICE_swahili_contacts_name:0 "Swahili Contacts"

 tradition_RICE_swahili_contacts_desc:1 "The Bantu-speaking peoples of the Swahili coast have centuries of experience exploring and adventuring throughout the lands and islands of the eastern side of the Indian Ocean."

 tradition_RICE_ubiquity_of_poetry_name:0 "Ubiquity of Poetry"

 tradition_RICE_ubiquity_of_poetry_desc:1 "The tradewinds and waves of the Indian Ocean carry with them not only new goods and people, but ideas and stories. As a result, poetry is everywhere for the people of this culture - everyone from the humblest commoner to the mightiest monarch can be heard singing poetry in their daily lives, and the language of metaphors and symbolism is highly respected."

 culture_parameter_unlock_rice_siberian_hunters:0 "Can recruit [GetMaA('RICE_siberian_hunters').GetName] as [men_at_arms|E]"

 culture_parameter_unlock_rice_swahili_sailors:0 "Can recruit [GetMaA('RICE_swahili_sailors').GetName] as [men_at_arms|E]"

 culture_parameter_unlock_rice_decision_poetry_contest:0 "Unlocks the [GetActivityType('activity_RICE_socotra_host_poetry_contest').GetName] [activity|E]"

 tradition_RICE_xianbei_scions_name:0 "Xianbei Scions"

 tradition_RICE_xianbei_scions_desc:1 "These people see themselves as the true, direct or symbolic successors of the once powerful and feared Xianbei nomad clans, particularly the Murong branch. They deftly safeguard their nomad traditions while adapting to the customs of tribes they rule or live near by."

 culture_parameter_unlock_rice_decision_nadun_festival:0 "Unlocks the $RICE_tuyuhun_attend_nadun_festival$ [decision|E]"

 culture_parameter_unlock_rice_decision_restore_tuyuhun_kingdom:0 "Unlocks the [decision|E] to $RICE_tuyuhun_restore_tuyuhun_kingdom$"

 culture_parameter_unlock_rice_travel_option_qinghaicong_horses:0 "Enables the [GetTravelOption('RICE_tuyuhun_qinghaicong_horses_option').GetName] [travel_option|E]"

 tradition_RICE_white_huns_name:0 "White Huns"

 tradition_RICE_white_huns_desc:0 "#F These people are descended from fearsome steppe tribes called the White Huns by some, who swept into Persia and India in late antiquity. With their mixture of Iranian, Hunnic, Turkic, and Indian influences, their origins are shrouded in mystery. They have settled down somewhat, adopting trade and new religious beliefs, but their skill in battle is still recognized.#!"

 culture_parameter_unlock_rice_decision_hephthalite_empire:0 "Unlocks the [decisions|E] to $RICE_pamir_reclaim_hephthalite_homeland$ and $RICE_pamir_restore_hephthalite_empire$"

 culture_parameter_unlock_cantiga_decisions:0 "Gain the [decisions|E] to Compose [cantigas|E] and the Cantigas de Santa Maria regardless of the [language|E] or [heritage|E] of your [culture|E] (if other requirements are met)"

 culture_parameter_better_cantiga_results:0 "[characters|E] of this [culture|E] have a better chance of composing [cantigas|E] of higher [cantiga_quality|E]"
 #culture_parameter_more_frequent_cantiga_compositions:0 "Cooldown for composing [cantigas|E] is reduced by #P -20% #!"
 culture_parameter_promote_cantiga_bonuses:0 "Taking the [decision|E] to $RICE_galicia_promote_cantiga$ provides more [piety|E] and [prestige|E], and the [artifacts|E] it creates have additional bonuses"
 # and to Compose the Cantigas de Santa Maria - NOT SECULAR?
 culture_parameter_unlock_rice_pamir_tribesmen:0 "Can recruit [GetMaA('RICE_pamir_tribesmen').GetName] as [men_at_arms|E]"

 tradition_RICE_whalers_name:0 "Experienced Whalers"

 tradition_RICE_whalers_desc:0 "#F This culture is well-practiced in the methods used to hunt whales and how to extract meat and blubber from the whale.#!"

 tradition_RICE_master_whalers_name:0 "Master Whalers"

 tradition_RICE_master_whalers_desc:0 "#F It is not an exaggeration to say that this culture truly understands whaling in a way few outsiders can. Not only are they experts in locating and hunting whales, and processing their meat and blubber, they also are savvy entrepreneurs, whose leaders are keen to finance the whaling industry in order to profit from it.#!"

 culture_parameter_unlock_rice_whaling:0 "Unlocks the [decision|E] to $RICE_north_atlantic_whale_hunt$"

 culture_parameter_unlock_rice_whaling_stations:0 "Unlocks the [decisions|E] to $RICE_north_atlantic_whale_exempt_tax$ and $RICE_north_atlantic_whale_levy_extra_tax$ for [rulers|E] of [counties|E] of this [culture|E]"

 culture_parameter_unlock_rice_better_whaling:0 "Unlocks the [decision|E] to $RICE_north_atlantic_whale_hunt$ and, compared to other [cultures|E] that also have this [decision|E], has better odds of a successful result, and might gain more [gold|E] if that happens"

 tradition_RICE_arctic_adaptations_name:0 "Arctic Adaptations"

 tradition_RICE_arctic_adaptations_desc:0 "#F Over the course of centuries, this culture has developed traditional knowledge and institutions that are essential in helping them not only survive, but thrive in the cold lands and waters of the Arctic region.#!"

 culture_parameter_unlock_rice_arctic_innovations:0 "Unlocks the $innovation_RICE_dog_sleds$, $innovation_RICE_toggling_harpoons$, and $innovation_RICE_arctic_boats$ [innovations|E] for this [culture|E] in the $culture_era_tribal$ [era|E]"

 RICE_greenland_negative_resource_mitigation_desc:0 "Reduces the negative effects of low @RICE_greenland_resilience_icon! [greenland_resilience|E] and @RICE_greenland_networks_icon! [greenland_networks|E] on [decisions|E] for [rulers|E] [struggle_involved|E] in the [RICE_greenland_struggle|E]"

 RICE_whale_success_bonus_desc:0 "Increases the chances of success when taking the [decision|E] to $RICE_north_atlantic_whale_hunt$"

 RICE_whale_cost_bonus_desc:0 "Reduces the costs of the [decision|E] to $RICE_north_atlantic_whale_hunt$"
 #RICE_expedition_success_bonus_desc:0 "Increases the chances of success for [greenland_expeditions|E] in the North Atlantic"
 RICE_expedition_cost_bonus_desc:0 "Reduces the costs of [greenland_expeditions|E] in the North Atlantic"

 tradition_RICE_seasonal_migrators_name:0 "Seasonal Migrators"

 tradition_RICE_seasonal_migrators_desc:0 "#F This culture lives sustainably by observing the cycle of the seasons. In summertime, people stay near bodies of water like rivers, lakes, and the coast to feed on a marine diet; in the winter, they go into the woods to hunt and forage. Thus, life is structured into a clear, binary rhythm.#!"

 tradition_RICE_red_ochre_name:0 "People of the Red Ochre"

 tradition_RICE_red_ochre_desc:0 "#F The color red may be important to many societies around the world, but in this culture, it has a preeminent position. Red ochre is used liberally to paint everything, from houses and weapons to people. It is used as insect repellent, in religious rituals, and as a signifier that one belongs to the tribe - those that are ostracized are denied the right to wear this red paint.#!"

 RICE_icelandic_history_loc:0 "Formed from $north_germanic_group$ and $goidelic_group$ settlers in the year [DATE.GetYear]"

 tradition_RICE_boba_drinkers_name:0 "Boba Drinkers"

 tradition_RICE_boba_drinkers_desc:0 "#F Boba, also known as Boba Tea or Bubble Tea, is consumed regularly by members of this culture in various social and ritual contexts. For instance, among unmarried or young youths of this culture, it is commonly drank in a group setting after a large meal.#!"

 tradition_RICE_music_practice_name:0 "Music Practicers and Enjoyers"

 tradition_RICE_music_practice_desc:0 "#F This culture believes it is important to practice classical instruments regularly, whether for personal enrichment or for status gain, regardless of one's actual ability in music. Conversely, the youths of this culture often enjoy going to raves and listening to EDM music. (Members of this culture also, oddly, tend to have a higher chance of having perfect pitch.)#!"

 culture_parameter_unlock_rice_edm_raves:0 "Unlocks the [decision|E] to Attend an EDM Rave and the [interaction|E] to ask someone to be your Rave Bae"

 culture_parameter_unlock_rice_music_practice:0 "Unlocks the [decision|E] to Practice an Instrument and potentially gain the [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] [trait|E]"

 culture_parameter_unlock_rice_boba_drink:0 "Unlocks the [decision|E] to Drink Boba to reduce [stress|E] or to socialize with others"

 culture_parameter_unlock_rice_kevin_nguyen_abg:0 "Unlocks the [decisions|E] to Become an AGB or Kevin Nguyen and to form the Kevin or ABG [cultures|E]"

 tradition_RICE_kala_settlements_name:0 "Kala Settlements"

 tradition_RICE_kala_settlements_desc:0 "The frontiers of the Iranian world and the Central Asian steppes are lands filled with different peoples and lifestyle that are often in a state of flux. Conflict is inevitable in these borderlands, and this culture has developed a tradition of turning their important settlements into fortified centers to protect what is theirs and facilitate trade and political control."

 culture_parameter_unlock_rice_kala_decision:0 "Unlocks the [decision|E] to Reinforce Kalas"

 tradition_RICE_akhtarvenik_name:0 "Akhtarveniks"

 tradition_RICE_akhtarvenik_desc:0 "Since ancient times, the peoples of Khwarezm have been renowned throughout the Middle East and Central Asia for their skills in astronomy, calendry, and mathematics. Akhtarvenik is the traditional Khwarezmian term for an astronomer."

 tradition_RICE_khuzi_name:0 "People of Khuz"

 tradition_RICE_khuzi_desc:0 "For generations, the Khuzis have been stigmatized by their neighbors, who even use their name as a term of insult. Many have menial jobs at the courts of powerful nobles and royals, such as bathroom attendants and wet nurses, which grant them a degree of influence behind the scenes."

 culture_parameter_khuzi_mechanic_1:0 "All [cultures|E] descended from $khuzi$, and $khuzi$ itself, whether they have this [tradition|E] or not, automatically get the $innovation_RICE_khuzi$ [innovation|E], which has #N negative effects#! like reduced [domain_limit|E], [diplomacy|E], and [prestige|E]"

 culture_parameter_khuzi_mechanic_2:0 "By taking the [decision|E] to $RICE_khuzestan_khuzi_status_decision$, not only is the $innovation_RICE_khuzi$ [innovation|E] removed from all [cultures|E] that have it, but this [tradition|E] is also upgraded to provide better bonuses as well"

 RICE_khuzi_mechanic_desc:0 "This [innovation|E] is automatically gained by [cultures|E] with the $tradition_RICE_khuzi_name$ [tradition|E], or any [cultures|E] descended from such a [culture|E], unless the [decision|E] to $RICE_khuzestan_khuzi_status_decision$ is taken; doing so will also remove this [innovation|E] from all [cultures|E] that have it"
 # Their previous experiences as lowly menials at the courts of powerful nobles and royals have taught them much about politics, courtly life, art, and human nature.
 tradition_RICE_khuzi_elevated_elymaean_name:0 "People of Khuz"

 tradition_RICE_khuzi_elevated_elymaean_desc:0 "The ancestors of this culture in Khuzestan were once stigmatized by their neighbors, who even used their name as a term of insult. However, with recent political and social changes, these people have reasserted themselves as a people worthy of respect. They are now emulating their immediate predecessors in antiquity, the Elymaeans, who were skilled in archery and stubbornly maintained their independence."

 tradition_RICE_khuzi_elevated_community_name:0 "People of Khuz"

 tradition_RICE_khuzi_elevated_community_desc:0 "The ancestors of this culture in Khuzestan were once stigmatized by their neighbors, who even used their name as a term of insult. However, with recent political and social changes, these people have reasserted themselves as a people worthy of respect. For too long, they were associated with the likes of bathroom attendants, wet nurses, and other menial roles. Now, they will be kings, philosophers, and artists!"

 tradition_RICE_khuzi_elevated_traders_name:0 "People of Khuz"

 tradition_RICE_khuzi_elevated_traders_desc:0 "The ancestors of this culture in Khuzestan were once stigmatized by their neighbors, who even used their name as a term of insult. However, with recent political and social changes, these people have reasserted themselves as a people worthy of respect. Reinvigorated, they seek to make the most out of Khuzestan's historical agricultural prosperity and commercial ties with faraway lands to build a new civilization."

 tradition_RICE_northmen_name:0 "Legacy of the Northmen"

 tradition_RICE_northmen_desc:0 "This culture is descended from a mixture of Norse settlers and older Frankish and Celtic peoples in Normandy. The Franks see them as two-faced schemers who could turn into rapacious barbarians at any moment, while Scandinavians see them as weaklings who have forgotten their ancestral ways."

 tradition_RICE_adventurers_and_aristocrats_name:0 "Adventurers and Aristocrats"

 tradition_RICE_adventurers_and_aristocrats_desc:0 "This culture is descended from a mixture of Norse settlers and older Frankish and Celtic peoples in Normandy. They skillfully blend the best of Frankish and Scandinavian ideas and customs. Fearless seekers of fame and glory in war, they are also renowned for their cosmopolitan society and piety."

 culture_parameter_rice_cheaper_normandy_settlers:0 "The [decisions|E] to Invite Norse and Norman Settlers are cheaper (assuming other prerequisites are met)"

 culture_parameter_rice_norman_mechanic_1:0 "This [tradition|E] will upgrade to the $tradition_RICE_adventurers_and_aristocrats_name$ [tradition|E] if the [decision|E] to $RICE_normandy_commission_historia_normannorum$ is taken"

 culture_parameter_rice_norman_mechanic_2:0 "This [tradition|E] will upgrade to provide better bonuses if the [RICE_normandy_struggle|E] is resolved with either $RICE_normandy_struggle_ending_conquest_decision$ or $RICE_normandy_struggle_ending_assimilation_decision$ endings"

 not_bureaucratic_spiritual_or_courtly_desc:1 "The [culture|E] does not have the $ethos_bureaucratic_name$, $ethos_spiritual_name$ or $ethos_courtly_name$ [ethos|E]"

 culture_parameter_rice_norman_adventurers:1 "[rulers|E] can use the [RICE_norman_adventure|E] [casus_belli|E] in the $culture_era_early_medieval$ and $culture_era_high_medieval$ [eras|E]"

 tradition_RICE_adventurers_and_aristocrats_military_name:0 "$tradition_RICE_adventurers_and_aristocrats_name$"

 tradition_RICE_adventurers_and_aristocrats_military_desc:0 "$tradition_RICE_adventurers_and_aristocrats_desc$"

 tradition_RICE_adventurers_and_aristocrats_culture_name:0 "$tradition_RICE_adventurers_and_aristocrats_name$"

 tradition_RICE_adventurers_and_aristocrats_culture_desc:0 "$tradition_RICE_adventurers_and_aristocrats_desc$"

 culture_parameter_unlock_rice_norman_cavalry:0 "Can recruit [GetMaA('conrois').GetName] as [men_at_arms|E]"

 culture_parameter_unlock_rice_tuareg_decision:0 "Unlocks the [decision|E] to $RICE_tuareg_found_empire_of_air$"

 culture_parameter_unlock_rice_cheaper_dream_divination:0 "The $activity_RICE_tuareg_dream_incubation$ [activity|E] is cheaper"

 tradition_RICE_tuareg_name:0 "Kel Tagelmust"

 tradition_RICE_tuareg_desc:0 "This culture is descended from intrepid Amazigh (or Berber) nomads who settled in the southern Sahara and organize themselves around matrilineal clans, or #italic tawshet#!. They often call themselves #italic Kel Tagelmust#! (among other names), or 'People of the Veil,' alluding to the distinctive blue or indigo-colored turbaned veils their men wear."

 RICE_culture_in_africa_desc:1 "The [culture|E] does not have #V 5%#! of its [counties|E] in [GetGeographicalRegion('world_africa').GetName]"

 tradition_RICE_munya_estates_name:0 "Munya Estates"

 tradition_RICE_munya_estates_desc:0 "In the hills and farmlands of [GetGeographicalRegion('world_europe_west_iberia').GetName], the people of this culture build large estates called the #italic munya#!. Besides their architectural beauty, they also serve as places where people can relax, where scholars and poets can mingle, and where agricultural and botanical experiments happen."

 culture_parameter_unlock_rice_munya_activity:0 "Unlocks [activities|E] to host vacations at a [munya|E], regardless of your [religion|E] or location"

 culture_parameter_unlock_rice_munya_activity_cost:0 "Reduces the costs of [munya|E] vacations"

 culture_parameter_unlock_rice_munya_activity_private_variety:0 "Unlocks the #V $RICE_granada_munya_vacation_private_type_agriculture$#! and #V $RICE_granada_munya_vacation_private_type_botany$#! [activity_options|E] for the [GetActivityType( 'activity_RICE_granada_munya_vacation_private' ).GetName] [activity|E]"

 culture_parameter_unlock_rice_munya_activity_group_variety:0 "Unlocks the #V $RICE_granada_munya_vacation_group_type_gardens$#! and #V $RICE_granada_munya_vacation_group_type_poetry$#! [activity_options|E] for the [GetActivityType( 'activity_RICE_granada_munya_vacation_group' ).GetName] [activity|E]"

 tradition_RICE_cave_dwellers_name:0 "Cave Dwellers"

 tradition_RICE_cave_dwellers_desc:0 "This culture makes extensive use of caves and rock shelters for various purposes. Some in this culture even prefer to live in these locations."

 tradition_RICE_wewas_name:0 "Wewa Systems"

 tradition_RICE_wewas_desc:0 "This culture, which has origins or influence from Sri Lanka, has refined the techniques used to create irrigation tanks throughout the Indian subcontinent. In Sri Lanka, these tanks, known as wewas, are constructed in large numbers and with a high level of engineering and administrative sophistication."

 tradition_RICE_stepwells_name:0 "Stepwell Builders"

 tradition_RICE_stepwells_desc:0 "Stepwells are sturdy wells with a corridor of steps that descend to the water level, that provide dependable water for agriculture but also serve as places of worship, leisure, and bathing. Though they are built by many cultures from the Indian subcontinent, this culture is known for building many such stepwells, including some of the largest ones in the region."

 tradition_RICE_zimbabwe_name:0 "Zimbabwes"

 tradition_RICE_zimbabwe_desc:0 "The settlements of this culture, called Zimbabwes, are built using advanced stone-working techniques that do not require any mortar. A prominent feature of these sites are their tall stone walls."

 tradition_RICE_bantu_migrators_name:0 "Bantu Migrators"

 tradition_RICE_bantu_migrators_desc:0 "This culture is part of the greater umbrella of various Bantu peoples who have, over the course of their history, partook in many migrations across Africa."

 culture_parameter_unlock_rice_maa_bantu_warriors:0 "Can recruit [GetMaA('RICE_bantu_warriors').GetName] as [men_at_arms|E]"

 tradition_RICE_cattle_kraals_name:0 "Cattle Kraals"

 tradition_RICE_cattle_kraals_desc:0 "The people of this culture often live in homestead clusters attached to a #italic kraal#!, a large enclosure for livestock, especially cattle which are greatly revered. The kraal is surrounded by fences made of wood, mud, thorn-bush branches, and other materials."
 #tradition_RICE_nine_tribes_name:0 "Nine Tribes"
 #tradition_RICE_nine_tribes_desc:0 "The settlements of this culture, called Zimbabwes, are built using advanced stone-working techniques that do not require any mortar. A prominent feature of these sites are their tall stone walls."
 culture_parameter_unlock_rice_activity_zapust_festival:0 "Unlocks the [GetActivityType('activity_RICE_polabian_zapust_festival').GetName] [activity|E]"

 tradition_EEE_people_of_boika_name:0 "People of Boika"

 tradition_EEE_people_of_boika_desc:0 "People of this culture have been living in the land of Boika for generations, enduring many hardships to call this place their home."

 tradition_RICE_judicati_name:0 "Judicati"

 tradition_RICE_judicati_desc:0 "Local rulers of this culture are called Judges (or #italic Judicati#!); such judgedoms, and the communities they rule, are legally derived from and influenced by the political and cultural traditions of Byzantium. The judge is not an absolute ruler, for they answer to a council consisting of local officials, nobles, and clergy, and can be dethroned or even executed by their subjects for tyranny."

 culture_parameter_unlock_rice_judicati_upgrade:0 "This [tradition|E] will be upgraded with better bonuses if a powerful [ruler|E] in [GetGeographicalRegion('RICE_sardinia_region').GetName] takes the [decision|E] to $RICE_sardinia_decide_sardinia_orientation$"

 tradition_RICE_judicati_catholic_name:0 "Latin $tradition_RICE_judicati_name$"

 tradition_RICE_judicati_catholic_desc:0 "$tradition_RICE_judicati_desc$ Over time, the #italic Judicati#! have built ties with the Latin West."

 culture_parameter_unlock_rice_judicati_catholic_decision:0 "Unlocks the [decision|E] to $RICE_sardinia_catholic_decision$, which provides the [GetModifier('RICE_sardinia_latin_monks').GetNameWithTooltip] [county_modifier|E], among other bonuses"

 tradition_RICE_judicati_orthodox_name:0 "Byzantine $tradition_RICE_judicati_name$"

 tradition_RICE_judicati_orthodox_desc:0 "$tradition_RICE_judicati_desc$ Over time, the #italic Judicati#! have rebuilt their ties with the Greek East."

 culture_parameter_unlock_rice_judicati_orthodox_decision:0 "Unlocks the [decision|E] to $RICE_sardinia_orthodox_decision$, which provides the [GetModifier('RICE_sardinia_byzantine_administration').GetNameWithTooltip] [county_modifier|E], among other bonuses"

 tradition_RICE_judicati_north_african_name:0 "North African $tradition_RICE_judicati_name$"

 tradition_RICE_judicati_north_african_desc:0 "$tradition_RICE_judicati_desc$ Over time, the #italic Judicati#! have built ties with North Africa."

 culture_parameter_unlock_rice_judicati_north_african_decision:0 "Unlocks the [decision|E] to $RICE_sardinia_north_african_decision$, which provides the [GetModifier('RICE_sardinia_north_african_networks').GetNameWithTooltip] [county_modifier|E], among other bonuses"

 tradition_RICE_judicati_none_name:0 "Independent $tradition_RICE_judicati_name$"

 tradition_RICE_judicati_none_desc:0 "$tradition_RICE_judicati_desc$ Over time, the #italic Judicati#! have often refused to bind themselves too closely to other regions, keeping their independence in spirit and mind, if not in reality."

 culture_parameter_unlock_rice_judicati_none_decision:0 "Unlocks the [decision|E] to $RICE_sardinia_none_decision$, which provides the [GetModifier('RICE_sardinia_none_fortifications').GetNameWithTooltip] [county_modifier|E], among other bonuses"

 culture_parameter_unlock_rice_condaghes_innovation:0 "This tradition allows a [culture|E] to unlock the #V $innovation_RICE_condaghes$#! [innovation|E] in the $culture_era_early_medieval$ [era|E]"

 culture_parameter_unlock_tfe_cheaper_qanats:0 "The costs of taking the [decision|E] to #V $RICE_yazd_build_a_new_qanat$#! are reduced"

 tradition_RICE_between_three_worlds_name:0 "Between Three Worlds"

 tradition_RICE_between_three_worlds_desc:0 "This culture was born in the frontier region of [GetGeographicalRegion('custom_sicily').GetNameNoTooltip] that sits at the crossroads of Islam, Byzantium, and the Latin West. Its people are deeply influenced by all three, and know how to navigate the at times confusing political landscape of the Mediterranean."

 culture_parameter_unlock_rice_sicilian_trait_bonuses:0 "The [GetTrait('RICE_sicilian_ruler').GetName( GetNullCharacter )] [trait|E] provides additional bonuses"

 culture_parameter_unlock_rice_sicilian_recruit_soldiers_bonuses:0 "The [decision|E] to $RICE_sicily_recruit_soldiers_decision$ is more likely to cause a [sicily_stronghold|E] [county_modifier|E] to appear"

 culture_parameter_unlock_rice_sicilian_request_expedition_bonuses:0 "The [interaction|E] to $RICE_request_sicily_intervention_interaction$ is cheaper"

 culture_parameter_unlock_rice_sicilian_bargain_bonuses:0 "The [decision|E] to Bargain with [sicily_strongholds|E] has a higher chance of success"

 tradition_RICE_longbeards_name:0 "Longbeards"

 tradition_RICE_longbeards_desc:0 "The ancestors of this culture got their name, the Longbeards, from their distinctively long beards. These beards were a proud symbol of the tenacity and stubborn independent-mindedness of the Longbeards and their descendants in the face of any threat to their liberty – even if such threats comes from their own kin. "

 culture_parameter_unlock_rice_maa_sicily_bowmen:0 "Can recruit [GetMaA('RICE_sicily_bowmen').GetName] as [men_at_arms|E]"

 culture_parameter_unlock_rice_sicilian_grain_tradition_bonuses:0 "Increased [prestige_i|E] [prestige|E] gain when sending [sicily_grain|E] to other [rulers|E] through [interaction|E]"

 tradition_RICE_mediterranean_masserie_name:0 "Mediterranean Masserie"

 tradition_RICE_mediterranean_masserie_desc:0 "Fertile lands in this culture – originally rooted in Southern Italy – are dotted with #italic masserie#!, a type of farmsteads that are a part of an agricultural system that efficiently manages the production and trade of livestock products, grains, olive oil, and more."

 culture_parameter_unlock_rice_maa_arimanni:0 "Can recruit [GetMaA('RICE_arimanni').GetName] as [men_at_arms|E]"

 tradition_RICE_berber_marignal_tribalism_name:0 "Makhazen and Siba"

 tradition_RICE_berber_marignal_tribalism_desc:0 "The origins of these Berber peoples came from the hinterlands between #italic Makhazen#! - "the pale," that is, the coastal regions of North Africa, governed by the state - and #italic Siba#!, the ungoverned, periphery beyond the pale. They are wary of and will reject centralized rule if it suits their interests."

 tradition_RICE_contentious_colonizers_name:0 "Contentious Colonizers"

 tradition_RICE_contentious_colonizers_desc:0 "This culture was formed from a chaotic but fruitful blend of settlers and pioneers, as well as long-established indigenous groups, of different cultures, faiths, and social classes. Though seen by outsiders as prone to rebellion and lacking in religious discipline, their diversity and self-reliance is also a source of strength."

 tradition_RICE_image_of_china_name:0 "Image of China"

 tradition_RICE_image_of_china_desc:0 "Though the ancestors of this culture were not originally Chinese, their descendants have thoroughly adopted many customs and practices associated with China, particularly in governance. Outsiders have associated them with their ideals of Chinese society, believing rulers of this culture are just, learned, and sophisticated."

 tradition_RICE_zhangzhung_stonework_name:0 "Auspicious Mountain Stonework"

 tradition_RICE_zhangzhung_stonework_desc:1 "This culture builds all-stone structures which are often carved into the mountains and caves of the Himalayan highlands. Many of these buildings have important ritual functions, particularly the #italic sekhang#! or #italic sekhar#! (house or castle of the gods)."

 culture_parameter_unlock_rice_zhangzhung_stone_decision:1 "Unlocks the [decision|E] to #V $RICE_zhangzhung_supplicate_ancient_pillars$#! outside of [GetGeographicalRegion('RICE_upper_tibet').GetName]"

 culture_parameter_improved_rice_zhangzhung_stone_decision:1 "Improved chances of #P good#! results when taking the [decision|E] to #V $RICE_zhangzhung_supplicate_ancient_pillars$#!"

 culture_parameter_unlock_rice_restore_zhangzhung_decision:1 "Unlocks the [decision|E] to #V Rebuild the Silver Castle#! for [independent|E] [kings|E] and [emperors|E]"

 tradition_RICE_changthang_nomads_name:0 "Changthang Nomads"

 tradition_RICE_changthang_nomads_desc:1 "The ubiquitous nomads of the Himalayas are called #italic drokpas#!. The #italic drokpas#! who form part of this culture, and who originated in the harsh badlands of Changthang in Upper Tibet and Ladakh, are respected for their hardiness and piety, and feared for their ruthless courage. They traverse through rugged terrain to hunt, go on pilgrimage, and engage in long-distance trade like few others can."

 culture_parameter_unlock_rice_maa_drokpa_horsemen:1 "Can recruit [GetMaA('RICE_drokpa_horsemen').GetName] as [men_at_arms|E]"

 culture_parameter_unlock_rice_better_salt_trade_decision:1 "Higher odds of a successful result, and of getting more [gold_i|E] [gold|E], from the [decision|E] to #V $RICE_zhangzhung_western_tibet_salt_decision$#!"

 culture_parameter_unlock_rice_piety_when_traveling_for_activity:1 "Gain a random amount of [piety|E] between [piety_i|E] #V 1#! and [piety_i|E] #V [EmptyScope.ScriptValue('medium_piety_gain')|0]#! every time you begin [traveling|E] for an [activity|E]"

 tradition_RICE_gandharan_art_name:0 "Gandharan Art"

 tradition_RICE_gandharan_art_desc:1 "This culture's artistic style is descended from a syncretism of Hellenic and Indic art dating back to ancient times. This art style, which is strongly tied to this culture's religious heritage, has been a major influence in faraway lands."

 tradition_brus_river_lifeblood_name:0 "Land of Towns"

 tradition_brus_river_lifeblood_desc:0 "The Varangians called our lands #italic Garðaríki, #! "the land of towns," for the many settlements that we built along the trade routes — flanked by the great rivers that shaped our people with their ferrying of wealth and war."

 culture_parameter_rice_portage_decision_bonus:0 "The [decision|E] to #bold $RICE_develop_portage_routes$#! costs less [gold_i|E] [gold|E] and can be done every #V 5#! years instead of 10"

 culture_parameter_rice_volga_dnieper_merchant_spawn_bonus:0 "Increases the chances [volga_dnieper_merchants|E] spawn in your [court|E], especially after taking the [decision|E] to $RICE_develop_portage_routes$ if your [realm_capital|E] is located in the [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]"

 culture_parameter_unlock_rice_maa_iron_forest:0 "Can recruit [GetMaA('RICE_iron_forest').GetName] as [men_at_arms|E]"

 tradition_RICE_scribes_of_the_steppe_name:0 "Scribes of the Steppe"

 tradition_RICE_scribes_of_the_steppe_desc:0 "#F Though these peoples were originally steppe nomads, their ancestors learned and mastered the art of writing after coming into contact with the civilizations of the Silk Road. They are renowned for their knowledge and literacy.#!"

 tradition_RICE_royal_physicians_name:0 "Royal Physicians"

 tradition_RICE_royal_physicians_desc:0 "#F This culture has produced many learned doctors, as well as scribes and holy men, who are popularly employed in foreign courts.#!"

 culture_parameter_unlock_rice_better_local_pilgrimage_memorialization_prestige:0 "The #V Memorialization#! [activity_option|E] for [local_pilgrimages|E] provides #P double#! [prestige_i|E] [prestige|E]"

 tradition_RICE_heirs_of_kush_name:0 "Heirs of Kush"

 tradition_RICE_heirs_of_kush_desc:0 "#F These people are, whether by blood or in spirit, the cultural successors of the ancient kingdom of Kush. They carry on its legacy by continuing its customs and practices in various ways, even if in modified form.#!"

 tradition_RICE_nuba_sports_competitions_name:0 "Passionate Athletes"

 tradition_RICE_nuba_sports_competitions_desc:0 "#F The people of this culture have high standards for fitness and beauty. They frequently host ritualized sports competitions, and enjoy most of all the spectacle of wrestling and stick fighting, which they excel in and have been famed for as far back as the days of the Pharaohs.#!"

 tradition_RICE_spear_masters_name:0 "Spear Masters"

 tradition_RICE_spear_masters_competitions_desc:0 "#F Though the people of this culture prefer to live as independent, decentralized clans, they are dominated by a class of people called the #italic Spear Masters#!, or #italic Masters of the Fishing Spear#!, who provide religious leadership, manage the sacrifice of oxen, mediate disputes, and guide them in ritual warfare.#!"

 culture_parameter_unlock_rice_sabir_activity:0 "Unlocks the [GetActivityType('activity_RICE_nubia_sibir_festival').GetName] [activity|E]"

 culture_parameter_unlock_rice_nilotic_sacrifice_activity:0 "Unlocks the #V Bovine Sacrifice#! [activity|E] regardless of [faith|E]"

 culture_parameter_unlock_rice_cattle_raid_intent:0 "Unlocks the #V $RICE_cattle_raid_intent$#! [raid_intent|E]"

 tradition_RICE_cattle_economy_name:0 "Cattle Economy"

 tradition_RICE_cattle_economy_desc:0 "#F The people of this culture will do much to protect their own cattle that they place great value on as a symbol of prestige and status. They will even take the cattle of their enemies in raids and ritualized warfare.#!"

 tradition_RICE_darfur_mountain_palaces_name:0 "Palaces in the Mountains"

 tradition_RICE_darfur_mountain_palaces_desc:0 "#F Though often vilified as brutal, egomaniacal, horse-riding tyrants by their enemies, the rulers of Darfur, no matter their origin, have learned to master the art of constructing mighty palaces, defensive works, agricultural terraces, and thriving cities in this mountainous region over the centuries.#!"

 culture_parameter_unlock_rice_decision_nubian_agriculture:0 "Unlocks the [decision|E] to #V $RICE_nubia_agriculture_decision$#!"

 culture_parameter_unlock_rice_nile_pastoralist_farmer_bonus_prestige:0 "The [decisions|E] to interact with local #V Agrarian#! and #V Pastoralist#! communities along the [RICE_nile_river|E] give bonus [prestige_i|E] [prestige|E] depending on your [rank|E]"

 culture_parameter_unlock_rice_nilotic_raiders:0 "Can recruit [GetMaA('RICE_nilotic_raiders').GetName] as [men_at_arms|E]."

 culture_parameter_unlock_rice_sudanese_highlanders:0 "Can recruit [GetMaA('RICE_sudanese_highlanders').GetName] as [men_at_arms|E]."

 culture_parameter_unlock_rice_tebeldi_trees_piety:0 "The [decision|E] to #bold $RICE_nubia_tebeldi_trees_decision$#! in the [GetGeographicalRegion('RICE_greater_darfur').GetName] [region|E] provides additional [prestige_i|E] [prestige|E]"

 culture_parameter_unlock_rice_lake_oracles_activity:0 "Unlocks the [decision|E] to #V $RICE_nubia_lake_oracle_decision$#! regardless of [faith|E]"

 culture_parameter_unlock_rice_alodian_cavalry:0 "Can recruit [GetMaA('RICE_alodian_cavalry').GetName] as [men_at_arms|E]."

 tradition_RICE_nilotic_migrators_name:0 "Nilotic Settlers"

 tradition_RICE_nilotic_migrators_desc:0 "#F The people of this culture, whose ancestors originate from the southern Nile river valley, have been involved in grand migrations across the savannahs and highlands of East Africa for centuries.#!"

 culture_parameter_unlock_rice_cattle_economy_interactions:0 "Unlocks the [interactions|E] to #bold Demand#! or #bold Offer Cattle Compensation#!"

 tradition_RICE_rainforest_ritualists_name:0 "Rainforest Ritualists"

 tradition_RICE_rainforest_ritualists_desc:0 "#F These people of jungle origin believe that to avoid spiritual danger and to not undermine [Glossary( 'slamad', 'SLAMAD_GLOSS' )], one must observe certain rituals and taboos, particularly the taboo in frustrating the desires of other people and spirits. To outsiders, however, these people seem to possess supernatural skill in surviving the jungle and extracting bountiful resources from it.#!"

 culture_parameter_unlock_rice_aslian_blood_decision:0 "Unlocks the [decision|E] to #bold $RICE_aslian_blood_sacrifice_decision$#! regardless of [faith|E]"

 culture_parameter_unlock_rice_southeast_asian_gather_tropical_goods_decision:0 "Unlocks the [decision|E] to #bold $RICE_SEA_harvest_rare_tropical_goods_decision$#!"

 culture_parameter_unlock_rice_southeast_asian_gather_tropical_goods_interaction:0 "$culture_parameter_unlock_rice_southeast_asian_gather_tropical_goods_decision$"

 culture_parameter_unlock_rice_southeast_asian_trade_tropical_goods_interaction:0 "Unlocks the [interaction|E] to #bold Exchange Rare Tropical Goods#! with other [rulers|E]"

 tradition_RICE_tropical_purveyors_name:0 "Tropical Purveyors"

 tradition_RICE_tropical_purveyors_desc:0 "#F Over generations, these people have honed their knowledge of the tropical rainforests of Southeast Asia. They are especially good at finding and harvesting rare tropical goods like spices and medicinal plants and play a major role in the export of these commodities across the maritime trade routes of the Indian Ocean.#!"

 tradition_RICE_fear_of_spirits_name:0 "Fear of Spirits"

 tradition_RICE_fear_of_spirits_desc:0 "#F Regardless of their religious affiliation, people of this culture view the spirits of the world, even benevolent ones, with great distrust and caution. Besides religious rituals to fend off spirits, this culture also frequently engages in practical measures like quickly built defenses, or a tendency to avoid travel during night or in treacherous areas, to protect themselves from dangerous spirits.#!"

 tradition_RICE_sea_nomads_name:0 "Sea Nomads"

 tradition_RICE_sea_nomads_desc:0 "#F There are those who claim to live a maritime life, sailing ships here and there, but they merely adopted the sea. The people of this culture are literally born in the waters, and molded by it: all their lives, they either wander the oceans in their ships or live in floating villages.#!"

 culture_parameter_unlock_rice_sea_nomads_travel_option:0 "Unlocks the $RICE_sea_nomads_option$ [travel_option|E] regardless of location"

 culture_parameter_unlock_rice_sea_nomads_travel_option_free:0 "The $RICE_sea_nomads_option$ [travel_option|E] is always free"

 culture_parameter_unlock_rice_sea_nomads_decision:0 "Unlocks the [decision|E] to #bold $RICE_SEA_manage_sea_lanes$#!"

 tradition_RICE_brehon_law_name:0 "Brehon Laws"

 tradition_RICE_brehon_law_desc:0 "#F The ancient laws of Ireland originated from oral tradition which were later written down, and are administered by #italic Brehons#!, who preserve and interpret the law as arbitrators. They serve the various clans that form the basis of this culture's society.#!"

 RICE_bog_butter_decisions_unlock:1 "Unlocks the [decision|E] to #bold $RICE_mayo_bury_bog_butter$#!"

 RICE_butter_interaction_unlock:1 "Unlocks the [decision|E] to #bold $RICE_mayo_retrieve_bog_butter$#!"
 #RICE_butter_interaction_unlock:1 "Unlocks the [interaction|E] to #bold $RICE_mayo_butter_interaction$#! regardless of your [culture_possessive|E] [traditions|E]"
 RICE_butter_decision_bonus:1 "The [decision|E] to #bold $RICE_mayo_retrieve_bog_butter$#! provides bonus [prestige_i|E] [prestige|E]"

 culture_parameter_unlock_rice_butter_interaction:0 "Unlocks the [interaction|E] to #bold $RICE_mayo_butter_interaction$#!"

 culture_parameter_unlock_rice_gaelicization_mechanic:0 "[rulers|E] whose [capital|E] or [domicile|E] are in [counties|E] of this [culture|E] can take the [decision|E] to #bold $RICE_embrace_gaelicization$#!"

 culture_parameter_unlock_rice_bog_butter_bonus_prestige:0 "$RICE_butter_decision_bonus$"

 tradition_RICE_sorcerous_corsairs_name:0 "Sorcerous Corsairs"

 tradition_RICE_sorcerous_corsairs_desc:0 "#F Foreigners view the people and lands of this culture with fear, speaking in hushed whispers about how they are powerful magicians and ruthless pirates who will do anything to protect the islands and coasts they call home.#!"

 culture_parameter_unlock_rice_insular_sorcery_decision:0 "Unlocks unique [RICE_socotra_sorcery|E] mechanics like the [decision|E] to #V $RICE_socotra_cast_insular_sorcery$#! and the [GetTrait('RICE_socotra_sorcerer').GetName( GetNullCharacter )] [trait|E]"

 culture_parameter_unlock_rice_moon_sacrifice_decision:0 "Unlocks the [decision|E] to #V $RICE_socotra_moon_sacrifice$#!"

 culture_parameter_unlock_rice_enables_pirate_options_by_default:0 "All options for the [decision|E] to #V $RICE_pirate_indian_ocean_decision$#! do not require you to Establish Relations first"

 tradition_RICE_honorable_marauders_name:0 "Honorable Marauders"

 tradition_RICE_honorable_marauders_desc:0 "#F Since ancient times, the neighbors of this culture have feared their swift and brutal raids. Yet despite this, this culture adheres to a strict code of behavior, [Glossary( 'salif', 'SALIF_GLOSS' )], which emphasizes hospitality, dialogue, and self-control, even when waging war.#!"

 culture_parameter_unlock_rice_sycamore_tree_decision:0 "Unlocks the [decision|E] to #V $RICE_south_ethiopia_pray_to_a_sycamore_tree$#!"

 tradition_RICE_toloka_name:0 "Toloka"

 tradition_RICE_toloka_desc:0 "#F This culture has a tradition of reciprocal, communal labor where people in a village will help each other with various important endeavors, such as building houses or harvesting crops. After the labor is done, the main beneficiary of the help thanks everyone with a feast.#!"

 tradition_SEA_ade_name:0 "Ade"

 tradition_SEA_ade_desc:0 "This culture has a collection of unwritten laws called [Glossary( 'Ade', 'ADE_GLOSS' )], which dictates every aspect of life. Those who follow it well enjoy great respect, and are celebrated and adored; those who repeatedly violate it are to be ostracized by all, as if they do not even exist."

 tradition_RICE_enthusiastic_debaters_name:0 "Enthusiastic Debaters"

 tradition_RICE_enthusiastic_debaters_desc:0 "The people of this culture enjoy debating about the truth of things. Even when it comes to inconsequential trivia, they will go out of their way to find evidence that backs up their arguments."

 tradition_RICE_marine_armor_name:0 "Marine Armor"

 tradition_RICE_marine_armor_desc:0 "Contrary to the assumption some hold that coast-dwellers prefer to fight lightly armored, this culture has mastered the art of crafting versatile armor that is suited for combat in maritime environments while still providing adequate protection."

 tradition_RICE_bronze_drum_conoisseurs_name:0 "Bronze Drum Connoisseurs"

 tradition_RICE_bronze_drum_conoisseurs_desc:0 "Bronze drums are found throughout Southeast Asia, whether in the form of a living tradition, or as ancient relics discovered in the ground. This culture places great ritual importance on these drums, which are seen as a major source of political and spiritual power."

