 # Pitch & Tar
 trade_good_pitch: "Pitch & Tar"
 trade_good_pitch_desc: "Pitch, tar, resin and potash were the naval stores without which no ship could be caulked, no rope preserved and no hull kept sound. They were burned out of pinewood in slow, smothered kilns deep in the forests.\n\nThe pinewoods of the Baltic, Scandinavia and Rus, the Landes, the Sila and the pinares of Castile all sent their tar to the shipyards of the coasts."
