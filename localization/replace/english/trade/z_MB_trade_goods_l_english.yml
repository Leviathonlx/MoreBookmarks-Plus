 # Camels
 trade_good_camels: "Camels"
 trade_good_camels_desc: "Across the dry belt of the world the camel carried what the horse and ox could not. Dromedaries bore the caravans of Arabia, Egypt and the Sahara, and the two-humped Bactrian crossed the cold deserts and mountain passes of Central Asia.\n\nNomad herders bred them by the thousand, and a caravan city lived or died by the camel markets at its gates."
