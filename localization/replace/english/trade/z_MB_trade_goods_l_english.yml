 # Marble & Fine Stone
 trade_good_marble: "Marble & Fine Stone"
 trade_good_marble_desc: "Marble, alabaster and the other fine stones were cut for columns, altars, tombs, fonts and pavements. The quarries of Luni and Proconnesus fed the churches of Italy and Constantinople, Purbeck and Tournai stone was shipped across England and the Low Countries, and Macael marble went into the palaces of al-Andalus.\n\nIn India the white marble of Makrana was carved for temples, and the veined stone of Dali in Yunnan gave the Chinese their word for marble."
