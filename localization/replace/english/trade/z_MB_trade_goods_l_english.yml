 # Sulfur & Saltpetre
 trade_good_sulfur: "Sulfur & Saltpetre"
 trade_good_sulfur_desc: "Sulfur was gathered from the vents and crusts of volcanic ground: the Solfatara near Naples, the Aeolian islands, Damavand, Iceland and the mountains of Java and Japan. Physicians burned it against disease, fullers bleached wool with its fumes, and alchemists sought its secrets.\n\nIn the East, sulfur joined saltpetre and charcoal in the fire-drug of Song China, and Japanese sulfur was shipped across the sea by the shipload."
