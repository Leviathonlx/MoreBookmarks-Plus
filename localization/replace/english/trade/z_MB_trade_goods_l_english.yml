 # Vanilla trade goods, rewritten
 trade_good_spices_desc: "Pepper from Malabar, cinnamon from Lanka, ginger from India and China, and cloves and nutmeg from the far Moluccas: spices crossed half the world before they reached a table in Cairo or Venice. They were bought to flavor food, as medicines, and above all as a show of wealth, and in England a pound of pepper could cost a laborer more than a week's wages.\n\nThe Karimi merchants of Egypt and the galleys of Venice and Genoa grew rich carrying them between the Red Sea and the Mediterranean."
 trade_good_beer_desc: "Brewed from barley, oats, or wheat, ale was the everyday drink of the north, made in almost every household and sold by alewives in every village. For the poor it was a large part of their daily food.\n\nHopped beer, which kept far longer, spread from the monasteries to the towns of northern Germany, and by the fourteenth century Hamburg was shipping it by the shipload to Holland and Flanders. In the East, wines brewed from rice and millet filled the same place."
 trade_good_tea_desc: "Prepared from the dried and processed leaves of the tea plant, tea became the everyday drink of China under the Tang, when Lu Yu wrote his Classic of Tea. Pressed into bricks and cakes, it traveled far beyond China's borders.\n\nTibetans and the peoples of the steppe took to it eagerly, and the Song state set up tea and horse markets on its frontier, trading tea for the warhorses its armies needed. Monks carried the habit to Korea and Japan, where Eisai brought back seeds in 1191."
 trade_good_horses_desc: "Horses carried knights, nomads, and messengers, drew carts and wagons, and from the twelfth century began to pull the plough in parts of northern Europe, though most fields were still turned by oxen.\n\nThe finest were the Arabian and Persian horses, the hardy horses of the steppe, and the jennets of al-Andalus. The kingdoms of India, where good horses would not breed, imported them by the thousand every year through the ports of the Gulf and Malabar."
 trade_good_fruit_desc: "Fresh fruit spoiled quickly, so the long-distance fruit trade was in dried figs, raisins, dates, almonds, and prunes. Dates from the oases of Iraq and North Africa fed whole caravans, and ships carried raisins and figs from al-Andalus and the Levant to the markets of the north.\n\nNearer home, every manor and monastery kept orchards of apples, pears, cherries, and quinces."
 trade_good_silk_desc: "The finest of all textile fibers, silk is spun from the cocoons of silkworms and woven into cloth of extraordinary softness and luster. China guarded the secret for centuries, but by this age silk was also woven in Byzantium, whose imperial workshops made purple cloth fit only for emperors, and in Persia and Sogdiana.\n\nFrom there the craft spread to al-Andalus and Sicily, and by the thirteenth century the looms of Lucca were famous across Europe."
 trade_good_books_paper_desc: "Books preserve law, scripture, and learning, and paper made them cheaper. Papermaking reached Samarkand and Baghdad in the eighth century and spread west to Damascus, Cairo, and Xàtiva in al-Andalus, while Christian Europe still wrote mostly on parchment.\n\nIn the East, books were printed from carved wooden blocks: Song China printed the classics and the Buddhist canon in vast editions, and Goryeo carved the whole Tripitaka Koreana on more than eighty thousand blocks."
 trade_good_ivory_desc: "Ivory came from the tusks of the elephants of East Africa and India, shipped through Kilwa, Aden, and Cairo, and from the walrus of the far north, hunted by the Norse off Greenland and in the White Sea. Narwhal tusks were sold as the horns of unicorns.\n\nCarvers worked it into chess pieces, combs, crucifixes, caskets, and reliquary panels of great delicacy."
 trade_good_alum_desc: "Alum is the mordant that fixes dyes in cloth and makes their colors fast and bright, and few dyers could work without it. It was also used to tan fine leather and to stop bleeding.\n\nThe best alum came from the mines of Phocaea and western Anatolia, whose trade the Genoese controlled for much of the thirteenth and fourteenth centuries. Egypt, Castile, and the lands around the Black Sea supplied the rest."
 trade_good_flax_desc: "Grown both for its linen fibers and the linseed oil that can be extracted from its seeds, flax is one of the oldest crops grown by man. While the harvesting can be labor intensive, flax is not as particular as other fiber crops and can be grown almost anywhere.\n\nThe linen of Egypt was famed across the Islamic world, and Flanders and Champagne wove fine linen for all of Europe."
 trade_good_wood_desc: "Timber is the everyday material of houses, barns, ships, carts, and fuel, and most regions cut their own. The great forests of the Baltic and Scandinavia shipped boards, beams, and masts to the treeless coasts.\n\nWhere the forests were cleared, timber grew scarce and dear, and Egypt and the lands of the Gulf had to import nearly all of theirs."
 trade_good_hemp_desc: "A versatile plant grown for its strong fibers, which are twisted into rope and cordage and woven into sailcloth and sacking. Every ship needed miles of rope, and hemp is essential to any maritime economy.\n\nIn China and Korea, hemp was also the common cloth of ordinary people long before cotton."
 trade_good_wine_desc: "Wine is the drink of the church, the nobility, and the towns of the south. After 1152 the wines of Gascony flowed from Bordeaux to England, the monks of Cîteaux tended the slopes of Burgundy, and Rhenish wine went down the Rhine to the Low Countries.\n\nFurther east, the wines of Shiraz were praised by Persian poets, and Christian monasteries kept vineyards from Armenia to Egypt."
 trade_good_furs_desc: "Pelts of sable, ermine, marten, fox, beaver, and above all squirrel, whose gray and white vair lined the robes of half the nobility of Europe. Hundreds of thousands of squirrel skins a year came out of the northern forests.\n\nThe Volga Bulgars and the merchants of Novgorod grew rich on the fur trade, and the sable from beyond the Urals was the most prized of all."
 trade_good_millet_desc: "A resilient cereal that thrives in poor soils and dry climates where other grains fail. Foxtail and broomcorn millet were the old staples of northern China, and pearl millet and sorghum fed the Sahel and the Deccan.\n\nMillet keeps well in store, and across Africa it was brewed into beer as well as boiled into porridge."
 trade_good_rice_desc: "The dominant cereal of South and East Asia, rice yields abundantly in flooded paddies and feeds vast populations. Under the Song, quick-ripening Champa rice from Vietnam let farmers in the south of China grow two crops a year.\n\nUpland rice was grown on dry hillsides as well, and in West Africa a rice of its own was farmed along the Niger."
 trade_good_jade_desc: "A hard beautiful stone of great cultural significance in East Asia, jade is worked into tools, ornaments, and ritual objects. It commands enormous prices in Chinese courts and is a symbol of virtue and rank.\n\nMost of China's jade, the nephrite prized above gold, was gathered from the river beds of Khotan and carried east along the Silk Road."
 trade_good_gold_desc: "The most precious of metals, gold is the basis of royal treasuries and the highest-value coinage. Its rarity and luster make it the favored material for crowns, relics, and display objects.\n\nMuch of the gold of the Islamic world, and later of Europe, came from the fields of Bambuk and Bure in West Africa, carried across the Sahara to Sijilmasa. Mansa Musa spent so much of it in Cairo on his way to Mecca in 1324 that its price fell for years."
 trade_good_gems_desc: "Precious stones including rubies, sapphires, and emeralds are among the most valuable goods along any trade route. Cut and polished, they adorn crowns, reliquaries, and the jewels of the powerful.\n\nRubies and lapis came from the mines of Badakhshan, sapphires and rubies from Lanka, emeralds from the deserts of Egypt, and turquoise from Nishapur."
 trade_good_incense_desc: "Aromatic resins such as frankincense and myrrh, burned in religious ceremonies across every faith. Frankincense came from Dhofar, Hadramawt, and the Somali coast, and myrrh from Arabia and Ethiopia.\n\nRicher still were musk from the deer of Tibet, aloeswood from the forests of Champa and Cambodia, camphor from Sumatra and Borneo, and ambergris washed up on the shores of the Indian Ocean."

