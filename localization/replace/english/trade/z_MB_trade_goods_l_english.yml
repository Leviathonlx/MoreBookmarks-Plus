 # Betel & Kola
 trade_good_betel: "Betel & Kola"
 trade_good_betel_desc: "Across the tropics people chewed nuts to stay awake, to ease hunger and to welcome a guest. In India and the lands of the southern seas the areca nut was wrapped in betel leaf with lime, and offering it was the first courtesy of every house.\n\nIn West Africa the kola nut of the forest was carried north across the Sahel, and in Yemen and Ethiopia the leaves of qat were chewed in the same way."
