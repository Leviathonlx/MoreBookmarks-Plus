 pitch_district: "Tar Burning District"
 pitch_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_pitch').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 pitch_district_desc_flavor: "Smoke rises from the tar kilns of this district, where pine roots and stumps are slowly burned for their pitch and resin."
