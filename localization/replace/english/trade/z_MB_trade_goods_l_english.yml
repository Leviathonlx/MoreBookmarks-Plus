 falcons_district_desc_flavor: "Trappers from this district climb to the cliffs and eyries for young hawks and falcons, which are manned and trained in the mews before sale."
 falcons_district_district_build_gold_cost: "[GetDistrictType('falcons_district').GetName] Construction Cost"

 # Stone (now without marble)
 trade_good_stone_desc: "Quarried from deposits of limestone, sandstone, and granite, building stone is essential for serious construction. Heavy and costly to transport, it is often scarce away from natural outcrops."

 # Luni marble
 luni_marble_modifier: "Carrara Marble"
 luni_marble_modifier_desc: "The marble of Luni has been renowned for its high quality since the time of the late Roman Empire."

 # Paradox modifiers redefined
 pearl_fishing_banks_modifier: "Pearl & Coral Banks"
 pearl_fishing_banks_modifier_desc: "This area is known for its pearl banks or coral reefs, and local divers have for generations competed in diving down to bring them up.\n\nA [GetDistrictType('fish_district').GetName] or [GetDistrictType('pearls_district').GetName] in this [county|E] can construct [GetBuildingType('pearl_fishery_1').GetName] buildings\n\n"
 cedars_of_lebanon_modifier: "Cedars of Lebanon"
 cedars_of_lebanon_modifier_desc: "Since the time of the Phoenicians, the cedars of these mountains have been cut for temples, palaces and ships, prized for their fragrant and durable wood."
 pearl_fishery: "Pearl & Coral Fishery"
 building_type_pearl_fishery_1_desc: "The divers here can hold their breath longer than anyone alive, and they need to. Neither the oysters nor the coral reefs give up their treasure easily."

