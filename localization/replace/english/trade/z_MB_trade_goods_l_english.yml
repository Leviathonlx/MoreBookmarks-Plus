 # Coal
 trade_good_coal: "Coal"
 trade_good_coal_desc: "Where the forests had been cut, men burned the black stone instead. Song China ran its iron furnaces and the hearths of Kaifeng on coal from Shanxi and Hebei, and miners at Liège were digging it by the twelfth century.\n\nFrom Newcastle, sea-coal was shipped down the coast to London and over to Flanders for smiths, limeburners and brewers."
