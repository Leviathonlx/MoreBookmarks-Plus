 # Pearls & Coral
 trade_good_pearls: "Pearls & Coral"
 trade_good_pearls_desc: "The treasures of the sea: pearls brought up by divers from the banks of the Persian Gulf, the Red Sea and the Gulf of Mannar, red coral cut from the reefs of the Mediterranean, the shell of the sea turtle, shining mother-of-pearl, and the cowrie shells of the Maldives that served as money from Bengal and Yunnan to Mali.\n\nAll were worked into jewels, beads, inlay and amulets, and were sought by princes from Cairo to Hangzhou."
