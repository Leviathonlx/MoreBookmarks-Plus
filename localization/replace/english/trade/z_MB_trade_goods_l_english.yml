 building_type_wild_hive_keepers_1_desc: "Villagers here climb to hollows cut high in living trees, where wild swarms nest, and take the comb each autumn for its honey and its wax."
 wild_hive_keepers_1: "$wild_hive_keepers$"
 wild_hive_keepers_2: "$wild_hive_keepers$ II"
 wild_hive_keepers_3: "$wild_hive_keepers$ III"
 honey_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_honey').GetNameWithIcon] & [GetTradeGoodType('trade_good_beeswax').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Possible production: [GetTradeGoodType('trade_good_beer').GetNameWithIcon] & [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 building_type_honey_waxworks_1_desc: "The beeswax works melt down old combs, strain out the wax, and pour it into candles, seals, and writing tablets. What the town does not burn is cast into cakes and sold on to the chandlers."
 gdp_tgf_good_beeswax: "golden cakes of beeswax that still smell faintly of honey"
 nick_tgf_beeswax: "the Chandler"
 nick_tgf_beeswax_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] named by the markets for a lifetime in the wax trade."
