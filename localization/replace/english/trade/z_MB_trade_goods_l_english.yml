 betel_district_desc_flavor: "Groves of tall areca palms and kola trees shade this district, and their nuts are gathered, dried and carried to market by the basket."
 betel_district_district_build_gold_cost: "[GetDistrictType('betel_district').GetName] Construction Cost"
 marble_district: "Marble Quarrying District"
 marble_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_marble').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 marble_district_desc_flavor: "The hillsides of this district are cut back in great steps, and blocks of fine stone are sledged down to the road or the shore."
 marble_district_district_build_gold_cost: "[GetDistrictType('marble_district').GetName] Construction Cost"
 fine_woods_district: "Hardwood Logging District"
 fine_woods_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fine_woods').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 fine_woods_district_desc_flavor: "Old trees of rare timber stand in this district, and the great logs are hauled by oxen or elephants to the rivers to be floated down."
 fine_woods_district_district_build_gold_cost: "[GetDistrictType('fine_woods_district').GetName] Construction Cost"
 falcons_district: "Falconry District"
