 # Fine Woods
 trade_good_fine_woods: "Fine Woods"
 trade_good_fine_woods_desc: "Some timber was worth far more than its weight in firewood. Teak from Malabar and Burma built the ships of the Indian Ocean, black ebony from Lanka and Africa was inlaid into caskets and furniture, and the cedars of Lebanon and the Atlas roofed palaces and mosques.\n\nBoxwood from the Caucasus coast was prized by carvers and turners for its hard, close grain."
