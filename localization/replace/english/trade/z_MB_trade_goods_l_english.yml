 # Districts
 camels_district: "Camel Breeding District"
 camels_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_camels').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 camels_district_desc_flavor: "Herds of camels graze the scrub and wells of this district, bred for the caravans and sold at the great camel fairs."
