 # Hunting Falcons
 trade_good_falcons: "Hunting Falcons"
 trade_good_falcons_desc: "Falconry was the sport of kings from Ireland to Japan, and a fine bird was a gift fit for a sultan or an emperor. The white gyrfalcons of Iceland, Norway and Greenland, the sakers of the steppe and the haidongqing of the Jurchen forests were the most prized of all.\n\nTrappers took young birds from the eyries, and falconers spent months manning them before they could be sold."
