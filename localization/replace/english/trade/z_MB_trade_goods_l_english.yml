l_english:

 # Tin
 trade_good_tin: "Tin"
 trade_good_tin_desc: "Tin is the lesser half of bronze and the greater part of pewter, worked into bells, plates, cups and church vessels. Few places yield it, so it travels far: from the stannaries of Cornwall and Devon and the Erzgebirge to the markets of Europe, and from Yunnan and the Malay peninsula across the eastern seas.\n\nMost tin was won by streaming, washing the heavy black ore from river gravels, before miners followed the lodes underground."
 trade_good_tin_name: "tin"
 trade_good_tin_production_add: "@resource_tin! [GetTradeGoodType('trade_good_tin').GetName] [production|E]"
 trade_good_tin_production_mult: "@resource_tin! [GetTradeGoodType('trade_good_tin').GetName] [production|E]"
 trade_good_tin_production_flat: "@resource_tin! Resells [GetTradeGoodType('trade_good_tin').GetName]"
 trade_good_tin_buy_price_add: "@resource_tin! [GetTradeGoodType('trade_good_tin').GetName] [buy_price|E]"
 trade_good_tin_sell_price_add: "@resource_tin! [GetTradeGoodType('trade_good_tin').GetName] [sell_price|E]"
 trade_good_tin_buy_price_mult: "$trade_good_tin_buy_price_add$"
 trade_good_tin_sell_price_mult: "$trade_good_tin_sell_price_add$"
 trade_good_tin_buy_price_add_modifier: "[GetTradeGoodType('trade_good_tin').GetName] $buy_price$"
 trade_good_tin_buy_price_mult_modifier: "$trade_good_tin_buy_price_add_modifier$"
 trade_good_tin_sell_price_add_modifier: "[GetTradeGoodType('trade_good_tin').GetName] $sell_price$"
 trade_good_tin_sell_price_mult_modifier: "$trade_good_tin_sell_price_add_modifier$"

 # Lead & Quicksilver
 trade_good_lead: "Lead & Quicksilver"
 trade_good_lead_desc: "Lead was the heavy grey metal of roofs, gutters, pipes and window cames, and the glaze of potters. It was seldom mined for itself alone: lead and silver came from the same ores, from the Mendips and the Peak to the Harz, Sardinia and the mines of Serbia.\n\nQuicksilver, distilled from cinnabar at places such as Almadén, was prized by gilders, physicians and alchemists alike."
