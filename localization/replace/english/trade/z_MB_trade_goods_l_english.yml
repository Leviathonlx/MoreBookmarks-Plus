 # Beeswax
 trade_good_beeswax: "Beeswax"
 trade_good_beeswax_desc: "Wax was the light of the medieval church. Altar and votive candles were made of beeswax, which burned brighter and cleaner than smoky tallow, and great churches burned it by the hundredweight on feast days. It also sealed charters and letters, and clerks, students and merchants wrote their drafts and accounts on wax tablets. The great source was the forest of the Rus and Poland, where beekeepers hollowed hives into living trees; Novgorod shipped wax west through the Hansa by the shipload, and Bougie on the Barbary coast sold so much to Europe that the French named their candles after the town."
