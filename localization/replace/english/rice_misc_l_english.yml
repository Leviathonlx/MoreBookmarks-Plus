 ### Warning Events
 RICEintro.0030.t:0 "@warning_icon! Improper Load Order Detected"

 RICEintro.0030.desc:0 "Rajas of Asia and RICE have been detected as running in your current modlist but with improper load order.\n\nThis message only appears at the start of the game, so it will not detect any future similar issue. Please also note that the detection system isn't perfect and may be showing a false alarm.\n\n#bold #warning @warning_icon! Make sure Rajas of Asia is loaded #underline after#! RICE in your load order. You will also need to start a new game.#!#!"

 RICEintro.0030.a:0 "Ok"

 RICEintro.0031.t:0 "@warning_icon! Improper Load Order Detected"

 RICEintro.0031.desc:0 "The Fallen Eagle and RICE have been detected as running in your current modlist but with improper load order.\n\nThis message only appears at the start of the game, so it will not detect any future similar issue. Please also note that the detection system isn't perfect and may be showing a false alarm.\n\n#bold #warning @warning_icon! Make sure the Fallen Eagle is loaded #underline after#! RICE in your load order. You will also need to start a new game.#!#!"

 RICEintro.0031.a:0 "Ok"

 RICEintro.0032.t:0 "@alert_icon! No Mother of All Achievement"

 RICEintro.0032.desc:0 "This is a friendly reminder that RICE's newly added African pagan faiths, such as the [ROOT.Char.GetFaith.GetReligion.GetAdjective] [faith|E], [ROOT.Char.GetFaith.GetName], will #warning NOT#! count towards the #bold Mother of Us All#! achievement. Only vanilla's African pagan [faiths|E] count. Please note other mods may change this.\n\nThis message is not a critical warning but a friendly reminder to prevent future confusion."

 RICEintro.0032.a:0 "Ok"

