 setting_RICE_rus_emergence_already_desc:0 "In earlier start dates, $russian$ [culture|E] exists at game start, like in vanilla. Other mods' $east_slavic_group$ culture setup may override this."

 setting_RICE_rus_emergence_partial:0 "#high Partial#!"

 setting_RICE_rus_emergence_partial_desc:0 "In earlier start dates, $russian$ [culture|E] exists at game start in some [counties|E], but not all. Other mods' $east_slavic_group$ culture setup may override this. #warning @warning_icon! Setup is applied after game start!#!"

 setting_RICE_rus_emergence_override:0 "#high Override Other Mods#!"

 setting_RICE_rus_emergence_override_desc:0 "In earlier start dates, $russian$ [culture|E] can spawn via [decision|E]. This will try to override other mods' $east_slavic_group$ culture setup. #warning @warning_icon! Setup is applied after game start!#!"

