 setting_RICE_yarsani_emergence_unrestricted:0 "#high Unrestricted#!"

 setting_RICE_yarsani_emergence_unrestricted_desc:0 "The Yarsani [faith|E] can spawn anytime."

 rule_RICE_afro_roman_counties:0 "RICE $african_roman$ Presence"

 setting_RICE_afro_roman_counties_default:0 "Default"

 setting_RICE_afro_roman_counties_default_desc:0 "There are no $african_roman$ and $catholic_adj$ [counties|E] in North Africa in vanilla start dates. Other mods adding them override this."

 setting_RICE_afro_roman_counties_reduced:0 "#high Semi-Realistic#!"

 setting_RICE_afro_roman_counties_reduced_desc:0 "There are a few $african_roman$ and $catholic_adj$ [counties|E] in North Africa in vanilla start dates in areas where they prominently survived. Other mods adding them override this."

 setting_RICE_afro_roman_counties_extensive:0 "#high Exaggerated#!"

 setting_RICE_afro_roman_counties_extensive_desc:0 "There are many $african_roman$ and $catholic_adj$ [counties|E] in North Africa in vanilla start dates, much more than their real life presence. Other mods adding them override this."

 rule_RICE_easter_egg_characters:0 "RICE Easter Egg Characters"

 setting_RICE_easter_egg_characters_default:0 "Default"

 setting_RICE_easter_egg_characters_default_desc:0 "Easter Egg characters added by the RICE mod appear as normal at game start."

 setting_RICE_easter_egg_characters_removed:0 "#high Disabled#!"

 setting_RICE_easter_egg_characters_removed_desc:0 "Easter Egg characters added by the RICE mod do not appear in the game at game start."

 rule_RICE_warning_events:0 "RICE Warning Events"

 setting_RICE_warning_events_default:0 "On"

 setting_RICE_warning_events_default_desc:0 "Events warning you about improper load order, potential strange behavior in-game, and more will trigger at game start if detected (i.e. you won't get spammed with it otherwise)."

 setting_RICE_warning_events_removed:0 "#high Off#!"

 setting_RICE_warning_events_removed_desc:0 "Warning events will not happen at game start. #warning @warning_icon! This is strongly not advised unless you know what you're doing, as you may miss critical warnings about game breaking issues!#!"

 rule_RICE_adventurers:0 "RICE Historical Adventurers"

 setting_RICE_adventurers_default:0 "On"

 setting_RICE_adventurers_default_desc:0 "[adventurers|E] added by RICE in each start date appear as normal."

 setting_RICE_adventurers_disable_fictitious:0 "#high Disable Fictitious#!"

 setting_RICE_adventurers_disable_fictitious_desc:0 "[adventurers|E] added by RICE in each start date who are neither historical nor legendary, but semi-plausible, are disabled after the game loads in, except any controlled by players."

 setting_RICE_adventurers_disable_all:0 "#high Disable All#!"

 setting_RICE_adventurers_disable_all_desc:0 "[adventurers|E] added by RICE in each start date are all disabled after the game loads in, except any controlled by players."

