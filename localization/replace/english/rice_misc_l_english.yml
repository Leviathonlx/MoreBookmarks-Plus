 # [TRADUCIR] RICE_sri_lanka_support_monastery_frontier_monks_option: "#Bold Monjes Fronterizos#!"
 # [TRADUCIR] RICE_sri_lanka_support_monastery_gavu_pillars_option: "#Bold Pilares Gavu#!"
 # [TRADUCIR] RICE_sri_lanka_support_monastery_ordination_ceremonies_option: "#Bold Ceremonias de Ordenación#!"
 # [TRADUCIR] RICE_sri_lanka_support_monastery_pali_literature_option: "#Bold Literatura Pali#!"
 # [TRADUCIR] RICE_sri_lanka_support_monastery_parivena_schools_option: "#Bold Escuelas Pariveṇa#!"
 # [TRADUCIR] RICE_sri_lanka_support_monastery_ritual_deposits_option: "#Bold Depósitos Rituales#!"
 # [TRADUCIR] RICE_sri_lanka_support_monastery_senior_guides_option: "#Bold Guías Senior#!"
 # [TRADUCIR] RICE_sri_lanka_worship_local_deities_kataragama_option_desc: "El poderoso dios de la guerra que disipa a los enemigos"
 # [TRADUCIR] RICE_sri_lanka_worship_local_deities_natha_option_desc: "El dios en los cielos que desea salvar a todos"
 # [TRADUCIR] RICE_sri_lanka_worship_local_deities_pattini_option_desc: "La diosa sanadora que defiende a los débiles"
 # [TRADUCIR] RICE_sri_lanka_worship_local_deities_saman_option_desc: "El dios que habita en la montaña sagrada Sri Pada"
 # [TRADUCIR] RICE_sri_lanka_worship_local_deities_upulvan_option_desc: "El dios azul que protege $k_lanka$"
