 # [TRADUCIR] activity_RICE_yazidi_bull_sacrifice: "Sacrificio del Toro a Mitra"
 # [TRADUCIR] activity_RICE_yazidi_bull_sacrifice_context_tooltip: "#emphasis Contexto Histórico:#! Se ha teorizado que los antiguos hablantes de iranio occidental en el noroeste de Irán, incluyendo los antepasados de los kurdos, seguían una religión relacionada pero distinta del zoroastrismo, la cual formó un sustrato religioso para el yazidismo, yarsanismo y otras sectas en esta región. Para complicar aún más el asunto, es posible que el zoroastrismo ortodoxo y las antiguas creencias iranias del noroeste coexistieran. De todos modos, una diferencia clave que tenía esta religión con el zoroastrismo ortodoxo era que el sacrificio primordial de un toro no era una acción malvada del ser maligno Ahriman, sino un acto positivo de creación por parte del dios Mitra. Estas ideas pueden haber influido en el Culto Romano de Mitra y haber sido un precursor del sacrificio de toros central en la Fiesta de la Asamblea, una importante celebración yazidí. Como tal, esta actividad, aunque algo ficticia, se basa en posibles tendencias y creencias entre los iranios del noroeste como los kurdos en la antigüedad y el período medieval temprano."
 # [TRADUCIR] activity_RICE_yazidi_bull_sacrifice_host_desc: "\n$BULLET_WITH_TAB$Cantidad aleatoria de [prestige|E] entre [prestige_i|E] #V 25#! y [prestige_i|E] #V 200#!\n$BULLET_WITH_TAB$Cantidad aleatoria de [piety|E] entre [piety_i|E] #V 25#! y [piety_i|E] #V 200#!\n$BULLET_WITH_TAB$#V [GetPlayer.MakeScope.ScriptValue('RICE_yazidi_bull_sacrifice_chance')]%#! posibilidad (basada en tu [piety_level|E]) de recibir un [character_modifier|E] #P positivo#! que mejore una de tus [skills|E]"
 # [TRADUCIR] activity_RICE_yazidi_bull_sacrifice_province_desc: ""
 # [TRADUCIR] activity_RICE_yazidi_tawus_geran: "Tawûs Gêran"
 # [TRADUCIR] activity_RICE_yazidi_tawus_geran_context_tooltip: "#emphasis Contexto Histórico:#! Tawûs Gêran, el \"Paseo del Tawûs\", es una ceremonia yazidí que implica el desfile de un #italic sanjak#!, un estandarte de Melek Taus (el Ángel Pavo Real). #italic Qewals#!, que son artistas hereditarios de himnos religiosos yazidíes, llevarían así con ellos el #italic sanjak#! mientras viajan a diferentes pueblos yazidíes, siempre y cuando sea un tiempo de paz y cuando estén seguros de que los caminos son seguros. Es una oportunidad para que los yazidíes aprendan sobre sus creencias religiosas y demuestren su devoción religiosa. La descripción aquí se basa principalmente en un relato de primera mano del misionero inglés y erudito orientalista del siglo XIX, George Percy Badger."
 # [TRADUCIR] activity_RICE_yazidi_tawus_geran_host_desc: "\n$BULLET_WITH_TAB$Gana [piety_i] [piety|E]\n$BULLET_WITH_TAB$Gana [prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Aumenta [control_i|E] [control|E] del [county|E] donde se lleva a cabo esta [activity|E]\n$BULLET_WITH_TAB$Gana al menos #V [EmptyScope.ScriptValue('medium_lifestyle_xp')]#! [experience|E] en tu [lifestyle|E]"
 # [TRADUCIR] activity_RICE_yazidi_tawus_geran_province_desc: ""
 # [TRADUCIR] activity_RICE_yazidi_tiwaf: "Festival de Tiwaf"
 # [TRADUCIR] activity_RICE_yazidi_tiwaf_context_tooltip: "#emphasis Contexto Histórico:#! Cada pueblo yazidí tiene un santuario dedicado a algún ser sagrado, y anualmente, se celebran festivales de tiwaf en estos santuarios para conmemorarlos. Además de su función religiosa, estas ocasiones festivas son importantes como una forma para que estos pueblos reafirmen su identidad y fortalezcan los lazos sociales, y es común que lleguen invitados de otros pueblos. Incluso cuando los yazidíes se establecen en otras tierras, ya sea por fuerza o por migración voluntaria, a menudo continúan celebrando el tiwaf de su pueblo original, para mantener vivas sus tradiciones ancestrales."
 # [TRADUCIR] activity_RICE_yazidi_tiwaf_host_desc: "\n$BULLET_WITH_TAB$Gana [piety_i] [piety|E]\n$BULLET_WITH_TAB$Gana [prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Pierde [stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$El [county|E] donde se lleva a cabo esta [activity|E] gana el [GetModifier('RICE_yazidi_tiwaf_religious_modifier').GetNameWithTooltip] o el [county_modifier|E] [GetModifier('RICE_yazidi_tiwaf_community_modifier').GetNameWithTooltip] dependiendo de tu [intent|E]"
 # [TRADUCIR] activity_RICE_yazidi_tiwaf_province_desc: ""
 # [TRADUCIR] activity_RICE_yazidi_yarsani_jam: "Ceremonia Jam"
 # [TRADUCIR] activity_RICE_yazidi_yarsani_jam_context_tooltip: "#emphasis Contexto Histórico:#! La ceremonia Jam es un tipo de ceremonia religiosa practicada por los Yarsanis, un grupo etnoreligioso kurdo en Irak e Irán, así como por los Alevis, un grupo islámico heterodoxo en Turquía. Es una ceremonia altamente estructurada que tiene importantes funciones espirituales y sociales."
 # [TRADUCIR] activity_RICE_yazidi_yarsani_jam_host_desc: "\n$BULLET_WITH_TAB$Gana [piety_i] [piety|E]\n$BULLET_WITH_TAB$Gana [prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Pierde [stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$Gana un [character_modifier|E] que mejora la [opinion_i|E] [opinion|E] que tus [courtiers|E], [guests|E], [vassals|E] y [liege|E] tienen de ti"
 # [TRADUCIR] activity_RICE_yazidi_yarsani_jam_province_desc: ""
 # [TRADUCIR] struggle_RICE_sri_lanka_phase_accumulation_desc: "La [RICE_sri_lanka_struggle|E] acumula poder e influencia, gracias al apoyo de tanto las élites como los plebeyos, que a su vez acumulan buen mérito. Tal vez la [struggle_phase_sri_lanka_purification|E] resultó en un mayor respeto hacia los [RICE_sri_lanka_monasteries|E] por parte de los laicos, o, tal vez la contienda y el caos de la [struggle_phase_sri_lanka_degeneration|E] animaron a los laicos a apoyar a los [RICE_sri_lanka_monasteries|E].\n\nEl crecimiento de los [RICE_sri_lanka_monasteries|E], sin embargo, es una espada de doble filo. Los monásticos podrían volverse complacientes y perezosos, requiriendo una [struggle_phase_sri_lanka_purification|E] para librar a la [RICE_sri_lanka_sangha|E] de ideas heréticas e inmoralidad. Aún peor, la isla podría atraer a bribones codiciosos, tanto paganos extranjeros como gobernantes locales, que buscan saquear los [RICE_sri_lanka_monasteries|E] y destruir la [RICE_sri_lanka_sangha|E], y los monásticos están demasiado corruptos para inspirar al pueblo, llevando a la [struggle_phase_sri_lanka_degeneration|E]."
 # [TRADUCIR] struggle_RICE_sri_lanka_phase_degeneration_desc: "Las enseñanzas de Buda -y la [RICE_sri_lanka_sangha|E] misma- están en declive en Sri Lanka. Tal vez los intentos de purgar los [RICE_sri_lanka_monasteries|E] de monásticos inmorales e indisciplinados durante la [struggle_phase_sri_lanka_purification|E] fracasaron. O, tal vez, la riqueza y la influencia de los [RICE_sri_lanka_monasteries|E] durante la [struggle_phase_sri_lanka_accumulation|E] atrajeron incursiones militares de paganos extranjeros rapaces, o confiscaciones por parte de élites locales sin escrúpulos y codiciosas.\n\nSin embargo, como enseñó Buda, tanto las cosas buenas como las malas son impermanentes. Desde la oscuridad de la era degenerada, un futuro más brillante podría florecer en una [struggle_phase_sri_lanka_purification|E], ya que monásticos justos, eruditos y líderes limpian la [RICE_sri_lanka_sangha|E] de corrupción y malhechores. Alternativamente, las élites locales podrían reunir suficientes recursos para revivir los [RICE_sri_lanka_monasteries|E] en la [struggle_phase_sri_lanka_accumulation|E], trayendo una nueva era de prosperidad a la isla."
 # [TRADUCIR] struggle_RICE_sri_lanka_phase_purification_desc: "Ya sea por la creciente falta de disciplina y moral tras una [struggle_phase_sri_lanka_accumulation|E], o por amenazas externas y deterioro interno durante una [struggle_phase_sri_lanka_degeneration|E], la [RICE_sri_lanka_struggle|E] no es lo que solía ser. Este es un momento para restaurar la [RICE_sri_lanka_sangha|E] y eliminar los elementos heréticos e inmorales de sus antiguos [RICE_sri_lanka_monasteries|E].\n\nSi este proceso va bien, entonces [RICE_sri_lanka_s_sangha|E] prosperará en una [struggle_phase_sri_lanka_accumulation|E]. Si el proceso no tiene éxito, sin embargo, la Sangha probablemente se deteriorará aún más, desencadenando la [struggle_phase_sri_lanka_degeneration|E]."
