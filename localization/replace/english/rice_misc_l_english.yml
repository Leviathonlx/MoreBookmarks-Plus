 ### Entries
 rule_RICE_intro_event:0 "RICE Introduction Event"

 setting_RICE_intro_event_on:0 "On"

 setting_RICE_intro_event_on_desc:0 "An intro event will trigger once when you load into the game, telling you the version of RICE you're using and its newest features. It helps verify if the mod is installed properly and using the latest version."

 setting_RICE_intro_event_off:0 "Off"

 setting_RICE_intro_event_off_desc:0 "The intro event will be disabled."

 RICEintro.0000.t:0 "RICE 1.18.1 "Saint Patrick""

 RICEintro.0000.desc:0 "RICE 1.18.1 has been successfully installed. This event only triggers at the start of the game and can be disabled via game rule. Please note some features added in the latest update require a new game. Feel free to report bugs or provide feedback on Steam Workshop, PI forums, or my discord.\n\nRICE currently includes #V #Bold 43#!#! Flavor Packs covering various cultures, religions, and regions across the world. The newest flavor pack is #V #Bold Mayo: Heather and Yew#!#!.\n\nThese flavor packs focus on adding new flavor for [GetTitleByKey('c_mayo').GetNameNoTier] and the [RICE_culture.GetCollectiveNoun]."

 RICEintro.0000.a:0 "Sounds good!"

 RICEintro.0000.b:0 "I'd like an overview of the new additions for this update."

 RICEintro.0000.c:0 "Please disable this message for this save in the future."

 RICEintro.0000.c.tooltip:0 "#EMP Be aware that if you choose this option, you will NOT get this message to verify successful updates in the future for this save file!#!"

 RICEintro_intro_tooltip:0 "#EMP Peace is better than a successful war.\nA friend is better than ale.\nChange is better than destruction.\n\n– Excerpts from the Maxims of King Aldfrith of Northumbria, a medieval Irish Wisdom Text#!"

 RICEintro_TFE_warning_tooltip:0 "\n----------------------------------------\n\n#V #bold The Fallen Eagle#!#! has been detected as running. If this is true, please #bold make sure that TFE is #underline below#! RICE in your mod load order#! before you start a new game."

 RICEintro_ROA_warning_tooltip:0 "\n----------------------------------------\n\n#V #bold Rajas of Asia#!#! has been detected as running. If this is true, please #bold make sure that ROA is #underline below#! RICE in your mod load order#! before you start a new game."

 RICE_decision_pagan_requirement:0 "Follows a pagan [faith|E]"

 RICEintro.0010.t:0 "Flavor Pack Information"

 RICEintro.0010.desc:0 "Which Flavor Pack would you like to know more about?"

 RICEintro.0010.next:0 "See more"

 RICEintro.0010.done:0 "Never mind - I want to go to the game"

 RICEintro.0010.siwa:0 "Siwa: Oases of the Western Desert"

 RICEintro.0010.chios:0 "Chios: Isle of Mastic"

 RICEintro.info.a:0 "Sounds good, let's start playing the game, then"

 RICEintro.info.b:0 "Please take me back to the menu to see another Flavor Pack"

 RICEintro.0020.t:0 "Siwa: Oases of the Western Desert"

 RICEintro.0020.desc:0 "- Rebuild the Oracle of Amun and Temple of Hibis, and afterwards seek the Oracle’s guidance or worship the local deities of the Western Desert respectively\n- Visit the Fountain of the Sun in Siwa to relax"

 RICEintro.0021.t:0 "Chios: Isle of Mastic"

 RICEintro.0021.desc:0 "- Attend the Mostra of Thymiana (a carnival celebration held every spring)\n- Construct Mastic Villages in Chios via decision to improve the local economy or infrastructure\n- Erect a monument to Homer, whose hometown is said to be on Chios\n- Take advantage of the new Mastic Industry building in Chios"

 RICEintro.0010.siberia:0 "Siberia: People of the Reindeer"

 RICEintro.0022.t:0 "Siberia: People of the Reindeer"

 RICEintro.0022.desc:0 "- Turumic rulers can sacrifice Reindeer to gain greater understanding about themselves and the cosmos\n- Northern rulers can expand reindeer herds in the taiga\n- Siberian Culture Group: Evenk, Nivkh, Yakut, Yeneisian, and Yukaghir wanderers occasionally spawn in the courts of northern rulers to teach courtiers new survival skills"

 ### Game Rules
 rule_RICE_historical_context:0 "RICE Historical Context Tooltips"

 setting_RICE_historical_context_on:0 "On"

 setting_RICE_historical_context_on_desc:0 "There are occasional tooltips to provide context for various features of RICE. As I sometimes take artistic liberties with history for the sake of flavor and gameplay, this explains those situations as well."

 setting_RICE_historical_context_off:0 "#high Off#!"

 setting_RICE_historical_context_off_desc:0 "The occasional tooltips that provide historical context about some aspects of RICE will not appear. This is for immersion purists who find these tooltips immersion breaking."

 rule_RICE_music:0 "RICE Music"

 setting_RICE_music_off:0 "#high Off#!"

 setting_RICE_music_off_desc:0 "Music tracks added by the RICE mod will not play."

 setting_RICE_music_default:0 "Default"

 setting_RICE_music_default_desc:0 "Music tracks added by the RICE mod will only play if you are playing in the appropriate region, or playing as the right culture or religion."

 setting_RICE_music_unrestricted:0 "#high Unrestricted#!"

 setting_RICE_music_unrestricted_desc:0 "Music tracks added by the RICE mod will play regardless of your region, culture, or religion."

 setting_RICE_music_no_vocal_music:0 "#high No Vocal Music#!"

 setting_RICE_music_no_vocal_music_desc:0 "Music with singing will be disabled. Ambient, instrumental music will still play."

 rule_RICE_new_characters:0 "RICE Starting Flavor Events"

 setting_RICE_new_characters_off:0 "#high Off#!"

 setting_RICE_new_characters_off_desc:0 "RICE's game start flavor events will NOT trigger, #emp except#! for those with gameplay effects."

 setting_RICE_new_characters_default:0 "Default"

 setting_RICE_new_characters_default_desc:0 "RICE may trigger events at game start depending on location or character to provide info about the current situation."

 rule_RICE_event_frequency:0 "RICE Event Frequency"

 setting_RICE_event_frequency_default:0 "Default"

 setting_RICE_event_frequency_default_desc:0 "RICE's generic flavor Events trigger at the default rate."

 setting_RICE_event_frequency_high:0 "#high High#!"

 setting_RICE_event_frequency_high_desc:0 "RICE's generic flavor Events trigger somewhat more frequently. WARNING: Due to the way RNG works, you may still see many events at once, or no events for long stretches of time."

 setting_RICE_event_frequency_very_high:0 "#high Very High#!"

 setting_RICE_event_frequency_very_high_desc:0 "RICE's generic flavor Events trigger much more frequently. This may cause event spam! WARNING: Due to the way RNG works, you may still see many events at once, or no events for long stretches of time."

 setting_RICE_event_frequency_low:0 "#high Low#!"

 setting_RICE_event_frequency_low_desc:0 "RICE's generic flavor Events trigger somewhat less frequently. WARNING: Due to the way RNG works, you may still see many events at once, or no events for long stretches of time."

 setting_RICE_event_frequency_very_low:0 "#high Very Low#!"

 setting_RICE_event_frequency_very_low_desc:0 "RICE's generic flavor Events trigger much less frequently. You may rarely see events! WARNING: Due to the way RNG works, you may still see many events at once, or no events for long stretches of time."

 rule_RICE_courtier_spawn_frequency:0 "RICE Courtier Spawn Frequency"

 setting_RICE_courtier_spawn_frequency_default:0 "Default"

 setting_RICE_courtier_spawn_frequency_default_desc:0 "RICE's courtier spawn events trigger at the default rate."

 setting_RICE_courtier_spawn_frequency_high:0 "#high High#!"

 setting_RICE_courtier_spawn_frequency_high_desc:0 "RICE's courtier spawn events trigger somewhat more frequently."

 setting_RICE_courtier_spawn_frequency_very_high:0 "#high Very High#!"

 setting_RICE_courtier_spawn_frequency_very_high_desc:0 "RICE's courtier spawn events trigger much more frequently."

 setting_RICE_courtier_spawn_frequency_low:0 "#high Low#!"

 setting_RICE_courtier_spawn_frequency_low_desc:0 "RICE's courtier spawn events trigger somewhat less frequently."

 setting_RICE_courtier_spawn_frequency_very_low:0 "#high Very Low#!"

 setting_RICE_courtier_spawn_frequency_very_low_desc:0 "RICE's courtier spawn events trigger much less frequently."

 rule_RICE_tuareg_emergence:0 "RICE Tuareg Emergence"

 setting_RICE_tuareg_emergence_default:0 "Default"

 setting_RICE_tuareg_emergence_default_desc:0 "Tuareg [culture|E] can spawn via [decision|E] in the $culture_era_high_medieval$ [era|E] and later. Mods that add Tuaregs override RICE's implementation."

 setting_RICE_tuareg_emergence_already:0 "#high Exist at Game Start#!"

 setting_RICE_tuareg_emergence_already_desc:0 "Tuareg [culture|E] exists at game start. RICE overrides other mods' implementation of Tuaregs to place them on the map at game start as needed."

 setting_RICE_tuareg_emergence_early:0 "#high Earlier Emergence#!"

 setting_RICE_tuareg_emergence_early_desc:0 "Tuareg [culture|E] can spawn via [decision|E] as early as the $culture_era_early_medieval$ [era|E]. RICE overrides other mods' Tuaregs and removes them from the map at game start as needed."

 setting_RICE_tuareg_emergence_override:0 "#high Override Other Mods#!"

 setting_RICE_tuareg_emergence_override_desc:0 "The Tuareg [culture|E] can spawn via [decision|E] in the $culture_era_high_medieval$ [era|E] and later. RICE overrides other mods' Tuaregs and removes them from the map at game start as needed."
